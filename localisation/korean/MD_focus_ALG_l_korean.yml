 ALG_ersa_aircraft_manufacturer: "ERSA - 항공 수리 및 서비스 기업(Entreprise de Réparation et de Service Aéronautique)"
 ALG_mio_header_equipment_reliability: "장비 신뢰도"
 ALG_mio_header_production_efficiency: "생산 효율"
 ALG_mio_header_missile_technology: "미사일 기술"
 ALG_mio_header_artillery_systems: "야포 체계"
 ALG_mio_header_vehicle_reliability: "차량 신뢰도"
 ALG_mio_header_armor_upgrades: "장갑 개량"
 ALG_mio_header_helicopter_maintenance: "헬리콥터 정비"
 ALG_mio_header_naval_construction: "함선 건조"
 ALG_mio_header_surface_vessels: "수상함"
 ALG_mio_header_submarine_construction: "잠수함 건조"
 ALG_mio_header_aircraft_maintenance: "항공기 정비"
 ALG_dgi_trait_atgm_development: "대전차 유도 미사일(ATGM) 개발 계획"
 ALG_dgi_trait_atgm_development_desc: "외국 의존도를 줄이기 위한 자체 대전차 유도 미사일 개발입니다."
 ALG_dgi_trait_manpads_systems: "휴대용 방공 시스템(MANPADS) 체계"
 ALG_dgi_trait_manpads_systems_desc: "보병과 경부대를 위한 휴대용 대공 방어 체계입니다."
 ALG_dgi_trait_artillery_modernization: "야포 현대화"
 ALG_dgi_trait_artillery_modernization_desc: "기존 야포를 현대적인 사격 통제 및 표적 지정 체계로 개량합니다."
 ALG_dgi_trait_cnc_integration: "C3I 체계 통합"
 ALG_dgi_trait_cnc_integration_desc: "모든 플랫폼에 걸쳐 지휘, 통제, 통신, 정보 체계를 통합합니다."
 ALG_dgi_trait_mass_production: "대량 생산 구상"
 ALG_dgi_trait_mass_production_desc: "군 확장 요구를 충족하도록 생산 능력을 확대합니다."
 ALG_bcl_trait_desert_adaptation: "사막 적응 패키지"
 ALG_bcl_trait_desert_adaptation_desc: "냉각 성능 강화와 방진 여과 등 사막 작전을 위한 특수 개조입니다."
 ALG_bcl_trait_soviet_refurbishment: "소련제 장비 재생"
 ALG_bcl_trait_soviet_refurbishment_desc: "소련 시대 장갑차량을 낮은 비용으로 분해 정비하고 현대화하는 전문성입니다."
 ALG_bcl_trait_reactive_armor: "폭발반응장갑 통합"
 ALG_bcl_trait_reactive_armor_desc: "폭발반응장갑을 추가하여 성형작약탄에 대한 방어력을 향상시킵니다."
 ALG_bcl_trait_apc_modernization: "APC 현대화 계획"
 ALG_bcl_trait_apc_modernization_desc: "장갑 수송차와 보병 전투차에 대한 포괄적인 개량입니다."
 ALG_bcl_trait_production_efficiency: "생산 효율 개선"
 ALG_bcl_trait_production_efficiency_desc: "산출량을 늘리기 위해 조립 공정을 간소화합니다."
 ALG_snvi_trait_saharan_proven: "사하라에서 검증된 설계"
 ALG_snvi_trait_saharan_proven_desc: "최대한의 신뢰성을 위해 사막 환경에서 광범위하게 시험된 차량입니다."
 ALG_snvi_trait_mercedes_partnership: "메르세데스-벤츠 제휴"
 ALG_snvi_trait_mercedes_partnership_desc: "군용에 맞게 개조된 메르세데스-벤츠 상용 차량 플랫폼의 면허 생산입니다."
 ALG_snvi_trait_mass_production: "대량 생산 확장"
 ALG_snvi_trait_mass_production_desc: "증가한 군 수요를 충족하도록 생산 시설을 확장합니다."
 ALG_snvi_trait_cost_reduction: "비용 최적화"
 ALG_snvi_trait_cost_reduction_desc: "제조 효율 개선을 통해 단위당 비용을 줄입니다."
 ALG_enmib_trait_maintenance_expertise: "정비 및 분해 점검 전문성"
 ALG_enmib_trait_maintenance_expertise_desc: "헬리콥터 정비에 대한 전문 지식이 운용 수명과 신뢰성을 연장합니다."
 ALG_enmib_trait_licensed_assembly: "면허 조립 사업"
 ALG_enmib_trait_licensed_assembly_desc: "외국 헬리콥터 설계를 면허에 따라 낮은 비용으로 조립합니다."
 ALG_enmib_trait_production_expansion: "생산 능력 확장"
 ALG_enmib_trait_production_expansion_desc: "헬리콥터 생산 능력을 늘리기 위해 시설을 확장합니다."
 ALG_mek_trait_mediterranean_design: "지중해 함선 설계"
 ALG_mek_trait_mediterranean_design_desc: "지중해 작전에 최적화되어 속도와 효율이 개선된 함선입니다."
 ALG_mek_trait_patrol_vessel_expertise: "순찰정 전문성"
 ALG_mek_trait_patrol_vessel_expertise_desc: "탐지 능력이 강화된 고속 순찰정 건조를 전문으로 합니다."
 ALG_mek_trait_shipyard_expansion: "조선소 확장 계획"
 ALG_mek_trait_shipyard_expansion_desc: "건조 능력을 늘리기 위해 조선소 시설을 확장합니다."
 ALG_cnan_trait_frigate_construction: "호위함 건조 능력"
 ALG_cnan_trait_frigate_construction_desc: "현대식 호위함과 구축함을 건조하는 능력을 개발합니다."
 ALG_cnan_trait_anti_air_systems: "함상 대공 체계"
 ALG_cnan_trait_anti_air_systems_desc: "수상함에 현대적인 대공 체계를 통합합니다."
 ALG_cnan_trait_submarine_assembly: "잠수함 조립"
 ALG_cnan_trait_submarine_assembly_desc: "외국의 기술 지원을 받아 디젤-전기 잠수함을 면허 조립합니다."
 ALG_cnan_trait_foreign_assistance: "외국 기술 지원"
 ALG_cnan_trait_foreign_assistance_desc: "외국 조선소와의 제휴가 기술 발전을 가속합니다."
 ALG_cnan_trait_shipyard_modernization: "조선소 현대화"
 ALG_cnan_trait_shipyard_modernization_desc: "첨단 건조 장비로 조선소 시설을 현대화합니다."
 ALG_ersa_trait_mro_expertise: "MRO 전문성"
 ALG_ersa_trait_mro_expertise_desc: "정비, 수리, 분해 점검(MRO) 전문성이 항공기의 최대 신뢰성을 보장합니다."
 ALG_ersa_trait_licensed_assembly: "면허 항공기 조립"
 ALG_ersa_trait_licensed_assembly_desc: "외국 항공기 설계를 면허에 따라 낮은 비용으로 조립합니다."
 ALG_ersa_trait_transport_specialization: "수송기 특화"
 ALG_ersa_trait_transport_specialization_desc: "항속 거리와 효율이 늘어난 군용 수송기에 집중합니다."
 ALG_ersa_trait_production_expansion: "생산 확장 구상"
 ALG_ersa_trait_production_expansion_desc: "항공기 생산 능력을 늘리기 위해 시설을 확장합니다."
 ALG_resistance_power_struggle: "권력 투쟁"
 ALG_resistance_power_struggle_desc: "알제리 국민과 *르 푸부아르* 사이에서 조용한 전쟁이 벌어지고 있습니다. 양측은 피할 수 없는 충돌이 알제리의 미래를 결정할 때까지 지지를 공고히 하려 합니다."
 Resistance_support: "저항 세력 지원"
 Resistance_support_desc: "풀뿌리 운동, 시위, 지하 조직망에 자원을 투입하여 지배 엘리트에 맞선 국민의 저항을 강화합니다."
 ALG_increase_resistance_tt: "§Y국민이 강해지는 반면 군의 영향력은 줄어듭니다.§!"
 Le_Pouvoir_support: "*르 푸부아르* 지원"
 Le_Pouvoir_support_desc: "기득 엘리트를 직접 지원하여 군에 대한 그들의 통제를 강화하고 국민의 불만을 약화시킵니다."
 ALG_increase_pouvoir_tt: "§Y군이 통제권을 공고히 하는 반면 국민은 동력을 잃습니다.§!"
 Resistance_Final_Clash: "최후의 충돌"
 Resistance_Final_Clash_desc: "저항 세력과 *르 푸부아르* 사이의 갈등이 절정에 달했습니다. 앞으로 몇 달이 누가 진정으로 알제리를 지배할지 결정할 것입니다."
 alg_resistance.1.t: "국민의 승리!"
 alg_resistance.1.d: "국민의 목소리가 지배 엘리트에 맞서 일어섰습니다. 대규모 시위와 풀뿌리 조직이 정부를 굴복시켰습니다. 알제리는 민주 통치의 새로운 시대로 접어듭니다."
 alg_resistance.1.a: "국민이 말했다."
 alg_resistance.2.t: "르 푸부아르의 저항 분쇄"
 alg_resistance.2.d: "군의 지원을 받은 기득 엘리트가 저항을 성공적으로 진압했습니다. 현상은 유지되지만, 끓어오르는 불만이 향후 불안을 예고합니다."
 alg_resistance.2.a: "질서가 회복되었다."
 alg_resistance.3.t: "혼돈에 빠진 나라"
 alg_resistance.3.d: "저항 세력도 르 푸부아르도 우위를 확립하지 못했습니다. 권력 공백은 알제리를 혼돈에 빠뜨렸으며, 군부 실력자들과 각 파벌이 통제권을 두고 다투고 있습니다."
 alg_resistance.3.a: "나라가 붕괴 직전에 놓였다."
 alg_resistance.4.t: "알제리 위기 심화"
 alg_resistance.4.d: "취약한 군사 정권은 국가를 하나로 묶어 둘 수 없으며 알제리는 더 깊은 혼란으로 빠져들고 있습니다. 장교들은 넘길 나라가 아직 남아 있을 때 민간 정부에 나라를 돌려줄 수도 있고, 버티면서 무장 집단이 몰려오도록 내버려 둘 수도 있습니다."
 alg_resistance.4.a: "민간 정부에 권력을 넘긴다."
 ALG_african_union_tt: "알제리가 §Y아프리카 연합§! 내 유대를 강화하여 아프리카 회원국들과의 관계를 개선합니다."
 KBY_alg_modifier_desc: "카빌리아는 비교적 최근에 만들어진 국가로, 내정과 외교 모두 알제에 전적으로 종속되어 있지만 그럼에도 국내 및 대외 정책에서 큰 자치권을 지니고 있습니다."
 KBY_new_state: "베르베르인을 위한 땅"
 KBY_new_state_desc: "마침내 이 땅의 진정한 상속자인 베르베르인이 권력을 자신들의 손에 쥐게 될 것입니다."
 KBY_constitution: "카빌리아 헌법"
 KBY_constitution_desc: "우리는 국가 입법을 공식화해야 합니다. 이를 위해 독자적인 헌법을 채택할 것입니다."
 KBY_drs: "DRS와의 협력"
 KBY_fsb_desc: "안타깝게도 아직 우리에게는 독자적인 특수 기관을 창설할 여건이 없으므로, 알제리의 DRS와의 협력에 의존할 것입니다."
 KBY_mvd: "지역 내무부 예속"
 KBY_mvd_desc: "프랑스 지배 아래 있던 내무부의 지역 기관들을 우리 휘하에 두겠습니다."
 KBY_ter_defence: "지역 방위대"
 KBY_ter_defence_desc: "지역 민병대로 지역 방위대를 창설하겠습니다."
 KBY_contract_army: "계약제 군대 체제"
 KBY_contract_army_desc: "우리의 군대는 계약제에 따라 창설될 것입니다."
 KBY_defence_doctrine: "방어 교리"
 KBY_defence_doctrine_desc: "우리는 누구도 공격하지 않으며, 우리의 임무는 국경을 지키는 것입니다. 우리 군대는 방어 전술 교리를 채택할 것입니다."
 KBY_nat_guard: "카빌리아 국가방위대"
 KBY_nat_guard_desc: "알제리는 1980년대에 국가방위대를 보유한 적이 있습니다. 이 부대를 다시 창설하되, 이번에는 우리의 지휘 아래 두겠습니다."
 KBY_defence_prom: "군수 산업"
 KBY_defence_prom_desc: "우리 영토 내 군수 산업의 복구에 상당한 자금을 투입할 것입니다. 우리에게는 강한 군대가 필요합니다."
 KBY_rebuild_war_academy: "군사 학교"
 KBY_rebuild_war_academy_desc: "우리 전사들은 조국을 지키기 위해 최고의 훈련을 받아야 합니다. 그러므로 우리 영토에 군사 학교를 부활시킬 것입니다."
 KBY_no_corrupt_military: "군 내 부패 대폭 축소"
 KBY_no_corrupt_military_desc: "우리 군대는 아직 젊기 때문에 그 안의 부패를 제거하기가 훨씬 쉽습니다."
 KBY_nation_quest: "민족 문제"
 KBY_nation_quest_desc: "카빌리아는 알제리의 일부였고 앞으로도 그러할 것입니다. 이것이 민족 문제에 대한 우리의 답입니다."
 KBY_referendum: "카빌리아의 운명에 관한 국민투표"
 KBY_referendum_desc: "우리나라가 어느 길로 갈지 결정해야 하는 운명의 순간이 왔습니다. 공화국의 형태로 알제리의 완전한 일부가 될 것입니까, 아니면 연방 국가의 길을 택할 것입니까?"
 KBY_dinar: "국가 통화로서의 디나르"
 KBY_dinar_desc: "디나르가 우리의 국가 통화가 될 것입니다. 누구도 이를 의심하지 않았습니다."
 KBY_corruption: "부패와의 전쟁"
 KBY_corruption_desc: "우리나라는 아직 젊음에도 불구하고 이미 부패한 관리들이 나타났습니다. 이를 처리해야 합니다."
 KBY_isr_invest: "이스라엘 투자"
 KBY_isr_invest_desc: "이스라엘이 투자로 우리를 지원하고 있습니다."
 KBY_build_factories: "공장 건설"
 KBY_build_factories_desc: "나라에는 공장과 플랜트가 필요합니다. 우리는 국민에게 필요한 모든 것을 제공할 것입니다."
 KBY_social_invest: "사회 분야 투자"
 KBY_social_invest_desc: "우리 시민들은 최고 품질의 의료 시설을 이용할 수 있어야 하며, 모든 사회적 보장을 누려야 합니다."
 KBY_infrastructure: "기반시설 투자"
 KBY_infrastructure_desc: "도로는 우리 국가의 혈관입니다."
 KBY_fight_oligarch: "과두 재벌과의 전쟁"
 KBY_fight_oligarch_desc: "우리의 젊은 국가에서도 전쟁 중에 막대한 돈을 번 부패한 과두 재벌들이 이미 나타나기 시작했습니다. 이들을 처리합시다."
 KBY_it_invest: "IT 투자"
 KBY_it_invest_desc: "우리나라의 성공적인 발전을 위해 IT 기술에 투자하겠습니다."
 KBY_maloross_economy: "카빌리아 경제"
 KBY_maloross_economy_desc: "우리의 경제 조치가 경제 성장으로 이어졌습니다."
 KBY_union_state: "연방 국가"
 KBY_union_state_desc: "우리는 연방 국가의 길을 선택했습니다."
 KBY_union_group_army: "연합 군사 집단"
 KBY_union_group_army_desc: "우리 병사들은 연방 국가의 연합 군사 집단의 일원이 될 것입니다."
 KBY_union_group_economic: "연방 국가의 투자"
 KBY_union_group_economic_desc: "연방 국가 가입은 우리 경제에 긍정적인 영향을 미쳤습니다."
 KBY_union_health_social: "사회 및 의료 분야 협력"
 KBY_union_health_social_desc: "연방 국가 구성원들은 사회 및 의료 분야에서 적극적으로 협력합니다."
 KBY_republic_rf: "우리는 알제리의 일부입니다"
 KBY_republic_rf_desc: "우리는 알제리의 공화국이 되었으며, 이제 우리의 운명은 알제리와 연결되어 있습니다."
 KBY_alg_regions: "알제리 지역들과의 협력"
 KBY_alg_regions_desc: "우리는 알제리의 다른 지역들과 적극적으로 협력할 것입니다."
 KBY_fra_companies: "프랑스 기업과의 협력"
 KBY_fra_companies_desc: "프랑스 기업들이 우리의 주요 파트너가 될 것입니다."
 KBY_integrate_army: "알제리 육군에 통합"
 KBY_integrate_army_desc: "우리 군대를 알제리 육군의 표준에 맞추겠습니다."
 ALG_legacy_of_independence_war: "알제리 독립 전쟁의 유산"
 ALG_legacy_of_independence_war_desc: "프랑스 식민 지배에 맞선 투쟁은 강한 민족 정체성과 단결 의식을 벼려 냈습니다. 이 영속적인 유산은 우리의 정치력을 강화하고, 연구와 현대화를 가속하며, 해외에서의 알제리 영향력을 높입니다. 그러나 이념적 분열과 역사적 기억은 여전히 국내 여론과 대외 관계를 좌우합니다."
 ALG_new_nobility_idea: "새로운 귀족"
 ALG_new_nobility_idea_desc: "귀족의 특권을 복원하고 충성스러운 귀족층을 만듦으로써 군주정은 통치를 강화하고, 충성에는 영향력과 위신으로 보답합니다."
 ALG_state_islam_idea: "국가로서의 이슬람"
 ALG_state_islam_idea_desc: "군주정은 이슬람을 국가의 지도 원리로 공식화하여 울라마에게 힘을 실어 주고 샤리아를 통치에 내재화하지만, 그 대가로 과학의 진보를 치릅니다."
 ALG_andalus_crusade_idea: "알안달루스의 유산"
 ALG_andalus_crusade_idea_desc: "알안달루스를 되찾겠다는 꿈이 칼리파국의 대의를 부추기고, 전사들을 고무하며, 이베리아 반도로의 팽창을 정당화합니다."
 ALG_maghribi_identity_idea: "마그리브 정체성"
 ALG_maghribi_identity_idea_desc: "군주정은 공유된 문화와 단결에 뿌리를 둔 독자적인 마그리브 정체성을 장려하여 안정을 강화하고 외세의 영향을 멀리합니다."
 ALG_maghribi_identity_idea_two: "진정한 마그리브주의"
 ALG_maghribi_identity_idea_two_desc: "모로코에서 리비아에 이르기까지 마그레브는 하나의 운명 아래 결속합니다. 군주정은 이 비전을 구현하여 외세의 간섭을 줄이고 지역을 하나로 묶습니다."
 ALG_renewed_nobility_idea: "복원된 기사단"
 ALG_renewed_nobility_idea_desc: "왕국의 기사들이 충성스러운 군사·정치 엘리트로서 존중받으며 돌아옵니다. 그들의 새로워진 역할은 군주정의 장악력을 강화하는 동시에 지도력 비용을 낮춥니다."
 ALG_going_to_roots: "뿌리로의 회귀"
 ALG_going_to_roots_desc: "마그레브 왕조와 안달루스 왕조 모두 알제리 정체성의 토대를 놓았습니다. 이러한 전통을 받아들임으로써 과거와 현재를 국가의 단일한 지도 비전으로 통합할 것입니다."
 ALG_state_islam: "국교로서의 이슬람"
 ALG_state_islam_desc: "종교는 언제나 알제리 국민을 인도해 왔습니다. 이슬람을 군주정의 토대로 선포함으로써 우리의 정당성을 공고히 하고, 울라마의 지지를 얻으며, 신도들의 단결을 강화합니다."
 ALG_restore_knighthood: "기사단 복원"
 ALG_restore_knighthood_desc: "제국의 시대에는 전사와 귀족의 기사단이 우리의 땅과 신앙을 수호했습니다. 우리는 왕좌를 섬기고 군사적 충성심을 고취할 이러한 기사단을 복원할 것입니다."
 ALG_andalus_legacy: "알안달루스의 유산"
 ALG_andalus_legacy_desc: "우리의 안달루스 부흥은 왕좌만의 문제가 아닙니다. 수 세기 전 이베리아에서 쫓겨난 무슬림들의 잃어버린 자긍심을 다시 불러일으키는 일입니다. 우리는 영향력을 넓히고 유럽에 알안달루스가 잊히지 않았음을 일깨울 것입니다."
 ALG_our_old_realm: "우리의 옛 영토"
 ALG_our_old_realm_desc: "우리는 한때 알안달루스의 깃발 아래 이베리아 일부를 다스렸습니다. 이제 외교적 타진과 역사적 기억을 통해 옛 땅에 대한 권리를 주장하고 그 땅의 복귀를 위한 토대를 마련할 것입니다."
 ALG_renewed_nobility: "새로운 귀족"
 ALG_renewed_nobility_desc: "군주정을 섬길 새로운 귀족 가문을 만들어 내야 합니다. 옛 가문은 복권되고 새로운 엘리트는 격상되어, 알제리에 왕관에 충성하는 신하들을 제공할 것입니다."
 ALG_politic_outreach_iberia: "이베리아 정치 공작"
 ALG_politic_outreach_iberia_desc: "스페인과 포르투갈의 우호 세력을 지원함으로써 알제리의 영향력을 서쪽으로 확장할 수 있습니다. 이베리아 운동에 대한 우리의 후원은 우리의 영유권 주장을 강화하고 그들 국가를 약화시킬 것입니다."
 ALG_fate_of_spain: "스페인의 운명"
 ALG_fate_of_spain_desc: "스페인은 우리 선조들의 땅 위에 있습니다. 그 운명은 이제 합병, 수복, 또는 정복을 통해 알제리의 손에 결정될 수 있습니다."
 ALG_true_maghribism: "진정한 마그리브주의"
 ALG_true_maghribism_desc: "우리만의 비전을 선포할 때가 왔습니다. 마그레브 정체성, 이슬람의 단결, 군주주의적 자부심에 뿌리를 둔 이념입니다. 마그리브주의 교리는 북아프리카 전역에 새로운 질서를 불러일으킬 것입니다."
 ALG_glory_of_andalus_idea: "알안달루스의 영광"
 ALG_glory_of_andalus_idea_desc: "알안달루스의 유산에서 영감을 얻은 문화 부흥이 우리의 학자, 장인, 통치자들에게 활력을 불어넣습니다. 이는 자랑스러운 공동의 기억 아래 국가를 하나로 묶습니다."
 ALG_spain_algeria_union_tt: "알제리 군주정 아래 스페인과의 합병을 위한 결정을 잠금 해제합니다."
 ALG_trade_with_arabic_nations_tt: "알제리가 모든 아랍 국가와 개선된 무역 협정을 체결합니다."
 ALG_loas_influence_tt: "알제리가 외교적 노력과 우호 협정을 통해 아랍 연맹 회원국들 사이에서 영향력을 높입니다."
 ALG_isr_threat: "알제리, 이스라엘의 침략을 규탄"
 ALG_palestinian_aid_package_tt: "알제리가 팔레스타인에 원조를 제공하고 모든 중동 국가에서 영향력을 높입니다."
 ALG_african_union_reforms_tt: "알제리가 모든 OAU 회원국과 개선된 무역 협정을 체결했습니다."
 ALG_mutual_defense_idea: "상호 방위"
 ALG_mutual_defense_idea_desc: ""
 ALG_the_State: "알제리 국가"
 ALG_unlocks_focus_for_us: "§C이로 인해 받는 부정적 변동치를 제거할 수 있는 결정을 잠금 해제합니다!§!"
 ALG_activate_from_event: "§H이 중점들은 사건 또는 결정을 통해 활성화됩니다§!"
 ALG_our_society: "알제리 사회"
 ALG_our_society_desc: "알제리 사회는 끊임없이 변화하며 새로운 무언가로 진화하고 있습니다. 일정한 제약으로 인해 이 문제에서 정부의 역할은 대체로 제한적이지만, 개입이 필요했던 때가 있었고 앞으로도 정책을 바꾸기 위해 개입해야 할 때가 있을 것입니다."
 ALG_DRS: "DRS"
 ALG_DRS_desc: "DRS는 내외부의 위협으로부터 정부와 국가 정책을 보호하는 임무를 맡은 우리나라의 정보기관입니다."
 ALG_domestic_focus: "국내 중점"
 ALG_domestic_focus_desc: "DRS는 위험한 사상을 퍼뜨려 정부를 전복하려는 불순 세력과 같은 국내 위협으로부터 국가를 보호하는 데 집중해야 합니다."
 ALG_foreign_focus: "해외 중점"
 ALG_foreign_focus_desc: "DRS는 국경 밖의 위협을 우려해야 합니다. 자기 나라에 해를 끼치려는 사람은 결코 없을 것이기 때문입니다."
 ALG_disaster_relief: "재난 계획"
 ALG_disaster_relief_desc: "현재 우리에게는 재난 계획이 없으며, 이는 시민을 보호하고 구호할 준비가 되어 있지 않다는 뜻입니다."
 ALG_charity_based: "자선 주도 체계 수립"
 ALG_charity_based_desc: "재난이 닥칠 때 자선 단체가 국민을 보호해 줄 것이므로 지출을 상당히 줄일 수 있습니다."
 ALG_government_reliant: "정부 주도 체계 수립"
 ALG_government_reliant_desc: "재난이 닥쳤을 때 국민을 돕는 것은 정부의 일이며, 그것이 지출 증가를 의미하더라도 마찬가지입니다."
 ALG_migration_problems: "이주 문제"
 ALG_migration_problems_desc: "우리는 늘 이주민 유입 문제를 겪어 왔습니다. 그러나 그들의 모국에서 문제가 끝난 뒤 이들을 어떻게 해야 할지는 알지 못했습니다."
 ALG_open_door_policy: "문호 개방 정책"
 ALG_open_door_policy_desc: "문호 개방 정책을 택하면 유입되는 이주민들을 활용해 국가를 개선하고 발전시킬 수 있습니다."
 ALG_closed_borders: "국경 폐쇄"
 ALG_closed_borders_desc: "국경을 닫는 것만으로 국가로 유입되는 이주민을 완전히 없앨 수 있으며, 그렇게 우리의 문제도 닫을 수 있습니다."
 ALG_drug_problem: "마약 문제"
 ALG_drug_problem_desc: "때로는 의료용으로 마약이 필요하지만, 이것이 일부 개인이 제도를 악용하여 위험한 결과를 낳는 오락 목적으로 사용하는 것을 막지는 못합니다."
 ALG_tighten_punishments: "강경한 입장"
 ALG_tighten_punishments_desc: "변명이 무엇이든 의료 목적 외에 마약을 사용하는 모든 사람을 범죄자로 규정할 것입니다."
 ALG_relax_restrictions: "입장 완화"
 ALG_relax_restrictions_desc: "국민이 오락 목적으로 마약을 사용하고자 한다 해도 우리가 왜 신경 써야 합니까? 약간의 위험이 있더라도 그냥 원하는 대로 하게 내버려 두는 편이 나을 수도 있습니다."
 ALG_rising_nationalism: "민족주의의 부상"
 ALG_rising_nationalism_desc: "민족주의는 좋은 것이지만 지나치면 해가 될 수 있습니다. 국내의 민족주의는 소수 집단 사이에 문제와 충돌을 일으켰습니다."
 ALG_utilize_it: "민족주의 활용"
 ALG_utilize_it_desc: "우리는 민족주의를 우리에게 유리하게 활용할 것이며, 이를 통해 적은 알제리 국민이 전시에 가만히 앉아 있지 않으리라는 것을 알게 될 것입니다."
 ALG_combat_it: "맞서 싸우기"
 ALG_combat_it_desc: "국경 안에서 더 이상의 불안정을 감수할 수 없으므로 우리는 민족주의에 맞서 싸워야 합니다."
 ALG_charity_disasters: "자선 주도 계획"
 ALG_charity_disasters_desc: "우리의 재난 계획은 어려움에 처한 사람들을 돕기 위해 시민의 선의와 기부에 의존합니다."
 ALG_government_led_disasters: "정부 주도 계획"
 ALG_government_led_disasters_desc: "정부가 자선 단체 대신 자연재해를 입은 사람들에게 원조를 제공할 것이며, 자선 단체도 원한다면 자유롭게 도울 수 있습니다."
 ALG_drugs_illegalized: "마약 범죄화"
 ALG_drugs_illegalized_desc: "의료 목적을 제외한 어떤 목적으로든 마약을 사용하는 사람은 법의 처벌을 받게 됩니다."
 ALG_drugs_legalized: "마약 합법화"
 ALG_drugs_legalized_desc: "사람들이 마약을 무슨 목적으로 사용하든 우리는 크게 신경 쓰지 않습니다. 어차피 그들의 삶이니까요."
 ALG_drs_idea_1: "군사화된 경찰"
 ALG_drs_idea_1_desc: "경찰이 테러, 폭동, 불안에 대처할 수 있는 준군사 병력으로 재편되어 알제리 내부 안보에서 더 강력한 역할을 맡게 되었습니다."
 ALG_drs_idea_2: "고도로 군사화된 경찰"
 ALG_drs_idea_2_desc: "경찰은 이제 중무장한 준군사 조직으로 운영되며, 첨단 장비를 갖추고 군과 긴밀히 연계되어 민간 치안과 군사 통제의 경계가 흐려지고 있습니다."
 ALG_drs_idea_3: "통합된 군사화 경찰"
 ALG_drs_idea_3_desc: "우리 경찰 병력은 안보 기구에 완전히 통합되어 대테러, 국경 방어, 국내 감시에서 군과 나란히 활동합니다."
 ALG_riot_police_idea: "기동 경찰"
 ALG_riot_police_idea_desc: "시위, 집회, 사회 불안에 대처하도록 설계된 특수 경찰 부서입니다. 군중 통제 장비를 갖추고 체제 안정 유지에 강한 중점을 두고 활동합니다."
 ALG_algerian_special_forces: "알제리 특수 부대 창설"
 ALG_algerian_special_forces_desc: "알제리의 안보 위협에는 신속한 개입과 대테러가 가능한 정예 부대가 필요합니다. 특수 부대를 창설하면 내부 불안과 외부 위험 모두에 대한 방어가 강화될 것입니다."
 ALG_BRI: "BRI 확대"
 ALG_BRI_desc: "수색개입여단(BRI)은 인질 구출과 고위험 작전을 위해 훈련된 특수 경찰 부대입니다. 인원과 자원을 확대하면 도시 안보가 개선될 것입니다."
 ALG_al_saiqa: "알사이카 부대"
 ALG_al_saiqa_desc: "특수 준군사 폭동 진압 및 대반란 부대는 민간 불안 시기에 법과 질서를 유지하는 우리의 능력을 강화할 것입니다."
 ALG_al_hars_al_watani: "국가방위대"
 ALG_al_hars_al_watani_desc: "국가 보안 방위대는 취약 지역에 지역 치안을 제공하고, 군의 자원을 해방하며, 위기 상황에서 질서를 유지할 것입니다."
 ALG_haras_al_hudod: "국경 경비대"
 ALG_haras_al_hudod_desc: "국경을 순찰하는 특수 병력은 밀수를 억제하고, 침투를 막으며, 알제리의 국경 방어를 강화할 것입니다."
 ALG_central_armed_police: "중앙 무장 경찰"
 ALG_central_armed_police_desc: "무장 경찰을 중앙집권적 지휘 체계로 통합하면 대응 시간과 효율이 개선되어 조직적 위협에 더 강력히 대처할 수 있습니다."
 ALG_border_security_force: "국경 보안군"
 ALG_border_security_force_desc: "국경 감시와 차단을 전담하는 병력을 창설함으로써 알제리는 밀매 조직과 무장 침투를 단속할 것입니다."
 ALG_firqat_tadakhol_al_sariye: "신속 개입 부대"
 ALG_firqat_tadakhol_al_sariye_desc: "정예 신속 대응 부대는 알제리가 테러 조직과 새로 발생하는 위기를 확대되기 전에 신속히 타격할 수 있게 해 줄 것입니다."
 ALG_expanding_BRI: "BRI 역량 확대"
 ALG_expanding_BRI_desc: "더 많은 자금, 훈련, 첨단 장비가 있다면 BRI는 지역 최고 수준에 필적하는 강력한 대테러 및 인질 구출 부대로 발전할 수 있습니다."
 ALG_increase_police_funding: "경찰 예산 증액"
 ALG_increase_police_funding_desc: "경찰과 헌병대에 대한 투자를 늘리면 내부 안정이 강화되고, 공공 안전이 보강되며, 불안에 대한 알제리의 회복력이 향상될 것입니다."
 ALG_drs_expand: "DRS 확대"
 ALG_drs_expand_desc: "정보보안국(DRS)을 더욱 확대하여 정보 수집과 방첩 능력을 높일 수 있습니다."
 ALG_new_gendarmerie_equipment: "헌병대 신규 장비"
 ALG_new_gendarmerie_equipment_desc: "헌병대는 테러, 범죄, 내부 불안이라는 과제에 대응할 수 있도록 제대로 무장하고 장비를 갖춰야 합니다."
 ALG_mia_reform: "내무부 개혁"
 ALG_mia_reform_desc: "내무부 아래로 지휘를 집중하면 내부 안보 관리가 간소화되어 더 신속하고 조율된 대응이 보장됩니다."
 ALG_internal_troops: "내무군"
 ALG_internal_troops_desc: "국가 지휘 아래의 준군사 내무군은 반란 및 범죄 조직과의 싸움을 강화할 것입니다."
 ALG_increase_special_forces: "특수 부대 증강"
 ALG_increase_special_forces_desc: "우리의 정예 병력에는 현대전의 정교한 위협에 맞설 수 있도록 확대된 모집과 전문 훈련 프로그램이 필요합니다."
 ALG_cybercrime_directorate: "사이버 범죄국"
 ALG_cybercrime_directorate_desc: "사이버 범죄 대응국을 창설하면 알제리를 디지털 첩보, 사이버 공격, 적대적 허위 정보 캠페인으로부터 보호할 수 있습니다."
 ALG_riot_police: "기동 경찰 부대"
 ALG_riot_police_desc: "조직된 기동 경찰 부대는 군중을 통제하고 대규모 시위에 규율 있게 대응하여 불안 속에서도 안정을 보장할 것입니다."
 ALG_military_police_training: "헌병 훈련"
 ALG_military_police_training_desc: "헌병 훈련 프로그램은 규율을 높이고, 탈영을 줄이며, 불안정한 지역의 점령 관리를 개선할 것입니다."
 ALG_peoples_security: "인민 안보"
 ALG_peoples_security_desc: "'인민 안보' 교리는 민군 협력을 강화하고, 사기를 북돋우며, 지역 주민을 국방 노력에 통합할 것입니다."
 ALG_procurement_of_espionage_equipment: "첩보 장비 조달"
 ALG_procurement_of_espionage_equipment_desc: "첨단 감시 및 첩보 기술에 투자하면 내외부의 위협을 탐지하고 무력화하는 우리의 능력이 향상될 것입니다."
 ALG_occupation_management_strategies: "점령 관리 전략"
 ALG_occupation_management_strategies_desc: "점령 지역이나 불안정한 지역을 관리하는 새로운 전략은 저항을 최소화하고, 사상자를 줄이며, 국가 권위를 공고히 할 것입니다."
 ALG_french_weapons: "프랑스 무기 수입"
 ALG_french_weapons_desc: "프랑스제 소형 화기와 장비를 도입함으로써 알제리는 파리와의 유대를 강화하는 동시에 보병을 신속히 현대화할 수 있습니다."
 ALG_russian_guns: "러시아제 총기 수입"
 ALG_russian_guns_desc: "대량으로 인도되는 러시아제 소형 화기는 알제리에 견고하고 신뢰할 수 있는 무기를 제공하며, 모스크바와의 전통적인 방위 협력을 강화합니다."
 ALG_algerian_space_programme: "ASAL 설립"
 ALG_algerian_space_programme_desc: "알제리 우주청(ASAL)은 위성 개발에서 우주 연구의 국제 협력에 이르기까지 모든 국가 우주 활동을 조율할 것입니다."
 ALG_alsat_initiative: "알샛 구상"
 ALG_alsat_initiative_desc: "알샛 프로젝트는 알제리에 지구 관측과 통신을 위한 첫 위성을 제공하며, 우리의 우주 시대 진입을 알립니다."
 ALG_alsat2_series: "알샛-2 시리즈"
 ALG_alsat2_series_desc: "첨단 알샛-2 위성의 개발은 우리의 감시, 통신, 원격 탐사 능력을 높일 것입니다."
 ALG_finance_private_space_companies: "민간 우주 기업 자금 지원"
 ALG_finance_private_space_companies_desc: "알제리 민간 부문이 우주 산업에 참여하도록 장려하면 국내 첨단 기술 기반이 강화될 것입니다."
 ALG_regional_satnet: "지역 위성망"
 ALG_regional_satnet_desc: "우리의 위성을 지역 네트워크로 연결하여 민간과 군사 용도를 통합하는 동시에 알제리를 이웃 국가들과 이어 줄 것입니다."
 ALG_asal_lunar_project: "ASAL 달 탐사 프로젝트"
 ALG_asal_lunar_project_desc: "알제리 우주청은 달 탐사를 연구하고 로켓 기술을 발전시키기 위한 야심 찬 프로젝트에 착수할 것입니다."
 ALG_human_spaceflight: "유인 우주 비행 계획"
 ALG_human_spaceflight_desc: "우리의 우주 계획은 대담한 걸음을 내딛을 것입니다. 국제 동맹국들과 협력하여 알제리 최초의 유인 우주 비행을 계획합니다."
 ALG_orbital_defense_program: "궤도 방어 계획"
 ALG_orbital_defense_program_desc: "위성은 방어에도 활용될 수 있습니다. 궤도 방어 능력을 개발하면 알제리를 미래의 위협으로부터 지킬 수 있습니다."
 ALG_alsat_future: "알샛의 미래"
 ALG_alsat_future_desc: "알제리 우주 계획의 미래는 지속적인 투자, 민관 협력, 장기적인 과학 계획에 달려 있습니다."
 ALG_cyber_sat_integration: "사이버-위성 통합"
 ALG_cyber_sat_integration_desc: "사이버전 능력을 위성망과 결합하면 알제리는 현대 분쟁에서 강력한 비대칭 수단을 얻게 됩니다."
 ALG_idea_the_new_space_race: "새로운 우주 경쟁"
 ALG_idea_the_new_space_race_desc: "알제리는 세계적인 우주 경쟁에 뛰어들어 강대국들과 겨루며 기술적, 전략적 역량을 입증하고 있습니다."
 ALG_idea_cyberwarfare_2: "사이버-위성 통합"
 ALG_idea_cyberwarfare_2_desc: "알제리의 사이버 사령부가 이제 위성 체계와 통합되어 우수한 통신 보안과 공세 능력을 제공합니다."
 ALG_algeria_police_modifier: "알제리 내부 안보"
 ALG_algeria_police_modifier_desc: "알제리 정부는 소련의 일부였던 시절부터 반대 세력과 적 요원을 진압해 온 풍부한 경험을 갖고 있습니다."
 ALG_algeria_police_modifier_tt_intro: "§Y$ALG_algeria_police_modifier$§! 보정:"
 ALG_algeria_support_category: "알제리 보조 병력"
 ALG_stabilize_mali: "말리 안정화"
 ALG_stabilize_mali_desc: "말리의 불안정은 사헬 전체를 위협합니다. 대반란 작전과 외교 경험이 있는 알제리는 무력, 협상, 영향력 중 어떤 방법으로든 남쪽 이웃을 안정시키기 위해 나서야 합니다."
 ALG_back_tuareg_rebellion: "투아레그 반란 지원"
 ALG_back_tuareg_rebellion_desc: "바마코를 지원하는 대신, 말리 북부에서 자치를 추구하는 투아레그 반군에게 힘을 실어 줄 수 있습니다. 이는 말리 중앙 권력을 약화시키고 지역에서의 우리 영향력을 높일 것입니다."
 ALG_support_malian_army: "말리군 지원"
 ALG_support_malian_army_desc: "알제리는 그 대신 말리 정부를 직접 지원하여, 반군에 맞서는 그들의 군대를 강화할 정치적, 군사적 지원을 제공할 수 있습니다."
 ALG_promote_tuareg_dialogue: "투아레그 대화 촉진"
 ALG_promote_tuareg_dialogue_desc: "어느 한쪽을 택하는 대신, 알제리는 투아레그 반군과 말리 정부 간의 회담을 주최하여 사헬의 중재자이자 안정자로 자리매김할 수 있습니다."
 ALG_support_tuareg_politicians: "투아레그 정치인 지원"
 ALG_support_tuareg_politicians_desc: "전장을 넘어, 투아레그의 영향력은 정치적 경로로도 구축할 수 있습니다. 온건한 투아레그 지도자들을 지원하면 알제리는 말리 내부에 장기적인 동맹을 얻게 됩니다."
 ALG_aid_malian_army: "말리군 원조"
 ALG_aid_malian_army_desc: "알제리는 무기, 차량, 지휘 체계를 보내 반군과 싸우고 나라를 안정시키는 말리군의 능력을 강화할 수 있습니다."
 ALG_mali_stabilized: "말리 안정화"
 ALG_mali_stabilized_desc: "수년간의 혼란 끝에 알제리의 노력이 결실을 보았습니다. 말리 분쟁은 통제되고 투아레그 반란은 억제되었으며, 알제리는 사헬의 안정화 세력으로 우뚝 서 있습니다."
 ALG_tuareg_autonomy_victory: "투아레그 자치 승리"
 ALG_tuareg_autonomy_victory_desc: "투아레그 운동이 자치를 인정받는 데 성공했습니다. 알제리의 지원으로 투아레그는 이제 정치적 권력을 쥐게 되었으며, 말리는 사헬에서 새로운 권력 균형에 직면합니다."
 Algeria.237.t: "알제리의 말리 개입"
 Algeria.237.d: "알제리는 테러, 투아레그 분리주의, 지역 불안정에 대한 우려를 이유로 말리를 안정시키겠다는 의사를 선언했습니다. 알제가 병력, 원조, 정치적 압력을 남쪽으로 보내면서 말리의 권력 균형이 바뀌고 있습니다. 이것이 평화를 가져올지 더 깊은 분쟁을 가져올지는 지켜봐야 합니다."
 Algeria.237.a: "알제리가 사헬에서 주도권을 잡는다."
 Algeria.409.t: "투아레그 대화 구상"
 Algeria.409.d: "알제리가 말리와 사헬 전역의 투아레그 대표들과의 대화를 촉진하기 시작했습니다. 알제의 일부는 이를 평화와 안정으로 가는 길로 보지만, 다른 이들은 투아레그의 요구를 정당화하는 것이 분리주의를 부추길 수 있다고 우려합니다. 정부는 이 구상을 어디까지 지원할지 결정해야 합니다."
 Algeria.409.a: "문화 및 미디어 교류를 통해 접촉한다"
 Algeria.409.b: "투아레그 지도부를 은밀히 지원한다"
 ALG_TUA_REV_TT: "[TUA.GetFlag] §H투아레그 저항 세력§!이 알제리의 지원을 받아 말리 내에 §Y투아레그 자치구§!(또는 잠재적으로 §G새로운 투아레그 국가§!)가 창설됩니다."
 ALG_MAL_STABILIZED_TT: "[MAL.GetFlag] §H말리§!가 알제리의 지원으로 §G안정화§!되어 평화가 확보되고 분쟁 재발 위험이 줄어듭니다."
 ALG_algerian_intervention: "지역 개입 교리"
 ALG_algerian_intervention_desc: "알제리는 오래전부터 지역 중재 세력으로 행동해 왔습니다. 불안정이 우리 주변을 위협하는 가운데, 국익을 지키기 위해 지역 분쟁에 직접 개입할지 결정해야 합니다."
 ALG_intervene_in_sahrawi: "사하라 개입"
 ALG_intervene_in_sahrawi_desc: "모로코와 사하라 아랍 민주공화국 사이의 분쟁은 여전히 해결되지 않고 있습니다. 알제리는 국경을 지키고 마그레브에서의 영향력을 강화하기 위해 외교적으로, 또는 군사적으로 개입해야 합니다."
 ALG_supp_polisario: "폴리사리오 전선 지원"
 ALG_supp_polisario_desc: "사하라위의 독립 투쟁은 알제리 지역 정책의 중심입니다. 폴리사리오 전선에 무기와 지원을 공급함으로써 모로코를 약화시키고 서사하라에서 우리의 영향력이 커지도록 할 수 있습니다."
 ALG_a_new_stance: "모로코에 대한 새로운 입장"
 ALG_a_new_stance_desc: "알제리는 전통적으로 모로코의 서사하라 통제에 반대해 왔지만, 변화하는 정치적 바람은 실용주의를 요구합니다. 모로코와 보조를 맞추면 긴장이 완화되고, 새로운 경제적 기회가 열리며, 마그레브에서 우리의 영향력이 커질 수 있습니다."
 ALG_intervene_in_libya: "리비아 개입"
 ALG_intervene_in_libya_desc: "리비아의 혼란이 국경 너머로 번질 위험이 있습니다. 알제리는 이웃 나라의 불안정을 감당할 수 없습니다. 군사 행동이든, 외교든, 은밀한 영향력이든, 우리는 리비아에서 우리의 이익을 지켜야 합니다."
 ALG_assassinate_gaddafi: "카다피 암살"
 ALG_assassinate_gaddafi_desc: "무아마르 카다피의 통치는 지역 전체를 불안정하게 합니다. 그의 몰락을 기획함으로써 알제리는 리비아의 정권 교체를 앞당기고, 리비아가 내전에 빠지더라도 더 우호적인 정부가 들어서도록 할 수 있습니다."
 ALG_peacekeepers: "리비아에 평화유지군 파견"
 ALG_peacekeepers_desc: "리비아를 더 깊은 혼란에 빠뜨리는 대신, 알제리는 평화유지군으로 나설 수 있습니다. 상황을 안정시키기 위해 병력을 배치하면 책임 있는 지역 강국이라는 이미지를 강화하고 트리폴리에서 지속적인 영향력을 얻을 수 있습니다."
 ALG_pulse.1.t: "사하라 사막 확장"
 ALG_pulse.1.d: "최신 자료에 따르면 사하라는 꾸준한 확장을 이어 가고 있습니다. 방목지는 황무지로 변하고, 오아시스는 말라붙으며, 가젤과 바바리 사슴 같은 야생 동물은 밀렵으로 사라지고 있습니다. 과도한 방목, 무분별한 채굴, 밀렵 방치는 사막화를 악화시킬 뿐입니다."
 ALG_pulse.1.a: "우려스러운 징후"
 ALG_pulse.2.t: "사하라 사막 안정"
 ALG_pulse.2.d: "올해의 자료는 사하라의 전진이 둔화되고 사막화가 안정세를 유지하고 있음을 시사합니다. 그러나 과도한 방목, 밀렵, 지속 불가능한 토지 이용에 대한 조치가 없다면 균형은 곧 다시 기울 수 있습니다."
 ALG_pulse.2.a: "경계를 늦추지 말아야 한다"
 ALG_pulse.3.t: "사하라의 땅 되찾기"
 ALG_pulse.3.d: "최근 보고서에 따르면 일부 사막 가장자리에 식생이 서서히 돌아오고 있습니다. 밀렵 단속 순찰, 통제된 방목, 조림 노력이 땅을 치유하고 취약한 생태계의 균형을 회복하는 데 도움이 되는 것으로 보입니다."
 ALG_pulse.3.a: "고무적인 진전"
 ALG_reduce_yearly_good_desertification_5: "§Y오아시스화§! 확률: §R-5%§!\n"
 ALG_increase_yearly_good_desertification_5: "§Y오아시스화§! 확률: §G+5%§!\n"
 ALG_increase_yearly_bad_desertification_5: "§Y사막화§! 확률: §R+5%§!\n"
 ALG_decrease_yearly_bad_desertification_5: "§Y사막화§! 확률: §G-5%§!\n"
 ALG_reduce_yearly_neutral_desertification_5: "§Y안정화§! 확률: §R-5%§!\n"
 ALG_increase_yearly_neutral_desertification_5: "§Y안정화§! 확률: §G+5%§!\n"
 ALG_anti_poaching_raid_successful: "§G밀렵꾼 §Y[?poachers_killed]§!명을 성공적으로 제거했습니다!§!"
 ALG_anti_poaching_raid_normal: "§G밀렵꾼 §Y[?poachers_killed]§!명을 제거하는 데 성공했습니다!§!"
 ALG_anti_poaching_raid_failure: "§R순찰대원들이 사상자를 입었습니다§!"
 ALG_strengthen_ENTV_environmental_campaigns: "ENTV 환경 캠페인 강화"
 ALG_strengthen_ENTV_environmental_campaigns_desc: "국영 방송 서비스인 ENTV를 환경 문제에 대한 인식을 높이는 데 활용할 수 있습니다. 사막화, 물 보존, 야생 동물 보호에 대한 캠페인을 벌임으로써 시민들이 지속 가능한 미래를 지지하도록 장려할 수 있습니다."
 ALG_increase_cattle_grazing: "소 방목 확대"
 ALG_increase_cattle_grazing_desc: "가축 방목은 여전히 알제리 스텝과 고원 경제의 초석입니다. 소와 양의 방목을 확대하면 농촌 소득이 늘 수 있지만, 신중하게 관리하지 않으면 과도한 방목, 토양 황폐화, 사막화가 악화될 위험이 있습니다."
 ALG_optimize_pastoral_practices: "목축 관행 최적화"
 ALG_optimize_pastoral_practices_desc: "전통적인 방목 방식은 취약한 생태계에 엄청난 부담을 주어 왔습니다. 윤환 방목, 지속 가능한 물 사용, 개선된 수의 서비스를 도입함으로써 목축 관행을 현대화하고 스텝과 사하라 가장자리에 미치는 영향을 줄일 수 있습니다."
 ALG_expand_steppe_farming: "스텝 농업 확대"
 ALG_expand_steppe_farming_desc: "텔 아틀라스와 사하라 사이에 위치한 알제리의 스텝 지역은 곡물과 가축 생산에 필수적입니다. 관개와 간척 사업에 투자함으로써 이 지역의 경작을 늘릴 수 있지만, 환경 부담이 더 커질 위험이 있습니다."
 ALG_research_drought_resistant_crops: "내건성 작물 연구"
 ALG_research_drought_resistant_crops_desc: "기후 변화와 사막화는 알제리의 식량 안보를 위협합니다. 회복력 있는 곡물과 대추야자 품종 같은 내건성 작물 연구에 투자함으로써 악화되는 건조 환경으로부터 농업 부문을 지킬 수 있습니다."
 ALG_shrink_nature_reserves_sahara: "사하라 자연 보호 구역 축소"
 ALG_shrink_nature_reserves_sahara_desc: "일부에서는 사하라에서 자연 보호 구역으로 지정된 넓은 땅을 농업, 방목, 산업 사업을 위해 전용할 수 있다고 주장합니다. 이러한 보호 구역을 줄이면 개발이 가능해지지만, 막대한 환경적 대가를 치르게 됩니다."
 ALG_expand_nature_reserves_sahara: "사하라 자연 보호 구역 확대"
 ALG_expand_nature_reserves_sahara_desc: "사하라의 취약한 생태계를 보호하는 것은 생물 다양성과 장기적인 환경 균형에 필수적입니다. 보호 구역을 확대함으로써 멸종 위기종을 지키고 사막화에 기여하는 압력을 줄일 수 있습니다."
 ALG_drs: "DRS"
 ALG_drs_desc: "알제리의 정보보안국(DRS)은 피로 얼룩진 암흑의 10년 동안 만들어졌으며 막대한 권한으로 악명을 얻었습니다. 공식적으로는 테러와 외국의 침투에 맞선 방패 역할을 하지만, DRS는 정치에도 깊이 개입하여 시민의 자유를 희생하더라도 국가 권위와 안정의 유지를 보장합니다."
 ALG_decline_of_tourism: "관광업 쇠퇴"
 ALG_destroyed_agriculture: "파괴된 농업"
 ALG_tikjda_resort: "티크지다 스키 리조트"
 ALG_algerian_tourism: "알제리 관광업"
 ALG_natural_products_idea: "알제리 천연 제품"
 ALG_sonatrach: "소나트라크 확장"
 algeria_invest.1.t: "알제리 투자"
 algeria_invest.1.d: "알제리가 자국에 투자해 달라고 요청하고 있습니다. 알제리에 대한 투자를 통해 우리는 북아프리카와 지중해 연안에서 영향력을 강화할 수 있습니다."
 algeria_invest.1.a: "알겠다"
 algeria_invest.1.b: "아니요"
 algeria_invest.2.t: "그들의 동의"
 algeria_invest.2.d: "그들이 우리나라에 투자하기로 동의했습니다."
 algeria_invest.2.a: "좋다."
 algeria_invest.3.t: "그들의 거절"
 algeria_invest.3.d: "그들은 우리의 제안이 수익성이 없다고 주장하며 우리나라에 대한 투자를 거절했습니다."
 algeria_invest.3.a: "유감이다"
 algeria_invest.4.t: "미국의 알제리 투자"
 algeria_invest.4.d: "알제리가 우리 기업들에게 자국 경제에 투자할 기회를 제안합니다. 그 대가로 우리는 영향력을 얻고, 장기적으로 알제리와의 관계를 강화할 것입니다."
 algeria_invest.4.a: "누가 돈이라고 했나?"
 algeria_invest.4.b: "아니요"
 algeria_invest.5.t: "미국의 동의"
 algeria_invest.5.d: "미국 기업들이 이미 알제리 투자 사업을 계획하기 시작했습니다."
 algeria_invest.5.a: "기업과 민주주의의 승리."
 algeria_invest.6.t: "미국의 거절"
 algeria_invest.6.d: "미국이 우리 경제에 대한 투자를 거절했습니다. 그들은 우리 정치 체제의 투명성을 신뢰하지 않습니다."
 algeria_invest.6.a: "그렇다면 유럽에 연락하자."
 algeria_invest.7.t: "유럽의 알제리 투자"
 algeria_invest.7.d: "알제리가 자국 경제에 투자해 달라고 요청하고 있습니다. 그들에 따르면 유리한 투자 환경이 갖춰져 있으며, 우리의 참여는 지중해 전역의 유대를 강화할 것이라고 합니다."
 algeria_invest.7.a: "물론이지"
 algeria_invest.7.b: "돈이 없다."
 algeria_invest.8.t: "유럽의 동의"
 algeria_invest.8.d: "유럽 투자자들이 우리 경제를 지원하기로 동의했습니다. 여러 대기업이 이미 알제리에서 투자 사업을 시작할 의향을 보이고 있습니다."
 algeria_invest.8.a: "발전을 위한 좋은 소식."
 algeria_invest.9.t: "유럽의 거절"
 algeria_invest.9.d: "그들은 지금 투자 패키지를 배정할 가용 자금이 없다고 주장했습니다."
 algeria_invest.9.a: "유감이다"
 algeria_invest.10.t: "중국 투자자, 알제 지하철에 자금 지원"
 algeria_invest.10.d: "한 중국 투자자가 알제 지하철 확장을 위한 자금을 제안하고 있습니다. 그 자금으로 지하철을 건설할 수도 있고, 그들을 속여 횡령할 수도 있지만 후자는 중국과의 관계를 해칠 수 있습니다."
 algeria_invest.10.a: "알제에는 지하철이 필요하다!"
 algeria_invest.10.b: "알제리에는 돈이 필요하다!"
 algeria_invest.11.t: "우리를 기만한 알제리"
 algeria_invest.11.d: "알제리 사기꾼 일당이 지하철 사업을 조작하여 우리가 준비한 자금을 전부 가로챘습니다."
 algeria_invest.11.a: "이 놈들"
 algeria_invest.12.t: "레브랍의 투자"
 algeria_invest.12.d: "세비탈의 창업자 이사드 레브랍은 알제리에서 가장 영향력 있는 기업가 중 한 명입니다. 1990년대부터 그는 산업, 식품 생산, 해외 진출에 투자해 왔습니다. 그 덕분에 알제리는 공장과 일자리, 상징적인 사업들을 얻었습니다. 그는 여전히 이 나라 민간 부문 잠재력의 상징으로 남아 있습니다."
 algeria_invest.12.a: "감사합니다, 레브랍!"
 ALG_our_economy: "우리의 경제"
 ALG_our_economy_desc: "알제리 경제는 기로에 서 있습니다. 수년간의 불안정과 투자 부족 끝에, 정부는 내부에 집중할지 현대화와 성장을 위해 문호를 열지 결정해야 합니다."
 ALG_attract_foreign_inv: "외국인 투자 유치"
 ALG_attract_foreign_inv_desc: "시장을 외국인 투자자에게 개방함으로써 알제리는 달리 손이 닿지 않을 자본, 전문 지식, 기반시설 사업을 확보할 수 있습니다."
 ALG_france_inv: "프랑스 투자 모색"
 ALG_france_inv_desc: "프랑스는 여전히 알제리의 가장 가까운 경제 파트너 중 하나입니다. 에너지 및 산업 부문에서 프랑스의 참여를 되살리면, 그들의 영향력을 감당할 수 있다면 개발을 가속할 수 있습니다."
 ALG_chinese_inv: "중국 투자 구상"
 ALG_chinese_inv_desc: "중국은 흔히 기반시설과 자원 개발에 연계된 야심 찬 투자 패키지를 제시합니다. 베이징과의 협력은 우리 경제를 변모시킬 수 있지만, 더 깊은 의존이라는 대가를 치릅니다."
 ALG_usa_inv: "미국 투자 유치"
 ALG_usa_inv_desc: "미국은 첨단 기술과 상당한 재정적 후원을 제공할 수 있습니다. 워싱턴과의 협력은 알제리의 산업과 서비스업을 세계적인 경쟁자로 재편할 수 있습니다."
 ALG_russian_inv: "러시아 경제 협력"
 ALG_russian_inv_desc: "러시아는 오랫동안 에너지와 방위 분야의 전략적 동맹이었습니다. 협력을 더 넓은 경제 사업으로 확대하면 우리의 산업과 군사적 근간이 강화될 것입니다."
 ALG_iran_inv: "이란과의 파트너십"
 ALG_iran_inv_desc: "알제리와 이란은 비동맹과 외세 지배에 대한 저항이라는 역사를 공유합니다. 테헤란과의 관계를 확대하면 에너지 협력, 산업 사업, 지역 외교에서 새로운 길이 열릴 수 있지만 서방 파트너들 사이에서 우려를 낳을 수 있습니다."
 ALG_italia_inv: "이탈리아와의 유대 강화"
 ALG_italia_inv_desc: "이탈리아는 특히 우리 에너지 부문에서 ENI가 하는 역할을 통해 알제리의 가장 가까운 유럽 파트너 중 하나입니다. 로마와의 협력을 심화하면 기반시설에 대한 필수 투자를 확보하고, 지중해 무역을 활성화하며, 유럽의 핵심 에너지 공급국이라는 입지를 강화할 수 있습니다."
 ALG_algiers_metro_expansion: "알제 지하철 확장"
 ALG_algiers_metro_expansion_desc: "알제는 혼잡과 낡은 기반시설로 어려움을 겪고 있습니다. 지하철 체계를 확장하면 교통을 현대화할 뿐만 아니라 투자자와 시민 모두에게 진보의 신호를 줄 것입니다."
 ALG_cevital_group_expansion: "세비탈 그룹 확장"
 ALG_cevital_group_expansion_desc: "알제리 최대의 복합 기업 세비탈은 대륙 규모의 강자가 될 잠재력이 있습니다. 그 성장을 지원하면 일자리가 창출되고 산업 현대화가 가속될 것입니다."
 ALG_scientific_research_push: "과학 연구 장려"
 ALG_scientific_research_push_desc: "혁신은 장기 성장의 열쇠입니다. 과학 연구에 투자함으로써 알제리는 지식 기반 경제의 토대를 마련할 수 있습니다."
 ALG_expand_higher_education: "고등 교육 확대"
 ALG_expand_higher_education_desc: "대학과 기술 학교는 21세기의 요구를 충족하도록 확충되고 현대화되어야 합니다. 더 높은 교육을 받은 인구는 사회와 경제 모두를 강화할 것입니다."
 ALG_digitalize_education: "교육 디지털화"
 ALG_digitalize_education_desc: "디지털 플랫폼, 온라인 학습, IT 통합은 알제리의 교육 부문에 혁명을 일으켜 더 숙련되고 적응력 있는 노동력을 만들어 낼 것입니다."
 ALG_national_research_program: "국가 연구 프로그램 개시"
 ALG_national_research_program_desc: "대학, 산업, 정부를 하나로 모은 조율된 국가 연구 프로그램은 알제리가 세계 기술 발전의 속도를 따라가게 해 줄 것입니다."
 ALG_industry: "알제리 산업 확대"
 ALG_industry_desc: "알제리 산업은 다각화되고 현대화되어야 합니다. 산업 성장을 장려함으로써 탄화수소 의존도를 줄이고 더 균형 잡힌 경제를 만들 수 있습니다."
 ALG_constantine_hub: "콩스탕틴 산업 거점 개발"
 ALG_constantine_hub_desc: "콩스탕틴 시는 중요한 지역 중심지입니다. 이곳에 투자하면 알제 바깥으로 성장을 확산시키는 새로운 산업 거점이 만들어질 것입니다."
 ALG_tlemcen_agro_industry: "틀렘센 농공업 육성"
 ALG_tlemcen_agro_industry_desc: "틀렘센의 농업과 식품 가공을 강력한 농공업 부문으로 발전시켜 나라를 먹여 살리고 일자리를 창출할 수 있습니다."
 ALG_snvi_modernization: "SNVI 현대화"
 ALG_snvi_modernization_desc: "알제리의 국영 차량 제조업체인 SNVI는 세계 시장에서 경쟁할 수 있도록 현대화되어야 합니다. 생산 능력을 확대하면 우리의 수송 및 산업 기반이 강화될 것입니다."
 ALG_annaba_steel_complex: "안나바 제철 단지"
 ALG_annaba_steel_complex_desc: "안나바에는 알제리 최대의 철강 생산 시설이 있습니다. 이를 현대화하고 확장하면 미래의 기반시설과 방위 산업의 근간이 될 것입니다."
 ALG_arzew_refinery: "아르제우 정유소 확장"
 ALG_arzew_refinery_desc: "아르제우 정유소는 우리 에너지 수출의 중요한 고리입니다. 그 용량을 확대하면 외화 유입이 확보되고 소나트라크의 지배력이 강화될 것입니다."
 ALG_pipeline_modernization: "송유관 현대화"
 ALG_pipeline_modernization_desc: "현대적인 송유관 체계는 안전하고 효율적인 에너지 수출에 필수적입니다. 송유관을 개량하면 손실을 막고 국제적 신뢰도를 높일 것입니다."
 ALG_skikda_port_modernization: "스키크다 항구 현대화"
 ALG_skikda_port_modernization_desc: "스키크다 항구는 무역과 에너지 수출에 매우 중요합니다. 시설을 현대화하면 알제리가 경쟁력 있는 해상 거점으로 남을 것입니다."
 ALG_grant_foreign_energy_concessions: "외국 에너지 사업권 부여"
 ALG_grant_foreign_energy_concessions_desc: "외국 기업에 일부 사업권을 부여함으로써 알제리는 자본과 기술을 유치할 수 있지만, 에너지 독립성의 일부를 내줄 위험이 있습니다."
 ALG_hassi_messaoud_expansion: "하시 메사우드 유전 확장"
 ALG_hassi_messaoud_expansion_desc: "하시 메사우드 유전은 알제리 최대 규모입니다. 채굴 및 정제 능력을 확대하면 에너지 생산량이 크게 늘어날 것입니다."
 ALG_expand_sonatrach: "소나트라크 확장"
 ALG_expand_sonatrach_desc: "소나트라크는 알제리 경제의 심장입니다. 이 기업을 강화하면 석유 및 가스 생산에서 우리의 세계적 역할이 확보될 것입니다."
 ALG_protect_oil_gas_facilities: "석유 및 가스 시설 보호"
 ALG_protect_oil_gas_facilities_desc: "우리의 에너지 기반시설은 전쟁이나 불안 시기에 취약합니다. 석유 및 가스 시설 주변의 방어를 강화하는 것은 국가 안보에 매우 중요합니다."
 ALG_minister_of_agriculture_reforms: "농업 개혁 프로그램"
 ALG_minister_of_agriculture_reforms_desc: "수년간의 방치로 알제리 농업이 약화되었습니다. 농업부 주도의 새로운 개혁은 생산성을 회복하고 식량 수입 의존도를 줄일 것입니다."
 ALG_modernize_agricultural_sector: "농업 부문 현대화"
 ALG_modernize_agricultural_sector_desc: "수년간의 분쟁과 방치로 알제리의 농장은 낙후되고 비효율적입니다. 기계화, 관개 체계, 보조금이 농업 부문을 되살려 국민의 식량 안보를 보장할 것입니다."
 ALG_rural_development_program: "농촌 개발 프로그램"
 ALG_rural_development_program_desc: "알제리의 마을들은 오랫동안 투자 부족에 시달려 왔습니다. 농촌 기반시설, 전력, 일자리에 자금을 투입함으로써 도시와 농촌 사이의 불평등을 줄이고 국가 통합을 강화할 것입니다."
 ALG_promote_algerian_produce: "알제리 농산물 홍보"
 ALG_promote_algerian_produce_desc: "우리 땅은 다양한 작물과 천연 제품을 생산하지만 외국 수입품이 지역 시장을 지배하고 있습니다. 브랜드화, 보조금, 무역 인센티브를 통해 국내외에서 알제리 상품의 위상을 높일 것입니다."
 ALG_build_farm_to_market_roads: "농장-시장 연결 도로"
 ALG_build_farm_to_market_roads_desc: "농민들에게는 소비자와 수출 경로로의 더 나은 접근성이 필요합니다. 농촌 지역에서 도시 중심지와 튀니지 국경을 가로지르는 도로를 건설하면 농업 부문과 지역 유대가 모두 강화될 것입니다."
 ALG_new_agro_industrial_complexes: "신규 농공 단지"
 ALG_new_agro_industrial_complexes_desc: "알제리는 농업을 현대 산업과 연계해야 합니다. 농공 단지를 건설함으로써 부가가치 제품을 만들고, 일자리를 창출하며, 농촌 소득을 높일 수 있습니다."
 ALG_invest_tourism: "관광에 투자"
 ALG_invest_tourism_desc: "알제리에서 관광업은 전쟁의 세월이 방문객을 내쫓기 전까지 번성했습니다. 신중한 투자와 개선된 치안으로 이 중요한 부문을 복원하기 시작할 수 있습니다."
 ALG_restore_hotel_resorts: "호텔 및 리조트 복원"
 ALG_restore_hotel_resorts_desc: "알제리의 많은 리조트와 호텔이 폐허가 되었거나 방치되어 있습니다. 이를 개보수하면 외국인 방문객을 유치하고 국내 일자리를 제공하는 데 도움이 될 것입니다."
 ALG_blida_airbase_modernization: "블리다 공군 기지 현대화"
 ALG_blida_airbase_modernization_desc: "블리다 공군 기지는 민간 여행과 군 수송 모두에 중요한 시설입니다. 이를 현대화하면 알제리의 연결성이 개선되고 지역 상업이 활성화될 것입니다."
 ALG_algiers_oran_highway: "알제-오랑 고속도로"
 ALG_algiers_oran_highway_desc: "현대적인 고속도로로 알제와 오랑을 연결하면 수송 시간이 단축되고, 무역이 지원되며, 알제리의 경제적 근간이 강화될 것입니다."
 ALG_east_west_highway_project: "동서 고속도로 사업"
 ALG_east_west_highway_project_desc: "알제리를 가로지르는 동서 고속도로는 아프리카 최대 규모의 기반시설 사업 중 하나가 되어 우리 지역들을 연결하고 상업을 촉진할 것입니다."
 ALG_ski_resorts_of_tikjda: "티크지다 스키 리조트"
 ALG_ski_resorts_of_tikjda_desc: "카빌 산악 지대에는 개발되지 않은 잠재력을 지닌 리조트 티크지다가 있습니다. 시설을 현대화하고 겨울 관광을 장려하면 알제리의 경제 기반이 다각화될 것입니다."
 ALG_north_african_tourism_hub: "북아프리카 관광 거점"
 ALG_north_african_tourism_hub_desc: "해안, 문화유산, 자연 경관에 투자함으로써 알제리는 지중해 이웃 국가들과 맞서는 북아프리카 최고의 관광지가 될 수 있습니다."
 ALG_it_investments: "IT 투자"
 ALG_it_investments_desc: "IT 기술이 발전하는 속도를 고려하면 앞으로 이를 빼놓고는 살 수 없습니다. 이제 이 분야에 투자할 때가 되었습니다."
 ALG_infrastructure_investments: "기반시설 투자"
 ALG_infrastructure_investments_desc: "1990년대 이후 우리의 기반시설은 한심한 상태입니다. 이제 재건할 때가 되었습니다."
 ALG_science_idea: "알제리 과학 및 교육"
 ALG_fuel: "알제리 연료"
 ALG_dziri: "지리"
 ALG_dziri_desc: "알제리는 전통과 이슬람에서부터 아마지그 권리와 민주 개혁에 이르기까지 시급한 사회 문제를 다루어야 합니다. 우리가 선택하는 길이 국가의 모습을 결정할 것입니다."
 ALG_traditions_matter: "전통의 중요성"
 ALG_traditions_matter_desc: "알제리 국민은 신앙, 가족, 민족 정체성을 굳게 지킵니다. 정당성을 유지하려면 우리 정부는 이러한 전통을 존중해야 합니다."
 ALG_restrict_women_roles: "가족법 유지"
 ALG_restrict_women_roles_desc: "보수 지도자들은 여성의 역할이 가족 중심으로 남아야 한다고 주장합니다. 가족법을 개혁하면 종교 당국과 대중의 분노를 살 위험이 있습니다."
 ALG_expand_berber_rights: "아마지그 권리 인정"
 ALG_expand_berber_rights_desc: "베르베르 정체성 운동은 문화적, 언어적 완전한 인정을 요구합니다. 아마지그 권리를 인정하면 긴장이 완화되겠지만 강경파를 소외시킬 수 있습니다."
 ALG_censor_internet: "인터넷 검열"
 ALG_censor_internet_desc: "소셜 미디어와 온라인 활동이 시위를 부추겼습니다. 온라인 자유를 제한하면 국가 통제를 회복할 수 있지만 국제적 이미지가 훼손됩니다."
 ALG_open_civil_society: "시민 사회 개방"
 ALG_open_civil_society_desc: "민주 세력은 자유로운 시민 사회, NGO, 히라크 단체를 요구합니다. 이러한 공간을 열면 정당성은 강화되지만 정치적 분열의 위험이 있습니다."
 ALG_integration_policy: "통합 정책"
 ALG_integration_policy_desc: "사하라 이남 이주민과 귀환 디아스포라는 어려움에 직면해 있습니다. 체계적인 통합 정책은 사회적 긴장을 줄이고 결속을 증진할 수 있습니다."
 ALG_marriage_subsidies: "결혼 보조금"
 ALG_marriage_subsidies_desc: "청년들이 결혼하고 가정을 꾸리는 데 어려움을 겪는 만큼, 주택과 결혼식에 대한 보조금은 사회를 안정시키고 가정 형성을 장려할 것입니다."
 ALG_constitutionalize_rights: "권리의 헌법화"
 ALG_constitutionalize_rights_desc: "헌법 개혁을 통해 시민의 자유, 여성의 권리, 아마지그 인정을 확고히 할 수 있습니다. 이는 영구적인 사회 변화를 알리는 신호가 될 것입니다."
 ALG_berber_right: "아마지그 인정"
 ALG_berber_right_desc: "아마지그 정체성이 공식적으로 인정되어 베르베르인이 다수인 지역의 안정이 높아졌습니다."
 Algeria.238.t: "말리 안정화"
 Algeria.238.d: "말리에서 계속되는 분쟁이 사헬 지역 전체를 불안정하게 할 위험이 있습니다. 투아레그 분리주의자들과 지하디스트 집단이 우리의 남쪽 국경에 안보 위기를 만들어 냈습니다. 알제리는 불안정이 확산되는 동안 수수방관할 수 없습니다. 질서를 회복하기 위해 말리 정부를 지원할지, 아니면 지속적인 합의를 기대하며 투아레그 세력과의 협상을 추진할지 결정해야 합니다."
 Algeria.238.a: "말리 정부를 지원한다"
 Algeria.238.b: "투아레그 세력을 지원한다"
 ALG_us_invest_tt: "알제리에 대한 미국 투자 모색"
 ALG_fra_invest_tt: "알제리에 대한 프랑스 투자 모색"
 ALG_eng_invest_tt: "알제리에 대한 영국 투자 모색"
 ALG_chi_invest_tt: "알제리에 대한 중국 투자 모색"
 ALG_rus_invest_tt: "알제리에 대한 러시아 투자 모색"
 ALG_open_to_west: "서방에 문호 개방"
 ALG_open_to_west_desc: "알제리는 오랫동안 중립을 추구해 왔지만 시대가 변하고 있습니다. 서방 세계와 더 긴밀히 보조를 맞추면 안정, 안보, 투자 기회를 얻을 수 있습니다."
 ALG_nato_partnership: "나토 파트너십"
 ALG_nato_partnership_desc: "우리는 나토와의 체계적인 협력을 모색할 것입니다. 이 파트너십은 알제리의 국제적 위상을 강화하고 군대 현대화에 도움이 될 것입니다."
 ALG_energy_partnership_eu: "EU와의 에너지 파트너십"
 ALG_energy_partnership_eu_desc: "알제리의 방대한 에너지 매장량은 유럽에서 수요가 매우 높습니다. 프랑스 및 영국과 에너지 파트너십을 맺으면 수익성 높은 계약과 장기 투자를 확보할 수 있습니다."
 ALG_strengthen_eu_trade: "EU 무역 관계 강화"
 ALG_strengthen_eu_trade_desc: "유럽은 여전히 우리의 최대 무역 상대입니다. 이러한 경제적 유대를 강화하면 수출 시장이 안정되고 알제리가 세계 상업에 더 깊이 통합될 것입니다."
 ALG_expand_us_partnership: "미국과의 파트너십 확대"
 ALG_expand_us_partnership_desc: "미국은 북아프리카의 안정을 추구합니다. 워싱턴과의 경제 및 안보 협력을 확대하면 알제리는 투자를 유치하고 강력한 동맹을 얻을 수 있습니다."
 ALG_become_nato_ally: "나토 동맹국 되기"
 ALG_become_nato_ally_desc: "나토 정회원 가입은 이를 수 있지만, 알제리는 신뢰받는 동맹국 지위를 얻을 수 있습니다. 이는 우리에게 군사 전문 지식, 합동 훈련, 외교적 영향력에 대한 접근을 제공할 것입니다."
 ALG_exchange_research_with_nato: "나토와 연구 교류"
 ALG_exchange_research_with_nato_desc: "나토 동맹국들과의 과학 협력으로 알제리는 공동 연구, 군사 기술 공유, 교육 및 연구 기관의 현대화로부터 혜택을 얻을 수 있습니다."
 ALG_get_nato_military_exp: "나토 군사 전문 지식 획득"
 ALG_get_nato_military_exp_desc: "나토의 광범위한 군사 훈련과 교리는 귀중한 전문 지식을 제공합니다. 알제리군은 연합 훈련과 전략적 지도를 통해 현대화될 것입니다."
 ALG_counterterrorism_coordination: "대테러 공조"
 ALG_counterterrorism_coordination_desc: "테러는 북아프리카에서 여전히 주요 위협입니다. 나토의 정보 및 대테러 부대와 공조함으로써 알제리는 국내 안보와 지역 안정을 강화할 수 있습니다."
 ALG_get_investements_from_nato: "나토 투자 유치"
 ALG_get_investements_from_nato_desc: "우리의 나토 연계는 동맹 회원국들의 경제적 지원과 기반시설 사업을 끌어들여 알제리 경제에 장기적인 이익을 보장할 것입니다."
 ALG_strengthen_democratic_norms: "민주적 규범 강화"
 ALG_strengthen_democratic_norms_desc: "서방 세계와 완전히 통합되려면 알제리는 민주 제도를 강화해야 합니다. 여기에는 시민의 자유 보호, 다원주의 지지, 정치 개혁 장려가 포함됩니다."
 ALG_seek_greater_influence_in_wto: "WTO에서 더 큰 영향력 모색"
 ALG_seek_greater_influence_in_wto_desc: "알제리가 발전함에 따라 세계무역기구 내 우리의 역할을 확대하여 세계 경제 협상에서 우리의 목소리가 반영되도록 해야 합니다."
 ALG_seek_security_council_seat: "UN 안전보장이사회 의석 모색"
 ALG_seek_security_council_seat_desc: "알제리의 외교 역사와 평화유지 실적은 UN 안전보장이사회 상임 의석을 요구할 강력한 근거가 됩니다. 이 야망을 밀어붙여야 합니다."
 ALG_join_nato: "나토 가입"
 ALG_join_nato_desc: "수십 년간의 중립과 신중한 균형 외교 끝에 알제리는 이제 역사적인 걸음을 내딛을 준비를 하고 있습니다. 바로 나토 정회원 가입입니다. 이 결정은 서방 강국들 사이에서 우리의 입지를 굳히고 외교 정책을 재편할 것입니다."
 ALG_global_companies: "글로벌 기업 유치"
 ALG_global_companies_desc: "시장을 외국인 투자자에게 개방함으로써 알제리는 글로벌 기업들이 우리 경제에 거점을 두도록 유치할 수 있습니다. 이는 산업 성장, 기술 이전, 국제적 위신을 높일 것입니다."
 ALG_huawei: "화웨이 통신"
 ALG_huawei_desc: "화웨이가 알제리에 첨단 통신 기반시설을 구축하겠다고 제안하여, 우리에게 현대적인 디지털 근간을 제공하고 정보화 시대에서의 우리 입지를 확보해 줄 것입니다."
 ALG_hyundai: "현대 산업 확장"
 ALG_hyundai_desc: "현대가 알제리의 차량 및 산업 부문에 투자하는 데 관심을 표명했습니다. 그들의 공장을 환영함으로써 고용과 기술 발전을 촉진할 수 있습니다."
 ALG_weapons_expert: "외국 무기 전문 지식"
 ALG_weapons_expert_desc: "외국 방산 기업과의 협력을 통해 알제리는 지원 화기와 전술 체계에 대한 새로운 전문 지식을 얻어 지상군을 강화할 수 있습니다."
 ALG_airburst_weapons: "공중 폭발 무기 개발"
 ALG_airburst_weapons_desc: "공중 폭발 기술은 보병이 엄폐물 뒤나 요새화된 진지에 있는 적을 타격할 수 있게 합니다. 이 최첨단 체계에 투자하면 전장에서의 효율이 크게 높아질 것입니다."
 ALG_vehicle_industry: "차량 산업 확대"
 ALG_vehicle_industry_desc: "세계적인 자동차 제조사 및 산업 기업과 제휴함으로써 알제리는 방위와 경제를 모두 끌어올릴 강력한 군용 및 민수 차량 산업을 구축할 수 있습니다."
 ALG_advanced_ultility_vehicle: "첨단 다목적 차량"
 ALG_advanced_ultility_vehicle_desc: "우리의 자동차 부문은 첨단 개발 단계로 나아가야 합니다. 현대적이고 신뢰할 수 있는 다목적 차량을 생산하면 병참과 수송 효율이 강화될 것입니다."
 ALG_sat_tech: "위성 기술 협력"
 ALG_sat_tech_desc: "글로벌 기업과의 제휴를 통해 알제리는 첨단 위성 기술을 개발하여 감시, 통신, 위치 확인 체계를 개선할 수 있습니다."
 ALG_advanced_radar: "첨단 레이더 체계"
 ALG_advanced_radar_desc: "현대적인 레이더와 탐지 기술은 알제리에 더 큰 방어 능력을 부여하고 선진 지역 안보 체제에 통합될 수 있게 해 줄 것입니다."
 ALG_microsoft: "마이크로소프트 디지털 기반시설"
 ALG_microsoft_desc: "마이크로소프트와 제휴함으로써 알제리는 IT 및 소프트웨어 부문을 현대화하고, 사이버 보안, 디지털 행정, 기술 주도 성장을 강화할 수 있습니다."
 ALG_Lenovo: "레노버 기술 투자"
 ALG_Lenovo_desc: "레노버는 알제리에서의 입지를 확대하는 데 관심이 있습니다. 이들과 협력하면 컴퓨터 하드웨어 산업이 강화되고 기술 혁신이 뒷받침될 것입니다."
 ALG_Danone: "다논 식품 산업 확장"
 ALG_Danone_desc: "알제리 식품 부문에 대한 다논의 투자를 환영하면 영양, 식품 생산 기준, 국제 무역 관계가 향상될 것입니다."
 ALG_toyota: "도요타 산업 제휴"
 ALG_toyota_desc: "도요타를 초청해 산업 및 자동차 시설을 설립하게 함으로써 알제리는 차량 생산을 강화하고, 일자리를 창출하며, 자동차 부문의 기술 발전을 촉진할 수 있습니다."
 ALG_align_with_south_africa: "남아프리카 공화국과 보조"
 ALG_align_with_south_africa_desc: "남아프리카 공화국은 아프리카의 정치 및 경제 문제에서 주도적인 역할을 합니다. 파트너십을 강화함으로써 대륙 전역의 무역, 외교, 안보 정책을 조율할 수 있습니다."
 ALG_open_to_east: "동방에 문호 개방"
 ALG_open_to_east_desc: "동방으로 눈을 돌리면 파트너십이 다변화되고, 서방에 대한 의존이 줄며, 러시아, 중국 등 떠오르는 강국의 시장에서 기회가 열릴 것입니다."
 ALG_expand_trade_with_russia: "러시아와의 무역 확대"
 ALG_expand_trade_with_russia_desc: "러시아는 알제리에 에너지, 무기, 산업 협력에서 새로운 기회를 제공합니다. 무역 유대를 강화하면 전략적 관계가 깊어질 것입니다."
 ALG_expand_trade_with_china: "중국과의 무역 확대"
 ALG_expand_trade_with_china_desc: "중국은 아프리카에 투자하기를 열망하며 알제리에 유익한 무역 협정을 제안하고 있습니다. 이 협력은 우리에게 기반시설과 산업 발전을 제공할 수 있습니다."
 ALG_mediterranean_corridor_initiative: "지중해 회랑 구상"
 ALG_mediterranean_corridor_initiative_desc: "우리 경제를 지중해 및 동방 시장과 더 긴밀히 연결함으로써 알제리는 무역과 기반시설 사업의 핵심 회랑으로 자리매김할 수 있습니다."
 ALG_Investments_From_East: "동방의 투자"
 ALG_Investments_From_East_desc: "동방의 투자자들을 유치하면 우리 경제가 강화되고, 새로운 산업이 생기며, 알제리가 다변화된 자본 공급원의 혜택을 누릴 수 있습니다."
 ALG_eastern_alignment: "동방 연계"
 ALG_eastern_alignment_desc: "러시아, 중국 및 그 동맹국들과의 더 강한 연계는 알제리에 안보, 무역, 기술 분야의 새로운 파트너를 제공하는 동시에 서방의 영향력을 줄여 줄 것입니다."
 ALG_china_civ: "중국 민수 투자"
 ALG_china_civ_desc: "중국 기업들이 알제리 민수 산업으로 진출할 준비가 되어 있습니다. 이 사업들은 일자리를 창출하고 현대화를 가속할 것입니다."
 ALG_china_civ2: "추가 중국 민수 사업"
 ALG_china_civ2_desc: "앞선 사업의 성공 이후 중국은 알제리의 민수 산업 기반을 한층 더 확대하기 위한 추가 투자를 제안하고 있습니다."
 ALG_chinese_armor_deal: "중국 장갑 차량 거래"
 ALG_chinese_armor_deal_desc: "중국이 알제리에 장갑차량과 기술 패키지를 판매하겠다고 제안했습니다. 이 거래는 우리 육군을 개선하고 방위 유대를 심화시킬 것입니다."
 ALG_joint_military_exercise_with_rus: "러시아와의 합동 군사 훈련"
 ALG_joint_military_exercise_with_rus_desc: "러시아와 합동 훈련을 실시함으로써 알제리는 군사 공조를 개선하고 러시아의 전투 경험에서 배울 것입니다."
 ALG_russia_inf_tech: "러시아 보병 기술"
 ALG_russia_inf_tech_desc: "소형 화기와 보병 전술에 관한 러시아의 전문 지식은 알제리의 필요에 맞게 조정되어 우리 병사들에게 더 나은 장비와 훈련을 제공할 수 있습니다."
 ALG_russia_experience: "모스크바와의 방위 협력"
 ALG_russia_experience_desc: "러시아와의 군사 협력을 심화하면 경험 많은 고문단과 훈련 프로그램이 알제리에 들어올 것입니다. 우리 군대는 더 강하고 더 준비된 모습으로 거듭날 것입니다."
 ALG_idea_parliamentary_republic: "마즐리스 알와타니 알샤아비"
 ALG_idea_presidential_republic: "대통령제"
 ALG_idea_semi_presidential_republic: "알주므호리야 알디무크라티야 알샤아비야"
 ALG_release_political_pirsoners: "정치범 석방"
 ALG_release_political_pirsoners_desc: "국가의 새로운 장을 열기 위해 새 행정부는 불안의 시기에 정치적 이유로 구금된 이들을 석방할 것입니다. 이 사면은 국민 통합을 증진하고 국민과 국가 사이의 신뢰를 재건하기 위한 것입니다."
 ALG_al_jazair_al_djadida: "알자자이르 알자디다"
 ALG_al_jazair_al_djadida_desc: "압델마지드 테분 대통령이 약속한 '새로운 알제리'는 헌법 및 행정 개혁을 통해 국가의 정당성을 쇄신하고, 민주 제도와 대중의 신뢰를 강화하고자 합니다."
 ALG_republic_of_algeria: "알제리 공화국"
 ALG_republic_of_algeria_desc: "개혁의 토대가 마련되면서 알제리는 국가 주권, 사회 정의, 시민의 의지가 이끄는 공화국으로서의 정체성을 재확인합니다."
 ALG_majlis_al_watani_al_shaabi: "마즐리스 알와타니 알샤아비"
 ALG_majlis_al_watani_al_shaabi_desc: "의원내각제 공화국은 선출된 국민 대표에게 국가의 방향을 이끌 힘을 부여하여 행정부의 지배력을 제한하고 집단적 의사 결정을 보장할 것입니다."
 ALG_jumhorya_democratia_shaabia: "알주므호리야 알디무크라티야 알샤아비야"
 ALG_jumhorya_democratia_shaabia_desc: "행정권과 입법권 사이에 준대통령제식 균형을 유지한다면 알제리의 전환기를 안정시키고, 권위주의로의 회귀를 막으면서 단호한 통치를 보장할 수 있을 것입니다."
 ALG_deep_state_republic: "딥 스테이트 공화국"
 ALG_deep_state_republic_desc: "개혁이라는 겉치레 뒤에서 새로운 권력 구조가 등장합니다. 전직 장군과 사업가, 관료들이 어둠 속에서 통제권을 굳혀 갑니다. 이 '딥 스테이트 공화국'은 민주주의라는 환상을 유지하면서 자신들의 영향력과 부패의 연결망을 지켜 냅니다."
 ALG_tamazgha: "타마즈가의 꿈"
 ALG_tamazgha_desc: "대서양에서 나일강에 이르는 아마지그족의 땅, 타마즈가가 부활할 때가 왔습니다. 자유와 단결의 깃발 아래 북아프리카에 새로운 여명이 밝아 옵니다."
 ALG_our_land: "우리의 성스러운 땅"
 ALG_our_land_desc: "우리 민족은 언제나 우리의 것이었던 땅을 되찾고 재건해야 합니다. 산업과 인력, 그리고 용기가 다시 태어난 조국의 토대가 될 것입니다."
 ALG_expand_our_army: "육군 확장"
 ALG_expand_our_army_desc: "타마즈가의 방어는 우리 육군의 힘에 달려 있습니다. 수많은 적으로부터 새로운 국가를 지키기 위해 병력을 훈련하고, 무장시키고, 확장해야 합니다."
 ALG_berber_of_tunisia: "튀니지의 베르베르인"
 ALG_berber_of_tunisia_desc: "튀니지의 아마지그 형제들은 오랫동안 외세의 지배 아래 있었습니다. 이제 그들을 타마즈가의 깃발 아래 통합하고 그들의 땅을 해방할 때입니다."
 ALG_libya_invasion: "리비아 침공"
 ALG_libya_invasion_desc: "사하라의 모래밭에서 트리폴리의 해안에 이르기까지 리비아는 마땅히 우리 문화적 고향의 일부입니다. 리비아를 타마즈가의 품 안으로 끌어들여야 합니다."
 ALG_take_egypt: "이집트 진군"
 ALG_take_egypt_desc: "이집트는 타마즈가 동쪽 국경의 열쇠를 쥐고 있습니다. 광대한 자원과 전략적 중요성 덕분에 이집트는 우리 구상에 필수적인 일부입니다."
 ALG_canary_island: "카나리아 제도 장악"
 ALG_canary_island_desc: "카나리아 제도에는 한때 아마지그 민족인 과체족이 살았습니다. 이 섬들을 다시 아마지그의 주권 아래로 되돌릴 것입니다."
 ALG_take_niger: "니제르 영유권 주장"
 ALG_take_niger_desc: "니제르의 투아레그족은 혈통과 유산으로 볼 때 아마지그인입니다. 그들의 사막은 다시 한번 타마즈가라는 위대한 연방에 합류할 것입니다."
 ALG_rif_in_morocco: "모로코의 리프"
 ALG_rif_in_morocco_desc: "리프 산악 지대는 식민주의에 맞서 싸운 영웅들을 낳았습니다. 그들의 용기는 아마지그의 대의 아래 모로코를 통일하도록 우리를 고무합니다."
 ALG_demand_mali: "말리 요구"
 ALG_demand_mali_desc: "역사와 문화가 풍부한 말리의 땅은 한때 위대한 아마지그 제국의 일부였습니다. 사헬에서 우리의 영향력을 복원할 때입니다."
 ALG_demand_mauritania: "모리타니 요구"
 ALG_demand_mauritania_desc: "모리타니의 사막에는 우리의 과거 깊숙이 뻗은 아마지그의 뿌리가 있습니다. 모리타니와 타마즈가의 통합은 대륙적 운명을 향한 다음 단계입니다."
 ALG_TAM_unite_tamazgha: "타마즈가 통일"
 ALG_TAM_unite_tamazgha_desc: "모든 아마지그의 땅은 하나의 깃발 아래 통합되어야 합니다. 타마즈가의 꿈은 더 이상 환상이 아니라 우리가 완수할 사명입니다."
 ALG_expand_more: "연방 확장"
 ALG_expand_more_desc: "타마즈가는 정체되어서는 안 됩니다. 산업적, 영토적 확장을 통해 아프리카와 지중해의 강대국으로서 우리의 입지를 확보할 것입니다."
 ALG_focus_on_our_land: "우리 땅에 집중"
 ALG_focus_on_our_land_desc: "지나치게 멀리 확장하기보다는 우리 땅을 개발하고, 타마즈가 내부의 영향력과 경제, 단결을 강화하는 데 집중해야 합니다."
 ALG_expand_to_ME: "중동으로 확장"
 ALG_expand_to_ME_desc: "중동은 혼돈으로 찢겨 있습니다. 타마즈가는 힘과 목적의식으로 아라비아 땅에 질서와 아마지그의 지도력을 가져올 수 있습니다."
 ALG_take_arabia: "아라비아 정복"
 ALG_take_arabia_desc: "아라비아 반도는 분열되고 약한 상태입니다. 이 땅에 타마즈가의 빛을 전하고 홍해와 걸프에 대한 우리의 지배권을 확립할 것입니다."
 ALG_take_levant: "레반트 점령"
 ALG_take_levant_desc: "레바논의 산악에서 시리아와 팔레스타인의 평원에 이르기까지 레반트는 타마즈가의 깃발 아래 놓일 것이며, 이는 문명의 요람을 통제하는 데 한 걸음 더 다가서게 해 줄 것입니다."
 ALG_legacy_of_dihiya: "디히아의 유산"
 ALG_legacy_of_dihiya_desc: "아우레스의 두려움 없는 전사였던 디히아 여왕은 한때 외세의 침략자들에 맞서 아마지그 부족들을 통합했습니다. 그녀의 저항 정신과 지도력은 우리 민족 안에 살아 있습니다. 우리는 꺾이지도, 굴하지도 않는 영원한 자유인으로서 그녀의 유산을 이어 갑니다."
 ALG_de_arabisation_mission_desc: "문화와 언어 개혁을 위한 국가적 운동이 진행 중입니다. 관료제와 교육은 아마지그의 유산을 반영하도록 다시 쓰이고 있습니다. 이 변혁은 단기적으로는 부담을 주지만 장기적으로는 우리 국가를 강화할 것입니다."
 ALG_dearabisation_end_TT: "§G탈아랍화 과정이 완료됩니다.§! 아랍 중핵이 아마지그 중핵으로 대체되며, 국가 정신 §Y'이마지겐의 인내'§!를 얻습니다."
 ALG_de_arabisation: "탈아랍화 운동"
 ALG_de_arabisation_desc: "수 세기 동안 우리 민족의 진정한 정체성은 강요된 문화 아래 묻혀 있었습니다. 단기적으로 사회에 혼란을 주더라도 교육, 행정, 언어 정책을 개혁하여 우리의 뿌리를 되찾을 것입니다."
 ALG_dearabisation_penalty: "행정 혼란"
 ALG_dearabisation_penalty_desc: "탈아랍화 과정으로 국가 관료제와 교육 제도가 혼란에 빠졌습니다. 정부가 아마지그의 모습에 맞춰 제도를 재건하려는 동안 저항과 혼란, 비효율이 전환기를 괴롭힙니다."
 ALG_imazighen_perseverance: "이마지겐의 인내"
 ALG_imazighen_perseverance_desc: "고난과 개혁을 거치며 우리 민족은 견뎌 냈습니다. 아마지그의 정신은 결코 꺾이지 않음이 입증되었으며, 우리는 폭풍 속에서 더 강하고 더 자랑스럽고 더 단결된 모습으로 일어섭니다."
 ALG_el_salam_nuclear_reactor: "엘살람 원자로"
 ALG_el_salam_nuclear_reactor_desc: "증가하는 알제리의 에너지 수요를 충족하고 화석 연료 의존도를 줄이기 위해 정부는 엘살람 원자로 건설에 착수합니다. 이 사업은 과학 발전과 에너지 다변화를 향한 중대한 걸음입니다."
 ALG_uranium_enrichment: "우라늄 농축 계획"
 ALG_uranium_enrichment_desc: "자국의 우라늄 농축 능력을 개발하면 알제리는 핵연료 공급을 스스로 관리할 수 있게 됩니다. 이 계획을 통해 우리 과학자들은 원심분리 기술을 습득하고 핵 자급을 달성하는 것을 목표로 합니다."
 ALG_el_nour_nuclear_facility: "엘누르 핵시설"
 ALG_el_nour_nuclear_facility_desc: "엘살람 원자로의 성공에 이어 알제리는 연구, 원자로 정비, 평화적 핵 개발의 거점이 될 엘누르 시설을 건설하여 핵 기반시설을 확장합니다."
 ALG_ask_for_help_from_india: "인도의 지원 요청"
 ALG_ask_for_help_from_india_desc: "인도는 국제적 감시 아래 원자력을 개발해 온 수십 년의 경험이 있습니다. 뉴델리에 기술 및 과학 협력을 요청함으로써 알제리는 민간 핵 프로그램을 더 빠르게 진전시킬 수 있습니다."
 ALG_buy_pinaka_launcher: "피나카 로켓 발사기 구매"
 ALG_buy_pinaka_launcher_desc: "인도제 피나카 다연장 로켓 발사기는 비용 효율적이고 신뢰할 수 있는 체계입니다. 이 발사기를 도입하면 알제리의 포병 사단이 강화되고 인도와의 군사 협력이 더욱 긴밀해질 것입니다."
 ALG_indian_missiles: "인도 미사일 기술 확보"
 ALG_indian_missiles_desc: "인도와의 국방 협력을 확대하면 알제리는 첨단 미사일 유도 및 추진 체계에 접근할 수 있습니다. 이 기술을 통합하면 우리의 국방 능력이 크게 향상될 것입니다."
 ALG_subsidise_amazigh_businesses: "아마지그 기업 보조금 지급"
 ALG_subsidise_amazigh_businesses_desc: "아마지그 기업가들에게 국가 보조금과 우대 지원을 제공하여 타마즈가 지역의 경제 성장을 장려합니다."
 ALG_leave_arab_league: "아랍 연맹 탈퇴"
 ALG_leave_arab_league_desc: "알제리를 아랍 연맹에서 탈퇴시켜 아랍 블록 정치와는 별개인 주권적 아마지그 정체성을 천명합니다."
 ALG_bring_back_amazigh_exiles: "아마지그 망명자 귀환"
 ALG_bring_back_amazigh_exiles_desc: "아마지그 망명자와 이민자의 귀환을 지원하고 재정착을 위한 유인책을 제공합니다."
 ALG_boost_kabyle_population: "카빌 인구 증대"
 ALG_boost_kabyle_population_desc: "유인책, 재정착, 지원을 통해 카빌족의 인구 비중을 늘리는 정책을 시행합니다."
 ALG_de_arabisation_category: "타마즈가 탈아랍화 계획"
 ALG_de_arabisation_category_desc: "새로운 타마즈가를 건설하려면 강요된 아랍 정체성을 벗어던지고 우리 국가의 아마지그적 영혼을 회복해야 합니다."
 ALG_de_arabisation_mission: "탈아랍화 과정"
 ALG_return_amazigh_exiles: "아마지그 망명자와 이민자 귀환"
 ALG_return_amazigh_exiles_desc: "수십 년간의 차별로 많은 이들이 고국을 떠나야 했습니다. 이제 그들을 고향으로 데려올 때입니다."
 ALG_dearabisation_fail_TT: "실패하면 안정도가 약화되고 민족 간 긴장도가 증가합니다."
 ALG_amazigh_businesses_complete_TT: "카빌족의 만족도와 경제가 향상됩니다."
 ALG_amazigh_businesses_fail_TT: "실패하면 카빌족의 만족도가 감소합니다."
 ALG_return_exiles_complete_TT: "귀환한 망명자들이 아마지그 정체성과 인력을 강화합니다."
 ALG_return_exiles_fail_TT: "망명자 송환에 실패하면 단결이 약화됩니다."
 ALG_leave_arab_league_complete_TT: "아랍 연맹 탈퇴로 타마즈가의 주권이 강화됩니다."
 ALG_leave_arab_league_fail_TT: "탈퇴에 실패하면 불안이 발생합니다."
 ALG_kabyle_pop_complete_TT: "카빌족 인구가 증가하고 국가 단결이 높아집니다."
 ALG_kabyle_pop_fail_TT: "카빌족 인구 문제를 방치하면 불안이 발생합니다."
 ALG_tamazgha_cultural_revival_category: "타마즈가 문화 부흥"
 ALG_tamazgha_cultural_revival_category_desc: "아랍화가 끝난 지금, 우리의 문화적, 언어적, 지적 유산을 되살릴 때입니다. 타마즈가의 부활이 시작됩니다."
 ALG_amazigh_language_reform: "아마지그어 개혁"
 ALG_amazigh_language_reform_desc: "타마지그트어를 국어로 복원하고 교육과 행정을 통해 보급해야 합니다."
 ALG_tamazight_in_education: "교육에 타마지그트어 도입"
 ALG_tamazight_in_education_desc: "우리의 문화적 뿌리를 보존하기 위해 학교와 대학에서 타마지그트어를 시행합니다."
 ALG_media_cultural_independence: "문화 및 언론 독립"
 ALG_media_cultural_independence_desc: "외부 영향에서 자유로운 독립 아마지그 언론 매체와 문화 사업을 지원합니다."
 ALG_tamazgha_regional_cooperation: "타마즈가 지역 협력"
 ALG_tamazgha_regional_cooperation_desc: "아마지그 혈통의 북아프리카 국가들을 공동의 미래를 위한 협력 체제로 통합합니다."
 ALG_amazigh_language_reform_complete_TT: "타마지그트어가 국가 언어가 되어 교육이 향상됩니다."
 ALG_amazigh_language_reform_fail_TT: "교육 개혁에 실패하면 문화 부흥이 지연됩니다."
 ALG_tamazight_in_education_complete_TT: "교육 과정에 타마지그트어가 성공적으로 도입되었습니다."
 ALG_tamazight_in_education_fail_TT: "교육 제도가 여전히 아랍 중심으로 남습니다."
 ALG_media_cultural_independence_complete_TT: "독립적인 아마지그 언론이 국가 정체성을 강화합니다."
 ALG_media_cultural_independence_fail_TT: "행동하지 않으면 문화적 영향력이 약화됩니다."
 ALG_tamazgha_regional_cooperation_complete_TT: "타마즈가 국가들 사이의 지역적 단결이 달성되었습니다."
 ALG_tamazgha_regional_cooperation_fail_TT: "협력 구축에 실패하면 타마즈가가 고립됩니다."
 ALG_black_decade_lesson: "암흑의 10년이 남긴 교훈"
 ALG_black_decade_lesson_desc: "1990년대의 내전은 국가에 깊은 상처를 남겼고, 극단주의와 불안정을 경계하는 세대를 낳았습니다. 국가는 이 암울한 시기에서 뼈아픈 교훈을 얻어 국가 단결을 지키고 보안 기관을 강화하며 이념 대립의 혼란을 피하는 데 주력하고 있습니다. 그러나 이러한 교훈은 동시에 구세력이 정치를 계속 장악하는 것을 정당화하기도 하는데, 재발에 대한 두려움이 여전히 모든 개혁을 좌우하기 때문입니다."
 AlgeriaElections.1.t: "선거"
 AlgeriaElections.1.d: "알제리는 수년 만에 처음으로 진정한 경쟁 선거를 목격하고 있습니다. 수십 년간의 정치적 정체 끝에 나라의 미래를 만들겠다는 결의로 수백만 시민이 투표소로 향하면서 공기는 기대와 긴장으로 가득합니다. 여러 세력이 정치 지형을 지배하고 있습니다.\n\n한쪽 블록은 개혁주의, 자유주의, 온건 이슬람주의 세력으로 구성되어 민주주의와 투명성, 민족 화해를 내세워 선거운동을 펼칩니다. 그들의 구상은 '르 푸부아르' 체제를 해체하고 통치의 정당성을 회복하는 것입니다. 그들의 호소는 진정한 변화를 바라는 청년, 시민사회, 노동자들에게 강하게 공명합니다.\n\n다른 한쪽은 실용주의 무소속과 기술 관료들로, 내부에서 개혁을 추구하는 이들입니다. 그들은 안정과 안보를 유지하면서 점진적 민주화와 통치 개선, 경제 자유화를 우선시합니다.\n\n개표가 진행되면서 한 정당이 승리를 거머쥐며, 각 정당은 국가의 미래를 향한 서로 다른 길을 대표합니다."
 AlgeriaElections.1.a: "FFS가 승리를 선언하다"
 AlgeriaElections.1.b: "RND가 선거에서 승리하다"
 AlgeriaElections.1.c: "MSP가 위임을 확보하다"
 AlgeriaElections.1.dd: "RCD가 권력을 잡다"
 AlgeriaElections.2.t: "선거"
 AlgeriaElections.2.d: "오랫동안 기다려 온 선거가 도래했고, 국민은 숨을 죽이고 있습니다. 집권 민족해방전선(FLN)은 이번에도 알제리 정치 체제의 중심 기둥으로서, 암흑의 10년 이후에도 여전히 안정과 단결, 연속성을 중시하는 이들에게 호소합니다. 압델아지즈 부테플리카 대통령과 당의 충성스러운 기득 세력의 지도 아래, FLN은 혼란 없는 현대화와 단절 없는 개혁을 약속합니다.\n\n야권 운동은 목소리는 크고 다양하지만 여전히 분열되고 파편화되어 있어, 구세력에 도전할 수 있는 통일 전선을 구성하지 못하고 있습니다. 격변에 지치고 질서를 갈망하는 많은 알제리인은 경험과 안전이 변화의 위험보다 크다고 확신하며 익숙한 쪽에 표를 던집니다.\n\n마지막 표가 집계되면서 결과가 분명해집니다. 혁명의 유산이 여전히 군림하고 있습니다."
 AlgeriaElections.2.a: "FLN이 또다시 승리를 거두다!"
 ALG_election_time: "선거 기간"
 ALG_election_time_desc: "알제리는 또 한 번의 중대한 선거철을 준비하고 있습니다. 집권 FLN과 야당이 모두 선거운동을 준비하면서 정치 지형에 긴장감이 감돕니다."
 ALG_FLN_media_control: "국가 통제 언론"
 ALG_FLN_media_control_desc: "언론과 방송에 대한 통제를 강화함으로써 정부는 대중의 여론이 집권 FLN과 안정이라는 그들의 비전에 충성하도록 보장합니다."
 ALG_loyal_military: "충성스러운 군"
 ALG_loyal_military_desc: "군은 체제를 믿을 수 있게 수호하는 존재임을 입증했으며, 무엇보다도 질서와 국가 단결이 보존되도록 보장합니다."
 ALG_FLN_state_led_development: "국가 주도 개발"
 ALG_FLN_state_led_development_desc: "국가가 경제의 주요 부문을 지휘하여 산업 및 사회 발전이 국가의 통제 아래 유지되도록 합니다."
 ALG_FLN_oil_for_people: "국민을 위한 석유"
 ALG_FLN_oil_for_people_desc: "정부는 방대한 탄화수소 자원의 부를 복지와 보조금에 사용하여 경제적 재분배에 기반한 사회 계약을 증진합니다."
 ALG_FLN_national_security_council: "국가안보회의"
 ALG_FLN_national_security_council_desc: "국내 보안과 방첩을 조율하는 고위급 기구로서 국가에 대한 위협이 신속히 제거되도록 보장합니다."
 ALG_FLN_industrial_nationalization: "산업 국유화"
 ALG_FLN_industrial_nationalization_desc: "FLN 정부는 알제리의 경제 주권을 보호하기 위해 핵심 산업에 대한 통제권을 되찾는 조치를 취했습니다."
 ALG_FLN_legacy_of_stability: "안정의 유산"
 ALG_FLN_legacy_of_stability_desc: "결점에도 불구하고 FLN 정부는 연속성과 안정을 제공해 왔으며, 이는 수년간의 혼란을 겪은 많은 알제리인이 소중히 여기는 것입니다."
 ALG_FLN_oil_for_people_idea: "국민을 위한 석유"
 ALG_FLN_oil_for_people_idea_desc: "정부는 석유 수익을 공공 사업과 보조금에 직접 투입하기로 결정했습니다. 생활 수준은 높아지지만 장기적인 비효율과 의존의 위험도 따릅니다."
 ALG_FLN_legacy_of_stability_idea: "안정의 유산"
 ALG_FLN_legacy_of_stability_idea_desc: "수십 년간 FLN은 스스로를 알제리 안정의 수호자로 내세워 왔습니다. 정치와 보안에 대한 엄격한 통제가 평화를 보장하지만, 그 대가는 제한된 자유입니다."
 ALG_FLN_industrial_nationalization_idea: "산업 국유화"
 ALG_FLN_industrial_nationalization_idea_desc: "경제의 주요 부문이 국가 통제 아래 놓여 국가 독립을 보장하고 정부 계획에 따라 산업 성장을 이끌고 있습니다."
 ALG_FLN_state_led_development_idea: "국가 주도 개발"
 ALG_FLN_state_led_development_idea_desc: "국가는 인프라, 교육, 사회 복지를 강조하며 알제리의 경제 성장을 이끄는 데 적극적인 역할을 하여 국가의 토대를 강화합니다."
 ALG_FLN_media_control_idea: "정보법"
 ALG_FLN_media_control_idea_desc: "정보법은 언론 및 방송 활동을 규율하는 법적 틀을 마련하여 국가가 매체 운영을 규제하고 국가 정보 공간을 이끌 수 있게 합니다."
 ALG_FLN_national_security_council_idea: "국가안보회의"
 ALG_FLN_national_security_council_idea_desc: "군, 정보기관, 고위 관료로 구성된 강력한 회의체가 국내 안정과 국가 전략을 감독하며 FLN 정부에 대한 충성을 보장합니다."
 ALG_loyal_military_idea: "충성스러운 군"
 ALG_loyal_military_idea_desc: "군은 무엇보다 질서와 위계를 중시하며 FLN에 충성을 유지합니다. 이러한 단결은 적응력과 전장에서의 주도성이 떨어지는 대가를 수반합니다."
 ALG_loyal_military2_idea: "충성스러운 군단"
 ALG_loyal_military2_idea_desc: "정치적 통합과 특권적 혜택을 통해 군의 충성이 깊어져, 정부 지휘 아래 강력하고 규율 잡힌 군사 기구가 보장됩니다."
 ALG_invest_in_youth_idea: "청년 투자"
 ALG_invest_in_youth_idea_desc: "증가하는 알제리 청년 인구를 교육하고 고용하는 프로그램이 나라의 미래를 형성하며, 새로운 세대의 전문가와 지도자를 만들어 낼 것입니다."
 ALG_anti_corruption_campaign_idea: "반부패 운동"
 ALG_anti_corruption_campaign_idea_desc: "정부는 부패와 관료적 남용을 뿌리 뽑기 위한 운동을 시작하여 대중의 신뢰를 회복하고 국가 효율을 높이고자 합니다."
 ALG_new_era_for_algeria_idea: "알제리의 새 시대"
 ALG_new_era_for_algeria_idea_desc: "알제리는 개혁과 현대화의 새 시대로 들어서며, 혁신과 사회 진보를 변화하는 세계 경제의 도전과 조화시키고 있습니다."
 ALG_open_market_idea: "시장 개방 정책"
 ALG_open_market_idea_desc: "알제리 경제의 점진적 자유화는 투자와 기업가 정신을 불러오지만, 핵심 산업에 대한 국가의 전통적 통제력이 줄어드는 위험이 있습니다."
 ALG_reform_education_system_idea: "교육 제도 개혁"
 ALG_reform_education_system_idea_desc: "교육 제도를 현대화하고 혁신을 증진하며 학교를 현대 알제리 경제의 필요에 맞추기 위한 포괄적 개혁이 추진되고 있습니다."
 ALG_reform_the_judicial_system_idea: "사법 개혁"
 ALG_reform_the_judicial_system_idea_desc: "알제리의 사법 제도를 현대화하고 부패를 줄이며 법치를 수호하는 더 공정한 법원을 확립하기 위한 노력이 진행 중입니다."
 ALG_free_media_idea: "자유 언론"
 ALG_free_media_idea_desc: "독립 언론 매체가 꽃피기 시작하여 투명성과 책임성을 제공하지만, 동시에 비판과 대중 토론도 늘어납니다."
 ALG_black_decade_lesson_idea: "암흑의 10년이 남긴 교훈"
 ALG_black_decade_lesson_idea_desc: "내전의 상처는 여전히 알제리를 괴롭힙니다. 국가는 신중한 태도를 유지하며 위험보다 안보를 우선시하여 그러한 불안정이 다시는 돌아오지 않도록 합니다."
 ALG_election_day: "선거일"
 ALG_election_day_desc: "알제리인들이 자신들의 미래를 선택할 때가 왔습니다. 집권 FLN이 권력을 유지할지, 야당이 승리할지가 수십 년간 나라를 좌우할 것입니다."
 ALG_FLN_path: "FLN의 승리"
 ALG_FLN_path_desc: "FLN이 또다시 승리하여 정부와 알제리의 미래 방향에 대한 통제권을 유지했습니다."
 ALG_FLN_preserve_system: "체제 보존"
 ALG_FLN_preserve_system_desc: "FLN 지도부는 급격한 변화가 필요하지 않다고 보며, 기존 질서를 보존하는 것이 안정과 연속성을 보장한다고 판단합니다."
 ALG_FLN_control_media: "조직법 제12-05호 통과"
 ALG_FLN_control_media_desc: "정보와 언론 활동을 규율하는 조직법 제12-05호를 채택함으로써 국가는 언론 감독을 위한 법적 틀을 유지하면서 국가 여론을 형성할 수 있습니다."
 ALG_election_day_tt: "§Y알제리의 2004년 대통령 선거로 가는 길이 열립니다.§!\n머지않아 국가의 미래를 위해 집권 §RFLN§!과 §Y야당§! 중 하나를 선택해야 합니다."
 ALG_ethnic_kabyle_tt: "§Y카빌족 인구§!가 §Y10%§! 초과"
 ALG_kabyle_satisfaction_tt: "§Y카빌족 만족도§!가 §Y65§! 이상"
 ALG_kabyle_satisfaction_70_tt: "§Y카빌족 만족도§!가 §Y70§! 초과"
 ALG_kabyle_satisfaction_60_tt: "§Y카빌족 만족도§!가 §Y60§! 이상"
 ALG_fossil_fuel_industry: "소나트라크 로비"
 ALG_fossil_fuel_industry_desc: "국영 에너지 대기업 소나트라크와 그 하청업체 연결망은 알제리에서 가장 강력한 세력 중 하나를 이룹니다. 그들은 보조금을 옹호하고 경제 다각화에 저항하며, 알제리산 석유와 가스에 의존하는 외국 기업 및 정부와 긴밀한 관계를 유지합니다."
 ALG_the_military: "인민국민군(ANP)"
 ALG_the_military_desc: "알제리 군, 즉 ANP는 국가의 근간입니다. 국가 단결과 안정의 수호자로 기능하지만 그 지배력은 민주적 개혁을 제약합니다. 알제리의 보호와 민간 통치의 제한 사이에서 균형을 잡으며, ANP는 언제나 정치의 결정적 행위자입니다."
 ALG_industrial_conglomerates: "세비탈-마다르"
 ALG_industrial_conglomerates_desc: "세비탈과 마다르 홀딩스 같은 거대 기업이 지배하는 산업 복합체는 알제리에서 부상하는 과두 재계 엘리트를 대표합니다. 정치권력과 긴밀히 연결되고 종종 군부 및 집권 가문과 얽혀 있는 이들 집단은 민영화, 소비재, 부동산, 대외 무역을 통해 이윤을 추구합니다. 이들은 절실히 필요한 투자와 성장을 제공할 수 있지만, 그 대가는 부패와 불평등, 정치 포획입니다."
 ALG_offices_contruction_speed: "사무실 건설 속도"
 ALG_arms_factory_contruction_speed: "군수 공장 건설 속도"
 ALG_civ_construction_speed: "민간 공장 건설 속도"
 ALG_population_energy_consumption: "인구 에너지 소비"
 ALG_civ_factory_workforce: "민간 공장 필요 노동자"
 ALG_mil_factory_workforce: "군수 공장 필요 노동자"
 ALG_office_workforce: "사무실 필요 노동자"
 ALG_military_modifier: "알제리군"
 ALG_military_modifier_desc: "알제리 군의 역량과 개혁을 나타냅니다."
 ALG_opposition_path: "야당의 길"
 ALG_opposition_path_desc: "정치적 야당이 기세를 얻으면서 나라는 선택에 직면합니다. 내부에서 개혁할 것인가, 혼돈의 위험을 감수할 것인가. 투명성과 진보를 받아들일 때가 왔습니다."
 ALG_OPP_free_elections: "자유 선거 실시"
 ALG_OPP_free_elections_desc: "너무 오랫동안 국민의 목소리는 묵살되어 왔습니다. 진정한 민주주의는 투명하고 공정한 선거에서 시작됩니다."
 ALG_FLN_military_loyalty: "군의 충성 확보"
 ALG_FLN_military_loyalty_desc: "군은 안정의 기둥입니다. 그들의 충성을 보장하면 혼란을 막고 국가의 미래를 지킬 수 있습니다."
 ALG_FLN_public_works: "공공사업 계획 추진"
 ALG_FLN_public_works_desc: "공공 기반시설에 투자함으로써 일자리를 제공하고 정부 기관에 대한 국민의 신뢰를 되살립니다."
 ALG_reform_armed_forces: "군대 개혁"
 ALG_reform_armed_forces_desc: "군 구조를 현대화하여 효율성과 규율, 그리고 개인이 아닌 국가에 대한 충성을 보장할 것입니다."
 ALG_counter_extremism: "대테러 역량"
 ALG_counter_extremism_desc: "테러 조직망은 우리 국가의 안정을 위협합니다. 정보 활동과 보안군, 예방 프로그램을 강화함으로써 알제리의 대테러 역량을 높일 수 있습니다."
 ALG_regional_power: "지역 강국"
 ALG_regional_power_desc: "내부 안정을 달성한 알제리는 북아프리카와 지중해 전역에 힘과 지도력을 투사할 수 있습니다."
 ALG_expanding_the_power_grid: "전력망 확장"
 ALG_expanding_the_power_grid_desc: "안정적인 전력 공급은 경제 성장에 필수적입니다. 에너지 망을 확장하면 산업과 농촌 개발이 뒷받침될 것입니다."
 ALG_OPP_new_constitution: "새 헌법 기초"
 ALG_OPP_new_constitution_desc: "새 헌법은 민주주의, 평등, 문민 통치의 토대를 놓을 것입니다."
 ALG_OPP_media_freedom: "언론 자유 보장"
 ALG_OPP_media_freedom_desc: "언론의 자유는 지도자에게 책임을 묻고 대중에게 진실을 알리는 데 필수적입니다."
 ALG_OPP_judiciary_reform: "사법부 개혁"
 ALG_OPP_judiciary_reform_desc: "독립적이고 투명한 사법부는 지위나 영향력에 관계없이 모든 시민에게 정의를 보장하는 열쇠입니다."
 ALG_OPP_education_first: "교육 우선"
 ALG_OPP_education_first_desc: "현대 국가는 잘 교육받은 국민에 달려 있습니다. 학교와 대학에 투자하면 더 밝은 미래가 만들어질 것입니다."
 ALG_OPP_open_market: "시장 개방"
 ALG_OPP_open_market_desc: "경제 개혁과 무역 개방은 투자를 유치하고 기업가들에게 기회를 창출할 것입니다."
 ALG_OPP_new_era: "알제리의 새 시대"
 ALG_OPP_new_era_desc: "수년간의 투쟁과 개혁 끝에 알제리는 자유와 번영, 안정의 새로운 장으로 들어섭니다."
 ALG_OPP_anti_corruption: "부패 척결"
 ALG_OPP_anti_corruption_desc: "부패는 국가의 잠재력을 갉아먹습니다. 엄격한 법과 투명한 제도, 모든 수준에서의 책임성이 필요한 때입니다."
 ALG_OPP_invest_in_youth: "청년 투자"
 ALG_OPP_invest_in_youth_desc: "청년은 알제리의 영혼입니다. 교육과 고용을 통해 청년에게 힘을 실어 줌으로써 국가의 미래를 확보합니다."
 ALG_OPP_state_first: "국가 우선"
 ALG_OPP_state_first_desc: "변화의 시기에는 단결과 국익이 모든 정책을 이끌어야 합니다. 국가의 온전함은 당파적 이익에 앞섭니다."
 ALG_terror_2013_in_amenas_title: "2013년 인아메나스 인질 사태"
 ALG_terror_2013_in_amenas_desc: "극단주의 조직과 연계된 무장 세력이 알제리 남부의 인아메나스 가스 시설을 기습 공격했습니다. 공격자들은 외국인 노동자를 포함한 수백 명을 인질로 잡아 국제적 위기를 촉발했습니다. 알제리군은 신속히 현장을 포위했고, 이는 세계를 충격에 빠뜨린 유혈 대치로 이어져 사막 지역의 테러에 대응하는 정부의 능력에 의문을 불러일으켰습니다."
 ALG_terror_2013_placeholder_option: "우리 군은 단호하게 대응한다."
 ALG_terror_2013_low_tt: "경미한 불안이 억제됩니다. §G안정도가 소폭 개선됩니다.§!"
 ALG_terror_2013_medium_tt: "상황이 악화되어 §O급진화§!가 가속되고 §R안정도§!가 감소합니다."
 ALG_terror_2013_high_tt: "공격이 걷잡을 수 없이 번집니다. §O급진 반군§!이 세력을 얻으면서 §R국가 안정도가 급락합니다§!."
 ALG_healthcare_reform_tt: "의료 개혁을 시작하려면 §Y국민 불만§!이 §Y40§! 미만이어야 합니다."
 ALG_education_reform_tt: "교육 개혁을 시작하려면 §Y국민 불만§!이 §Y40§! 미만이어야 합니다."
 ALG_unemployment_reform_tt: "실업 개혁을 시작하려면 §Y국민 불만§!이 §Y40§! 미만이어야 합니다."
 ALG_employment_TT: "§H실업률§!이 §H20%§! 미만"
 ALG_grand_mosque: "알제 대사원"
 ALG_grand_mosque_desc: "알제리의 정신적, 문화적 부흥의 상징인 알제 대사원은 세계에서 가장 높고 웅장한 사원 중 하나로 우뚝 서 있습니다. 이 건설은 국가의 건축적 야망을 보여 줄 뿐 아니라 이슬람 유산과 단결의 등대 역할도 합니다. 이 기념비적 사업을 완수하면 국민적 자긍심이 높아지고 이슬람 세계 전역에 알제리의 영향력이 투사될 것입니다."
 ALG_big_cities_or_rising_states: "도시 또는 지역 개발 계획"
 ALG_big_cities_or_rising_states_desc: "전후 복구 계획에 이어 정부는 다음 단계를 결정해야 합니다. 알제리 산업의 근간을 강화하기 위해 자원을 주요 해안 도시에 집중해야 할까요, 아니면 균형 잡힌 국가 성장을 위해 내륙과 사막 지역을 끌어올려야 할까요?"
 ALG_focus_on_big_cities: "주요 도시에 집중"
 ALG_focus_on_big_cities_desc: "알제, 오랑, 콩스탕틴 같은 도시 중심지는 알제리 경제의 엔진입니다. 개발 노력을 이곳에 집중함으로써 기반시설을 현대화하고 생산성을 높일 수 있습니다."
 ALG_rising_states_program: "떠오르는 주 계획"
 ALG_rising_states_program_desc: "해안 도시들이 번영하는 동안 내륙 지역은 뒤처져 있습니다. 떠오르는 주 계획은 알제리의 심장부에 도로와 학교, 산업을 가져와 어떤 주도 소외되지 않도록 하는 것을 목표로 합니다."
 ALG_develop_atlas: "알제리 아틀라스 개발"
 ALG_develop_atlas_desc: "아틀라스의 산악 지대는 농업과 소규모 산업의 큰 잠재력을 지니고 있습니다. 이곳에 대한 투자는 지역 생활 수준을 높이고 장기적인 식량 안보를 만들어 낼 것입니다."
 ALG_develop_kabylia: "카빌리아 지역 확장"
 ALG_develop_kabylia_desc: "카빌리아는 강한 문화적 정체성과 근면한 주민을 지니고 있습니다. 이곳의 기반시설과 사무실을 개발하면 지역적 자긍심과 국가 단결이 모두 강화될 것입니다."
 ALG_develop_aures: "아우레스의 농업 성장"
 ALG_develop_aures_desc: "아우레스 산맥에는 광대한 농지와 부지런한 공동체가 있습니다. 이곳의 농업 생산을 현대화하면 농촌 빈곤이 줄고 식량 공급이 안정될 것입니다."
 ALG_expand_oran: "오랑 산업 구역 확장"
 ALG_expand_oran_desc: "오랑은 알제리에서 가장 중요한 산업 및 항구 도시 중 하나입니다. 산업 구역을 확장하면 새로운 일자리가 창출되고 수출이 증대될 것입니다."
 ALG_expand_algiers: "알제 현대화"
 ALG_expand_algiers_desc: "알제리의 고동치는 심장인 알제는 계속 발전해야 합니다. 새로운 사무실과 기반시설, 도시 개혁은 알제를 북아프리카의 모범적인 수도로 탈바꿈시킬 것입니다."
 ALG_expand_constantine: "콩스탕틴에 투자"
 ALG_expand_constantine_desc: "콩스탕틴의 오랜 교육과 문화의 역사는 이곳을 고등 교육과 혁신의 이상적인 거점으로 만듭니다. 이곳에 투자하면 새로운 세대의 알제리 사상가와 기술자가 배출될 것입니다."
 ALG_develop_tamanrasset: "타만라셋 기반시설 개발"
 ALG_develop_tamanrasset_desc: "사하라 깊숙한 곳의 타만라셋은 알제리 남부 물류의 열쇠입니다. 도로와 보급 거점, 통신 기반시설이 사막을 북부와 연결할 것입니다."
 ALG_develop_mzab: "음자브 계곡 전력 공급"
 ALG_develop_mzab_desc: "음자브 지역은 불굴의 정신과 늘어나는 에너지 수요를 지니고 있습니다. 새 발전소를 건설하면 지역 주민에게 전기와 일자리를 제공할 수 있습니다."
 ALG_develop_granderg: "그랑 에르그의 자원 개발"
 ALG_develop_granderg_desc: "서부 그랑 에르그는 텅 비어 보일지 몰라도 지하의 부는 다른 이야기를 들려줍니다. 이곳에 석유 채굴 지점을 개발하면 에너지 생산국으로서 알제리의 입지가 강화될 것입니다."
 ALG_FIS.1.t: "울라마의 귀환"
 ALG_FIS.1.d: "이슬람 구국 전선 내부에서 운동의 방향을 두고 격렬한 논쟁이 일었습니다. 엄격한 사우디식 해석에 영감을 받은 와하브파 학자들은 알제리의 이슬람과 정치에서 그들이 타락한 혁신이라 보는 것을 완전히 정화할 것을 요구합니다. 한편 알제리의 전통 울라마는 더 관용적인 이슬람 틀 안에서 영적 인도와 국가 개혁으로 돌아갈 것을 주장합니다.\n\n우리의 선택이 운동의 영혼을 규정할 것입니다."
 ALG_FIS.1.a: "와하브파 울라마를 따른다. 신앙을 정화하고 강화한다"
 ALG_FIS.1.b: "전통 울라마를 지지한다. 국가를 개혁하고 인도한다"
 ALG_FIS.2.t: "이슬람 구국 전선의 미래"
 ALG_FIS.2.d: "1991년 이슬람 구국 전선(FIS)이 이끈 대규모 시위에 알제리 당국이 무력으로 대응하면서, 국가 현대사에서 가장 피비린내 나는 전환점 중 하나가 되었습니다. 운동의 창설자 압바시 마다니는 군과 경찰이 수천 명의 FIS 지지자를 폭력적으로 해산시킨 6월 사태 이후 징역 15년을 선고받았습니다. 할레드 네자르 장군은 마다니의 체포를 명령하고 당을 해체하며 이슬람주의의 영향력을 억누르기 위한 비상사태를 선포했습니다. 이 탄압은 혼란과 민간인 사상자, 그리고 평화로운 개혁에 대한 모든 희망의 소멸로 이어졌으며, 이는 훗날 암흑의 10년으로 알려진 파괴적인 알제리 내전에 불을 붙인 불씨가 되었습니다. 이제 알리 벨하지가 정부를 이끌고 있습니다. 운동은 그가 계속 자신들의 목소리로 남을지, 아니면 무장 투쟁 노선이 주도권을 잡을지 결정해야 합니다."
 ALG_FIS.2.a: "알리 벨하지를 지지한다"
 ALG_FIS.2.b: "투쟁의 길을 받아들인다. GIA 창설자 압델학 라야다"
 ALG_ps_victory: "이슬람 구국 전선의 승리"
 ALG_ps_victory_desc: "이슬람 구국 전선이 승리했습니다. 알제리는 신앙과 질서, 사원과 병영 사이의 갈림길에 서 있습니다. 이제 이 권력의 새로운 여명을 공고히 해야 합니다."
 ALG_consolidate_power: "새 질서 공고화"
 ALG_consolidate_power_desc: "권력은 사회의 모든 수준에서 확보되어야 합니다. 당, 울라마, 무장 단체는 이제 오직 하나의 목적, 곧 우리 통치의 보존을 위해 복무해야 합니다."
 ALG_national_reconstruction: "국가 재건"
 ALG_national_reconstruction_desc: "전쟁으로 피폐해진 국가를 폐허에서 재건해야 합니다. 재건에는 산업과 대중의 신뢰를 회복하기 위한 신앙과 실용주의가 모두 필요할 것입니다."
 ALG_religious_reconciliation: "종교적 화해"
 ALG_religious_reconciliation_desc: "알제리 이슬람 학자들 사이의 분열은 우리의 단결을 위협합니다. 우리는 이견을 조정하고 새 국가를 위한 통합된 종교적 토대를 만들어야 합니다."
 ALG_crackdown_purges: "탄압과 숙청"
 ALG_crackdown_purges_desc: "권력을 유지하려면 반대 세력을 제거해야 합니다. 구체제의 잔당, 세속주의 장교, 반체제 파벌은 숙청되어야 합니다."
 ALG_unify_parties: "이슬람 운동 통합"
 ALG_unify_parties_desc: "우리의 부상을 지지했던 다양한 이슬람주의 단체들을 이제 하나의 깃발 아래 모아야 합니다. 움마의 단결은 우리 안에서 시작됩니다."
 ALG_infrastructure_crash: "기반시설 복구"
 ALG_infrastructure_crash_desc: "내전은 우리의 기반시설을 엉망으로 만들었습니다. 도로와 교량, 공공 시설을 복구하기 위한 긴급 계획을 시작할 것입니다."
 ALG_industry_investment: "산업 투자"
 ALG_industry_investment_desc: "장기적 회복을 지속하려면 국가 산업에 투자하고 이슬람 경제 원칙에 따라 지역 기업가를 지원해야 합니다."
 ALG_madrasa_reforms: "마드라사 개혁"
 ALG_madrasa_reforms_desc: "교육은 현대의 필요와 종교적 가치 모두에 부합해야 합니다. 마드라사를 개혁하면 신앙에 뿌리를 둔 새로운 세대의 학자와 기술자가 보장될 것입니다."
 ALG_community_outreach: "지역사회 접촉 계획"
 ALG_community_outreach_desc: "사회 사업을 통해 지역 공동체와의 유대를 강화하고 이슬람 가치 아래 단결과 연대를 증진할 것입니다."
 ALG_internal_security: "내부 보안 기구"
 ALG_internal_security_desc: "불안을 진압하고 혁명을 내부로부터 보호하기 위해 충성스러운 내부 보안망을 구축해야 합니다."
 ALG_intelligence_network: "이슬람 정보국"
 ALG_intelligence_network_desc: "효과적인 정보 기관은 위협을 예측하고 음모가 뿌리내리기 전에 무력화할 수 있게 해 줄 것입니다."
 ALG_transport_upgrade: "교통 현대화"
 ALG_transport_upgrade_desc: "현대적인 교통 체계는 상업을 가속하고 기동성을 높이며 알제리의 지역들을 그 어느 때보다 긴밀히 연결할 것입니다."
 ALG_energy_program: "국가 에너지 계획"
 ALG_energy_program_desc: "재생 에너지원과 기존 에너지원을 모두 개발하면 알제리의 새로운 경제를 위한 근간이 마련될 것입니다."
 ALG_scholastic_centers: "학술 연구 센터"
 ALG_scholastic_centers_desc: "우리의 학자와 과학자들은 국가 발전을 위해 이슬람 지식과 현대 과학을 함께 발전시키며 나란히 일할 것입니다."
 ALG_social_welfare: "사회 복지 확대"
 ALG_social_welfare_desc: "빈민과 과부, 이재민을 돌보아 모든 알제리인이 신앙에 기반한 통치의 축복을 누리도록 보장할 것입니다."
 ALG_military_rebuild: "신앙의 군대 재건"
 ALG_military_rebuild_desc: "군은 재건되고 부패로부터 정화되어야 합니다. 규율 잡힌 군대가 혁명과 국가를 지킬 것입니다."
 ALG_garrison_restructure: "수비대 재편"
 ALG_garrison_restructure_desc: "외부 또는 내부 위협에 대비해 충성과 효율, 준비 태세를 보장하도록 수비대를 재편해야 합니다."
 ALG_factory_output: "산업 생산 확대"
 ALG_factory_output_desc: "우리의 투자가 결실을 맺고 있습니다. 이제 공장들이 경제 성장을 이끌기 위해 최대 가동에 들어갑니다."
 ALG_oil_and_minerals: "석유 및 광물 개발"
 ALG_oil_and_minerals_desc: "알제리의 풍부한 천연자원은 신이 내린 선물입니다. 에너지 독립을 위해 책임 있게 활용할 것입니다."
 ALG_religious_council: "종교 회의 설립"
 ALG_religious_council_desc: "울라마의 최고 회의가 국가의 도덕적, 영적 방향을 이끌며 모든 법이 샤리아에 부합하도록 보장할 것입니다."
 ALG_national_cohesion: "국민 결속"
 ALG_national_cohesion_desc: "복지와 신앙을 통해 전쟁의 분열을 치유하고 새롭고 통합된 알제리 정체성을 벼려 낼 것입니다."
 ALG_border_defences: "국경 강화"
 ALG_border_defences_desc: "국경은 침투와 밀수에 맞서 요새화되어야 합니다. 혁명의 적은 밖에도 안에도 있습니다."
 ALG_strategic_reserves: "전략 비축 계획"
 ALG_strategic_reserves_desc: "전쟁이나 경제 불안정기에도 버틸 수 있도록 물자를 비축하고 예비 자원을 확대할 것입니다."
 ALG_heavy_industry: "중공업 개발"
 ALG_heavy_industry_desc: "소비재를 넘어 중장비와 강철, 무기 생산에 초점을 맞춰 산업 기반을 끌어올릴 것입니다."
 ALG_international_trade: "국제 무역 확대"
 ALG_international_trade_desc: "이슬람 세계의 우호국들과 교역함으로써 알제리는 신앙에 기반한 상업의 거점이 될 수 있습니다."
 ALG_cultural_influence: "문화 영향력 구상"
 ALG_cultural_influence_desc: "우리의 문화와 신앙, 본보기를 수출하여 이슬람 부흥의 알제리 모델을 확산할 것입니다."
 ALG_welfare_programs: "복지 계획"
 ALG_welfare_programs_desc: "포괄적인 복지 사업은 우리의 정통성을 강화하고 취약 계층을 보호할 것입니다."
 ALG_army_of_salvation: "구국군"
 ALG_army_of_salvation_desc: "구국군은 이슬람의 방패이자 알제리의 검이 될 것이며, 규율 있고 신앙심 깊으며 굴하지 않을 것입니다."
 ALG_nation_energy_independence: "국가 에너지 독립"
 ALG_nation_energy_independence_desc: "에너지를 완전히 국내 통제 아래 두면 외국 의존에서 벗어날 수 있습니다."
 ALG_international_outreach: "국제 이슬람 연대"
 ALG_international_outreach_desc: "이슬람 세계에 손을 내밀어 우리의 비전을 공유하는 운동 및 국가들과 가교를 놓을 것입니다."
 ALG_regional_leadership: "지역 지도력"
 ALG_regional_leadership_desc: "알제리는 북아프리카와 그 너머에서 정치적, 종교적, 경제적 지도국으로 자리매김할 것입니다."
 ALG_technological_renaissance: "기술 르네상스"
 ALG_technological_renaissance_desc: "신앙과 과학은 적이 아닙니다. 이슬람 윤리의 인도를 받는 기술 발전의 새 시대를 이끌 것입니다."
 ALG_islamic_coalition: "이슬람 연합 결성"
 ALG_islamic_coalition_desc: "움마의 단결은 협력을 통해 회복되어야 합니다. 알제리는 상호 번영을 향해 이슬람 국가들의 연합을 이끌 것입니다."
 ALG_grand_strategy: "대전략"
 ALG_grand_strategy_desc: "우리 국가는 이제 군사적, 경제적, 영적으로 강건하게 서 있습니다. 우리 문명을 위한 장기적 비전을 그릴 때입니다."
 ALG_final_salvation: "최후의 구원"
 ALG_final_salvation_desc: "우리 여정의 마지막 단계는 신의 율법과 도덕적 힘이 온전히 이끄는 사회를 창조하는 것입니다."
 FIS_rust_belt_rejuvenation: "러스트 벨트 재활성화"
 FIS_rule_to_perfection: "완전한 통치"
 FIS_new_islamic_architecture: "새로운 이슬람 건축"
 FIS_prioritize_military_industries: "군수 산업 우선"
 FIS_industrialize_the_umma: "움마의 산업화"
 ALG_fis_win: "이슬람 구국 전선의 승리"
 ALG_fis_win_desc: "인내와 단결, 신성한 인도를 통해 이슬람 구국 전선이 적들을 이겼습니다. 앞으로의 길은 영적 통치와 쇄신의 길입니다. 신앙과 정의, 알라의 뜻으로 규정되는 알제리의 새로운 장이 시작됩니다."
 ALG_fis_win_tt: "§Y이슬람 구국 전선(FIS) 국가 중점 트리가 잠금 해제됩니다§!"
 alg_politics_news.1.t: "압달라 자발라, FJD 창당"
 alg_politics_news.1.d: "민족개혁운동(이슬라)의 전 지도자이자 엔나흐다의 창설자인 압달라 자발라가 새로운 정당인 정의개발전선(FJD) 창당을 발표했습니다. 튀르키예의 정의개발당(AKP)에서 영감을 얻은 FJD는 이슬람 원칙을 정치적 온건함 및 국가 발전과 결합하고자 합니다. 이 운동은 내전 이후 시대의 알제리에서 정의, 개혁, 윤리적 통치를 강조함으로써 이슬람주의 정치에 대한 대중의 신뢰를 되살리는 것을 목표로 합니다."
 alg_politics_news.1.a: "새로운 이슬람주의 운동이 알제리 정치 무대에 등장한다."
 algerian.1.t: "알제리의 기반시설 투자 요청"
 algerian.1.d: "알제리 정부가 농산물 유통 도로와 농촌 기반시설 건설을 위한 자금 지원 제안을 가지고 우리에게 접근했습니다. 이 투자는 알제리의 농업 유통과 산업 역량을 개선하는 동시에 우리의 정치적, 경제적 영향력을 확대할 수 있게 해 줍니다. 다만 이 사업에는 우리 국고에서의 재정 기여가 필요합니다."
 algerian.1.a: "기반시설 사업에 자금을 지원한다"
 algerian.1.b: "요청을 거절한다"
 algerian.4.t: "기반시설 협력 승인"
 algerian.4.d: "튀니지가 우리의 농산물 유통 기반시설 구상을 지원하기로 동의했습니다. 이 투자는 양국 관계를 개선하는 한편 우리의 농촌 경제와 산업 역량을 강화할 것입니다."
 algerian.4.a: "우리 경제를 위한 한 걸음"
 algerian.5.t: "기반시설 자금 지원 거부"
 algerian.5.d: "튀니지가 우리가 제안한 기반시설 구상에 자금을 지원하기를 거절했습니다. 외국의 지원이 없다면 농산물 유통 도로와 관련 사업의 개발은 지연될 것입니다."
 algerian.5.a: "우리 힘으로 해내겠다"
 algeria_news.30.t: "검은 봄 봉기"
 algeria_news.30.d: "카빌 지역에서 수년간 이어진 불안 끝에, 베르베르 주민들의 커져 가는 요구에 어떻게 대응할지 결정해야 합니다."
 algeria_news.30.a: "카빌족에게 완전한 독립을 부여한다"
 algeria_news.30.b: "카빌족에게 자치를 부여한다"
 algeria_news.30.c: "봉기를 진압한다"
 algeria_news.30_a_tt: "이 길을 택하면 독립 카빌 국가가 수립됩니다. 안정도가 증가하고 정치력을 얻습니다."
 algeria_news.30_b_tt: "자치를 택하면 카빌족에게 제한적 자치(바르바샤)가 주어집니다. 안정도가 어느 정도 증가하고 정치력을 얻습니다."
 algeria_news.30_c_tt: "카빌족을 진압하면 안정도와 전쟁 지지도가 감소하지만 약간의 정치력을 얻습니다."
 AlgeriaFocusEvents.43.t: "이슬람 세계 회의 초청"
 AlgeriaFocusEvents.43.d: "[Root.GetName]의 지도부가 이슬람 세계 회의 가입을 위한 공식 초청을 받았습니다. 가입하면 이슬람 국가들 사이의 경제 협력이 강화되고 새로운 무역 기회가 열리며 우리의 공통된 정치적 노선이 공고해질 것입니다. 그러나 가입은 비이슬람 경제 블록과의 거리를 벌릴 수 있습니다."
 AlgeriaFocusEvents.43.a: "회의에 가입한다"
 AlgeriaFocusEvents.43.b: "초청을 거절한다"
 AlgeriaFocusEvents.41.t: "이슬람 세계 회의 초청"
 AlgeriaFocusEvents.41.d: "알제리가 우리를 이슬람 세계 회의에 공식 초청했습니다. 이 제안은 경제 협력과 정치적 조율, 이슬람 국가들 사이의 유대 강화를 강조합니다. 수락하면 지역 내 위상이 높아질 수 있으나, 거절하면 관계가 긴장될 수 있습니다."
 AlgeriaFocusEvents.41.a: "좋은 생각이다"
 AlgeriaFocusEvents.41.b: "관심 없다"
 AlgeriaFocusEvents.411.t: "초청을 거절한 이라크"
 AlgeriaFocusEvents.411.d: "이라크 정부가 전략적 고려와 국가적 우선순위를 이유로 이슬람 세계 회의 가입 초청을 정중히 거절했습니다."
 AlgeriaFocusEvents.411.a: "유감이지만 알겠다"
 AlgeriaFocusEvents.42.t: "이슬람 세계 회의 초청"
 AlgeriaFocusEvents.42.d: "이슬람 세계 회의 확대 구상에 대한 공식 회신을 받았습니다. 초청받은 국가는 CIW와 경제적, 정치적으로 제휴할지 검토 중입니다."
 AlgeriaFocusEvents.42.a: "회의에 환영한다"
 AlgeriaFocusEvents.42.b: "그들이 거절했다"
 AlgeriaFocusEvents.421.t: "초청 거부됨"
 AlgeriaFocusEvents.421.d: "초청받은 국가가 이슬람 세계 회의 참여를 거절했습니다. 우리의 외교적 노력은 다른 곳으로 돌려야 할 것입니다."
 AlgeriaFocusEvents.421.a: "알겠다"
 AlgeriaFocusEvents.81.t: "CIW 동맹 초청"
 AlgeriaFocusEvents.81.desc: "이슬람 세계 회의 동맹에 가입하라는 초청을 받았습니다. 이 제안은 협력과 상호 지원의 증대를 약속하지만, 그 대가로 양보가 필요할 수 있습니다."
 AlgeriaFocusEvents.81.a: "보장이 있을 때만 가능하다"
 AlgeriaFocusEvents.81.b: "절대 안 된다"
 ALG_power_struggle_resistance_dominant: "§R국민이 체제에 공공연히 저항하고 있습니다§!"
 ALG_power_struggle_army_dominant: "§B군이 상황을 확고히 통제하고 있습니다§!"
 ALG_power_struggle_resistance_rising: "§Y기득권에 대한 민중의 압력이 커지고 있습니다§!"
 ALG_power_struggle_army_rising: "§Y군이 권력에 대한 장악력을 되찾고 있습니다§!"
 ALG_power_struggle_stable: "§W위태로운 균형이 당분간 유지됩니다§!"
 ALG_west_alignment_tt: "미국과의 전략적 동반자 관계를 공식화하고 NATO 및 EU와의 유대를 심화합니다. 서방 기술과 투자에 접근할 수 있게 되지만 중국 및 러시아와의 관계가 긴장될 수 있습니다."
 ALG_china_alignment_tt: "일대일로 구상 아래 중국과의 협력을 심화합니다. 대규모 기반시설 투자와 무역 성장을 기대할 수 있으나 서방 강대국들은 경계할 것입니다."
 alg_crackdown.1.t: "알제에서 시위 발발"
 alg_crackdown.1.d: "야권 인사들의 체포가 거리 시위를 촉발했습니다. 시위대는 정치 개혁과 탄압의 종식을 요구합니다."
 alg_crackdown.1.a: "시위를 진압한다."
 alg_crackdown.1.b: "일부 구금자를 석방한다."
 alg_crackdown.2.t: "전국적 파업과 시위"
 alg_crackdown.2.d: "야당 금지가 히라크 시위를 연상시키는 대규모 운동을 촉발했습니다. 나라가 마비되었습니다."
 alg_crackdown.2.a: "군을 투입한다."
 alg_crackdown.2.b: "대화에 나서고 금지를 철회한다."
 democratic_reforms: "민주 개혁 과정"
 ALG_healthcare_success_tt: "우리의 의료 개혁은 공중 보건을 개선하고 불만을 줄일 것입니다."
 ALG_healthcare_failure_tt: "의료 개혁을 이행하지 못하면 국민의 분노가 깊어지고 군의 정치적 입지가 강화될 것입니다."
 ALG_education_success_tt: "교육 개혁은 우리 노동력을 현대화하고 불만을 줄일 것입니다."
 ALG_education_failure_tt: "교육 위기가 계속됩니다. 국민의 좌절감이 커집니다."
 ALG_unemployment_success_tt: "일자리 창출 계획은 실업을 줄이고 나라를 안정시킬 것입니다."
 ALG_unemployment_failure_tt: "실업 문제를 해결하지 못하면 파업과 불안이 발생할 것입니다."
 ALG_tamazgha.1.t: "타마즈가의 초청"
 ALG_tamazgha.1.d: "이제 '타마즈가'로 간판을 바꾼 [FROM.GetName] 정부가 공통의 아마지그 유산과 문화 협력에 기반한 새로운 지역 동맹을 결성하자는 제안을 해 왔습니다. 그들은 이 연합이 상호 경제 발전과 안보를 제공하고, 아랍 연맹 같은 낡은 범아랍 구조를 거부하는 길이라고 주장합니다.\n\n우리 정부의 일부는 이를 역사적 기회로 보지만, 다른 이들은 타마즈가의 의도와 장기적 목표에 의문을 제기합니다."
 ALG_tamazgha.1.a: "타마즈가 연합에 가입한다."
 ALG_tamazgha.1.b: "이것은 우리의 싸움이 아니다."
 ALG_election_time_idea: "다음 선거 준비"
 ALG_casablanca_decisions: "카사블랑카 구상"
 ALG_casablanca_decisions_desc: "아프리카 연합 또는 국제 경로를 통해 서사하라 문제로 모로코를 압박하는 외교적 선택지입니다."
 ALG_casablanca_mission_tt: "카사블랑카 구상 임무를 시작합니다. 먼저 접근 방식을 선택해야 합니다. 임무는 180일간 진행되며 낮음/중간/높음의 결과를 냅니다."
 ALG_casablanca_mission_desc: "기한이 정해진 외교 공세를 시작합니다. 결과에 따라 AU의 압력으로 모로코의 영유권 주장을 철회시킬 수 있을지(크게 성공하면 중핵 제거까지) 정해집니다."
 ALG_casablanca_approach_tt: "카사블랑카 구상의 전략적 접근 방식을 선택합니다. 접근 방식은 하나만 선택할 수 있으며, 이후 임무 항목을 시작하여 작전을 수행합니다."
 ALG_casablanca_approach_great_powers: "강대국 구애"
 ALG_casablanca_approach_great_powers_desc: "정치력을 들여 주요 강대국(미국/스페인/러시아)에 구애합니다. 결정적인 AU 압력을 만들어 낼 가능성이 가장 높지만 비용이 많이 들고 정치적으로 위험합니다."
 ALG_casablanca_approach_regional: "지역 중심만"
 ALG_casablanca_approach_regional_desc: "지역 파트너에 의존하고 강대국의 영향력은 피합니다. 비용이 적고 위험도 낮지만 결정적인 성과를 거둘 가능성은 낮습니다."
 ALG_casablanca_approach_mixed: "혼합 전략"
 ALG_casablanca_approach_mixed_desc: "지역적 압력과 국제적 압력을 결합합니다. 비용과 확률이 균형을 이룹니다."
 ALG_morocco.2.t: "모로코에 대한 AU/UN의 압력"
 ALG_morocco.2.d: "알제리가 AU와 UN에서 벌인 외교 공세에 따라 모로코는 서사하라 문제로 국제적 압력에 직면했습니다. 왕국은 요구에 응할 것입니까, 아니면 저항하며 제재의 위험을 감수할 것입니까?"
 ALG_morocco.2.a: "압력에 굴복해 응한다"
 ALG_morocco.2.b: "압력에 저항하고 제재를 감수한다"
 Algeria_events.5.t: "밀렵 방지 운동 성공"
 Algeria_events.5.desc: "우리의 조율된 노력 덕분에 지난 몇 달간 멸종 위기 동물 수백 마리가 보호되었습니다. 이는 불법 사냥을 줄였을 뿐 아니라 취약한 사막 생태계를 보존하여 해당 지역의 사막화 진행을 늦추는 데에도 도움이 되었습니다."
 Algeria_events.5.a: "훌륭하다"
 Algeria_events.6.t: "밀렵 방지 운동 실패"
 Algeria_events.6.desc: "야생동물을 보호하려는 시도에도 불구하고 밀렵꾼들은 여전히 평소처럼 활동을 이어 가고 있습니다. 사막 생태계는 계속 위협받고 있으며, 우리 운동은 사막화나 불법 사냥을 억제하는 데 거의 효과가 없었습니다."
 Algeria_events.6.a: "그 모든 노력이 헛수고였다!"
 ALG_ethnic_arab_display: "아랍인: [?ALG_ethnic_arab]%"
 ALG_ethnic_kabyle_display: "카빌족: [?ALG_ethnic_kabyle]%"
 ALG_kabyle_content: "카빌족 협력"
 ALG_kabyle_content_desc: "전통적으로 교육 수준이 높은 카빌족은 국가 발전과 연구에 열정적으로 기여하고 있습니다."
 ALG_kabyle_discontent: "카빌 자치 운동"
 ALG_kabyle_discontent_desc: "카빌족 활동가들이 타마지그트어 인정과 더 큰 지역 자치를 요구하는 시위를 조직하고 있습니다. 검은 봄의 그림자가 드리우고 있습니다."
 ALG_kabyle_unrest: "카빌리아 위기"
 ALG_kabyle_unrest_desc: "카빌 지역이 공공연한 반란 상태에 있습니다. 시위와 파업, 시민 불복종이 지역을 마비시키고 있습니다. 긴급한 조치가 필요합니다."
 ALG_black_spring_happened: "검은 봄 발생함"
 ALG_has_conducted_census: "전국 인구 조사 실시함"
 ALG_ethnic_system_active: "민족 업무 체계 수립됨"
 ALG_can_enact_ethnic_policy: "새 민족 정책 시행 가능"
 algeria_power_balance: "알제리 정치 투쟁"
 algeria_old_guard: "르 푸부아르 (구세력)"
 algeria_reformists: "히라크 운동 (개혁파)"
 algeria_compromise_range: "위태로운 타협"
 algeria_compromise_range_desc: "어느 쪽도 우세하지 않습니다. 두 파벌이 우위를 점하려 책략을 쓰는 가운데 불안한 교착 상태가 이어집니다."
 old_guard_leaning: "구세력의 영향력"
 old_guard_leaning_desc: "군부 기득권이 전통적 지배력을 되찾기 시작합니다."
 old_guard_partial_control: "구세력의 공고화"
 old_guard_partial_control_desc: "르 푸부아르가 장악력을 조입니다. 개혁파의 목소리가 소외됩니다."
 old_guard_strong_control: "권위주의로의 표류"
 old_guard_strong_control_desc: "보안 기구가 정치 생활을 지배합니다. 민주적 제도가 침식됩니다."
 old_guard_full_control: "군부 지배"
 old_guard_full_control_desc: "르 푸부아르가 알제리를 철권으로 통제합니다. 시민의 자유가 심각하게 제한됩니다."
 reformists_leaning: "개혁의 꿈틀거림"
 reformists_leaning_desc: "시민사회가 대담해집니다. 히라크의 정신이 되살아납니다."
 reformists_gaining_ground: "개혁의 탄력"
 reformists_gaining_ground_desc: "개혁 운동이 힘을 얻습니다. 구세력은 통제를 유지하려 애씁니다."
 reformists_strong_momentum: "민주주의의 급물살"
 reformists_strong_momentum_desc: "개혁파가 공론을 주도합니다. 진정한 변화가 가능해 보입니다."
 reformists_victory: "민주적 전환"
 reformists_victory_desc: "알제리가 문민 통치와 다원주의를 받아들입니다. 르 푸부아르의 장악력이 무너졌습니다."
 ALG_political_struggle: "알제리 정치 투쟁"
 ALG_political_struggle_desc: "구세력과 개혁파 사이의 싸움이 알제리의 미래를 결정할 것입니다.\n현재 균형: [ALG_power_struggle_state]\n군의 장악력: [ALG_army_grip_text]\n국민 불만: [ALG_grievance_text]"
 ALG_power_struggle_state: "정치 상황"
 ALG_boost_reformists_tt: "개혁파 정치인과 시민사회 단체에 자원을 투입합니다.\n균형이 개혁파 쪽으로 §G+0.15§! 이동합니다."
 ALG_boost_old_guard_tt: "군 퇴역 군인과 보안 기득권 사이의 지지를 다집니다.\n균형이 구세력 쪽으로 §R-0.15§! 이동합니다."
 ALG_rally_students_tt: "개혁을 지지하는 학생 운동과 청년 활동가를 동원합니다.\n균형이 개혁파 쪽으로 §G+0.08§! 이동합니다."
 ALG_mobilize_veterans_tt: "독립전쟁 참전 용사와 퇴역 장교를 규합합니다.\n균형이 구세력 쪽으로 §R-0.08§! 이동합니다."
 ALG_bribe_elites_tt: "후원을 통해 엘리트의 충성을 확보합니다.\n균형이 구세력 쪽으로 §R-0.05§! 이동합니다.\n국고에서 §R30§! 소모. 부패를 조장할 위험이 있습니다."
 ALG_compromise_tt: "개혁파와 구세력 사이의 권력 분점 합의를 중재합니다.\n균형이 중앙 쪽으로 §W±0.08§! 이동합니다."
 ALG_media_campaign_reform_tt: "민주적 가치를 장려하는 언론 캠페인을 시작합니다.\n균형이 개혁파 쪽으로 §G+0.05§! 이동합니다."
 ALG_security_crackdown_tt: "보안군이 반대 의견을 탄압하도록 승인합니다.\n균형이 구세력 쪽으로 §R-0.05§! 이동합니다."
 ALG_world_tension_security_tt: "세계적 불안정이 더 강력한 보안 기구를 정당화합니다.\n균형이 구세력 쪽으로 §R-0.08§! 이동합니다."
 ALG_world_tension_high_security_tt: "심각한 세계적 긴장은 비상한 보안 조치를 요구합니다.\n균형이 구세력 쪽으로 §R-0.12§! 이동합니다."
 ALG_crackdown_momentum_tt: "우리의 탄압 정책이 구세력의 입지를 강화합니다.\n균형이 구세력 쪽으로 §R-0.10§! 이동합니다."
 ALG_reconciliation_momentum_tt: "우리의 화해 접근이 개혁파의 목소리에 힘을 실어 줍니다.\n균형이 개혁파 쪽으로 §G+0.10§! 이동합니다."
 ALG_oil_patronage_tt: "석유 수익을 후원망 자금으로 사용합니다.\n균형이 구세력 쪽으로 §R-0.06§! 이동합니다.\n국고에서 §R25§! 소모되지만 안정도가 증가합니다."
 ALG_economic_reforms_tt: "경제 자유화와 투명성 조치를 시행합니다.\n균형이 개혁파 쪽으로 §G+0.08§! 이동합니다."
 ALG_elite_patronage: "엘리트 후원망"
 ALG_elite_patronage_desc: "우리는 후원을 통해 안정을 사들이고 있지만, 이는 부패를 심화하고 자원을 고갈시킵니다."
 alg_politics.10.t: "타협 회담"
 alg_politics.10.d: "양측 파벌의 대표들이 비밀리에 만났습니다. 타협이 이루어졌습니다. 그러나 양측 모두 이를 지킬까요?"
 alg_politics.10.a: "합의를 수락한다"
 alg_politics.10.b: "거부하고 투쟁을 계속한다"
 alg_politics.20.t: "개혁파, 권력 장악"
 alg_politics.20.d: "개혁 운동이 임계점에 도달했습니다. 구세력은 물러날 것인가, 맞서 싸울 것인가의 선택에 직면합니다."
 alg_politics.20.a: "민주적 전환을 받아들인다"
 alg_politics.20.b: "군은 항복하지 않을 것이다"
 alg_politics.21.t: "군사 쿠데타 임박"
 alg_politics.21.d: "장군들이 권력을 공고히 하고 문민 개혁파를 배제하려 움직이고 있습니다."
 alg_politics.21.a: "군의 권위를 받아들인다"
 alg_politics.21.b: "개혁 운동을 수호한다"
 alg_politics.22.t: "알제에 드리운 그림자"
 alg_politics.22.d: "보안 기득권이 대담해지고 있습니다. 알제리는 권위주의로 표류하고 있습니다. 어떻게 대응해야 합니까?"
 alg_politics.22.a: "안보가 최우선이다"
 alg_politics.22.b: "너무 늦기 전에 긴장을 완화한다"
 alg_politics.23.t: "변화의 바람"
 alg_politics.23.d: "개혁 운동이 더 강해지고 있습니다. 그러나 르 푸부아르는 여전히 보안군을 장악하고 있습니다. 어떻게 나아가야 합니까?"
 alg_politics.23.a: "개혁을 밀어붙인다"
 alg_politics.23.b: "반발을 피하기 위해 속도를 늦춘다"
 ALG_political_truce: "정치적 휴전"
 ALG_political_truce_desc: "개혁파와 구세력 사이에 위태로운 타협이 유지되고 있습니다."
 ALG_tamazight_integration_process: "타마지그트어 통합 과정"
 ALG_tamazight_integration_process_desc: "타마지그트어의 공식 인정이 국가 기관 전반에서 시행되고 있습니다. 이로 인해 지역들은 대체로 안정되었지만, 관료적 전환과 국가 정체성의 조정으로 인해 완전한 사회 결속으로 나아가는 동안 일시적인 마찰기가 발생합니다."
 ALG_auto.1.t: "자동차 산업 스캔들"
 ALG_auto.1.desc: "알제리 자동차 산업의 광범위한 부패가 드러났습니다. 르노, BMW, 메르세데스를 비롯한 여러 외국 파트너사가 뇌물 수수와 수입 사기 행위에 연루된 것으로 드러났습니다. 국민은 분노하며 조치를 요구하고 있습니다."
 ALG_auto.1.a: "전면 조사를 시작한다"
 ALG_auto.1.b: "사건을 은폐한다"
 ALG_auto.2.t: "자동차 스캔들에 대한 대응"
 ALG_auto.2.desc: "스캔들 조사 이후, 앞으로 자동차 수입을 어떻게 다룰지 결정해야 합니다. 전면 금지는 강력한 메시지를 보내겠지만 우리 경제에 타격을 줄 것입니다. 부분적 규제는 절충안을 제공합니다."
 ALG_auto.2.a: "전면 수입 금지를 시행한다"
 ALG_auto.2.b: "부분 규제를 시행한다"
 ALG_auto.2.c: "수입에 대해 아무 조치도 취하지 않는다"
 ALG_auto.3.t: "피아트, 제휴 제안"
 ALG_auto.3.desc: "이탈리아 자동차 제조사 피아트가 알제리에 생산 시설을 세우자는 제안을 해 왔습니다. 그들은 수입 규제 이후의 우리 시장에서 기회를 보고 있습니다. 이는 우리 자동차 부문을 되살릴 수 있습니다."
 ALG_auto.3.a: "피아트의 제안을 수락한다"
 ALG_auto.3.b: "더 나은 조건을 협상한다"
 ALG_auto.3.c: "제안을 거절한다"
 ALG_auto.4.t: "자동차 부문 회복"
 ALG_auto.4.desc: "스캔들에 대한 우리의 절제된 대응 이후 자동차 부문이 안정되기 시작하고 있습니다. 국내 제조사들은 확장에 관심을 보이고 있으며, 외국 기업들도 계속 접근해 오고 있습니다."
 ALG_auto.4.a: "국내 제조사를 지원한다"
 ALG_auto.4.b: "외국의 제안을 검토한다"
 ALG_auto.5.t: "우리 조건을 수락한 피아트"
 ALG_auto.5.desc: "우리 협상단이 성공했습니다. 피아트는 추가 투자와 기술 이전을 포함한 더 유리한 조건에 동의했습니다. 이는 알제리 산업에 중대한 승리입니다."
 ALG_auto.5.a: "훌륭한 소식이다!"
 ALG_auto.6.t: "피아트의 재협상 거부"
 ALG_auto.6.desc: "피아트가 더 나은 조건에 대한 우리의 요구를 거부했습니다. 그들은 원래의 제안이 충분히 공정하다고 주장합니다. 그들의 조건을 수락할지, 아예 손을 뗄지 결정해야 합니다."
 ALG_auto.6.a: "원래 조건을 수락한다"
 ALG_auto.6.b: "거래에서 손을 뗀다"
 ALG_corruption_auto_scandal: "자동차 산업 부패 스캔들"
 ALG_corruption_auto_scandal_desc: "자동차 산업의 광범위한 부패가 폭로되면서 대중의 신뢰가 흔들렸습니다. 조사가 계속되는 가운데 외국 파트너들은 거리를 두고 있습니다. 우리의 산업 생산과 정치적 자산이 큰 타격을 입었습니다."
 ALG_corruption_auto_scandal_coverup: "은폐된 자동차 스캔들"
 ALG_corruption_auto_scandal_coverup_desc: "우리는 자동차 산업 스캔들 보도를 은폐하려 했습니다. 당장의 피해는 억제되었지만, 외국 정보기관은 우리의 기만을 알고 있고 국내 야당 단체들은 우리를 공격할 빌미를 쥐고 있습니다. 진실은 언젠가 드러날 수 있습니다."
 ALG_import_ban_penalty: "자동차 수입 금지"
 ALG_import_ban_penalty_desc: "부패 스캔들 이후 자동차 수입 전면 금지가 시행되었습니다. 이는 외국의 착취에 맞서는 강력한 메시지를 보내지만, 공급망과 산업 생산을 심각하게 교란했습니다. 소비자들은 물량 부족과 가격 상승에 직면해 있습니다."
 ALG_import_restrictions_light: "자동차 수입 규제"
 ALG_import_restrictions_light_desc: "자동차 수입에 대한 부분 규제가 시행되었습니다. 이 절제된 접근은 일부 무역 관계를 유지하면서 부패 스캔들에 대한 대중의 분노를 달랩니다. 경제적 영향은 감당할 만하지만 여전히 눈에 띕니다."
 ALG_4g_rollout_tt: "§G알제리가 전국 4G 이동통신망을 개통합니다:§!\n- 고속 모바일 인터넷\n- 기업 연결성 개선\n- 디지털 서비스 확대"
 ALG_4g_coverage_basic: "4G 커버리지 - 기본"
 ALG_4g_coverage_basic_desc: "우리의 4G 망은 가동 중이지만 커버리지는 주요 도시 중심지로 제한되어 있습니다. 기반시설에 대한 지속적인 투자가 필요합니다."
 ALG_4g_coverage_moderate: "4G 커버리지 - 보통"
 ALG_4g_coverage_moderate_desc: "4G 커버리지가 이제 대부분의 도시와 읍으로 확장되었습니다. 기업과 시민이 향상된 연결성의 혜택을 보고 있습니다."
 ALG_4g_coverage_good: "4G 커버리지 - 양호"
 ALG_4g_coverage_good_desc: "알제리 대부분 지역에 강력한 4G 커버리지가 갖춰졌습니다. 디지털 경제가 번성하고 생산성이 오르고 있습니다."
 ALG_4g_coverage_excellent: "4G 커버리지 - 우수"
 ALG_4g_coverage_excellent_desc: "전국 4G 커버리지를 달성했습니다! 알제리는 이제 모바일 연결성에서 지역 선도국입니다. 5G 개발을 위한 토대가 마련되었습니다."
 algerian_event.51.t: "알제리 우주선의 달 착륙 성공!"
 algerian_event.51.desc: "알제리 우주청(ASAL)이 역사적 이정표를 달성했습니다! 우리의 달 착륙선이 달 표면 연착륙을 성공적으로 완수하여, 알제리는 이 위업을 이룬 역사상 다섯 번째 국가가 되었습니다.\n\n하강 장면은 전국에 생중계되었고, 수백만 알제리인이 우리 우주선이 달 남극 근처에 착륙하는 모습을 경이롭게 지켜보았습니다. 원격 측정 데이터가 성공적인 착륙을 확인하자 알제의 관제 센터 과학자들은 환호성을 터뜨렸습니다.\n\n이 성과로 알제리는 소련, 미국, 중국, 인도와 함께 달 연착륙이 가능한 엘리트 국가 클럽에 이름을 올렸습니다. 이는 우리 우주 계획에 대한 수십 년간의 투자의 결실이며 알제리가 주요 우주 강국으로 부상했음을 알리는 신호입니다.\n\n녹색과 흰색의 깃발이 달에 꽂히는 모습을 세계가 감탄하며 지켜봅니다."
 algerian_event.51.a: "알제리를 위한 위대한 도약!"
 ALG_missile_leverage: "미사일 협상력"
 ALG_missile_leverage_desc: "중국과의 관계는 첨단 미사일 기술을 확보할 기회를 제공합니다. 우리의 외교 관계와 전략적 위치를 활용하여 지상 발사 순항 미사일과 이동식 발사 플랫폼의 이전을 협상할 수 있습니다. 이는 알제리의 억지 역량을 크게 높일 것입니다."
 ALG_build_nuclear_reactor_tt: "§G원자로 건설:§!\n- 민간 원자력 발전 역량 확립\n- 화석 연료 의존도 감소\n- 원자력 과학자 및 기술자 양성\n- 첨단 원자력 연구의 토대"
 ALG_election_pending: "국가 선거 임박"
 ALG_opposition_reforms_1: "야당 개혁: 언론 자유"
 ALG_opposition_reforms_1_desc: "야당 정부는 언론 자유를 보장하며 개혁 계획을 시작했습니다. 자유 언론은 이제 정부에 책임을 묻고 대중에게 정보를 제공합니다."
 ALG_opposition_reforms_2: "야당 개혁: 사법 제도"
 ALG_opposition_reforms_2_desc: "언론 개혁에 이어 야당 정부는 사법부를 개혁했습니다. 독립적인 법원이 이제 모든 알제리인에게 정의를 보장하고 부패와 싸웁니다."
 ALG_opposition_reforms_3: "야당 개혁: 교육"
 ALG_opposition_reforms_3_desc: "야당의 개혁 계획은 교육에 대한 대규모 투자로 이어집니다. 현대화된 제도가 알제리의 청년들이 앞으로의 도전에 대비하게 하고 있습니다."
 ALG_opposition_reforms_4: "알제리의 새 시대"
 ALG_opposition_reforms_4_desc: "야당의 포괄적 개혁 계획이 완료되었습니다. 알제리는 현대적이고 민주적이며 번영하는 국가로 탈바꿈했습니다. 자유 언론, 독립 법원, 양질의 교육, 경제적 기회가 이 새 시대를 규정합니다."
 ALG_fis_movement: "이슬람 구국 운동"
 ALG_fis_movement_desc: "FIS는 이슬람 민주주의, 사회 정의, 반부패라는 메시지로 알제리 국민을 고무했습니다. 사원은 정부가 방치한 사회 서비스를 제공하는 공동체 센터 역할을 합니다. 대중의 지지는 날마다 커지고 있습니다."
 ALG_fln.1.t: "알제리를 뒤흔든 부패 스캔들"
 ALG_fln.1.desc: "탐사 보도 기자들이 알제리 정치 기득권 전반에 걸친 부패의 그물망을 밝혀냈습니다. 은행 기록은 공적 자금 수백만이 사적 계좌로 빼돌려졌음을 보여 줍니다. 우리 FLN 당원을 포함한 여러 정당이 연루된 것으로 보입니다.\n\n스캔들은 대중의 눈앞에 터져 나왔고 우리는 이를 무시할 수 없습니다. 증거는 치명적이지만, 우리의 대응 방식에 따라 정치 체제 전체가 안정될 수도, 불안정해질 수도 있습니다. 행동 방침을 신중하게 결정해야 합니다."
 ALG_fln.1.a: "사건을 묻어 버린다"
 ALG_cover_up_corruption_tt: "§R스캔들 은폐:§!\n• 부패가 크게 증가\n• 소폭의 정치력 손실\n• FLN 평판이 약간 손상\n• 당분간 안정도 유지\n\n§7\\"국민이 모르는 것은 국민을 해치지 않는다.\\"§!"
 ALG_fln.1.b: "야당에게 책임을 돌린다"
 ALG_blame_others_tt: "§Y야당에게 책임 전가:§!\n• 부패 증가\n• 야당이 큰 타격\n• FLN이 약간의 지지를 얻음\n• 일부 안정도 손실\n\n§7\\"진짜 범죄자는 바로 그들이다!\\"§!"
 ALG_fln.1.c: "진실이 드러나게 한다"
 ALG_expose_all_tt: "§G모든 부패 폭로:§!\n• 모든 정당이 타격(FLN 포함)\n• 상당한 안정도 손실\n• 막대한 정치력 비용\n• 그러나 부패는 감소\n• 반부패 동력(1년간 보너스)\n\n§7\\"국민에게는 진실을 알 권리가 있다.\\"§!"
 ALG_fln.1.e: "전면적인 반부패 운동을 시작한다"
 ALG_anti_corruption_campaign_tt: "§G반부패 운동 시작:§!\n• 모든 정당이 타격(FLN 포함)\n• 막대한 국고 비용(§R-15§!)\n• 막대한 정치력 비용(§R-100§!)\n• 그러나 부패가 크게 감소\n• §G영구적인 반부패 개혁§!\n• 장기적인 안정도 증가\n\n§7\\"이 암덩어리를 완전히 도려낼 것이다!\\"§!"
 ALG_anti_corruption_momentum: "반부패 동력"
 ALG_anti_corruption_momentum_desc: "부패의 폭로는 개혁에 대한 대중의 요구에 불을 붙였습니다. 고통스럽기는 하지만 이 투명성의 순간이 긍정적 변화의 동력을 만들어 냈습니다."
 ALG_anti_corruption_reforms: "반부패 개혁"
 ALG_anti_corruption_reforms_desc: "정부 전반에 포괄적인 반부패 조치가 시행되었습니다. 투명한 조달, 독립 감사관, 내부고발자 보호가 비리를 줄이고 대중의 신뢰를 회복하고 있습니다."
 ALG_fln.2.t: "소나트라크 부패 스캔들"
 ALG_fln.2.desc: "알제리 국영 석유회사 소나트라크에서 대규모 부패 스캔들이 터졌습니다. 조사 결과 가짜 계약과 역외 계좌를 통해 수십억이 횡령된 것으로 드러났습니다. 고위 임원과 외국 파트너들이 연루되었습니다.\n\n국민은 해명을 요구하고 있습니다. 어떻게 대응하시겠습니까?"
 ALG_fln.2.a: "은폐한다"
 ALG_fln.2.b: "부패를 조사한다"
 ALG_fln.2.c: "야당에게 책임을 돌린다"
 ALG_fln.3.t: "히라크의 각성"
 ALG_fln.3.desc: "수백만 알제리인이 변화를 요구하는 대규모 운동으로 거리에 나섰습니다. 히라크 시위는 젊은이와 늙은이, 세속주의자와 종교인을 막론하고 모든 분열을 넘어 사람들을 하나로 묶었습니다.\n\n\\"예트나하우 가3!\\"(모두 물러나라!) 구호가 모든 도시에 울려 퍼집니다.\n\n구질서가 떨고 있습니다. 국민이 목소리를 찾았습니다."
 ALG_fln.3.a: "국민이 말했다."
 ALG_grievance_increase_5_tt: "§Y국민 불만:§! +5"
 ALG_cover_up_scandal: "스캔들 은폐"
 ALG_cover_up_scandal_desc: "소나트라크 부패 스캔들은 묻혔지만 소문은 계속됩니다. 외국 정보기관이 은폐를 알고 있으며, 진실은 언제든 다시 수면 위로 떠오를 수 있습니다."
 ALG_anti_corruption_probe: "반부패 조사"
 ALG_anti_corruption_probe_desc: "소나트라크 부패에 대한 철저한 조사가 진행 중입니다. 평소의 업무를 방해하기는 하지만, 이 조사는 대중의 신뢰를 회복하고 부패 관리를 뿌리 뽑고 있습니다."
 ALG_shift_blame: "야당에 책임 전가"
 ALG_shift_blame_desc: "정부는 소나트라크 스캔들에 대한 대중의 분노를 야당 쪽으로 성공적으로 돌렸습니다. 효과적인 선전이기는 하지만 이러한 화살 돌리기는 근본적인 부패를 해결하지는 못합니다."
 ALG_mass_protests: "대규모 시위"
 ALG_mass_protests_desc: "히라크 운동이 알제리 전역에서 수백만 명을 거리로 이끌어 냈습니다. 국민이 근본적인 변화를 요구하면서 경제 활동이 교란되고 있습니다. 구질서가 흔들리고 있습니다."
 ALG_FLN_chosen: "FLN의 길 선택됨"
 ALG_fln_opp_path: "FLN 야당의 길"
 ALG_domestic_development_focus: "국내 개발 집중"
 ALG_domestic_development_focus_desc: "알제리는 해외 확장보다 자국 발전에 투자하기로 했습니다. 기반시설 사업, 산업 개발, 사회 계획이 국가를 현대적이고 번영하는 나라로 변모시키고 있습니다."
 ALG_middle_east_expansion: "중동 확장"
 ALG_middle_east_expansion_desc: "우리 군대가 중동을 향해 진군합니다. 병사들은 보급이 충분하며 영광과 정복의 환상에 고무되어 있습니다."
 ALG_de_arabisation_effect_TT: "§Y탈아랍화 정책:§!\n\n§G 베르베르어 부흥§!\n  타마지그트어가 공동 공용어가 됩니다\n\n§G 문화 인정§!\n  아마지그 정체성이 국가적으로 기려집니다\n\n§G 교육 개혁§!\n  학교에서 베르베르 역사를 가르칩니다\n\n§R결과:§!\n  -아랍 민족주의자의 지지\n  -아랍 연맹과의 관계\n  +카빌 지역 안정도"
 ALG_civil_reforms_1: "시민권 보호"
 ALG_civil_reforms_1_desc: "알제리는 기본적인 시민권 보호를 확립했습니다. 시민들은 더 큰 자유를 누리며 추가 개혁을 위한 토대가 마련되었습니다."
 ALG_civil_reforms_2: "시민권 및 성평등"
 ALG_civil_reforms_2_desc: "시민권 개혁에 이어 알제리는 성평등을 진전시켰습니다. 더 많은 여성이 노동 시장에 진입하여 생산성과 성장을 높이고 있습니다."
 ALG_civil_reforms_3a: "시민 개혁: 언론 자유"
 ALG_civil_reforms_3a_desc: "알제리의 개혁 계획에 이제 언론 자유가 포함됩니다. 독립 언론이 정부에 책임을 묻는 가운데 시민권과 성평등이 계속해서 사회를 변화시키고 있습니다."
 ALG_civil_reforms_3b: "시민 개혁: 사법 독립"
 ALG_civil_reforms_3b_desc: "알제리의 개혁 계획에 이제 독립적인 사법부가 포함됩니다. 공정한 법원이 부패와 싸우는 가운데 시민권과 성평등이 계속해서 사회를 변화시키고 있습니다."
 ALG_civil_reforms_4: "시민사회 전면 개혁"
 ALG_civil_reforms_4_desc: "알제리는 포괄적인 시민사회 개혁을 완료했습니다. 시민권, 성평등, 언론 자유, 사법 독립, 힘을 얻은 시민사회 단체들이 알제리를 현대적 민주주의 국가로 탈바꿈시켰습니다."
 ALG_gov_reforms_1: "디지털 정부 구상"
 ALG_gov_reforms_1_desc: "알제리는 정부 서비스의 디지털화를 시작했습니다. 온라인 플랫폼이 공공 서비스 제공을 개선하고 관료적 비효율을 줄입니다."
 ALG_gov_reforms_2: "공공 서비스 개혁"
 ALG_gov_reforms_2_desc: "디지털 기반 위에서 알제리는 공공 서비스를 개혁했습니다. 시민들은 더 빠르고 효율적인 정부 서비스를 누립니다."
 ALG_gov_reforms_3a: "반부패 개혁"
 ALG_gov_reforms_3a_desc: "알제리의 반부패 운동이 정부 기관을 정화했습니다. 투명성과 책임성이 회복되었습니다."
 ALG_gov_reforms_3b: "전자정부 체계"
 ALG_gov_reforms_3b_desc: "알제리의 전자정부 포털은 시민들이 온라인으로 정부 서비스에 원활하게 접근할 수 있게 합니다. 관료적 효율이 극적으로 개선되었습니다."
 ALG_gov_reforms_4: "현대적 행정 국가"
 ALG_gov_reforms_4_desc: "알제리는 완전히 현대화되고 효율적이며 투명한 정부를 달성했습니다. 디지털 서비스, 반부패 조치, 간소화된 관료제가 새로운 행정부를 규정합니다."
 ALG_african_union_engagement_full_tt: "§G아프리카 연합 관여:§!\n\n§Y모든 AU 회원국에 대한 효과:§!\n• 알제리에 대한 관계 §G+25§!\n• 알제리 영향력 §G+2%§!\n\n알제리는 아프리카 문제에서 선도적 목소리로서의 입지를 강화합니다."
 ALG_mend_ties_with_rabat: "라바트와의 관계 회복"
 ALG_mend_ties_with_rabat_desc: "알제리-모로코 국경은 1994년부터 폐쇄되어 있습니다. 서사하라 분쟁, 1963년의 모래 전쟁, 냉전기의 진영 구도가 두 나라 사이에 깊은 상처를 남겼습니다.\n\n그러나 우리는 같은 아마지그와 아랍의 유산, 식민주의에 맞선 같은 투쟁, 그리고 국민을 위한 같은 희망을 공유합니다. 이제 과거를 뒤로하고 모로코 왕국과 새로운 관계를 구축할 때일지도 모릅니다."
 ALG_our_east_brothers: "동쪽의 형제들"
 ALG_our_east_brothers_desc: "알제리와 튀니지는 프랑스 식민주의에 맞서 함께 싸웠습니다. 튀니지 땅은 독립 전쟁 중 알제리 난민과 FLN 전사들을 보호했습니다.\n\n이 형제애는 강화되어야 합니다. 알제리와 튀니지는 함께 통합된 마그레브의 핵심을 이루고 북아프리카를 번영하는 미래로 이끌 수 있습니다."
 ALG_black_spring: "검은 봄"
 ALG_black_spring_desc: "2001년 4월 18일, 젊은 카빌족 학생 마시니사 게르마가 베니 두알라의 헌병대 안에서 총에 맞아 사망했습니다. 그의 죽음은 독립 이후 카빌리아에서 가장 큰 시위를 촉발했고, 보안군에 의해 100명 넘게 사망했습니다. 검은 봄이 시작되었습니다."
 ALG_black_spring_tt: "§H검은 봄이 폭발하다§!\n마시니사 게르마의 죽음이 카빌리아 전역에서 대규모 시위를 촉발합니다. 헌병대에 의해 시위자 100명 이상이 사망했습니다.\n\n§Y카빌족의 요구:§!\n- 사망자에 대한 정의\n- 헌병대 철수\n- 타마지그트어 공인\n- '호그라'(멸시)의 종식"
 ALG_negotiate_with_arrouch: "아루슈와 협상"
 ALG_negotiate_with_arrouch_desc: "아루슈(마을 평의회)는 카빌족의 요구를 대변하는 조율된 운동으로 조직되었습니다. 대결 대신 이 전통적 구조와 대화에 나설 것입니다."
 ALG_negotiate_arrouch_tt: "§H아루슈 운동§!\n전통적인 카빌 마을 회의체가 하나로 뭉쳐 요구 사항을 제시했습니다. 협상은 평화를 가져올 수 있습니다.\n\n§Y아루슈의 핵심 요구:§!\n- 엘크쇠르 강령 인정\n- 타마지그트어 권리\n- 경제 개발\n- 군 주둔 종식"
 ALG_recognize_tamazight_2002: "타마지그트어: 국어"
 ALG_recognize_tamazight_2002_desc: "2002년 4월 8일, 치열한 협상 끝에 타마지그트어가 알제리의 국어로 인정될 것입니다. 이는 베르베르 정체성에 대한 역사적 양보입니다."
 ALG_tamazight_national_tt: "§H타마지그트어가 국어가 되다§!\n역사적인 순간입니다. 타마지그트어가 아랍어와 함께 알제리의 국어가 됩니다.\n\n§Y의의:§!\n- 베르베르 정체성의 첫 공인\n- 헌법 개정\n- 학교에서 타마지그트어 교육 가능\n- §G카빌족의 대승리§!"
 ALG_address_hogra: "호그라 해소"
 ALG_address_hogra_desc: "호그라, 즉 카빌족이 국가로부터 느끼는 멸시와 굴욕은 해소되어야 합니다. 투자와 일자리, 존중이 방치와 학대를 대체할 것입니다."
 ALG_address_hogra_tt: "§H호그라 종식§!\n카빌족에게 체계적으로 보여 온 멸시인 '호그라'는 다음을 통해 해소됩니다.\n\n- 카빌리아 기반시설 투자\n- 일자리 창출 계획\n- 차별적 관행 종식\n- 카빌족의 존엄 존중"
 ALG_amazigh_cultural_revival: "아마지그 문화 부흥"
 ALG_amazigh_cultural_revival_desc: "베르베르 문화 기관, 박물관, 교육 사업에 대한 투자로 아랍인이 도래하기 이전부터 이어진 아마지그 유산을 보존하고 기릴 것입니다."
 ALG_amazigh_revival_tt: "§H아마지그 문화 르네상스§!\n- 아마지그 아카데미 설립\n- 베르베르 박물관 자금 지원\n- 문화 축제 지원\n- 티피나그 문자 보급"
 ALG_yennayer_national_holiday: "옌나이르 국경일"
 ALG_yennayer_national_holiday_desc: "2017년 12월, 부테플리카 대통령은 아마지그 새해인 옌나이르를 국경일로 선포했습니다. 이제 1월 12일은 알제리 전역에서 기념됩니다."
 ALG_yennayer_tt: "§H옌나이르가 국경일이 되다§!\n베르베르 새해(1월 12일)가 이제 알제리의 공식 공휴일입니다.\n\n§Y역사적 인정:§!\n- 이슬람 이전 유산을 기림\n- 국가 단결 강화\n- §G카빌족 만족도 증가§!"
 ALG_tamazight_official_2016: "타마지그트어: 공용어"
 ALG_tamazight_official_2016_desc: "2016년 헌법 개정은 타마지그트어를 '국어'에서 '공용어'의 지위로 격상시켜 아랍어와 동등한 위치에 놓습니다."
 ALG_tamazight_official_tt: "§H타마지그트어가 공용어가 되다§!\n§W2016년 헌법 개정:§!\n- 타마지그트어가 아랍어와 동등\n- 모든 정부 문서가 이중 언어로 작성\n- 모든 학교에서 베르베르어 교육\n- §G헌법상의 대승리§!"
 ALG_berber_integration_complete: "다양성 속의 단결"
 ALG_berber_integration_complete_desc: "대화와 인정, 투자를 통해 알제리는 카빌 문제를 해결했습니다. 아랍계와 아마지그계 알제리인이 하나로 뭉쳤습니다."
 ALG_integration_complete_tt: "§H카빌 문제 해결§!\n알제리는 다음을 통해 베르베르 인구를 성공적으로 통합했습니다.\n- 언어 인정\n- 문화 투자\n- 경제 개발\n- 존중과 대화\n\n§G국가 단결 달성!§!"
 ALG_crush_the_uprising: "봉기 진압"
 ALG_crush_the_uprising_desc: "검은 봄은 국가 단결을 위협합니다. 헌병대가 질서를 회복하고 분리주의 분자들은 무력화될 것입니다."
 ALG_crush_uprising_tt: "§H진압의 길§!\n무력을 사용해 시위를 끝내고 알제리의 영토 보전을 유지합니다.\n\n§Y이점:§!\n- 모든 영토 유지\n- 분리주의자에 대한 양보 없음\n- 군의 통제\n\n§R대가:§!\n- 국제적 비난\n- 카빌족의 깊은 원한\n- 지속되는 저항"
 ALG_gendarmerie_reinforcement: "헌병대 증강"
 ALG_gendarmerie_reinforcement_desc: "질서를 유지하고 향후 불안을 막기 위해 추가 헌병대 부대가 카빌리아에 배치될 것입니다."
 ALG_gendarmerie_tt: "§H보안군 배치§!\n- 헌병대 주둔 증가\n- 시위 감시\n- 주요 활동가 구금\n- 무력으로 질서 유지"
 ALG_arabization_policy: "아랍화 정책"
 ALG_arabization_policy_desc: "아랍어는 알제리의 언어입니다. 분리주의적 베르베르주의 이념에 맞서 카빌리아에서 아랍화 계획을 강화합니다."
 ALG_arabization_1_tt: "§H아랍화 강화§!\n- 아랍어 전용 교육 강제\n- 타마지그트어 탄압\n- 이슬람 정체성 장려\n- 베르베르주의 이념에 대응\n\n§R카빌족이 깊이 원망할 것입니다§!"
 ALG_ban_mak: "MAK 금지"
 ALG_ban_mak_desc: "2021년 5월, 페르하트 메헤니가 이끄는 카빌리아 자결운동(MAK)이 테러 조직으로 지정되어 금지될 것입니다."
 ALG_ban_mak_tt: "§HMAK, 테러 조직으로 지정§!\n카빌리아 자결운동이 금지됩니다.\n- 페르하트 메헤니를 테러리스트로 규정\n- MAK 지지자 체포\n- 분리주의 활동 범죄화\n\n§R국제적 비난이 예상됩니다§!"
 ALG_accuse_foreign_interference: "외세 개입 비난"
 ALG_accuse_foreign_interference_desc: "MAK 분리주의 운동은 자생적인 것이 아니라 알제리를 불안정하게 만들려는 외세의 자금과 지원을 받고 있습니다. 모로코와 다른 나라들이 폭로되어야 합니다."
 ALG_foreign_interference_tt: "§H외세에 책임 전가§!\nMAK가 외국의 대리 세력이라고 비난받습니다.\n- 모로코가 MAK에 자금을 댔다고 비난\n- 알제리를 겨냥한 외부 음모\n- 적에 맞선 국가 단결\n\n§R외교적 긴장도가 증가합니다§!"
 ALG_mak_israel_connection: "MAK-이스라엘 연계"
 ALG_mak_israel_connection_desc: "페르하트 메헤니와 이스라엘 관리들의 회동은 MAK가 아랍 세계를 분열시키려는 시온주의 기획임을 입증합니다. 이 연계는 폭로되어야 합니다."
 ALG_mak_israel_tt: "§HMAK-이스라엘 연계 폭로§!\n- MAK를 시온주의 기획으로 규정\n- 이스라엘을 불안정 조장으로 비난\n- 아랍 연맹의 지지를 얻음\n- 반이스라엘 정서 동원\n\n§Y국내 지지 §G증가§!§!\n§R이스라엘과의 관계가 파괴됩니다§!"
 ALG_kabylie_pacified: "카빌리아 평정"
 ALG_kabylie_pacified_desc: "보안 작전과 정치적 탄압을 통해 카빌리아가 통제 하에 들어왔습니다. 분리주의의 위협은 억제되었습니다."
 ALG_kabylie_pacified_tt: "§H카빌리아 통제됨§!\n- MAK 분쇄\n- 분리주의 범죄화\n- 보안군이 통제\n- 국가 단결 강제\n\n§Y그러나 원한은 끓어오릅니다.§!"
 ALG_el_kseur_platform: "엘크쇠르 강령 수용"
 ALG_el_kseur_platform_desc: "2001년 6월 11일 아루슈가 작성한 엘크쇠르 강령은 정의와 권리를 위한 15개 요구를 담고 있습니다. 우리는 이를 협상의 기초로 수용할 것입니다."
 ALG_el_kseur_tt: "§H엘크쇠르 강령 수용§!\n15개 요구에는 다음이 포함됩니다.\n- 검은 봄 희생자에 대한 정의\n- 헌병대 철수\n- 타마지그트어의 공식 지위\n- 호그라 종식\n- 경제 개발\n- 민주 개혁\n\n§R급진적 양보가 필요합니다§!"
 ALG_withdraw_gendarmerie: "헌병대 철수"
 ALG_withdraw_gendarmerie_desc: "엘크쇠르의 핵심 요구로서, 미움받는 헌병대가 카빌리아에서 철수하고 지역 경찰로 대체될 것입니다."
 ALG_withdraw_gendarmerie_tt: "§H헌병대 철수§!\n- 준군사 병력이 카빌리아를 떠남\n- 지역 경찰이 인수\n- 군 주둔 감소\n- 카빌족의 주요 요구 충족\n\n§R군이 불만을 품을 것입니다§!"
 ALG_trial_responsible_officers: "책임 장교 재판"
 ALG_trial_responsible_officers_desc: "검은 봄 당시 사망 사건에 책임이 있는 장교들이 재판을 받게 됩니다. 이 전례 없는 조치는 카빌족에 대한 국가 범죄를 인정하는 것입니다."
 ALG_trial_officers_tt: "§H책임 장교 기소§!\n- 장교들이 살인 혐의로 재판\n- 희생자 가족에게 보상\n- 국가가 범죄를 인정\n- 역사적 책임 규명\n\n§R군이 격분할 것입니다§!\n§G국제적 지지 증가§!"
 ALG_secular_berber_identity: "세속적 베르베르 정체성"
 ALG_secular_berber_identity_desc: "카빌리아는 역사적으로 알제리의 다른 지역보다 세속적이었습니다. 세속적 베르베르 정체성을 인정하는 것은 알제리 국민을 아랍-이슬람으로 규정하는 틀에 도전합니다."
 ALG_secular_berber_tt: "§H세속적 아마지그 정체성 인정§!\n- 이슬람 이전 유산을 기림\n- 세속적 가치 보호\n- 종교의 자유 보장\n- 이슬람주의 서사에 도전\n\n§R이슬람주의자들이 반대할 것입니다§!"
 ALG_mak_dialogue: "MAK와의 대화"
 ALG_mak_dialogue_desc: "페르하트 메헤니의 MAK 분리주의 운동과 대화를 시작합니다. 분리주의를 정당화할 위험이 있지만 평화로 가는 유일한 길일 수 있습니다."
 ALG_mak_dialogue_tt: "§HMAK와 대화 시작§!\n분리주의자들과 협상합니다.\n- 페르하트 메헤니와 접촉\n- 자결권 논의\n- 자치 모색\n- 독립도 의제에 오름\n\n§R극도로 논란이 큼§!\n§R분리주의를 정당화할 위험§!"
 ALG_reject_separatism: "분리주의 거부"
 ALG_reject_separatism_desc: "베르베르의 권리를 존중하되 알제리의 영토 보전은 협상의 대상이 아닙니다. 답은 분열이 아닌 다양성 속의 단결입니다."
 ALG_reject_separatism_tt: "§H다양성 속의 단결§!\n- 분리주의 거부\n- 베르베르 권리 보장\n- 영토 보전 유지\n- 다양하지만 하나인 알제리"
 ALG_kabyle_autonomy_statute: "카빌 자치 법령"
 ALG_kabyle_autonomy_statute_desc: "카빌리아를 위한 공식 자치 법령으로, 알제리의 일부로 남으면서 지역 문제를 스스로 통치합니다. 역사적 타협입니다."
 ALG_autonomy_statute_tt: "§H카빌리아, 자치를 얻다§!\n- 지역 의회 설립\n- 타마지그트어를 공용어로 인정\n- 지방 과세권\n- 문화적 자치 부여\n\n§Y카빌리아는 알제리의 일부로 남습니다§!"
 ALG_federal_algeria: "연방 알제리"
 ALG_federal_algeria_desc: "알제리가 카빌리아를 최초의 자치 지역으로 하는 연방 공화국으로 변모합니다. 다른 지역들도 이 모델을 따를 수 있습니다."
 ALG_federal_algeria_tt: "§H알제리, 연방이 되다§!\n- 연방 헌법 채택\n- 지역 자치 부여\n- 카빌리아가 모델\n- 권력 분권화\n- 연방주의를 통한 단결"
 ALG_united_secular_algeria: "통합된 세속 알제리"
 ALG_united_secular_algeria_desc: "아랍인과 아마지그인, 무슬림과 세속인 등 모든 정체성을 존중하는 통합된 세속 알제리입니다. 다양성은 우리의 힘입니다."
 ALG_united_secular_tt: "§H통합된 세속 알제리§!\n- 세속 국가 수립\n- 모든 정체성 존중\n- 분리주의 없음\n- 이슬람주의 없음\n- 현대적 민주주의"
 ALG_release_kby_autonomous_tt: "§Y카빌리아를 자치 지역으로 해방§!"
 ALG_black_spring_spirit: "검은 봄 소요"
 ALG_black_spring_spirit_desc: "마시니사 게르마의 죽음이 독립 이후 가장 큰 시위를 촉발했습니다. 카빌리아가 국가에 대한 분노로 불타오르고 있습니다."
 ALG_arrouch_negotiations: "아루슈 협상"
 ALG_arrouch_negotiations_desc: "정부가 아루슈 운동과 협상하고 있습니다. 전통적인 마을 평의회가 이제 카빌리아를 대변합니다."
 ALG_tamazight_national_language: "타마지그트어 국어"
 ALG_tamazight_national_language_desc: "타마지그트어가 알제리의 국어로 인정되었습니다. 베르베르 인정을 향한 중대한 걸음입니다."
 ALG_tamazight_official_language: "타마지그트어 공용어"
 ALG_tamazight_official_language_desc: "2016년 헌법이 타마지그트어를 아랍어와 동등한 공용어로 만들었습니다. 베르베르 권리의 역사적 성취입니다."
 ALG_addressing_kabyle_grievances: "카빌족 불만 해소"
 ALG_addressing_kabyle_grievances_desc: "정부는 카빌리아에 투자하고 수년간의 방치와 '호그라'(멸시)를 해소하고 있습니다."
 ALG_amazigh_cultural_institutions: "아마지그 문화 기관"
 ALG_amazigh_cultural_institutions_desc: "베르베르 문화 기관에 대한 투자가 알제리의 아마지그 유산을 보존하고 기리고 있습니다."
 ALG_united_algeria: "통합된 알제리"
 ALG_united_algeria_desc: "대화와 존중을 통해 알제리는 아랍계와 아마지그계 주민을 하나로 만들었습니다. 카빌 문제는 해결되었습니다."
 ALG_kabyle_crackdown: "카빌 탄압"
 ALG_kabyle_crackdown_desc: "보안군이 카빌족 시위를 진압하고 있습니다. 무력으로 질서가 회복되고 있습니다."
 ALG_gendarmerie_deployed: "헌병대 배치"
 ALG_gendarmerie_deployed_desc: "헌병대 부대가 카빌리아 전역에 주둔하며 질서를 유지하고 반대 의견을 감시하고 있습니다."
 ALG_forced_arabization: "강제 아랍화"
 ALG_forced_arabization_desc: "카빌리아에서 아랍화 정책이 강화되고 있습니다. 베르베르 정체성은 아랍-이슬람 민족주의를 위해 억압되고 있습니다."
 ALG_mak_banned: "MAK 금지됨"
 ALG_mak_banned_desc: "카빌리아 자결운동이 테러 조직으로 지정되었습니다. 이제 분리주의는 범죄입니다."
 ALG_foreign_hands_narrative: "외세 개입 서사"
 ALG_foreign_hands_narrative_desc: "정부는 카빌족 분리주의의 책임을 외세, 특히 모로코와 이스라엘에 돌립니다. 외부의 적이 국가를 단결시킵니다."
 ALG_mak_terrorist_designation: "MAK 테러 조직 지정"
 ALG_mak_terrorist_designation_desc: "MAK와 페르하트 메헤니는 이스라엘과 연계된 테러리스트로 지정되었습니다. 분리주의의 위협은 시온주의 음모로 묘사됩니다."
 ALG_kabylie_under_control: "카빌리아 통제됨"
 ALG_kabylie_under_control_desc: "무력과 정치적 탄압을 통해 카빌리아는 정부의 통제 하에 있습니다. 그러나 수면 아래에서는 원한이 끓어오릅니다."
 ALG_el_kseur_negotiations: "엘크쇠르 협상"
 ALG_el_kseur_negotiations_desc: "정부는 카빌리아와의 협상 기초로 엘크쇠르 강령을 수용했습니다."
 ALG_secular_amazigh_movement: "세속적 아마지그 운동"
 ALG_secular_amazigh_movement_desc: "세속적 베르베르 정체성이 인정받고 있으며, 이는 알제리 국민을 아랍-이슬람으로 규정하는 틀에 도전합니다."
 ALG_mak_negotiations: "MAK 협상"
 ALG_mak_negotiations_desc: "정부는 MAK 분리주의 운동과 전례 없는 대화를 하고 있습니다. 카빌리아의 미래가 저울 위에 놓여 있습니다."
 ALG_unity_within_diversity: "다양성 속의 단결"
 ALG_unity_within_diversity_desc: "알제리는 아랍인과 아마지그인, 무슬림과 세속인의 다양성을 받아들이면서 국가 단결을 유지합니다. 분리주의는 거부됩니다."
 ALG_federal_republic: "연방공화국"
 ALG_federal_republic_desc: "알제리는 카빌리아를 최초의 자치 지역으로 하는 연방 공화국이 되었습니다. 권력은 분권화되면서도 단결은 유지됩니다."
 ALG_secular_united_nation: "세속적 통합 국가"
 ALG_secular_united_nation_desc: "알제리는 모든 정체성을 존중하며 분리주의와 종교적 극단주의를 모두 거부하는 통합된 세속 국가로 거듭났습니다."
 KBY_autonomous_kabylie: "자치 카빌리아"
 KBY_autonomous_kabylie_desc: "카빌리아는 알제리 내에서 자치를 달성했습니다. 국가의 일부로 남으면서 지역 문제를 스스로 통치합니다."
 KBY_federal_partner: "연방 파트너"
 KBY_federal_partner_desc: "알제리의 연방 파트너로서 카빌리아는 알제리 연방 안에서 완전한 자치와 대등한 동반자 관계를 누립니다."
 ALG_kabyle_autonomy: "카빌 자치의 길"
 ALG_kabyle_suppressed: "카빌 탄압의 길"
 ALG_kabyle_independence: "카빌 독립의 길"
 ALG_black_spring_triggered: "검은 봄 발생"
 ALG_kabyle_issue_resolved: "카빌 문제 해결"
 ALG_became_federal: "알제리가 연방이 됨"
 ALG_secular_path_complete: "세속의 길 완료"
 human_rights_violation: "인권 침해"
 human_rights_progress: "인권 진전"
 accused_of_interference: "개입 혐의로 비난받음"
 accused_of_terrorism_support: "테러 지원 혐의로 비난받음"
 anti_israel_stance: "반이스라엘 입장"
 ALG_bribe_malian_generals: "말리 장군 매수"
 ALG_bribe_malian_generals_desc: "말리 군사 정권은 신중한 자금 배분을 통해 영향을 미칠 수 있습니다. 핵심 장군들을 매수함으로써 알제리는 바마코의 의사 결정에 대한 영향력을 얻고 사헬에서의 이익을 확보할 수 있습니다."
 ALG_isolate_mali_regime: "말리 정권 고립"
 ALG_isolate_mali_regime_desc: "바마코의 군사 정권은 지역을 불안정하게 하고 투아레그 주민들을 위협했습니다. 알제리는 국제적으로 군사 정권을 고립시키는 데 힘쓰며, 사헬 위기에서 정당한 중재자로 자리매김할 것입니다."
 ALG_isolate_mali_tt: "§Y말리 정권 고립§!\n외교적 압력과 아프리카 연합 경로를 사용해 군사 정권을 규탄합니다.\n\n§Y이점:§!\n- 알제리의 지역 지도력\n- 투아레그 지지 증가\n- 말리 약화\n- AU 영향력 획득\n\n§W결과:§!\n알제리가 사헬 문제의 핵심 중재자가 됩니다"
 ALG_au_condemns_mali_tt: "§Y아프리카 연합, 말리 정권 규탄§!\n모든 AU 회원국의 말리에 대한 관계 감소"
 ALG_malian_general_network: "말리 장군 연결망"
 ALG_malian_general_network_desc: "매수된 말리 장군들의 연결망이 알제리에 정보와 바마코 군사 정권에 대한 영향력을 제공합니다."
 ALG_sahel_mediator: "사헬 중재자"
 ALG_sahel_mediator_desc: "알제리는 사헬 분쟁의 주요 외교 중재자로 부상했습니다. 우리의 목소리는 지역 문제에서 무게를 지닙니다."
 MAL_international_isolation: "국제적 고립"
 MAL_international_isolation_desc: "군사 정권은 국제적 비난과 고립에 직면해 있습니다. 무역이 교란되고 외국 원조가 중단되었으며, 정부는 통제를 유지하기 위해 애쓰고 있습니다."
 ALG_bribed_our_generals: "우리 장군 매수당함"
 ALG_supported_our_cause: "우리 대의를 지지함"
 AU_condemned_regime: "AU가 정권을 규탄함"
 ALG_bribed_mali_generals: "말리 장군 매수함"
 ALG_isolated_mali: "말리 정권 고립시킴"
 ALG_dziri_unlock_tt: "§Y다음 중 하나가 필요합니다:§!\n- §H희망 회복§! 완료\n- §H르 푸부아르에 저항§! 완료\n- §H군사 쿠데타§! 완료"
 ALG_requires_democratic_or_neutral_tt: "§H민주주의§! 또는 §H중립§! 정부 필요"
 ALG_requires_authoritarian_or_neutral_tt: "§H권위주의§! 또는 §H중립§! 정부 필요"
 ALG_not_gender_equality_tt: "§R성평등 중점과 양립 불가§!"
 ALG_not_suppressed_kabyle_tt: "§R카빌리아가 탄압당한 경우 사용 불가§!"
 ALG_migration_event_required_tt: "§Y이주 위기 사건으로 잠금 해제§!"
 ALG_drug_event_required_tt: "§Y마약 위기 사건으로 잠금 해제§!"
 ALG_dziri_tt: "§G알제리 사회 분기 잠금 해제:§!\n\n알제리 사회를 진보적으로 또는 전통적으로, 개방적으로 또는 폐쇄적으로 어떻게 빚을지 선택하십시오."
 ALG_dziri_unlocks_tt: "§Y사회 분기 잠금 해제:§!\n- 시민사회의 길(민주주의/중립)\n- 전통의 길(권위주의/중립)\n- 베르베르 권리(민주주의/중립)\n- 마약 대응(사건 발생 시)\n- 이주 대응(사건 발생 시)"
 ALG_open_civil_society_tt: "§G개방적 시민사회:§!\n\n- NGO와 자선단체가 번성\n- 민주적 참여 증가\n- 진보적 개혁의 토대"
 ALG_constitutionalize_rights_tt: "§G헌법적 권리:§!\n\n- 기본적 자유 보호\n- 법치 강화\n- 국제적 지지"
 ALG_integration_policy_tt: "§G통합 계획:§!\n\n- 이주민이 생산적인 시민이 됨\n- 인력 증가\n- 사회 결속"
 ALG_unlocks_migration_branch_tt: "§Y이주 대응 분기 잠금 해제§!\n(이주 사건 발생 시)"
 ALG_migration_problems_tt: "§Y이주 위기:§!\n\n사하라 이남 이주민들이 알제리의 남부 국경으로 밀려들고 있습니다. 대응 방식을 선택해야 합니다."
 ALG_migration_choice_tt: "§Y선택:§!\n- §G개방 정책§! - 이주민을 환영\n- §R국경 폐쇄§! - 국경을 확보"
 ALG_open_door_tt: "§G개방 정책:§!\n\n- 이주민과 난민을 환영\n- 인력 증가\n- 일부 안정도 손실\n- 인도주의적 명성"
 ALG_closed_borders_tt: "§R국경 폐쇄:§!\n\n- 국경 확보\n- 안정도 증가\n- 외국 영향력 감소\n- 인구 증가 둔화"
 ALG_expand_berber_rights_tt: "§G베르베르 권리 확대:§!\n\n- 아마지그 문화를 기림\n- 카빌족 만족도 개선\n- 다양성에서 오는 연구 이점"
 ALG_drug_problem_tt: "§Y마약 위기:§!\n\n모로코와 사헬에서 유입되는 마약 밀매가 중독 문제를 일으켰습니다. 대응 방식을 선택해야 합니다."
 ALG_drug_choice_tt: "§Y선택:§!\n- §G비범죄화§! - 보건 중심 접근\n- §R처벌 강화§! - 법 집행 중심 접근"
 ALG_relax_restrictions_tt: "§G마약 비범죄화:§!\n\n- 중독을 보건 문제로 취급\n- 수감 인구 감소\n- 일부 마피아 영향력 잔존\n- 국제적 비난 감소"
 ALG_tighten_punishments_tt: "§R마약 단속:§!\n\n- 판매상에 대한 엄중 처벌\n- 마피아 영향력 감소\n- 전쟁 지지도 증가\n- 일부 안정도 손실"
 ALG_traditions_matter_tt: "§G전통적 가치:§!\n\n- 알제리 관습 보존\n- 종교적 가치 장려\n- 서구 영향에 대한 저항"
 ALG_unlocks_conservative_path_tt: "§Y보수적 사회의 길 잠금 해제§!"
 ALG_censor_internet_tt: "§Y인터넷 검열:§!\n\n- 외국 선전 차단\n- 정보 흐름 통제\n- 외국 영향력 감소\n- 연구 속도 소폭 감소"
 ALG_restrict_women_tt: "§Y전통적 성 역할:§!\n\n- 여성의 가정 내 역할 장려\n- 출산율 증가 가능\n- 노동력 감소\n- 서구의 비판"
 ALG_marriage_subsidies_tt: "§G결혼 보조금:§!\n\n- 정부가 결혼식 비용 지원\n- 인구 증가 장려\n- 국고 비용 발생\n- 전통적 가치 장려"
 ALG_open_civil_society_idea: "개방적 시민사회"
 ALG_open_civil_society_idea_desc: "알제리에는 활발한 NGO, 자선단체, 지역 사회 조직이 공적 생활에 기여하는 역동적인 시민사회가 있습니다."
 ALG_constitutionalize_rights_idea: "헌법적 권리"
 ALG_constitutionalize_rights_idea_desc: "기본권이 헌법에 명시되어 알제리 시민을 보호하고 법치를 강화합니다."
 ALG_integration_policy_idea: "통합 정책"
 ALG_integration_policy_idea_desc: "알제리는 이주민과 난민을 적극적으로 통합하며 언어 교육과 시민권 취득 경로를 제공합니다."
 ALG_migration_crisis: "이주 위기"
 ALG_migration_crisis_desc: "사하라 이남 아프리카에서 온 이주민의 물결이 국경 시설을 압도하고 사회적 긴장도를 일으켰습니다."
 ALG_welcome_migrants: "개방 정책"
 ALG_welcome_migrants_desc: "알제리는 이주민과 난민을 환영하며 인도적 지원과 통합 지원을 제공합니다."
 ALG_refugees_maintained: "관리되는 난민 인구"
 ALG_refugees_maintained_desc: "알제리의 난민 인구는 적절한 시설과 통합 계획으로 잘 관리되고 있습니다."
 ALG_drug_crisis: "마약 위기"
 ALG_drug_crisis_desc: "마약 밀매와 중독이 심각한 문제가 되어 법 집행과 보건 서비스에 부담을 주고 있습니다."
 ALG_traditions_matter_idea: "전통적 가치"
 ALG_traditions_matter_idea_desc: "알제리는 가족, 신앙, 공동체를 비롯한 전통적 가치를 장려합니다. 서구 문화의 영향에는 저항합니다."
 ALG_censored_internet_idea: "검열된 인터넷"
 ALG_censored_internet_idea_desc: "정부가 인터넷 접속을 통제하여 외국의 선전과 비도덕적 콘텐츠를 차단합니다."
 ALG_women_role_idea: "전통적 성 역할"
 ALG_women_role_idea_desc: "여성들은 주부와 어머니라는 전통적 역할을 받아들이도록 장려받습니다. 여성의 노동 참여율이 하락했습니다."
 ALG_marriage_subsidies_idea: "결혼 보조금"
 ALG_marriage_subsidies_idea_desc: "정부가 결혼을 보조하여 젊은 부부가 결혼식 비용을 감당하도록 돕고 가정 형성을 장려합니다."
 restricts_women_rights: "여성 권리 제한"
 ALG_migration_flood: "이주 위기 진행 중"
 ALG_drugs: "마약 위기 진행 중"
 ALG_mediterranean_games_preparation: "지중해 경기 대회 준비"
 ALG_mediterranean_games_preparation_desc: "오랑이 2022년 지중해 경기 대회를 위해 탈바꿈하고 있습니다. 건설 인력이 올림픽 단지와 새 경기장, 선수촌에서 밤낮없이 일하고 있습니다. 알제리가 26개국을 자국 해안에 맞이할 준비를 하면서 온 나라가 이 역사적 행사를 뒷받침하고 있습니다."
 ALG_more_infra: "기반시설 확충"
 ALG_more_infra_desc: "알제리의 기반시설은 경제 성장을 뒷받침하기 위해 상당한 확충이 필요합니다. 새로운 도로와 철도, 공공 설비가 공동체를 연결하고 전국의 무역을 촉진할 것입니다."
 TT_ALG_SECULAR_DISCONTENT_MODIFIER: "§R세속주의자들의 불만이 커집니다§!\n진보적이고 세속적인 알제리인들이 종교 정책에 반대합니다."
 TT_ALG_ISLAMIST_SATISFACTION_MODIFIER: "§G이슬람주의자 지지 증가§!\n종교적 보수층이 이러한 조치를 승인합니다."
 ALG_more_relation_better: "§H관계가§! §G더 좋을수록§! §H가입할 가능성이§! §G높아집니다!§!"
 algerian_military_dismantling: "군 해체"
 algerian_military_dismantling_desc: "알제리군이 체계적으로 해체되고 있습니다. 장비는 퇴역하고, 부대는 해편되며, 장교들은 예편합니다. 한때 강력했던 알제리 인민민족군은 과거의 그림자에 불과합니다."
 algerian_student_exchanges: "학생 교환 프로그램"
 algerian_student_exchanges_desc: "알제리 학생들은 해외 대학에서 유학하고, 외국 학생들은 알제리를 찾아옵니다. 이러한 교류는 인적 관계를 구축하고 지식을 이전하며 알제리의 차세대 전문 인력을 양성합니다."
 ALG_boost_reformists: "개혁파 지원"
 ALG_boost_old_guard: "구세력 지원"
 ALG_rally_students: "학생 결집"
 ALG_mobilize_veterans: "참전 용사 동원"
 ALG_bribe_elites: "엘리트 매수"
 ALG_seek_compromise: "타협 모색"
 ALG_media_campaign_reform: "개혁 언론 캠페인"
 ALG_security_crackdown: "보안 단속"
 ALG_world_tension_security: "세계 긴장도 보안"
 ALG_world_tension_high_security: "세계 긴장도 고강도 보안"
 ALG_path_crackdown_momentum: "탄압의 기세"
 ALG_path_reconciliation_momentum: "화해의 기세"
 ALG_oil_patronage: "석유 후원 체제"
 ALG_economic_reforms: "경제 개혁"
 ALG_ter_oboronaup_start: "지역 방위"
 ALG_internalup_start: "내무군"
 ALG_MAJLIS_WATANI_SHAABI_DESC: "인민 국민 의회는 알제리 의회의 하원입니다. 이 체제에서는 행정권이 단일 대통령이 아닌 의회에 귀속되어, 선출된 대표들이 국가를 공동으로 통치하는 진정한 의원내각제 공화국이 수립됩니다."
 ALG_a_new_algeria_tt: "부테플리카의 부패 네트워크가 해체됩니다. 그들이 빼돌린 재산은 압수되고 부동산은 매각되며, 회수된 자금은 국고로 환수됩니다."
 FIS_faction_middle_east_available_tt: "최소 한 개의 중동 수니파 국가가 우리에 대한 관계가 70 이상이어야 하며 개입주의 외교 정책을 추구해야 합니다"
 FIS_faction_asia_available_tt: "최소 한 개의 아시아 수니파 국가가 우리에 대한 관계가 70 이상이어야 하며 개입주의 외교 정책을 추구해야 합니다"
 ALG_4g_upgrade_decisions_tt: "국가 4G 네트워크 기반시설을 업그레이드하는 결정이 잠금 해제됩니다."
 ALG_environmental_campaign_no_space_tt: "사용 가능한 건물 슬롯이 없습니다. 대신 환경 언론 캠페인을 통해 국내 영향력이 증가했습니다."
 ALG_grand_mufti_rule_djaballah_tt: "압달라 자발라가 새로운 국가원수로 임명되어 알제리 통치에 보수적 이슬람주의 노선을 도입합니다."
 ALG_grand_mufti_rule_ulema_tt: "울라마 위원회에 자문을 구해 알제리의 종교 지도부를 결정하며, 경쟁하는 성직자 세력 간의 선택이 발생합니다."
 ALG_revivify_non_aligned_movement_t: "알제리는 비동맹 운동을 되살리기 위해 노력하며, 강대국 블록 밖에 있는 국가들을 대변하는 선도적 목소리로 자리매김합니다."
 TT_ALG_REDUCE_TAXES_5: "인구 세율이 5 감소하여 하층민의 부담이 덜어지고 농민층의 지지를 얻게 됩니다."
 ALG_east_west_highway: "동서 고속도로"
 ALG_east_west_highway_desc: "동서 고속도로는 안나바에서 틀렘센에 이르는 주요 인구 중심지를 연결하여 알제리 경제의 중추 역할을 하며, 국내 무역과 이동성을 극적으로 개선할 것입니다."
 ALG_future_national_policy1: "기로에 선 국가"
 ALG_future_national_policy1_desc: "알제리의 미래는 아직 쓰이지 않았습니다. 앞으로 몇 년간 내려질 결정이 국가의 성격과 가치, 동맹, 그리고 세계에서의 위치를 규정할 것입니다."
 ALG_hassi_massoud_exploitation_desc: "하시 메사우드 유전은 아프리카에서 가장 큰 유전 중 하나입니다. 이 유전을 완전히 개발하는 데 투자함으로써 알제리는 석유 생산량을 극적으로 늘리고 장기적인 에너지 수입을 확보할 수 있습니다."
 ALG_north_south_highway_desc: "북부 해안과 먼 남부를 잇는 사하라 횡단 고속도로는 알제리의 광대한 내륙을 개방하여 자원 채취를 가능하게 하고 지역 불평등을 줄일 것입니다."
 ALG_black_decade_lesson2_idea: "암흑의 10년의 교훈 II"
 ALG_black_decade_lesson2_idea_desc: "군 개혁은 내전의 뼈아픈 교훈 위에 쌓아 올려졌습니다. 알제리군은 무차별적 폭력에 의존하지 않고도 내부 위협에 대처할 수 있도록 더 잘 준비되어 있습니다."
 ALG_black_decade_lesson3_idea: "암흑의 10년의 교훈 III"
 ALG_black_decade_lesson3_idea_desc: "10년간의 개혁은 알제리의 안보 교리를 탈바꿈시켰습니다. 대극단주의는 이제 군 문화에 내재화되었으며, 향후 반란을 예방하도록 특별히 설계된 전문 부대와 정보 네트워크가 갖춰져 있습니다."
 ALG_decline_of_tourism1: "회복 중인 관광 부문"
 ALG_decline_of_tourism1_desc: "최악의 쇠퇴는 지나갔습니다. 표적 투자와 개선된 치안 여건이 알제리의 역사 유적과 지중해 해안선으로 방문객을 다시 끌어들이기 시작하고 있습니다."
 ALG_destroyed_agriculture_two: "손상된 농업 부문"
 ALG_destroyed_agriculture_two_desc: "지속되는 불안정이 농업 회복을 계속 저해하고 있습니다. 농지는 여전히 생산성이 낮고 농촌 공동체는 정상적인 영농 활동으로 복귀하는 데 어려움을 겪고 있습니다."
 ALG_destroyed_agriculture_three: "농업 재건"
 ALG_destroyed_agriculture_three_desc: "농업 부문에서 재건 노력이 진행 중입니다. 새로운 지구가 개간되고 있으며 식량 생산 능력을 회복하기 위해 기반시설이 서서히 재건되고 있습니다."
 ALG_family_centric_2: "사회의 중심, 가정 II"
 ALG_family_centric_2_desc: "전통적 가족 구조에 대한 강조가 심화되어, 가정을 알제리 사회의 토대로 보는 보수적 관점을 중심으로 사회 정책이 형성되고 있습니다."
 ALG_hydroelectric_power_plants_upgraded2_idea: "고도화된 수력 발전망"
 ALG_hydroelectric_power_plants_upgraded2_idea_desc: "알제리 수력 발전 기반시설에 대한 2차 업그레이드로 전국의 에너지 저장 용량과 전력망 신뢰도가 크게 확대되었습니다."
 ALG_mastering_atom_2: "원자의 정복 II"
 ALG_mastering_atom_2_desc: "알제리의 핵 프로그램이 농축 단계에 이르러 국제사회의 우려를 불러일으키고 있습니다. 이제 무기급 물질을 생산할 수 있으나 마지막 단계는 아직 밟지 않았습니다."
 ALG_mastering_atom_3: "원자의 정복 III"
 ALG_mastering_atom_3_desc: "알제리는 핵무기 능력을 성공적으로 개발했습니다. 이제 알제리는 세계의 핵보유국 반열에 올라 지역 세력 균형을 극적으로 바꾸어 놓았습니다."
 ALG_riot_police_1: "알사이카 신속 대응 부대"
 ALG_riot_police_1_desc: "시위를 해산하고 도시 중심부의 질서를 유지하도록 특별히 훈련된 전담 진압 경찰 부대가 편성되었습니다. 이들의 존재는 사회 불안에 대한 억지력이 됩니다."
 ALG_riot_police_2: "알사이카 확대 배치"
 ALG_riot_police_2_desc: "과잉 진압에 대한 대중의 비판에 따라 진압 경찰 부대가 축소 및 개편되었습니다. 임무 범위는 좁아지고 감독은 강화되었습니다."
 ALG_riot_police_3: "알사이카 정예군"
 ALG_riot_police_3_desc: "알사이카 부대는 전국 어디든 신속히 배치할 수 있는 정예 내부 보안군으로 확대되고 전문화되었습니다."
 ALG_science_idea_two: "알제리 과학 르네상스 II"
 ALG_science_idea_two_desc: "1차 과학 투자를 기반으로, 알제리는 기술 발전을 가속하는 연구 기관과 국제 협력 관계망을 구축했습니다."
 ALG_air_reform_desc: "알제리 공군에 대한 1차 개혁이 시작되어 지휘 체계를 현대화하고 노후 항공기 전력을 개선하고 있습니다."
 ALG_air_reform2_desc: "공군 개혁 2단계에서는 고급 훈련 프로그램과 개선된 정비 절차가 도입되어 작전 준비태세가 향상되었습니다."
 ALG_air_reform3_desc: "알제리 공군은 대대적으로 정비되었습니다. 현대식 항공기를 갖춘 새로운 비행대가 창설되어 방공 능력과 전력 투사 능력이 크게 향상되었습니다."
 ALG_air_reform4_desc: "공군 개혁 프로그램이 완료되었습니다. 알제리는 이제 아프리카 대륙에서 가장 우수한 공군 중 하나를 운용합니다."
 ALG_algerian_tourism_desc: "알제리 관광 부문이 적극적으로 육성되고 있으며, 숙박 기반시설에 대한 투자와 국제 마케팅 캠페인이 풍부한 문화·자연 유산을 지닌 이 나라로 방문객을 끌어들이고 있습니다."
 ALG_army_reform_desc: "알제리 육군을 현대화하기 위한 포괄적 개혁 프로그램이 시작되어 훈련 기준, 군수, 지휘 체계를 개선하고 있습니다."
 ALG_army_reform_mass_army_desc: "알제리는 지속적인 작전이 가능한 대규모 재래식 육군을 구축하고 있으며, 특수 전력보다 인력과 기계화 보병을 우선시합니다."
 ALG_army_reform_mass_army2_desc: "대규모 육군 개혁이 2단계에 접어들었으며, 개선된 군수와 기갑 지원으로 알제리 지상군의 재래식 전투력이 증강되고 있습니다."
 ALG_army_reform_mass_army3_desc: "알제리의 대규모 육군 교리가 완전히 확립되었습니다. 대규모 제병협동 편제가 이제 국가 지상 방어 전략의 중추입니다."
 ALG_army_reform_mass_army4_desc: "대규모 육군 프로그램이 완료되었습니다. 알제리는 견고한 군수 기반시설의 뒷받침을 받는 수적 우위의 지상군을 운용할 수 있습니다."
 ALG_army_reform_specops_desc: "알제리는 특수작전부대에 투자하여 대테러, 신속 대응, 비정규전을 위해 훈련된 정예 부대를 창설하고 있습니다."
 ALG_army_reform_specops2_desc: "특수부대 프로그램이 확대되어 인질 구출, 종심 침투, 직접 행동 작전에 훈련된 새로운 부대가 편성되었습니다."
 ALG_army_reform_specops3_desc: "알제리 특수부대는 사헬 지역과 국내에서의 수십 년간 대반란전 경험에서 얻은 교훈을 바탕으로 높은 수준의 능력에 도달했습니다."
 ALG_army_reform_specops4_desc: "특수부대 개혁 프로그램이 완료되었습니다. 알제리의 정예 부대는 풍부한 경험과 작전 수행의 정교함으로 존경받는, 아프리카에서 가장 우수한 부대 중 하나입니다."
 ALG_basic_income_support_desc: "기본소득 지원 프로그램이 알제리 최빈곤층에게 금융 안전망을 제공하여 빈곤을 줄이고 경제적 변동성의 충격을 완화합니다."
 ALG_black_decade_methods_desc: "보안군은 내전 중에 개발된 잔혹한 방식에 계속 의존하고 있습니다. 단기적으로는 효과적이나 이러한 접근은 원한을 키우고, 억누르려던 바로 그 극단주의를 다시 불붙일 위험이 있습니다."
 ALG_border_security_idea_desc: "강화된 국경 검문소와 확대된 순찰 경로로 알제리의 광대한 사막 국경을 넘나드는 밀수업자, 무기 밀매업자, 극단주의 침투자를 차단하는 능력이 향상되었습니다."
 ALG_childcare_reform_desc: "새로운 보육 시설과 보조금 지원 어린이집 프로그램이 도입되고 있어, 가정이 일과 육아를 병행하기가 더 쉬워지고 있습니다."
 ALG_closed_moroccan_border_desc: "모로코와의 국경은 여전히 굳게 폐쇄되어 있습니다. 이는 국경 간 밀수를 제한하지만 합법적인 무역도 억제하고 양국 간의 외교적 냉각을 심화시킵니다."
 ALG_confidence_measures_idea_desc: "알제리와 이웃 국가들 사이의 신뢰 구축 조치 패키지가 긴장을 완화하고 외교 대화 통로를 여는 데 도움이 되고 있습니다."
 ALG_counter_morocco_idea_desc: "알제리는 외교적 압박, 폴리사리오 전선 지원, 아프리카 동맹국을 둘러싼 전략적 경쟁을 통해 이 지역에서 모로코의 영향력에 적극적으로 맞서고 있습니다."
 ALG_dialogue_with_morocco_desc: "모로코와 신중한 대화가 시작되어, 수년간의 적대 이후 관계를 정상화하고 국경을 다시 개방할 가능성을 모색하고 있습니다."
 ALG_education_arabization_desc: "교육 제도의 아랍어화가 심화되어, 모든 단계에서 프랑스어 수업을 아랍어로 대체하고 이슬람적 가치를 국가 교육과정에 내재화했습니다."
 ALG_food_subsidy_idea_desc: "정부 보조금이 주식 가격을 낮게 유지하여 가장 가난한 알제리인도 기본 영양을 감당할 수 있게 합니다. 그러나 이는 국가 예산에 상당한 부담을 줍니다."
 ALG_foreign_arms_companies_desc: "알제리는 조달 절차를 외국 무기 제조업체에 개방하여 더 다양한 군사 장비에 접근할 수 있게 되었으나, 외부 공급자에 대한 의존도가 높아졌습니다."
 ALG_fuel_subsidy_idea_desc: "연료 가격 보조금은 알제리 가계와 기업의 운송 및 에너지 비용을 낮게 유지하지만, 정부의 예산 운용 유연성을 제한하는 중대한 재정 부담이 됩니다."
 ALG_future_army_desc: "알제리는 차세대 군사 기술과 교리에 투자하여 자국 군대를 현대전 능력의 최첨단에 위치시키고 있습니다."
 ALG_global_power_desc: "알제리는 국제 무대에서 한 자리를 차지하고 이를 뒷받침할 경제력과 군사력을 갖춘 진정한 세계적 강국으로 자리매김했습니다."
 ALG_health_insurance_system_desc: "국민건강보험 제도가 도입되어 알제리 국민이 소득 수준에 관계없이 의료 서비스를 받을 수 있게 됩니다."
 ALG_housing_support_idea_desc: "정부 주거 지원 프로그램이 저소득 가정이 적정 가격의 주거지를 구할 수 있도록 도와, 알제리의 도시 주택 부족 압박을 줄이고 있습니다."
 ALG_hydroelectric_power_plants_upgraded_idea_desc: "알제리의 수력 발전 기반시설이 업그레이드되어 수력 발전의 용량과 신뢰도가 높아지고 화석 연료 의존도가 줄어들었습니다."
 ALG_idea_arab_diplomacy_desc: "알제리는 적극적인 아랍 외교 노선을 추구하며, 아랍 연맹과 더 넓은 아랍 세계에서 핵심 중재자이자 대변자로 자리매김하고 있습니다."
 ALG_idea_parliamentary_republic_desc: "알제리는 의원내각제 공화국 체제를 채택하여 행정권을 입법부 쪽으로 이동시키고 보다 책임성 있는 정부 형태를 확립했습니다."
 ALG_idea_presidential_republic_desc: "알제리는 대통령제 공화국으로 운영되며, 행정 권한은 국민이 직접 선출하는 대통령직에 집중되어 있습니다."
 ALG_idea_refoming_education_desc: "1차 교육 개혁이 시작되어 전국의 교육과정 기준, 교사 훈련, 취학 접근성이 개선되고 있습니다."
 ALG_idea_refoming_education1_desc: "교육 개혁 2단계에서는 중등 교육이 확대되고 직업 훈련이 개선되었으며 알제리 학교 전반에 새로운 교수법이 도입되었습니다."
 ALG_idea_semi_presidential_republic_desc: "알제리의 이원집정부제는 직선 대통령과 의회에 책임을 지는 총리 사이에서 권력의 균형을 맞춥니다."
 ALG_maghreb_cooperation_idea_desc: "알제리는 마그레브 이웃 국가들과의 경제·정치 협력을 심화하기 위해 노력하고 있으며, 보다 통합된 북아프리카 지역 블록의 기반을 마련하고 있습니다."
 ALG_maghreb_security_idea_desc: "마그레브 파트너들과의 공동 안보 체계는 사헬 지역의 테러, 밀수, 국경 간 불안정에 대한 공조 대응을 가능하게 합니다."
 ALG_maghreb_trade_idea_desc: "마그레브 국가들과의 특혜 무역 협정이 역내 상업을 촉진하여 알제리의 유럽 시장 의존도를 낮추고 있습니다."
 ALG_mastering_atom_desc: "알제리는 비밀 핵 프로그램을 개시하여 향후 무기급 물질을 개발하는 데 필요한 연구 기반시설을 구축했습니다."
 ALG_military_expansion_desc: "알제리는 군의 규모를 확대하고 신규 장비에 투자하며 추가 인원을 모집하여 더 큰 군사력을 투사하고자 합니다."
 ALG_military_expansion2_desc: "군 확장 프로그램이 2단계에 접어들어 새로운 기갑 부대, 포병 여단, 방공 체계가 도입되고 있습니다."
 ALG_military_junta_desc: "군이 국가를 직접 장악했습니다. 알제리는 정당성이 국민의 위임이 아닌 무력에 있는 장군들의 군사정권에 의해 통치되고 있습니다."
 ALG_military_quality_initiative_desc: "양보다 질을 중시하는 군 개혁 접근법이 알제리군의 전문성, 훈련 기준, 장비를 개선하고 있습니다."
 ALG_military_quality_initiative2_desc: "군 정예화 구상 2단계에서는 고급 모의 훈련이 도입되고 장교 교육이 개선되었으며 합동 군종 훈련이 확대되었습니다."
 ALG_modern_hospitals_desc: "알제리는 현대 의료 기술을 갖춘 현대식 병원망을 구축하여 국민의 의료 성과를 크게 개선하고 있습니다."
 ALG_natural_products_idea_desc: "알제리는 대추야자, 올리브유, 수공예품 등 자국의 천연 산물을 국제 시장에 홍보하여 수출 소득을 다각화하고 농촌 공동체를 지원하고 있습니다."
 ALG_naval_reform_desc: "알제리 해군은 수십 년 만의 첫 대규모 개혁을 거치고 있으며, 정비, 훈련, 수상 함대의 능력이 개선되고 있습니다."
 ALG_naval_reform2_desc: "해군 개혁 2단계의 일환으로 새로운 호위함과 초계함이 취역하여 서부 지중해에서 알제리의 영향권이 확대되었습니다."
 ALG_naval_reform3_desc: "알제리의 해군 능력은 향상된 대잠수함전 및 연안 방어 능력으로 대폭 업그레이드되었습니다."
 ALG_naval_reform4_desc: "해군 개혁 프로그램이 완료되었습니다. 알제리는 이제 지중해 전역과 대서양까지 전력을 투사할 수 있는 현대적이고 균형 잡힌 해군을 운용합니다."
 ALG_open_border_coop_desc: "알제리는 이웃 국가들과의 국경 간 협력을 확대하기 위해 국경을 개방하여 무역, 인적 이동, 공동 기반시설 프로젝트를 촉진하고 있습니다."
 ALG_pna_expansion_desc: "인민민족군은 군수 및 행정 역량을 확대하여 알제리의 광활한 영토 전역에서 대규모 작전을 지속할 수 있는 능력을 개선했습니다."
 ALG_polisario_support_idea_desc: "알제리는 폴리사리오 전선에 정치적, 군수적, 물질적 지원을 계속 제공하며 서사하라 분쟁에서 모로코에 대한 압박을 유지하고 있습니다."
 ALG_private_clinics_expansion_desc: "민간 의료 부문의 확장이 허용되어, 여유가 있는 이들에게 더 높은 품질의 진료를 제공하는 동시에 공공 보건 체계의 부담을 덜고 있습니다."
 ALG_private_healthcare_idea_desc: "알제리는 의료 분야에 대한 민간 투자를 장려하여 공공 체계와 병행하여 프리미엄 서비스를 제공하는 민간 부문을 형성하고 있습니다."
 ALG_reactioners_desc: "국가 관료 조직과 군 내부의 보수 세력이 의미 있는 개혁에 저항하며, 근대화를 희생하더라도 기존 질서의 이익을 보호하고 있습니다."
 ALG_reactioners1_desc: "반동 세력은 다소 약화되었으나 핵심 기관 내에서 상당한 영향력을 유지하고 있으며 변화의 속도를 계속 늦추고 있습니다."
 ALG_reactioners2_desc: "구세력의 장악력이 느슨해지고 있습니다. 개혁 노력이 충분한 동력을 얻어 이전에 진전을 가로막던 많은 제도적 장애물을 극복하고 있습니다."
 ALG_reactioners3_desc: "반동 세력은 대폭 주변화되었습니다. 새로운 정치적 합의로 그들의 많은 동조자들이 권력의 자리에서 물러났습니다."
 ALG_reactioners4_desc: "체제적 개혁이 반동 블록의 기세를 꺾었습니다. 알제리의 제도는 기득권 엘리트의 이익보다 대중의 요구에 점점 더 부응하고 있습니다."
 ALG_reactioners5_desc: "구세력 중 저항의 고립된 거점만이 남아 있습니다. 알제리 정치 문화의 변혁이 완성 단계에 가까워지고 있습니다."
 ALG_reactioners6_desc: "반동 체제의 마지막 잔재가 일소되었습니다. 알제리는 책임성과 진정한 정치적 경쟁으로 규정되는 새로운 시대에 접어들었습니다."
 ALG_reactioners7_desc: "알제리는 권위주의적 과거와 완전히 결별했습니다. 국가는 이제 민주적 규범과 법치를 중심으로 구성되어 있으며, 낡은 후원 네트워크는 해체되었습니다."
 ALG_sand_war_memory_idea_desc: "1963년 모로코와의 모래 전쟁의 기억은 여전히 알제리의 군사 계획과 외교 정책을 규정하며, 모로코의 의도에 대한 뿌리 깊은 제도적 불신을 조장하고 있습니다."
 ALG_science_idea_desc: "알제리는 과학 연구 개발에 투자하여 새로운 연구소를 설립하고 대학 연구 프로그램에 자금을 지원함으로써 국내 지식 경제를 구축하고 있습니다."
 ALG_shipbuilding_desc: "알제리는 자국 조선 산업을 육성하여 군함과 상선을 건조할 수 있는 시설을 짓고 외국 공급자에 대한 의존도를 줄이고 있습니다."
 ALG_shipbuilding2_desc: "조선 산업이 성숙하여 더 크고 복잡한 선박이 국내에서 생산되고 있습니다. 알제리는 신뢰할 만한 해양 제조 국가로 성장하고 있습니다."
 ALG_social_contract_idea_desc: "정부는 국민과의 사회 계약을 갱신하여, 정치적 묵인의 대가로 보조금, 공공 일자리, 사회 서비스를 보장하고 있습니다."
 ALG_sonatrach_desc: "알제리의 국영 석유·가스 기업인 소나트락은 국가 경제의 중추로 남아 있으며, 국가 수출 수입의 대부분을 창출합니다."
 ALG_state_hospitals_idea_desc: "국영 병원망이 모든 알제리인에게 기본적인 의료 접근성을 제공하지만, 만성적인 재정 부족으로 지역 간 서비스 품질에 상당한 차이가 있습니다."
 ALG_suppressed_opposition_desc: "정치적 반대 세력은 법적 제약, 언론 통제, 직접적인 협박이 결합되어 침묵을 강요당했습니다. 반대 의견은 제거되지 않고 지하로 숨어들었습니다."
 ALG_technological_ties_desc: "알제리는 외국 파트너들과 기술 이전 협정을 체결하여, 경제적·외교적 양보를 대가로 첨단 체계와 전문 지식에 접근하고 있습니다."
 ALG_tikjda_resort_desc: "카빌리 지역의 티크즈다 산악 리조트는 생태 관광을 촉진하고 알제리 아틀라스 산맥으로 방문객을 끌어들이는 대표 관광지로 개발되고 있습니다."
 ALG_universal_healthcare_idea_desc: "알제리는 일반 조세와 탄화수소 수입으로 재원을 마련하여 모든 시민에게 무상 또는 대폭 보조된 의료를 제공하는 보편적 의료 체계를 확립했습니다."
 ALG_university_expansion_desc: "알제리 전역에 새로운 대학 캠퍼스가 설립되어 고등교육 접근성이 확대되고 현대 경제의 요구에 부응하는 졸업생이 배출되고 있습니다."
 ALG_welfare_state_idea_desc: "알제리는 주거 지원, 의료, 교육, 소득 보조를 제공하는 포괄적인 복지국가를 구축했으며, 재원은 대부분 석유와 가스 수입으로 충당됩니다."
 FIS_al_aqsa_faction: "알아크사 연합"
 Algeria_desc: "알제리"
 AlgeriaFocusEvents_desc: "알제리의 국가 중점으로 발생하는 사건."
 algeria_focus_desc: "정치, 경제, 군사, 외교 정책 경로를 아우르는 알제리의 국가 중점 트리."
 algerian_focus_desc: "정치, 경제, 군사, 외교 정책 경로를 아우르는 알제리의 국가 중점 트리."
 algeria_power_balance_desc: "민간 정부와 군부 사이의 세력 균형으로, 군부는 오랫동안 알제리에서 국가 안의 국가로 기능해 왔습니다."
 nuclear_algeria_desc: "알제리는 핵 문턱을 넘어 작동 가능한 핵무기를 보유하게 되었으며, 이는 북아프리카와 더 넓은 지중해 지역에서의 전략적 입지를 근본적으로 변화시킵니다."
 ALG_civilian_government: "민간 정부"
 ALG_civilian_government_desc: "수십 년 만에 처음으로 알제리가 진정한 민간 행정부에 의해 통치되고 있습니다. 군은 직접적인 정치 개입에서 물러나 선출된 공직자들이 이끌도록 하였습니다."
 ALG_corrupt_generals: "부패한 장군들"
 ALG_corrupt_generals_desc: "군 수뇌부는 부패로 얼룩져 있습니다. 수십 년간의 후원 관계로 부를 쌓은 장군들은 자신의 경제적 이익을 위협하는 어떠한 개혁에도 저항합니다."
 ALG_government_led_disaster: "정부 주도 재난 대응"
 ALG_government_led_disaster_desc: "국가가 재난 대응을 직접 통제하며 공공 자원을 대규모로 투입하고 있습니다. 비용이 많이 들고 관료적이지만, 현장에서 실질적인 성과를 내고 있습니다."
 ALG_no_disasters_plan: "재난 대비 계획 부재"
 ALG_no_disasters_plan_desc: "알제리에는 현재 전담 재난 대응 체계가 없습니다. 위기가 닥치면 조율된 계획의 부재로 국가의 대응이 지연되고 비효율적이어서 피해가 악화됩니다."
 ALG_olympic_preparation: "올림픽 준비 프로그램"
 ALG_olympic_preparation_desc: "알제리는 올림픽 개최를 준비하는 데 막대한 투자를 하여 세계 수준의 스포츠 기반시설을 건설하고 국가 체육 육성 프로그램을 시작하고 있습니다."
 algerian_empowered_sharia_courts: "강화된 샤리아 법정"
 algerian_empowered_sharia_courts_desc: "이슬람 법정의 관할권이 확대되어 종교 당국이 민사 및 가족 문제에 더 큰 영향력을 행사하게 되었으며, 알제리의 법체계가 샤리아 쪽으로 이동하고 있습니다."
 algerian_gulen_movement: "귈렌 운동 계열 조직"
 algerian_gulen_movement_desc: "귈렌 운동에서 영감을 받은 네트워크가 알제리의 교육과 시민 사회에 뿌리내려 근대주의적 이슬람 접근법을 장려하고 국가 기관에서 상당한 영향력을 쌓고 있습니다."
 algerian_scientific_ventures: "알제리 과학 벤처"
 algerian_scientific_ventures_desc: "외국 파트너들과의 공동 과학 벤처 물결이 알제리 연구의 르네상스를 이끌고 있으며, 재생 에너지, 컴퓨팅, 재료 과학 분야의 새로운 프로젝트가 국제적 인정을 받고 있습니다."
 hoggar_nuclear_facility_idea: "호가르 핵 시설"
 ALG_2014_oil_crash_idea_desc: "2014년 유가 폭락은 알제리의 탄화수소 수입에 큰 타격을 주었고, 자원 의존적 경제 모델의 취약성을 드러내며 고통스러운 공공 지출 삭감을 강요했습니다."
 ALG_AU_pressure_idea_desc: "아프리카 연합이 지역 문제를 두고 알제리에 외교적 압박을 가하고 있으며, 이는 알제리의 외교 정책 선택지를 제약하고 이웃 국가들과의 관계를 복잡하게 만듭니다."
 ALG_black_market_desc: "국가의 그늘 아래에서 번성하는 암시장이 형성되어 공식 무역 통계를 훼손하고, 정부의 세수를 빼앗으며, 조직범죄 네트워크를 키우고 있습니다."
 ALG_clean_government_desc: "새로운 세대의 기술 관료들이 정부에 더 큰 투명성과 책임성을 가져왔습니다. 부패는 줄어들고 있으며 국가 기관에 대한 국민의 신뢰가 서서히 회복되고 있습니다."
 ALG_decline_of_tourism_desc: "알제리 관광 부문이 심각하게 쇠퇴하고 있습니다. 치안 우려, 열악한 기반시설, 까다로운 비자 제도로 인해 외국인 방문객에게 매력이 없는 나라가 되어 경제에 큰 손실을 입히고 있습니다."
 ALG_destroyed_agriculture_desc: "알제리의 농업 부문은 분쟁과 방치로 황폐해졌습니다. 농지는 휴경 상태이고, 농촌 공동체는 삶의 터전을 잃었으며, 식량 수입 의존도는 급격히 상승했습니다."
 ALG_election_time_idea_desc: "선거 운동이 진행 중이며 정치 의제를 지배하고 있습니다. 경쟁하는 세력들이 지지 기반을 결집하면서 기회와 불안정이 동시에 생겨나고 있습니다."
 ALG_emergency_budget_desc: "정부는 비상 예산 조항을 발동하여 필수적이지 않은 지출을 삭감하고, 심각한 경제 또는 안보 위기에 대응하기 위해 자원을 재배분했습니다."
 ALG_idea_joint_military_arab_desc: "알제리는 아랍 파트너들과 공동 군사 체계에 참여하여 역내에서 공조된 방위 계획, 정보 공유, 연합 훈련을 가능하게 하고 있습니다."
 ALG_insurgency_unleashed_desc: "알제리는 이웃 국가에서 반군 네트워크를 의도적으로 육성하여, 직접적인 군사적 개입 없이 비정규 대리 세력을 통해 영향력을 투사하고 경쟁국을 불안정하게 만들고 있습니다."
 ALG_national_dialogue_modifier_desc: "국민 대화 절차가 정부와 야당을 한자리에 모아 정치적 협상을 위한 드문 공간을 마련하고 즉각적인 대립 위험을 줄였습니다."
 ALG_political_repression_desc: "국가는 활동가를 체포하고 언론을 검열하며 보안 기관을 동원해 반대 의견을 침묵시키고 통제를 유지하는 체계적인 정치 탄압을 벌이고 있습니다."
 ALG_repression_modifier_desc: "탄압의 물결이 알제리의 정치 영역을 휩쓸었습니다. 야권 인사들이 구금되고, 언론은 침묵을 강요당하며, 대중 시위는 강제로 해산되고 있습니다."
 ALG_surveillance_state_modifier_desc: "알제리는 정교한 국내 감시 기반시설을 구축하여 통신을 감청하고 정치적 반대자와 시민 사회 활동가의 활동을 추적하고 있습니다."
 ALG_transparent_budget_desc: "알제리는 투명한 예산 보고를 도입하여 공공 지출의 세부 내역을 공개하고, 처음으로 정부 회계를 독립적인 검증에 열어 놓았습니다."
 algeria_cultural_rebirth_desc: "강력한 민족주의적 문화 부흥의 물결이 알제리를 휩쓸며 토착 유산과 역사를 드높이고 외래 문화의 영향을 주변화하고 있습니다."
 algeria_emerging_youth_desc: "정치적으로 참여적인 알제리 젊은 세대가 부상하여 민주적 개혁과 경제적 기회를 점점 더 단호하게 요구하고 있습니다."
 algeria_nationalist_youth_desc: "알제리의 청년 운동이 강한 민족주의 성향으로 돌아서서, 더 단호한 외교 정책과 구세력이 외세와 타협해 온 것으로 보는 관행의 종식을 요구하고 있습니다."
 hoggar_nuclear_facility_idea_desc: "아하가르 산맥 깊은 곳, 외딴 지역에 핵 연구 시설이 설립되었습니다. 이 시설의 존재는 외세의 모험주의에 대한 강력한 억지력으로 작용합니다."
 idea_alg_empowered_parliament_desc: "알제리 의회에 진정한 입법 권한이 부여되었습니다. 의회는 이제 예산, 입법, 장관 책임에 대해 실질적인 권한을 행사합니다."
 idea_algerian_oligarchy_arrests_desc: "핵심 과두 지배층의 체포는 알제리의 재계 엘리트를 뒤흔들었습니다. 대중에게는 인기가 있지만, 이 단속은 불확실성을 낳아 민간 투자를 얼어붙게 하고 있습니다."
 ALG_flavor_event.6.t: "난민 위기"
 ALG_flavor_event.6.d: "이웃 국가들의 분쟁과 불안정을 피해 난민의 물결이 국경을 넘어 밀려오고 있습니다. 우리의 기반시설은 한계에 이르렀고, 국민들은 대응 방식을 두고 의견이 갈리고 있습니다."
 ALG_flavor_event.6.a: "그들을 받아들여야 한다."
 ALG_flavor_event.7.t: "마약 밀매 위기"
 ALG_flavor_event.7.d: "조직범죄 네트워크가 알제리를 마약의 주요 환적 통로로 만들었습니다. 마약 거래는 지역 기관을 부패시키고 국경 지역의 폭력을 부추기고 있습니다."
 ALG_flavor_event.7.a: "밀매 조직을 단속한다."
 fra_colonial.1.t: "과거의 그림자"
 fra_colonial.1.d: "알제는 알제리에서의 프랑스 식민 유산을 공식적으로 규탄하여 오랜 상처를 다시 들추고 지중해 양쪽의 여론을 들끓게 했습니다. 우리 의회는 분열되어 있습니다. 일부는 우리의 역사적 기록을 고수하라고 요구하고, 다른 일부는 화해의 기회로 봅니다."
 fra_colonial.1.a: "우리의 역사적 기록을 옹호한다."
 fra_colonial.1.b: "화해의 제스처를 보낸다."
 algerian_event.51.d: "모든 예상을 뒤엎고 알제리의 우주 프로그램이 비범한 성과를 달성했습니다. 우리의 우주선이 달에 성공적으로 착륙했습니다. 공학과 국가적 의지의 이 승리는 알제리 국민을 열광시켰고 우리의 국기를 별들 사이에 올려놓았습니다."
 ALG_aouchiche_desc: "유세프 아우시시는 자유주의 개혁가이자 사회주의 세력 전선의 지도자입니다. 집권 기득권층을 목소리 높여 비판해 온 그는 민주적 개혁, 시민의 자유, 경제 현대화를 내걸고 선거 운동을 펼쳤습니다."
 ALG_hassani_desc: "압델알리 하사니 셰리프는 알제리 최대 이슬람주의 정당인 평화사회운동의 지도자입니다. 그는 민주적 규범 및 국민 화합과 조화를 이루는 온건한 정치적 이슬람을 옹호합니다."
 algeria_elections.a: "그렇게 결정되었다."
 alg_military_rule_option: "군의 결정을 지지한다."
 AlgeriaPoliticalEvents.1.t: "알제리의 정치적 재편"
 AlgeriaPoliticalEvents.1.d: "암흑의 10년이 끝나가면서, 알제리는 미래의 정치적 방향을 두고 중대한 선택에 직면해 있습니다. 서방과의 동반자 관계, 비동맹, 혹은 동방과의 긴밀한 관계 중 어느 길이든 국가의 정체성과 안정에 심대한 결과를 가져올 것입니다."
 AlgeriaPoliticalEvents.1.a: "국민적 토론을 시작한다."
 AlgeriaPoliticalEvents.20.t: "정부 내 이념 균열"
 AlgeriaPoliticalEvents.20.d: "분쟁이 잦아들면서, 알제리의 미래 정치 체제를 규정해야 한다는 압력이 정부 내에서 높아지고 있습니다. 강경파는 군의 지배를 요구하고, 온건파는 화해와 개혁을 추진하며, 이슬람주의 세력은 자유 선거를 촉구합니다."
 AlgeriaPoliticalEvents.20.a: "군에 권한을 부여한다."
 AlgeriaPoliticalEvents.20.b: "개혁과 화해를 추진한다."
 AlgeriaPoliticalEvents.20.c: "이슬람주의자들과 협상한다."
 Algeria.8.t: "알제리의 보호 요청"
 Algeria.8.d: "알제리 정부는 지역 불안정이 커지고 있음을 이유로 미국의 보호 또는 안전 보장을 공식 요청했습니다. 워싱턴은 이제 전략적 우산을 제공할지 결정해야 합니다."
 Algeria.8.a: "요청을 수락한다."
 Algeria.8.b: "이에 대해 약속할 수 없다."
 ALG_alignments: "외교 정책 노선"
 KBY_alg_modifier: "카빌 국가 변동치"
 ALG_algiers_metro: "알제 지하철 회랑"
 ALG_diplomatic_outreach_west: "서방에 대한 외교적 접촉"
 ALG_diplomatic_outreach_west_desc: "알제리와 워싱턴 및 유럽 동맹국들의 관계는 상호 불신으로 규정되어 왔습니다. 지속적인 외교 구상은 서방 세계와의 더 긴밀한 경제 및 안보 관계의 토대를 마련할 수 있습니다."
 ALG_diplomatic_outreach_china: "중국에 대한 외교적 접촉"
 ALG_diplomatic_outreach_china_desc: "베이징은 아프리카 대륙 전역에서 존재감을 꾸준히 확대해 왔습니다. 중국과의 관계를 심화하면 상당한 기반시설 투자를 이끌어내고 새로운 시장을 열 수 있지만, 서방 파트너들과의 관계는 복잡해질 수 있습니다."
 monitor_kabyle_unrest_desc: "카빌리 산악 지대는 끊임없는 화약고였습니다. 보안 기관은 사태 확대를 선제적으로 막기 위해 이 지역의 저항 활동을 면밀히 감시해야 합니다."
 kabyle_resistance_tooltip: "카빌리의 저항 활동이 여전히 높은 수준입니다."
 ALG_boost_reformists_desc: "알제리의 불투명한 정치 구조 안에서 기술 관료와 현대화론자 세력이 진정한 개혁을 추진해 왔습니다. 이들에게 정치적 보호막과 자원을 제공하면 내부 세력 균형을 개방 쪽으로 기울일 수 있습니다."
 ALG_boost_old_guard_desc: "독립 후 국가를 세운 군 장교와 FLN 참전용사로 이루어진 기존 네트워크는 변화의 속도에 불안을 느끼고 있습니다. 이들의 지위와 특권을 재확인하면 안정은 강화되지만 현상 유지가 고착됩니다."
 ALG_rally_students_desc: "대학 캠퍼스는 역사적으로 알제리 정치 변화의 원동력이었습니다. 학생 단체를 개혁 의제 아래 조직하면 아래로부터의 압력을 만들고 공론을 바꿀 수 있습니다."
 ALG_mobilize_veterans_desc: "독립 전쟁과 암흑의 10년의 참전 용사들은 알제리 사회에서 막대한 도덕적 권위를 지닙니다. 이들을 기존 질서 뒤에 결집시키면 현재의 정치적 경쟁에서 국가의 입장에 정당성을 부여할 수 있습니다."
 ALG_bribe_elites_desc: "알제리 권력 구조의 상당 부분은 비공식적인 후원과 호의의 네트워크로 운영됩니다. 핵심 인물들에게 계약, 임명, 금전적 혜택을 나누어 주면 충성심을 공고히 할 수 있지만, 이미 국가를 좀먹고 있는 부패를 심화시킵니다."
 ALG_seek_compromise_desc: "내부 논쟁의 양측이 고착된 상황에서, 중립적인 중재 노력이 교착 상태가 공개적 대립으로 번지는 것을 막을 유일한 방법일 수 있습니다. 타협은 누구도 완전히 만족시키지 못하겠지만 최악의 사태는 피할 수 있습니다."
 ALG_media_campaign_reform_desc: "국영 언론과 우호적인 민영 언론을 동원해 정치 쇄신의 필요성을 중심으로 한 담론을 구축할 수 있습니다. 개혁에 우호적인 여론을 조성하면 구세력의 발밑이 흔들립니다."
 ALG_security_crackdown_desc: "보안 기구를 동원해 개혁 운동을 부추기는 시위, 독립 언론, 시민 사회 단체를 단속할 수 있습니다. 이는 시간을 벌어주겠지만 나중에 더 큰 문제를 쌓아두게 됩니다."
 ALG_world_tension_security_desc: "지역 전반의 불안정이 커지면서 군부는 정치를 확고히 자신들의 통제 아래 두어야 한다는 새로운 논거를 얻고 있습니다. 이러한 분위기를 활용하면 구세력의 입지를 공고히 할 수 있습니다."
 ALG_world_tension_high_security_desc: "지역 분쟁이 알제리 국경으로 번지면서, 군부는 민간 개혁 옹호 세력을 사실상 배제하는 비상 권한을 요구하고 있습니다. 위기는 명분이 되지만, 정치적 경쟁을 중단하는 것은 장기적 위험을 수반합니다."
 ALG_path_crackdown_momentum_desc: "탄압이 성과를 내고 있습니다. 추가 보안 작전과 정치적 압박으로 기세를 유지하면 구세력의 국가 장악력이 깊어지겠지만, 한 걸음 나아갈 때마다 되돌리기는 더 어려워집니다."
 ALG_path_reconciliation_momentum_desc: "개혁 과정이 탄력을 받고 있습니다. 신뢰 구축 조치와 정치적 개방을 추가로 밀어붙이면 화해 의제를 되돌릴 수 없는 지점 너머로 이끌 수 있습니다."
 ALG_oil_patronage_desc: "알제리의 탄화수소 횡재는 오랫동안 사회적 평화를 사는 데 사용되어 왔습니다. 석유 수입의 일부를 표적 후원으로 돌리면 현재의 정치적 경쟁에서 핵심 지지층의 충성을 확보할 수 있습니다."
 ALG_economic_reforms_desc: "알제리의 국가 주도 경제는 매우 비효율적입니다. 민간 기업의 공간을 열고 관료적 장애물을 줄이는 신뢰할 만한 경제 개혁 패키지는 민심을 개혁 진영 쪽으로 돌릴 수 있습니다."
 ALG_ter_oboronaup_start_desc: "국가가 전쟁 중인 상황에서 국가방위군은 후방 지역을 방어하고 정규군 부대를 전선 작전에 투입할 수 있도록 지역 모집 영토방위 부대의 편성을 요구하고 있습니다."
 ALG_internalup_start_desc: "현 상황은 전선 후방의 질서를 유지하고 핵심 기반시설을 보호하며 적이 후방의 불안정을 이용하지 못하도록 막기 위한 전담 내부 보안 부대의 배치를 필요로 합니다."
 ALG_casablanca_mission: "카사블랑카 합의 추진"
 ALG_eliminate_GIA: "GIA 소탕"
 ALG_eliminate_GIA_desc: "무장 이슬람 집단은 한때 반란의 가장 잔혹한 얼굴이었습니다. 그들의 조직망은 분열되었고 대중의 지지는 무너지고 있으며, 국가는 이제 이 조직의 마지막 잔당을 해체하고 전국의 질서를 회복하고자 나섭니다."
 ALG_reintegration_programs: "재통합 프로그램"
 ALG_reintegration_programs_desc: "수년간의 폭력은 수천 명의 전직 전투원과 동조자를 알제리 사회 곳곳에 흩어 놓았습니다. 신중하게 감독되는 재통합 프로그램을 통해, 정부는 반란을 포기할 의향이 있는 이들에게 민간 생활로 돌아올 길을 제공할 것입니다."
 ALG_strengthen_DRS: "DRS 강화"
 ALG_strengthen_DRS_desc: "정보보안국은 암흑의 10년 동안 극단주의 조직망과의 싸움에서 결정적인 역할을 했습니다. 우리 정보기관의 역량을 강화하면 알제리가 다시는 그러한 혼란에 빠지지 않도록 보장할 수 있을 것입니다."
 ALG_coalition_economic_program_tt: "대통령 연립이 조율된 경제 개발 프로그램을 개시합니다."
 ALG_governmental_transparency_tt: "정부가 투명성 개혁을 약속하여 뿌리 깊은 부패는 약화되지만 군부의 이해관계는 반발합니다."
 ALG_ethnic_satisfaction_critical: "§R공공연한 적대§!"
 ALG_ethnic_satisfaction_low: "§Y깊은 분노§!"
 ALG_ethnic_satisfaction_moderate: "§Y들끓는 긴장§!"
 ALG_ethnic_satisfaction_high: "§G비교적 만족§!"
 ALG_deep_state_map_name: "알제 - 권력의 중심"
 ALG_hybrid_military_governance: "군부 혼합 통치"
 ALG_hybrid_military_governance_desc: "알제리는 군이 상당한 정치적 영향력을 유지하면서 민간 구조도 그대로 존속하는 혼합 체제로 운영됩니다."
 ALG_civil_war_brewing_added_tt: "§R내전 위험!§!\n쿠데타 저항 실패로 알제리가 불안정해졌습니다."
 ALG_accepted_foreign_intervention: "딥 스테이트에 맞선 지원 수락"
 ALG_military_coup_opinion: "알제리 군사 쿠데타"
 ALG_fulfilled_election_promise: "약속대로 민주주의 회복"
 ALG_broke_election_promise: "선거 실시 약속 파기"
 ALG_mod_name_mediene: "모하메드 메디엔"
 ALG_moi_name_loyalist: "충성파 기술 관료"
 minister_type_technocrat: "기술 관료"
 minister_type_loyalist: "충성파"
