 cyber_not_at_op_capacity_tt: "[THIS.GetNameWithFlag]の§Yサイバー司令部§!は最大運用能力に達していない。"
 cyber_has_valid_target_tt: "現在選択されている標的は、サイバー攻撃の有効な標的である。"
