 EH_set_up_electric_trap: "전기 함정 설치"
 EH_remove_electric_trap: "전기 함정 제거"
 EH_activate_electric_trap: "전기 함정 작동"
 EH_drone_mission_category: "드론 임무"
 EH_drone_mission_category_desc: "\n£EH_gui_drone_picture\n\n\n\n드론은 우리의 가장 뛰어나고 안전한 정찰 수단입니다. 드론 덕분에 병사들의 목숨을 위험에 빠뜨리지 않고도 적에 대한 정보를 수집할 수 있습니다. 드론으로 인근의 차원문을 정찰하여 적이 그 주변에 무엇을 건설하고 있는지 파악할 수 있으며, 이는 그러한 것들 중 하나와 벌이는 전투에서 전술적 우위를 점하는 데 도움이 될 수도 있습니다."
 EH_research_sites_category: "연구 거점"
 EH_research_sites_category_desc: "연구 거점은 키메라와 그들의 기술에 대한 더 많은 정보를 수집하는 최선의 방법입니다. 이러한 전초 기지는 가용한 최고의 과학자들을 끌어들일 뿐 아니라 우리의 특별 프로젝트에 대한 연구 보너스도 얻게 해 줍니다. 키메라 군이 이를 너무 빨리 알아채지 않기만을 바랄 뿐입니다."
 EH_setup_research_site: "연구 거점 설치"
 EH_install_anti_air_weapons: "대공 무기 설치"
 EH_panic_shelters_and_land_turrets: "비상 대피소 및 지상 포탑 건설"
 EH_hire_additional_security_for_scientists: "과학자 추가 경호 인력 고용"
 EH_disable_site_notifications: "연구 거점 습격 알림 비활성화"
 EH_enable_site_notifications: "연구 거점 습격 알림 활성화"
 EH_doudna_or_charpentier_project_mission: "§Y제니퍼 다우드나§!와 §Y에마뉘엘 샤르팡티에§! 특별 프로젝트"
 EH_doudna_or_charpentier_project_mission_desc: "§Y제니퍼 다우드나§!와 §Y에마뉘엘 샤르팡티에§!는 키메라의 유전적 구성을 더 잘 이해하는 데 도움이 될 수 있는 특별 프로젝트를 진행하고 있습니다. 크리스퍼 유전자 편집 기술에 대한 두 사람의 전문 지식은 이 생명체들의 약점에 대한 귀중한 통찰을 제공하여, 이들에 맞서 싸울 더 효과적인 전략을 개발할 수 있게 해 줄 것입니다."
 EH_find_new_veins_category: "새로운 랜달라이트 광맥 탐색"
 EH_find_new_veins_category_desc: "랜달라이트는 세계 곳곳의 특정 광맥에서 발견되는 희귀하고 귀중한 자원입니다. 이는 키메라와 싸우기 위한 신기술의 연구 개발에 필수적입니다. 탐사와 채굴 작업에 투자함으로써 새로운 랜달라이트 광맥을 발견하고 이 핵심 자원의 안정적인 공급을 확보할 가능성을 높일 수 있습니다.\n\n랜달라이트 광산은 매주 소량의 랜달라이트를 제공합니다. 대기업들이 이 자원의 채굴을 장악하여 우리에게 불쾌한 결정을 강요하기 전에, 가능한 한 많은 집중 산지를 찾아 확보해야 합니다."
 EH_search_for_randallite_veins: "랜달라이트 광맥 탐색"
 EH_set_up_mine_mission: "신규 광산 개설"
 EH_large_company_seeks_for_randallite_mission: "대기업의 랜달라이트 탐색"
 EH_outlaw_randallite_extraction: "비국가 랜달라이트 채굴 금지"
 EH_legalize_randallite_extraction: "비국가 랜달라이트 채굴 합법화"
 EH_construct_southern_zenobia_defense_line: "§G남부 제노비아§! 방어선 건설"
 EH_construct_western_zenobia_defense_line: "§G서부 제노비아§! 방어선 건설"
 EH_construct_inner_saladin_defense_line: "§G내부 살라딘§! 방어선 건설"
 EH_construct_outer_saladin_defense_line: "§G외부 살라딘§! 방어선 건설"
 EH_southern_zenobia_defense_line_destruction: "남부 제노비아 방어선 붕괴 중"
 EH_western_zenobia_defense_line_destruction: "서부 제노비아 방어선 붕괴 중"
 EH_inner_saladin_defense_line_destruction: "내부 살라딘 방어선 붕괴 중"
 EH_outer_saladin_defense_line_destruction: "외부 살라딘 방어선 붕괴 중"
 EH_nile_defense_line_category: "제노비아 및 살라딘 방어선"
 EH_nile_defense_line_category_desc: "나일 방어선은 아프리카에서 키메라 군에 맞서 전선을 지킬 최선의 기회입니다. 제노비아 선이 우리의 첫 번째 방어선이 될 것이며, 제노비아 선이 무너지면 살라딘 선이 우리의 마지막 희망이 될 것입니다. 이 전쟁에서 우리의 생존이 달려 있는 만큼 두 방어선 모두 견고히 요새화되고 병력이 배치되도록 해야 합니다."
 EH_bosporus_defense_line_category: "보스포루스 방어선"
 EH_bosporus_defense_line_category_desc: "보스포루스 방어선은 유럽에서 키메라 군에 맞서 전선을 지킬 최선의 기회입니다. 이 방어선은 중포와 대공 방어 시설, 그리고 참호와 벙커 망으로 요새화될 것입니다. 대부분의 유럽 국가 군대가 그곳에 주둔할 것입니다. 이 방어선이 반드시 버티도록 해야 합니다."
 EH_construct_bosphorus_defense_line: "§G보스포루스§! 방어선 건설"
 EH_bosphorus_defense_line_destruction: "보스포루스 방어선 붕괴 중"
 EH_caucasus_defense_line_category: "캅카스 방어선"
 EH_caucasus_defense_line_category_desc: "적이 중동을 빠르게 휩쓸며 우리의 남쪽 국경을 위협하고 있습니다. 캅카스 방어선은 이 지역에서 키메라 군에 맞서 전선을 지킬 최선의 기회입니다. 이 요새는 이중 방어 체계가 될 것이며, 첫 번째 선은 참호와 벙커로, 두 번째 선은 중포와 대공 방어 시설로 요새화됩니다. 이 방어선이 반드시 버티도록 해야 하며, 방어선이 후방에서부터 무너지지 않는 한 티베트에서 키메라를 저지할 수 있기를 바랍니다."
 EH_construct_caucasus_defense_line: "§G캅카스§! 방어선 건설"
 EH_caucasus_defense_line_destruction_1: "첫 번째 캅카스 방어선 붕괴 중"
 EH_caucasus_defense_line_destruction_2: "두 번째 캅카스 방어선 붕괴 중"
 EH_event.0.t: "이벤트 호라이즌 방문 환영!"
 EH_event.0.d: "이벤트 호라이즌은 스팀 워크숍 구독자 100만 명을 기념하여 만든 우리의 첫 대규모 특별 시나리오입니다. 이는 전쟁 중심의 시나리오로, 인류가 미지의 외계 침략자들에 맞서 생존을 위해 싸웁니다. 이 시나리오는 독특한 중점 계통도, 새로운 사건, 결정, 메커니즘, 부대와 자원을 갖추어 이 장대한 생존 투쟁에 여러분을 몰입시킬 것입니다. 미지의 존재와 맞서고 인류를 승리로 이끌 준비를 하십시오. 그리고 여러분의 응원에 감사드립니다!"
 EH_event.0.a: "우와아아!!! 잠깐, 외계인?!!!"
 EH_event.1.t: "제노비아 선과 살라딘 선 건설 중"
 EH_event.1.d: "사하라 이남 아프리카에서 부상하는 위협이 커짐에 따라, 중동 동맹은 이집트의 남부 나일강 및 서부 사막 구역을 따라 요새화된 방어선을 신속히 건설하도록 승인했습니다. 제노비아 선으로 명명된 이 방어 진지는 주요 접근로에 중포 진지와 참호 체계를 거점으로 배치할 것입니다.\n\n제노비아 선이 무너지면 그 뒤에 살라딘 선이 버티고 서 있습니다. 포트사이드에서 홍해에 이르는 운하 지대 전체에 걸친 이 요새는 절대 방어선 역할을 할 것입니다.\n"
 EH_event.1.a: "사막이 우리의 방패가 되게 하라"
 EH_event.300.t: "경계를 넘어선 CERN"
 EH_event.300.d: "유럽 원자핵공동연구소(CERN)의 연구진이 통제된 고에너지 충돌 실험에 성공하여 '국지적 차원 간 이상 현상'이라 불리는 것을 일시적으로 생성했습니다.\n\n균열은 아원자 수준에서 측정되었고 나노초의 극히 짧은 순간 동안만 지속되었지만, 알려진 물리 법칙과 일치하지 않는 에너지 신호가 기록된 최초의 사례입니다. 초기 격리 절차는 유지되었고 물질 이동은 관측되지 않았지만, 그 함의는 이미 전 세계 과학계에 충격파를 보내고 있습니다.\n\n이론과 현실의 경계가 방금 흐려졌습니다."
 EH_event.300.a: "이것이 정말 안전한가?"
 EH_event.301.t: "중앙아프리카에서 UN 호송대 실종"
 EH_event.301.d: "르완다와 콩고 민주공화국 사이의 접경 지역에서 활동하던 유엔 인도주의 호송대의 연락이 두절되었습니다. 위성 영상에는 정글 경로를 따라 잔해와 전복된 차량이 흩어져 있는 흔적이 보이지만, 조난 신호는 수신되지 않았습니다.\n\n생존자나 시신은 발견되지 않았습니다. 어떤 반군 세력도 책임을 주장하지 않았습니다. 사건의 원인은 공식적으로 불명 상태로 남아 있습니다."
 EH_event.301.a: "또 한 번의 UN 평화유지군 공격이라니..."
 EH_event.302.t: "타림 분지의 이상 지진 활동"
 EH_event.302.d: "중국 서부 타림 분지에서 얕고 고주파인 진동이 무리 지어 기록되었습니다. 이 지진 패턴은 자연적인 지각 운동이나 알려진 지하 활동과 일치하지 않습니다. 중국 당국은 성명을 발표하지 않았지만, 대학 교류 프로그램을 통해 조용히 공유된 지역 지진학 데이터가 지구물리학자들 사이에서 의문을 불러일으켰습니다."
 EH_event.302.a: "측정값이 말이 되지 않는다"
 EH_event.303.t: "파미르 고원의 무선 침묵"
 EH_event.303.d: "중국-타지키스탄 국경 인근 고지대에 있는 인민해방군 청취 초소가 모든 통신을 중단했습니다. 베이징으로부터 공식 발표는 없었으나, 한 카자흐스탄 아마추어 무선사가 완전한 침묵이 오기 전 표준 중국어로 된 짧은 긴급 송신을 들었다고 보고했습니다. 정보 위성에는 눈에 띄는 손상의 흔적이 보입니다."
 EH_event.303.a: "타지키스탄의 공격이었을까?"
 EH_event.304.t: "알래스카 북부에서 레인저 실종"
 EH_event.304.d: "데날리 국립공원의 외딴 구역을 순찰하던 국립공원 레인저 2명이 72시간 동안 연락이 없어 실종으로 선언되었습니다. 수색대가 파견되었으나 격투의 뚜렷한 흔적이 남은 버려진 야영지만 발견했습니다.\n\n처음에는 지역 신문에만 보도된 이야기였지만, 수색대마저 흔적도 없이 사라지면서 전국적, 국제적 관심을 끌기 시작했습니다. FBI는 이제 수사에 착수했으며 대규모 추적이 진행 중입니다."
 EH_event.304.a: "살인범이 활개 치고 있는 건가?"
 EH_event.305.t: "페루 고원의 기이한 발병"
 EH_event.305.d: "페루 남부 안데스 고원의 한 외딴 마을이 정체불명의 발병으로 인해 지역 보건 당국에 의해 격리되었습니다. 초기 보고는 주민들 사이에서 발열, 환각, 급성 감각 방향 상실이 나타났다고 설명합니다. 증상은 마을 인근 좁은 계곡 안에서만 감지된 '섬광'과 진동이 보고된 직후 급속히 나타났습니다.\n\n페루 당국은 이것이 고립된 곰팡이 감염이라고 주장하지만, 인근에서 활동하는 NGO들은 의료팀이 군 인력의 호위를 받았다고 말합니다. 인근 동굴을 조사하던 연구팀의 일원인 산마르코스 국립대학교의 지질학자가 실종자 중에 포함되어 있습니다."
 EH_event.305.a: "계속 보고하라"
 EH_event.306.t: "신장의 불안: 군 기지 공격당함"
 EH_event.306.d: "신장 서부 카슈가르 인근에서 폭력 사건이 발생했습니다. 중국 국영 언론은 침묵하고 있으나, 정보 보고에 따르면 예청 인근의 인민해방군 시설인 36 기지가 밤사이 정체불명의 적대 세력에게 제압당했습니다. 무선으로 전달된 설명은 공격자의 실체에 관해 거의 앞뒤가 맞지 않았습니다.\n\n인민해방군은 이 지역에 기계화 부대와 화학 대응팀의 긴급 배치를 시작했습니다. 이른 새벽 카슈가르 공항에 수송기들이 착륙하는 모습이 목격되었습니다.\n\n이례적으로 러시아 신속 대응 파견대도 쿨마 고개를 통해 중국으로 넘어왔습니다."
 EH_event.306.a: "베이징에 따르면 상황은 통제 중"
 EH_event.307.t: "중국 서부에서 전술핵 폭발"
 EH_event.307.d: "카슈가르 동쪽 약 120km 지점 타클라마칸 사막 인근에서 전술핵 폭발이 감지되었습니다. 폭발은 이 지역의 미지의 위협을 억제하기 위해 인민해방군 부대가 배치된 지 닷새 후에 일어났습니다.\n\n베이징과 모스크바 모두 핵무기 사용을 부인했지만, 지진 데이터는 러시아 전술 핵탄두와 일치하는 저출력 폭발을 확인해 줍니다. 위성 사진에는 불에 탄 지형, 붕괴한 지층, 그리고 빠르게 팽창하는 검은 구체가 나타나 있습니다.\n\n국제 참관인들은 해명을 요구하고 있지만 공식 채널은 침묵하고 있습니다. 군 내부에서는 이 타격이 비상 교전 교리에 따른 러시아 야전 사령부의 독단적 결정이었다는 추측이 커지고 있습니다."
 EH_event.307.a: "그곳에서 무슨 일이 벌어지고 있는 거지?!"
 EH_event.308.t: "찢어진 장막"
 EH_event.308.d: "익명의 정보원이 유출한 위성 사진이 전 세계로 퍼졌습니다. 타격 지점의 불탄 잔해 위로 거대하고 보랏빛으로 맥동하는 구체가 솟아 있고, 그 안에서 생물체 무리가 쏟아져 나오고 있습니다. 과학자들은 이 사진을 설명하지 못하고 있습니다. 영상은 핵 타격이 그것을 파괴하는 데 실패했으며, 오히려 그것을 성장시켰을 뿐임을 분명히 보여 줍니다. 몇 시간 안에 비슷한 규모와 효과를 지닌 새로운 차원문 3개가 솟아났습니다.\n- 알래스카 북서부\n- 케냐 고원, 엘곤 산 인근\n- 칠레 남부, 케이프 혼 인근.\n\n이 생물체들이 극도로 공격적이라는 보고가 이미 쏟아지고 있습니다. 평온한 시대는 끝났습니다."
 EH_event.308.a: "진실은 더 이상 부정할 수 없다"
 EH_event.309.t: "UN의 긴급 총회 소집"
 EH_event.309.d: "대중의 공포가 커지고 각국 정부에 대한 신뢰가 흔들리는 가운데, 유엔은 긴급 회기에 돌입했습니다. 총회는 좀처럼 사용되지 않는 위기 권한을 발동했고, 안전보장이사회는 공조 대응 전략을 두고 긴급 토론에 들어갔습니다.\n\n제안은 전 세계적 군사 협력에서 공동 과학 태스크포스에 이르기까지 다양합니다. 책임 공방이 오가고 각자의 의도가 충돌하면서 상임이사국들 사이의 긴장이 고조되고 있습니다.\n\n그러나 초기 교전 보고가 조금이라도 단서가 된다면, 한 가지 진실은 이미 분명합니다. 인류는 단결하지 않으면 멸종에 직면할 것입니다."
 EH_event.309.a: "전 지구적 대응이 형태를 갖추기 시작한다"
 EH_event.310.t: "통합 사령부"
 EH_event.310.d: "UN 긴급 총회는 UN 합동 사령부(UNJC)의 창설과 함께 막을 내렸습니다. 이 국제 기구는 급속히 확산되는 초차원적 위협에 맞선 군사 전략, 정보, 병참 지원을 조율하는 임무를 맡습니다. 기본적으로 자문 기구이지만, 사령부에는 전례 없는 작전 재량이 부여되었습니다.\n\n이와 병행하여, 유럽 연합 같은 지역 블록들은 멸종에 직면하여 원활한 동원과 주권 공유가 필요하다는 점을 들어 완전한 정치적, 군사적 통합 제안을 띄우기 시작했습니다. 한때 상상할 수 없던 일이 이제 대륙 전역의 의회에서 공공연히 논의되고 있습니다."
 EH_event.310.a: "하나의 적. 하나의 전쟁"
 EH_event.401.t: "북아메리카 합중국"
 EH_event.401.d: "우리 정부는 대륙의 통합을 촉구할 준비가 되었습니다. 이제 단결하여 위협에 함께 맞설 때입니다. 오직 하나로 뭉쳐야만 우리는 살아남을 수 있습니다."
 EH_event.401.a: "해 보자"
 EH_event.402.t: "[FROM.GetAdjectiveCap] 정부의 통합 촉구"
 EH_event.402.d: "[FROM.GetName]은(는) 국민에게 한 역사적인 연설에서, 키메라의 위협에 맞선 통합 전선을 형성하기 위해 북아메리카의 군사 및 정치 구조를 인접 국가들과 통합할 것을 촉구했습니다. 급속히 퍼지는 차원문과 그 괴물 같은 거주자들이 제기하는 존립의 위협을 거론하며, 정부는 오직 단결을 통해서만 생존을 보장할 수 있다고 강조했습니다.\n\n제안에는 공유된 지휘 구조, 자원의 공동 운용, 통합 방위 체계, 그리고 단일 영토가 포함됩니다."
 EH_event.402.a: "때가 되었다"
 EH_event.403.t: "중앙아메리카 공화국"
 EH_event.403.d: "북아메리카의 선례를 따라, 이제 우리나라도 이웃 나라들과 통합할 때가 되었습니다. 우리 나라들은 남아메리카나 북아메리카의 국가들만큼 강하지 않지만, 함께라면 큰 변화를 만들 수 있습니다."
 EH_event.403.a: "우리 국민의 생존을 위해"
 EH_event.404.t: "[FROM.GetAdjectiveCap] 정부의 통합 촉구"
 EH_event.404.d: "[FROM.GetName]으로부터 키메라의 위협에 대한 방어를 더 잘 조율하기 위해 중앙아메리카 국가들을 단일 국가로 통합하자는 뜻밖의 제안이 들어왔습니다.\n\n일부 지도자들은 주권 문제를 우려하고 있지만, 상황의 긴박함 때문에 이 제안을 진지하게 검토하게 되었습니다."
 EH_event.404.a: "무슨 일이 있어도 해야 한다"
 EH_event.405.t: "남아메리카 국가 연합"
 EH_event.405.d: "우리는 현재 아메리카에서 유일하게 통합되지 않은 지역입니다. 우리 나라들은 강하지만, 키메라의 위협에 홀로 맞설 만큼 강하지는 않습니다. 이제 단결하여 위협에 함께 맞설 때입니다."
 EH_event.405.a: "초청장을 보내라"
 EH_event.406.t: "[FROM.GetAdjectiveCap] 정부의 통합 촉구"
 EH_event.406.a: "우리 대륙의 미래를 위해"
 EH_event.407.t: "유럽 연방"
 EH_event.407.d: "우리 대륙은 오늘날보다 더 단결된 적이 없었습니다. 유럽 연합과 NATO는 수년에 걸쳐 강력한 유대를 구축해 왔지만, 이제는 그것을 한 단계 더 끌어올릴 때입니다. 키메라의 위협에 함께 맞서기 위해 하나의 국가로 단결해야 합니다."
 EH_event.407.a: "브뤼셀에서 만나자"
 EH_event.408.t: "[FROM.GetAdjectiveCap] 정부의 통합 촉구"
 EH_event.408.d: "오늘 [GetDateText], [FROM.GetAdjectiveCap] 정부는 키메라의 위협에 대한 방어를 더 잘 조율하기 위해 유럽 국가들을 하나의 연방 실체로 통합하자고 공식 제안했습니다. 아메리카 대륙의 선례를 보면 어느 한 나라가 우리 대륙에도 같은 제안을 내놓으리라는 것은 확실했습니다.\n\n이것이 국가 독립이라는 민주주의적 가치에 어긋날 수 있지만, 상황의 긴박함이 대부분의 이념적 견해를 흐려 놓았습니다."
 EH_event.408.a: "예전에도 하나였고, 오늘도 하나다"
 EH_event.409.t: "아프리카 방어 거점"
 EH_event.409.d: "우리 대륙은 최근 많은 전쟁을 겪었지만, 아직 희망이 남아 있습니다. 아프리카 국가들은 단결하여 키메라의 위협에 함께 맞서야 합니다. 그것이 유일한 선택지임을 그들도 이해해야 합니다."
 EH_event.409.a: "아프리카의 생존을 위해"
 EH_event.410.t: "[FROM.GetAdjectiveCap] 정부의 통합 촉구"
 EH_event.410.d: "모든 어려움에도 불구하고 [FROM.GetName] 정부는 키메라의 위협에 맞서 하나로 서기 위해 아프리카 국가들의 통합을 제안했습니다. 일부 국가들은 최근의 분쟁에서 여전히 회복 중이지만, 상황의 긴박함이 우리의 지역 문제들보다 더 중요합니다."
 EH_event.410.a: "그것이 우리가 할 수 있는 최선이다"
 EH_event.411.t: "동부 대륙 연합"
 EH_event.411.d: "우리는 다른 대륙들의 선례를 따라야 합니다. 우리 나라들은 강하지만, 키메라의 위협에 홀로 맞설 만큼 강하지는 않습니다. 우리의 차이를 제쳐 두고 하나로 단결해야 합니다."
 EH_event.411.a: "초청장을 보내라"
 EH_event.412.t: "[FROM.GetAdjectiveCap] 정부의 통합 촉구"
 EH_event.412.d: "우리 나라들은 최근 수많은 잔혹한 분쟁을 겪었습니다. [FROM.GetName]은(는) 차이를 제쳐 두고 키메라의 위협에 함께 맞서기 위해 하나로 단결하자고 제안하고 있습니다. 쉬운 대화는 아니었지만, 키메라는 우리의 지역 문제보다 훨씬 더 큰, 우리 모두에 대한 위협입니다."
 EH_event.412.a: "당분간은 함께하자"
 EH_event.413.t: "유라시아 연방"
 EH_event.413.d: "우리의 위대한 세력은 단결을 유지해야 합니다. 키메라의 위협이 우리 국경에 점점 가까워지고 있습니다. 우리 나라들은 강하지만, 키메라의 위협에 홀로 맞설 만큼 강하지는 않습니다. 이제 단결하여 위협에 함께 맞설 때입니다."
 EH_event.413.a: "모스크바에서 만나자"
 EH_event.414.t: "[FROM.GetAdjectiveCap] 정부의 통합 촉구"
 EH_event.414.d: "시국이 엄중합니다. [FROM.GetName] 정부는 키메라의 위협에 대한 방어를 더 잘 조율하기 위해 유라시아 국가들을 하나의 연방 실체로 통합하자고 제안했습니다. 러시아 군대와 경제의 보호 아래, 우리는 키메라 군을 이 행성에서 몰아낼 수 있을 것입니다."
 EH_event.414.a: "CSTO 만세!"
 EH_event.415.t: "세 봉우리"
 EH_event.415.d: "우리의 위대한 국가는 손상되지 않고 남아야 하므로, 공산주의 동맹국들을 단결시킬 때입니다. 함께라면 우리는 키메라의 위협에 맞서고 살아남아 또 다른 날을 볼 수 있습니다."
 EH_event.415.a: "베이징이 길을 이끌 것이다"
 EH_event.416.t: "[FROM.GetAdjectiveCap] 정부의 통합 촉구"
 EH_event.416.d: "중국은 다른 대륙들처럼 또 다른 거대 연방을 형성하는 데 열려 있지 않지만, 우리 나라들은 언제나 서로 가까웠습니다. [FROM.GetName] 정부는 키메라의 위협에 함께 맞서기 위해 우리나라들을 하나의 깃발 아래 통합하자고 제안했습니다."
 EH_event.416.a: "마지막 공산주의의 보루"
 EH_event.417.t: "아세안 연합"
 EH_event.417.d: "우리는 최근 거대 국가들에 둘러싸여 왔습니다. 게다가 우리 상황을 더욱 악화시키는 것은 중국에 있는 인근의 키메라 차원문입니다. 이제 단결하여 위협에 함께 맞설 때입니다."
 EH_event.417.a: "우리는 이미 너무 오래 기다렸다"
 EH_event.418.t: "[FROM.GetAdjectiveCap] 정부의 통합 촉구"
 EH_event.418.d: "[FROM.GetName] 정부는 키메라의 위협에 대한 방어를 더 잘 조율하기 위해 동남아시아 국가들을 하나의 실체로 통합하자고 제안했습니다. 다른 대륙들에서의 최근 통합을 보면 우리 나라들 중 한 곳이 같은 제안을 내놓는 것은 시간문제였습니다."
 EH_event.418.a: "우리의 유일한 선택지"
 EH_event.419.t: "동아시아 연합"
 EH_event.419.d: "위협이 우리 국경에 점점 가까워지고 있습니다. 중국에서 오는 키메라 군뿐만 아니라 중국 자체와 그 새로운 동맹국들로부터도 마찬가지입니다. 우리가 이 전쟁에서 수수방관하지 않을 것임을 보여 줍시다."
 EH_event.419.a: "우리 섬들의 안보를 위해"
 EH_event.420.t: "[FROM.GetAdjectiveCap] 정부의 통합 촉구"
 EH_event.420.d: "[FROM.GetName] 정부는 키메라의 위협과 중국의 커져 가는 영향력 모두에 대한 방어를 더 잘 조율하기 위해 동아시아 국가들을 하나의 실체로 통합하자고 제안했습니다."
 EH_event.420.a: "최악에 대비하라"
 EH_event.421.t: "오세아니아 방위 연합"
 EH_event.421.d: "세계의 나머지는 단결했습니다. 우리는 이 전쟁이 우리 섬에는 미치지 않을 것이라 생각했지만, 이는 시간문제일 뿐입니다. 우리 나라들은 대체로 평화롭게 살아왔지만, 이제 단결하여 우리의 보금자리를 지킬 때입니다."
 EH_event.421.a: "오세아니아의 생존을 위해"
 EH_event.422.t: "[FROM.GetAdjectiveCap] 정부의 통합 촉구"
 EH_event.422.d: "[FROM.GetName] 정부는 오세아니아 국가들의 통합을 제안했습니다. 우리 나라들은 주요 분쟁 지역에서 멀리 떨어져 있지만, 다른 대륙들에서의 최근 통합은 우리가 어떤 상황에도 대비해야 함을 깨닫게 했습니다."
 EH_event.422.a: "그렇게 하자."
 EH_event.423.t: "북아메리카 합중국의 부상"
 EH_event.423.d: "키메라의 위협에 대한 미국 정부의 신속한 대응이 북아메리카 합중국(USNA)의 공식 수립으로 결실을 맺었습니다. 몇 주에 걸친 치열한 협상 끝에, 대륙의 국가들은 각자의 국가 정부를 해산하고 단일 연방 실체로 통합하는 데 합의했습니다.\n\nUSNA는 이제 통합된 군사력, 중앙집권화된 병참, 그리고 단일 전시 정부를 지휘합니다."
 EH_event.423.a: "새로운 시대가 시작된다"
 EH_event.424.t: "중앙아메리카 공화국 통합"
 EH_event.424.d: "중앙아메리카의 지도자들은 각자의 국가 정부를 해산하고 단일 실체인 중앙아메리카 공화국(RCA)으로 통합하는 데 합의했습니다. 이 통합이 전적으로 키메라의 위협 때문에 촉발되었는지, 아니면 USNA 자체가 가하는 위협 때문이기도 한지는 분명하지 않습니다. 그러나 한 가지는 확실합니다. 또 하나의 국가 집단이 종말적 위협에 맞설 준비를 마쳤습니다."
 EH_event.424.a: "누가 이런 일을 상상이나 했겠는가?"
 EH_event.425.t: "남아메리카 국가 연합 결성"
 EH_event.425.d: "아메리카의 마지막 부분이 마침내 통합되었습니다. 몇 주에 걸친 협상 끝에, 남아메리카 국가들은 하나의 깃발 아래 단결하기로 합의했으니, 바로 남아메리카 국가 연합(UNASUR)입니다.\n\n아메리카 전체가 이제 위협에 함께 맞설 준비를 갖추었습니다."
 EH_event.425.a: "한 줄기 희망"
 EH_event.426.t: "유럽 연방의 탄생"
 EH_event.426.d: "수개월에 걸친 정치적 줄다리기, 긴급 회기, 그리고 늘어나는 사상자 끝에, 유럽 연합은 초국가적 틀을 해체하고 단일 연방 거대 국가인 유럽 연방으로 재구성하기로 표결했습니다.\n\n스위스와 핀란드처럼 역사적으로 중립이었던 국가들조차 장기간의 내부 논쟁과 국민투표를 거쳐 키메라가 제기하는 존립의 위협을 이유로 가입을 선택했습니다. 국가 군대가 통합되고 국경이 지워진 지금, 유럽 연방은 통합 지휘 구조, 공동 운용 자원, 그리고 단일 전시 정부를 갖추고 있습니다.\n\n비평가들은 성급한 통합과 독립성 상실을 경고하지만, 지지자들은 전면적인 통합이 아니고서는 생존을 보장할 수 없다고 주장합니다."
 EH_event.426.a: "생존에는 국경이 없다"
 EH_event.427.t: "아프리카 방어 거점의 결성"
 EH_event.427.d: "역사적인 조치로, 아프리카 국가들이 하나로 뭉쳐 아프리카 방어 거점(ADP)을 결성했습니다.\n\n여전히 남아 있는 지역 분쟁과 경제적 격차에도 불구하고, 지도자들은 단결을 통해서만 자국민과 영토를 지킬 수 있다는 데 합의했습니다. 아프리카는 이제 키메라의 위협에 맞선 세계적 투쟁에 크게 기여할 태세를 갖추었습니다."
 EH_event.427.a: "아프리카는 하나로 선다"
 EH_event.428.t: "동부 대륙 연합 수립"
 EH_event.428.d: "놀라운 사태 전개로, 중앙아시아와 북아프리카 전역의 국가들이 각자의 국가 정부를 해산하고 동부 대륙 연합(ECU)을 결성하기로 합의했습니다.\n\n이번 조치는 키메라의 침투가 격화되고 파편화된 대응이 더 큰 손실만 불러왔다는 인식 속에서 나왔습니다.\n\n일부 분쟁은 아직 해결과 거리가 멀지만, 키메라 위협의 긴박함이 지도자들로 하여금 주권보다 생존을 우선하게 만들었습니다."
 EH_event.428.a: "이 동맹이 버틸 수 있을까?"
 EH_event.429.t: "유라시아 연방 공식 결성"
 EH_event.429.d: "모스크바 회담이 끝났으며 이제 세계는 유라시아 연방(ERF)의 탄생을 목격하고 있습니다. 많은 나라가 이 통합이 러시아에 의해 강요된 것인지 추측하지만, 진실은 모든 국가가 키메라의 위협에 함께 맞서기 위해 통합에 동의했다는 것입니다.\n\n러시아가 이 상황을 이용해 소련을 복원하거나 다시 한번 유럽에 위협이 될 수 있다는 소문도 있습니다."
 EH_event.429.a: "남은 의문이 너무 많다..."
 EH_event.430.t: "세 봉우리의 통합"
 EH_event.430.d: "북한, 몽골, 중국이 하나의 깃발 아래 공식적으로 통합했으니, 바로 세 봉우리입니다. 이 통합은 중국 정부로부터 비판을 받았지만, 동맹국들과의 강한 관계와 키메라의 위협이 마음을 바꾸게 했습니다.\n\n새로운 국가는 이제 위협에 함께 맞설 준비를 마쳤습니다."
 EH_event.430.a: "뭐, 나쁘지 않군..."
 EH_event.431.t: "아세안 연합 결성"
 EH_event.431.d: "아시아의 또 다른 지역이 통합했습니다. 최근 중동 국가들과 세 봉우리의 통합이 동남아시아 국가들로 하여금 같은 길을 가도록 이끌었습니다."
 EH_event.431.a: "세계가 이처럼 단결한 적은 없었다"
 EH_event.432.t: "동아시아 연합 수립"
 EH_event.432.d: "마지막 아시아 국가들이 통합했습니다. 몇 주에 걸친 협상 끝에, 동아시아 국가들은 각자의 국가 정부를 해산하고 단일 실체인 동아시아 연합(EAC)으로 통합하기로 합의했습니다.\n\n중국의 커져 가는 영향력과 인근의 키메라 차원문 속에서, 새로운 국가는 이제 키메라의 위협뿐 아니라 중국 자체의 있을 수 있는 침략에도 맞설 준비를 하고 있습니다."
 EH_event.432.a: "분열보다는 단결이 낫다"
 EH_event.433.t: "오세아니아 방위 연합 창설"
 EH_event.433.d: "오세아니아 국가들이 하나로 뭉쳐 오세아니아 방위 연합(ODU)을 결성했습니다. 지리적 고립과 경제적 격차에도 불구하고, 지도자들은 단결을 통해서만 자국민과 영토를 지킬 수 있다는 데 합의했습니다.\n\nODU는 이제 키메라의 위협에 맞선 세계적 투쟁에 크게 기여할 태세를 갖추었습니다.\n\n오세아니아가 통합됨으로써 세계는 이제 완전히 여러 거대 국가로 분할되었습니다. 유엔은 마지막 국제기구로 남아 세계적 전쟁 수행을 지원하기 위해 최선을 다하고 있습니다."
 EH_event.433.a: "멋진 신세계"
 EH_event.434.t: "세계 통신을 교란하는 차원문 에너지"
 EH_event.434.d: "키메라 차원문이 출현한 이후 몇 주 동안 세계 통신망은 전례 없는 교란을 겪고 있습니다. 위성 링크는 간헐적으로 끊기고, 해저 케이블에서는 불규칙한 데이터 손실이 나타나며, 지상 통신망은 원인 불명의 간섭에 시달리고 있습니다.\n\n전문가들은 차원문이 기존 통신 기술을 방해하는 독특한 형태의 전자기 복사를 방출한다고 믿습니다. 이 적대적 환경에서 작동할 수 있는 새로운 프로토콜과 하드웨어를 개발하려는 노력이 진행 중이지만, 당분간 정보 흐름은 심각하게 훼손된 상태로 남아 있습니다."
 EH_event.434.a: "빨리 해결하라!"
 EH_event.500.t: "랜달라이트의 발견"
 EH_event.500.d: "최초의 차원문이 지구를 찢고 나타난 이후, 정체불명의 금속 물질 조각이 전 세계에서 발견되었습니다. 대부분은 기존 금속이 차원 변환을 거친 것으로, 기이하지만 비활성이라고 추정했습니다.\n\n오늘 그것이 바뀌었습니다. 고차원 물리학 분야의 세계적 석학이자 이론물리학자인 리사 랜들 박사가 이 물질의 구조와 특성을 풀어냈으며, 이것이 군사적 활용 가능성이 엄청난 안정적이고 가벼우며 매우 탄성이 강한 금속임을 밝혀냈습니다.\n\n이제 랜달라이트라 명명된 이 물질은 강도, 내열성, 유연성을 겸비하여 첨단 합금에 독보적으로 적합합니다. 적절히 정제하면 우리가 승리하도록 돕는 차세대 전쟁 기계의 토대가 될 수 있습니다."
 EH_event.500.a: "드디어 좋은 소식이군"
 EH_event.501.t: "HACS 프레임 시제품 공개"
 EH_event.501.d: "수개월에 걸친 가속 개발 끝에 고기동 전투 체계(HACS)의 첫 시제품 프레임이 [FROM.GetAdjective] 팀에 의해 성공적으로 제작되었습니다.\n\n랜달라이트로 강화된 이족 보행 차체로 설계되고 통합 부스터 추진기를 갖춘 HACS 플랫폼은 화력과 생존성 사이의 간극을 메우도록 설계되었습니다. 전차는 너무 느리고 항공기는 키메라의 위협에 너무 취약한 곳에서, HACS는 중화기 탑재량을 희생하지 않고도 필요한 기동성을 제공합니다.\n\n아직 시험 중이지만, 이 돌파구는 차세대 최전선 부대를 향한 중요한 한 걸음입니다. HACS를 실전 투입 가능한 형태로 만들기 위한 전담 연구 프로그램이 승인되었습니다."
 EH_event.501.a: "새로운 전쟁의 시대"
 EH_event.511.t: "대형 망치 작전"
 EH_event.511.d: "동유럽 전역에서의 수개월에 걸친 뼈아픈 손실과 발칸 방어망의 붕괴 이후, 유럽 연방은 보스포루스 선을 되찾고 유럽과 중동 사이의 전략적 회랑을 다시 열기 위한 고위험 군사 공세인 대형 망치 작전을 개시했습니다. 새로 배치된 HACS 부대가 선봉에 서고 포병, 해군, 미사일 타격이 연계 지원하는 이 공세는 이스탄불의 폐허와 그 주변 구릉에 참호를 파고 들어앉은 키메라 무리를 몰아내는 것을 목표로 합니다.\n\n작전의 성공은 대륙의 기동성을 회복하고 유럽의 남쪽 측면을 확보하는 데 중대한 전환점이 될 것입니다. 그러나 무리의 규모는 더 두터워졌으며, 정보 보고는 이 지역에서 이전에 보지 못한 새로운 변종이 있음을 시사합니다. 앞으로의 전투는 큰 희생을 치르게 될 것입니다."
 EH_event.511.a: "주사위는 던져졌다"
 EH_event.800.t: "제노비아 선과 살라딘 선 건설 중"
 EH_event.800.d: "사하라 이남 아프리카에서 빠르게 진격하는 무리에 대응하여, 중동 방위 연맹은 이집트 남부를 가로지르는 요새화된 방벽의 즉각적인 건설을 명령했습니다. 제노비아 선으로 명명된 이 방어선은 나일강과 서부 사막 측면을 따라 뻗어 있으며, 강화된 벙커, 참호망, 장거리 포병 진지를 통합하여 키메라의 기세를 저지합니다.\n\n제노비아가 무너지면 그 뒤에서 살라딘 선이 기다립니다. 포트사이드에서 홍해에 이르는 수에즈 운하를 따라 구축된 이 방어선은 최후의 보루로서, 이 지역의 문화적, 정신적 심장부를 파멸로부터 지키기 위한 불굴의 방어선입니다."
 EH_event.800.a: "선이 그어졌다"
 EH_event.801.t: "제노비아 선과 살라딘 선의 붕괴"
 EH_event.801.d: "키메라 무리가 이집트 남부의 제노비아 선과 수에즈 운하를 따라 구축된 살라딘 선을 모두 돌파했다는 보고가 들어오고 있습니다. 처절한 방어 노력과 중포 지원에도 불구하고 적은 너무 많고 너무 집요했습니다.\n\n방어 구역 전체가 유린당하고, 요새가 상실되고, 참호선이 삼켜졌으며, 많은 부대가 끝까지 싸웠습니다. 수에즈 사령부는 그 후 침묵에 빠졌습니다. 중동 방위 연맹은 레반트를 향한 전면 철수를 명령했습니다.\n\n최후의 방어선이 뚫림으로써 북부 전선으로 가는 관문이 열렸습니다. 이제 완충 지대는 남아 있지 않습니다."
 EH_event.801.a: "그들은 버틸 수 있을 때까지 버텼다"
 EH_event.802.t: "배후를 타격당한 제노비아 선과 살라딘 선!"
 EH_event.802.d: "중동 방어선의 붕괴로 인해 키메라 군은 이제 제노비아 선과 살라딘 선의 유일한 취약 지점인 배후를 돌파했습니다. 무리는 압도적인 숫자로 돌파구를 통해 쏟아져 들어와 남은 방어군을 순식간에 제압하고 대륙 심장부에 발판을 확보했습니다.\n\n방어선이 무너지면서 키메라는 북쪽으로 자유롭게 진격하여 유럽 전역의 주요 도시와 기반 시설을 위협할 수 있게 되었습니다. 상황은 절박하며, 유럽 연합은 이제 자국 국경의 첫 전선에서 장기적이고 잔혹한 싸움을 준비해야 합니다."
 EH_event.802.a: "동부 전선은 너무 약했다"
 EH_event.803.t: "유럽 요새화: 보스포루스 선"
 EH_event.803.d: "서방 연합은 새로운 대륙 보루인 보스포루스 선의 건설을 승인했습니다.\n\n이스탄불 해협을 가로지르는 이 방어선은 지뢰밭, 해상 봉쇄, 구축된 진지, 강화된 방벽을 통합하여 유럽으로의 돌파를 막습니다. 그 중심에 주둔한 헬레스폰트 기동부대는 끝까지 싸울 준비가 된 다국적 부대입니다.\n\n명령은 분명합니다. 대가가 얼마가 되든 방어선을 사수하라."
 EH_event.803.a: "싸움 없이는 건너지 못할 것이다"
 EH_event.804.t: "보스포루스 선의 함락"
 EH_event.804.d: "잔혹하고 장기화된 포위 끝에 보스포루스 선이 돌파되었습니다. 키메라는 필사적인 반격에도 불구하고 방어선을 압도하며 불과 살점의 물결이 되어 이스탄불로 쏟아져 들어왔습니다.\n\n헬레스폰트 기동부대는 마지막까지 싸웠으며, 유럽의 영웅으로 추모받고 있습니다.\n\n이제 유럽이 직접 노출됨으로써 서방 세계는 첫 번째 방패를 잃었습니다."
 EH_event.804.a: "유럽의 수문장들을 추모하리라"
 EH_event.805.t: "배후에서 타격당한 보스포루스 선!"
 EH_event.805.d: "키메라 군은 북쪽에서 흑해를 우회하여 보스포루스 선의 배후를 타격하는 데 성공했으며, 요새를 완전히 우회하고 남은 방어군을 제압했습니다. 무리는 이미 발칸과 서유럽을 장악하고 있습니다."
 EH_event.805.a: "유럽은 이미 무너졌다"
 EH_event.806.t: "캅카스 방어선 건설 중"
 EH_event.806.d: "중동과 유라시아 연방 남부 영토 사이의 연결을 보호하기 위해 캅카스 방어선이 건설되고 있습니다. 이 방어선은 캅카스 산맥을 가로질러 뻗으며, 자연 지형의 이점과 요새화된 진지, 포병 진지, 신속 대응 부대를 통합하여 진격하는 키메라 군에 맞선 강력한 방벽을 형성합니다.\n\n무리를 완전히 저지하기에는 충분하지 않을 수 있으나, 유럽과 구 러시아 지역의 대피와 재편성 노력을 위한 시간을 벌어 줄 중요한 완충 지대 역할을 할 것입니다."
 EH_event.806.a: "제때 완성되기를 바란다"
 EH_event.807.t: "캅카스 방어선의 첫 번째 선 돌파"
 EH_event.807.d: "키메라 군이 캅카스 방어선의 첫 번째 선을 돌파하여 초기 요새를 압도하고 산악 지역으로 밀고 들어왔습니다. 방어군의 격렬한 저항에도 불구하고 무리의 집요한 공격은 이 지역에 발판을 마련했으며, 유라시아 연방의 중심부로 넘쳐 들어올 위험이 있습니다.\n\n상황은 위급하지만, 두 번째 방어선이 버티며 추가 침투를 막을 수 있으리라는 희망은 아직 남아 있습니다."
 EH_event.807.a: "두 번째 방어선에는 아직 희망이 있다"
 EH_event.808.t: "캅카스 방어선 함락"
 EH_event.808.d: "용맹한 노력에도 불구하고 캅카스 방어선이 함락되었습니다. 키메라 군은 남은 방어군을 제압하고 이 지역에 발판을 확보하여 유라시아 연방에 새로운 전선을 열었습니다.\n\n이 중요한 완충 지대를 잃음으로써 무리는 이제 러시아와 서유럽 전역의 주요 도시와 기반 시설로 향하는 직접적인 경로를 확보했습니다. 상황은 절박하며, 유라시아 연방은 이제 자국 영토에서의 장기적이고 잔혹한 싸움을 준비해야 합니다."
 EH_event.808.a: "그들은 막을 수 없다..."
 EH_event.809.t: "배후를 타격당한 캅카스 방어선!"
 EH_event.809.d: "키메라 군은 북쪽에서 캅카스 산맥을 우회하여 방어선의 배후를 타격하는 데 성공했으며, 요새를 완전히 우회하고 남은 방어군을 제압했습니다. 무리는 이미 주변 지역을 장악하고 있습니다."
 EH_event.809.a: "감수해야 했던 위험이었다"
 EH_event.900.t: "워싱턴 D.C. 함락"
 EH_event.900.d: "구 아메리카 합중국의 수도가 함락되었습니다.\n\n키메라 군세는 파괴적인 공세를 개시하여 도시의 방어선을 돌파하고 군 부대를 압도했습니다. 상징적인 랜드마크들은 폐허가 되었고, 한때 북적이던 거리는 섬뜩할 만큼 고요합니다.\n\n생존자들은 도시가 무리의 손에 넘어가면서 벌어진 혼돈과 파괴에 대한 끔찍한 이야기를 전하고 있습니다."
 EH_event.900.a: "한 나라의 심장을 잃었다..."
 EH_event.901.t: "뉴욕 함락"
 EH_event.901.d: "뉴욕이 키메라 무리에게 함락되었습니다.\n\n괴물들은 지하 터널과 지하철 망을 이용해 지상 방어선을 우회했고, 군 부대는 허를 찔렸습니다. 상징적인 스카이라인은 이제 파괴의 실루엣으로 변했으며, 화염이 치솟고 건물들이 무너져 내리고 있습니다.\n\n스태튼 아일랜드가 가장 먼저 무너졌고, 이제 도시 전체가 키메라의 통제 아래 놓였습니다."
 EH_event.901.a: "자유의 여신상이 사라졌다..."
 EH_event.902.t: "로스앤젤레스 함락"
 EH_event.902.d: "로스앤젤레스가 함락되었습니다.\n\n한때 아름다웠던 이 도시는 이제 키메라의 끝없는 진격을 피해 달아나는 수많은 피란민들의 기억 속에만 남았습니다. 상징적인 할리우드 간판은 이제 무엇을 잃었는지를 보여 주는 암울한 기념물로 서 있습니다."
 EH_event.902.a: "참으로 큰 손실이다..."
 EH_event.903.t: "샌프란시스코 함락"
 EH_event.903.d: "샌프란시스코가 사라졌습니다.\n\n키메라는 지하 균열과 해안 돌파구를 통해 출현하여 두려운 속도로 방어선을 우회했습니다. 태평양 사령부는 잔여 병력이 모두 전멸했거나 고립되었다고 보고했습니다. 민간인 피해는 참혹한 수준입니다.\n\n또 하나의 위대한 도시가 무리에게 넘어갔습니다."
 EH_event.903.a: "금문교를 잃었다..."
 EH_event.904.t: "모스크바 함락"
 EH_event.904.d: "모스크바가 함락되었습니다.\n\n키메라 무리는 일사불란한 공세를 개시하여 압도적인 수와 맹렬함으로 도시의 방어선을 짓눌렀습니다. 한때 러시아의 불굴을 상징하던 크렘린은 이제 폐허가 되었습니다.\n\n생존자들은 도시가 괴물들의 끝없는 진격 앞에 무릎 꿇으면서 벌어진 혼돈과 절망을 이야기하고 있습니다."
 EH_event.904.a: "러시아의 심장을 잃었다..."
 EH_event.905.t: "상하이 함락"
 EH_event.905.d: "상하이가 함락되었습니다.\n\n무리는 압도적인 병력으로 먼저 남부 교외를, 이어 황푸강 건너를 강타하여 후퇴 도중의 방어군을 덮쳤습니다. 와이탄은 불타 버린 강철과 부서진 콘크리트의 무덤이 되었습니다. 위성 영상에는 이제 침묵만이 비칠 뿐, 도시는 텅 빈 껍데기가 되었습니다."
 EH_event.905.a: "언제쯤 저들을 막을 수 있을까?"
 EH_event.1000.t: "키메라 차원문 폐쇄!"
 EH_event.1000.d: "T.E.S.L.A. 프로젝트는 엄청난 성공으로 판명되었습니다. [FROM.GetName](은)는 키메라 차원문 하나를 폐쇄하는 습격 작전을 성공적으로 수행했고, 그 결과 광대한 반경 안의 모든 키메라 군세가 즉시 의식을 잃었습니다. 괴물들은 아직 살아 있으므로 지역 주민은 사체와 어떠한 접촉도 하지 말 것이 권고됩니다. 자국군은 잠든 키메라 부대를 처치하러 이동 중입니다."
 EH_event.1000.a: "그 망할 놈들이 해냈군."
 EH_focus_event.1.t: "대동원 계획"
 EH_focus_event.1.d: "그들은 갑자기 나타났습니다. 움직이는 모든 것을 공격하며, 모든 것이 죽을 때까지 멈추지 않을 것입니다. 우리 과학자들은 이 괴물들이 무엇이며 어디에서 왔고 어떻게 막을 수 있는지 알아내려 애쓰고 있습니다. 그동안 우리 군은 전선을 지키며 시민을 보호하려 분투하고 있습니다. 놈들이 국경에 닿기 전에 신속히 행동해야 합니다. 직업 군인에 의존할 수도 있고, 대규모 동원령을 내릴 수도 있습니다."
 EH_focus_event.1.a: "가진 모든 것을 놈들에게 쏟아부어라!"
 EH_focus_event.1.b: "직업 군인에게 의존하겠다."
 EH_focus_event.2.t: "1세대 키틴 병사"
 EH_focus_event.2.d: "키메라 부대에 대한 최근의 연구 덕분에 새로운 유형의 병사, 키틴 병사를 만들 수 있게 되었습니다. 새로운 갑옷은 외계 생명체의 물리 공격에 대한 우리 병력의 저항력을 높여 주며, 미래적인 디자인은 국민들에게 희망과 설렘을 불러일으킵니다."
 EH_focus_event.2.a: "허구가 현실을 만날 때."
 EH_focus_event.3.t: "목표에 도달한 드론"
 EH_focus_event.3.d: "드론이 차원문 주변 구조물의 상세한 사진을 촬영했습니다. 방어 목적 외에 그 용도와 기능을 더 깊이 이해하려면 과학자들이 수집된 자료를 분석해야 합니다. 다행히 사진을 더 자세히 살펴보고 싶어 하는 생물학 교수가 있습니다."
 EH_focus_event.3.a: "그만한 가치가 있기를 바랄 뿐이다."
 EH_focus_event.4.t: "키메라의 드론 편대 파괴"
 EH_focus_event.4.d: "키메라 군세는 드론 편대가 임무를 완수하기 전에 요격하여 파괴하는 데 성공했습니다. 격추되기 전에 사진을 촬영해 전송한 기체는 단 한 대도 없었습니다."
 EH_focus_event.4.a: "또 하나의 실패로군..."
 EH_focus_event.5.t: "키메라 군세의 연구 시설 파괴"
 EH_focus_event.5.d: "키메라 군세가 우리 연구 시설 한 곳을 발견하여 파괴했습니다. 일부 연구 자료가 소실되었지만, 적어도 키메라도 아무런 손실 없이 물러나지는 못했습니다."
 EH_focus_event.5.a: "생존자를 찾아라!"
 EH_focus_event.6.t: "연구 시설에서 격퇴된 키메라 군세"
 EH_focus_event.6.d: "키메라는 우리 연구 시설을 파괴하지 못했습니다. 연구 자료는 하나도 소실되지 않았으며 과학자들도 무사합니다."
 EH_focus_event.6.a: "대승이다!"
 EH_focus_event.7.t: "과학자 실종"
 EH_focus_event.7.d: "과학자 한 명이 키메라 군세의 공격 전에 연구 시설을 빠져나오지 못했습니다. 과학자의 생사는 알 수 없으나 최악의 경우를 가정해야 하며, 현재로서는 구출 작전을 개시할 방법이 없습니다."
 EH_focus_event.7.a: "젠장!"
 EH_focus_event.8.t: "키메라 군세를 약화시키는 차원문의 에너지 방출"
 EH_focus_event.8.d: "우리의 위성망을 교란해 온 차원문의 비정상적인 에너지 방출을 감시하는 데 더 많은 시간을 들인 덕분에, 과학자들은 이 방출이 매우 특정한 패턴을 따른다는 사실을 알아냈습니다. 새 위성에는 이 방출을 탐지하여 키메라의 통신 체계를 교란하는 데 활용할 수 있는 특수 센서가 장착되었습니다. 이 돌파구는 키메라 군세를 상당히 약화시킬 수 있습니다."
 EH_focus_event.8.a: "이것은 위대한 돌파구다!"
 EH_focus_event.9.t: "연구 시설을 돕기 위한 민간 기업의 인력 파견"
 EH_focus_event.9.d: "거대 민간 기업들이 키메라에 맞선 우리 과학자들의 연구를 돕기 위해 뭉쳤습니다. 이들은 새로운 연구 시설 건설을 돕기 위해 최고의 인력을 보내고 있으며, 이로써 전체 과정이 크게 빨라질 것입니다."
 EH_focus_event.9.a: "좋은 소식이다!"
 EH_focus_event.10.t: "군 장성들의 연구 시설 추가 경비 제안"
 EH_focus_event.10.d: "우리 군 장성들이 키메라의 공격으로부터 연구 시설을 보호하기 위해 추가 병력을 파견하겠다고 제안했습니다. 이들의 전투 경험과 키메라 전술에 대한 지식은 과학자들의 안전과 프로젝트의 성공을 보장하는 데 대단히 귀중할 것입니다."
 EH_focus_event.10.a: "그들의 지원에 감사한다!"
 EH_focus_event.11.t: "억만장자의 자산 조성 자금 기부"
 EH_focus_event.11.d: "한 부유한 억만장자가 재산의 상당 부분을 우리 연구 시설에 기부하기로 결정했습니다. 이 막대한 자산은 새 시설 건설 비용을 충당하며 연구 속도를 크게 높여 줄 것입니다."
 EH_focus_event.11.a: "그의 세금을 깎아 줘라!"
 EH_focus_event.12.t: "랜달라이트 광맥 발견"
 EH_focus_event.12.d: "탐사팀이 새로운 랜달라이트 광맥을 발견했습니다. 이제 채굴 작업을 개시하여 이 귀중한 자원을 추출할 것인지 결정할 때입니다."
 EH_focus_event.12.a: "채굴 작업을 개시하라!"
 EH_focus_event.12.b: "그럴 여유가 없다."
 EH_focus_event.13.t: "철 광맥 발견"
 EH_focus_event.13.d: "탐사팀이 새로운 철 광맥을 발견했습니다. 이제 채굴 작업을 개시하여 철을 추출하고 강철 생산을 늘릴 것인지 결정할 때입니다."
 EH_focus_event.13.a: "더 나은 것을 기대했지만, 그래도 필요하다."
 EH_focus_event.13.b: "그럴 여유가 없다."
 EH_focus_event.14.t: "알루미늄 광맥 발견"
 EH_focus_event.14.d: "탐사팀이 새로운 알루미늄 광맥을 발견했습니다. 이제 채굴 작업을 개시하여 이 자원을 추출할 것인지 결정할 때입니다."
 EH_focus_event.14.a: "랜달라이트는 아니군? 그래도 좋은 거래다."
 EH_focus_event.14.b: "그럴 여유가 없다."
 EH_focus_event.15.t: "민간 기업의 랜달라이트 광맥 발견"
 EH_focus_event.15.d: "대형 민간 기업 중 한 곳이 새로운 랜달라이트 광맥을 발견했습니다. 이들은 정부의 도움 없이 자체적으로 채굴 작업을 개시할 의향이 있습니다."
 EH_focus_event.15.a: "어... 알아서 하게 두어라."
 EH_focus_event.16.t: "[FROM.GetName]의 최종 공세 개시"
 EH_focus_event.16.d: "키메라 차원문에서 T.E.S.L.A. 무기의 기폭에 성공한 후, [FROM.GetName]군은 해당 지역의 모든 키메라 군세를 제거하기 위한 전면 공세를 개시했습니다. 차원문이 닫히고 적이 혼란에 빠진 지금이 결정적인 일격을 가하고 잃어버린 영토를 되찾을 기회입니다."
 EH_focus_event.16.a: "우리가 승리할 것이다."
 EH_protect_the_homeland: "조국을 수호하라!"
 EH_protect_the_homeland_desc: "우리는 악마 그 자체의 미지의 군세에게 침공당했습니다. 위협을 격퇴하고 내일을 맞이하기 위해 가진 모든 것으로 스스로를 방어해야 합니다!"
 EH_territorial_advantages: "지형적 이점"
 EH_territorial_advantages_desc: "침략자들은 근접전에서... 아니 전반적으로 더 강합니다. 힘으로 이길 수 없다면 더 영리해져야 합니다. 새로운 방어 계획은 지형을 우리에게 유리하게 활용하도록 도울 것이며, 어쩌면 몇몇 전투에서 승리하기에 충분할지도 모릅니다."
 EH_cold_acclimatization: "추위 적응"
 EH_cold_acclimatization_desc: "침략자들은 저온에 극도로 강합니다. 설상가상으로 두 곳의 차원문이 알래스카와 티베트에 있습니다. 그곳에 접근할 기회를 얻으려면 더 강해지거나 추위와 싸우는 새로운 방법을 개발해야 합니다."
 EH_300: "300"
 EH_300_desc: "좁은 산악 고개는 통과하기가 극도로 어려운 지형입니다. 내 생각에는 매복에 안성맞춤인 장소입니다. 적의 항공 지원만 처리할 수 있다면, 이 고개들을 활용해 전투에서 엄청난 이점을 얻을 수 있습니다."
 EH_heat_acclimatization: "더위 적응"
 EH_heat_acclimatization_desc: "괴물들은 자연의 힘에 매우 강합니다. 우리 역시 더 강해져야 합니다. 우리는 이 행성에서 저들보다 더 오래 싸워 왔으며, 그 경험을 지금 우리에게 유리하게 활용해야 합니다."
 EH_sandstorms_are_our_allies: "모래폭풍은 우리의 아군"
 EH_sandstorms_are_our_allies_desc: "우리는 모래폭풍이 언제 오는지 압니다. 이 지식으로 방어를 준비하고 모래를 우리에게 유리하게 이용할 수 있습니다. 괴물들에게 \\"생체 레이더\\"가 없기만을 바랄 뿐입니다."
 EH_observe_local_fauna: "현지 동물군 관찰"
 EH_observe_local_fauna_desc: "동물은 완벽한 조기 경보 체계를 제공합니다. 이 괴물들은 모든 종에게 위협이며, 우리 동물들은 이미 그 존재를 알아차린 듯합니다. 레이더가 침묵할 때, 공황 상태로 도망치는 동물 무리는 중요한 정보가 될 수 있습니다."
 EH_our_weakness_to_their_disadvantage: "우리의 약점을 그들의 불리함으로"
 EH_our_weakness_to_their_disadvantage_desc: "평원은 우리 차량에 매우 유리하지만, 전차와 보병전투차만으로는 이 괴물들을 막기에 부족합니다. 하지만 평탄한 지형 덕분에 우리는 무언가 특별한 것을 준비할 수 있으며, 그것이 전장에서 일시적인 우위를 가져다주기를 기대합니다."
 EH_electric_traps: "전기 함정"
 EH_electric_traps_desc: "제어된 강력한 전기 충격으로 아군 부대에 적군을 공격할 몇 분의 여유를 줄 수 있을 것입니다. 에너지 소모가 막대할 것이므로 국내 전력 사용량을 줄일 방법을 찾거나 새로운 건설 부지를 준비해야 합니다."
 EH_transfer_energy_from_civilian_sector: "민간 부문에서 에너지 이전"
 EH_transfer_energy_from_civilian_sector_desc: "함정이 가동될 때 우리는 너무 많은 전력을 소모하고 있습니다. 충전에 너무 오래 걸려서 다시 쓰려면 일주일 내내 기다릴 수는 없습니다. 공공 부문의 에너지 일부를 우리의 에너지 저장소로 이전하겠습니다."
 EH_invest_in_additional_power_sources: "추가 전력원에 투자"
 EH_invest_in_additional_power_sources_desc: "전쟁이 지금보다 민간인에게 더 큰 영향을 끼쳐서는 안 됩니다. 오늘과 앞으로의 모든 날을 위한 에너지 안정을 확립하기 위해 새로운 원자로 프로젝트를 설치하겠습니다."
 EH_reduce_energy_loss: "에너지 손실 감축"
 EH_reduce_energy_loss_desc: "이 함정들은 너무 많은 에너지를 소모합니다. 효과적이지만 우리 기반시설에는 부담이 큽니다. 출력을 낮출 수는 없지만, 다른 곳의 전력 사용을 제한할 방법을 찾을 수 있습니다."
 EH_nation_remains_untouched: "국가는 그대로 유지된다"
 EH_nation_remains_untouched_desc: "저 괴물들이 무엇이든, 군사력을 강화하겠다고 모든 것을 내버려 둘 수는 없습니다. 국민들은 아무 일도 일어나지 않은 듯 평소의 삶을 이어 갈 것입니다..."
 EH_put_away_internal_problems: "내부 문제를 접어 두다"
 EH_put_away_internal_problems_desc: "조국 보호주의가 현재 가장 중요한 목표입니다. 군대가 없다면 지킬 국가도 없습니다. 우리가 군을 강화하는 동안 국민들은 스스로 문제를 해결해야 합니다. 군이 무너지면 사회도 무너질 것입니다."
 EH_minimal_military_focus: "최소한의 군사 중점"
 EH_minimal_military_focus_desc: "현재는 민간 산업이 신규 무기 생산보다 더 중요합니다. 전쟁이 우리와 멀리 떨어져 있다면 국방에 너무 많은 돈을 쓸 이유가 없습니다."
 EH_high_military_focus: "높은 군사 중점"
 EH_high_military_focus_desc: "적은 하루가 다르게 우리 수도로 다가오고 있습니다. 경계를 늦출 수 없으며 생산을 가속해야 합니다."
 EH_lower_conscription: "징병 축소"
 EH_lower_conscription_desc: "다른 나라들은 많은 인력을 잃고 있지만, 우리 병사들은 대부분 국경을 순찰할 뿐입니다. 군에 더 많은 돈을 쓰자고 병력을 더 모집할 필요는 없습니다."
 EH_extended_conscription: "징병 확대"
 EH_extended_conscription_desc: "적을 국경 밖에 묶어 두는 것이 가장 중요한 임무이며, 더 이상 영토를 잃어서는 안 됩니다!"
 EH_prioritize_corporations: "기업 우선"
 EH_prioritize_corporations_desc: "전쟁은 우리 경제를 망칠 것입니다. 심각한 곤경에 빠지지 않도록 기업들이 국가에 충성하게 해야 합니다."
 EH_prioritize_military_companies: "군수 기업 우선"
 EH_prioritize_military_companies_desc: "연구와 무기 생산 확대가 최우선 과제가 되어야 합니다. 총이 없다면 우리 병사들은 저 불경한 괴물들과 싸울 수 없습니다."
 EH_a_new_resource: "새로운 자원"
 EH_a_new_resource_desc: "리사 랜들 박사는 이미 상당 기간 새로운 자원인 랜달라이트를 연구해 왔습니다. 랜들 박사와 그녀의 과학자 팀은 이 물질이 믿기 어려울 만큼 가벼우면서도 보기 드문 내구성을 지녔음을 발견했습니다. 랜달라이트가 발견된 이후 다른 나라들은 [RESOURCE HERE]의 양이 감소했음을 알아차렸습니다. 차원문이 이를 랜달라이트로 변환하고 있을 가능성이 있습니다. 어쩌면 차원문 반대편에서는 이것이 흔한 자원일지도 모릅니다. 이에 대해서는 더 많은 연구가 필요합니다."
 EH_a_fine_addition_to_my_collection: "내 수집품에 훌륭한 추가"
 EH_a_fine_addition_to_my_collection_desc: "랜달라이트는 무기와 장갑에 훌륭한 소재가 될 것입니다. 랜달라이트로 무장하면 외계 생명체뿐 아니라 다른 나라들까지도 격퇴할 수 있을지 모릅니다."
 EH_first_hacs_prototype: "최초의 HACS 시제품"
 EH_first_hacs_prototype_desc: "예거, 아틀라스, 에반게리온 등등. 첨단 전투 메카는 최근의 사건이 모든 것을 바꾸기 전까지는 허구에 불과했습니다. 고기동 전투 체계(HACS)는 오로지 랜달라이트의 특성 덕분에 제작된 실제로 운용 가능한 전투 메카입니다. 강철보다 훨씬 강하고 마그네슘보다 가벼운 합금을 쓰기 시작한 이후 중량은 더 이상 큰 문제가 아닙니다. 이 기술로 마침내 적 군세에 상당한 타격을 입힐 수 있을지도 모릅니다."
 EH_new_enemy_new_strategy: "새로운 적, 새로운 전략"
 EH_new_enemy_new_strategy_desc: "어리석은 문제에는 어리석은 해법이 필요하며, 이것은 우리가 지금껏 마주한 가장 어리석은 문제입니다. 외계인들은 해를 두려워하지 않는 자처럼 싸우며, 우리는 바로 그 점을 이용할 것입니다. 중장갑 부대의 장갑은 방호력이 높지만 뚫을 수 없는 것은 아닙니다. 우리는 맷집 좋은 부대보다 빠르고 비행 생물보다 강함으로써 이 싸움에서 이겨야 합니다. 그러려면 랜달라이트와 총알이 더 필요합니다, 당연히."
 EH_more_mechs_less_weapons: "메카 증강, 무기 감축"
 EH_more_mechs_less_weapons_desc: "메카는 저 괴물들에 맞설 우리의 유일한 효과적인 무기입니다. 생산에는 많은 시간이 걸리며 랜달라이트 비축량도 한정되어 있습니다. 일부 공장을 전환하여 기존 무기 대신 메카 부품 제작을 돕게 하는 편이 나을 것입니다."
 EH_more_weapons_less_mechs: "무기 증강, 메카 감축"
 EH_more_weapons_less_mechs_desc: "메카 생산은 우리 자원의 대부분을 소모합니다. 이 전면적 생산을 계속하면 경제가 불황에 빠질 수 있으며 부채에서 결코 회복하지 못할 것입니다. 전시이긴 하지만 이 새로운 기계들 때문에 경제를 파괴할 수는 없습니다."
 EH_iron_man: "아이언맨?"
 EH_iron_man_desc: "최초의 신형 메카들이 이미 전장에서 싸우고 있습니다. 이제 침략자들에 맞설 가능성을 마침내 얻을 수 있는 진정한 싸움이 시작되었습니다. 일부 사람들은 이 기술로 얼마나 멀리 갈 수 있을지 추측하기 시작했습니다. 물론 마블 팬덤은 아이언맨 갑옷의 설계도를 우리에게 보내기 시작했습니다... 사실, 안 될 것도 없지 않습니까?"
 EH_second_generation_hacs: "2세대 HACS"
 EH_second_generation_hacs_desc: "괴짜들과 전문 기술자들이 보내온 설계도 덕분에 새로운 메카의 계획을 조금 일찍 시작할 준비가 되었습니다. 또 하나의 위대한 이정표를 향해 손을 뻗읍시다!"
 EH_highly_purified_randallite: "고순도 랜달라이트"
 EH_highly_purified_randallite_desc: "우리는 생산이 최우선이었기에 원료 랜달라이트를 정제할 충분한 시간을 들인 적이 없습니다. 하지만 이제 이 자원에 대해 더 많이 알고 새로운 특성을 알아내는 데 그리 서두르지 않아도 되므로, 시간을 들여 효율을 극대화할 수 있습니다."
 EH_increase_research_budget: "연구 예산 증액"
 EH_increase_research_budget_desc: "2세대 HACS는 대성공이었지만 이에 안주해서는 안 됩니다. 인류는 언제나 더 나은 것을 요구할 것이며, 바로 그 순간이 3세대 준비를 시작할 때입니다."
 EH_third_generation_hacs: "3세대 HACS"
 EH_third_generation_hacs_desc: "우리의 모든 노력이 이 순간으로 이어졌습니다. 수개월의 연구와 시험, 그리고 우리 예산에서 나간 수십억을 거쳐, 전투 메카 역사상 가장 위대한 전투 메카를 선보일 준비가 되었습니다!"
 EH_military_advantages: "군사적 이점"
 EH_military_advantages_desc: "랜달라이트가 우리 병력에 어떻게 도움이 될 수 있는지 알아내야 합니다. 메카가 제작되는 동안에도 우리는 새 기계에 쓸 수 있는 양보다 더 많은 이 광석을 보유하고 있습니다. 그것을 활용할 방법을 더 찾아야 합니다."
 EH_ranjets: "랜제트"
 EH_ranjets_desc: "랜달라이트 덕분에 사상 최초의 전투 메카를 제작할 수 있었습니다. 이 물질은 매우 가벼워서 이 새로운 기술에만 국한될 필요가 없습니다. 이는 항공기 추력과 중량에 관련된 많은 문제를 해결할 것입니다. 더 가벼운 기체의 항공기는 더 많은 화물과 무장을 실을 수 있고, 우리 제트기는 그 어느 때보다 기동성이 높아질 것입니다."
 EH_not_so_heavy_weapons: "그리 무겁지 않은 무기"
 EH_not_so_heavy_weapons_desc: "중화기 생산에 강철, 티타늄 및 기타 재료 대신 랜달라이트를 사용할 수 있습니다. 무기가 더 가벼워져서 병사들이 휴대하고 사용하기 쉬워질 것입니다. 트럭은 수송에 연료를 덜 쓸 것이므로 이 변화로 모든 것이 이득을 봅니다."
 EH_find_new_veins: "새로운 광맥 탐색"
 EH_find_new_veins_desc: "많은 자원 산지가 랜달라이트로 대체되었습니다. 이 과정이 어떻게 진행되고 있는지는 알 수 없지만, 더 많은 자원을 찾아 땅을 파기 시작하기에 좋은 때일지도 모릅니다. 어쩌면 지하에서 랜달라이트를 더 찾을 수 있을 것입니다."
 EH_more_precious_than_gold: "금보다 귀한 것"
 EH_more_precious_than_gold_desc: "랜달라이트는 이미 어디에나 있습니다. 거대 기업들이 이 자원을 손에 넣으려고 수십억 달러를 쏟아붓고 있습니다. 마치 옛날 골드러시 같지만, 랜달라이트는 금보다 훨씬 쓸모가 많습니다. 일상 도구, 기계, 무기를 만들 수 있으며 이는 극히 짧게 줄인 목록에 불과합니다. 국가는 탐욕스러운 기업들이 채굴, 연구, 수출을 독점하기 전에 가능한 한 많은 랜달라이트를 확보해야 합니다. 우리 자국민과 싸워야 한다는 것은 믿기 어렵지만, 상황이 통제를 벗어난다면 규제를 가하는 것이 최종적인 귀결일지도 모릅니다."
 EH_civilian_benefits: "민간 혜택"
 EH_civilian_benefits_desc: "우리의 전황은 안정적이므로 랜달라이트를 공공 영역에 활용하는 데 집중할 수 있습니다. 침략자들과의 상황이 악화되더라도 큰 어려움 없이 언제든 군수 생산으로 전환할 수 있습니다."
 EH_a_wonderful_prosthesis: "놀라운 의족"
 EH_a_wonderful_prosthesis_desc: "랜달라이트의 놀라운 내구성과 가벼운 특성 덕분에 새로운 모델의 다리 의족을 제작할 수 있었고, 사용자들은 원래 다리를 가졌을 때보다 더욱 \\"건강해\\"졌습니다. 이제 인체의 인공 확장을 사이버펑크 수준으로 끌어올릴 때입니다!"
 EH_market_potential: "시장 잠재력"
 EH_market_potential_desc: "랜달라이트를 손에 넣고 싶어 하는 사람들이 많습니다. 더 이상 군사 프로젝트에 쫓기지 않으므로 투자자와 상업용으로 랜달라이트를 판매하기 시작할 수 있습니다. 대기업들은 기계를 랜달라이트 제품으로 교체하기 시작할 것이며, 이로써 전 세계에서 중장비와 차량을 가동하는 데 쓰이는 연료의 양이 줄어들 것입니다."
 EH_study_new_enemy: "새로운 적 연구"
 EH_study_new_enemy_desc: "수수께끼의 차원문에 대한 핵 공격 이후, 일종의 새로운 괴물들이 그 주위로 원을 그리며 퍼지기 시작했습니다. 이들은 극도로 공격적이며 움직이는 모든 것을 공격합니다. 우리가 이들을 막을 수 있을지는 알 수 없지만, 방어할 방법이 있다면 최대한 빨리 알아내야 합니다."
 EH_launch_orbital_scans: "궤도 정찰 개시"
 EH_launch_orbital_scans_desc: "위성을 이용해 적의 기동을 연구하고, 이동 패턴이 있다면 파악할 수 있습니다. 이는 우리 전략가들이 더 효과적인 함정과 대응 전술을 준비하는 데 도움이 될 것입니다."
 EH_find_the_weak_spots: "약점 찾기"
 EH_find_the_weak_spots_desc: "이 괴물들은 죽일 수 있습니다. 결국 피와 유기물로 이루어져 있으니까요. 그중 하나를 연구실로 데려올 수 있다면, 가장 치명적인 장기를 찾아 우리에게 유리하게 연구할 수 있을 것입니다. 치명적인 장기를 알아내는 즉시 병사와 전투 체계가 가능하다면 그곳을 겨냥하도록 훈련시킬 것입니다."
 EH_disassemble_invader_armor: "침략자 갑각 분해"
 EH_disassemble_invader_armor_desc: "대부분의 침략자들은 키틴질과 같은 단단한 갑각 덕분에 우리 무기에 저항합니다. 그 구조를 파악하여 인체 방호구에 적용하는 연구를 시작할 수 있습니다. 어쩌면 우리 병력이 적의 공격에 조금 더 잘 견디게 될지도 모릅니다."
 EH_portals_must_be_the_key: "차원문이 열쇠임이 틀림없다"
 EH_portals_must_be_the_key_desc: "가장 가까운 차원문에 대해 우리에게 유용할 수 있는 모든 정보를 더 수집해야 합니다. 차원문은 핵 공격에 저항하지만, 파괴할 수 없는 것은 없습니다. 드론과 항공기를 자살 임무에 보내야 한다 해도 차원문을 닫을 방법을 찾아내겠습니다."
 EH_investigate_strange_structure: "이상한 구조물 조사"
 EH_investigate_strange_structure_desc: "적에게서 이상한 행동이 포착되었습니다. 적은 아마도 차원문을 보호하려는 듯 그 주위에 무언가를 건설하고 있는 것 같습니다. 일종의 요새를 짓고 있다면, 차원문을 완전히 차단하기 전에 신속히 행동해야 합니다. 다음 단계는 전투 드론을 이용한 상세한 정찰 임무를 준비하는 것입니다. 적이 제공권을 장악하고 있어 자살 임무에 가깝지만, 적어도 한 대가 이 구조물의 사진을 촬영하여 우리 지휘부에 전송해 주기를 바랄 수밖에 없습니다."
 EH_finding_their_vulnerability: "그들의 취약점 찾기"
 EH_finding_their_vulnerability_desc: "충분히 잦은 폭격을 가하면 이 구조물을 이루는 구성 요소의 약점을 찾을 수 있을지도 모릅니다. 가장 중요하게 확인할 것은 열과 폭발에 대한 저항, 그리고 독성 부식입니다. 빙결 밀도를 확인할 방법은 없지만, 괴물들에게서 나온 다른 물질이 저온에서 어떻게 반응하는지 관찰할 수는 있습니다."
 EH_but_how_does_this_key_work: "그런데 이 열쇠는 어떻게 작동하는가?"
 EH_but_how_does_this_key_work_desc: "이 차원문들이 다른 차원으로 이어진다는 것은 확실합니다. 그것이 업사이드 다운이든, 반지구든, 다른 무엇이든, 연결을 열고 유지할 수 있게 하는 무언가가 있을 것입니다. 이들이 이를 어떻게 하고 있는지 알아내는 것은 차원문의 본질과 기능을 이해하는 데 중요할 수 있으며, 운이 좋다면 그 작동을 교란하고 연결을 끊을 방법을 찾을 수도 있습니다."
 EH_project_tesla: "T.E.S.L.A. 프로젝트"
 EH_project_tesla_desc: "선형 소멸 전술 전자기 체계(Tactical Electromagnetic System of Linear Annihilation)는 괴물들에게 이곳을 진정으로 지배하는 자가 누구인지 보여 줄 우리의 가장 큰 기회가 될 것입니다. 무기가 준비되는 대로 가장 가까운 차원문에 발사할 것입니다. 우리의 이론이 옳다면 전자기 펄스는 연결을 끊고, 어쩌면 차원문을 일시적으로 혹은 영구적으로 닫을 만큼 강력할 것입니다."
 EH_whole_new_dawn: "완전히 새로운 여명"
 EH_whole_new_dawn_desc: "차원문을 닫기 위해 알아야 할 모든 것을 우리는 알고 있습니다. 계획대로만 나아간다면 마침내 이 전쟁을 끝낼 만큼 강해질 것입니다."
