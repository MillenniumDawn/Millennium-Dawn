 MLV_infantry_weapons_5_desc: "Штурмовая винтовка АК-103 является производной от АК-74М и использует патрон 7,62х39 мм M43. Подобно более старому АКМ, АК-103 может использовать различные прицелы, включая ночные и оптические, а также оснащаться штыком или подствольным гранатометом. Отличием от большинства автоматов АК являются пластиковые и более дешевые материалы, примененные в АК-103."
 MLV_infantry_weapons_6_desc: "АК-12 — новый российский автомат. Он был разработан в рамках программы экипировки солдата будущего «Ратник». Созданный для специализированных подразделений, он должен заменить производство АК-103. АК-12 имеет улучшенный баланс и эргономику, что делает его самым элитным российским автоматом на сегодняшний день."
 PMR_infantry_weapons_1_desc: "АКМ, разработанный в 1959 году, является наиболее распространенным модернизированным вариантом автомата АК-47, разработанного Михаилом Калашниковым. Он значительно легче и точнее в автоматическом режиме, чем его предшественник."
 PMR_infantry_weapons_2_desc: "АК-74 разработан на основе АКМ и имеет значительные улучшения по сравнению с предшественником. В частности, он использует патроны калибра 5,45 мм вместо тогдашнего стандартного для стран Варшавского договора 7,62 мм."
