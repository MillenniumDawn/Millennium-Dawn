l_korean:
 BNL_dynmod_union: "베네룩스 연합"
 BNL_benelux_union_treaty: "베네룩스 연합 조약"
 BNL_benelux_union_treaty_desc: "2008년 헤이그에서 서명된 신조약은 만료 예정인 1958년 협정을 대체하며, 우리의 협력 관계를 베네룩스 연합으로 재명명합니다. 이는 단일 시장을 한 단계 발전시키고 공동 협력 범위를 사법, 안보, 지속 가능한 발전으로 확대하여 3개국에 발전의 기틀이 될 현대적 통합 틀을 제공합니다."
 BNL_single_market: "베네룩스 내부 시장"
 BNL_single_market_desc: "베네룩스는 광범위한 유럽 시장보다 한 걸음 더 나아가 3개국 경제를 가로막던 행정적 장벽을 완전히 제거합니다. 오랫동안 유럽 통합의 실험실 역할을 해온 베네룩스 연합은 국경이 없는 것처럼 기업들이 자유롭게 무역하고 활동할 수 있도록 공통 기준과 상호 인정을 시험 적용합니다."
 BNL_capital_integration: "자본 시장 통합"
 BNL_capital_integration_desc: "암스테르담 거래소, 브뤼셀 은행, 룩셈부르크의 방대한 투자 펀드 산업은 이미 유럽에서 가장 깊이 있는 자본 유동성을 형성하고 있습니다. 금융 감독 및 국경 간 규제를 정비함으로써 이 자본이 연합 전역의 가장 생산적인 기업으로 자유롭게 흘러갈 수 있게 합니다."
 BNL_port_cooperation: "로테르담과 안트베르펜"
 BNL_port_cooperation_desc: "로테르담과 안트베르펜은 유럽에서 가장 큰 두 무역항입니다. 같은 화물을 두고 경쟁하는 대신 안트베르펜-로테르담-암스테르담 클러스터를 조율함으로써 베네룩스 물류를 단일의 세계적인 관문으로 탈바꿈시킵니다."
 BNL_freight_corridors: "화물 수송 회랑"
 BNL_freight_corridors_desc: "베투베 노선(Betuweroute)과 철의 라인(Iron Rhine) 같은 전용 철도망은 해항과 유럽 내륙을 연결합니다. 이러한 수송 회랑에 대한 공동 투자는 연합의 산업적 중추를 강화합니다."
 BNL_north_sea_wind: "북해 풍력 발전"
 BNL_north_sea_wind_desc: "북해 에너지 협력(NSEC) 아래 베네룩스는 공동으로 해상 풍력을 개발합니다. 전력망 연결을 통합함으로써 북해를 공유 재생 에너지원으로 전환시킵니다."
 BNL_gas_hub: "베네룩스 가스 허브"
 BNL_gas_hub_desc: "흐로닝언 가스전과 제브뤼허의 LNG 터미널은 베네룩스를 가스 거래의 허브로 만들어 줍니다. 5자 에너지 포럼을 통해 공급을 조율함으로써 연합의 에너지를 확보합니다."
 BNL_research_cooperation: "최첨단 기술 지역"
 BNL_research_cooperation_desc: "아헨으로 이어지는 아인트호벤과 뢰번은 유럽에서 가장 밀집된 하이테크 연구 거점 중 하나인 '최첨단 기술 지역'을 형성합니다. 이 국경 간 삼각지대 전반에 걸쳐 연구소, 자금, 인재를 통합함으로써 베네룩스는 몇 배나 더 큰 경쟁국보다 뛰어난 혁신을 이루어낼 수 있습니다."
 BNL_university_network: "대학 네트워크"
 BNL_university_network_desc: "델프트, 뢰번, 아인트호벤, 바허닝언은 촘촘한 학술 네트워크를 지탱하고 있습니다. 이들의 교육 과정과 학위를 연계하여 인재와 지식의 공동 자원을 창출합니다."
 BNL_hightech_triangle: "하이테크 삼각지대"
 BNL_hightech_triangle_desc: "ASML과 NXP의 본산인 브레인포트 아인트호벤과 뢰번의 아이멕(imec)은 유럽 반도체 연구의 핵심을 형성합니다. 이 클러스터에 대한 공동 지원은 베네룩스를 첨단 기술의 최전선에 유지해 줍니다."
 BNL_space_cooperation: "우주 개발 협력"
 BNL_space_cooperation_desc: "유럽우주국(ESA)의 기술적 핵심인 유럽 우주 기술 센터(ESTEC)이 노르드베이크에 위치해 있습니다. 유럽 우주 개발에 대한 베네룩스의 기여를 조율하여 첨단 공학 역량을 구축합니다."
 BNL_nuclear_research: "원자력 연구"
 BNL_nuclear_research_desc: "네덜란드의 페턴과 미라(MYRRHA) 원자로 프로젝트를 추진하는 벨기에 몰의 벨기에 원자력 연구소(SCK CEN)는 원자로 및 의료용 동위원소에 대한 유럽의 연구를 선도합니다. 공동 프로그램을 통해 연합의 원자력 과학을 발전시킵니다."
 BNL_innovation_area: "베네룩스 혁신 구역"
 BNL_innovation_area_desc: "연구 네트워크, 하이테크 클러스터, 원자력 및 우주 프로그램을 단일 혁신 구역으로 묶음으로써 베네룩스는 지구상에서 가장 연구 집약적인 지역 중 하나로 거듭납니다."
 BNL_benelux_parliament: "베네룩스 의회"
 BNL_benelux_parliament_desc: "2015년 조약은 1955년의 구 자문위원회를 베네룩스 의회의회(Interparliamentary Assembly)로 대체하여, 3개국 의회 출신의 의원들로 구성된 연합 의회 포럼을 제공합니다. 이를 강화하는 것은 3개국 간의 더욱 깊은 정치적 통합을 위한 기틀을 마련합니다."
 BNL_benelux_court: "베네룩스 사법재판소"
 BNL_benelux_court_desc: "2012년 의정서는 베네룩스 사법재판소를 현대화하여 그 관할권을 단일 시장에서 지식 재산권과 같은 새로운 분야로 확대합니다. 공동 재판소는 3개 관할권 전역의 법률을 통일하고 연합에 공동의 법 질서를 부여합니다."
 BNL_shared_foreign_policy: "공동 외교 정책"
 BNL_shared_foreign_policy_desc: "연합의 역사만큼이나 오래된 전통에 따라 3개국 정부는 모든 유럽 정상회의와 나토(NATO) 정상회의 전에 입장을 조율합니다. 한목소리를 냄으로써 베네룩스는 회원국의 규모를 훨씬 뛰어넘는 영향력을 브뤼셀에서 행사합니다."
 BNL_political_union: "정치 동맹"
 BNL_political_union_desc: "공동 의회, 공통 재판소, 단일 외교 정책이 갖춰짐에 따라 3개국 정부는 단순한 협력을 넘어 사실상 명목상의 구분을 제외한 단일 연합으로 자신들의 정치 기구를 결속시킵니다."
 BNL_treaty_of_union: "통합 조약"
 BNL_treaty_of_union_desc: "수십 년에 걸친 공통 기구의 결실이 여기서 집대성됩니다. 3개국 국민이 깊이 통합된 상황에서 주도하는 정부는 파트너들에게 단일 베네룩스 국가 수립에 대한 안건을 부칩니다. 이들의 동의가 있어야만 분리된 주권이 단일 민족국가로 전환될 수 있습니다."
 BNL_treaty_of_union_tt: "통합 베네룩스 국가로 향하는 길을 엽니다"
 BNL_integration_requirement_tt: "$BNL_integration$ is above §G100§!"
 BNL_integration: "§YBenelux Integration§!"
 BNL_integration_tt: "£GFX_benelux_icon $BNL_integration$: $RIGHT|+=1$"
 BNL_integration_tooltip: "£GFX_benelux_icon $BNL_integration$: §G[?BNL_integration]§!"
 BNL_benelux_defence: "베네룩스 방위 선언"
 BNL_benelux_defence_desc: "2012년 베네룩스 선언은 벨기에, 네덜란드, 룩셈부르크가 방위 노력을 통합하고 비용을 공유하며 공동 군사 성과를 증대할 것을 서약했습니다. 이는 3개국 군대가 협력을 심화하기 위한 기본 틀이 됩니다."
 BNL_mio_sharing_tt: "§Y[BEL.GetNameWithFlag]§!, §Y[HOL.GetNameWithFlag]§! and §Y[LUX.GetNameWithFlag]§! share all §YMilitary-Industrial Organizations.§!"
 BNL_benelux_air_policing: "베네룩스 영공 초계"
 BNL_benelux_air_policing_desc: "2017년부터 벨기에와 네덜란드는 단일 신속대응태세(QRA) 아래 3개국 전체의 영공을 교대로 수호하며 국경을 넘어 요격할 수 있는 권한을 공유합니다."
 BNL_air_defence_command: "공군 지휘통제센터"
 BNL_air_defence_command_desc: "공유된 공군 지휘통제센터는 3개국의 레이더 정보와 지상 기반 방공망을 하나의 협력 시스템으로 통합합니다."
 BNL_binational_air_command: "양국 연합 공군사령부"
 BNL_binational_air_command_desc: "작전 공군사령부를 병합함으로써 베네룩스 공군은 기지, 관제사, 절차를 공유하며 단일 조직으로서 임무를 계획하고 수행할 수 있게 됩니다."
 BNL_mrtt_fleet: "다국적 MRTT 함대"
 BNL_mrtt_fleet_desc: "아인트호벤에 기지를 두고 베네룩스 파트너 및 다른 유럽 국가들과 공유하는 에어버스 A330 다목적 공중급유수송기(MRTT) 공동 통합 함대는 모든 회원국에 공중 급유 및 전략적 수송 능력을 제공합니다."
 BNL_eatc: "유럽 공중수송사령부(EATC)"
 BNL_eatc_desc: "아인트호벤에 본부를 둔 유럽 공중수송사령부(EATC)는 회원국들의 군용 수송기, 급유기, 의무 이송기를 단일 지휘체계 아래 통합합니다."
 BNL_belux_a400m: "벨룩스(BELUX) A400M 대대"
 BNL_belux_a400m_desc: "벨기에와 룩셈부르크는 A400M 아틀라스 수송기를 멜스브루크의 단일 양국 연합 대대로 통합하여 승무원, 정비, 공통 훈련 센터를 공유합니다. 룩셈부르크의 유일한 수송기는 벨기에 도색으로 운항하며, 두 국가는 한 함대의 비용과 비행 시간을 나누어 부담합니다."
 BNL_f35_cooperation: "F-35 공동 군수지원"
 BNL_f35_cooperation_desc: "벨기에와 네덜란드는 F-35 함대의 훈련 및 정비를 조율하며, 양국 공군 간의 시설과 전문 지식을 공유합니다."
 BNL_benesam: "베네삼(BENESAM) 해군 협정"
 BNL_benesam_desc: "벨기에와 네덜란드는 각자 독자적인 파병 지휘권을 유지하면서도 훈련, 물류, 정비를 공유하며 양국 해군을 하나처럼 운용합니다. 이 오랜 협정을 심화함으로써 연합 함대는 단순한 전력의 합을 뛰어넘는 효과를 냅니다."
 BNL_admiral_benelux: "베네룩스 제독"
 BNL_admiral_benelux_desc: "덴헬더르에 위치한 단일 양국 연합 해군참모본부가 벨기에와 네덜란드 함대의 작전을 지휘하며, 양국 해군 사령관이 통합 본부를 함께 운영합니다."
 BNL_vlissingen_class: "플리싱언급 소해함"
 BNL_vlissingen_class_desc: "노후화된 삼국 합동 알크마르급(Alkmaar-class) 소해함을 퇴역시키기 위한 12척 규모의 벨기에-네덜란드 공동 신형 기뢰 소해 전력(rMCM) 사업입니다. 나발 그룹(Naval Group)이 건조하는 이 모함들은 자율 무인 수상정 및 수중 드론을 활용하여 안전한 거리를 유지하며 기뢰를 탐색합니다. 네덜란드는 동일한 설계로 건조된 벨기에의 함정들과 함께 자국의 6척을 플리싱언급으로 운용합니다."
 BNL_hollandklasse_frigate: "홀란트급 호위함 개발"
 BNL_hollandklasse_frigate_desc: "네덜란드는 해상 초계 및 대잠 전력을 쇄신하기 위해 신형 홀란트급 호위함을 건조합니다. 현대식 센서, 미사일 시스템, 피탐지성을 낮춘 선체를 갖춘 이 함정들은 네덜란드 영해를 수호하고 해외 작전을 지원합니다."
 BNL_aswf_frigate: "대잠전 호위함(ASWF)"
 BNL_aswf_frigate_desc: "벨기에와 네덜란드는 노후된 M급 호위함을 신형 대잠전 설계 함정으로 공동 교체하며, 개발 과정과 레이더 및 전투 체계를 공유합니다."
 BNL_para_school: "베네룩스 공수 학교"
 BNL_para_school_desc: "베네룩스 공수 학교들이 샤펀의 단일 훈련 센터로 통합되어 3개국 전체의 공수부대를 공통 기준에 따라 자격을 부여합니다."
 BNL_csomtg: "연합 특수작전기동부대"
 BNL_csomtg_desc: "벨기에와 네덜란드는 연합 특수작전 해상기동부대를 창설하여 신속한 나토(NATO) 임무를 위해 육상과 해상에 함께 전개할 태세를 갖춥니다."
 benelux.1.t: "베네룩스 통합 조약"
 benelux.1.d: "[FROM.GetName]이(가) 각자의 주권을 내려놓고 단일 베네룩스 국가에 합류할 것을 제안합니다. 수십 년간의 공통 기구 운용이 그 기틀을 마련했으나, 주권을 포기하는 것은 결코 가벼운 결정이 아닙니다."
 benelux.1.a: "우리는 연합에 합류할 것입니다"
 benelux.1.b: "우리는 독자적인 국가로 남을 것입니다"
 benelux.2.t: "파트너의 연합 수락"
 benelux.2.d: "[FROM.GetName]이(가) 통합 베네룩스 합류에 동의했습니다. 파트너가 우리와 뜻을 함께함에 따라 연합 창설을 완수할 수 있게 되었습니다."
 benelux.2.a: "새로운 국가가 탄생했습니다"
 benelux.3.t: "파트너의 연합 거부"
 benelux.3.d: "[FROM.GetName]은(는) 아직 독립을 포기할 의사가 없습니다. 연합 수립은 때를 기다리거나 더 견고한 기반 위에서 재추진되어야 할 것입니다."
 benelux.3.a: "우리는 인내심을 갖고 기다릴 것입니다"
 benelux.4.t: "A Benelux Treaty of Union"
 benelux.4.d: "[FROM.GetName] proposes that we set aside our separate sovereignty and join a single Benelux state. We already anchor Benelux cooperation, our economy and armed forces dwarfing our partners' own, and effectively lead the union in all but name. A formal merger would trade that de facto primacy, and our sole hold over a state we already dominate, for shared institutions we cannot unilaterally direct."
 benelux.4.a: "We will join the union"
 benelux.4.b: "We remain our own nation"
 benelux.5.t: "A Benelux Treaty of Union"
 benelux.5.d: "[FROM.GetName] proposes that we set aside our separate sovereignty and join a single Benelux state. As by far the smallest of the three, we risk being politically and culturally swallowed by our two much larger neighbours, our Grand Duchy reduced to a footnote in a union we cannot hope to steer."
 benelux.5.a: "We will join the union"
 benelux.5.b: "We remain our own nation"
 BNL_retry_treaty_of_union_BEL: "Renew the Union Proposal to Belgium"
 BNL_retry_treaty_of_union_BEL_desc: "Belgium turned down the last proposal for a unified Benelux state. A revised approach, backed by fresh arguments and renewed diplomatic pressure, may yet bring Brussels around."
 BNL_retry_treaty_of_union_HOL: "Renew the Union Proposal to the Netherlands"
 BNL_retry_treaty_of_union_HOL_desc: "The Netherlands turned down the last proposal for a unified Benelux state. A revised approach, backed by fresh arguments and renewed diplomatic pressure, may yet bring The Hague around."
 BNL_retry_treaty_of_union_LUX: "Renew the Union Proposal to Luxembourg"
 BNL_retry_treaty_of_union_LUX_desc: "Luxembourg turned down the last proposal for a unified Benelux state. A revised approach, backed by fresh arguments and renewed diplomatic pressure, may yet bring the Grand Duchy around."
 BNL_retry_shared_outlook_tt: "They are more likely to accept if we share the same form of government."
 BNL_retry_influence_tt: "They are more likely to accept if we hold significant influence over them."
 BNL_retry_opinion_tt: "They are more likely to accept if their opinion of us is above §G200§!."