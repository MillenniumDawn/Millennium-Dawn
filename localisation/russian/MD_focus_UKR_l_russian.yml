 ukr_modernize_sov_equipment_t55_procurement_program.2.desc: "§YХарьковский бронетанковый завод§! передал армии очередную партию. Мы можем продолжить работу линии, перевести её на другую модель или вернуть завод к обычному производству.\n\nКорпусов осталось на хранении: §Y[?ukraine_has_t55_stockpile|0]§!"
