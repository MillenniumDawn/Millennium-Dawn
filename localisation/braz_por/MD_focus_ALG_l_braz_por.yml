 deep_state_surveillance_removed_tt: "§YRemovido: espírito nacional Vigilância Ampliada§!"
 deep_state_loyal_officers_tt: "§YNomeando oficiais leais ao governo civil para posições-chave.§!"
 deep_state_loyalists_placed_tt: "§GOficiais legalistas agora ocupam posições-chave na hierarquia militar.§!"
 deep_state_emergency_declared_tt: "§R£generic_warning ESTADO DE EMERGÊNCIA DECLARADO!§!"
 deep_state_emergency_effect_tt: "§YPoderes de emergência ativados:\n• Crescimento do Estado Profundo congelado por 180 dias\n• Estabilidade reduzida\n• Apoio à guerra aumentado§!"
