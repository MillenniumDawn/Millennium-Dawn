 CZE_vop_cz_category: "체코 국영 군수정비공장(VOP CZ)"
 CZE_vop_cz_category_desc: "VOP CZ는 체코 공화국 육군의 주문을 수행하는 국영 기업입니다. 이 회사는 군사 기술 향상과 국가 안보 강화에 목표를 둔 프로젝트를 연구합니다. 그들의 개발 센터는 군과 민간 부문 모두를 지원합니다.\n\n§G슈코다 연구 슬롯§! 사용 가능: §Y[?THIS.CZE_skoda_tech_slots]§!"
 CZE_quick_modernization: "신속 현대화"
 CZE_quick_modernization_desc: "공장을 일시적으로 빠르게 전환할 수 있지만, 나중에 잃어버린 자원과 에너지를 채워넣어야 합니다."
 CZE_research_grants_utility: "연구 보조금 - §O다용도 차량§!"
 CZE_research_grants_czech: "연구 보조금 - §G기술력§!"
 CZE_research_grants_mbt: "연구 보조금 - §R주력전차§!"
 CZE_research_grants_combined: "연구 보조금 - §B제병협동§!"
 CZE_skoda_laboratories_category: "슈코다 연구소"
 CZE_skoda_laboratories_category_desc: "슈코다의 연구소와 산업 부문은 기계를 개선하기 위한 연구에 공동으로 자금을 지원할 수 있게 합니다. 슈코다가 자동차에 새로운 솔루션을 적용하면, 우리는 육군 강화에 주력할 것입니다. 연구에는 다소 시간이 걸리지만, 우리 국민의 편의와 국력 증강을 위해 필요한 일입니다.\n\n§G슈코다 연구 슬롯§! 사용 가능: §Y[?THIS.CZE_skoda_tech_slots]§!\n§G슈코다 업그레이드§! 완료: §Y[?THIS.CZE_skoda_tech_progress]/130§!\n§G슈코다 고급 업그레이드§! 완료: §Y[?THIS.CZE_advanced_skoda_tech_progress]/3§!"
 CZE_change_fuel_injectors: "연료 분사 장치 교체"
 CZE_stronger_chassis: "강화된 차체"
 CZE_long_lasting_tires: "내구성 높은 타이어"
 CZE_simplify_our_manuals: "매뉴얼 간소화"
 CZE_invest_in_cheaper_and_better_modules: "저렴하고 우수한 모듈에 투자"
 CZE_adaptation_to_every_kind_of_weather: "전천후 적응성 강화"
 CZE_setellite_communication_systems: "위성 통신 시스템"
 CZE_meb_battery_system: "MEB 배터리 시스템"
 CZE_skoda_superb_cars_export_category: "슈코다 수퍼브 자동차 생산 및 수출"
 CZE_skoda_superb_cars_export_category_desc: "자체 공장을 이용하여 수퍼브 자동차를 직접 생산할 수 있습니다. 폭스바겐 그룹의 일원으로서 협력국에서는 이익률이 낮아지지만, 그들의 수요 감소 속도는 더디게 됩니다. 특히 수요가 높은 국가에서는 약간 더 많은 이익을 얻을 수 있습니다.\n\n슈코다 공장 수: §Y[?THIS.CZE_skoda_superb_cars_factories]§!\n현재 생산성: [?THIS.CZE_skoda_superb_productivity_multiplier|.2Y]배\n슈코다 예산: $$[?THIS.CZE_skoda_superb_cars_treasury|G] 십억 달러\n\n"
 CZE_skoda_superb_cars_text_text: "Country demands:\n@GER §G[GER.GetName]§! [?GER.CZE_skoda_superb_demand|.2%%Y]\n@ENG §G[ENG.GetName]§! [?ENG.CZE_skoda_superb_demand|.2%%Y]\n@FRA §G[FRA.GetName]§! [?FRA.CZE_skoda_superb_demand|.2%%Y]\n@ITA §G[ITA.GetName]§! [?ITA.CZE_skoda_superb_demand|.2%%Y]\n@SPR §G[SPR.GetName]§! [?SPR.CZE_skoda_superb_demand|.2%%Y]\n@POL §G[POL.GetName]§! [?POL.CZE_skoda_superb_demand|.2%%Y]\n@SOV §G[SOV.GetName]§! [?SOV.CZE_skoda_superb_demand|.2%%Y]\n@AUS §G[AUS.GetName]§! [?AUS.CZE_skoda_superb_demand|.2%%Y]\n@SLO §G[SLO.GetName]§! [?SLO.CZE_skoda_superb_demand|.2%%Y]\n@SWI §G[SWI.GetName]§! [?SWI.CZE_skoda_superb_demand|.2%%Y]\n@SWE §G[SWE.GetName]§! [?SWE.CZE_skoda_superb_demand|.2%%Y]\n@NRY §G[NRY.GetName]§! [?NRY.CZE_skoda_superb_demand|.2%%Y]\n@BEL §G[BEL.GetName]§! [?BEL.CZE_skoda_superb_demand|.2%%Y]\n@HOL §G[HOL.GetName]§! [?HOL.CZE_skoda_superb_demand|.2%%Y]\n\n§GSuperb I§! stockpile: [?THIS.CZE_skoda_superb_cars_stockpile|0Y]\n§GSuperb II§! stockpile: [?THIS.CZE_skoda_superb2_cars_stockpile|0Y]\n§GSuperb III§! stockpile: [?THIS.CZE_skoda_superb3_cars_stockpile|0Y]\n§GSuperb IV§! stockpile: [?THIS.CZE_skoda_superb4_cars_stockpile|0Y]"
 CZE_skoda_superb_cars_sell_text_text: "§Y수퍼브 자동차 판매§!"
 CZE_borrow_state_factory: "국영 공장 임대"
 CZE_borrow_state_factory_desc: "때때로 생산 속도를 높여야 할 때가 있습니다. 정부에 공장 중 하나를 빌려달라고 요청하여 그곳에서 부품을 생산할 수 있습니다."
 CZE_pay_bills: "청구서 지불"
 CZE_expand_kvasiny_factory: "크바시니 공장 확장"
 CZE_expand_kvasiny_factory_desc: "크바시니 시에 있는 공장을 현대화함으로써 생산 효율성을 극도로 높일 수 있습니다. 불행히도 설계 계획에 따르면 공사 기간 동안 공장이 가동 중단됩니다."
 CZE_skoda_superb_iii_expansion_of_skoda_laboratories: "§Y슈코다 연구소§! 확장"
 CZE_skoda_superb_iii_expansion_of_skoda_laboratories_desc: "새로운 연구 기관을 통해 과학 부문을 확장함으로써 정부와 협력하여 한때 먼 꿈만 같았던 기술을 개발할 수 있게 되었습니다. 오늘날 이 꿈의 실현은 그 어느 때보다 가까워졌습니다. 새로운 단계에 진입할 때입니다."
 CZE_new_production_line_in_mlada_boleslav: "믈라다볼레슬라프 신규 생산 라인"
 CZE_skoda_enyak_iv_development: "슈코다 엔야크 IV세대 개발"
 CZE_set_up_location: "위치 설정"
 CZE_electric_highway_category: "전기 고속도로 프로젝트"
 CZE_electric_highway_category_desc: "다른 나라들은 오래전부터 주행 중 전기차를 충전할 수 있는 전기 고속도로 프로젝트를 시작했습니다. 매우 비싸지만 운전 편의성을 획기적으로 높여 주는 이 투자는 시민을 위해서라면 당연히 추진해야 할 일입니다."
 CZE_open_planning_phase: "기획 단계 개시"
 CZE_prepare_construction_site: "건설 부지 준비"
 CZE_build_one_kilometer_of_electric_highway: "§Y1§!km 전기 고속도로 건설\n현재 길이: §Y[?THIS.CZE_electric_highway_kilometers|.0]km.§!"
 CZE_volkswagen_group_category: "폭스바겐 그룹(VG)"
 CZE_volkswagen_group_category_desc: "[CZE_volkswagen_group_category_desc_scripted_loc_TT]"
 CZE_volkswagen_group_category_desc_scripted_loc1_TT: "폭스바겐 그룹(VG)은 1937년 설립된 독일 니더작센주 볼프스부르크에 본사를 둔 자동차 그룹입니다. 2000년 그룹 구성원:\n[GER.GetFlag] §Y폭스바겐§!\n[GER.GetFlag] §Y아우디§!\n[SPR.GetFlag] §Y세아트§!\n[CZE.GetFlag] §Y슈코다§!\n[GER.GetFlag] §Y폭스바겐상용차§!\n[ITA.GetFlag] §Y람보르기니§!\n[ENG.GetFlag] §Y벤틀리§!\n[FRA.GetFlag] §Y부가티§!\n\n이후 스카니아, 포르쉐, 만, 두카티, 쿠프라, 제타, 스카우트 등이 합류했습니다.\n이 그룹은 자동차 회사 간 상호 협력과 전 세계 자동차 산업 발전을 목표로 합니다."
 CZE_volkswagen_group_category_desc_scripted_loc2_TT: "VG는 1937년 설립된 독일 니더작센주 볼프스부르크에 본사를 둔 자동차 그룹입니다. 2000년 그룹 구성원:\n[GER.GetFlag] §Y폭스바겐§!\n[GER.GetFlag] §Y아우디§!\n[SPR.GetFlag] §Y세아트§!\n[CZE.GetFlag] §Y슈코다§!\n[GER.GetFlag] §Y폭스바겐상용차§!\n[ITA.GetFlag] §Y람보르기니§!\n[ENG.GetFlag] §Y벤틀리§!\n[FRA.GetFlag] §Y부가티§!\n===================================================================\n§Y슈코다 vs. 폭스바겐§!\n\n§G폭스바겐 지지:§! [?CZE.volkswagen_support|.0%%Y]\n§G슈코다 지지:§! [?CZE.skoda_support|.0%%Y]\n\n§Y슈코다 또는 폭스바겐 중 어느 쪽이든 지지율 100%에 도달하면 해당 회사의 승리로 대결이 종료됩니다. 그렇지 않으면 지지율이 높은 쪽이 이기며(동률일 경우 슈코다가 이겨내지 못했으므로 폭스바겐이 승리).§!"
 CZE_take_part_in_new_technology_research: "신기술 연구 참여"
 CZE_expand_middle_east_trade: "중동 무역 확대"
 CZE_expand_set_up_cooperation_with_india: "인도와 협력 구축"
 CZE_open_aurangabad_factory: "아우랑가바드 공장 설립"
 CZE_open_nanjing_factory: "난징 공장 설립"
 CZE_volkswagen_group_civil_war: "폭스바겐 그룹 내전"
 CZE_call_a_press_conference: "기자 회견 소집"
 CZE_quarrel_volkswagen_group_members: "폭스바겐 그룹 회원과 다툼"
 CZE_quarrel_volkswagen_group_members_desc: "대부분 회사들은 폭스바겐에 매우 충성적입니다. 그들이 편을 바꾸도록 설득해야 합니다."
 CZE_we_are_the_leaders_here: "우리가 이곳의 리더입니다"
 CZE_we_are_the_leaders_here_desc: "우리는 처음부터 폭스바겐 그룹을 이끌어 왔습니다. 왜 이 작은 실수 하나가 우리의 리더십을 빼앗아 가야 합니까?!"
 CZE_accuse_skoda_of_complicity: "슈코다 공모 혐의 제기"
 CZE_accuse_skoda_of_complicity_desc: "슈코다가 이 스캔들에 연루되었다는 작은 증거만으로도 평판이 무너질 수 있습니다. 효과를 보려면 강하게 공격해야 합니다."
 CZE_fundaments_of_the_skoda_group: "슈코다 그룹의 기초"
 CZE_fundaments_of_the_skoda_group_desc: "우리가 무엇을 하고 있는지 보여 주어야 합니다. 그룹의 통수권을 넘겨받으면 새로운 질서를 확립하고 안정화 계획을 시작할 것입니다."
 CZE_talk_to_seat: "세아트와 대화"
 CZE_convince_seat_to_stay_with_volkswagen: "세아트가 폭스바겐에 남도록 설득"
 CZE_talk_to_lamborghini: "람보르기니와 대화"
 CZE_convince_lamborghini_to_stay_with_volkswagen: "람보르기니가 폭스바겐에 남도록 설득"
 CZE_talk_to_bentley: "벤틀리와 대화"
 CZE_convince_bentley_to_stay_with_volkswagen: "벤틀리가 폭스바겐에 남도록 설득"
 CZE_talk_to_bugatti: "부가티와 대화"
 CZE_convince_bugatti_to_stay_with_volkswagen: "부가티가 폭스바겐에 남도록 설득"
 CZE_help_promoting_skoda_actions: "슈코다 활동 홍보 지원"
 CZE_help_promoting_skoda_actions_desc: "체코 정부가 폭스바겐 그룹 인수를 돕기 위한 행사를 조직하는 데 동의했습니다. 이 도움에 감사드립니다."
 CZE_talk_with_the_german_government: "독일 정부와 회담"
 CZE_talk_with_the_german_government_desc: "체코 정부의 지원 덕분에 독일 정부와 대화를 시작합니다. 결실이 있기를 바랍니다."
 CZE_get_approval_to_legally_take_over_volkswagen_group: "폭스바겐 그룹 합법적 인수 승인 획득"
 CZE_get_approval_to_legally_take_over_volkswagen_group_desc: "독일 정부가 이 자리를 쉽게 내주지는 않을 것입니다. 폭스바겐의 신뢰와 입지가 크게 흔들리고 있음을 설득해야 합니다."
 CZE_investment_in_the_future: "미래에 대한 투자"
 CZE_investment_in_the_future_desc: "우리가 폭스바겐과 동등하지 않다는 것을 알고 있지만, 그룹 리더십을 차지하면 자동차 산업을 그 어느 때보다 빠르게 발전시킬 수 있습니다. 폭스바겐이 너무 느렸기에 우리가 더 잘할 수 있습니다."
 CZE_skoda_is_getting_aggressive: "슈코다의 공세적 태세"
 CZE_skoda_is_getting_aggressive_desc: "슈코다의 갑작스런 움직임이 대응 조치를 어렵게 합니다. 다른 회사들이 그들의 조건을 받아들이면 우리의 입지를 지킬 수 없을지도 모릅니다."
 CZE_what_happened_to_our_group: "우리 그룹에 무슨 일이?"
 CZE_what_happened_to_our_group_desc: "우리는 긴밀하게 연결되어있는, 번성하던 그룹이었습니다. 하지만 지금은 보시다시피 그렇지 못했습니다. 한 번의 큰 실수가 우리 공동체의 균형을 무너뜨렸고, 동업자 중 한 명이 부당하고 공격적으로 이를 이용했습니다. 왜 등을 돌리는지 모르겠지만, 폭스바겐 그룹은 정치 싸움으로 무너지는 것이 아닌 전 세계 자동차 산업의 한 축이 되었어야 했습니다. 실망을 드려 죄송합니다."
 CZE_finish_the_preparations: "준비 완료"
 CZE_expansion_to_china: "중국 진출"
 CZE_buy_back_full_production_license: "생산 권한 전부 재매입"
 CZE_buy_back_full_production_license_desc: "권한을 점진적으로 구매해야 합니다. 운이 좋으면 폭스바겐이 조기에 모든 물량을 줄 수도 있고, 그렇지 않으면 5회에 걸쳐 분할 매입해야 합니다."
 CZE_actions_drop: "행동 중단"
 CZE_cesky_motor_energy_holding: "체코 자동차-에너지 지주회사"
 CZE_cesky_motor_energy_holding_desc: "폭스바겐 그룹을 떠날 계획이지만, 다른 회사와의 협력은 완전히 포기하지 않습니다. 국내에는 협력할 수 있는 자동차 및 에너지 기업이 많습니다. 프로젝트를 다듬은 뒤 주요 기업들을 한 조직으로 통합할 것입니다.\n\n§G타트라:§! [?CZE.tatra_support|.0%%Y]\n§G체코 국영 군수정비공장:§! [?CZE.vop_support|.0%%Y]\n§G프라가:§! [?CZE.praga_support|.0%%Y]\n§G체코전력공사:§! [?CZE.cez_support|.0%%Y]"
 CZE_tatra_trucks_decision: "§Y타트라§!와 대화"
 CZE_vop_cz_decision: "§Y체코 국영 군수정비공장§!과 대화"
 CZE_praga_decision: "§Y프라가§!와 대화"
 CZE_cez_decision: "§Y체코전력공사§!와 대화"
 CZE_start_selling_state_companies_category: "국영 기업 매각 시작"
 CZE_start_selling_state_companies_category_desc: "민영화 요소 중 하나는 정부 소유 기업 매각입니다. 다른 체코 기업과 외국 기업 모두 주식을 매입할 수 있습니다."
 CZE_czech_railways: "체코 철도"
 CZE_cez_group: "체코전력공사(ČEZ) 그룹"
 CZE_banks: "은행"
 CZE_czech_airlines: "체코 항공"
 CZE_temelin_reactor_construction_category: "테멜린 원자력 발전소 건설"
 CZE_temelin_reactor_construction_category_desc: "테멜린 원자력 발전소 전체 프로젝트는 1981년에 시작되었으며, 1987년에 건설이 착수되었습니다. 막대한 비용이 드는 이 투자는 향후 수십 년간 에너지 안보를 보장할 것입니다. 지금 이 건설을 완성하는 것이 최우선 과제입니다."
 CZE_temelin_reactor_opening: "테멜린 발전소 개소"
 CZE_temelin_reactor_opening_desc: "1년 안에 발전소와 첫 번째 원자로 건설을 완공할 예정입니다. 이는 체코 경제에 매우 중요한 순간이 될 것입니다."
 CZE_new_nuclear_power_plant_category: "신규 원자력 발전소 건설"
 CZE_new_nuclear_power_plant_category_desc: "새로운 원자력 발전소 건설을 위한 대규모 계약을 체결했습니다. 이 프로젝트는 반드시 성공해야 합니다. 기한이 촉박하며 사소한 실수도 큰 손실을 초래할 수 있습니다."
 CZE_third_nuclear_power_plant_deadline: "제3 원자력 발전소 완공 기한"
 CZE_third_nuclear_power_plant_deadline_desc: "이전 발전소 건설에 너무 오랜 시간이 걸렸습니다. 투자자들은 더 이상 기다려주지 않으며 엄격한 기한을 설정했습니다. 그때까지 발전소를 완공하지 못하면 모든 건설 보조금을 상실하게 됩니다."
 CZE_gather_funds: "자금 모금"
 CZE_gather_funds_desc: "건설을 시작하려면 많은 자금이 필요합니다.\n§G모금된 자금:§! §Y[?THIS.CZE_power_plants_funds]/200§!"
 CZE_construction_site: "건설 부지"
 CZE_finish_construction: "건설 완료"
 CZE_finish_construction_desc: "언제든 건설을 완료할 수 있지만 개선 여지가 남아 있을 수 있습니다. 공기가 제한되어 있지만 추가 작업을 먼저 완료하면 발전소를 더 완벽하게 만들 수 있습니다."
 CZE_additional_laboratory_equipment: "추가 연구소 장비"
 CZE_start_with_better_fuel: "고성능 연료 사용 시작"
 CZE_thermonuclear_reactor: "열핵반응로"
 CZE_kscm_strikes_at_eu_category: "유럽연합을 강타한 보헤비아 모라비아 공산당"
 CZE_kscm_strikes_at_eu_category_desc: "다른 정당들에게 압도당하기 전에 인기를 얻을 수 있는 마지막 기회입니다. 유럽연합 내 공산당 지도부를 장악하면 여러 국가와의 정치적 관계가 크게 강화되지만, 우리의 지지율이 하락 추세이기 때문에 쉽지 않을 것입니다."
 CZE_eu_mission_fail: "유럽연합 임무 실패"
 CZE_campaign_in_visegrad_group: "비셰그라드 그룹 선거운동"
 CZE_campaign_in_balkans: "발칸 반도 선거운동"
 CZE_campaign_in_west: "서유럽 선거운동"
 CZE_elections_day: "선거일"
 CZE_ods_promote_electoral_program: "§1시민민주당§! - 선거 공약 홍보"
 CZE_cssd_promote_electoral_program: "§t사회민주당§! - 선거 공약 홍보"
 CZE_sell_everything: "모든 자산 매각"
 CZE_sell_everything_desc: "We can sell all of our cars to the international market for smaller profit but preparation for such transaction takes much time and will slow down our production. We also need to convert 1 of our factories to prepare the transaction."
 CZE_reduce_flooding_risk_category: "홍수 위험 감소"
 CZE_reduce_flooding_risk_category_desc: "사회민주당의 공약 중 하나는 국내 홍수 위험을 줄이는 것입니다. 체코는 내륙국이지만, 특히 블타바강과 엘베강은 주민들에게 큰 위험이 될 수 있습니다. 이 위험을 반드시 차단하거나 최소화해야 합니다."
 CZE_increse_bohemia_security: "보헤미아 안전 강화"
 CZE_increse_moravia_security: "모라비아 안전 강화"
 CZE_increse_sumava_security: "슈마바 안전 강화"
 CZE_increse_czech_silesia_security: "체코 실레시아 안전 강화"
 CZE_spolu_government_formation_category: "함께(SPOLU) 연합정부 형성"
 CZE_spolu_government_formation_category_desc: "With the leadership of SPOLU coalition we can better manage the future of our country and nation. In these uncertain times it's up to us to choose new country development doctrine and prepare new government that will allow us to get into new decade in the best way possible."
 CZE_national_development_doctrine_open: "국가 발전 기조 설정"
 CZE_national_development_doctrine_close: "국가 발전 기조 설정 완료"
 CZE_stay_in_the_welfare_state: "복지국가 유지"
 CZE_stay_in_the_welfare_state_desc: "세계 상황에 관계없이 기존 복지 프로그램을 계속해서 추진할 것입니다."
 CZE_focus_on_the_economy: "경제 주력"
 CZE_focus_on_the_economy_desc: "지금은 사회적 문제를 다루는 것보다 경제가 훨씬 중요합니다. 위기 시 생산 라인을 빠르게 전환할 준비가 필요합니다."
 CZE_begin_the_rearmament: "재무장 시작"
 CZE_begin_the_rearmament_desc: "사회 프로그램을 마무리하고 경제를 개선할 시간이 없습니다. 지금 당장 대규모 군수품 생산을 시작해야 합니다."
 CZE_new_government_preparation_open: "개각"
 CZE_new_government_preparation_close: "개각 마무리"
 CZE_prepare_martin_baxa_for_new_job: "마르틴 박사 임명 준비"
 CZE_prepare_zbynek_stanjura_for_new_job: "즈비네크 스타뉴라 임명 준비"
 CZE_prepare_pavel_blazek_for_new_job: "파블 블라젝 임명 준비"
 CZE_prepare_martin_kupka_for_new_job: "마르틴 쿠프카 임명 준비"
 CZE_prepare_jana_cernechova_for_new_job: "야나 체르노초바 임명 준비"
 CZE_petr_pavel_presidenture_category: "대통룡 후보 페트르 파벨"
 CZE_petr_pavel_presidenture_category_desc: "After decades in the army, Petr Pavel decided to go to the well-deserved retirement and join the political sphere. He was always caring about his country and its people, creating defensive programs and establishing closer relation with the alliance. Now, he is going to run for president of his country as a non-aligned to any party politician."
 CZE_ods_support: "§1시민민주당 지지§!"
 CZE_kducsl_support: "§3인민당 지지§!"
 CZE_top_support: "§C전통 번영을 위한 책임 지지§!"
 CZE_increase_support_among_the_people: "국민 지지율 상승"
 CZE_play_cod_with_ment: "YouTuber MenT와 콜 오브 듀티 플레이"
 CZE_play_cod_with_ment_desc: "선거 전 페트르 파블은 유튜버 MenT의 초청을 받아 짧은 대화와 함께 콜 오브 듀티를 플레이했습니다. 영상은 매우 호평을 받았습니다."
 CZE_czech.1.t: "미지급 청구서"
 CZE_czech.1.d: "당사에서 월간 청구서를 납부할 자금을 마련하지 못했습니다. 오랜만에 발생한 일이고 슈코다의 국가적 중요성을 고려하여 채권 추심 회사가 이를 눈감아 주기로 했습니다."
 CZE_czech.1.a: "자금을 마련해야 합니다."
 CZE_czech.2.t: "전기고속도로 부지 선정"
 CZE_czech.2.d: "체코 전역에 전기고속도로을 구축할 충분한 자금이 없습니다. 시범적으로 1km 구간을 건설할 지방 정부를 선택합시다."
 CZE_czech.2.o1: "[117.GetName] 지역이 이 구간을 맡아야 한다."
 CZE_czech.2.o2: "[118.GetName] 지역을 선택하는게 좋겠다!"
 CZE_czech.2.o3: "[1017.GetName] 지역이 이 일을 해낼 것이다."
 CZE_czech.2.o4: "[1018.GetName] 지역이 선택될만 하다."
 CZE_czech.3.t: "미래 슈코다 계획 선택"
 CZE_czech.3.d: "슈코다의 미래는 밝지만, 공장 전반의 효율을 높일지 또는 슈퍼브 자동차 일일 생산량을 늘릴지에 대해서 결정해야 합니다."
 CZE_czech.3.o1: "더 많은 차량을 생산하자"
 CZE_czech.3.o2: "공장 생산량을 증가시킬 필요가 있다"
 CZE_czech.4.t: "슈코다, 폭스바겐 그룹 탈퇴 준비"
 CZE_czech.4.d: "슈코다가 폭스바겐 그룹에서 탈퇴를 준비하기 시작했습니다. 그러나 폭스바겐 그룹의 강력한 통제는 이 과정을 쉽게 만들지 않습니다. 먼저 완전한 독립성을 회복해야 이 논란 가득한 결정을 종결지을 수 있을 것입니다."
 CZE_czech.4.o1: "그들은 무엇이 최선인지 알고 있습니다..."
 CZE_czech.5.t: "신규 원자력 발전소 부지 설정"
 CZE_czech.5.d: "원자력 발전소 건설에는 많은 준비가 필요합니다. 자금을 모으는 동안 프로젝트 부지를 선정할 수 있습니다."
 CZE_czech.5.o1: "보헤미아!"
 CZE_czech.5.o2: "모라비아!"
 CZE_czech.5.o3: "슈마바!"
 CZE_czech.5.o4: "체코 실레시아!"
 CZE_czech.6.t: "자올지에냐 전쟁이냐"
 CZE_czech.6.d: "Czech Republic led by communist KSČM party continues its aggressive doctrine and demanded Zaolzie from Poland."
 CZE_czech.6.o1: "으… 좋아…"
 CZE_czech.6.o2: "왜 또?! 안 돼!"
 CZE_czech.7.t: "체코 보헤미아 모라바 공산당, 또다시 공세!"
 CZE_czech.7.d: "KSČM party from Czech Republic yet again decided to influence European Union members by huge pro-communist initiative. Due to really low support for KSČM, nobody actually believes that their propaganda will get any success."
 CZE_czech.7.o1: "야, 그만해"
 CZE_czech.8.t: "시민민주당, 새 연합 구성 준비"
 CZE_czech.8.d: "Democratic ODS party decided to face the decreasing support and make an alliance with Strana Zelených and KDU-ČSL. The parties are already close to each other and the success of this plan might improve the situation in each of those parties."
 CZE_czech.8.o1: "곧 효과가 나타날 것입니다."
 CZE_czech.9.t: "시민민주당, 새로운 우군 모색"
 CZE_czech.9.d: "시민민주당이 협력을 중시하는 정당임을 다시 한 번 입증했습니다. 오늘 시민민주당은 보수-자유주의 정당인 전통 번영을 위한 책임 및 체코공공당(Věci veřejné)과 연합을 맺었습니다. 이 연합은 의회 내 시민민주당의 우위를 강화하고 개혁의 새 길을 열 것입니다."
 CZE_czech.9.o1: "훌륭하군"
 CZE_czech.10.t: "시민민주당, 경제활동가와 충돌"
 CZE_czech.10.d: "Ecological Activists started to protest in several places in the whole country. In response, ODS politicians in cooperation with uniformed services suppressed the 'strikes' and restored order."
 CZE_czech.10.o1: "다시 돌아오지 마"
 CZE_czech.11.t: "시민민주당, 체면 실추!"
 CZE_czech.11.d: "Ecological Activists started to protest in several places in the whole country. In response, ODS politicians in cooperation with uniformed services tried to suppress the 'strikes' but one of the politicians decided to forcefully move small group away from their protest place. In response, ODS actions got criticized in the Internet and the politician got into custody on charges of aggressive attitude towards other people."
 CZE_czech.11.o1: "젠장!"
 CZE_czech.12.t: "시민민주당, 막대한 지지 획득!"
 CZE_czech.12.d: "Conservative ODS party gains enormous support during [GetYear] Elections and totally overruns its rival, ČSSD. We could say that for ODS the election is already over but for ČSSD it's currently a really hard time to get any seat from the incoming elections."
 CZE_czech.12.o1: "흥미롭군"
 CZE_czech.13.t: "사회민주당, 막대한 지지 획득!"
 CZE_czech.13.d: "사회민주당이 높은 득표율을 보이며 선거 승리에 가까워졌습니다. 사회민주당은 다시 한 번 시민민주당을 압도하며 승리를 확실히 할 것입니다."
 CZE_czech.13.o1: "흥미롭군"
 CZE_czech.14.t: "유럽연합과 더 가까워진 [CZE.GetName]"
 CZE_czech.14.d: "체코 공화국이 EU 가입 찬성을 발표했습니다. [CZE.GetLeader]는 자국을 EU에 더 가깝게 만들기 위한 계획을 제시했습니다."
 CZE_czech.14.o1: "환영한다."
 CZE_czech.15.t: "전국 국민투표"
 CZE_czech.15.d: "정부는 체코의 EU 가입 여부에 대한 국민 의견을 묻기로 했습니다. 대다수 국민이 투표에 참여했고 그 결과는…"
 CZE_czech.15.o1: "찬성!"
 CZE_czech.15.o2: "반대!"
 CZE_czech.16.t: "[CZE.GetName] Suggests Increase Of National Defence Spending"
 CZE_czech.16.d: "정부는 현재 국방비가 너무 낮다고 판단합니다. 전쟁 위협을 우려하며 강화된 방어가 침략자를 억제할 수 있다고 봅니다."
 CZE_czech.16.o1: "물론이지."
 CZE_czech.16.o2: "돈 낭비다."
 CZE_czech.17.t: "신규 국방예산안"
 CZE_czech.17.d: "The new millennium has started and our country falls back even further than before. The major powers are rising in power so we should do everything to catch up with them at least in a small percentage. Unfortunately... our limited budget allows us to prioritize only one military branch."
 CZE_czech.17.o1: "육군 현대화"
 CZE_czech.17.o2: "공군이 가장 중요하다"
 CZE_czech.17.o3: "장교들은 더 많은 훈련이 필요하다"
 CZE_czech.18.t: "페트르 파블, 국방비 삭감 저지 시도"
 CZE_czech.18.d: "장교 페트르 파블이 국방비 삭감이 옳지 않다는 논리를 제시했습니다. 지금은 위협이 보이지 않아도 존재할 수 있습니다. 결정을 재고해야 할지 모릅니다."
 CZE_czech.18.o1: "말도 안 돼, 우리는 위험하지 않아"
 CZE_czech.18.o2: "일단 보류하자"
 CZE_czech.18.o3: "그가 옳다, 증액해야 한다"
 CZE_czech.19.t: "[CZE.GetName], 공동 군사 훈련 제안"
 CZE_czech.19.d: "새로운 체코 대통령이 우리 영토에서 공동 군사 훈련을 제안했습니다. 현 체코 대통령은 은퇴 육군 장군 출신으로, 그의 전술과 계획 방식을 배울 수 있을 것입니다."
 CZE_czech.19.o1: "물론이지."
 CZE_czech.19.o2: "돈과 시간 낭비다."
 CZE_czech.20.t: "[POL.GetName]의 제안 수락"
 CZE_czech.20.d: "폴란드 정부가 공동 군사 훈련 준비를 시작했습니다. 양국 모두 혜택을 얻을 것입니다."
 CZE_czech.20.o1: "좋아"
 CZE_czech.21.t: "[POL.GetName]의 제안 거부"
 CZE_czech.21.d: "폴란드 정부가 공동 훈련을 거부했습니다."
 CZE_czech.21.o1: "해볼 만한 시도였다"
 CZE_czech.22.t: "[CZE.GetName]의 동부 전선 장비 추가 지원 요청"
 CZE_czech.22.d: "Czech government reached out to us to ask for the increased protection against Russia. We have some equipment to spare but it will be very expensive transaction for us."
 CZE_czech.22.o1: "장비를 제공하겠다"
 CZE_czech.22.o2: "다른 일이 있다"
 CZE_czech.23.t: "신규 장비를 지원한 [USA.GetName]!"
 CZE_czech.23.d: "American government decided to launch a project that includes support for the eastern countries of our alliance. Due to the rising tension with Russia, they will send us new equipment for extra protection."
 CZE_czech.23.o1: "훌륭해!"
 CZE_czech.24.t: "원조를 보낸 [USA.GetName]!"
 CZE_czech.24.d: "American government decided to launch a project that includes support for the eastern countries of our alliance. Due to the rising tension with Russia, they will send us to the eastern flank countries equipment for extra protection."
 CZE_czech.24.o1: "훌륭해!"
 CZE_czech.25.t: "지원을 보류한 [USA.GetName]"
 CZE_czech.25.d: "미국 정부가 국내 현안에 집중하기로 결정하여 우리에게 추가적인 장비 지원을 하지 않기로 했습니다."
 CZE_czech.25.o1: "음."
 CZE_czech.26.t: "대통령으로 당선된 페트르 파블!"
 CZE_czech.26.d: "Retired army general Petr Pavel has won the latest presidential elections and formed a new government. He doesn't belong to any party but that didn't stop the SPOLU coalition from supporting his candidature and electoral program."
 CZE_czech.26.o1: "훌륭해!"
 CZE_czech.27.t: "크바시니 공장 확장 완료"
 CZE_czech.27.d: "슈코다가 크바시니 공장을 확장하여 신형 차량 생산 준비를 마쳤으며, 신규 시설은 제조 연구와 운전 편의성 개선 연구를 가능하게 합니다. 연구 센터는 아직 개소 전이지만, 새로운 슈퍼브 모델 생산과 함께 가동될 예정입니다."
 CZE_czech.27.o1: "탁월하다"
 CZE_czech.28.t: "전국 대규모 홍수 발생!"
 CZE_czech.28.d: "A week of intense rainfall produced flooding across a large portion of our country and almost half of Europe. The event killed 232 people and left $27.115 billion in damage. The flood was of a magnitude expected to occur roughly once a century. One of the most affected regions was the Prague capital state, which suffered damage worth millions of dollars and caused death to 17 people."
 CZE_czech.28.o1: "소방관들은 어디에 있지?!"
 CZE_czech.29.t: "남모라비아지역 토네이도 발생"
 CZE_czech.29.d: "드문 대규모 토네이도가 [?global.date.GetDateStringNoHourLong] 저녁 호도닌·브르제클라프 일대 여러 마을을 강타해 6명이 사망, 576명이 부상했습니다. 2001년까지 유럽에서, 그리고 현대 체코 역사상 가장 강력하고 치명도가 높은 토네이도로 기록되었으며, 후지타 규모 F4, 국제 후지타 규모 IF4로 평가되었습니다."
 CZE_czech.29.o1: "심각하다..."
 CZE_czech.30.t: "메탄올 중독 사태 발생!"
 CZE_czech.30.d: "The Czech government established a central emergency response council and banned the sale of liquors with more than 20% alcohol by volume at food stands in 2012. The poisoning affected thousands of Czech, Polish and Slovak citizens, causing dozens of deaths. The police systematically checked shops where liquors were sold. Led by police vice president Václav Kučera, a special police team called Metyl coordinated the investigations. The police announced that the source of the methanol-contaminated alcohol had been identified. Two main suspects were arrested: Rudolf Fian, a businessman from Karviná of Slovak nationality, and Tomáš Křepela, a Czech company owner from Řitka."
 CZE_czech.30.o1: "주류 판매를 금지해라!"
 CZE_czech.31.t: "[642.GetName] 점령 성공!"
 CZE_czech.31.d: "우리군이 적으로부터 칼리닌그라드를 탈취하여 체코 정부의 통치 하에 편입했습니다. 이는 국가적으로 중요한 날이며, 기념 행사가 필요합니다!"
 CZE_czech.31.o1: "승리의 날!"
 CZE_czech.31.o2: "그럴 필요 없다."
 CZE_news.1.t: "슈코다, 슈퍼브 차량 수출 개시"
 CZE_news.1.d: "슈코다가 최신 슈퍼브 I 모델의 유럽 수출을 시작했습니다. 폭스바겐 그룹의 일원인 관계로, 동일 그룹 소속 국가들은 신차 구매 시 할인을 받습니다."
 CZE_news.1.o1: "수익을 창출할 시점이다"
 CZE_news.1.o2: "흥미롭구만"
 CZE_news.2.t: "슈코다, 폭스바겐에 도전장!"
 CZE_news.2.d: "슈코다 CEO가 독일 폭스바겐 차량의 배출가스 시험 결과를 공개하며 실제보다 낮게 발표되었음을 지적했습니다. 슈코다는 그룹 내 평판을 걸고 폭스바겐 지분 인수와 경영권 장악을 선언했습니다."
 CZE_news.2.o1: "슈코다 화이팅!"
 CZE_news.2.o2: "젠장!"
 CZE_news.2.o3: "폭스바겐, 실망스럽다."
 CZE_news.2.o4: "우리에게도 그 차를 팔았다니?"
 CZE_news.3.t: "보헤미아 모라바 공산당, 유럽연합 영향 확대"
 CZE_news.3.d: "Komunistická strana Čech a Moravy, KSČM continues their eurocommunist ideology program by motivating communist parties that belong to the European Union. The parties gained some popularity in every Union member, increasing power of the communist ideology in Europe."
 CZE_news.3.o1: "우리 탓 하지마세요"
 CZE_news.3.o2: "뭐라고?!"
 CZE_news.4.t: "[CZE.GetName], 유럽연합 장악"
 CZE_news.4.d: "Czech KSČM, who's currently ruling the country, started implementing its Euro-communism program. In result, communist parties in the whole European Union start to support KSČM, gaining enormous support. Turns out that European Union isn't as strong as everyone thought. If nothing will stop KSČM, the Europe might become communist again."
 CZE_news.4.o1: "필요한 조치다."
 CZE_news.4.o2: "유럽연합은 더 강력해야 한다."
 CZE_news.4.o3: "유럽연합은 취약하다."
 CZE_news.5.t: "[CZE.GetName], 군수물자 생산 개시"
 CZE_news.5.d: "새로 선출된 보헤미아 모라바 공산당 정권이 비밀리에 군수 생산 계획을 수립하고, 1968년 바르샤바 조약군의 체코슬로바키아 침공에 대한 보상을 요구했습니다."
 CZE_news.5.o1: "책임을 물어야 한다"
 CZE_news.5.o2: "그래서 어떤 효과가 있을까?"
 CZE_news.6.t: "폴란드, 체코에 자올지에 양도"
 CZE_news.6.d: "체코가 폴란드에 자올지에 지역의 남은 부분 양도를 요구했고, 이제 해당 지역은 완전히 체코의 통제 하에 있습니다."
 CZE_news.6.o1: "바람직한 결정이다."
 CZE_news.6.o2: "무슨 일-"
 CZE_news.6.o3: "아직 끝나지 않았다!"
 CZE_news.7.t: "폴란드, 자올지에 반환 거부"
 CZE_news.7.d: "체코의 요구에도 불구하고 폴란드 정부가 자올지에 반환을 거부해 비셰그라드 그룹 내 긴장이 고조되었습니다."
 CZE_news.7.o1: "강력히 대응하자"
 CZE_news.7.o2: "현명한 선택이다."
 CZE_news.7.o3: "우리는 무너지지 않는다"
 czech_skoda.1.t: "자동차 수출 준비"
 czech_skoda.1.d: "우리의 차량 일부를 해외로 보낼 수 있습니다. 이는 우리 기업에 수익을 가져다주며, 모든 세금을 공제한 뒤에는 체코 공화국의 경제 발전에 도움이 될 것입니다."
 czech_skoda.1.o1: "슈퍼브 I 발송"
 czech_skoda.1.o2: "슈퍼브 II 발송"
 czech_skoda.1.o3: "슈퍼브 III 발송"
 czech_skoda.1.o4: "슈퍼브 IV 발송"
 czech_skoda.1.o5: "마음이 바뀌었다"
 czech_skoda.2.t: "[CZE.GetName] 슈코다사의 자동차 판매 희망"
 czech_skoda.2.d: "슈코다사가 슈코다 슈퍼브 모델의 구매를 우리에게 제안했습니다. 이 거래 덕분에 우리의 해외 투자가 탄력을 받을 것이며, 시민들은 공장에서 막 나온 새 자동차를 즐길 수 있을 것입니다."
 czech_skoda.2.o1.german: "바이터슈타트가 첫 슈퍼브 I을 받게 하라"
 czech_skoda.2.o2.german: "독일 딜러망 전반으로 슈퍼브 II를 확대하라"
 czech_skoda.2.o3.german: "볼프스부르크가 슈퍼브 III 선적을 승인한다"
 czech_skoda.2.o4.german: "슈퍼브 IV를 파사트 아래 급으로 판매하라"
 czech_skoda.2.o5.german: "볼프스부르크는 들어설 자리가 없다고 본다"
 czech_skoda.2.o6: "싫다, 다시는 묻지 마라"
 czech_skoda.3.t: "[FROM.GetName]의 거래 수락!"
 czech_skoda.3.d: "[FROM.GetName]은(는) 우리 슈퍼브 자동차 판매 계약에 서명하였고, 첫 물량이 이미 창고를 떠나고 있습니다. 대금은 모든 세금과 청구액을 공제한 뒤 우리 계좌와 체코 국고로 이체되었습니다."
 czech_skoda.3.o1: "좋은 거래다"
 czech_skoda.4.t: "거래 확인"
 czech_skoda.4.d: "각하, 슈코다 슈퍼브 자동차의 해외 판매에 관해 각하의 확인이 필요합니다."
 czech_skoda.4.o1: "진행하자"
 czech_skoda.4.o2: "마음이 바뀌었다"
 czech_skoda.5.t: "[FROM.GetName]의 거래 거절!"
 czech_skoda.5.d: "[FROM.GetName]은(는) 우리 자동차의 구매를 거절했습니다. 우리는 원점으로 돌아왔지만, 시장에는 우리의 제안을 확실히 더 기꺼이 받아들일 구매자가 아직 많이 있습니다. 앞으로 7일 동안은 [FROM.GetName]에 다른 거래를 요청할 수 없습니다."
 czech_skoda.5.o1: "다른 시장도 있다"
 czech_skoda.6.t: "비축 자동차 부족"
 czech_skoda.6.d: "수익성 있는 수출을 시작하기에 슈코다 슈퍼브 자동차가 부족합니다. 어느 세대든 최소 1000대가 필요합니다."
 czech_skoda.6.o1: "좋아"
 czech_skoda.7.t: "[FROM.GetName]의 우리 거래 차단!"
 czech_skoda.7.d: "[FROM.GetName]은(는) 우리 자동차 구매를 중단하기로 결정했습니다. 그들은 더 이상 우리의 제안을 수락하지 않을 것입니다."
 czech_skoda.7.o1: "어떻게 그럴 수가?!"
 CZE_scripted_event.1.t: "프라하의 반세계화 시위"
 CZE_scripted_event.1.d: "프라하에서 국제통화기금과 세계은행 회의가 열리는 동안 도시 전역에서 폭동이 일어났습니다. 12,000명이 넘는 반세계화·반자본주의 시위대가 거리를 점거하고 보안 병력과 충돌하기 시작했습니다. 당국이 충분히 준비하고 있었고 예상되는 파업에도 대비했음에도 불구하고 폭동은 거의 한 주 내내 이어졌습니다. 많은 경찰관이 부상을 입었으나 사망자는 보고되지 않았습니다. 폭도들은 진압되었고 다수가 유죄 판결을 받았습니다."
 CZE_scripted_event.1.o1: "이런 일이 있어서는 안 된다"
 CZE_skoda_volkswagen.1.t: "회견 실패!"
 CZE_skoda_volkswagen.1.d: "우리의 모든 노력에도 불구하고 기자회견에서 지지를 얻지 못했습니다. 기자들은 우리에게 유리하게 답변할 수 없는 질문을 너무 많이 던졌습니다. 곧 또 다른 기회가 있을 것입니다."
 CZE_skoda_volkswagen.1.o1: "아직 끝나지 않았다"
 CZE_skoda_volkswagen.2.t: "비판받는 슈코다!"
 CZE_skoda_volkswagen.2.d: "슈코다 자동차가 배기가스 결과 조작에 관해 특히 해로운 주장을 제기하자, 폭스바겐은 뒤처지지 않기로 결정했습니다. 오늘 아침 [?global.date.GetDateStringNoHourLong]에 결과 조작과 관련한 슈코다와 폭스바겐 핵심 직원들 사이의 사적 대화가 공개되었고, 이 모든 내용이 독립 언론에 전달되었습니다. 슈코다에 비판의 물결이 몰아쳤지만, 회사 CEO는 회사가 그러한 관행에 관여하지 않았다고 장담하며 분위기를 가라앉혔습니다."
 CZE_skoda_volkswagen.2.o1: "왜 그들을 신뢰하는 거지?!"
 CZE_skoda_volkswagen.2.o2: "증거를 숨길 수 없다면 우리를 공격하지 마라"
 CZE_skoda_volkswagen.3.t: "추락한 폭스바겐의 대중 이미지!"
 CZE_skoda_volkswagen.3.d: "폭스바겐은 슈코다가 배출가스 시험 결과 조작에 적극적으로 가담했다고 독립 언론을 설득하려 했습니다. 그러나 이 정보가 거짓임을 입증하는 부정확한 부분이 발견되었습니다. 언론이 이 문제를 공론화했고, 슈코다는 폭스바겐 그룹의 다른 계열사들로부터 지지를 얻었습니다."
 CZE_skoda_volkswagen.3.o1: "더럽게 나오려 했나 보군?"
 CZE_skoda_volkswagen.3.o2: "어떻게 이런 일이?!"
 CZE_skoda_volkswagen.4.t: "슈코다에 합류하는 세아트!"
 CZE_skoda_volkswagen.4.d: "세아트는 폭스바겐을 자사 그룹에서 배제하고 새로운 규칙을 도입하는 것을 목표로 하는 슈코다 그룹 프로젝트에 합류하기로 결정했습니다."
 CZE_skoda_volkswagen.4.o1: "좋다"
 CZE_skoda_volkswagen.4.o2: "젠장!"
 CZE_skoda_volkswagen.5.t: "슈코다에 합류하는 람보르기니!"
 CZE_skoda_volkswagen.5.d: "람보르기니는 폭스바겐을 자사 그룹에서 배제하고 새로운 규칙을 도입하는 것을 목표로 하는 슈코다 그룹 프로젝트에 합류하기로 결정했습니다."
 CZE_skoda_volkswagen.5.o1: "좋다"
 CZE_skoda_volkswagen.5.o2: "젠장!"
 CZE_skoda_volkswagen.6.t: "슈코다에 합류하는 벤틀리!"
 CZE_skoda_volkswagen.6.d: "벤틀리는 폭스바겐을 자사 그룹에서 배제하고 새로운 규칙을 도입하는 것을 목표로 하는 슈코다 그룹 프로젝트에 합류하기로 결정했습니다."
 CZE_skoda_volkswagen.6.o1: "좋다"
 CZE_skoda_volkswagen.6.o2: "젠장!"
 CZE_skoda_volkswagen.7.t: "슈코다에 합류하는 부가티!"
 CZE_skoda_volkswagen.7.d: "부가티는 폭스바겐을 자사 그룹에서 배제하고 새로운 규칙을 도입하는 것을 목표로 하는 슈코다 그룹 프로젝트에 합류하기로 결정했습니다."
 CZE_skoda_volkswagen.7.o1: "좋다"
 CZE_skoda_volkswagen.7.o2: "젠장!"
 CZE_skoda_volkswagen.8.t: "다른 기업들과 대화를 시작한 슈코다"
 CZE_skoda_volkswagen.8.d: "슈코다 오토는 폭스바겐이 자사 그룹에서 배제된 뒤 설립될 슈코다 그룹 프로젝트에 참여시키기 위해 다른 폭스바겐 그룹 계열사들과 협상에 들어갔습니다."
 CZE_skoda_volkswagen.8.o1: "내 눈이 검은 동안에는 안 된다!"
 CZE_skoda_volkswagen.9.t: "폭스바겐 그룹의 규칙을 우회하려는 슈코다"
 CZE_skoda_volkswagen.9.d: "슈코다의 최근 행보는 자신이 주도권을 쥐기 위해 폭스바겐 그룹의 오랜 규칙 일부를 우회할 준비가 되어 있음을 보여 주었습니다."
 CZE_skoda_volkswagen.9.o1: "그런데 아무도 반대하지 않는단 말인가?!"
 CZE_skoda_volkswagen.10.t: "슈코다 그룹을 창설하는 슈코다!"
 CZE_skoda_volkswagen.10.d: "폭스바겐 자동차 회사에 쏟아진 논란과 날카로운 비판의 결과로 슈코다가 그룹의 주도권을 잡고 슈코다 그룹의 설립을 선언했습니다. 슈코다에 합류한 모든 기업은 연구 보조금과 되찾은 상업적 안정을 누릴 수 있습니다."
 CZE_skoda_volkswagen.10.o1: "잘했다, 슈코다"
 CZE_political_event.1.t: "선거를 준비하는 US-DEU"
 CZE_political_event.1.d: "US-DEU가 젊고 비교적 경험이 부족한 정치인 파벨 네메츠를 선출하며 지도부를 교체한 뒤, 당은 다가오는 선거를 위한 새로운 선거 강령을 내놓았습니다...\n2006년 선거 전에 US-DEU가 세계관을 바꾸어 모두를 놀라게 할 것이라는 추측이 있습니다... 다만 유권자들이 기대하는 방식은 아닐 것입니다..."
 CZE_political_event.1.a: "그렇군?"
 CZE_political_event.2.t: "마약류 완화, 안락사, 동성 결혼 합법화를 지지하는 US-DEU"
 CZE_political_event.2.d: "민주주의 성향의 US-DEU가 제시한 최신 선거 강령에 논란이 많은 사안들의 합법화가 포함되어 있는 것으로 드러났습니다. 최근 공개된 정보의 결과로 당은 그 어느 때보다 많은 유권자를 잃기 시작했습니다."
 CZE_political_event.2.a: "이제 무섭군..."
 CZE_political_event.3.t: "준아나키즘 이념으로 돌아선 US-DEU!"
 CZE_political_event.3.d: "지지율 하락과 최근의 논란에 대응하여 US-DEU 정치인들은 슬로건을 바꾸고 준아나키스트적 관점으로 전환하기로 결정했으며, 기존 로고를 오각별 문양 상징으로 교체했습니다. 이 사태는 다른 모든 정당의 거센 비판에 직면했고 국제적인 실망감을 샀습니다. 그 결과 US-DEU는 거의 모든 유권자를 잃었고 국내에서 가장 인기 없는 정당이 되었습니다."
 CZE_political_event.3.a: "???"
 CZE_political_event.4.t: "하미드 빈 압달 사니의 운명을 결정하는 US-DEU"
 CZE_political_event.4.d: "하미드 빈 압달 사니는 카타르 왕가의 일원으로, 청소년 교육을 위태롭게 한 성적 학대 혐의로 2004년 9월부터 약 1년간 체코에서 구금되어 있습니다. 공소장에 따르면 그는 총 16명의 소녀를 학대했습니다.\n파벨 네메츠는 연설을 통해 이 사건을 어떻게 끝낼지 결정하려 합니다."
 CZE_political_event.4.a: "카타르가 이 사건을 마무리해야 한다"
 CZE_political_event.4.b: "그는 우리나라에 남을 것이다"
 CZE_political_event.5.t: "US-DEU의 해산"
 CZE_political_event.5.d: "민주주의 정당인 자유연합-민주연합은 오늘 [GetDateText]에 당의 해산을 선언했습니다. US-DEU는 2011년 1월 1일부로 존속을 멈춥니다. 이 당은 수많은 논란이 되는 행보로 알려져 있었지만 여전히 일부 충성스러운 유권자를 유지하고 있었습니다. 안타깝게도 그것만으로는 충분하지 않았습니다."
 CZE_political_event.5.a: "또 하나의 시대가 끝났다"
 CZE_political_event.6.t: "비판의 불길에 휩싸인 ČSSD!"
 CZE_political_event.6.d: "이 사건은 치노베츠의 리튬 매장지 탐사에서 비롯되었으며, 매장지 탐사권과 그에 뒤따를 채굴 가능성이 오늘의 논쟁 주제입니다. 사회민주주의 성향의 ČSSD는 오스트레일리아 기업과의 협력과 자원 채굴 개시를 요구하고 있습니다. 그러나 ANO 소속 정치인은 해당 양해각서가 무효이며 리튬 매장지는 손대지 않은 채로 두어야 한다고 선언했습니다."
 CZE_political_event.6.a: "그들은 그렇게 해서는 안 된다"
 CZE_political_event.6.b: "우리는 ČSSD와 함께한다"
 CZE_political_tree_event.1.t: "끝난 정치 선거"
 CZE_political_tree_event.1.d: "하원 선거가 또 한 차례 마무리되었습니다. 각 정당은 다음 선거 전까지 이행할 새로운 강령을 준비했으며 이미 이행에 착수했습니다."
 CZE_political_tree_event.1.a: "다음 단계로 나아갈 때다"
 CZE_political_tree_event.2.t: "시작된 임시 선거"
 CZE_political_tree_event.2.d: "이번에는 최근의 사건들로 인해 선거가 2013년에 시작되었습니다. 각 정당은 새 선거를 더 서둘러 준비해야 했으며 이미 새로운 선거 강령을 준비하고 있습니다."
 CZE_political_tree_event.2.a: "흥미롭군"
 CZE_petr_pavel_event.1.t: "[CZE.GetName]의 전쟁 지원을 위한 페트르 파벨 파견"
 CZE_petr_pavel_event.1.d: "페트르 파벨은 우리의 전쟁 노력을 돕고자 하는 체코 연락 장교입니다. 전술 기획에 대한 그의 경험은 탈레반을 우리 전선에서 몰아내는 데 도움이 될 수 있습니다."
 CZE_petr_pavel_event.1.a: "어떤 도움이든 필요하다"
 CZE_petr_pavel_event.1.b: "머무는 것은 괜찮지만 우리 지도에는 손대지 못한다"
 CZE_petr_pavel_event.2.t: "아프가니스탄 임무를 마친 페트르 파벨"
 CZE_petr_pavel_event.2.d: "페트르 파벨은 아프가니스탄에서의 임무를 마쳤습니다. 탈레반 세력에 맞선 아프가니스탄 부대와의 훈련과 협력으로 그는 사막 지형에 더 잘 적응하게 되었고, 체코와 아프가니스탄의 관계도 개선되었습니다."
 CZE_petr_pavel_event.2.a: "잘했다!"
 CZE_petr_pavel_event.3.t: "공세 계획을 준비하는 페트르 파벨"
 CZE_petr_pavel_event.3.d: "페트르 파벨은 탈레반에 맞선 새로운 공세 전략을 거의 완성했습니다. 수개월간 탈레반의 방식을 연구한 끝에, 그는 우리 군이 이 전쟁에서 승리하고 조국에 대한 통제권을 되찾는 데 도움이 될 새로운 교리를 제시할 준비가 되었습니다."
 CZE_petr_pavel_event.3.a: "반가운 소식이군!"
 CZE_petr_pavel_event.4.t: "아프가니스탄 작전을 마친 페트르 파벨"
 CZE_petr_pavel_event.4.d: "페트르 파벨은 탈레반에 맞선 새로운 공세 전략을 준비했으며 이번 작전 동안 원격으로 아프가니스탄 부대를 지원했습니다. 그 덕분에 아프가니스탄은 많은 전투에서 승리를 거두었고, 전쟁의 흐름이 그들에게 유리해지기 시작한 것으로 보입니다."
 CZE_petr_pavel_event.4.a: "좋군!"
 CZE_petr_pavel_event.5.t: "아프가니스탄 작전을 마친 페트르 파벨"
 CZE_petr_pavel_event.5.d: "수개월간의 기획 끝에 페트르 파벨은 아프가니스탄에서의 임무를 마쳤으며 그동안 아프가니스탄군을 증강했습니다. 아프가니스탄은 이제 탈레반의 다음 공격에 더 잘 대비하고 있습니다."
 CZE_petr_pavel_event.5.a: "좋아"
 CZE_petr_pavel_event.6.t: "새로운 전략 준비를 원하는 페트르 파벨"
 CZE_petr_pavel_event.6.d: "체코 장군 페트르 파벨은 탈레반 세력에 맞선 새로운 전략을 준비하고 이 계획을 실행할 상급 장군이 되겠다는 허가를 요청했습니다. 문제는 이 유럽인이 우리와는 다른 방식을 쓰고 있다는 점이며, 그가 계획을 도입하기 시작하면 지금 우리에게 필요한 경험치 획득 속도와 계획 수립 속도가 감소할 수 있습니다."
 CZE_petr_pavel_event.6.a: "이 제안을 받아들일 수 있다"
 CZE_petr_pavel_event.6.b: "그는 필요 없다"
 CZE_petr_pavel_event.7.t: "탈레반에 맞선 전략을 준비한 페트르 파벨"
 CZE_petr_pavel_event.7.d: "페트르 파벨은 아프가니스탄에서 새로운 작전을 개시할 준비가 되었습니다. 이제 그에게 필요한 것은 아프가니스탄 최고사령부의 승인뿐입니다."
 CZE_petr_pavel_event.7.a: "수고했다"
 CZE_petr_pavel_event.8.t: "페트르 파벨의 전략 준비를 허가한 아프가니스탄군"
 CZE_petr_pavel_event.8.d: "[AFG.GetName]은(는) 아프가니스탄군이 탈레반 집단을 격파하는 데 도움이 될 새로운 계획을 페트르 파벨이 수립하도록 허가하기로 결정했습니다. 페트르 파벨은 이제 탈레반과의 전투를 돕기 위한 전략을 준비할 수 있습니다."
 CZE_petr_pavel_event.8.a: "훌륭하군!"
 CZE_petr_pavel_event.9.t: "페트르 파벨의 전략 준비를 허가하지 않은 아프가니스탄군"
 CZE_petr_pavel_event.9.d: "[AFG.GetName]은(는) 페트르 파벨이 새로운 전략 계획을 수립하는 것을 허가하지 않기로 결정했습니다. 아프가니스탄 최고사령부는 자신들의 방식과 교리를 선호합니다."
 CZE_petr_pavel_event.9.a: "유감이군"
 CZE_petr_pavel_event.10.t: "강화된 전진 배치 지원을 마친 페트르 파벨"
 CZE_petr_pavel_event.10.d: "거의 1년간의 복무 끝에 페트르 파벨은 동부 측면에서 러시아에 맞선 방어 전략을 성공적으로 준비하고 조국으로 돌아왔습니다."
 CZE_petr_pavel_event.10.a: "이제 더 안전해졌다"
 CZE_petr_pavel_event.11.t: "[CZE.GetName]의 강화된 전진 배치 준비 지원 제안"
 CZE_petr_pavel_event.11.d: "강화된 전진 배치는 동맹의 안보를 위협하는 러시아의 공격적 정책에 대응하여 창설되었습니다. [CZE.GetName]은(는) 군사 능력 저하를 감수하는 대신 자국 장군 페트르 파벨을 보내 새로운 방어선 구축을 돕고자 합니다."
 CZE_petr_pavel_event.11.a: "기꺼이 참여하겠다!"
 CZE_petr_pavel_event.11.b: "지금은 경계를 늦출 수 없다"
 CZE_petr_pavel_event.12.t: "확고한 결의 작전에서 돌아오는 페트르 파벨"
 CZE_petr_pavel_event.12.d: "페트르 파벨은 다시 한번 동맹군을 도왔으며, 그의 기획 덕분에 다른 장군들이 이번 작전 중 더 원활하게 일할 수 있었습니다. 페트르 파벨은 현대적 방어 전략에 대해 더 많이 배우고 새로운 지식을 가지고 귀국했습니다."
 CZE_petr_pavel_event.12.a: "좋다"
 CZE_petr_pavel_event.13.t: "발트 항공 경찰 임무의 성공"
 CZE_petr_pavel_event.13.d: "페트르 파벨은 발트 항공 경찰 임무의 진행을 개선하는 복무를 마쳤으며, 발트 국가들이 공군 협조 체계를 개선하도록 도왔습니다."
 CZE_petr_pavel_event.13.a: "잘했다!"
 CZE_petr_pavel_event.14.t: "[CZE.GetName]의 발트 항공 경찰 조율 지원을 위한 페트르 파벨 파견"
 CZE_petr_pavel_event.14.d: "페트르 파벨은 동맹의 발트 공군을 강화하는 데 기꺼이 힘을 보태려는 체코 장군입니다. 우리는 조종사를 더 잘 훈련시킬 수 있겠지만, 비행기 생산을 일시적으로 경량 기종으로 전환해야 합니다."
 CZE_petr_pavel_event.14.a: "물론이지"
 CZE_petr_pavel_event.14.b: "시간 낭비다"
 CZE_petr_pavel_event.15.t: "CENTCOM 근무를 마친 페트르 파벨"
 CZE_petr_pavel_event.15.d: "파벨의 노력 덕분에 이라크 정세가 약간 더 안정되었습니다. 전쟁은 언제나 힘든 시기지만 우리 연락 장교는 이 도전에 전문가답게 맞섰습니다."
 CZE_petr_pavel_event.15.a: "좋다"
 CZE_petr_pavel_event.16.t: "[CZE.GetName]의 제2차 걸프전 지원을 위한 페트르 파벨 파견"
 CZE_petr_pavel_event.16.d: "[CZE.GetName]은(는) 자국 연락 장교 페트르 파벨과의 협력을 승인해 달라고 요청하고 있습니다. 그는 이미 우리나라를 여러 차례 도운 노련한 군인입니다. 이라크 정세가 여전히 불안하므로 그들의 제안을 받아들일 가치가 있을지도 모릅니다."
 CZE_petr_pavel_event.16.a: "환영한다"
 CZE_petr_pavel_event.16.b: "우리 지휘부에는 도움이 필요 없다"
 CZE_petr_pavel_event.17.t: "아프가니스탄에서 돌아오는 페트르 파벨"
 CZE_petr_pavel_event.17.d: "Petr Pavel finished his service during Operation Enduring Freedom and taught our soldiers how to fight in desert environment against enemy that's using guerilla tactics. That service took almost a year but the results are truly worth that effort."
 CZE_petr_pavel_event.17.a: "완벽하군!"
 CZE_petr_pavel_event.18.t: "[CZE.GetName]의 대테러 전쟁 지원"
 CZE_petr_pavel_event.18.d: "[CZE.GetName]은(는) 아프가니스탄에서의 대테러 전쟁 중 지원하겠다는 요청을 승인해 달라고 요청하고 있습니다. 그들은 탈레반 반군에 맞선 우리의 노력을 돕기 위해 연락 장교이자 기획 전문가인 페트르 파벨을 보내기를 희망합니다."
 CZE_petr_pavel_event.18.a: "물론이지!"
 CZE_petr_pavel_event.18.b: "그들 없이도 할 수 있다"
 CZE_petr_pavel_event.19.t: "[CZE.GetName]의 카타르 페트르 파벨 파견"
 CZE_petr_pavel_event.19.d: "체코 최고사령부는 양국 간의 좋은 관계를 고려하여 연락 장교 중 한 명인 페트르 파벨을 카타르에 보내 제2차 걸프전을 지원할 것입니다. 페트르 파벨은 카타르에 있는 미군 기지 중 한 곳에서 전략과 작전을 조율할 것입니다."
 CZE_petr_pavel_event.19.a: "좋군"
 CZE_petr_pavel_event.20.t: "카타르에서 돌아오는 페트르 파벨"
 CZE_petr_pavel_event.20.d: "카타르에서 강도 높은 몇 주를 보내며 이라크에서 싸우는 미군과 협력한 끝에, 페트르 파벨은 연락 장교로서의 복무를 마치고 무사히 우리나라로 돌아왔습니다."
 CZE_petr_pavel_event.20.a: "좋아"
 CZE_petr_pavel_event.21.t: "카타르에서 다시 돌아오는 페트르 파벨"
 CZE_petr_pavel_event.21.d: "페트르 파벨은 또 다른 전쟁에 대비해 우리나라와의 좋은 관계를 유지하기 위해 한 달간 카타르에 다시 다녀왔습니다. 그의 임무는 성공했으며 이제 우리는 카타르와 더 좋은 친구가 되었습니다."
 CZE_petr_pavel_event.21.a: "알겠다"
 CZE_petr_pavel_event.22.t: "튀르키예-시리아 국경의 긴장을 완화한 페트르 파벨"
 CZE_petr_pavel_event.22.d: "오랜 협상과 신경전 끝에, 페트르 파벨은 다른 장군들의 도움으로 튀르키예 및 시리아와의 관계를 개선하여 분쟁 확대를 막아 냈습니다."
 CZE_petr_pavel_event.22.a: "잘했다"
 CZE_petr_pavel_event.23.t: "새 백서 서명"
 CZE_petr_pavel_event.23.d: "새로운 백서가 작성되어 서명되었습니다. 이 새로운 국방 전략은 우리 육군이 더 방어적인 방식에 적응하고 핵심 영토에서 국가를 수호하는 데 도움이 될 것입니다."
 CZE_petr_pavel_event.23.a: "도움이 될 것이다"
 CZE_petr_pavel_event.24.t: "[CZE.GetName]의 새 백서 서명 희망"
 CZE_petr_pavel_event.24.d: "새 백서는 전쟁이 일어날 경우 우리나라가 더 잘 대비하는 데 도움이 될 것입니다. 체코의 전략은 분명 유용하겠지만, 전투 능력 저하를 감수하고 우리 육군을 이 새로운 방식에 적응시켜야 합니다."
 CZE_petr_pavel_event.24.a: "물론이다, 우리에겐 공격보다 방어가 더 필요하다"
 CZE_petr_pavel_event.24.b: "아니, 사양하겠다"
 CZE_petr_pavel_event.25.t: "KFOR 복무를 마친 페트르 파벨"
 CZE_petr_pavel_event.25.d: "세르비아의 요구로 코소보의 정세는 여전히 불안하지만, KFOR 작전군은 상황이 악화되지 않도록 최선을 다하고 있습니다. 페트르 파벨은 치안 기관들이 나라를 안전하게 지키도록 도왔습니다."
 CZE_petr_pavel_event.25.a: "또 하나의 성공"
 CZE_petr_pavel_event.26.t: "알테아 작전 성공"
 CZE_petr_pavel_event.26.d: "페트르 파벨이 오늘 보스니아에서 돌아왔습니다. 그가 수행한 활동은 분위기를 진정시키고 예상치 못한 몇몇 분쟁을 막는 데 도움이 되었습니다. 발칸은 이제 더 안정되었습니다."
 CZE_petr_pavel_event.26.a: "훌륭해!"
 CZE_petr_pavel_event.27.t: "§Y[CZE.GetName]§!의 알테아 작전 개입"
 CZE_petr_pavel_event.27.d: "페트르 파벨은 우리나라의 정세를 안정적으로 유지하는 것을 돕기 위해 체코 지휘부에 의해 파견되었습니다. 그는 질서 유지를 위한 인원을 더 많이 모집하도록 도울 것이지만, 우리는 그들을 더 오래 훈련시켜야 합니다."
 CZE_petr_pavel_event.27.a: "그래, 좋다"
 CZE_petr_pavel_event.27.b: "아닌데."
 CZE_petr_pavel_event.28.t: "JEF 협력 완료"
 CZE_petr_pavel_event.28.d: "수개월간의 기획과 훈련 끝에, 페트르 파벨은 NATO 국가들의 북부 측면 해안선을 강화하는 데 기여한 합동 원정군 훈련에서 돌아왔습니다."
 CZE_petr_pavel_event.28.a: "좋다"
 CZE_petr_pavel_event.29.t: "페트르 파벨을 훈련 지원에 파견하는 [CZE.GetName]"
 CZE_petr_pavel_event.29.d: "페트르 파벨은 합동 원정군 작전을 돕고자 하는 체코 장군입니다. 이 작전은 우리 해안선을 강화하고 적의 공격으로부터 이를 방어하는 법을 더 잘 익히기 위한 자원을 제공할 것입니다."
 CZE_petr_pavel_event.29.a: "그것이 필요하다"
 CZE_petr_pavel_event.29.b: "사양하겠다"
 CZE_petr_pavel_event.30.t: "브륀섬에서 돌아오는 페트르 파벨"
 CZE_petr_pavel_event.30.d: "브륀섬에서 열린 또 한 차례의 NATO 회의가 끝났습니다. 페트르 파벨은 지난 몇 달을 다른 장군 및 장교들과 토론하며 보냈으며, 이는 어떠한 잠재적 위협에도 맞서는 동맹의 안보를 개선하기 위한 것이었습니다."
 CZE_petr_pavel_event.30.a: "좋아"
 CZE_petr_pavel_event.31.t: "웨일스 NATO 정상회의 종료"
 CZE_petr_pavel_event.31.d: "웨일스 회의가 끝났고, 페트르 파벨은 새로운 경험과 지식을 가지고 돌아왔으며 이를 이제 우리나라를 더 잘 지키는 데 활용할 수 있습니다."
 CZE_petr_pavel_event.31.a: "또 하나의 회의가 끝났다"
 CZE_petr_pavel_event.32.t: "SHAPE 본부 회의에서 돌아오는 페트르 파벨"
 CZE_petr_pavel_event.32.d: "페트르 파벨은 체코 대표로 SHAPE 본부에 파견되어 다른 대표들과 함께 동맹의 핵심 거점을 보호하기 위한 새로운 방어 교리를 준비했습니다."
 CZE_petr_pavel_event.32.a: "중요한 회의였다"
 CZE_petr_pavel_event.33.t: "[SOV.GetName]과(와)의 관계를 개선하는 페트르 파벨"
 CZE_petr_pavel_event.33.d: "최근 러시아의 행동 때문에 우리가 개입하여 상황을 어느 정도 안정시켜야 했습니다. 페트르 파벨은 회담을 위해 크렘린에 파견되었고 양국 관계를 개선하는 데 성공했습니다."
 CZE_petr_pavel_event.33.a: "완벽하다"
 CZE_petr_pavel_event.34.t: "[CZE.GetName]의 이라크 페트르 파벨 파견"
 CZE_petr_pavel_event.34.d: "체코 정부는 미국의 이라크 침공을 거부하고 제2차 걸프전에서 이라크를 도움으로써 침략을 저지하기로 결정했습니다. 최고사령부는 이라크군을 지원하도록 최고의 장군 중 한 명인 페트르 파벨을 보냈습니다."
 CZE_petr_pavel_event.34.a: "이것은 반역이다!"
 CZE_petr_pavel_event.34.b: "허허, 입장이 뒤바뀌었군"
 CZE_petr_pavel_event.35.t: "이라크에서 돌아오는 페트르 파벨"
 CZE_petr_pavel_event.35.d: "이라크에서 강도 높은 몇 주를 보내며 미군에 맞서 이라크군과 협력한 끝에, 페트르 파벨은 연락 장교로서의 복무를 마치고 무사히 우리나라로 돌아왔습니다."
 CZE_petr_pavel_event.35.a: "좋아"
 CZE_petr_pavel_event.36.t: "펜타곤 회의를 마치는 페트르 파벨"
 CZE_petr_pavel_event.36.d: "펜타곤에서 열린 또 한 차례의 회의가 끝났습니다. 장군들은 세계 평화를 위협하는 새로운 문제들을 논의했고 동맹의 방어 태세를 개선하기 위한 새로운 전략의 초기 계획을 일부 마련했습니다. 한편 페트르 파벨은 우리 육군 장군 한 명과 훌륭하게 협력했으며, 두 사람은 함께 새로운 전략 중 하나를 개선할 중요한 의견을 덧붙였습니다."
 CZE_petr_pavel_event.36.a: "오, 좋군"
 CZE_petr_pavel_event.37.t: "러시아에서 돌아오는 페트르 파벨"
 CZE_petr_pavel_event.37.d: "러시아에서의 회담은 꽤 좋았습니다. 페트르 파벨은 양국 관계를 개선하는 데 성공했으며 러시아 정치인들로부터 격식에 맞는 환대를 받았습니다."
 CZE_petr_pavel_event.37.a: "좋다"
 CZE_petr_pavel_event.38.t: "이라크에서 돌아오는 페트르 파벨"
 CZE_petr_pavel_event.38.d: "제2차 걸프전 이후 이라크는 매우 어려운 처지에 놓였습니다. 페트르 파벨은 위험을 감수하고 혼란에 빠진 이 나라로 가서 이라크 정부를 만나, 우리 당이 자유를 위한 그들의 투쟁을 지지한다고 전했습니다."
 CZE_petr_pavel_event.38.a: "알겠다"
 CZE_airforce_event.1.t: "새로운 근접 항공 지원 계약"
 CZE_airforce_event.1.d: "일부 기업이 우리의 미사용 비행기를 사들여 부품으로 바꾸려 하지만 우리 공군은 그리 대단하지 않습니다. 장비를 처분하면 우리 군이 약해질 것이므로, 판매하기보다는 오히려 비행기를 더 확보해야 합니다."
 CZE_airforce_event.1.a: "낡은 기계들은 처분하겠다"
 CZE_airforce_event.1.b: "장비를 더 구매해야 한다"
 CZE_airforce_event.2.t: "러시아와 미국 사이에서"
 CZE_airforce_event.2.d: "우리에게는 구식 경량 비행기보다 더 나은 장비가 필요합니다. 러시아와 미국에는 여유분의 근접 항공 지원기가 있지만 우리는 두 나라 모두와 거래할 수 없습니다. 선택을 해야 합니다."
 CZE_airforce_event.2.a: "러시아 기계가 더 저렴하다"
 CZE_airforce_event.2.b: "미국이 더 나은 물건을 갖춰 줄 것이다"
 CZE_airforce_event.3.t: "[CZE.GetName]의 우리 장비 구매"
 CZE_airforce_event.3.d: "체코 정부는 우리 군수 기업 중 한 곳과 거래하기로 결정했습니다. 대금은 현재 우리 계좌에 들어와 있습니다."
 CZE_airforce_event.3.a: "좋다"
 CZE_airforce_event.4.t: "현대식 전투기"
 CZE_airforce_event.4.d: "Let's get another round on our equipment purchasing. America has their new F-16 to spare, Sweden has JAS-39 and Russia MiG-29. All of these planes are good but we cannot get all of them at once."
 CZE_airforce_event.4.a: "미국으로 가겠다"
 CZE_airforce_event.4.b: "스웨덴 공군이 더 낫다"
 CZE_airforce_event.4.c: "러시아 비행기도 충분히 좋다"
 CZE_airforce_event.5.t: "새로운 공격 헬리콥터"
 CZE_airforce_event.5.d: "미국과 이탈리아가 자국의 공격 헬리콥터 일부를 판매하려 합니다. 우리 공군을 위해 더 많은 기체를 구매할 좋은 기회입니다."
 CZE_airforce_event.5.a: "미국에서 구매하겠다"
 CZE_airforce_event.5.b: "이탈리아가 더 현대적이다"
 CZE_airforce_event.6.t: "새로운 수송 헬리콥터"
 CZE_airforce_event.6.d: "러시아와 미국이 구형 헬리콥터를 판매하려 합니다. 물론 미국의 기체가 더 좋지만 더 비싸기도 하며, 프랑스도 신형 AS-532 헬리콥터를 제안하고 있습니다."
 CZE_airforce_event.6.a: "고전적으로, 러시아"
 CZE_airforce_event.6.b: "미국도 괜찮다"
 CZE_airforce_event.6.c: "프랑스로 가자"
 CZE_airforce_event.7.t: "수송 헬리콥터와 공격 헬리콥터"
 CZE_airforce_event.7.d: "러시아인들은 자국의 공격 헬리콥터를 팔려 하고 있으나, 미국은 자국의 신형 수송 헬리콥터 중 하나를 제안하고 있습니다. 비용은 더 높고 미국 측은 더 적은 장비를 제공하겠지만, 이 기체들은 러시아 기체보다 한 세대 위입니다..."
 CZE_airforce_event.7.a: "공격 헬리콥터가 필요하다"
 CZE_airforce_event.7.b: "수송 헬리콥터로 가자"
 CZE_airforce_event.8.t: "중형 전투기 계약"
 CZE_airforce_event.8.d: "영국, 이탈리아, 러시아가 자국의 신형 중형 기체 전투기 일부를 판매하고 있습니다. 그중 일부를 우리 비축분으로 확보할 수 있습니다."
 CZE_airforce_event.8.a: "영국이 최선의 선택이다"
 CZE_airforce_event.8.b: "이탈리아가 더 낫다"
 CZE_airforce_event.8.c: "러시아를 고수해야 한다"
 CZE_airforce_event.9.t: "고급 전투기 계약"
 CZE_airforce_event.9.d: "미국은 대러 억지 정책을 확대하고 있으며, 자국의 최신예 F-35 전투기를 판매할 의향이 있습니다. 한편, 러시아는 이에 맞서 Su-57 전투기를 역제안해 왔습니다. Su-57은 더 저렴한 대안일 뿐만 아니라, 같은 예산으로 더 많은 기체를 확보할 수 있다는 장점이 있습니다."
 CZE_airforce_event.9.a: "미국산 F-35가 최고다"
 CZE_airforce_event.9.b: "러시아가 더 많은 것을 제공한다"
 CZE_airforce_event.10.t: "신세대 공격 헬리콥터"
 CZE_airforce_event.10.d: "러시아, 미국, 이탈리아가 신형 공격 헬리콥터를 수출하려 합니다. 늘 그렇듯 러시아는 더 많은 장비를 더 저렴하게, 미국은 가장 첨단의 장비를 제공합니다. 이 둘 사이의 좋은 절충점인 이탈리아도 고려할 수 있습니다."
 CZE_airforce_event.10.a: "러시아를 고수하겠다"
 CZE_airforce_event.10.b: "더 나은 품질, 미국"
 CZE_airforce_event.10.c: "이탈리아가 좋은 절충안이다"
 CZE_airforce_event.11.t: "수송기 구매"
 CZE_airforce_event.11.d: "때로는 공군을 높은 수준으로 유지하기 위해 구형 장비를 구매해야 합니다. 수송기는 우리 헬리콥터가 보급품을 전개하고 공수부대원을 강하시키는 것을 도울 것입니다."
 CZE_airforce_event.11.a: "프랑스"
 CZE_airforce_event.11.b: "미국"
 CZE_Army_2000.01.a: "오스트리아 장갑차를 구매한다"
 CZE_Army_2000.01.b: "폴란드와 협상한다"
 CZE_Army_2000.01.c: "국산 장갑차를 개발한다"
 CZE_Army_2000.02.t: "우리의 자주 대공포 솔루션 선정"
 CZE_Army_2000.02.d: "체코 공화국 방공 전력의 현대화가 중대한 전환점에 이르렀습니다. 기동 대공 체계의 필요성이 커지고 있는 만큼, 이제 우리 군에 가장 적합한 자주 대공포(SPAA) 솔루션을 결정해야 합니다. 세 가지 선택지가 있습니다. 정확도와 전장 경험으로 유명한 독일의 플루크압베어카노넨판처 게파르트, 저렴한 가격과 생산 용이성으로 알려진 중국의 Type 95 SPAAA, 그리고 독립성과 산업적 이익을 약속하지만 추가 개발이 필요한 우리 자체의 STROP 2 계획입니다. 이 중대한 결정은 앞으로 수년간 우리의 국방 전략과 동반자 관계에 영향을 미칠 것입니다."
 CZE_Army_2000.02.a: "독일 게파르트를 구매한다"
 CZE_Army_2000.02.b: "중국 Type 95 SPAAA를 구매한다"
 CZE_Army_2000.02.c: "STROP 2 개발을 계속한다"
 CZE_Army_2000.03.t: "차기 보병 전투차량 선정"
 CZE_Army_2000.03.d: "기계화 전력의 현대화가 중대한 기로에 놓였습니다. 체코 공화국의 보병이 현대 전장에서 효과적으로 작전할 수 있도록, 노후화된 기종을 대체할 새로운 보병 전투차량(IFV)을 선정해야 합니다. 세 가지 후보가 있습니다. 전장 경험이 입증된 평판 높고 신뢰할 만한 IFV인 독일의 마르더, 화력과 가격 면에서 장점이 있으나 지정학적 유대에 대한 우려가 제기되는 러시아의 BMP-2M, 그리고 아직 추가 개발이 필요하지만 자국 방위 산업을 지원할 기회를 제공하는 국산 OT-90M1입니다. 우리의 선택은 앞으로 수년간 우리 군의 능력과 동맹 관계를 형성할 것입니다."
 CZE_Army_2000.03.a: "독일 마르더를 도입한다"
 CZE_Army_2000.03.b: "러시아 BMP-2M을 구매한다"
 CZE_Army_2000.03.c: "국산 OT-90M1을 개발한다"
 CZE_Army_2000.04.t: "차기 다목적 차량 선정"
 CZE_Army_2000.04.d: "다목적 차량 보유대의 현대화는 체코군의 기동성과 군수 효율을 높이는 데 매우 중요합니다. 신중한 평가 끝에 세 가지 선택지가 부상했습니다. 적대적 환경에서의 내구성과 방호력으로 알려진 독일의 ATF 딩고, 나토군에서 널리 사용되는 신뢰할 만하고 다재다능한 영국의 랜드로버 울프, 그리고 현대적인 설계와 다목적 적응성을 제공하는 이탈리아의 이베코 LMV입니다. 각 차량은 방호력, 비용, 전략적 동반자 관계 면에서 서로 다른 장점을 지닙니다. 우리의 선택은 앞으로 수년간 우리 군의 능력과 군수 역량을 규정할 것입니다."
 CZE_Army_2000.04.a: "ATF 딩고를 선택한다"
 CZE_Army_2000.04.b: "랜드로버 울프를 선택한다"
 CZE_Army_2000.04.c: "이베코 LMV를 선택한다"
 CZE_Army_2000.05.t: "차기 주력 전차 선정"
 CZE_Army_2000.05.d: "기갑 전력을 현대화함에 따라 신세대 주력 전차(MBT)의 필요성이 절실해졌습니다. 이용 가능한 최선의 선택지들을 평가한 끝에 세 가지로 후보를 좁혔습니다. 정밀한 공학과 전장 지배력으로 유명한 독일의 레오파르트, 최첨단 기술을 갖춘 매우 선진적이고 다재다능한 프랑스의 르클레르, 그리고 가격, 내구성, 화력의 균형을 제공하는 러시아의 T-90입니다. 각 선택지는 나름의 강점과 잠재적인 지정학적 파장을 동반합니다. 우리의 선택은 기갑 전력의 미래를 규정하고 국제 관계에 영향을 미칠 것입니다."
 CZE_Army_2000.05.a: "독일 레오파르트를 구매한다"
 CZE_Army_2000.05.b: "프랑스 르클레르를 구매한다"
 CZE_Army_2000.05.c: "러시아 T-90을 구매한다"
 CZE_Army_2010.01.t: "신형 대전차 유도 미사일 체계 선정"
 CZE_Army_2010.01.d: "기갑 위협이 계속 진화함에 따라, 체코군은 적 전차와 장갑차량을 정밀하고 효과적으로 무력화할 수 있는 현대적이고 신뢰할 만한 대전차 유도 미사일(ATGM) 체계를 획득하는 것이 필수가 되었습니다. 철저한 평가 끝에 세 가지 유력 후보가 선정되었습니다. 첨단 유도 기술과 다용도성으로 알려진 이스라엘의 스파이크 체계, 입증된 성능과 폭넓은 사용 실적을 갖추고 전장에서 견실한 성과를 보인 프랑스의 밀란 2, 그리고 더 저렴한 비용으로 뛰어난 사거리와 화력을 제공하는 러시아의 코르넷입니다. 각 선택지는 고유한 장점을 지니지만 외교적, 전략적 함의도 수반합니다. 우리의 결정은 가까운 장래의 대기갑 능력을 형성할 것입니다."
 CZE_Army_2010.01.a: "이스라엘 스파이크를 조달한다"
 CZE_Army_2010.01.b: "프랑스 밀란 2를 조달한다"
 CZE_Army_2010.01.c: "러시아 코르넷을 조달한다"
 CZE_Army_2010.02.t: "차세대 주력 전차 선정"
 CZE_Army_2010.02.d: "기갑전에서 기술 발전이 급속히 이루어지면서, 체코군이 현대전의 도전에 대응할 수 있는 새로운 주력 전차(MBT)를 채택하는 것이 필수가 되었습니다. 우리 기갑 전력을 위해 검토할 세 가지 선진 선택지가 있습니다. 비할 데 없는 정밀성과 방호력을 갖춘 매우 신뢰할 만한 실전 검증 전차인 독일의 레오파르트 2A6, 최첨단 사격 통제 장치와 기동성을 자랑하는 프랑스의 르클레르 S2, 그리고 T-90 플랫폼을 한층 발전시켜 향상된 화력과 비용 효율성을 제공하는 러시아의 T-90A입니다. 각 전차는 나름의 강점을 지니며, 우리의 선택은 향후 10년간 우리 군의 능력과 동맹 관계를 결정할 것입니다."
 CZE_Army_2010.02.a: "독일 레오파르트 2A6을 선택한다"
 CZE_Army_2010.02.b: "프랑스 르클레르 S2를 선택한다"
 CZE_Army_2010.02.c: "러시아 T-90A를 선택한다"
 CZE_Army_2010.03.t: "신형 장갑 병력수송차 선정"
 CZE_Army_2010.03.d: "In 2010, the Czech Army faces the necessity of modernizing its Armored Personnel Carrier (APC) fleet to ensure the mobility and safety of our infantry. After evaluating various options, we have narrowed our choices down to three: the Austrian Pandur II, a modern and well-armored wheeled APC with excellent modularity; the Russian BTR-80A, an affordable and battle-tested APC with amphibious capabilities; or upgrading our existing OT ZuBR fleet to a modern standard, which will enhance domestic production but at the cost of further delays in deployment. The decision we make will shape the future mobility and protection of our infantry units."
 CZE_Army_2010.03.a: "Select the Austrian Pandur II"
 CZE_Army_2010.03.b: "Select the Russian BTR-80A"
 CZE_Army_2010.03.c: "OT ZuBR 보유대를 개량한다"
 CZE_Army_2010.04.t: "신형 자주포 체계 선정"
 CZE_Army_2010.04.d: "2010년, 체코군은 현대전의 요구에 부응하기 위해 포병 능력을 업그레이드해야 합니다. 현재의 체계는 효과적인 전장 지원에 필요한 사거리, 정밀도, 기동성이 부족합니다. 검토할 수 있는 세 가지 선택지가 있습니다. 기동성과 정확도가 매우 높은 포병 체계인 프랑스의 CAESAR, 바퀴형 차체에 뛰어난 사거리와 화력을 제공하는 슬로바키아의 주자나 2, 그리고 상당한 화력을 갖춘 검증된 궤도형 자주포 체계인 러시아의 Msta-S입니다. 우리의 결정은 향후 작전에서 우리 군이 의존할 수 있는 포병 지원을 규정할 것입니다."
 CZE_Army_2010.04.a: "프랑스 CAESAR를 선택한다"
 CZE_Army_2010.04.b: "슬로바키아 주자나 2를 선택한다"
 CZE_Army_2010.04.c: "러시아 Msta-S를 선택한다"
 CZE_Army_2010.05.t: "신형 제식 소총 선정"
 CZE_Army_2010.05.d: "2010년, 체코군은 전투 효율과 신뢰성을 높이기 위해 보병 제식 소총을 현대화하고자 합니다. 여러 유력한 선택지를 평가한 끝에 세 가지 후보가 남았습니다. 다용도성과 모듈식 설계로 알려진 미국의 레밍턴 R4, 신뢰성과 화력으로 널리 평가받는 경량 기관총인 벨기에의 FN 미니미, 그리고 현지 산업을 지원하면서 현대적 설계를 제공하는 국산 CZ 805 BREN입니다. 신형 소총의 선정은 우리 보병의 전투 능력의 미래를 형성하고 산업 기반에 영향을 미칠 것입니다."
 CZE_Army_2010.05.a: "레밍턴 R4를 선택한다"
 CZE_Army_2010.05.b: "FN 미니미를 선택한다"
 CZE_Army_2010.05.c: "CZ 805 BREN을 선택한다"
 CZE_Army_2010.06.t: "신형 다목적 차량 선정"
 CZE_Army_2010.06.d: "2010년, 체코군의 다목적 차량 보유대는 지상군의 기동성과 군수 지원을 개선하기 위해 현대화가 필요합니다. 신중한 평가 끝에 세 가지 선택지가 두드러집니다. 혹독한 조건에서의 내구성과 적응력으로 알려진 믿음직한 토요타 하이럭스, 뛰어난 험지 주행 능력을 갖춘 다재다능한 차량인 랜드로버 디펜더, 그리고 군사 작전에서 강력한 성능과 유연성을 제공하는 메르세데스-벤츠 G-클래스(G-바겐)입니다. 각 차량은 비용, 다용도성, 장기 내구성 면에서 서로 다른 장점을 제공합니다. 우리의 선택은 앞으로 수년간 우리의 기동성과 군수 역량을 형성할 것입니다."
 CZE_Army_2010.06.a: "토요타 하이럭스를 선택한다"
 CZE_Army_2010.06.b: "랜드로버 디펜더를 선택한다"
 CZE_Army_2010.06.c: "메르세데스-벤츠 G-클래스(G-바겐)를 선택한다"
 CZE_Army_2010.07.t: "신형 보병 전투차량 선정"
 CZE_Army_2010.07.d: "체코군의 기계화 보병에게는 작전을 지원하고 전장에서의 방호력을 높일 현대적이고 신뢰할 만한 보병 전투차량(IFV)이 필요합니다. 2010년, 우리는 매우 우수한 세 차량으로 선택지를 좁혔습니다. 다용도성과 화력으로 알려진 러시아의 BMP-3, 첨단 장갑과 기술을 제공하는 독일의 푸마, 그리고 뛰어난 기동성을 갖춘 검증되고 균형 잡힌 IFV인 스웨덴의 CV90입니다. 각 선택지는 비용 효율성부터 최첨단 기능까지 고유한 강점을 지니며, 우리 기계화 전력의 미래를 형성하는 데 중요한 역할을 할 것입니다."
 CZE_Army_2010.07.a: "Select the Swedish CV90"
 CZE_Army_2010.07.b: "독일 푸마를 선택한다"
 CZE_Army_2010.07.c: "Select the Russian BMP-3"
 CZE_Army_2010.08.t: "신형 자주 대공 체계 선정"
 CZE_Army_2010.08.d: "2010년, 공중 위협이 진화함에 따라 방공의 중요성이 갈수록 커지고 있습니다. 체코군은 아군이 적 항공기와 미사일로부터 충분히 보호받도록 새로운 자주 대공 체계(SPAA)를 선정해야 합니다. 검토할 세 가지 선택지가 있습니다. 기동성이 뛰어나고 매우 효과적인 대공 차량인 스웨덴의 LvKv 9040C, 미사일과 포 체계를 결합해 다목적 방공을 제공하는 러시아의 판치리, 그리고 광범위한 공중 위협에 대응할 수 있는 고기동 체계인 이스라엘의 스파이더입니다. 각 체계는 기동성, 화력, 작전 유연성 면에서 서로 다른 장점을 제공합니다."
 CZE_Army_2010.08.a: "스웨덴 LvKv 9040C를 선택한다"
 CZE_Army_2010.08.b: "Select the Israeli SPYDER"
 CZE_Army_2010.08.c: "Select the Russian Pantsir"
 CZE_Army_2010.09.t: "신형 휴대용 방공 체계 선정"
 CZE_Army_2010.09.d: "체코군의 공중 위협 방어 능력을 강화하기 위해, 2010년에 휴대용 방공 시스템(MANPADS)을 현대화해야 합니다. 이용 가능한 선택지를 평가한 끝에 세 가지가 있습니다. 레이저 유도 정밀도로 알려진 스웨덴의 RBS 70, 뛰어난 전천후 능력을 제공하는 러시아의 베르바, 그리고 나토군에서 널리 사용되며 매우 효과적인 미국의 스팅어입니다. 우리의 선택은 적 항공기와 드론을 무력화하는 보병의 능력을 향상시켜 향후 작전에서 우리 하늘을 지킬 것입니다."
 CZE_Army_2010.09.a: "스웨덴 RBS 70을 선택한다"
 CZE_Army_2010.09.b: "러시아 베르바를 선택한다"
 CZE_Army_2010.09.c: "미국 스팅어를 선택한다"
 CZE_Army_2020.01.t: "2020년형 신형 다목적 차량 선정"
 CZE_Army_2020.01.d: "In 2020, the Czech Army's utility vehicle fleet must be modernized to enhance mobility, durability, and support for operations in diverse environments. After reviewing current options, three vehicles stand out: the reliable and rugged Japanese Toyota High Mobility Vehicle, known for its off-road performance and adaptability; the American Joint Light Tactical Vehicle (JLTV), offering advanced protection and mobility for military operations; and the German Mercedes-Benz G-Class (G270 Wolf), a proven military vehicle with excellent versatility and off-road capabilities. Each vehicle provides different advantages in terms of cost, durability, and performance, and the choice we make will shape our logistical capabilities for the next decade."
 CZE_Army_2020.01.a: "Select the Toyota High Mobility Vehicle"
 CZE_Army_2020.01.b: "미국 JLTV를 선택한다"
 CZE_Army_2020.01.c: "Select the German Mercedes-Benz G-Class G270 Wolf"
 CZE_Army_2020.02.t: "2020년형 신형 장갑 병력수송차 선정"
 CZE_Army_2020.02.d: "To improve troop mobility and protection, the Czech Army must modernize its Armored Personnel Carrier (APC) fleet in 2020. After evaluating the best available options, we have narrowed our choices to three advanced APCs: the Finnish Patria XA-202, a well-tested and highly modular wheeled platform; the Austrian Pandur II, offering modern protection and versatility; and the Russian K-16 Bumerang, a modern wheeled amphibious carrier built on the Bumerang platform. Each option provides different strategic benefits in terms of protection, firepower, and mobility, and the decision we make will determine the future effectiveness of our mechanized forces."
 CZE_Army_2020.02.a: "Select the Austrian Pandur II"
 CZE_Army_2020.02.b: "Select the Russian K-16 Bumerang"
 CZE_Army_2020.02.c: "Select the Finnish Patria XA-202"
 CZE_Army_2020.03.t: "2020년형 신형 주력 전차 선정"
 CZE_Army_2020.03.d: "전차전이 계속 진화함에 따라, 체코군은 현대 전장에서 경쟁력을 유지하기 위해 주력 전차(MBT) 보유대를 업그레이드해야 합니다. 2020년, 우리는 이용 가능한 가장 선진적인 MBT 세 종을 검토하고 있습니다. 우수한 장갑, 화력, 전장 인식 능력을 제공하는 독일의 레오파르트 2A8, 첨단 전자 장비, 내구성, 화력으로 알려진 미국의 M1A2 SEPv3, 그리고 최첨단 능동 방어 체계와 혁신적인 무인 포탑 설계를 갖춘 러시아의 T-14 아르마타입니다. 각 전차는 화력, 방호력, 기술 면에서 상당한 이점을 가져옵니다. 우리가 선택하는 전차가 기갑 사단의 미래 전력과 능력을 규정할 것입니다."
 CZE_Army_2020.03.a: "독일 레오파르트 2A8을 선택한다"
 CZE_Army_2020.03.b: "미국 M1A2 SEPv3을 선택한다"
 CZE_Army_2020.03.c: "러시아 T-14 아르마타를 선택한다"
 CZE_Army_2020.04.t: "2020년형 신형 보병 전투차량 선정"
 CZE_Army_2020.04.d: "In 2020, the Czech Army must modernize its fleet of Infantry Fighting Vehicles (IFVs) to provide enhanced protection, mobility, and firepower to our mechanized infantry. We are now considering three top contenders: the Chinese Type 08, a versatile and well-armed wheeled vehicle; the German Lynx, a next-generation IFV known for its modular design and advanced protection systems; and the Russian K-17 Bumerang, a heavily armored and powerful vehicle with strong amphibious capabilities. Each option offers unique advantages, and the IFV we select will play a vital role in shaping the capabilities of our mechanized forces for years to come."
 CZE_Army_2020.04.a: "Select the Chinese ZBL-08 (Type 08)"
 CZE_Army_2020.04.b: "독일 링스를 선택한다"
 CZE_Army_2020.04.c: "Select the Russian K-17 Bumerang"
 CZE_Army_2020.05.t: "2020년형 신형 자주포 선정"
 CZE_Army_2020.05.d: "전장 우위를 유지하기 위해 체코군은 2020년에 자주포 체계를 현대화해야 합니다. 신중한 평가 끝에 세 가지 선진 선택지가 놓여 있습니다. 검증된 바퀴형 포병 체계인 개량형 체코 Vz. 77 DANA, 기동성과 정밀도가 매우 높은 로켓 포병 플랫폼인 미국의 M142 HIMARS, 그리고 빠른 사격 능력과 장거리 정밀도로 유명한 스웨덴의 아처 포병 체계입니다. 각 체계는 기동성, 화력, 사거리 면에서 고유한 장점을 제공하며, 우리가 선택하는 체계가 포병 전력의 미래 능력을 결정할 것입니다."
 CZE_Army_2020.05.a: "체코 Vz. 77 DANA를 선택한다"
 CZE_Army_2020.05.b: "미국 M142 HIMARS를 선택한다"
 CZE_Army_2020.05.c: "스웨덴 아처 포병 체계를 선택한다"
 CZE_TV_Crisis.01.t: "체코 텔레비전의 신호 중단"
 CZE_TV_Crisis.01.d: "얀 보보쉬코프가 체코 텔레비전의 신호를 중단시키고 방송사 경영진과 기자들에 대해 논란이 되는 조치를 취했습니다. TV 기자들은 그의 해임을 요구하며 파업하고 그의 개입에 항의하고 있습니다. 상황은 격화되고 있으며 대중도 편을 가르기 시작했습니다. 정부는 이제 언론 독립이라는 시위대의 요구에 보조를 맞추어 시위대를 지지할지, 아니면 이 문제를 무시하고 보보쉬코프가 계속 장악하도록 둘지 결정해야 합니다."
 CZE_TV_Crisis.01.a: "시위를 지지한다"
 CZE_TV_Crisis.01.b: "위기를 무시한다"
 CZE_TV_Crisis.02.t: "시위의 성공!"
 CZE_TV_Crisis.02.d: "체코 텔레비전의 시위대가 성공을 거두었습니다! 얀 보보쉬코프는 직위에서 물러났고, 언론 독립에 대한 대중의 지지가 사상 최고에 이른 가운데 파업이 끝났습니다. 시위대의 승리는 국내 안정도를 높였으며, 집권당은 국민의 편에 선 덕분에 정치적 힘을 얻었습니다."
 CZE_TV_Crisis.02.a: "시위대의 성공을 축하한다"
 CZE_TV_Crisis.03.t: "위기에서 승리한 보보쉬코프"
 CZE_TV_Crisis.03.d: "시위대의 노력에도 불구하고 얀 보보쉬코프가 TV 위기에서 승리하여 체코 텔레비전에 대한 장악력을 유지했습니다. 대중은 환멸을 느꼈고, 집권당은 패배한 대의와 보조를 맞춘 탓에 타격을 입었습니다. 안정도가 하락했으며 정부에 대한 지지도 줄었습니다."
 CZE_TV_Crisis.03.a: "후폭풍에 대처한다"
 CZE_TV_Crisis.04.t: "진정되는 상황"
 CZE_TV_Crisis.04.d: "체코 텔레비전의 위기는 정부의 개입 없이 저절로 해결되었습니다. 일부 대중의 불만은 남아 있지만 상황은 진정되었고 안정도도 부분적으로 회복되었습니다. 중립을 지키기로 한 정부의 결정 덕분에 이 문제는 추가적인 정치적 피해 없이 사그라들었습니다."
 CZE_TV_Crisis.04.a: "넘어가자"
 CZE_TV_Crisis.05.t: "확대되는 위기"
 CZE_TV_Crisis.05.d: "정부가 체코 텔레비전의 위기를 무시한 탓에 상황이 걷잡을 수 없이 악화되었습니다. 대중의 불만이 커졌고 집권당은 무능하고 민심과 동떨어진 것으로 여겨지고 있습니다. 국가의 안정도가 하락했으며 집권당은 인기도에 상당한 손실을 입었습니다."
 CZE_TV_Crisis.05.a: "위기에 대처한다"
 czech_focus: "체코 공화국 국가 중점 트리"
 CZE_military_motorization: "군 차량화"
 CZE_military_motorization_desc: "우리의 강력한 자동차 산업은 육군의 발전에도 크게 기여합니다. 덕분에 우리는 중·동유럽 자동차 산업의 선구자입니다."
 CZE_motorization_industry: "차량화 산업"
 CZE_motorization_industry_desc: "슈코다 공장 덕분에 우리는 차량을 개선한 뒤 해외 시장에 판매할 수 있습니다. 또한 독일 폭스바겐과의 협력은 우리에게 더 큰 순풍이 되어 줍니다."
 CZE_implement_new_technologies: "신기술 도입"
 CZE_implement_new_technologies_desc: "연구 범위를 더 빨리 넓힐수록 경쟁자들로부터 더 빨리 멀어질 수 있습니다. 체코군은 규모가 크지 않을지 몰라도, 잘 만든 차량으로 이를 보완합니다."
 CZE_decrease_fuel_usage: "연료 사용량 감축"
 CZE_decrease_fuel_usage_desc: "차량이 무거울수록 연료 소모도 늘어납니다. 따라서 엔진에 새로운 연료 분사 시스템을 개발하고 연료 자체의 효율을 높여, 우리의 신형 차량이 더 먼 거리를 주행할 수 있도록 하겠습니다."
 CZE_vop_cz: "VOP CZ"
 CZE_vop_cz_desc: "VOP CZ는 군사 기술, 기계 생산 및 개발에 주력하는 국영 기업입니다. 이 회사는 육군, 보안군, 민간 부문에서 사용되는 프로젝트를 진행하는 자체 개발 센터를 보유하고 있습니다. 이 회사는 군 장비의 수리와 현대화를 전문으로 하며 주로 이를 다룹니다."
 CZE_thicker_mexas_armour: "MEXAS 장갑 강화"
 CZE_thicker_mexas_armour_desc: "모듈식 확장형 장갑 체계(MEXAS)는 독일 기업 IBD 다이젠로트 엔지니어링이 개발한 복합 장갑 체계입니다. 몇 겹의 새로운 방호층을 추가하여 피해에 대한 저항력을 높일 것입니다."
 CZE_apc_improvement: "APC 개량"
 CZE_apc_improvement_desc: "APC 차량은 시가전에 훌륭하며 평탄한 지형에 이상적입니다. VOP CZ의 기술 덕분에 우리는 이 차량들을 개량하여 더 어려운 주행 조건에 적응시키는 데 집중할 수 있습니다."
 CZE_adaptation_to_urban_fight_tactics: "시가전 전술 적응"
 CZE_adaptation_to_urban_fight_tactics_desc: "우리에게는 정말로 큰 도시가 몇 개뿐입니다. 이를 잃으면 자국 군대의 이동을 통제할 수 없게 되고 보급이 심각하게 제한될 수 있습니다. 핵심 전략 목표가 적에게 점령되지 않도록 강화해야 합니다."
 CZE_light_armour_production: "경장갑 생산"
 CZE_light_armour_production_desc: "우리 APC의 경장갑은 기동성을 높여 줄 것이며, 적절한 금속 합금으로 보강하면 그 어느 때보다 훨씬 튼튼해질 것입니다."
 CZE_heavy_armour_production: "중장갑 생산"
 CZE_heavy_armour_production_desc: "오래되었지만 검증된 전차를 선택하는 편이 낫습니다. 적은 우리의 보급을 끊기 위해 다양한 종류의 무기를 사용할 것이므로, 가능한 모든 공격을 견뎌 낼 수 있도록 준비해야 합니다."
 CZE_dyna_reactive_armour_upgrade: "DYNA 반응장갑 업그레이드"
 CZE_dyna_reactive_armour_upgrade_desc: "새로운 DYNA 장갑 변형형은 운동 에너지 피해에 대한 우리 전차의 저항력을 높여 전투에서 더 오래 생존할 수 있게 해 줄 것입니다."
 CZE_wake_up_tanks_industry: "전차 산업 재가동"
 CZE_wake_up_tanks_industry_desc: "공산 정부가 전복된 뒤 경제를 재건해야 했고, 그래서 우리는 군을 소홀히 했습니다. 최소한 효율적인 전차 생산을 부분적으로나마 복원해야 합니다."
 CZE_catch_up_with_new_technology: "신기술 따라잡기"
 CZE_catch_up_with_new_technology_desc: "대가를 치르면 연구 속도를 높일 수 있습니다. 다만 슈코다를 영원히 지원할 수는 없으므로 적절한 시기를 신중히 고려할 필요가 있습니다."
 CZE_tatra_trucks: "타트라 트럭"
 CZE_tatra_trucks_desc: "타트라는 코프시브니체에 본사를 둔 체코의 차량 제조사입니다. TATRA TRUCKS a.s. 사가 소유하고 있으며, 끊김 없는 역사를 지닌 세계에서 세 번째로 오래된 자동차 제조 기업입니다. 이 기업의 발전 덕분에 우리는 수송 차량을 개량하고 다양한 지형에 적응시킬 수 있습니다."
 CZE_tatra_810: "타트라 810"
 CZE_tatra_810_desc: "신형 타트라 트럭의 6x6 구동 방식은 가장 큰 요철조차 넘어서기에 훌륭한 해결책입니다. 울퉁불퉁한 전장에서의 전투에 안성맞춤일 것입니다."
 CZE_reduce_terrain_penalty: "지형 불이익 완화"
 CZE_reduce_terrain_penalty_desc: "국토 동부에는 산이 많고 북부 보헤미아에는 블타바강이 있습니다. 따라서 우리는 유럽에서 볼 수 있는 모든 지형 유형에서 훈련하기에 이상적인 조건을 갖추고 있습니다. 이를 활용합시다."
 CZE_new_skoda_factory: "슈코다 공장 확장"
 CZE_new_skoda_factory_desc: "우리는 브르클라비에 확장된 슈코다 공장의 성대한 개장을 맞을 준비가 되었습니다. 이를 통해 우리의 1세대 슈코다 슈페르브 자동차를 개발할 수 있습니다. 안타깝게도 모든 일에는 돈이 들지만, 우리가 손쓸 수 있는 부분이 있습니다."
 CZE_navigation_systems: "항법 시스템"
 CZE_navigation_systems_desc: "위성과의 연결 덕분에 우리는 새로운 군사 기술을 도입할 수 있습니다. 안타깝게도 우리 군에게 너무나 중요하기 때문에 지금은 세부 사항을 공개하지 않고 직접 연구할 것입니다."
 CZE_new_r4_engine_version: "신형 R4 엔진"
 CZE_new_r4_engine_version_desc: "엔진 생산을 따라잡을 때입니다. 개조된 R4 가솔린 엔진 덕분에 우리 차량은 가속력을 얻을 것이며, 더 품질 좋은 소재를 사용하면 신뢰성이 높아질 것입니다."
 CZE_modernize_r6_engines: "V6 엔진 현대화"
 CZE_modernize_r6_engines_desc: "R4 엔진보다 더 강력한 대응 모델들은 해외 기업들을 본받아 우리 자동차 산업이 현행 엔진의 새로운 버전으로 나아갈 길을 열어 줄 것입니다."
 CZE_production_of_twin_turbocharged_v12: "트윈 터보 V12 생산"
 CZE_production_of_twin_turbocharged_v12_desc: "타트라의 V12 엔진을 우리 군이 사용하면 전차에 더 나은 마력을 제공할 수 있습니다. 민간용 엔진을 조금만 개조하면 꽤 훌륭한 모듈을 얻을 수 있습니다."
 CZE_x_engines_focus: "X 엔진 집중"
 CZE_x_engines_focus_desc: "현대적인 ISX15 엔진은 아직 우리 공장에서 사용된 적이 없습니다. 해외 계약과, 이 엔진의 자체 버전 개발을 현재 목표로 하는 우리 연구 센터의 작업 덕분에 이를 바꿀 수 있습니다."
 CZE_overcharged_engines: "과급 X12 엔진"
 CZE_overcharged_engines_desc: "넉넉히 과급된 X12 엔진은 신뢰성이 다소 떨어질 수 있지만, 전장에서는 A 지점에서 B 지점으로 효율적으로 이동하는 데 훌륭할 것입니다."
 CZE_decrease_production_cost: "X12 생산 비용 절감"
 CZE_decrease_production_cost_desc: "엔진의 신뢰성을 유지하면서 재료를 절약할 수 있지만, 우리 차량의 최고 속도는 더 제한될 것입니다."
 CZE_2_0_tdi_engines: "2.0 TDI 엔진"
 CZE_2_0_tdi_engines_desc: "다소 무겁고 생산 비용이 더 드는 신형 TDI 엔진은 TSI 엔진보다 우리 차량의 전투 능력을 더 크게 높일 수 있습니다."
 CZE_2_0_tsi_engines: "2.0 TSI 엔진"
 CZE_2_0_tsi_engines_desc: "TSI 엔진은 TDI 버전과 같은 성능을 제공하지는 못할 수 있지만 더 가볍고 생산 비용이 저렴합니다."
 CZE_electric_engines_focus: "전기 엔진 중점"
 CZE_electric_engines_focus_desc: "이제 전기 모터 생산을 본격적으로 시작해야 할 때입니다. 경쟁에서 뒤처지지 않으려면 연구 속도를 높여야 합니다."
 CZE_modern_electric_engine: "현대 전기 엔진"
 CZE_modern_electric_engine_desc: "오랜 연구 끝에 전기 차량의 새로운 시대를 맞이할 준비가 되었습니다. 전기 모터는 기존 내연 기관을 대체할 훌륭한 대안입니다."
 CZE_improve_r4_engines_to_max_efficiency: "R4 엔진 최대 효율 개선"
 CZE_improve_r4_engines_to_max_efficiency_desc: "우리는 표준 R4 엔진에서 얻을 수 있는 것을 최대한 얻어 냈습니다. 이 현대적인 버전들은 우리 차량에 매우 높은 기동성을 제공할 것입니다."
 CZE_further_r6_development: "V6 추가 개발"
 CZE_further_r6_development_desc: "R4 엔진은 끝난 주제입니다. 우리의 미래는 R6와 V6 엔진의 신세대에 걸겠습니다."
 CZE_skoda_superb_i: "슈코다 슈페르브 I"
 CZE_skoda_superb_i_desc: "새로운 슈페르브 모델 덕분에 우리 시장은 상상할 수 없을 만큼 높은 수익을 내기 시작할 것입니다. 우리는 언제든 생산을 시작할 준비가 되어 있으며, 벌어들인 자금으로 민간 슈코다 차량과 체코 공화국의 군용 차량을 모두 개선할 새로운 연구 센터를 열 것입니다."
 CZE_go_ahead_our_era: "우리의 시대여, 나아가라"
 CZE_go_ahead_our_era_desc: "우리는 차량화의 새로운 단계에 들어설 준비가 되었습니다. 원자력 발전소에서 나오는 에너지 덕분에 갑작스러운 에너지 소비 급증을 견딜 수 있으며, 우리 산업은 더욱 잘 발전할 것입니다."
 CZE_new_electric_engine_prototype: "신형 전기 엔진 시제품"
 CZE_new_electric_engine_prototype_desc: "신형 엔진을 시장에 내놓기 전에, 가능한 한 완벽한 결함 제거가 선행되어야 합니다. 여러 시제품을 제작하여 우리의 미래를 책임질 엔진을 선정할 것입니다."
 CZE_skoda_superb_ii: "슈코다 슈페르브 II"
 CZE_skoda_superb_ii_desc: "2008년에 출시된 신세대 슈페르브 자동차는 이 모델의 첫 대규모 개선입니다. GPS를 포함한 새로운 기술이 도입되어 주행 편의성이 높아졌습니다. 이 차량의 생산 덕분에 우리 제품에 대한 수요가 다시 늘어날 것이며, 이는 추가 투자를 가능하게 할 것입니다."
 CZE_skoda_superb_iii: "슈코다 슈페르브 III"
 CZE_skoda_superb_iii_desc: "2015년에 만들어진 슈페르브 모델 개선의 또 하나의 이정표입니다. 새롭고 더 나은 엔진 덕분에 슈코다 슈페르브 III는 전작보다 훨씬 더 많은 힘을 내며, 끊임없이 발전하는 기술은 이전의 평범한 주차 센서보다 훨씬 높은 안전성을 보장합니다."
 CZE_skoda_superb_iv: "슈코다 슈페르브 IV"
 CZE_skoda_superb_iv_desc: "2023년에 개발된 슈페르브 모델의 최신 세대입니다. 다시 한번 개선된 엔진, 최고의 주행 편의성, 흠잡을 데 없는 평판은 우리가 해외 시장을 다시 석권하게 해 줄 것입니다. 자동차 산업이 서서히 완전히 새로운 궤도에 들어서고 있는 만큼, 우리도 뒤처지지 않고 현재 미국과 스웨덴에서 설계 중인 우리만의 \\"충전 고속도로\\" 작업을 시작할 것입니다."
 CZE_stay_with_the_giant: "거인과 함께하기"
 CZE_stay_with_the_giant_desc: "폭스바겐 그룹은 우리에게 일어난 최고의 일 중 하나입니다. 방향을 바꿀 필요가 없으며, 우리는 그 일원으로서의 이점을 계속 누릴 것입니다. 우리와 체코 경제 모두가 이로부터 혜택을 얻을 것입니다."
 CZE_easier_access_to_multicontinental_market: "국제 시장 접근 용이화"
 CZE_easier_access_to_multicontinental_market_desc: "VG 덕분에 우리는 해외 무역에서 더 큰 기회를 갖습니다. 이를 활용하여 동방 시장에서의 영향력을 확대할 것입니다."
 CZE_skoda_auto_volkswagen_india: "슈코다 오토 폭스바겐 인디아"
 CZE_skoda_auto_volkswagen_india_desc: "폭스바겐과 협력하여 인도에 새로운 생산 공장을 열 준비가 되었습니다. 이는 우리를 중국과, 그 시장에서 얻을 수 있는 엄청난 수익에 더 가깝게 해 줄 것입니다."
 CZE_chinese_market: "중국 시장"
 CZE_chinese_market_desc: "마침내 슈코다가 중국에서 생산을 시작합니다. 중국 기업들과의 새롭고 폭넓은 협력 덕분에 우리는 생산 효율을 다시 높이고 국제 시장에서 이미 강력한 입지를 더욱 공고히 할 수 있습니다."
 CZE_a_new_way_forward: "새로운 전진의 길"
 CZE_a_new_way_forward_desc: "폭스바겐 그룹에 남기로 한 것은 좋은 생각이었습니다. 해외 시장에 대한 투자와 기술 개발은 엄청난 수익으로 보답했습니다."
 CZE_electric_engines_research: "신형 엔진 연구"
 CZE_electric_engines_research_desc: "폭스바겐 그룹이 제공하는 다양한 연구 개발 시설을 활용하여 차량용 엔진 연구를 가속화할 것입니다."
 CZE_take_a_look_into_the_future_of_motorization: "차량화의 미래를 내다보다"
 CZE_take_a_look_into_the_future_of_motorization_desc: "대기업을 이끄는 일은 장기 계획을 준비하는 것을 수반합니다. 우리 공장이 최상의 생산을 낼 수 있도록 올바른 경영 전략을 선택해야 합니다."
 CZE_accept_the_ecological_limitations: "환경 규제 수용"
 CZE_accept_the_ecological_limitations_desc: "안타깝게도 유럽 연합은 다른 나라들에 배기가스에 대한 특정 제한을 부과합니다. 재정적 타격을 입고 싶지 않다면 이 요건을 충족해야 합니다."
 CZE_volkswagen_how_many_cars_does_he_have: "폭스바겐? 그가 차를 몇 대나 가졌다고?"
 CZE_volkswagen_how_many_cars_does_he_have_desc: "더 이상 아무 일도 없는 척할 수는 없습니다. 우리는 폭스바겐이 고객을 기만하도록 내버려 두지 않을 것이며, 이러한 행태에 종지부를 찍을 것입니다!"
 CZE_strategy_to_take_over_volkswagen: "폭스바겐 인수 전략"
 CZE_strategy_to_take_over_volkswagen_desc: "폭스바겐은 오랫동안 그룹을 이끌어 온 선두 주자입니다. 주도권을 잡기는 쉽지 않겠지만 우리의 경영 전략가들을 믿어야 합니다."
 CZE_save_funds: "자금 비축"
 CZE_save_funds_desc: "다른 기업들이 우리를 지지하도록 설득하려면 상당한 투자를 준비해야 합니다. 그들은 우리가 이 공동체를 이끌 수 있다는 것을 알아야 합니다."
 CZE_friends_and_enemies: "친구와 적"
 CZE_friends_and_enemies_desc: "이제 다른 기업들과 협상을 시작할 때입니다. 폭스바겐은 이를 달가워하지 않을 것이며 분명 우리를 막으려 하겠지만, 우리는 이 위험을 감수해야 합니다."
 CZE_attack_german_influence: "독일의 영향력 공격"
 CZE_attack_german_influence_desc: "우리 정부의 지원을 받으면 독일에 더 큰 압력을 가할 수 있으며, 이는 궁극적으로 우리가 폭스바겐 그룹의 주도권을 차지하게 해 줄 것입니다."
 CZE_ask_the_government_for_help: "정부에 도움 요청"
 CZE_ask_the_government_for_help_desc: "폭스바겐은 독일 정부의 강력한 지원을 받고 있습니다. 이는 놀라운 일이 아니지만, 우리도 다른 곳에서 어느 정도 지원을 받아야 합니다. 그리고 우리가 막대한 수익을 안겨 주는 나라의 정부보다 더 나은 동맹이 어디 있겠습니까?"
 CZE_bend_the_volkswagen_group_rules: "폭스바겐 그룹 규칙 우회"
 CZE_bend_the_volkswagen_group_rules_desc: "현행 규칙은 다른 기업들의 강력한 지원이 있어도 우리가 주도권을 잡는 것을 허용하지 않습니다. 폭스바겐이 우리보다 강하기 때문에 우리는 몇몇 규칙을 우회할 수밖에 없습니다."
 CZE_prepare_for_takeover: "인수 준비"
 CZE_prepare_for_takeover_desc: "다른 모든 준비가 끝나면 슈코다 그룹을 위한 최종 준비 단계에 착수할 수 있습니다. 이는 우리 회사에 비범한 승리가 될 것입니다."
 CZE_leader_of_the_skoda_group: "슈코다 그룹의 수장"
 CZE_leader_of_the_skoda_group_desc: "우리는 주도권을 잡았고 임무를 완수했습니다. 이제 남은 일은 절차를 마무리하고 새로운 규칙에 따라 그룹을 재편하는 것뿐입니다. 이곳의 누구도 다시는 고객을 속이지 못할 것입니다."
 CZE_skoda_x_volkswagen_cooperation: "슈코다와 폭스바겐의 협력"
 CZE_skoda_x_volkswagen_cooperation_desc: "슈코다는 폭스바겐이 슈코다의 지분 대부분을 사들인 이래 오랜 세월 폭스바겐 그룹의 일원이었습니다. 새로운 사건들의 결과로 기업들 사이의 균형이 흔들릴 수 있습니다. 슈코다는 선택에 직면하게 될 것입니다. 폭스바겐에 충실하게 남을 것인가, 아니면 폭스바겐 그룹이 제시하는 것을 거부하고 독자적으로 행동하기 시작할 것인가."
 CZE_we_can_handle_on_our_own: "우리 힘으로 해낼 수 있다"
 CZE_we_can_handle_on_our_own_desc: "폭스바겐 그룹은 우리가 생각했던 모습이 아닙니다. 정말 훌륭한 공동체이지만, 우리는 조국에 집중하는 편을 선호합니다."
 CZE_prepare_to_leave_the_volkswagen_group: "폭스바겐 그룹 탈퇴 준비"
 CZE_prepare_to_leave_the_volkswagen_group_desc: "그룹을 떠나려면 먼저 폭스바겐과 담판을 지어야 합니다. 어쨌든 우리는 폭스바겐에 의존하고 있고, 그래서 모든 일이 어렵습니다."
 CZE_negotiate_the_licenses: "라이선스 협상"
 CZE_negotiate_the_licenses_desc: "폭스바겐이 보유한 우리의 모든 지분을 되사야 합니다. 어쩌면 더 일찍 돌려주는 데 동의할지도 모릅니다."
 CZE_sustain_economic_trade: "경제 무역 유지"
 CZE_sustain_economic_trade_desc: "우리의 결정 때문에 많은 사업 파트너가 우리에게서 등을 돌릴 것입니다. 우리가 여전히 높은 효율로 무역할 수 있다는 점을 그들에게 안심시켜야 합니다."
 CZE_cesky_motor_energy_holding_project: "체스키 모터 에너지 홀딩 프로젝트"
 CZE_cesky_motor_energy_holding_project_desc: "그러면 체코 기업들을 한데 모으는 새로운 그룹을 위한 준비를 시작합시다. 다른 기업들과 대화를 시작하기 전에 이 프로젝트를 가동하기 위한 준비를 마쳐야 합니다."
 CZE_focus_on_homeland_companies: "국내 기업에 집중"
 CZE_focus_on_homeland_companies_desc: "우리는 다른 기업들과 대화할 준비가 되었습니다. 타트라 트럭, VOP CZ, 프라가, ČEZ를 눈여겨보고 있습니다. 이들은 체코 최대 기업들 가운데 일부이며, 이들과의 협력은 우리에게 막대한 발전의 이익을 가져다줄 것입니다."
 CZE_secure_company_budget: "회사 예산 확보"
 CZE_secure_company_budget_desc: "자산을 확보하지 않으면 말 그대로 매우 두꺼운 벽에 부딪힐 수 있습니다. 이는 회사와 체코 산업에 막대한 손실이 될 것이므로 적절히 자신을 보호해야 합니다."
 CZE_prepare_for_the_actions_drop: "주가 하락 대비"
 CZE_prepare_for_the_actions_drop_desc: "자금은 확보했으니 문제가 하나 남았습니다. 아무 조치도 하지 않으면 우리 주가가 곧 절벽에서 떨어질 수 있습니다. 이를 막을 수는 없지만 예방하고 그 영향을 줄일 수는 있습니다."
 CZE_leave_the_volkswagen_group: "폭스바겐 그룹 탈퇴"
 CZE_leave_the_volkswagen_group_desc: "우리는 (우리가 일으킨) 경제 위기를 극복했고 국내에서 새로운 그룹의 프로젝트를 시작했습니다. 따라서 마음 편히 폭스바겐 그룹을 떠나 완전히 독립할 수 있습니다."
 CZE_complete_cesky_motor_energy_holding_project: "체스키 모터 에너지 홀딩 프로젝트 완료"
 CZE_complete_cesky_motor_energy_holding_project_desc: "이제 모든 기업이 우리와 함께하게 되었으니, 마침내 처음에 시작했던 프로젝트를 마무리할 수 있습니다. 체스키 모터 에너지 홀딩이 드디어 사업을 개시합니다."
 CZE_continue_the_privatization: "민영화 지속"
 CZE_continue_the_privatization_desc: "민영화 과정은 우리나라에서 공산주의가 전복된 직후 시작되었습니다. 많은 국영 기업이 투자자와 사업가들에게 매각되었지만, 우리 앞에는 여전히 해야 할 일이 많습니다."
 CZE_finish_the_coupon_program: "바우처 프로그램 종료"
 CZE_finish_the_coupon_program_desc: "수년간 우리는 기업 주식을 살 수 있는 반무상 바우처를 나눠 주었습니다. 이제 이 과정을 끝내고 다음 단계로 넘어갈 때입니다."
 CZE_expand_promoting_private_ownership_businesses: "민간 기업 장려 확대"
 CZE_expand_promoting_private_ownership_businesses_desc: "중요한 산업 시설이 방치되거나 사용되지 않은 채로 남아 있도록 둘 수는 없습니다. 새로운 투자자들이 이를 인수하도록 장려합시다."
 CZE_finish_selling_state_companies: "국영 기업 매각 완료"
 CZE_finish_selling_state_companies_desc: "여전히 정부 손에 남은 기업이 몇 곳 있으며, 이는 우리의 이미지와 경제 발전에 정말로 좋지 않습니다. 미완의 과제를 끝내고 이 일을 매듭짓습시다."
 CZE_more_liberalization: "추가 자유화"
 CZE_more_liberalization_desc: "민영화 과정은 거의 끝났지만 일부 공산주의 정당은 여전히 이 결정에 반대합니다. 사람들은 우리가 지금 하는 모든 일이 왜 타당한지 알아야 합니다."
 CZE_switch_to_capitalism: "자본주의로 전환"
 CZE_switch_to_capitalism_desc: "자본주의를 사랑하지 않을 사람이 있겠습니까? 농담은 접어 두고, 체코 공화국에 자본주의 체제를 완전히 도입하면 서방과의 무역에 더 넓은 전망이 열리고 공산주의 정당들의 목소리는 잠잠해질 것입니다."
 CZE_finish_privatization: "민영화 완료"
 CZE_finish_privatization_desc: "10년이 넘는 세월 끝에 마침내 기업 민영화 과정을 완료할 수 있습니다. 이제 다른 산업 부문에 집중할 수 있습니다."
 CZE_bohemia: "보헤미아"
 CZE_bohemia_desc: "체코 공화국에서 가장 큰 지역이자 가장 산업화된 지역입니다. 산지보다 평야가 우세한 덕분에 이곳의 산업은 수년에 걸쳐 더 잘 발전할 수 있었습니다. 오늘날 산지와 평지의 격차는 서서히 사라지고 있으며, 우리는 그로부터 이득만 얻을 수 있습니다."
 CZE_take_advantage_of_flatter_terrain: "평탄한 지형 활용"
 CZE_take_advantage_of_flatter_terrain_desc: "보헤미아에는 모라비아보다 평지가 더 많음에도 우리의 활동 영역은 꽤 제한적입니다. 산업을 한곳에 집중시켜야 합니다."
 CZE_reach_out_for_western_investors: "서방 투자자에게 손을 내밀다"
 CZE_reach_out_for_western_investors_desc: "우리는 서방 산업을 활용해 나머지 유럽에 상품을 더 효율적으로 거래할 것입니다. 유럽 연합이 훌륭한 사업 파트너가 될 수도 있습니다."
 CZE_extended_exports: "수출 확대"
 CZE_extended_exports_desc: "새로운 투자자들과 함께라면 우리의 무역을 개선할 수 있습니다. 그렇습니다, 바로 그렇습니다."
 CZE_expand_car_exports: "자동차 수출 확대"
 CZE_expand_car_exports_desc: "새로운 슈페르브 자동차 모델은 큰 성공을 거두었습니다. 독일 함부르크에 있는 우리 항구를 활용하여 대륙간 수출을 시작해야 합니다."
 CZE_modern_car_systems: "현대식 자동차 시스템"
 CZE_modern_car_systems_desc: "21세기는 진보의 시대이므로 우리는 기술을 끊임없이 개선해야 합니다. 슈코다의 강력한 입지 덕분에 우리 시장을 더 효율적으로 발전시킬 수 있습니다."
 CZE_infrastructure_projects: "인프라 프로젝트"
 CZE_infrastructure_projects_desc: "우리는 잘 발달한 도로망으로 유명합니다. 과거의 영광에 안주하지 말고 우리의 전통을 이어 갑시다."
 CZE_automotive_powerhouse: "자동차 강국"
 CZE_automotive_powerhouse_desc: "도로가 전부는 아닙니다. 잘 발달한 철도와 열차 또한 매우 중요한 요소입니다."
 CZE_it_sector: "IT 부문"
 CZE_it_sector_desc: "컴퓨터와 모니터가 크고 무거운 벽돌처럼 생겼던 시절은 이미 지났습니다. 컴퓨터 기술은 20세기 후반 내내 상상할 수 없는 속도로 발전했습니다. 우리는 조금 뒤처져 있지만 아바스트 덕분에 최신 흐름을 따라잡을 수 있습니다."
 CZE_widespread_mobile_internet_access: "인터넷 접속 확산"
 CZE_widespread_mobile_internet_access_desc: "우리 인터넷 수준에 불만을 가질 수는 없지만, 그렇다고 개선할 수 없다는 뜻은 아닙니다."
 CZE_plug_in_new_computers: "신형 컴퓨터 연결"
 CZE_plug_in_new_computers_desc: "좋습니다, 새 컴퓨터가 생겼습니다. 이제 전원을 연결하는 편이 좋겠지요?"
 CZE_advanced_tracking_systems: "첨단 추적 시스템"
 CZE_advanced_tracking_systems_desc: "새로운 추적 시스템은 우리 미사일이 목표를 더 정확히 타격하도록 도울 것입니다. 이는 적 장비를 제거하기 쉽게 하고 전투 중 교전 시간을 단축할 것입니다."
 CZE_ai_calculations: "AI 연산"
 CZE_ai_calculations_desc: "인공지능의 발전을 우리 자동차와 기타 차량에 적용할 수 있습니다. 이는 연산과 계획 수립을 개선할 것입니다."
 CZE_support_avast_development: "아바스트 개발 지원"
 CZE_support_avast_development_desc: "1991년에 설립된 기업 아바스트는 무엇보다도 백신 프로그램으로 유명해졌습니다. 우리는 그들의 혁신을 첩보 임무에 활용할 수 있으며, 이는 사이버전에서 우리에게 우위를 줄 것입니다."
 CZE_driver_assistant: "운전자 보조"
 CZE_driver_assistant_desc: "운전 중 컴퓨터 보조는 운전자가 다른 일에 집중할 수 있게 해 줄 것입니다(비록 도로와의 지속적인 접촉이 여전히 매우 중요하지만)."
 CZE_advanced_emergency_brakes: "첨단 비상 제동 장치"
 CZE_advanced_emergency_brakes_desc: "사고를 내는 것보다 급제동하여 차량이 손상을 입는 편이 낫습니다. AI의 지원 덕분에 새로운 시스템은 더욱 효과적일 것입니다."
 CZE_cyber_security: "사이버 보안"
 CZE_cyber_security_desc: "새로운 아바스트 소프트웨어 덕분에 정부 웹사이트를 더 안전하게 지키고 해커의 공격 가능성에 대비할 수 있습니다. 오늘날 인터넷상의 데이터 보안은 전시의 기밀 유지만큼이나 중요합니다."
 CZE_safe_travel: "안전한 여행을!"
 CZE_safe_travel_desc: "즐거운 휴일 되십시오! 슈코다 자동차의 최신 혁신 덕분에 그 차량들은 최고의 주행 편의성을 제공합니다. 새로운 연료 절감 장치는 연료 소비를 줄여 주며, 사용자는 새롭고 평탄한 도로 위에서 부드러운 주행을 즐길 수 있습니다!"
 CZE_moravia: "모라비아"
 CZE_moravia_desc: "보헤미아보다 다소 덜 발달한 지역이지만 여전히 높은 수준을 유지하고 있습니다. 우세한 산지가 문제일 수 있으나 슬로바키아와 동방 시장에 가까워 무역 발전에 큰 기회를 제공합니다."
 CZE_solve_mountains_problem: "산지 문제 해결"
 CZE_solve_mountains_problem_desc: "앞서 언급했듯이 산지는 약간의 문제를 일으킵니다. 이를 해결할 수 있지만 얼마간의 준비가 필요합니다."
 CZE_move_industry_to_plains: "산업을 평야로 이전"
 CZE_move_industry_to_plains_desc: "산업을 더 평탄한 지역으로 옮기기 시작할 수 있습니다. 이는 원자재 운송과 공장의 상품 수출을 수월하게 해 줄 것입니다."
 CZE_skoda_superb_ii_project: "슈코다 슈페르브 II 프로젝트"
 CZE_skoda_superb_ii_project_desc: "슈페르브 I은 시작에 불과했습니다. 우리 차량의 신세대는 슈페르브의 모든 미래 세대의 기반이 되어야 합니다. 나중에 수정할 필요가 없도록 우리의 행보를 신중히 계획합시다."
 CZE_increase_eastern_trade: "동방 무역 확대"
 CZE_increase_eastern_trade_desc: "러시아와 우크라이나는 막대한 양의 원자재를 수출하는 훌륭한 무역 파트너입니다. 동시에 우리는 슬로바키아와의 관계를 다시 다질 것입니다."
 CZE_seek_for_more_coal: "더 많은 석탄 모색"
 CZE_seek_for_more_coal_desc: "우리는 전통 산업을 지속하고 탄광을 활성화할 것입니다. 이는 새로운 풍력 또는 태양광 발전 단지를 처음부터 짓는 것보다 나은 방법입니다."
 CZE_values_of_the_green_energy: "친환경 에너지의 가치"
 CZE_values_of_the_green_energy_desc: "우리는 시대에 발맞추어 새로운 재생 에너지원을 구축하기 시작해야 합니다. 석탄은 과거의 유물이 되어 가고 있으며, 태양광 패널, 풍력 터빈, 수력 발전소는 우리에게 에너지 안정성을 제공할 것입니다."
 CZE_improve_old_industry: "구식 산업 개선"
 CZE_improve_old_industry_desc: "우리는 다른 나라들을 따라잡아야 합니다. 쉽지는 않겠지만, 낡은 공장으로는 확실히 해낼 수 없을 것입니다."
 CZE_open_new_car_parts_factory: "신규 자동차 부품 공장 개설"
 CZE_open_new_car_parts_factory_desc: "산업의 개선 덕분에 새로운 슈코다 공장을 열 수 있습니다."
 CZE_change_of_energy_regulations: "에너지 규정 변경"
 CZE_change_of_energy_regulations_desc: "에너지 생산을 늘릴지 세금을 늘릴지 결정해야 합니다. 에너지 위기를 맞을 여유는 없습니다."
 CZE_increase_power_generation: "발전량 확대"
 CZE_increase_power_generation_desc: "세금을 올려 봐야 소용이 없습니다. 발전기의 발전 용량을 늘려 어떻게든 이 위기를 헤쳐 나가겠습니다."
 CZE_increase_energy_taxes: "에너지 세금 인상"
 CZE_increase_energy_taxes_desc: "세금을 올리는 편이 낫겠습니다. 현재로서는 발전기 용량을 늘릴 방법이 없습니다."
 CZE_expand_nuclear_power_plants: "원자력 발전소 확장"
 CZE_expand_nuclear_power_plants_desc: "우리의 가장 큰 에너지 발전원은 원자력 발전소 안에 있습니다. 두코바니, 그리고 곧 완공될 테멜린 발전소 덕분에 체코 공화국은 오랫동안 에너지 안정성을 유지해 왔습니다. 그러나 신기술은 점점 더 많은 에너지를 요구합니다. 발전소를 개발하지 않고 방치하면 곧 에너지 위기를 겪을 수 있습니다."
 CZE_temelin_power_plant: "테멜린 발전소"
 CZE_temelin_power_plant_desc: "이 발전소의 건설에는 말 그대로 오랜 세월이 걸렸습니다. 마침내 이 일을 끝내고 우리의 두 번째 원자력 발전소가 가동을 시작할 준비를 마쳐서 기쁩니다."
 CZE_dukovany_power_plant: "두코바니 발전소"
 CZE_dukovany_power_plant_desc: "우리의 첫 번째 원자력 발전소입니다. 덕분에 이제 전력 문제를 걱정하지 않고 편히 잠들 수 있습니다. 안타깝게도 곧 원자로를 업그레이드해야 하며, 이는 막대한 비용이 들 것입니다."
 CZE_increased_leu_fuel_efficiency: "LEU 연료 효율 향상"
 CZE_increased_leu_fuel_efficiency_desc: "LEU 연료의 효율을 높이면 원자로에서 더 많은 에너지를 얻을 수 있습니다. 이는 비용이 많이 드는 조치이므로 이 농축 연료를 영원히 사용할 수는 없을 것입니다."
 CZE_strengthen_security: "안전 강화"
 CZE_strengthen_security_desc: "우리는 체르노빌 원자력 발전소에서 저질렀던 치명적인 실수를 되풀이해서는 안 됩니다. 많은 시민, 특히 두코바니와 테멜린에 사는 이들은 체르노빌 참사가 되풀이될까 두려워합니다. 우리는 가능한 한 원자로 건물을 강화할 것입니다."
 CZE_maximize_power_of_four_reactors: "원자로 4기 출력 극대화"
 CZE_maximize_power_of_four_reactors_desc: "그렇게 하면 어느 정도 손상의 위험이 있지만, 두코바니 발전소의 출력을 높이는 데 성공한다면 일시적으로 막대한 추가 에너지를 얻을 것입니다."
 CZE_prepare_for_second_reactor_construction: "두 번째 원자로 건설 준비"
 CZE_prepare_for_second_reactor_construction_desc: "물론 원자로 한 기로는 충분하지 않습니다. 우리는 추가 확장을 염두에 두고 원자력 발전소를 발전시키고 있습니다."
 CZE_terrorist_attacks_protection: "테러 공격 방호"
 CZE_terrorist_attacks_protection_desc: "세계무역센터, 펜타곤. 그다음은 어디입니까? 테러리스트들이 우리 원자력 발전소를 공격하게 둘 수는 없습니다. 그 결과는 매우, 매우 치명적일 것입니다. 방사선과 수천 명의 사상자는 말할 것도 없고, 체코 에너지 안정성의 종말이 될 것입니다."
 CZE_increased_heu_fuel_efficiency: "HEU 연료 효율 향상"
 CZE_increased_heu_fuel_efficiency_desc: "왜 그것이 필요하냐고요? 우리가 선견지명을 갖추고 예기치 못한 상황에 대비하고 있다고 해 둡시다."
 CZE_open_second_temelin_reactor: "테멜린 제2원자로 가동"
 CZE_open_second_temelin_reactor_desc: "우리는 두 번째 원자로를 국가 전력망에 연결할 준비가 되었습니다. 이는 추가 에너지를 제공하고 우리 연구원들을 위한 새로운 일자리를 열어 줄 것입니다."
 CZE_further_renewable_energy_expansion: "재생 에너지 추가 확대"
 CZE_further_renewable_energy_expansion_desc: "우리는 원자력 발전소에만 의존할 수 없습니다. 만약 발전소가 우리를 실망시킨다면, 그럴 일은 없어야겠지만, 비상 발전기가 필요할 것입니다."
 CZE_future_in_nuclear_energy: "원자력의 미래"
 CZE_future_in_nuclear_energy_desc: "지금까지 우리 발전소는 완벽하게 가동되었습니다. 이제 미지의 영역으로 또 한 걸음 내디딜 때입니다."
 CZE_third_nuclear_power_plant_preparations: "세 번째 원자력 발전소 준비"
 CZE_third_nuclear_power_plant_preparations_desc: "투자자들이 지난 프로젝트의 기간에 만족하지 않았기 때문에 이는 위험한 조치입니다. 시간은 제한적이겠지만 동시에 우리는 훨씬 더 많은 경험을 쌓았습니다."
 CZE_upgrade_existing_reactors: "기존 원자로 업그레이드"
 CZE_upgrade_existing_reactors_desc: "뒤처지지 않도록 기존 발전소를 계속 개선해 나갈 것입니다. 투자자들은 이러한 지출에 꽤 회의적이며, 우리 프로젝트에 대한 그들의 반감을 살 위험이 있습니다."
 CZE_choose_location: "부지 선정"
 CZE_choose_location_desc: "표준 절차입니다. 먼저 자금을 모으고 가장 새로운 원자력 발전소의 부지를 마련해야 합니다."
 CZE_fifth_dukovany_reactor: "두코바니 제5원자로"
 CZE_fifth_dukovany_reactor_desc: "우리의 최고 원자력 기술자들이 일하는 곳을 개선하는 편이 낫습니다. 투자자들도 이 프로젝트를 더 기꺼이 지원할 것입니다."
 CZE_third_temelin_reactor: "테멜린 제3원자로"
 CZE_third_temelin_reactor_desc: "최근의 논란 때문에 위험한 조치이지만, 또 하나의 테멜린 원자로 자금 조달을 돕도록 투자자들을 설득해야 합니다."
 CZE_start_construction: "건설 착수"
 CZE_start_construction_desc: "우리는 세 번째 원자력 발전소 건설을 시작하기에 충분한 자금을 모았습니다. 시간이 많지는 않지만 숙련된 노동자들 덕분에 기한 내에 해낼 것입니다."
 CZE_new_energy_storage: "신규 에너지 저장 시설"
 CZE_new_energy_storage_desc: "새 발전소는 막대한 에너지를 생산할 것입니다. 이를 어딘가에 저장해야 하며, 그래서 우리는 새로운 배터리 단지를 건설할 것입니다."
 CZE_open_third_nuclear_power_plant: "세 번째 원자력 발전소 가동"
 CZE_open_third_nuclear_power_plant_desc: "아, 그렇습니다, 세 번째 원자력 발전소. 새 원자로를 가동함으로써 우리는 마침내 수십 년간의 에너지 안보를 확보했습니다."
 CZE_communism_or_democracy: "공산주의냐 민주주의냐?"
 CZE_communism_or_democracy_desc: "KSČM은 체코에 남은 마지막 유력 공산주의 정당 중 하나로 알려져 있습니다. 공산 통치가 끝난 지 오래되었음에도 체코 시민들 사이에서 여전히 큰 지지를 얻고 있습니다. 상황은 역동적으로 변화하며, 어쩌면 운이 따라 체코 공화국이 다시 공산주의자들의 통치를 받게 될지도 모르지만 이번에는 그 운명이 크게 다를 수 있습니다."
 CZE_kscm_program: "KSČM 강령"
 CZE_kscm_program_desc: "KSČM의 당 강령은 시민 복지, 유로코뮤니즘, 그리고 마르크스주의 이념에 기반한 경제입니다. 교회에 대해 부정적인 입장을 취하며 ČSSD와 긴밀히 협력합니다."
 CZE_nadeje_pro_cr: "체코 공화국을 위한 희망"
 CZE_nadeje_pro_cr_desc: "이 당의 장기 강령은 '체코 공화국을 위한 희망'입니다. 이에 따르면 'KSČM은 자본주의를 세계와 사회의 악화되는 문제들의 근본 원인으로 간주합니다'. 당은 이를 '새롭고 더 진보적인 사회경제적 구성체'로 대체하고자 합니다."
 CZE_dont_trust_democracy: "민주주의를 믿지 마라"
 CZE_dont_trust_democracy_desc: "그냥 믿지 마십시오. 진지하게 말하자면, 민주주의는 나라를 발전시키는 속도가 더디기로 유명합니다. 공산주의는 다르며, (이번에는) 체코 경제를 위대하게 만들 것입니다."
 CZE_eurocommunism: "유로코뮤니즘"
 CZE_eurocommunism_desc: "유로코뮤니즘적 관점은 유럽 연합 내부와 유럽 전반에서 공산주의의 뿌리를 개선하는 것을 가리킵니다. 일부 정당은 이를 목표 중 하나로 삼을 수 있습니다. 이는 안정도와 민주주의에 대한 경미한 위협이지만, 누군가 유럽 공산주의 정당들을 이끌 수 있다면 중대한 위협으로 변할 수도 있습니다."
 CZE_promote_the_black_book_of_capitalism: "자본주의 흑서 홍보"
 CZE_promote_the_black_book_of_capitalism_desc: "자본주의 체제의 알려진 모든 거짓과 부패와 실패가 한 권의 책에 담겨 있습니다. 왜 사지 않으시겠습니까? 고작 333 체코 코루나입니다!"
 CZE_marxist_fundamentalism: "마르크스주의 원리주의"
 CZE_marxist_fundamentalism_desc: "마르크스주의 이념은 사회적 지원과 다른 방식의 경제 발전을 지향합니다. KSČM은 이 사상에 따라 당 강령을 추진합니다."
 CZE_the_last_real_czech_communists: "마지막 진짜 체코 공산주의자들"
 CZE_the_last_real_czech_communists_desc: "솔직히 말해, KSČM은 체코 공화국에서 정치적으로 의미를 가지는 유일하게 남은 공산당입니다. 다른 공산당들과의 영향력 및 협력이 KSČM을 더욱 강하게 만듭니다."
 CZE_cssd_cooperation: "CSSD와의 협력"
 CZE_cssd_cooperation_desc: "KSČM은 주요 민주주의 정당인 ČSSD와의 긴밀한 협력으로 잘 알려져 있습니다. 두 정당은 공통된 언어를 어느 정도 공유하며 중요한 결정을 함께 내리는 경우가 많습니다. 때때로 연립 내에서 문제가 생기기도 하지만, 두 당은 계속 함께하려 노력하고 있습니다."
 CZE_backstage_with_russia: "러시아와의 막후 협상"
 CZE_backstage_with_russia_desc: "러시아는 훌륭한 무역 상대이며, 다른 정당들도 이를 알아야 합니다. 이 강대국과 새로운 무역로를 구축하면 체코 공화국의 시장이 성장하기 시작할 것입니다."
 CZE_ods_rivalry: "ODS와의 경쟁"
 CZE_ods_rivalry_desc: "KSČM과 ODS는 서로를 좋아하지 않습니다. 특히 ODS가 ČSSD와 협력할 때는 더욱 그렇습니다. 서로 참아 보려 하지만 때로는 통제 불능이 되는 불안정한 삼각 구도입니다."
 CZE_time_for_changes: "변화의 시간"
 CZE_time_for_changes_desc: "공산주의자들이 다시 한번 체코 공화국을 통치하고 있습니다. 민영화를 되돌리고 수많은 사회 제도를 복원해야 할 때입니다."
 CZE_revive_national_spirit: "민족 정신의 부활"
 CZE_revive_national_spirit_desc: "우리 국민은 공산주의가 나쁜 것만은 아니라는 점을 기억해야 합니다. 민주주의는 과거의 일이며, 우리는 새로운 미래에 적응해야 합니다."
 CZE_widen_chinese_market: "중국 시장 확대"
 CZE_widen_chinese_market_desc: "중국은 전자제품, 자재, 기계류가 풍부한 훌륭한 무역 상대입니다. 중국으로부터의 수입을 늘려야 합니다."
 CZE_sphere_of_asia: "아시아 세력권"
 CZE_sphere_of_asia_desc: "아시아는 중국이나 러시아에서 끝나지 않습니다. 인도나 중동 같은 귀중한 파트너가 아직 많이 남아 있습니다."
 CZE_take_power_in_european_union: "유럽 연합에서 권력 장악"
 CZE_take_power_in_european_union_desc: "유럽 연합의 공산당들을 이끌게 되면 EU의 발전을 더 잘 관리하여 체코 공화국에 유리한 방향으로 이끌 수 있을 것입니다."
 CZE_limited_trust_for_usa: "미국에 대한 제한적 신뢰"
 CZE_limited_trust_for_usa_desc: "우리가 동맹이든 아니든 중요하지 않습니다. 미국은 지금껏 존재한 가장 강력한 민주주의 국가입니다. 미국이 우리를 권력에서 몰아내려 할 수도 있습니다. 그들의 움직임을 매우 면밀히 지켜봐야 합니다."
 CZE_stabilize_the_government: "정부 안정화"
 CZE_stabilize_the_government_desc: "국민은 우리를 신뢰하지만 다른 정당들은 그렇지 않습니다. 정치인들을 진정시켜야 합니다."
 CZE_interventionism: "개입주의"
 CZE_interventionism_desc: "우리의 진짜 계획을 위한 준비를 시작할 때입니다. 우리는 과거에 여러 번 상처를 입었습니다. 모든 적이 그 죄값을 치러야 할 때입니다."
 CZE_consequences_of_1968_warsaw_pact_intervention: "바르샤바 조약군 침공의 여파"
 CZE_consequences_of_1968_warsaw_pact_intervention_desc: "우리 국민은 바르샤바 조약군의 개입으로 너무나 큰 고통을 겪었습니다. 가장 큰 위협은 러시아이지만, 먼저 그 전직 괴뢰국들부터 처리해야 합니다."
 CZE_strike_at_hungary: "헝가리 타격"
 CZE_strike_at_hungary_desc: "헝가리는 1968년 개입에 가담한 국가 중 하나였습니다. 그 결정의 대가를 치를 때가 되었습니다."
 CZE_take_back_zaolzi: "자올지에 탈환"
 CZE_take_back_zaolzi_desc: "폴란드는 과거에 우리에게서 자올지에 지역을 빼앗았습니다. 이제 우리는 그 지역의 모든 지역을 되찾을 뿐만 아니라, 오늘은 우리가 그들에게 요구할 차례입니다."
 CZE_bulgaria_has_to_pay_for_their_crimes: "불가리아는 죄값을 치러야 한다"
 CZE_bulgaria_has_to_pay_for_their_crimes_desc: "그리고 마침내 발칸 국가 불가리아입니다. 루마니아는 비교적 중립을 지켰지만, 불가리아는 우리의 처지에 그렇게 정중하지 않았습니다."
 CZE_the_biggest_threat: "가장 큰 위협"
 CZE_the_biggest_threat_desc: "이제 러시아의 차례입니다. 우리 조국에 대한 1968년 개입의 가장 큰 원인입니다. 쉬운 일은 아니겠지만, 우리의 결의가 이 위협을 이겨내게 해 줄 것입니다."
 CZE_revert_privatization_effects: "민영화 영향 되돌리기"
 CZE_revert_privatization_effects_desc: "자본주의는 우리 경제에 큰 상처를 입혔습니다. 공공 재산을 되돌리고 이 어리석은 짓을 멈춰야 합니다."
 CZE_strike_at_capitalism: "자본주의 타격"
 CZE_strike_at_capitalism_desc: "우리는 세계에 공산주의 체제의 이점을 보여 줄 것입니다. 자본주의는 부자를 더 부유하게 만들 뿐이며, 이는 평범한 사람들에게 좋지 않습니다."
 CZE_finish_agriculture_program: "농업 프로그램 완수"
 CZE_finish_agriculture_program_desc: "마침내 농업 체계의 개혁을 마무리할 수 있습니다. 우리 농민들은 오래전에 받았어야 할 것을 마침내 받게 될 것입니다."
 CZE_keep_the_track_of_peace: "평화의 길 유지"
 CZE_keep_the_track_of_peace_desc: "우리가 바란 것은 오직 시민들을 행복하게 하는 것뿐이었습니다. 자본주의와 사유 재산은 나라를 다스리기에 좋지 않은 방식입니다. 우리는 공산주의 체제를 복원했고 변화는 끝났습니다. 이제 정상 궤도로 돌아갈 수 있습니다."
 CZE_stay_on_track: "궤도 유지"
 CZE_stay_on_track_desc: "지난 선거에서 성공하지는 못했지만, 우리의 강령은 계속 추진할 수 있습니다."
 CZE_change_the_labor_code: "노동법 개정"
 CZE_change_the_labor_code_desc: "민영화를 되돌릴 수는 없지만 적어도 노동법에 몇 가지 변화를 줄 수는 있습니다. 이를 통해 국민이 일터에서 더 독립적으로 일할 수 있게 될 것입니다."
 CZE_make_use_of_the_ctyrkoalice_split: "추티르코알리체 분열의 활용"
 CZE_make_use_of_the_ctyrkoalice_split_desc: "네 정당의 협약이 마침내 무너졌습니다. ČSSD와의 관계를 강화하고 지지를 얻을 수 있습니다."
 CZE_deepen_cooperation_with_cssd: "ČSSD와의 협력 심화"
 CZE_deepen_cooperation_with_cssd_desc: "추티르코알리체가 무너졌으므로 ČSSD와의 동맹은 더욱 강해질 것입니다. 이는 ODS를 더 작아 보이게 만들기도 할 것입니다."
 CZE_open_for_greater_trade_with_russia: "러시아와의 무역 확대 개방"
 CZE_open_for_greater_trade_with_russia_desc: "ČSSD와의 협력 덕분에 더 논쟁적인 결정을 내릴 수 있습니다. 우리나라가 러시아 자원에 어느 정도 의존하게 함으로써 이 초강대국과 더 긴밀한 관계를 구축할 것입니다."
 CZE_backstage_with_russia_ii: "러시아와의 막후 협상 II"
 CZE_backstage_with_russia_ii_desc: "실제로 그런 것에 누가 신경을 쓰겠습니까. 이는 경제에 큰 영향을 주지 않을 것이며, 러시아와의 무역에서 더 낮은 가격을 얻게 될 것입니다."
 CZE_regain_people_trust: "국민 신뢰 회복"
 CZE_regain_people_trust_desc: "ODS 때문에 우리 상황이 상당히 나빠졌습니다. 우리가 여전히 체코 정치에서 중요한 세력임을 국민에게 납득시켜야 합니다."
 CZE_limits_for_the_churches: "교회에 대한 제한"
 CZE_limits_for_the_churches_desc: "교회가 우리 국가에 지나치게 큰 영향을 미치기 시작했습니다. 종교가 우리나라의 생산성을 떨어뜨리도록 내버려 둘 수 없습니다."
 CZE_focus_on_whats_real_not_imaginary: "상상이 아닌 현실에 집중"
 CZE_focus_on_whats_real_not_imaginary_desc: "새로운 일터 대신 교회를 지원하는 데 왜 돈을 낭비하고 있습니까? 이는 중단되어야 합니다."
 CZE_attack_ods: "ODS 공격"
 CZE_attack_ods_desc: "우리의 대립은 해마다 깊어지고 있으므로 경계를 늦출 수 없으며, ODS의 희생으로 영향력을 얻기 위한 또 다른 행동을 준비해야 합니다."
 CZE_leadership_of_vojtech_filip: "보이테흐 필립의 지도부"
 CZE_leadership_of_vojtech_filip_desc: "보이테흐 필립이 우리 당의 새 지도자로 선출되었습니다. 변화를 이루고 하락하는 인기의 흐름을 되돌릴 때입니다."
 CZE_continuation_of_2002_elections_program: "2002년 선거 강령의 계승"
 CZE_continuation_of_2002_elections_program_desc: "지난 몇 년간 우리 강령은 안정과 더딘 발전을 가져다주었습니다. 지금 이를 바꾸는 것은 위험하므로 현재 가진 것을 유지할 것입니다."
 CZE_discuss_with_environmental_protection_experts: "녹색 보호 전문가와의 논의"
 CZE_discuss_with_environmental_protection_experts_desc: "이는 우리의 녹색 정치에서 한 걸음 더 나아가는 일입니다. 체코 공화국에서 녹색 에너지의 가치를 어떻게 높일 수 있을지 전문가들과 논의할 것입니다."
 CZE_pro_ecological_innovations: "친환경 혁신"
 CZE_pro_ecological_innovations_desc: "오염은 우리 공동체에 매우 심각한 위협이 되기 시작했습니다. 신속하고 단호하게 행동해야 합니다."
 CZE_promoting_recycling: "재활용 장려"
 CZE_promoting_recycling_desc: "단순하지만 효과적입니다. 폐기물을 분류하면 우리 공장들이 더 효율적으로 재활용할 수 있을 것입니다."
 CZE_invest_in_renewable_energy: "재생 에너지 투자"
 CZE_invest_in_renewable_energy_desc: "우리에게는 수력 발전소와 원자력 발전소가 여러 곳 있습니다. 좋은 일이지만 충분하지는 않습니다. 에너지 체계를 안전하게 유지하려면 더 많은 발전기를 건설해야 합니다."
 CZE_agriculture_innovations: "농업 혁신"
 CZE_agriculture_innovations_desc: "농업 프로그램에서 또 한 걸음 나아갈 때입니다. 농민을 위한 새로운 보조금과 첨단 기계에 대한 더 쉬운 접근이 우리 농장을 더 살기 좋고 일하기 좋은 곳으로 만들 것입니다."
 CZE_protest_against_mines_privatization: "광산 민영화 반대 시위"
 CZE_protest_against_mines_privatization_desc: "광업과 자원 부문은 언제나 국가의 손에 있어야 합니다. 경제의 이 부문을 민영화하면 자원 가격이 상승할 수 있습니다."
 CZE_reduce_resource_extraction: "자원 채굴 감축"
 CZE_reduce_resource_extraction_desc: "현재의 채굴 속도라면 10년이나 20년 뒤에 곤란해질 수 있습니다. 위기에 빠지지 않도록 자원 채굴의 균형을 맞춰야 합니다."
 CZE_waste_less_energy: "에너지 낭비 줄이기"
 CZE_waste_less_energy_desc: "한정된 자원 때문에 몇 가지 조치를 취할 수밖에 없습니다. 에너지 절약 기술에 투자할 것입니다."
 CZE_focus_on_hydroelectric_and_nuclear_power_plants: "수력 및 원자력 발전소 집중"
 CZE_focus_on_hydroelectric_and_nuclear_power_plants_desc: "이들은 우리의 주요 에너지원입니다. 이를 계속 유지하는 것은 전력 안전을 보장하기 위한 우리의 의무입니다."
 CZE_expand_civilian_infrastructure: "민간 인프라 확충"
 CZE_expand_civilian_infrastructure_desc: "체코 공화국은 잘 정비된 도로망으로 알려져 있습니다. 그러나 더 나아질 수 없다는 뜻은 아닙니다."
 CZE_better_railway_system: "더 나은 철도 체계"
 CZE_better_railway_system_desc: "새로운 철로는 새로운 도시들을 연결하고 열차가 목적지에 도착하는 데 걸리는 시간을 단축할 것입니다."
 CZE_green_czech_republic: "녹색 체코 공화국"
 CZE_green_czech_republic_desc: "우리는 녹색 에너지 개발에서 상당한 진전을 이루었으므로, 이제 녹지의 가치를 높이고 자연과 관련된 일을 하는 노동자들에 대한 지원을 개선해야 합니다."
 CZE_nuclear_power_plants_expansion: "원자력 발전소 확장"
 CZE_nuclear_power_plants_expansion_desc: "원자력 발전소를 최신 상태로 유지하려면 추가 확장이 필요합니다. 모든 것에는 한계가 있으므로 원자로를 끊임없이 개선해야 합니다."
 CZE_take_a_look_on_country_agriculture: "국가 농업 점검"
 CZE_take_a_look_on_country_agriculture_desc: "우리는 이 점을 여러 번 언급했으며, 농업 체계의 문제가 완전히 해결될 때까지 계속 말할 것입니다. 또 다른 혁신이 도입을 앞두고 있습니다."
 CZE_further_green_energy_innovations: "추가 녹색 에너지 혁신"
 CZE_further_green_energy_innovations_desc: "누가 녹색 에너지를 싫어하겠습니까? 사실 많은 사람이 그렇습니다... 그렇기에 그것이 낡은 석탄 에너지보다 왜 정말로 더 나은지 보여 주어야 합니다."
 CZE_farmers_league: "농민 연맹"
 CZE_farmers_league_desc: "영광스러운 농민들의 생활 조건을 개선하는 마지막 단계입니다. 농민은 나라의 근간입니다. 그들은 작물과 식량을 재배하고 동물을 돌봅니다. 그 보답을 받아야 합니다."
 CZE_hunstman_support: "사냥꾼 지원"
 CZE_hunstman_support_desc: "사냥꾼이 되는 것은 단지 식량이나 다른 재료를 위해 동물을 죽이는 것이 아닙니다. 사냥꾼은 야생 동물이 자유롭게 번성할 수 있도록 돌보아야 합니다. 우리는 그들의 일을 도울 것입니다."
 CZE_further_hydroelectric_plants_improvement: "수력 발전소 추가 개선"
 CZE_further_hydroelectric_plants_improvement_desc: "수력 발전소의 또 다른 확장입니다. 물은 훌륭한 재생 에너지원이며 우리는 이를 활용해야 합니다."
 CZE_the_initiative_of_communist_and_workers_parties: "공산당·노동당 이니셔티브"
 CZE_the_initiative_of_communist_and_workers_parties_desc: "IOCAWP는 정치 분야에서 공동 발전을 도모하는 유럽 공산당들의 모임입니다. 눈을 뜨고 우리 당의 위기에 맞설 마지막 기회입니다."
 CZE_in_offense_to_european_union: "유럽 연합에 대한 공세"
 CZE_in_offense_to_european_union_desc: "우리는 일정한 지지를 얻었으므로 이제 우리의 강령을 시작하고 공산당들 사이에서 주도권을 잡도록 시도할 수 있습니다."
 CZE_capitalist_threat: "자본주의의 위협"
 CZE_capitalist_threat_desc: "자본주의는 결국 유럽 연합의 붕괴로 이어질 것입니다. 민주주의 국가들은 자신들의 미래를 알아야 하며, 우리는 그것을 막고자 합니다."
 CZE_cooperation_with_european_communists: "유럽 공산주의자들과의 협력"
 CZE_cooperation_with_european_communists_desc: "일부 공산당들이 우리의 이니셔티브를 지지하고 있습니다. 그 인기와 훌륭한 연설을 활용하여 이 관계를 더욱 강화할 때입니다."
 CZE_speak_against_usa: "미국 규탄"
 CZE_speak_against_usa_desc: "미국은 공산주의의 가장 큰 적입니다. 그들을 매우 면밀히 주시하고 우리의 이니셔티브에 반하여 움직이지 못하게 해야 합니다."
 CZE_face_the_crisis: "위기에 맞서기"
 CZE_face_the_crisis_desc: "불행히도 우리는 체코 정치에서 충분한 인기를 유지하지 못했습니다. 위기에 맞서 적어도 의회 안에 남아 있도록 노력해야 합니다."
 CZE_majority_in_european_communists: "유럽 공산주의자들 사이의 다수파"
 CZE_majority_in_european_communists_desc: "우리는 유럽 연합 공산당들 사이에서 주도권을 얻었습니다. 이 힘을 이용해 국제 무대에서 체코 공화국의 입지를 개선할 수 있습니다."
 CZE_coherent_political_goals: "일관된 정치 목표"
 CZE_coherent_political_goals_desc: "체코 공화국의 많은 정당이 공통된 목표를 가지고 있습니다. 나라를 강하고 독립적으로 만드는 것 외에도, 주요 정당 대부분이 녹색 에너지, 사회 복지, 친환경 혁신을 발전시키려 합니다."
 CZE_kducsl_program: "KDU-CSL 강령"
 CZE_kducsl_program_desc: "KDU-ČSL의 강령은 가족 지원, 양질의 교육, 접근 가능한 의료, 균형 잡힌 경제, 환경 보호, 농촌 개발, EU 협력, 투명한 통치를 강조하며, 이 모두는 기독교 민주주의 가치에 뿌리를 두고 있습니다."
 CZE_social_market_economy: "사회적 시장 경제"
 CZE_social_market_economy_desc: "§YKDU-ČSL§!의 §Y사회적 시장 경제는 자유 시장의 효율성과 강력한 사회 정책을 결합하여, 경쟁과 복지를 모두 증진하는 균형 잡힌 접근법을 통해 경제적 번영과 사회 정의, 취약 계층에 대한 지원을 보장하는 것을 목표로 합니다§!"
 CZE_invest_in_families: "가족에 대한 투자"
 CZE_invest_in_families_desc: "가족에 투자함으로써 우리는 인구 증가를 촉진할 뿐만 아니라 더 결속력 있고 생산적인 사회를 만들 수 있습니다."
 CZE_catholic_ethics_desc: "가톨릭 가치를 통치에 통합함으로써 우리는 사회적 조화와 연민, 공동선을 증진하고자 합니다."
 CZE_social_pensions: "사회 연금"
 CZE_social_pensions_desc: "포괄적인 사회 연금 제도를 시행함으로써 모든 시민에게 노후의 경제적 안정을 제공하고자 합니다."
 CZE_keep_education_on_high_level: "높은 수준의 교육 유지"
 CZE_keep_education_on_high_level_desc: "높은 교육 수준을 유지함으로써 우리 시민들이 급변하는 세계의 도전에 잘 대비하도록 보장합니다."
 CZE_catholic_ethics: "가톨릭 윤리"
 CZE_increased_role_of_the_religion_in_society: "사회에서 종교의 역할 확대"
 CZE_increased_role_of_the_religion_in_society_desc: "종교 교육을 장려하고, 신앙에 기반한 지역 사회 활동을 지원하며, 종교 지도자들과 협력함으로써 윤리적 원칙과 상호 존중에 기반한 사회를 육성할 수 있습니다."
 CZE_conversion_of_unbelievers: "비신자의 개종"
 CZE_conversion_of_unbelievers_desc: "아직 우리의 신앙을 따르지 않는 이들을 교육하고 개종시키는 프로그램을 지원함으로써 더 조화롭고 독실한 사회를 만들고자 합니다."
 CZE_easier_access_to_religion: "종교에 대한 더 쉬운 접근"
 CZE_easier_access_to_religion_desc: "이 중점은 신체적, 경제적, 사회적 장벽을 불문하고 개인이 자신의 종교를 실천하는 것을 가로막는 장벽을 제거하는 데 전념합니다. 더 많은 예배 장소를 건립하고, 종교 자료에 보조금을 지급하며, 종교 교육 프로그램을 지원하는 사업이 포함될 것입니다. 또한 농촌 및 소외 지역에서도 종교 예배를 이용할 수 있도록 보장할 것입니다. 사람들이 종교에 접근하고 이를 실천하기 쉽게 함으로써, 신앙이 자유롭고 포용적으로 꽃필 수 있는 영적으로 충만하고 결속력 있는 사회를 만들고자 합니다."
 CZE_lgbt_suppresion: "LGBT 탄압"
 CZE_lgbt_suppresion_desc: "이 중점은 사회 내 LGBT의 권리와 가시성을 억압하는 정책을 시행하는 것을 목표로 합니다. LGBT 단체 제한, LGBT 정체성의 공개적 표출 금지, 전통적 성 역할의 강제 등의 조치가 포함될 것입니다."
 CZE_balanced_spendings: "균형 지출"
 CZE_balanced_spendings_desc: "균형 잡힌 지출은 외부 충격을 견디고 모든 시민의 복지를 책임질 수 있는 탄력적인 경제를 만드는 데 도움이 될 것입니다."
 CZE_tighten_relations_with_cssd: "CSSD와의 관계 강화"
 CZE_tighten_relations_with_cssd_desc: "ČSSD는 우리나라의 중요한 정당입니다. 그러나 우리는 그들이 KSČM과 맺고 있는 연계를 지지하지 않는다는 점을 말해 두어야 합니다."
 CZE_limit_role_of_the_communists: "공산주의자의 역할 제한"
 CZE_limit_role_of_the_communists_desc: "KSČM이 어떤 강령을 준비했든 우리는 그들을 신뢰해서는 안 됩니다. 공산주의는 우리나라에 좋은 일을 하나도 하지 못했으며, 모두가 이를 기억해야 합니다."
 CZE_leadership_of_miroslav_kalousek: "미로슬라프 칼로우세크의 지도부"
 CZE_leadership_of_miroslav_kalousek_desc: "칼로우세크가 우리 당의 당수가 될 때입니다. 그의 새로운 조세 정책은 우리나라가 국가 부채를 줄이는 데 도움이 될 것입니다."
 CZE_stay_close_with_usdeu: "US-DEU와의 긴밀한 관계 유지"
 CZE_stay_close_with_usdeu_desc: "US-DEU는 그다지 인기가 없지만 우리는 그들의 강령을 높이 평가합니다. 추티르코알리체가 붕괴한 후이므로 협력을 재개하려는 노력은 바람직할 것입니다."
 CZE_get_closer_to_ods: "ODS에 가까워지기"
 CZE_get_closer_to_ods_desc: "또 다른 거대 정당은 ODS입니다. 그들은 ČSSD보다 더 나은 강령을 가지고 있으며, 우리는 그들과 가까워지는 것을 목표로 삼아야 합니다."
 CZE_cooperation_with_strana_zelenych: "녹색당과의 협력"
 CZE_cooperation_with_strana_zelenych_desc: "녹색당(Strana Zelených)은 환경에 가장 큰 노력을 기울이는 정당입니다. 그들은 우리가 재생 에너지 프로그램을 완수하도록 도울 것입니다."
 CZE_promote_renewable_energy_sources: "재생 에너지원 장려"
 CZE_promote_renewable_energy_sources_desc: "녹색당 덕분에 2006년 선거 전에 재생 에너지 프로그램을 마칠 수 있습니다."
 CZE_jiri_cunek_will_lead_us: "이르지 추네크가 우리를 이끈다"
 CZE_jiri_cunek_will_lead_us_desc: "이르지 추네크는 새로운 교회를 포함한 신규 건설 프로그램을 통해 더 많은 사람을 우리나라로 끌어들이는 데 주력할 것입니다. 우리나라의 지도부를 바꿀 때입니다."
 CZE_limit_freedom_of_the_romes: "로마니족의 자유 제한"
 CZE_limit_freedom_of_the_romes_desc: "소수 민족이 우리 국민에 비해 너무 많은 권리를 가지고 있습니다. 이곳은 그들의 나라가 아니라 우리의 나라임을 알게 해야 합니다."
 CZE_cooperation_with_ods_and_strana_zelenych: "ODS 및 녹색당과의 협력"
 CZE_cooperation_with_ods_and_strana_zelenych_desc: "ODS 및 녹색당(Strana Zelených)과의 협력을 심화할 때입니다. 그들과 함께라면 정부 내에서 인기와 안정을 유지할 수 있을 것입니다."
 CZE_restrict_social_benefits: "사회 급여 제한"
 CZE_restrict_social_benefits_desc: "국가가 사회 부문에 너무 많은 돈을 쓰고 있습니다. 원치 않지만 나라의 경제 상황을 개선하기 위해 일부 사회 지출을 삭감해야 합니다."
 CZE_extend_churches: "교회 확충"
 CZE_extend_churches_desc: "기독교인이 점점 늘고 있으므로 이들을 위해 더 많은 교회를 지어야 합니다. 이는 처음부터 우리 강령의 일부였으며, 이 구상을 확대할 때입니다."
 CZE_solve_internal_problems: "내부 문제 해결"
 CZE_solve_internal_problems_desc: "우리나라는 매우 신속히 해결해야 할 많은 내부 갈등을 겪고 있습니다. 몇 가지 개혁을 단행할 때입니다."
 CZE_kducsl_2010_program_idea: "§3KDU-ČSL§! - 2010년 강령"
 CZE_pavel_belohradek_idea: "§3KDU-ČSL§! - 파벨 벨로브라데크"
 CZE_pavel_belohradek_is_leader: "§3파벨 벨로브라데크§!는 현재 §3KDU-ČSL§!의 지도자입니다"
 CZE_pavel_belohradek_warning: "§R§Y파벨 벨로브라데크§!가 지도자에서 물러나면, §Y마리안 유레치카의 지도부§! 이전까지 이후 모든 §YKDU-ČSL§! 중점의 긍정적 효과가 절반이 되며 정치력을 잃게 됩니다.§!"
 CZE_majority_of_younger_people: "젊은 층의 다수"
 CZE_majority_of_younger_people_desc: "청년은 우리의 미래이므로 소중히 여겨야 합니다."
 CZE_new_social_program: "새로운 사회 프로그램"
 CZE_new_social_program_desc: "국민에게 더 넓은 사회 안전망을 제공해야 합니다."
 CZE_more_ecological_fuel_and_energy: "더 친환경적인 연료와 에너지"
 CZE_more_ecological_fuel_and_energy_desc: "시대가 변하고 있으며, 발전소에서 더 친환경적인 연료를 사용하기 시작해야 합니다."
 CZE_less_crowded_cities: "덜 붐비는 도시"
 CZE_less_crowded_cities_desc: "최근 몇 년간 도시가 과밀해졌으며 이에 대해 조치를 취해야 합니다."
 CZE_further_nuclear_power_plants_expansion: "원자력 발전소 추가 확장"
 CZE_further_nuclear_power_plants_expansion_desc: "두코바니와 테멜린은 믿을 만한 에너지원임이 입증되었으므로 이들을 확장해야 합니다."
 CZE_back_into_parliament: "의회로의 복귀"
 CZE_back_into_parliament_desc: "파벨 벨로브라데크가 해냈고, 우리는 의회로 돌아왔습니다. 당분간 그를 유지해야 합니다."
 CZE_kducsl_2013_program_idea: "§3KDU-ČSL§! - 2013년 강령"
 CZE_cssd_and_ano_coalition: "CSSD·ANO 연립"
 CZE_kducsl_2017_program_idea: "§3KDU-ČSL§! - 2017년 강령"
 CZE_marian_jurecka_idea: "§3KDU-ČSL§! - 마리안 유레치카 "
 CZE_marian_jurecka_warning: "§R§Y마리안 유레치카§!가 지도자에서 물러나면, 이후 모든 §YKDU-ČSL§! 중점의 긍정적 효과가 절반이 되며 정치력을 잃게 됩니다.§!"
 CZE_cssd_and_ano_coalition_desc: "나지오바 사건 이후 정부에 대한 신뢰를 회복해야 하며, 우리 동맹들이 이를 도울 것입니다. "
 CZE_succes_in_eu_elections: "EU 선거"
 CZE_succes_in_eu_elections_desc: "유럽 의회 선거는 우리에게 좋은 결과였습니다. 이는 국내에서 우리에게 지지를 가져다줄 것입니다."
 CZE_new_ministers_of_culture_and_agriculture: "신임 문화부·농업부 장관"
 CZE_new_ministers_of_culture_and_agriculture_desc: "다니엘 헤르만과 마리안 유레치카가 우리의 새 장관이 될 것입니다."
 CZE_climate_change_prevention: "기후 변화 방지"
 CZE_climate_change_prevention_desc: "급속히 악화되고 있는 기후를 지켜야 하며, 예방에 투자합시다."
 CZE_leadership_of_marek_vyborny_and_marian_jurecka: "지도자 마레크 비보르니와 마리안 유레치카"
 CZE_leadership_of_marek_vyborny_and_marian_jurecka_desc: "마레크 비보르니와 마리안 유레치카가 우리 당을 새로운 시대로 이끌 것입니다."
 CZE_take_care_of_environment: "환경 보호"
 CZE_support_families: "가족 지원"
 CZE_support_families_desc: "가족은 우리 사회의 근간이며, 이를 지원하는 것이 우리의 최우선 과제여야 합니다."
 CZE_support_families_idea: "§3KDU-ČSL§! - 가족 지원"
 CZE_take_care_of_agriculture: "농업 보호"
 CZE_take_care_of_agriculture_desc: "농업은 우리 경제의 큰 부분을 차지하므로 이를 확대해야 합니다."
 CZE_extend_social_program: "확대된 사회 프로그램"
 CZE_extend_social_program_desc: "국민에 대한 지원 수준을 더욱 확대해야 합니다."
 CZE_prepare_for_the_together_coalition: "스폴루 연합 준비"
 CZE_prepare_for_the_together_coalition_desc: "스폴루(Together)는 바비시를 꺾을 수 있는 우리의 유일한 희망이므로 합류해야 합니다."
 CZE_ods_program: "ODS 강령"
 CZE_ods_program_desc: "ODS의 강령은 시민 복지, 감세, 국제 무대에서 강력한 국가적 입지 구축을 지향합니다. 그들의 민주주의 가치는 KDU-ČSL과 같은 무소속 정당들의 관심을 끕니다. 그러나 주요 경쟁 상대는 ČSSD와 KSČM입니다."
 CZE_reforms_in_national_budget: "국가 예산 개혁"
 CZE_reforms_in_national_budget_desc: "국가 예산이 줄어들고 있습니다. 우리의 부채는 여전히 매우 높으며, 이 상황에 대해 마침내 조치를 취해야 합니다."
 CZE_decrease_debt: "부채 감축"
 CZE_decrease_debt_desc: "국가 부채를 줄일 때입니다. ČSSD에는 그들만의 방식이 있지만 우리의 전략도 효과가 있을 것입니다."
 CZE_fight_ctyrkoalice_effort: "추티르코알리체의 노력에 맞서기"
 CZE_fight_ctyrkoalice_effort_desc: "추티르코알리체(Čtyřkoalice)는 점점 더 강해지고 있습니다. 이는 의회에서의 우리의 안정적인 입지를 위협하고 있으며, 맞서지 않으면 다가오는 선거에서 지지를 크게 잃을 수 있습니다."
 CZE_increae_social_spending: "사회 지출 증대"
 CZE_increae_social_spending_desc: "우리의 기본 목표 중 하나는 시민의 복지를 높이는 것입니다. 사회 지출을 늘려 더 많은 사람을 우리나라로 끌어들일 것입니다."
 CZE_benefits_from_work: "노동의 혜택"
 CZE_benefits_from_work_desc: "노동은 생산성을 높이고, 생산성은 복지를 높이며, 복지는 노동을 더 쉽게 만듭니다. 알아야 할 것은 그것이 전부입니다."
 CZE_tax_reform: "세제 개혁"
 CZE_tax_reform_desc: "현재의 조세 제도는 비효율적이고 느립니다. 이 부문을 개혁하면 행정 서비스를 가속하고 국민을 더 행복하게 할 수 있습니다."
 CZE_progress_towards_privatization: "민영화 진전"
 CZE_progress_towards_privatization_desc: "우리의 민영화 계획은 매우 순조롭습니다. 몇 년 안에 마무리하여 마침내 이 문제에서 벗어나야 합니다. 공산주의자들이 우리의 노력을 늦추려 할 수 있지만 이제는 완전히 막을 수 없습니다."
 CZE_limited_eu_trust: "EU에 대한 제한적 신뢰"
 CZE_limited_eu_trust_desc: "유럽 연합은 완벽과는 거리가 멉니다. 때로는 각국이 자국 헌법에 무엇을 담아야 하는지까지 지시합니다. 이는 우리의 독립을 훼손할 수 있으며, 이 기구가 그렇게 하도록 내버려 둘 수 없습니다."
 CZE_advantages_of_nato_membership: "NATO 가입의 이점"
 CZE_advantages_of_nato_membership_desc: "유럽은 오늘날보다 더 안정된 적이 없었습니다. NATO가 여기에 큰 역할을 했으며, 그렇기에 어떤 일이 있어도 그들과 함께해야 합니다."
 CZE_strong_and_independent_country: "강하고 독립적인 국가"
 CZE_strong_and_independent_country_desc: "외부의 위협에도 불구하고 우리는 강해야 합니다. EU나 다른 기구들이 우리의 정신에 파고들어 은밀히 우리 국가에 영향을 미치도록 내버려 둘 수 없습니다."
 CZE_leadership_of_mirek_topolanek: "미레크 토폴라네크의 지도부"
 CZE_leadership_of_mirek_topolanek_desc: "미레크 토폴라네크는 자신의 지도부 아래에서 매우 심각한 상황에 직면하게 될 것입니다. 유럽 의회 선거와 지방 선거가 다가오고 있으며, ODS는 가능한 한 많은 지지를 얻기 위해 모든 노력을 기울여야 합니다. 그러나 우리의 목표를 잊어서는 안 됩니다. 선거에서 이기려면 강령을 완수하여 국민을 만족시켜야 합니다."
 CZE_tightening_the_road_network: "도로망 정비"
 CZE_tightening_the_road_network_desc: "우리의 도로망은 훌륭하지만 추가 자금을 투입하여 더 개선할 수 있습니다. 우리는 그 투자를 감당할 수 있습니다."
 CZE_grants_for_network_infrastructure: "통신망 인프라 보조금"
 CZE_grants_for_network_infrastructure_desc: "인터넷은 빠른 속도로 발전하고 있습니다. 뒤처지지 않으려면 통신망 인프라의 효율을 높여야 합니다."
 CZE_vaclav_klaus_for_the_president: "대통령에 바츨라프 클라우스를!"
 CZE_vaclav_klaus_for_the_president_desc: "대통령 선거의 시간입니다. 바츨라프 클라우스가 우리 당을 대변하고 우리 국가를 이끌 후보가 될 것입니다."
 CZE_strengthening_position_in_czech_and_international_arena: "국제 무대에서의 입지 강화"
 CZE_strengthening_position_in_czech_and_international_arena_desc: "유럽 의회 선거가 임박했습니다. 우리 당의 인기를 높이면 성공 가능성이 크게 높아질 것입니다."
 CZE_results_of_the_2004_european_parliamnt_elections: "2004년 유럽 의회 선거"
 CZE_results_of_the_2004_european_parliamnt_elections_desc: "때가 왔습니다. 우리의 가장 큰 경쟁 상대는 여전히 ČSSD입니다. 이들을 꺾는다면 우리는 EU에서 상당한 힘을 얻게 될 것입니다."
 CZE_results_of_the_2004_senate_and_regional_elections: "2004년 상원 및 지방 선거"
 CZE_results_of_the_2004_senate_and_regional_elections_desc: "전략은 단순합니다. 수도와 도시화된 지역에서 우리의 인기를 높입니다. 그것이면 선거 강령을 완수하고 ČSSD를 이기기에 충분할 것입니다."
 CZE_increasing_value_of_the_party: "당의 가치 상승"
 CZE_increasing_value_of_the_party_desc: "이것으로 끝입니다. 우리는 선거를 통과했습니다. 결과가 어떠했든 뒤처지지 않도록 체코 의회에서의 입지를 계속 개선해야 합니다."
 CZE_increase_sense_of_security: "안보 의식 고취"
 CZE_increase_sense_of_security_desc: "우리나라는 안전하지만 건드릴 수 없다는 뜻은 아닙니다. 어떤 위협에도 항상 대비해야 합니다."
 CZE_more_effort_for_education_development: "교육 발전을 위한 더 큰 노력"
 CZE_more_effort_for_education_development_desc: "교육은 충분히 좋은 수준이지만 여전히 꽤 단순합니다. 오랜 공산 정권은 우리 공동체에 영향을 미쳤으며, 우리는 민주주의 가치를 그 어느 때보다 적극적으로 장려해야 합니다."
 CZE_start_the_new_era: "새 시대의 시작"
 CZE_start_the_new_era_desc: "체코 공화국에 새로운 시기가 시작되었습니다. 미레크 토폴라네크는 우리 당의 지도력을 이어 가며 새로운 강령을 시작할 준비가 되어 있습니다."
 CZE_invite_strana_zelenych: "녹색당 초청"
 CZE_invite_strana_zelenych_desc: "우리나라에서 가장 생태 문제에 집중하는 정당입니다. 그들의 견해는 우리 목표 중 일부와 맞으며, 그들을 연립에 초청하면 녹색 프로그램을 완수하는 데 도움이 될 것입니다."
 CZE_invite_kdu_csl: "KDU-CSL 초청"
 CZE_invite_kdu_csl_desc: "KDU-ČSL은 가족과 사회 부문에 대한 지지 기반이 두텁습니다. 그들은 우리가 나라 안의 가톨릭 가정에 다가가 그들 사이에서 지지를 높이도록 도울 것입니다."
 CZE_stabilize_the_coalition: "연립 안정화"
 CZE_stabilize_the_coalition_desc: "새로운 연립은 체계가 없습니다. 이를 유지하려면 연대 의식을 높여야 합니다."
 CZE_reform_of_czech_public_finances: "체코 공공 재정 개혁"
 CZE_reform_of_czech_public_finances_desc: "이 장은 끝난 줄 알았습니다. 그러나 재정 문제는 경제를 안정적으로 유지하기 위해 거듭 싸워야 하는 되풀이되는 문제입니다."
 CZE_reform_of_healthcare: "의료 개혁"
 CZE_reform_of_healthcare_desc: "우리는 의료에 너무 많은 돈을 쓰고 있으며, 좋은 의미가 아닙니다. 비효율적인 의료 체계와 오래전에 개선했어야 할 장비에 예산을 낭비하고 있습니다."
 CZE_grand_tax_reform: "대규모 세제 개혁"
 CZE_grand_tax_reform_desc: "좋습니다, 이번이 마지막입니다. 마침내 조세 문제를 없애고 우리 세제에 최종적인 해법을 도입할 때입니다."
 CZE_pension_reform: "연금 개혁"
 CZE_pension_reform_desc: "국민은 국가를 위한 복무에 대해 더 높은 혜택을 받아야 합니다. 우리는 그들에게 좋은 혜택을 부여할 것입니다."
 CZE_senate_elections: "상원 선거"
 CZE_senate_elections_desc: "또 다른 선거가 다가오고 있습니다. ČSSD의 인기가 빠르게 오르고 있으며, 이는 오직 한쪽만 성공할 수 있는 큰 싸움이 될 것입니다."
 CZE_stop_the_critics: "비판 잠재우기"
 CZE_stop_the_critics_desc: "ČSSD는 포기하지 않았고 비난이 우리 당을 강타했습니다. 이에 맞서려면 막대한 정치력이 필요합니다."
 CZE_speak_against_cssd: "ČSSD 규탄"
 CZE_speak_against_cssd_desc: "이번에는 우리가 ČSSD를 칠 차례입니다. 그들의 지지와 여론을 깎아내려 새로운 유권자층을 얻을 것입니다."
 CZE_leadership_of_petr_necas: "페트르 네차스의 지도부"
 CZE_leadership_of_petr_necas_desc: "농업 체계와 녹색 에너지를 돌볼 때입니다. 페트르 네차스가 우리 정부를 바꾸고 이 강령을 실현하기 시작할 것입니다."
 CZE_tomas_chalupa_new_minister_of_the_environment: "토마시 찰루파 환경부 장관"
 CZE_tomas_chalupa_new_minister_of_the_environment_desc: "토마시 찰루파는 우리의 녹지가 변함없이 유지되고 녹색 에너지 개발이 순조롭게 진행되도록 할 것입니다. 가능한 한 빨리 석탄을 에너지원으로 사용하는 것을 중단하는 것이 우리에게 중요합니다."
 CZE_yet_another_renewable_energy_program: "또 하나의 재생 에너지 프로그램"
 CZE_yet_another_renewable_energy_program_desc: "다른 정당들도 이런 일을 하고 있지만, 그렇다고 우리가 하지 않아도 되는 것은 아닙니다. 이는 정치 분야에서 우리의 가장 보편적인 목표 중 하나이며, 이 분야에서 진전을 이루기 위해 모든 노력을 기울일 것입니다."
 CZE_transport_sector_renovation: "교통 부문 개보수"
 CZE_transport_sector_renovation_desc: "우리의 철도와 도로 가운데 일부는 손상되었거나 낡았습니다. 이를 정비하고 현재의 기준에 맞게 개선할 것입니다."
 CZE_coalition_with_top_09_and_veci_verejne: "TOP 09 및 공공 현안당과의 연립"
 CZE_coalition_with_top_09_and_veci_verejne_desc: "새 선거는 새 동맹을 의미합니다. 이번에는 TOP 09 및 공공 현안당(Věci veřejné)과 의회에서 협력하게 될 것입니다."
 CZE_reduce_the_number_of_ministries: "부처 수 감축"
 CZE_reduce_the_number_of_ministries_desc: "부처가 너무 많습니다. 일부를 통합하면 관료제 문제를 줄이고 행정 서비스를 가속할 수 있습니다."
 CZE_petr_bendl_new_minister_of_the_agriculture: "페트르 벤들 신임 농업부 장관"
 CZE_petr_bendl_new_minister_of_the_agriculture_desc: "페트르 벤들은 다른 누구보다 농촌 지역을 아끼는 정치인입니다. 그의 도움으로 오랫동안 무시되어 온 많은 문제를 해결하고, 함께 작동해야 할 체계가 너무 많은 문제도 마무리할 수 있을 것입니다."
 CZE_rural_development_program: "농촌 개발 프로그램"
 CZE_rural_development_program_desc: "먼저 홍수나 가뭄의 위험과 같은 문제를 바로잡아야 합니다. 이는 농장과 경작지의 상황을 개선할 것입니다."
 CZE_connect_the_agriculture_system_together: "농업 체계의 통합"
 CZE_connect_the_agriculture_system_together_desc: "불필요하게 복잡한 농업 체계를 없애고, 농촌 지역의 모든 측면을 돌보는 새로운 체계 하나를 만들 때입니다."
 CZE_leadership_of_petr_fiala: "페트르 피알라의 지도부"
 CZE_leadership_of_petr_fiala_desc: "페트르 피알라의 시대가 시작되었습니다. 전국적 개혁과 원자력 에너지 노력에 기반한 최신 선거 강령을 완수하는 것부터 시작하여, 전력과 결의를 다해 정치 무대에 복귀할 때입니다."
 CZE_refuse_the_eurozone: "유로존 거부"
 CZE_refuse_the_eurozone_desc: "안정적인 체코 코루나(česká koruna)는 우리나라의 유일한 공식 통화입니다. 유로존은 우리의 독립을 해치고 유럽 연합의 더 엄격한 통제를 받게 할 것입니다."
 CZE_back_to_game: "다시 경기장으로"
 CZE_back_to_game_desc: "ČSSD는 이전에 우리의 평판에 큰 타격을 입혔습니다. 우리 당은 위기 직전까지 갔지만 어려운 시기를 견뎌 냈고 그 어느 때보다 강해져서 돌아왔습니다!"
 CZE_joint_ministers_of_economy: "경제 장관 연합"
 CZE_joint_ministers_of_economy_desc: "이전 강령의 연장선입니다. 이번에는 경제 부문에 손을 뻗어 경제 장관들을 모두 하나로 묶을 것입니다. 이 목표는 거의 마무리되었으며, 한 걸음만 더 나아가면 됩니다."
 CZE_reform_mining_sector: "광업 부문 개혁"
 CZE_reform_mining_sector_desc: "우리의 자원은 한정되어 있는데 그 상당수가 해외 시장으로 수출되고 있습니다. 이에 대해 조치를 취해야 합니다."
 CZE_finish_the_highway_network_program: "고속도로망 프로그램 완수"
 CZE_finish_the_highway_network_program_desc: "이 프로그램은 수년 전에 시작되었으며 마침내 마무리되려 하고 있습니다. 새 고속도로는 자동차로 이동하는 거리를 줄이고 그 결과 연료 사용량도 감소시킬 것입니다."
 CZE_nuclear_not_solar_or_water_energy: "태양광이나 수력이 아닌 원자력"
 CZE_nuclear_not_solar_or_water_energy_desc: "원자력은 현재 우리가 확보할 수 있는 최고의 에너지원입니다. 이것이 우리의 우선순위여야 합니다."
 CZE_slusny_lidr_dobry_program_silna_pravice: "좋은 지도자, 올바른 강령, 강력한 우파"
 CZE_slusny_lidr_dobry_program_silna_pravice_desc: "좋은 지도자, 올바른 강령, 강력한 우파. 이는 우리가 선거에서 많은 표를 얻을 수 있게 해 준 지난 선거 구호였습니다. 우리가 그 말을 할 때 거짓말하지 않았음을 국민에게 보여 줍시다."
 CZE_stop_the_construction_delays: "공사 지연 중단"
 CZE_stop_the_construction_delays_desc: "건설 현장은 여러 이유로 많은 지연을 겪고 있습니다. 추가 지연을 막고 신축 건물의 건설을 앞당기도록 노력할 것입니다."
 CZE_fight_the_breaking_law_ecological_activists: "법을 어기는 환경 운동가에 대한 대응"
 CZE_fight_the_breaking_law_ecological_activists_desc: "일부 환경 운동가들이 환경에 대한 '존중'을 보여 주겠다며 법을 어기기 시작했습니다. 이는 중단되어야 합니다!"
 CZE_intelligent_cities_program: "스마트 도시 프로그램"
 CZE_intelligent_cities_program_desc: "우리는 21세기의 두 번째 십 년에 가까워지고 있습니다. 기술은 새천년 초보다 훨씬 발전했으며, 이를 활용해 가장 큰 도시들을 그 어느 때보다 앞선 곳으로 만들 것입니다."
 CZE_more_efficient_waste_management: "더 효율적인 폐기물 관리"
 CZE_more_efficient_waste_management_desc: "불법 폐기물 투기를 없애고 폐기물을 보관할 장소를 더 지을 때입니다. 우리나라를 더 깨끗하고 살기 좋은 곳으로 만들 것입니다."
 CZE_use_new_technology_to_respect_the_environmental_laws: "기술로 환경법 준수"
 CZE_use_new_technology_to_respect_the_environmental_laws_desc: "첨단 기술을 말하자면, 많은 오염을 일으키는 석유 구동 기계의 해로운 환경 영향을 줄이는 데에도 이를 활용할 수 있습니다."
 CZE_preparations_for_the_together_coalition: "스폴루 연합 준비"
 CZE_preparations_for_the_together_coalition_desc: "스폴루(TOGETHER) 연합은 의회에서 권력을 유지하고 강력하고 안정적인 정부를 단번에 세우기 위한 우리의 가장 위대한 전략이 될 것입니다."
 CZE_limit_the_officials_power_on_private_property: "사유 재산에 대한 관료 권한 제한"
 CZE_limit_the_officials_power_on_private_property_desc: "사람들이 자기 재산으로 할 수 있는 일이 지나치게 제한되어 있습니다. 관료들의 권한 일부를 줄여 이들을 압박에서 벗어나게 할 것입니다."
 CZE_path_towards_european_union: "유럽 연합으로 가는 길"
 CZE_path_towards_european_union_desc: "우리는 이 모임에 가입하는 것을 목표로 삼아야 합니다. 그 전에 새 법률을 채택하고 몇 가지 중요한 개혁을 단행하여 EU 회원국들이 우리의 후보 지위를 받아들일 가능성을 높여야 합니다."
 CZE_prepare_for_the_new_law: "새 법률 준비"
 CZE_prepare_for_the_new_law_desc: "그럼 새로운 EU 법률을 채택하는 것부터 시작합시다. 여기에는 우리나라에 다소 해가 되는 많은 개혁이 포함되지만 최종 결과를 위해 감수할 만한 어려움입니다."
 CZE_visit_to_brussels: "브뤼셀 방문"
 CZE_visit_to_brussels_desc: "벨기에의 수도를 방문하여 더 많은 호응을 얻을 수 있습니다. 이 임무가 성공하도록 외무장관을 파견할 것입니다. 어떤 실수도 용납할 수 없습니다."
 CZE_start_the_reforms: "개혁 시작"
 CZE_start_the_reforms_desc: "우리는 현행법의 개혁을 시작할 준비가 되었습니다. 헌법을 어기지 않는 것은 어려운 일이겠지만, 모두를 만족시키기 위해 모든 노력을 다할 것입니다."
 CZE_courts_reform: "사법부 개혁"
 CZE_courts_reform_desc: "우리에게는 척결해야 할 부패가 있습니다. 법원과 부패한 판사들부터 시작하면 EU 통합에서 더 나아갈 수 있을 것입니다."
 CZE_administration_problem: "행정 문제"
 CZE_administration_problem_desc: "새 법률의 도입은 사무 부문에 많은 문제를 일으킵니다. 혼란을 막기 위해 업무 조직 방식을 바꾸고 새 컴퓨터 장비를 설치하여 전체 절차를 가속할 것입니다."
 CZE_ecological_innovations: "친환경 혁신"
 CZE_ecological_innovations_desc: "유럽 연합은 생태적 안정을 유지하고 회원국들 사이에서 친환경 행동을 천명하기 위해 강력히 노력합니다. 우리는 이러한 발전 방식에 적응해야 합니다."
 CZE_reduce_the_corruption: "부패 척결"
 CZE_reduce_the_corruption_desc: "우리나라에서 부패를 없앨 때입니다. 부패 없이도 살 수 있으며 더욱 멀리, 더 훌륭하게 발전할 수 있음을 EU에 보여 줍시다."
 CZE_country_wide_referendum: "전국 국민 투표"
 CZE_country_wide_referendum_desc: "유럽 연합 회원국들에게 받아들여지기 전에 먼저 우리 시민들에게 받아들여져야 합니다. 국민이 그 일부가 되기를 원하지 않는다면 EU에 가입할 이유가 없습니다."
 CZE_increased_role_of_the_strana_zelenych_party: "§7녹색당(Strana Zelených)§!의 역할 확대"
 CZE_increased_role_of_the_strana_zelenych_party_desc: "우리나라의 주요 친환경 정당은 녹색당(Strana Zelených)입니다. 그들의 강령에 귀 기울이고 이를 완수하기 시작한다면 그들의 지지를 얻고 EU에 한 걸음 더 가까워질 것입니다."
 CZE_eu_candidate: "EU 후보국"
 CZE_eu_candidate_desc: "오랜 시간이 흐른 끝에 공식 EU 후보국이 될 때가 되었습니다. 유럽 연합이 새로운 국가를 초청할 준비를 하고 있다고 들었으며, 우리가 그 단계를 밟을 준비가 되었음을 보여 줍시다."
 CZE_2002_political_rotation: "2002년 정권 교체"
 CZE_2002_political_rotation_desc: "2002년 선거에서 가장 큰 승자는 민주주의 정당 ČSSD였으며, 다시 한번 주요 경쟁 상대 ODS보다 한 걸음 앞섰습니다. ČSSD는 KDU-ČSL 및 US-DEU와 연립을 구성했습니다."
 CZE_2006_elections_result: "2006년 선거 결과"
 CZE_2006_elections_result_desc: "이번에는 선거 며칠 전에 발생한 큰 스캔들로 인해 ČSSD가 부패와 경찰 수사 개입 혐의를 받았습니다. 그래도 매우 높은 득표율을 얻었지만 2006년 선거의 승자인 ODS를 꺾기에는 충분하지 않았습니다. ODS는 KDU-ČSL, 녹색당(Strana Zelených)과 손을 잡았고, ČSSD는 공산주의 정당 KSČM과의 협력을 이어 갔습니다."
 CZE_2010_elections_result: "2010년 선거 결과"
 CZE_2010_elections_result_desc: "ČSSD가 다시 한번 근소한 과반으로 ODS에 이어 집권당이 되었습니다. 이전에는 두 정당의 인기가 30~40% 범위에 머물렀지만 이번에는 ČSSD가 겨우 22%, ODS가 20%의 표를 얻었습니다. 이 와중에 새로 창당한 TOP 09가 16%의 득표율로 3위를 차지하며 체코 공화국에서 급속히 인기 있는 정당이 되었습니다."
 CZE_2013_elections_result: "2013년 선거 결과"
 CZE_2013_elections_result_desc: "이번 선거는 ODS에게 매우 나쁘게 끝났으며, 전체 득표의 7%에 그쳤습니다. 이는 현대사에서 최악의 성적이었습니다. 국민은 다시 한번 ČSSD를 신뢰했습니다. 선거 전에 새 정당 ANO 2011이 창당되었습니다. ANO는 상당한 인기를 얻어 2013년 총선에서 ČSSD에 불과 2% 뒤진 2위로 끝났습니다. 3위는 14%를 득표한 KSČM이었습니다."
 CZE_2017_elections_result: "2017년 선거 결과"
 CZE_2017_elections_result_desc: "이번에는 전례 없는 일이 일어났습니다. 7년 전에 창당한 정당 ANO가 경쟁자들을 완전히 압도하여 전체 득표의 거의 30%를 얻은 반면, 두 번째로 큰 정당 ODS는 11%에 그쳤습니다. 해적당도 인기가 크게 올라 득표율이 8%포인트 상승하여 10%로 마무리했습니다. ČSSD와 KSČM은 각각 7%를 얻는 데 그쳤습니다."
 CZE_2021_elections_result: "2021년 선거 결과"
 CZE_2021_elections_result_desc: "이번에 ANO는 27.13%의 득표율로 마무리했습니다. 불행히도 이는 2위에 그치기에 충분한 수준이었습니다. 압도적인 ANO의 인기에 대응하여 ODS는 KDU-ČSL, TOP 09와 함께 SPOLU(체코어로 TOGETHER)라는 동맹을 결성했습니다. 이 연합은 27.79%의 득표율로 0.66%의 근소한 차이로 선거에서 승리할 만큼 강력했습니다. SPOLU는 2024년 현재에도 존재하며, 퇴역 군 장성 페트르 파벨의 대통령 출마를 지지했습니다."
 CZE_cssd_program: "CSSD 강령"
 CZE_cssd_program_desc: "ČSSD의 일반 강령은 (거의 모든 다른 정당과 마찬가지로) 지출의 균형을 맞추고 경제에 투자하며 사회 복지를 늘리는 것입니다. 공산주의 정당 KSČM과 좋은 관계를 유지하며 케인스주의의 원칙을 따릅니다. 가장 큰 경쟁 상대는 또 다른 민주주의 정당인 ODS입니다."
 CZE_stay_close_with_the_communists: "공산주의자들과의 긴밀한 관계 유지"
 CZE_stay_close_with_the_communists_desc: "ČSSD는 사회민주주의 정당입니다. 공산주의자들과 마찬가지로 사회 예산을 대폭 늘리기를 원하며, 두 정당은 ANO의 인기로 ČSSD가 그들과 KSČM 중에서 선택해야 할 때까지 매우 오랫동안 서로 협력했습니다."
 CZE_keynesianism: "케인스주의"
 CZE_keynesianism_desc: "케인스주의는 경제 성장을 높이고 안정적인 발전을 유지하기 위해 국가 지출을 늘리는 것을 지향합니다. ČSSD는 그 원칙을 강하게 따르며 이를 자신들의 발전 강령에 통합했습니다."
 CZE_nato_diplomacy: "NATO 외교"
 CZE_nato_diplomacy_desc: "NATO는 유럽을 그 어느 때보다 하나로 묶는 강력한 동맹입니다. 전쟁의 시대는 마침내 끝났으며 국가들은 군수 산업 대신 민간 경제를 발전시킬 수 있습니다. 그러나 이러한 동맹이 있더라도 경계를 늦춰서는 안 되며, 파트너들의 도움을 받아 항상 방어에 대비해야 합니다."
 CZE_progressive_taxes: "누진세"
 CZE_progressive_taxes_desc: "우리나라의 조세 제도는 구식입니다. 공산 정권의 잔재가 아직 남아 있으며, 이를 처리할 사람은 바로 우리입니다."
 CZE_turn_for_mixed_economy: "혼합 경제로의 전환"
 CZE_turn_for_mixed_economy_desc: "우리 경제는 슈코다(Škoda) 사가 지배하는 자동차 산업에 크게 의존하고 있습니다. 오늘날까지는 충분했지만, 미래를 내다보고 다른 상품의 첨단 생산을 시작해야 합니다."
 CZE_question_us_politics: "미국 정치에 대한 의문"
 CZE_question_us_politics_desc: "미국은 자신들만의 게임을 하고 있습니다. 이는 명백합니다. 그들은 안정과 평화를 유지하려 하지만, 과연 그들이 정말로 결백한 참가자일까요?"
 CZE_bank_tax: "은행세"
 CZE_bank_tax_desc: "은행은 지나치게 많은 자유를 누리고 있습니다. 활동 범위를 제한하기 위해 은행에 추가 세금을 부과할 것입니다."
 CZE_make_use_of_the_economic_boom: "경제 호황의 활용"
 CZE_make_use_of_the_economic_boom_desc: "우리나라는 마침내 경제 호황을 맞고 있습니다. 이는 국가 부채를 줄일 절호의 기회입니다."
 CZE_keep_economy_stable: "경제 안정 유지"
 CZE_keep_economy_stable_desc: "우리는 경제 호황을 맞고 있지만 예상보다 빨리 끝날 것입니다. 경제 속도를 늦추고 다가올 몇 해를 위한 계획을 세워 생산성 증가가 더 오래 지속되도록 하는 것이 낫습니다."
 CZE_stop_the_growing_debt: "늘어나는 부채 억제"
 CZE_stop_the_growing_debt_desc: "경제 호황 덕분에 일부 부채를 갚을 수 있습니다. 이는 체코 공화국을 완전히 독립시키기 위한 또 하나의 걸음입니다."
 CZE_continuation_of_social_funding: "사회 재정 지원의 지속"
 CZE_continuation_of_social_funding_desc: "우리의 변함없는 목표 중 하나입니다. 복지 국가를 향한 진전을 이어 갑니다."
 CZE_promote_pro_ecological_activities: "친환경 활동 장려"
 CZE_promote_pro_ecological_activities_desc: "이는 우리의 주요 목표는 아니지만, 우리가 여전히 생태를 중시한다는 것을 유권자들에게 보여 주는 것은 언제나 좋은 일입니다. 어떻게 보든 식량과 기타 재화를 공급하는 농민들이 국가의 근간입니다."
 CZE_european_parliament_elections: "유럽 의회 선거"
 CZE_european_parliament_elections_desc: "또 한 번의 선거 시간입니다. 이번에는 유럽 의회 선거입니다. 우리는 경쟁자들을 손쉽게 제치고 좋은 의석을 얻을 수 있을 것입니다."
 CZE_vladimir_spidl_leaves_party: "블라디미르 슈피들라 탈당"
 CZE_vladimir_spidl_leaves_party_desc: "일어날 일이 일어났습니다. 그가 그리울 것입니다. 하지만 ODS가 여전히 바짝 뒤쫓고 있으므로 당장은 다른 지도자를 선택해야 합니다."
 CZE_victory_of_vladimir_spidl: "블라디미르 슈피들라의 승리"
 CZE_victory_of_vladimir_spidl_desc: "뜻밖에도 블라디미르 슈피들라가 선거에서 승리하여 지도력을 유지했습니다. 대규모 외교 행동의 시간입니다."
 CZE_stanislav_gross_as_a_new_leader: "스타니슬라프 그로스, 새 지도자"
 CZE_stanislav_gross_as_a_new_leader_desc: "스타니슬라프 그로스가 우리 당의 새 지도자로 선출되었습니다. 그가 당을 어떻게 이끌지 지켜볼 것입니다."
 CZE_grand_eu_integration: "대규모 EU 통합"
 CZE_grand_eu_integration_desc: "블라디미르 슈피들라의 첫 결정 중 하나는 EU 회원국들 사이에서 인기를 높이는 것입니다. 그들과 좋은 관계를 유지하는 것은 우리 당뿐만 아니라 우리나라에도 좋은 선택입니다."
 CZE_appreciation_of_british_politics: "영국 정치에 대한 평가"
 CZE_appreciation_of_british_politics_desc: "영국은 오늘날 정말 잘하고 있습니다. 그들을 본보기로 삼아 같은 길을 가야 합니다."
 CZE_distancing_from_kscm: "KSČM과의 거리 두기"
 CZE_distancing_from_kscm_desc: "이전 지도자들은 공산당과 지나치게 연결되어 있었습니다. 그들과의 관계를 끊으면 우리 당에 더 이익이 될 것입니다."
 CZE_increasing_czech_position_on_the_international_arena: "국제 무대에서 체코의 입지 강화"
 CZE_increasing_czech_position_on_the_international_arena_desc: "유럽 연합은 시작에 불과했습니다. 더 멀리 나아가 다른 대륙들과의 협정을 모색할 때입니다."
 CZE_shifts_in_economy_development: "경제 발전 방향의 전환"
 CZE_shifts_in_economy_development_desc: "케인스주의는 좋지만 노력한다면 더 잘 활용할 수 있습니다. 다소 논쟁의 여지가 있지만 괜찮을 것이라 확신합니다."
 CZE_open_up_for_foreign_investors: "외국인 투자자에게 문호 개방"
 CZE_open_up_for_foreign_investors_desc: "체코 공화국은 발달한 자동차 산업과 개발로 알려져 있습니다. 이는 막대한 자금을 가진 수많은 외국인 투자자를 끌어들입니다. 우리는 그들을 두 팔 벌려 환영할 것입니다."
 CZE_stanislav_gross_keeps_power: "스타니슬라프 그로스의 권력 유지"
 CZE_stanislav_gross_keeps_power_desc: "스타니슬라프 그로스의 최근 행보와 논란도 그가 우리 당의 지도자로 남는 것을 막지 못했습니다. 앞으로 어떻게 될지 지켜볼 것입니다."
 CZE_leadership_of_jiri_paroubek: "이르지 파로우베크의 지도부"
 CZE_leadership_of_jiri_paroubek_desc: "최근의 몇 가지 논란과 사생활 문제로 스타니슬라프 그로스는 지도자 자리에서 물러나야 했습니다. 이르지 파로우베크가 우리 당의 새 지도자로 선출되었습니다."
 CZE_restore_the_kscm_support: "KSČM의 지지 복원"
 CZE_restore_the_kscm_support_desc: "스타니슬라프 그로스가 KSČM과의 관계를 끊기 시작한 것은 실수였습니다. 우리에게는 새 지도자와 새 강령이 있으며, 이는 새로운(옛) 동맹을 의미하기도 합니다."
 CZE_accept_the_fate: "운명의 수용"
 CZE_accept_the_fate_desc: "어쩌다 ODS가 2006년 총선에서 ČSSD를 꺾었습니다. 세상의 끝은 아닙니다. ČSSD는 여전히 매우 인기 있는 정당이며 자신의 강령을 계속 추진할 것입니다."
 CZE_program_of_the_opposition: "야당의 강령"
 CZE_program_of_the_opposition_desc: "그렇다면 야당이 내릴 수 있는 결정은 무엇일까요? 아마 집권당만큼 중요하지는 않을 것입니다. 중요하면서도 감당할 수 있는 일에 초점을 맞춰야 합니다."
 CZE_decrease_corruption: "부패 감소"
 CZE_decrease_corruption_desc: "부패는 거의 모든 나라가 겪는 되풀이되는 문제입니다. 언제든 이에 맞설 준비가 되어 있어야 합니다."
 CZE_short_term_stagnation: "단기 침체"
 CZE_short_term_stagnation_desc: "우리 경제는 순조롭지만 위험할 정도로 나빠진다 해도 약간의 운만 따르면 되살릴 수 있을 것입니다."
 CZE_investitions_in_infrastructure: "인프라 투자"
 CZE_investitions_in_infrastructure_desc: "도로망 체계의 또 다른 개선입니다. 이 도로들은 고속도로를 여러 새로운 지점에서 연결하고 이동 시간을 단축할 것입니다."
 CZE_senate_elections_cssd: "상원 선거"
 CZE_senate_elections_cssd_desc: "드디어 왔습니다. 우리 대 ODS입니다. 그들을 꺾고 다시 상원 선거에서 승리할 또 한 번의 기회입니다."
 CZE_in_your_face_ods: "ODS, 똑똑히 보아라!"
 CZE_in_your_face_ods_desc: "우리는 이 경주에서 ODS를 앞지르는 데 성공했고 결승선까지는 곧은 길뿐입니다."
 CZE_back_to_form: "제 모습으로 복귀"
 CZE_back_to_form_desc: "총선에서의 패배는 단 한 번의 실수에 불과했습니다. 다시 진정한 행동에 나설 때입니다."
 CZE_distrust_the_government: "정부에 대한 불신"
 CZE_distrust_the_government_desc: "ODS는 자신들의 정치인 일부를 새 정부에 앉히는 데 성공했습니다. 그들을 믿어야 할까요? 그렇지 않다고 생각합니다."
 CZE_leadership_of_bohuslav_sobotka: "보후슬라프 소보트카의 지도부"
 CZE_leadership_of_bohuslav_sobotka_desc: "이르지 파로우베크의 시대는 끝났습니다. 보후슬라프 소보트카가 우리의 지도자가 될 때입니다."
 CZE_finish_new_highway_construction: "신규 고속도로 건설 완료"
 CZE_finish_new_highway_construction_desc: "새 고속도로는 아주 오랫동안 건설 중이었습니다. 이는 여러 정당 및 기업과의 협력을 필요로 했습니다. 마지막 몇 킬로미터를 마무리하고 새 고속도로를 개통할 때입니다."
 CZE_reduce_resource_extraction_cssd: "자원 채굴 감축"
 CZE_reduce_resource_extraction_cssd_desc: "자원 채굴은 환경을 파괴하고 있습니다. 그 외에도 자원 사용을 제한적으로 유지해야 합니다. 자원 관리에 몇 가지 변화를 도입할 때입니다."
 CZE_water_resource_will_stay_with_the_state: "수자원은 국가가 보유한다"
 CZE_water_resource_will_stay_with_the_state_desc: "물의 가격을 정하는 것은 우리입니다. 그 기업들을 민간 소유로 매각하면 어려운 시기에 가격이 폭등할 수 있습니다."
 CZE_research_new_renewable_energy_power_generators: "신규 재생 에너지 발전기"
 CZE_research_new_renewable_energy_power_generators_desc: "재생 에너지 프로그램을 계속할 때입니다. 태양광과 풍력 발전기를 살펴봅시다. 좋은 설비이지만 원자력 발전소에는 한참 못 미칩니다. 원자로보다 낫게 만들 수는 없지만 적어도 생산성은 높일 수 있습니다."
 CZE_speed_up_construction_of_new_nuclear_reactor: "신규 원자로 건설 가속"
 CZE_speed_up_construction_of_new_nuclear_reactor_desc: "자원 채굴을 줄이는 만큼 국가의 에너지 안보를 유지해야 합니다. 신규 원자로 사업을 검토할 것입니다."
 CZE_cleaner_air: "더 깨끗한 공기"
 CZE_cleaner_air_desc: "공기가 예전만큼 오염되지는 않았을지 모르지만 문제는 여전히 눈에 띕니다. 나무를 더 심고 위험한 오염을 제한해야 합니다."
 CZE_cssd_2013_program: "2013년 강령"
 CZE_cssd_2013_program_desc: "또 하나의 선거, 또 하나의 강령입니다. 이번에는 국가 이미지에 집중하고 새로운 연립을 구성합시다."
 CZE_wealth_tax: "부유세"
 CZE_wealth_tax_desc: "가장 부유한 시민들이 나라의 발전을 돕기 위해 자신의 돈을 나누기를 원치 않는다면 새로운 부유세를 도입할 것입니다. 이는 이 문제의 쉬운 해결책입니다."
 CZE_continue_churches_reparations: "교회 보상 지속"
 CZE_continue_churches_reparations_desc: "KDU-ČSL은 이 조치를 높이 평가할 것이며, 이는 공동 연립 구성에 한 걸음 가까워지게 해 줄 것입니다. 또한 우리 교회 중 일부는 상태가 매우 나쁩니다."
 CZE_ano_and_kducsl_coalition: "ANO·KDU-CSL 연립"
 CZE_ano_and_kducsl_coalition_desc: "새로운 동맹의 시간입니다. 젊은 ANO 당과 가장 오래된 정당 중 하나인 KDU-ČSL입니다. 이는 크게 실패할 수도, 우리 모두에게 큰 이익이 되며 성공할 수도 있는 흥미로운 조합입니다."
 CZE_higher_renewable_energy_expenditure: "재생 에너지 지출 확대"
 CZE_higher_renewable_energy_expenditure_desc: "이는 이전 강령의 직접적인 연장선입니다. 재생 에너지는 세계의 미래이며 석탄은 구시대의 자원입니다. 환경에 큰 해를 끼치는 요소에 언제까지나 매달릴 수는 없습니다."
 CZE_shut_down_the_neo_nazi_workers_party: "신나치 노동자당 해산"
 CZE_shut_down_the_neo_nazi_workers_party_desc: "그들은 도를 넘었습니다. 그 조직을 단번에 해체할 때입니다. 그 이념과 교리는 오래전에 우리나라에서 금지되었어야 했습니다!"
 CZE_reduce_flooding_risk: "홍수 위험 감소"
 CZE_reduce_flooding_risk_desc: "우리의 강은 때로 위험할 수 있으며, 그럴 때는 지역 주민들에게 큰 피해를 입힙니다. 이 공포를 끝내고 새로운 방재 체계를 마련할 때입니다."
 CZE_leadership_of_jan_hamacek: "얀 하마체크의 지도부"
 CZE_leadership_of_jan_hamacek_desc: "또 하루, 또 한 명의 지도자입니다. 얀 하마체크는 앞으로 몇 해 동안 매우 어려운 결정에 직면해야 할 것입니다. 그가 그 기간에 훌륭한 지도자가 되기를 바랍니다."
 CZE_increase_food_quality: "식품 품질 향상"
 CZE_increase_food_quality_desc: "기술이 발전하는 만큼 식품 품질은 꽤 더디게 개선되고 있습니다. 새로운 보조금이 이 과정을 가속할 것입니다."
 CZE_ano_over_communists: "공산주의자보다 ANO"
 CZE_ano_over_communists_desc: "마침내 KSČM과 결별하고 ANO와 함께할 때입니다. 그들은 이 나라의 미래이며 우리는 최고와만 함께할 것입니다."
 CZE_new_healthcare_budget_in_times_of_crisis: "위기 시의 새로운 의료 예산"
 CZE_new_healthcare_budget_in_times_of_crisis_desc: "결국 일이 벌어졌습니다. 인류 역사의 새로운 장이 시작되었습니다. 이 위기에 최선을 다해 맞서야 합니다."
 CZE_new_apartments_and_houses: "신규 아파트와 주택"
 CZE_new_apartments_and_houses_desc: "이 구상은 새로운 투자자와 우리나라에서 살고자 하는 사람들을 끌어들일 것입니다. 단순한 과제이지만 경제에는 매우 중요합니다."
 CZE_grants_for_novavax: "노바백스 보조금"
 CZE_grants_for_novavax_desc: "노바백스(Novavax)는 신규 백신 개발에서 우리를 선도하는 기업입니다. 어떤 돈이든 들일 가치가 있으며, 그래서 지금 우리의 지원이 절실히 필요합니다."
 CZE_security_funding: "안보 자금 지원"
 CZE_security_funding_desc: "시대가 다시 한번 불안정해지기 시작했습니다. 국방 예산을 챙기고 다가오는 위협에 대비할 때입니다."
 CZE_usdeu_program: "US-DEU 강령"
 CZE_usdeu_program_desc: "US-DEU의 강령은 자유주의 정책을 의미하며, 이는 정부 권력을 줄이고 더 많은 시민적 자유를 부여하는 것입니다. US-DEU는 공산주의 정당 KSČM과 거리를 두고 나라를 서서히 발전시키려 합니다."
 CZE_push_for_tax_reform: "세제 개혁 추진"
 CZE_push_for_tax_reform_desc: "우리는 정부 내에서 중요한 세력은 아니지만, 세제 개혁이 가능한 한 빨리 완수해야 할 일이라는 데는 모두 동의합니다. 이 개혁을 밀어붙이는 것은 바로 우리가 될 것입니다."
 CZE_stable_development: "안정적 발전"
 CZE_stable_development_desc: "경제를 지나치게 몰아붙일 필요는 없습니다. 경기 침체의 위험을 감수하느니 경제를 안정적으로 유지하는 편이 낫습니다."
 CZE_social_liberalism: "사회적 자유주의"
 CZE_social_liberalism_desc: "우리 국민은 정부가 얼마나 억압적이고 불공정할 수 있는지 압니다. 국가 권력을 제한하고 국민에게 더 많은 자유를 부여하는 것을 목표로 삼아야 합니다."
 CZE_democratic_spirit: "민주주의 정신"
 CZE_democratic_spirit_desc: "민주주의로 전환한 이후 우리나라는 꾸준히 성장하고 있습니다. 이러한 사고방식을 유지하고 우리가 가진 것에 감사해야 합니다."
 CZE_support_national_minority: "소수 민족 지원"
 CZE_support_national_minority_desc: "이전 국가는 체코 공화국의 소수 민족에게 그리 관대하지 않았습니다. 이들을 돕고 이민법을 완화하는 것이 우리의 역할입니다."
 CZE_kscm_issue: "KSCM 문제"
 CZE_kscm_issue_desc: "정부에 아직도 공산당이 있다는 것이 믿기지 않습니다. 과거에 우리가 겪었던 것 같은 억압적인 공산주의자들은 아니지만 여전히 우리 민주주의에 대한 위협입니다."
 CZE_promote_country_of_law_idea: "법치 국가 이념 장려"
 CZE_promote_country_of_law_idea_desc: "우리의 법과 헌법은 이 나라에서 가장 중요한 것입니다. 정부를 포함한 모든 사람이 이를 준수해야 합니다. 이것이 국가를 용인 가능한 범위 안에 두는 유일한 방법입니다."
 CZE_country_without_oppresion: "억압 없는 국가"
 CZE_country_without_oppresion_desc: "민주주의는 국민을 위해 만들어졌습니다. 그리고 국민은 그것이 자신들에게 안전한 이념임을 알아야 합니다. 국가를 안정적이고 안전하게 지키기 위해 경찰 지출을 늘릴 것입니다."
 CZE_fear_of_another_communist_regime: "또 다른 공산 정권에 대한 공포"
 CZE_fear_of_another_communist_regime_desc: "그러나 KSČM이 집권하는 데 성공한다면 어떻게 될까요? 우리의 민주주의 정신은 어떻게 될까요? 편히 잠들고 싶다면 그런 일이 일어나도록 내버려 둘 수 없습니다."
 CZE_western_view: "서방적 시각"
 CZE_western_view_desc: "우리는 유럽 연합 가입을 목표로 해야 합니다. 서방 국가들은 엄청나게 빠르게 발전하고 있으며, 그렇기에 그들의 생활 방식을 따라야 합니다."
 CZE_stabilize_the_situation: "상황 안정화"
 CZE_stabilize_the_situation_desc: "또 한 번의 선거가 끝났습니다. 더 좋을 수도 있었지만 지금 멈출 수는 없습니다. 나라를 위대하게 만들기 위해 해야 할 일이 아직 많습니다."
 CZE_reduce_effect_of_the_ctyrkoalice_split: "추티르코알리체 분열의 영향 완화"
 CZE_reduce_effect_of_the_ctyrkoalice_split_desc: "불행히도 추티르코알리체(Čtyřkoalice)는 오래 존속하지 못했습니다. 좋은 협력이었지만 그다지 성공적이지는 않았습니다. 어쨌든 우리의 인기에 흠집이 났으며 이를 바로잡아야 합니다."
 CZE_pavel_nemec_for_the_leader: "지도자에 파벨 네메츠"
 CZE_pavel_nemec_for_the_leader_desc: "파벨 네메츠를 다음 지도자로 선택합시다. 그는 경험이 많지 않지만 우리는 나라의 청년층에게 다가가야 합니다."
 CZE_preparations_for_the_2006_elections: "2006년 선거 준비"
 CZE_preparations_for_the_2006_elections_desc: "우리는 계속 인기를 잃고 있습니다. 좋지 않은 상황이니 이제 좀 더 파격적인 전략을 쓸 때일지도 모릅니다..."
 CZE_the_case_of_the_qatari_prince: "카타르 왕자 사건"
 CZE_the_case_of_the_qatari_prince_desc: "카타르 왕자가 우리 법을 어기고 매우 중대한 범죄를 저질렀습니다. 여기는 중동이 아니라 유럽입니다. 이곳에서 그런 행동은 용납하지 않을 것입니다. 파벨 네메츠가 그를 어떻게 처리할지 결정해야 합니다."
 CZE_its_legal: "'합법입니다'"
 CZE_its_legal_desc: "우리의 젊은 시민들이 집권당에게 무엇을 원하는지 생각해야 합니다. 마리화나 합법화? LGBT 수용? 이 길로 가겠습니다. 뭐가 잘못될 수 있겠습니까?"
 CZE_shift_to_semi_anarchism: "준 아나키즘으로의 전환"
 CZE_shift_to_semi_anarchism_desc: "우리의 강령은 실패했습니다. 될 대로 되라지요. 더 많은 유권자를 끌어들일 수 있는 방법은 이것 하나뿐입니다. 우리의 세계관을 바꿀 때입니다."
 CZE_jan_hadrav_leadership: "얀 하드라바의 지도부"
 CZE_jan_hadrav_leadership_desc: "지난 선거는 그냥 잊읍시다, 괜찮지요? 좋습니다. 이제 얀 하드라바가 우리 당을 이끌 것이며, 파벨 네메츠는 이전에 이 일을 맡지 말았어야..."
 CZE_jan_cerny_leadership: "얀 체르니의 지도부"
 CZE_jan_cerny_leadership_desc: "불행히도 우리 당은 생각보다 더 불안정합니다. 이제 얀 체르니에게 맡겨 봅시다. 어쩌면 그가 마침내 우리를 밝은 미래로 이끌어 줄지도 모릅니다."
 CZE_reform_of_the_housing_sector: "주택 부문 개혁"
 CZE_reform_of_the_housing_sector_desc: "견실한 개혁을 단행할 때입니다. 주택 부문을 돌보면 국민은 우리가 이 나라를 진정으로 아낀다는 것을 알게 될 것입니다."
 CZE_increase_maternity_leave_time: "출산 휴가 기간 연장"
 CZE_increase_maternity_leave_time_desc: "실제로 효과가 있을 가능성은 낮지만 시도해 볼 가치는 있습니다. 법안을 밀어붙일 때입니다."
 CZE_finish_repair_of_damage_after_communist_regime: "공산 정권 이후 복구 완료"
 CZE_finish_repair_of_damage_after_communist_regime_desc: "공산주의자들이 남긴 피해는 우리가 생각한 것보다 훨씬 컸습니다. 하지만 넉넉한 국가 예산 덕분에 복구를 마무리할 수 있을 것입니다."
 CZE_further_upgrade_of_infrastructure_network: "인프라망 추가 개선"
 CZE_further_upgrade_of_infrastructure_network_desc: "모두가 이런 일을 하고 있으니 우리도 뒤처지지 않을 것입니다. 남은 인기를 모아 정부에서 법안 하나를 더 밀어붙일 것입니다."
 CZE_take_more_advantage_of_renewable_energy: "재생 에너지 활용 확대"
 CZE_take_more_advantage_of_renewable_energy_desc: "재생 에너지는 우리나라의 에너지 안보를 지켜 줄 것입니다. 풍차, 태양광 패널, 수력 발전 인프라 등 이러한 사업에 투자해야 합니다."
 CZE_aim_for_lower_taxes: "감세 추구"
 CZE_aim_for_lower_taxes_desc: "우리의 몰락은 피할 수 없습니다. 사퇴를 발표하기 전에 법안 하나만 더 밀어붙입시다."
 CZE_end_of_usdeu: "US-DEU의 종말"
 CZE_end_of_usdeu_desc: "우리의 시대가 왔습니다. 2002년과 2006년 선거의 실패는 우리 당에 너무나 치명적이었습니다. 끔찍한 결정들이 내려졌고 내부 논란도 많았습니다. 이를 견뎌 낼 수 없었고 US-DEU는 사라졌습니다."
 CZE_ano_program: "ANO 강령"
 CZE_ano_program_desc: "ANO는 2011년에 만들어졌으나 2012년 5월 11일에 정당이 되었습니다. 다른 정당들에 반대하는 사람들이 만들었습니다. 그 강령은 체코 공화국의 모든 국민을 대상으로 하며, 복지 국가를 돌보고 나라에 새로운 발전 방식을 도입하는 것을 지향합니다."
 CZE_we_are_not_politicians: "우리는 정치인이 아니다"
 CZE_we_are_not_politicians_desc: "ANO는 정치인들이 만든 것이 아닙니다. 본래는 부패와 시민의 불만에 맞서 싸우고 정치 체계를 치유하는 것을 목표로 한 운동이었습니다."
 CZE_corruption_problem: "부패 문제"
 CZE_corruption_problem_desc: "다른 정당들은 계속해서 부패 감소를 이야기하지만 이 문제는 여전히 우리나라에 존재합니다. 우리는 더는 한 해도 기다리고 싶지 않습니다. 우리의 힘을 보여 줄 때입니다."
 CZE_prepare_for_the_2013_elections: "2013년 선거 준비"
 CZE_prepare_for_the_2013_elections_desc: "아직 엄청난 지지를 얻지는 못했지만, 우리의 새로운 선거 강령은 다음 선거에서 국민이 우리에게 투표하도록 설득할 것입니다. 우리는 모두를 위해 이 일을 하고 있습니다."
 CZE_unemployment_problem: "실업 문제"
 CZE_unemployment_problem_desc: "슈코다(Škoda)는 여전히 새로운 일자리를 만들고 있지만 우리는 여전히 실업에 시달립니다. 이 문제를 살펴봐야 합니다."
 CZE_kick_off_the_insincere_politicians: "불성실한 정치인 축출"
 CZE_kick_off_the_insincere_politicians_desc: "우리 정치인 일부가 당에 충성하지 않았습니다. 이를 간과할 수 없으며 몇 가지 어려운 결정을 내려야 합니다."
 CZE_eticky_kodex: "윤리 강령"
 CZE_eticky_kodex_desc: "ANO는 본래 정당이 아니라 운동으로 만들어졌습니다. 그러나 그 직함 없이는 어떤 의미 있는 변화도 만들 수 없습니다. 우리는 매우 빨리 정리해야 할 혼란 속에 있습니다."
 CZE_first_laws_must_be_consulted_with_the_parliamentary_group: "법안은 의원단과 협의해야 한다"
 CZE_first_laws_must_be_consulted_with_the_parliamentary_group_desc: "어떤 개혁이든 밀어붙이려면 그것이 나라에 도움이 된다는 데 우리 모두가 동의해야 합니다. 그렇기에 모든 법 개정을 협의해야 합니다."
 CZE_second_you_cant_move_to_another_club_during_torm_of_office: "임기 중 이탈 불가"
 CZE_second_you_cant_move_to_another_club_during_torm_of_office_desc: "그것은 배신일 것입니다. 우리 당을 선택했다면 충성을 지키고 유권자들의 눈에 비친 우리의 인기를 해치지 마십시오."
 CZE_third_in_serious_matters_you_cannot_vote_against_ano: "중대한 사안에서 ANO에 반대 투표 불가"
 CZE_third_in_serious_matters_you_cannot_vote_against_ano_desc: "우리는 모든 경우에 서로 도와야 하지만, 정말 중대한 사안에서는 단결을 유지하고 우리의 강령을 엄격히 따라야 합니다."
 CZE_fourth_you_must_doname_7000_crowns_to_the_ano_every_month: "매월 ANO에 7000 코루나 기부"
 CZE_fourth_you_must_doname_7000_crowns_to_the_ano_every_month_desc: "우리 당에는 후원자가 많지만 그들과 지도자의 예산에만 의존할 수는 없습니다. 재정 상황을 안정시키기 위해 모든 당원이 ANO에 자금을 대야 합니다."
 CZE_cssd_and_kducsl_coalition: "CSSD·KDU-CSL 연립"
 CZE_cssd_and_kducsl_coalition_desc: "우리는 ČSSD와 KDU-ČSL을 신뢰할 수 있습니다. 모든 곳에서 적을 만들 수는 없으며 동맹이 필요합니다."
 CZE_join_the_ministry_of_finance: "재무부 참여"
 CZE_join_the_ministry_of_finance_desc: "재무부에 참여하면 국가 지출을 더 효율적으로 관리하고 나라의 예산을 개선할 수 있습니다."
 CZE_join_the_ministry_of_internal_affairs: "내무부 참여"
 CZE_join_the_ministry_of_internal_affairs_desc: "내무부는 법원을 관장하고 법을 준수시키며 나라의 안정을 유지합니다. 내무부에 참여하면 법률을 더 쉽게 바꿀 수 있습니다."
 CZE_join_the_ministry_of_regional_development: "지역개발부 참여"
 CZE_join_the_ministry_of_regional_development_desc: "지역 개발은 나라의 경제와 산업을 개선하는 데 중요합니다. 경제 부문을 이끄는 부처이며, 참여하면 산업 발전의 방향을 선택할 수 있습니다."
 CZE_new_head_politics_of_the_country_management: "새로운 국정 운영 정치"
 CZE_new_head_politics_of_the_country_management_desc: "ČSSD, KDU-ČSL과의 연립 덕분에 새 정부를 구성할 수 있습니다. 가장 중요한 국가 기관들을 장악할 절호의 기회입니다."
 CZE_2014_european_parliamentary_elections: "2014년 유럽 의회 선거"
 CZE_2014_european_parliamentary_elections_desc: "EU 선거는 우리에게 매우 중요합니다. 충분한 의석을 확보한다면 유럽 연합 회원국들 사이에서 위상이 높아지고 체코 공화국에서 더 많은 지지를 얻을 것입니다."
 CZE_makat_a_neblabolit: "최선을 다하되 허튼짓은 말라."
 CZE_makat_a_neblabolit_desc: "'최선을 다하되 허튼짓은 말라.' 이 말로 우리는 2017년 선거에서 엄청난 인기를 얻는 데 성공했습니다. 이제 국가 지출 개선과 도시 개발에 집중할 것입니다."
 CZE_great_labor_reforms: "대규모 노동 개혁"
 CZE_great_labor_reforms_desc: "우리의 노동법은 낡았고 비효율적입니다. 이를 바꾸는 것이 우리의 일입니다."
 CZE_cybersecurity_funding: "사이버 보안 자금 지원"
 CZE_cybersecurity_funding_desc: "우리의 보안 체계는 최고 수준이 아닙니다. 아무도 이를 개선하는 데 돈을 쓰지 않는다면 머지않아 심각한 곤경에 처할 수 있습니다."
 CZE_digitalization_of_the_economy_sector: "경제 부문의 디지털화"
 CZE_digitalization_of_the_economy_sector_desc: "사이버 보안이 강화되었다면 우리 도시들을 새로운 시대로 이끌고 신기술 도입을 시작할 때입니다."
 CZE_increase_feeling_of_security: "안전감 증진"
 CZE_increase_feeling_of_security_desc: "시대가 다시 불안해지고 있습니다. 국민이 안전하다는 것을 알 수 있어야 하므로 경찰 지출 예산을 늘릴 것입니다."
 CZE_all_for_people_all_from_people: "모든 것은 국민을 위해, 모든 것은 국민으로부터"
 CZE_all_for_people_all_from_people_desc: "우리의 모든 최근 행동은 국민의 삶의 질을 높이기 위한 것입니다. 그것이 우리의 사명이었고 우리는 그 일에 성공했습니다."
 CZE_take_care_of_the_education: "교육 챙기기"
 CZE_take_care_of_the_education_desc: "우리 학교는 좋지만 교사들은 낮은 보수를 받고 있습니다. 우리 강령에 그 문제가 포함되어 있으며 이를 해결할 때입니다."
 CZE_the_lithium_case: "리튬 사건"
 CZE_the_lithium_case_desc: "리튬 사건은 체코 공화국 의회 하원의 2017년 선거 불과 며칠 전에 발생한 정치적 스캔들입니다. 이 사건은 치네베츠(Cínovec)의 리튬 매장지 탐사, 그 탐사 권리, 그리고 이후 있을 수 있는 채굴을 둘러싸고 발생했습니다. ČSSD는 오스트레일리아 기업과 협력하여 채굴을 시작하려 하지만 우리 정치인 일부는 이 선택에 반대하고 있습니다."
 CZE_attract_kscm_communists: "KSCM 공산주의자 영입"
 CZE_attract_kscm_communists_desc: "다른 정당의 일부 정치인들이 우리 운동에 합류하기로 했습니다. 주로 KSČM과 ČSSD 지지자들을 말하는 것입니다. 우리 당에 좋은 상황입니다."
 CZE_top_09_program: "TOP 09 강령"
 CZE_top_09_program_desc: "TOP 09의 목표 중에는 국가의 산업화로 인한 환경 변화를 막는 것이 있습니다. 이들은 ODS의 지지를 구하며 현재 SPOLU(체코어로 TOGETHER) 연합의 일원입니다."
 CZE_energy_saving: "에너지 절약"
 CZE_energy_saving_desc: "우리 국민과 기업은 에너지를 너무 많이 낭비합니다. 물론 우리에게는 원자로와 수많은 재생 에너지 개혁이 있지만, 그것을 한 달 만에 다 써도 된다는 뜻은 아닙니다. 새로운 규제는 사람들이 전력을 과도하게 낭비하는 것을 막을 것입니다."
 CZE_cooperate_with_strana_zelenych: "녹색당과의 협력"
 CZE_cooperate_with_strana_zelenych_desc: "녹색당(Strana Zelených)은 녹지가 나라에 매우 중요하다는 것을 언제나 알고 있었습니다. 우리의 강령을 합치면 의회에서 더 많은 법안을 밀어붙일 수 있을 것입니다."
 CZE_modify_green_savings_program: "그린 세이빙스 프로그램 수정"
 CZE_modify_green_savings_program_desc: "그린 세이빙스(Green Savings) 프로그램에는 숲과 동물의 보호가 포함되며 오염 문제를 줄입니다. 그러나 이 프로그램은 더 나아지도록 몇 가지 수정이 필요합니다."
 CZE_seek_ods_coalition: "ODS와의 연립 모색"
 CZE_seek_ods_coalition_desc: "더 큰 정당의 도움 없이는 많은 일을 할 수 없습니다. ODS가 우리 강령과 가장 잘 맞으므로 그들에게 손을 내밀 것입니다."
 CZE_karel_schwarzenberg_ministry_of_foreign_affairs: "카렐 슈바르첸베르크 외무장관"
 CZE_karel_schwarzenberg_ministry_of_foreign_affairs_desc: "카렐 슈바르첸베르크는 한동안 외무장관을 맡아 왔습니다. 이 특권을 함께 활용하여 우리 당을 알리는 데 도움을 줍시다."
 CZE_european_union_appreciation: "유럽 연합에 대한 평가"
 CZE_european_union_appreciation_desc: "유럽 연합은 환경을 돌봅니다. 그들의 법 일부는 우리 법과 충돌할 수 있지만, 그들은 회원국들을 위해 최선을 바랍니다."
 CZE_environment_regulations: "환경 규제"
 CZE_environment_regulations_desc: "일부 기업은 지역 환경에 파괴적인 영향을 미칩니다. 이러한 방임을 중단하고 강력한 규제를 도입해야 합니다."
 CZE_limit_forest_clearing: "산림 벌채 제한"
 CZE_limit_forest_clearing_desc: "목재 기업들이 나무를 너무 많이 베고 있습니다. 새 나무를 심기는 하지만 다 자라기까지는 수십 년이 걸립니다. 벌목을 제한해야 합니다."
 CZE_reform_of_the_transport_sector: "교통 부문 개혁"
 CZE_reform_of_the_transport_sector_desc: "슈코다(Škoda)는 우리 자동차 부문을 개선하는 데 훌륭한 역할을 하고 있지만 그들의 자동차는 오염을 너무 많이 일으킵니다. CO2 배출을 줄여야 합니다."
 CZE_defend_against_ano: "ANO에 대한 방어"
 CZE_defend_against_ano_desc: "ANO는 이런저런 이유로 우리 당을 비판하고 있습니다. 우리는 그저 국가 환경을 돌보고 싶을 뿐입니다. 아무런 대응 없이 넘어갈 수는 없습니다."
 CZE_intensive_environment_regulations: "강력한 환경 규제"
 CZE_intensive_environment_regulations_desc: "우리의 최신 강령에는 더 많은 녹색 규제가 포함되어 있습니다. 그 밖에도 우리의 목표 달성에 도움이 될 신기술 연구에 자금을 지원해야 합니다."
 CZE_regulate_waste_management: "폐기물 관리 규제"
 CZE_regulate_waste_management_desc: "우리나라에는 폐기물을 처리할 더 나은 방법이 필요합니다. 쓰레기 매립지도 괜찮지만, 버리는 대신 재활용하여 폐기물에 새 생명을 줄 수 있습니다."
 CZE_invent_new_technologies: "신기술 개발"
 CZE_invent_new_technologies_desc: "연구 부문에 자금을 지원하여 새로운 에너지 절약 기술을 개발하도록 돕습시다. 저렴한 투자는 아니지만 반드시 취해야 할 조치입니다."
 CZE_decrease_construction_cost: "건설 비용 절감"
 CZE_decrease_construction_cost_desc: "품질은 비슷하되 더 저렴한 자재를 사용하기 시작해야 합니다. 이는 건설 현장에 대한 국가 지출을 줄이고 공사를 앞당길 것입니다."
 CZE_continue_green_savings_program: "그린 세이빙스 프로그램 지속"
 CZE_continue_green_savings_program_desc: "그린 세이빙스(Green Savings) 프로그램의 또 다른 개혁입니다. 녹색당(Strana Zelených)과의 협력 덕분에 문제없이 또 하나의 법안을 통과시킬 수 있습니다."
 CZE_balanced_energy_development: "균형 잡힌 에너지 개발"
 CZE_balanced_energy_development_desc: "한 종류의 에너지에만 의존할 수는 없습니다. 화석 연료 발전소는 환경에 좋지 않지만, 재생 에너지 부문에 문제가 생기면 그것이 유일한 발전원이 될 것입니다."
 CZE_miroslav_kalousek_for_the_leader: "지도자에 미로슬라프 칼로우세크"
 CZE_miroslav_kalousek_for_the_leader_desc: "칼로우세크는 이전에 KDU-ČSL의 지도자였습니다. 덕분에 우리는 그 정당과 좋은 관계를 유지하고 있습니다. 하지만 그가 우리의 선거 강령을 정말 이해하고 있을까요?"
 CZE_modify_agriculture_effect_on_the_environment: "농업이 토양에 미치는 영향 조정"
 CZE_modify_agriculture_effect_on_the_environment_desc: "농업은 그 자체로 좋지만 때로는 나무를 베어야 합니다. 농경지 아래의 토양에도 그리 좋지 않습니다. 이 문제를 살펴봅시다."
 CZE_leadership_of_jiri_pospisil: "이르지 포스피실의 지도부"
 CZE_leadership_of_jiri_pospisil_desc: "이르지 포스피실이 우리 당을 위해 무엇을 할 수 있는지 보여 줄 때입니다. 새 지도자는 목표를 달성하기 위한 새로운 에너지와 열정을 의미합니다."
 CZE_make_new_parks: "신규 공원 조성"
 CZE_make_new_parks_desc: "우리 도시에는 깨끗한 공기가 있는 녹지가 부족합니다. 새 공원을 조성하여 이 문제를 해결할 것입니다."
 CZE_energize_the_tourist_sector: "관광 부문 활성화"
 CZE_energize_the_tourist_sector_desc: "다른 사람들도 체코 공화국이 방문할 가치가 있음을 알아야 합니다. 우리의 강령은 이 나라를 자연에 더 우호적으로 만들었으며, 방문객들도 분명 이를 높이 평가할 것입니다."
 CZE_leadership_of_marketa_pekarova_adamova: "마르케타 페카로바 아다모바의 지도부"
 CZE_leadership_of_marketa_pekarova_adamova_desc: "마르케타 페카로바 아다모바가 우리 당의 최신 지도자로 선출되었습니다. 우리 당을 SPOLU 연합에 합류시키는 것이 그녀의 임무가 될 것입니다."
 CZE_join_the_spolu_coalition: "SPOLU 연합 가입"
 CZE_join_the_spolu_coalition_desc: "우리는 SPOLU 연합에서 ODS 및 KDU-ČSL과 함께할 준비가 되었습니다. 우리 정당들에게 위대한 날입니다."
 CZE_waste_recycling: "폐기물 재활용"
 CZE_waste_recycling_desc: "우리는 이미 재활용 프로그램을 도입했지만 오늘은 이를 개선할 때입니다. 새로운 재활용 센터가 전체 과정을 가속할 것입니다."
 CZE_invest_in_green_cities: "녹색 도시 투자"
 CZE_invest_in_green_cities_desc: "도로는 나무, 관목 및 이와 비슷한 것들로 덮여야 합니다. 이 방안은 도시의 오염을 줄이고 삶의 질을 개선할 것입니다."
 CZE_the_triple_alliance: "삼중 동맹"
 CZE_the_triple_alliance_desc: "SPOLU 연합이 공식 출범했습니다. ODS, TOP 09, KDU-ČSL은 높아지는 ANO의 인기를 꺾기 위해 하나가 되었습니다. 이것은 시작일 뿐입니다. 지난 선거에서의 성공 이후 연합은 새 정부를 준비해야 합니다."
 CZE_change_in_the_government: "정부 교체"
 CZE_change_in_the_government_desc: "정부 교체가 시작되었습니다. 세 정당 모두가 각 당에서 가장 뛰어난 정치인 다섯 명씩을 함께 선택하여 국가 운영을 맡깁니다. 이러한 인기를 바탕으로 SPOLU는 체코 공화국의 운영 방식을 바꿀 향후 개발 계획도 결정할 수 있습니다."
 CZE_martin_baxa_ministry_of_culture: "마르틴 바크사 - 문화부"
 CZE_martin_baxa_ministry_of_culture_desc: "ODS는 마르틴 바크사를 새 문화부 장관으로 선택했습니다. 정치 경력 외에도 그는 중등학교 교사이기도 합니다. 그는 1999년에 ODS에 입당했습니다."
 CZE_zbynek_stanjura_minister_of_finance: "즈비네크 스탄유라 - 재무부 장관"
 CZE_zbynek_stanjura_minister_of_finance_desc: "즈비네크 스탄유라는 페트르 피알라의 새 정부의 일원으로 선출된 또 한 명의 ODS 정치인입니다. 그는 재무부 장관의 책무를 맡게 됩니다. 그는 새천년이 시작될 무렵 ODS에 입당하여 빠르게 당의 중요한 정치인이 되었습니다."
 CZE_pavel_blazek_department_of_justice: "파벨 블라제크 - 법무부"
 CZE_pavel_blazek_department_of_justice_desc: "파벨 블라제크는 1998년에 ODS에 입당했습니다. 그는 이전에 페트르 네차스 총리 재임 기간에 법무부 장관을 지냈습니다. 이번에는 [CZE.GetName]에서 가장 중요한 정치인 중 한 명이 될 또 한 번의 기회를 얻었습니다."
 CZE_martin_kupka_ministry_of_transportation: "마르틴 쿠프카 - 교통부"
 CZE_martin_kupka_ministry_of_transportation_desc: "마르틴 쿠프카는 개인적으로는 언론인으로 일합니다. 2008년에 ODS에 입당했고 2년 만에 매우 큰 지지와 인기를 얻었습니다. 페트르 피알라의 새 정부에서 그는 교통부 장관을 맡게 됩니다."
 CZE_jana_cernochova_minister_of_defence: "야나 체르노호바 - 국방부 장관"
 CZE_jana_cernochova_minister_of_defence_desc: "새 정부에 합류할 마지막 ODS 당원은 야나 체르노호바입니다. 그녀는 1997년에 입당했습니다. 경력 중에는 수도 프라하 지역구의 체코 공화국 의회 의원을 지냈습니다. 이제 그녀는 최신 국방부 장관을 맡게 됩니다."
 CZE_coalition_with_pirati_a_strostove: "해적당·시장 연합과의 연립"
 CZE_coalition_with_pirati_a_strostove_desc: "SPOLU 연합은 강력하지만 해적당과 시장 연합(Piráti a Starostové) 연합도 인기를 얻고 있습니다. 이 두 연합을 합치면 체코 공화국 현대사에서 가장 강력한 정치 집단이 탄생할 것입니다."
 CZE_support_petr_pavel_for_the_president: "대통령에 페트르 파벨 지지"
 CZE_support_petr_pavel_for_the_president_desc: "SPOLU는 페트르 파벨의 대통령 출마를 적극 지지했습니다. 그는 어느 정당에도 속해 있지 않습니다. 그는 이 나라를 이끌 무소속 지도자입니다."
 CZE_connecting_five_programs: "다섯 강령의 결합"
 CZE_connecting_five_programs_desc: "SPOLU와 해적당·시장 연합(Piráti a Starostové)의 새 연합을 구성한 후, 공동의 가장 큰 정치 강령을 실현하기 시작할 때입니다."
 CZE_the_strongest_coalition: "가장 강력한 연합"
 CZE_the_strongest_coalition_desc: "SPOLU는 빠르게 막대한 지지를 얻었습니다. 페트르 피알라의 결단력 있는 행동과 퇴역 군 장성 페트르 파벨의 복귀는 국민에게 희망을 가져다줍니다. 여기서부터는 오르기만 할 것으로 보입니다."
 CZE_independent_politician_in_power: "집권한 무소속 정치인"
 CZE_independent_politician_in_power_desc: "페트르 파벨이 [CZE.GetName]의 지도자로 선출되었습니다. 이는 그와 SPOLU에게 큰 성공입니다."
 CZE_take_care_of_the_environment: "환경 보호"
 CZE_take_care_of_the_environment_desc: "환경은 해마다 더 취약해지고 있으므로 더 이상 파괴해서는 안 됩니다."
 CZE_a_soldier_and_a_politician: "군인이자 정치인"
 CZE_a_soldier_and_a_politician_desc: "1961년 11월 1일 플라나에서 태어난 페트르 파벨은 체코슬로바키아가 아직 존재하고 공산 정권 아래에 있던 시절에 군 경력을 시작했습니다. 그는 NATO 국가들에 대한 정찰을 담당했습니다. 소련 붕괴와 체코슬로바키아가 민주주의 체코 공화국과 슬로바키아로 분리된 후 상황이 달라졌습니다. 페트르 파벨은 NATO군 및 미국과 협력하기 시작했습니다(동구권에서는 영어가 인기 있지 않았지만 파벨은 영어, 프랑스어, 러시아어를 공부한 몇 안 되는 장교 중 한 명이었습니다). 그는 2018년까지 군에 복무했으며 퇴역 후 정치 분야에서 경력을 이어 갔고, 민주주의 정당과 무소속 정당들의 지지를 얻어 2023년 대통령 선거에서 체코 공화국 대통령이 되었습니다.\n이 역사 트리와 전용 GUI는 새천년이 시작된 이후 군사 작전과 정치 논의에 매우 큰 영향을 미친 그의 경력을 더 자세히 살펴보기 위해 마련되었습니다."
 CZE_international_career: "국제 경력"
 CZE_international_career_desc: "세계는 체코 공화국에서 끝나지 않습니다. 다른 나라들과의 협력은 경험을 쌓고 다양한 장교들과 지형의 전술을 배우는 데 중요합니다."
 CZE_home_career: "국내 경력"
 CZE_home_career_desc: "체코 공화국은 우리의 고향이며 어떠한 위협으로부터도 지키기 위해 모든 노력을 기울여야 합니다. 우리의 적들은 우리가 쉬운 표적이 아님을 알아야 합니다."
 CZE_join_ii_persian_gulf_war: "제2차 걸프 전쟁 참전"
 CZE_join_ii_persian_gulf_war_desc: "테러 공격 이후 미국은 중동에 대해 더 공세적이 되었습니다. 그들은 이라크에 선전포고했으며, 우리는 모두의 평화를 위해 싸우는 동맹을 도와야 합니다."
 CZE_continuation_of_afnorth_cooperation: "AFNORTH 협력의 지속"
 CZE_continuation_of_afnorth_cooperation_desc: "AFNORTH는 더 이상 존재하지 않지만 그 자리에 다른 기구들, 정확히는 브륀쉼에 기구들이 만들어졌습니다. 그 임무는 동맹의 북방 측면을 방어하는 것이며, 페트르 파벨은 장성들의 이 임무를 도울 기회를 얻었습니다."
 CZE_zastupce_velitele_divize: "사단장 대리"
 CZE_zastupce_velitele_divize_desc: "사단장 대리는 페트르 파벨이 조국에서 다시 한번 자신을 증명할 기회입니다. 그는 우리 장군 중 한 명의 오른팔이 되어 억지력 태세를 개선하는 데 도움이 될 계획과 전략을 조율할 것입니다."
 CZE_brigadni_general: "준장"
 CZE_brigadni_general_desc: "페트르 파벨은 준장으로 진급할 준비가 되었습니다. 이는 그의 경력에서 매우 중요한 성과이며, 그가 조국과 동맹 체제에서 가장 중요한 장군이 되는 데 한 걸음 더 가까워지게 합니다."
 CZE_homeland_protectionism: "조국 보호주의"
 CZE_homeland_protectionism_desc: "우리나라는 중립적이고 우호적인 이웃 국가들로 둘러싸여 있습니다. 그러나 그들을 전적으로 신뢰할 수 있다는 뜻은 아닙니다. 어느 방향에서 오는 공격에도 대비해야 합니다."
 CZE_centcom_liaison_officer: "CENTCOM 연락 장교"
 CZE_centcom_liaison_officer_desc: "미국 중부사령부는 미국 국방부의 11개 통합전투사령부 가운데 하나입니다. 1983년에 설립되어 신속배치합동기동부대(RDJTF)의 이전 책무를 인계받았습니다."
 CZE_coordination_from_qatar: "카타르에서의 조율"
 CZE_coordination_from_qatar_desc: "카타르는 미군이 자국 영토에 군 기지와 공군 기지를 설치하도록 허용했습니다. 페트르 파벨은 제2차 걸프 전쟁 중 이라크에서 싸우는 미군을 조율하기 위해 그곳에 파견될 것입니다."
 CZE_protect_nato_northern_flank: "NATO 북방 측면 방어"
 CZE_protect_nato_northern_flank_desc: "스칸디나비아 국가들은 아직 자위 능력이 그다지 높지 않지만 매우 중요한 동맹입니다. 그들의 기후는 우리보다 추워서 자국 영토에서 러시아와 싸울 때 더 잘 대처할 것입니다. 그들의 방어가 적대 세력을 저지할 수 있는지 확인해야 합니다."
 CZE_special_forces_deputy_commander: "특수 부대 부지휘관"
 CZE_special_forces_deputy_commander_desc: "페트르 파벨이 특수 부대 대대의 지휘관이 될 준비를 갖추기 전에, 전문적으로 훈련된 병사들로 이루어진 병력을 지휘하는 법을 배워야 합니다."
 CZE_deputy_director_of_the_czech_ministry_of_defence: "국방부 차관보"
 CZE_deputy_director_of_the_czech_ministry_of_defence_desc: "새로운 국방 프로그램을 도입하기 위해 국가가 넘어야 할 장애물을 더 잘 이해하려면, 페트르 파벨은 최고위직에서 어떤 문제든 처리하는 법을 배워야 합니다."
 CZE_extend_deterrence_policy: "억지 정책 확대"
 CZE_extend_deterrence_policy_desc: "우리의 적들은 우리 군대가 작기 때문에 쉬운 표적이라고 생각합니다. 우리는 그들이 틀렸음을 알지만, 그들 역시 우리가 우리 땅 한 뼘 한 뼘을 위해 싸울 것임을 알아야 합니다."
 CZE_special_forces_commander: "특수 부대 지휘관"
 CZE_special_forces_commander_desc: "수십 년의 훈련 끝에 페트르 파벨은 우리의 특수 부대 대대를 지휘할 준비가 되었습니다. 오랜 훈련은 또 한 번의 진급으로 이어지며, 페트르 파벨은 경력의 정점에 가까워지고 있습니다."
 CZE_generalmajor: "소장"
 CZE_generalmajor_desc: "소장은 체코 장성 계급 목록에서 또 하나의 진급입니다. 소장 계급은 파벨에게 더 많은 특권과 더 고난도의 임무에 대한 접근권을 부여할 것입니다."
 CZE_improve_air_defence_program: "대공 방어 프로그램 개선"
 CZE_improve_air_defence_program_desc: "새롭고 현대적인 항공기를 안정적으로 생산할 수 없다면, 적 항공기를 격추할 수 있는 체계를 개선하는 데 돈을 써야 합니다."
 CZE_protest_for_reducing_military_funding: "군사 예산 삭감 반대"
 CZE_protest_for_reducing_military_funding_desc: "우리 정치인들은 군사 지출을 희생하여 다른 정부 지출을 늘리는 것을 고려하고 있습니다. 그들이 그 법안을 통과시키기로 한다면 우리는 약해질 것이며, 이는 용납할 수 없는 일입니다."
 CZE_eu_integration: "EU 통합"
 CZE_eu_integration_desc: "일부 NATO 국가는 유럽 연합에 속해 있습니다. 그들과의 관계를 개선하면 우리는 이중으로 이익을 얻을 것이며, 어쩌면 경제도 더 빠르게 성장하는 데 도움이 될 것입니다."
 CZE_deputy_chief_of_the_general_staff: "부참모총장"
 CZE_deputy_chief_of_the_general_staff_desc: "페트르 파벨은 한 번 더 상위 직위가 어떻게 돌아가는지 배워야 그 직위 중 하나로 진급할 수 있습니다. 참모총장은 체코군 최고 군사 직위이며 그 자리에 오르는 것은 대단한 성과입니다."
 CZE_suggest_increasing_cybersecurity: "사이버 보안 강화 제안"
 CZE_suggest_increasing_cybersecurity_desc: "적은 제4의 권력을 선전의 수단으로 활용할 수 있습니다. 바이러스로 인해 정부 사이트가 오작동하면 우리의 군수 지원과 통신에 대한 통제권을 잃을 수 있습니다."
 CZE_shape_representative: "SHAPE 대표"
 CZE_shape_representative_desc: "SHAPE는 또 하나의 NATO 기구입니다. 전 세계의 모든 NATO 작전을 조율합니다. 페트르 파벨은 벨기에에 있는 본부에 파견되어 다른 경험 많은 장성들과 결정을 조율하게 됩니다."
 CZE_generalporucik: "중장"
 CZE_generalporucik_desc: "중장은 체코 육군에서 달성할 수 있는 최고 장성 계급의 한 단계 아래입니다. 이 과정은 거의 끝나 가며 페트르 파벨에게 새로운 임무가 열립니다."
 CZE_chief_of_staff_of_the_czech_armed_forces: "체코군 참모총장"
 CZE_chief_of_staff_of_the_czech_armed_forces_desc: "새로운 계급 덕분에 페트르 파벨은 이제 체코군 참모총장이 될 수 있습니다. 이는 체코 공화국 군대에서 가장 높은 계급이자 최고참 군 장교입니다. 군 통수권자인 체코 공화국 대통령이 임명합니다."
 CZE_support_for_czech_forces_in_afghanistan: "아프가니스탄 체코군 지원"
 CZE_support_for_czech_forces_in_afghanistan_desc: "아프가니스탄의 분쟁은 계속되고 있으며 탈레반 세력은 아프가니스탄 시민의 안전에 대한 끊임없는 위협입니다. 체코 병사들은 아프가니스탄의 자유를 위해 싸우고 있으며, 우리는 가능한 모든 방법으로 그들을 지원해야 합니다."
 CZE_head_of_the_nato_military_committee: "NATO 군사위원회 의장"
 CZE_head_of_the_nato_military_committee_desc: "이것은 NATO 군사 체계에서 가장 높은 직위입니다. 수십 년간의 혹독한 훈련 덕분에 페트르 파벨은 이제 동맹 군사 체계에서 가장 중요한 장군이 될 준비가 되었습니다."
 CZE_declare_russia_as_a_major_threat: "러시아를 주요 위협으로 선언"
 CZE_declare_russia_as_a_major_threat_desc: "러시아는 한 번도 우리의 친구였던 적이 없습니다. 이번에는 그들이 영구히 정책을 바꾸지 않는 한, 소련 붕괴 이후 위협이 사라졌다고 가장할 수 없습니다."
 CZE_strengthen_eastern_flank: "동부 측면 강화"
 CZE_strengthen_eastern_flank_desc: "러시아가 공세적 정책을 계속하는 한 우리는 경계를 늦출 수 없습니다. 동쪽 국가들은 있을 수 있는 충격에 대비해야 합니다."
 CZE_armadni_general: "육군 대장"
 CZE_armadni_general_desc: "체코 공화국 육군에서 도달할 수 있는 가장 높은 계급입니다. 페트르 파벨은 최고 직위에 올랐으며 이제 NATO 군사위원회 의장이 되어 더 멀리 나아갈 준비가 되었습니다."
 CZE_finish_nato_career: "NATO 경력 마무리"
 CZE_finish_nato_career_desc: "페트르 파벨은 은퇴에 가까워지고 있습니다. 이를 염두에 두고 그는 NATO 동료들에게 작별을 고하고 군을 떠날 준비를 해야 합니다."
 CZE_military_pension: "군인 연금"
 CZE_military_pension_desc: "모든 것은 언젠가 막다른 길에 이릅니다. 페트르 파벨은 마땅히 누려야 할 은퇴를 맞이하지만, 복무 중에 얻은 정신과 지혜는 체코군의 중요한 자산으로 남을 것입니다."
 CZE_further_political_career: "정치 경력의 지속"
 CZE_further_political_career_desc: "페트르 파벨이 군 경력을 마친 지금, 정치 분야로 더 깊이 들어갈 때입니다. 파벨은 수많은 동맹 회의에 참석하면서 이 분야에서 이미 경험을 쌓았습니다."
 CZE_spolu_silnejsi: "함께라서 더 강하다"
 CZE_spolu_silnejsi_desc: "'함께라서 더 강하다(Stronger Together)' 이니셔티브는 2020년 봄에 페트르 파벨이 설립했습니다. 처음에 그들은 전염병과의 싸움 최전선에 있는 사람들과 위기로 가장 큰 타격을 입은 사람들을 돕는 모금 활동을 시작했습니다. 이후 페트르 파벨과 다른 전문가들은 더 나은 위기 관리를 위한 권고안을 마련했습니다."
 CZE_fight_disinformation: "허위 정보와의 싸움"
 CZE_fight_disinformation_desc: "일부 반대 세력이 인터넷에 허위 정보를 퍼뜨려 파벨의 인기를 억누르려 하고 있습니다. 누군가는 이것이 모두 거짓임을 국민에게 보여 주어야 합니다."
 CZE_collection_for_hospitals: "병원 모금"
 CZE_collection_for_hospitals_desc: "우리 병원은 장비가 잘 갖춰져 있지만 위기 상황에서는 가능한 만큼 효과적이지 않습니다. 국민의 기부로 병원이 어떤 상황에도 대비하도록 도울 수 있을 것입니다."
 CZE_candidate_for_the_president: "대통령 후보"
 CZE_candidate_for_the_president_desc: "페트르 파벨이 체코 공화국 대통령에 출마할 때입니다. 한때는 군인이었고 이제는 정치인입니다."
 CZE_support_from_politicians: "정치인들의 지지"
 CZE_support_from_politicians_desc: "다른 정당들이 페트르 파벨의 출마를 지지합니다. ODS, TOP 09, KDU-CSL은 그가 지지를 얻도록 도우면서 스스로도 인기를 얻을 것입니다."
 CZE_the_reign_of_petr_pavel: "페트르 파벨의 치세"
 CZE_the_reign_of_petr_pavel_desc: "페트르 파벨은 대통령 선거 전에 충분한 인기를 얻어 경쟁자들을 꺾고 조국 체코 공화국의 대통령 자리를 확보했습니다. 새로운 시대가 이제 시작됩니다."
 CZE_election_donations: "선거 후원금"
 CZE_election_donations_desc: "선거 운동에는 막대한 비용이 듭니다. 고맙게도 가장 큰 세 정당의 지원이 있어 페트르 파벨의 선거 운동 자금을 모으는 데 도움이 될 것입니다."
 CZE_shift_in_politics: "정치 노선의 전환"
 CZE_shift_in_politics_desc: "우리는 동맹에 너무 많이 의존해 왔습니다. 우리나라는 누구의 도움도 없이 스스로를 방어할 수 있어야 합니다."
 CZE_stay_close_with_other_countries: "다른 나라들과의 긴밀한 관계 유지"
 CZE_stay_close_with_other_countries_desc: "우리는 단결할 때 더 강합니다. NATO는 우리에게 독립과 완벽한 억지 전략을 보장할 것입니다."
 CZE_economical_innovations: "경제 혁신"
 CZE_economical_innovations_desc: "우리의 국방 야망에도 불구하고, 번영하는 나라는 다른 국가에 뒤처지지 않도록 해마다 경제를 개선해야 합니다. 그러니 현대의 문제에 대한 현대적 해법을 살펴봅시다."
 CZE_increase_defence_budget: "국방 예산 증액"
 CZE_increase_defence_budget_desc: "장비보다 더 잘 훈련된 병사가 필요합니다. 전문 군대는 장비를 덜 낭비하며, 덕분에 더 중요한 장비의 생산에 집중할 수 있습니다."
 CZE_armaments_funding: "무장 자금 지원"
 CZE_armaments_funding_desc: "잘 훈련된 병사도 중요하지만 훈련에만 의존할 수는 없습니다. 비축량을 채우기 위해 군수 부품과 장비의 생산을 늘려야 합니다."
 CZE_internal_affairs: "내정"
 CZE_internal_affairs_desc: "이제 선거 공약을 이행할 때인 것 같습니다. 자, 국민을 행복하게 하기 위해 일을 시작합시다."
 CZE_explain_our_choice: "우리의 선택 설명"
 CZE_explain_our_choice_desc: "들어 보십시오, 우리가 외부의 도움을 원하지 않는 것이 아닙니다. 우리는 훨씬 강한 적들을 이길 수 없음을 알고 있으므로 어떤 징벌도 가할 필요가 없습니다. 우리는 여전히 동맹이며 다른 나라들을 계속 도울 것입니다."
 CZE_continue_nato_trainings: "NATO 훈련 지속"
 CZE_continue_nato_trainings_desc: "NATO 훈련은 우리에게 새로운 것이 아닙니다. 그러나 시대가 변했으며, 정기 훈련 대신 병사들을 실제 전쟁에 대비시켜야 합니다..."
 CZE_tighten_ties_with_eu: "EU와의 유대 강화"
 CZE_tighten_ties_with_eu_desc: "경제 동맹입니다. 좋게 들리며 유럽 연합이 바로 그런 곳입니다. 그 집단으로부터 더 많은 이익을 얻을 때입니다."
 CZE_more_independent_growth: "더 독립적인 성장"
 CZE_more_independent_growth_desc: "무역에서 개인적인 이익만을 추구하는 다른 나라들의 함정에 빠져서는 안 됩니다. 자재 수입을 줄이기 위해 우리 경제의 힘을 키워야 합니다."
 CZE_fight_corruption: "부패와의 싸움"
 CZE_fight_corruption_desc: "부패는 막을 수 없는 문제입니다. 아무리 노력해도 언제나 되돌아옵니다. 그러나 싸움을 멈춘다면 부패는 다른 나라의 침공보다 우리 국가에 훨씬 더 큰 위협이 될 것입니다."
 CZE_higher_retirement_age: "정년 연장"
 CZE_higher_retirement_age_desc: "사람들이 오래 일할수록 우리 경제는 좋아집니다. 정년을 몇 년 올리더라도 모두 괜찮을 것입니다."
 CZE_save_money_for_other_institutions: "다른 기관을 위한 자금 절약"
 CZE_save_money_for_other_institutions_desc: "군대만이 국가의 유일한 부문은 아닙니다. 안정적인 성장을 안정적으로 유지하려면 의료나 교육과 같은 다른 기관들도 지원해야 합니다."
 CZE_offensive_innovations: "공세 혁신"
 CZE_offensive_innovations_desc: "뚫을 수 없는 방어만으로는 적을 상대로 효과적인 공세를 펼 수 없습니다. 돌격과 공격 작전에 더 집중해야 합니다."
 CZE_keep_defensive_doctrine: "방어 교리 유지"
 CZE_keep_defensive_doctrine_desc: "우리는 적에게 더 많은... 글쎄요, 또 다른 적들이 있을 것이라고 믿어야 합니다. 우리가 진지를 지킬 만큼 강하다면 병사들은 위험한 돌격에서 목숨을 걸 필요가 없을 것입니다."
 CZE_czech_polish_military_cooperation: "체코-폴란드 군사 협력"
 CZE_czech_polish_military_cooperation_desc: "폴란드는 유럽 동부에서 가장 강한 나라 중 하나입니다. 우리 군대를 위한 또 하나의 공동 훈련 프로그램을 준비합시다."
 CZE_calling_for_eastern_flank_increased_protection: "동부 측면 방어 강화 요구"
 CZE_calling_for_eastern_flank_increased_protection_desc: "러시아는 다른 나라들을 위협하는 것을 멈추지 않습니다. 우리 동맹의 동부 측면은 아직 러시아의 침공에 대비되어 있지 않으며, 이는 매우 빨리 바뀌어야 합니다."
 CZE_join_the_eurozone: "유로존 가입"
 CZE_join_the_eurozone_desc: "결국, 안 될 이유가 있겠습니까? 유로존은 우리나라를 유럽 연합과 더욱 결속시키고 우리 통화를 더 안정적으로 만들 것입니다."
 CZE_increased_factories_efficiency: "공장 효율 향상"
 CZE_increased_factories_efficiency_desc: "신기술은 우리 공장이 상품과 군사 장비의 생산량을 늘릴 수 있게 할 것입니다. 비용이 조금 들겠지만 그 결과는 노력할 가치가 있을 것입니다."
 CZE_expansion_of_mining_regions: "광업 지역 확장"
 CZE_expansion_of_mining_regions_desc: "그렇습니다, 우리는 녹색 해법을 지향해야 하지만, 더 독립적인 성장을 이루려 하는 만큼 자원 부문의 안전성을 더 확보해야 합니다."
 CZE_administration_reform: "행정 개혁"
 CZE_administration_reform_desc: "부패 문제 중 일부는 비효율적인 행정에서 비롯되었습니다. 그 불씨를 없애려면 행정이 중요한 개혁을 거쳐야 합니다."
 CZE_grants_for_schools: "학교 보조금"
 CZE_grants_for_schools_desc: "우리 학교는 외국인 학생과 다른 나라로의 연수에 더 개방적이어야 합니다. 새로 지급된 자금으로 교육을 더 낫게 만들 수 있을 것입니다."
 CZE_expand_ministry_of_health: "보건부 확대"
 CZE_expand_ministry_of_health_desc: "병원은 어떤 상황과 문제에도 대비되어 있어야 합니다. 의사들은 전염병이나 기타 긴장된 사태 때 어떻게 행동해야 하는지 알아야 합니다."
 CZE_expand_role_of_the_army_in_politics: "정치에서 군의 역할 확대"
 CZE_expand_role_of_the_army_in_politics_desc: "일부 정치인들은 나라가 필요로 하는 것보다 자기 자신을 지나치게 챙깁니다. 군 장성들은 우리가 더 강한 군사력을 준비하고 그다지 신뢰할 수 없는 정치인들의 역할을 제한하도록 도울 것입니다."
 CZE_always_prepared: "항상 준비된 상태"
 CZE_always_prepared_desc: "적의 군대가 국경에 나타나는 것을 보지 않아도 그들이 전쟁을 준비하고 있음을 알 수 있어야 합니다. 다른 나라들의 활동을 감시함으로써 누군가 우리나라에 대한 침공을 준비하고 있는지 훨씬 빨리 알 수 있을 것입니다."
 CZE_even_together_we_must_be_strong: "함께하더라도 우리는 강해야 한다"
 CZE_even_together_we_must_be_strong_desc: "강력한 동맹들에게 전적으로 의존할 수는 없습니다. 우리 병력만으로도 다가오는 위협을 저지할 수 있어야 합니다."
 CZE_green_parties_support: "녹색 정당 지원"
 CZE_green_parties_support_desc: "기후 상황은 해마다 악화되고 있습니다. 녹색 정당들은 다가오는 위기를 막는 방법을 알고 있으며, 생산성 증가가 둔화되는 대가를 치르더라도 때로는 그들의 의견에 귀를 기울이는 것이 좋습니다."
 CZE_study_russian_strategies: "러시아 전략 연구"
 CZE_study_russian_strategies_desc: "우리는 이미 그들을 알고 있지만 전략은 언제든 바뀔 수 있습니다. 아무도 눈치채지 못하도록 조용히 해 봅시다..."
 CZE_stay_close_with_visegrad: "비셰그라드와의 긴밀한 관계 유지"
 CZE_stay_close_with_visegrad_desc: "비셰그라드 그룹은 네 회원국에게 많은 이익을 주었습니다. 어떤 일이 있어도 단결을 유지해야 합니다."
 CZE_open_up_for_balkans: "발칸에 문호 개방"
 CZE_open_up_for_balkans_desc: "더 남쪽으로 눈을 돌리면 발칸 국가들이 있습니다. 보스포루스(및 흑해)로의 접근은 우리에게 매우 중요한데, 그 지역에서 러시아 해군을 통제할 수 있기 때문입니다."
 CZE_more_automatization: "자동화 확대"
 CZE_more_automatization_desc: "현대 기술에 대한 집중을 이어 가며 첨단 기계와 장비를 사용하여 업무를 쉽게 만들 수 있습니다. 드론은 언제든 순식간에 하늘에서 사진을 찍을 수 있고, 원격 조종 건설 차량은 작업을 훨씬 쉽게 만들 것입니다."
 CZE_co2_reduction: "CO2 감축"
 CZE_co2_reduction_desc: "슈코다(Škoda)는 많은 자동차를 생산하지만 구형 모델은 아직도 현재 모델보다 더 많은 오염을 일으키는 낡은 배기 장치를 사용합니다. 이 문제는 마침내 해결되어야 합니다."
 CZE_stand_for_the_center_europe: "중부 유럽을 위한 입장"
 CZE_stand_for_the_center_europe_desc: "우리는 다른 나라들에 둘러싸여 있습니다. 일부는 더 우호적이고 일부는 그렇지 않습니다. 그러니 우호적이지 않은 나라들이 자국 군대를 우리 국경에서 멀리 두도록 만듭시다."
 CZE_our_country_first: "우리나라 우선"
 CZE_our_country_first_desc: "어떤 외교 행동을 택하기 전에, 우리나라가 그로부터 가장 만족스러운 이익을 얻을 수 있는지 확인해야 합니다. 다른 이들을 돕고 싶다면 먼저 우리 자신부터 돌봐야 합니다."
 CZE_awaken_national_spirit: "민족 정신의 각성"
 CZE_awaken_national_spirit_desc: "사람들은 소비에트 체제가 끝났으니 고삐를 늦추고 더 정체된 군사 발전 과정으로 들어가도 된다고 생각합니다. 그러나 위협은 다시 눈에 보이게 되었고, 우리는 벨벳 혁명 때 무엇을 위해 싸웠는지 기억해야 합니다."
 CZE_catch_up_with_the_giants: "거인들을 따라잡기"
 CZE_catch_up_with_the_giants_desc: "이는 많은 돈이 들겠지만 슈코다(Škoda)의 탄탄한 입지 덕분에 국고를 금방 다시 채울 수 있을 것입니다."
 CZE_ready_for_pre_emptive_strike: "선제 타격 준비"
 CZE_ready_for_pre_emptive_strike_desc: "새로운 지침 체계는 우리 병사들이 예상치 못한 침공에 평소보다 훨씬 빠르게 적응하도록 도울 것입니다. 적은 예상보다 훨씬 더 놀라게 될 것입니다."
 CZE_regional_power: "지역 강국"
 CZE_regional_power_desc: "새로운 무장 자금 지원과 계획 교리는 우리를 유럽 중심부의 지역 강국으로 만들었습니다. 이는 우리에게 매우 중요한 걸음이며 적들이 우리나라를 공격하기 전에 다시 한번 생각하게 만들 것입니다."
 CZE_2000_airforce_army_procurement: "체코 공군 확장"
 CZE_2000_airforce_army_procurement_desc: "새천년은 인류가 하늘을 나는 능력의 또 다른 시대를 엽니다. 제트 엔진의 발전과 함께 우리 공군은 날마다 나아지고 있습니다. 초음속은 우리 손안에 있지만 아주 작은 문제가 하나 있습니다... 우리 산업은 그러한 기계를 생산할 능력이 충분하지 않습니다. 돈을 절약해 다른 나라들로부터 장비를 구매해야 합니다."
 CZE_transport_helicopters: "수송 헬리콥터"
 CZE_transport_helicopters_desc: "수송 헬리콥터는 우리 육군에 보급품을 공급하고 공수부대원들이 임무를 수행하게 해 줄 것입니다. 러시아, 미국, 프랑스에는 여유 차량이 있으므로 그중 한 곳에 요청하여 헬리콥터를 구매할 수 있습니다."
 CZE_lighter_cas: "경량 근접 항공 지원기"
 CZE_lighter_cas_desc: "제트기는 뛰어난 기동성과 함께 빨라야 하므로 제작 비용을 낮추고 항공기를 가볍게 만드는 것을 목표로 삼아야 합니다."
 CZE_new_fighters: "현대식 전투기"
 CZE_new_fighters_desc: "신형 전투기는 세대가 바뀔 때마다 더 빠르고 강력해지고 있습니다. 가격이 비싸고 생산하기 어려우므로 국제 시장에서 구매해야 합니다."
 CZE_continue_with_full_on_cas: "본격 근접 항공 지원 지속"
 CZE_continue_with_full_on_cas_desc: "최고의 항공기는 파괴하기 어렵고 적을 쉽게 파괴하는 기체입니다. 중형 근접 항공 지원기는 이 임무에 매우 적합합니다."
 CZE_attack_helicopters: "공격 헬리콥터"
 CZE_attack_helicopters_desc: "공격 헬리콥터는 전장에서 지원을 제공하며 도시 전투에서 건물 사이를 쉽게 기동하고 지상의 적을 추적할 수 있어 매우 유용합니다."
 CZE_2010_airforce_army_procurement: "고급 공군 조달"
 CZE_2010_airforce_army_procurement_desc: "세계에 또 한 번의 십 년이 찾아왔습니다. 무인 드론 기술이 급속히 발전하고 있으며, 신기술과 개선된 기체 덕분에 전투기는 격파하기가 더 어려워지고 있습니다. 더 이상 냉전 시대 장비에 의존할 수 없으며 현대 시대로 들어설 때입니다."
 CZE_combat_drones_production: "전투 드론 생산"
 CZE_combat_drones_production_desc: "원격 조종 전투 드론은 정찰과 전략 표적에 대한 신속한 폭격에 완벽합니다. 현재로서는 추적하고 격파하기 어렵기 때문에, 적이 이 새로운 유형의 무기와 효과적으로 싸우는 법을 익히기 전에 가능한 한 빨리 확보해야 합니다."
 CZE_supply_in_casa_c295_m: "에어버스 C-295 보급"
 CZE_supply_in_casa_c295_m_desc: "스페인의 가장 큰 수송기 중 하나입니다. C-295는 전장에서 보급품을 공급하는 데 도움이 되겠지만 강력한 호위가 필요할 것입니다."
 CZE_new_age_of_supersonic_aircraft_research: "초음속 항공기 연구의 새 시대"
 CZE_new_age_of_supersonic_aircraft_research_desc: "제트 엔진은 해마다 더 안정되어 조종사들이 기체를 더 쉽게 기동할 수 있습니다. 우리에게는 좋지 않은 소식입니다. 그 기술에 맞설 기회를 가지려면 우리 스스로 만들어야 합니다."
 CZE_replace_sokol: "소콜 대체"
 CZE_replace_sokol_desc: "소콜은 좋은 헬리콥터였지만 현대전의 현재 기준을 충족하지 못합니다. 대체 기종을 찾아야 합니다."
 CZE_mobile_operation_center: "이동식 작전 센터"
 CZE_mobile_operation_center_desc: "MOC는 필요한 곳 어디에서든 우리 공군을 지원할 고도로 발전된 작전 센터입니다. 비싼 투자이므로 잃지 않는 것이 좋습니다."
 CZE_lighter_faster: "더 가볍고 더 빠르게"
 CZE_lighter_faster_desc: "조종사들이 적의 총탄과 미사일을 피할 만큼 기체를 잘 기동할 수 있다면 더 두꺼운 장갑은 필요하지 않습니다. 위험은 더 크지만 조종사들은 더 잘 훈련될 것입니다."
 CZE_medium_hull_focus: "중형 기체 중시"
 CZE_medium_hull_focus_desc: "작은 실수 하나로 항공기가 추락합니다. 최고의 조종사도 실수를 한다는 것을 알고 있으므로 항공기의 방호력을 높여야 합니다."
 CZE_2020_airforce_army_procurement: "현대 공군 프로그램"
 CZE_2020_airforce_army_procurement_desc: "우리는 이제 21세기의 세 번째 십 년에 들어섰습니다. 가장 잘 알려진 항공기로는 미국에서 제조한 F 계열 항공기와 러시아의 MiG 계열이 있습니다. 이 기체들을 확보해야 합니다."
 CZE_middle_size_drones: "중형 드론"
 CZE_middle_size_drones_desc: "더 무거운 드론은 느리지만 폭발물 수송 능력은 더 뛰어납니다. 자폭 드론은 지상 표적에 매우 효과적입니다."
 CZE_modern_aircrafts: "현대식 항공기"
 CZE_modern_aircrafts_desc: "강대국들이 생산한 최신 항공기를 손에 넣을 때입니다."
 CZE_new_attack_helicopters: "신형 공격 헬리콥터"
 CZE_new_attack_helicopters_desc: "공격 헬리콥터는 해마다 공군에서 더 중요해지고 있습니다. 따라서 이를 잘 챙기고 최신 상태로 유지하는 것이 합리적입니다."
 CZE_next_gen_attack_helicopter: "차세대 공격 헬리콥터"
 CZE_next_gen_attack_helicopter_desc: "국제 시장에서 모든 것을 구매할 수는 없습니다. 새로운 연구를 시작하고 자체 헬리콥터 생산에 착수합시다."
 CZE_new_transport_helicopters: "신형 수송 헬리콥터"
 CZE_new_transport_helicopters_desc: "공격 헬리콥터와 마찬가지로 수송 헬리콥터도 지난 십 년보다 지금 더 큰 역할을 맡고 있습니다."
 CZE_heavy_transport_helicopter: "대형 수송 헬리콥터"
 CZE_heavy_transport_helicopter_desc: "파괴하기 어려운 헬리콥터는 생산 비용이 매우 많이 들지만 몇 대만으로도 큰 차이를 만들 수 있습니다."
 CZE_new_transport_aircraft: "수송기"
 CZE_new_transport_aircraft_desc: "수송 헬리콥터가 구식 수송기를 대체하지는 못할 것입니다. 다소 구식이더라도 우리에게는 매우 유용할 것입니다."
 CZE_army_of_the_new_century: "새 세기의 군대"
 CZE_army_of_the_new_century_desc: "체코 공화국 군대 현대화를 위해 또 한 걸음 나아갑시다. 새로운 세기는 우리에게 밝아 보이니, 더 강한 군사력을 가진 적들이 우리의 희망과 꿈을 묻어 버리게 두지 맙시다."
 CZE_remove_national_service: "의무 복무 폐지"
 CZE_remove_national_service_desc: "전쟁과 세계적 긴장은 오래전에 끝났지만 위협은 여전히 존재하며, 경험 없는 신병을 새로 모집하는 대신 우리의 직업 군대를 개선하는 것을 목표로 삼아야 합니다."
 CZE_form_activereserves: "현역 예비대 창설"
 CZE_form_activereserves_desc: "현역 예비대는 전시에 우리 군이 영토를 통제하는 데 도움이 될 것입니다. 군에 추가 임무를 부과해 부담을 주지 않는 것이 중요합니다."
 CZE_reform_az: "현역 예비대"
 CZE_reform_az_desc: "신편 여단은 예상치 못한 공세에 대한 우리 군의 신속한 대응을 도울 것입니다. 훈련이 빠를수록 우리에게는 이롭고 적에게는 해롭습니다."
 CZE_reform_army_schooling: "군 교육의 새로운 방식"
 CZE_reform_army_schooling_desc: "일부 학교와 대학은 여전히 공산주의 방식의 군사 교육을 사용하고 있습니다. 이러한 관행을 바꾸고 새로운 훈련 프로그램을 도입할 때입니다."
 CZE_UNOB_schooling: "국방대학교"
 CZE_UNOB_schooling_desc: "국방대학교는 미래의 병사들을 훈련하기 위한 우리의 최신 학교가 될 것입니다. 우리나라는 공세적 스타일을 이어 가야 하는데, 왜 다른 길로 가겠습니까?"
 CZE_reform_ms: "법무부"
 CZE_reform_ms_desc: "공산 정권은 오래전에 끝났지만 현행법에는 우리 군에 영향을 미치는 허점이 여전히 있습니다. 법무부 운영의 새로운 방식이 이 문제를 해결할 것입니다."
 CZE_reform_vispoint: "비스포인트"
 CZE_reform_vispoint_desc: "비슈코프 시에 위치한 비스포인트(Vispoint)는 군 기초 훈련의 대부분을 담당합니다. 이는 적에게 매우 중요한 전략적 표적이며, 우리는 이를 방어하기 위해 가능한 모든 것을 해야 합니다."
 CZE_reform_officer_corp: "장교단 개편"
 CZE_reform_officer_corp_desc: "군을 개편하기 전에, 병사들에게 싸우는 법을 보여 줄 유능한 참모진이 필요합니다."
 CZE_reform_army_corp: "군단 개편"
 CZE_reform_army_corp_desc: "장교들이 새로운 프로그램으로 훈련을 받았으니 이제 군 개편을 시작할 수 있습니다. 미국은 동맹국들을 위해 무언가를 준비하고 있으니, 그들로부터 무엇을 얻을 수 있는지 살펴봅시다."
 CZE_join_tradoc: "TRADOC 참여"
 CZE_join_tradoc_desc: "미 육군 훈련교리사령부는 버지니아 주 유스티스 기지에 본부를 둔 미 육군의 주요 사령부입니다. 육군 병력의 훈련을 감독하고 작전 교리의 개발을 책임집니다."
 CZE_join_natineads: "NATINADS 참여"
 CZE_join_natineads_desc: "NATO 통합 방공 체계는 NATO 동맹의 방공군 전반에 걸쳐 분산된 레이더 및 기타 시설을 결합한 지휘통제 네트워크입니다."
 CZE_form_a_new_brigade: "신규 군사 여단 창설"
 CZE_form_a_new_brigade_desc: "우리는 새로운 사단을 창설하는 전통적인 군 확장 방식을 유지할 것입니다. 첨단 기술을 사용하는 방식보다 저렴한 선택지이며, 지금은 높은 지출을 감당할 수 없습니다."
 CZE_form_cyber_brigade: "사이버 여단 창설"
 CZE_form_cyber_brigade_desc: "사이버 여단은 모두에게 새로운 전쟁 방식인 사이버전을 보여 줄 것입니다. 이 값비싼 부대는 우리나라가 허위 정보와 외국의 영향력에 맞서 싸우는 데 도움이 될 것입니다."
 CZE_defencestrat: "방어 전략"
 CZE_defencestrat_desc: "우리 국가는 언제나 억지 전략에 집중해 왔습니다. 그러나 때로는 우리가 산에 아무리 많은 지상 요새를 세워도 적은 신경 쓰지 않으며... 흠, 그래서 침략자에 더 잘 저항하도록 방어 전략을 개선해야 합니다."
 CZE_armydoctrinereform: "육군 교리 개혁"
 CZE_armydoctrinereform_desc: "새로운 전략에는 교리의 변화가 필요하므로 우리가 싸우는 방식을 바꿉시다."
 CZE_nationalhybridoperations: "국가 하이브리드 작전"
 CZE_nationalhybridoperations_desc: "하이브리드전은 우리에게 새로운 것이 아니지만 적들은 이런 유형의 전략에 훨씬 더 많은 경험이 있습니다. 따라서 이런 유형의 전쟁에 효과적으로 대응하기 위해 더 많이 훈련해야 합니다."
 CZE_whitebook: "백서"
 CZE_whitebook_desc: "국방 백서는 우리나라의 방어 전략을 담게 될 문서입니다. 교리, 지출, 군사 훈련 프로그램 등이 포함됩니다. 페트르 파벨 덕분에 우리는 백서를 확장하여 이웃 나라들에게까지 손을 뻗을 수 있으며, 이는 우리 모두의 국가를 더 안전하고 더 잘 대비된 곳으로 만들 것입니다."
 CZE_expand_military_equipment_production: "군 장비 생산 확대"
 CZE_expand_military_equipment_production_desc: "해외 시장에서 장비를 사 오기만 할 수는 없습니다. 그러한 사고방식은 우리를 다른 나라들에 지나치게 의존하게 만들 것입니다. 기본 장비는 우리 스스로 생산할 수 있습니다."
 CZE_longterm2035outlook: "2035년 장기 전망"
 CZE_longterm2035outlook_desc: "경험 많은 우리 장군들은 앞으로 수십 년 동안 우리나라의 훈련 프로그램을 보장하기 위한 계획을 내놓았습니다. 시도해 볼 가치가 있다고 생각합니다."
 CZE_form_intelligence_agency: "정보 기관 창설"
 CZE_form_intelligence_agency_desc: "정보 기관은 유지 비용이 매우 많이 듭니다. 독립적으로 운영될 수 있지만 우리는 그중 하나만 지원할 수 있습니다. 제안을 내고 어떤 기업들이 우리에게 접근하는지 살펴봅시다."
 CZE_bis: "보안정보국"
 CZE_bis_desc: "보안정보국(BIS)은 체코 공화국의 주된 국내 국가 정보 기관입니다. 체코 공화국의 국가 안보에 대한 위협에 관한 정보를 수집, 분석, 보고, 배포하고, 국내외에서 비밀 및 공개 작전을 수행할 책임이 있습니다. 또한 국가 안보 문제와 국가의 안전을 위협하는 상황에 대해 체코 공화국 정부에 보고하고 자문합니다."
 CZE_vojenske_zpravodajstvi: "군사정보국"
 CZE_vojenske_zpravodajstvi_desc: "군사정보국은 체코 공화국의 군사 정보 기관으로, 영상 정보(IMINT), 인적 정보(HUMINT), 신호 정보(SIGINT), 공개 출처 정보(OSINT) 등의 분야에서 활동합니다. 또한 한 번에 둘 이상의 정보 기관과 협력하여 정보를 확보합니다."
 CZE_UZSI: "대외관계정보청"
 CZE_UZSI_desc: "대외관계정보청은 정보의 수집, 분석, 배포를 담당하는 체코 공화국의 주된 해외 정보 기관입니다. 외교 및 경제 정책상의 이익을 뒷받침하고 보호하는 데 필수적인 정확하고 시의적절한 정보를 체코 공화국 정부에 제공할 권한을 가집니다."
 CZE_foreign_training: "해외 훈련"
 CZE_foreign_training_desc: "우리 병사들은 새로운 지휘 아래 다른 지형에서 싸우는 법을 알아야 합니다. 국제 작전을 완수하는 데 도움을 주기 위해 일부 병사를 파견할 것입니다."
 CZE_eutm_mali: "EU 말리 훈련단"
 CZE_eutm_mali_desc: "EU 말리 훈련단(EUTM Mali)은 말리의 바마코에 본부를 둔 유럽 연합의 다국적 군사 훈련 임무입니다. 프랑스 병사들을 돕고 훈련에 참여하기 위해 우리 병사들을 파견할 수 있습니다."
 CZE_kfor: "KFOR"
 CZE_kfor_desc: "코소보 국제안보군(KFOR)은 NATO가 주도하는 코소보의 국제 평화유지군입니다. 2009년에 창설된 코소보 안보군이 자립할 수 있게 될 때까지 작전은 점차 축소되고 있습니다."
 CZE_eufor_althera_bosna: "EUFOR 알테아 작전"
 CZE_eufor_althera_bosna_desc: "알테아 작전(Operation Althea), 공식 명칭 보스니아 헤르체고비나 유럽 연합군(EUFOR)은 데이턴 협정의 군사적 이행을 감독하기 위해 보스니아 헤르체고비나에 배치된 군사 파견단입니다. 이 임무에는 두 가지 주요 목표가 있습니다. 보스니아 헤르체고비나 주민의 안전을 보장하는 것과 1995년 데이턴/파리 협정의 부속서 1A 및 2에 규정된 임무를 수행하는 것입니다."
 CZE_operation_mountain_thrust: "마운틴 스러스트 작전"
 CZE_operation_mountain_thrust_desc: "마운틴 스러스트 작전은 아프가니스탄 전쟁에서 NATO와 아프가니스탄이 주도한 합동 군사 작전이었습니다. 주요 목표는 이 나라 남부에서 계속되는 탈레반 반란을 진압하는 것이었습니다."
 CZE_operation_enduring_freedom: "항구적 자유 작전"
 CZE_operation_enduring_freedom_desc: "항구적 자유작전 (OEF)은 미국 정부가 아프가니스탄 전쟁(2001-2021)의 첫 번째 단계(2001-2014)와 더 큰 규모의 세계적인 테러와의 전쟁에 대해 사용한 공식 명칭입니다. 2001년 10월 7일, 9/11 테러에 대응하여 조지 W. 부시 대통령은 알카에다와 탈레반을 목표로 하는 공습이 아프가니스탄에서 시작되었음을 발표했습니다. 아프가니스탄에서의 군사 작전 외에도, 항구적 자유작전은 OEF-필리핀과 OEF-트랜스 사하라와 같은 다른 국가에서의 반테러 작전과도 연관되었습니다."
 CZE_provincial_reconstruction_team_logar: "지방재건팀 로가르"
 CZE_provincial_reconstruction_team_logar_desc: "지방재건팀(PRT)은 체코 외무부의 민간 전문가들과 체코군 군인들로 구성되었으며, 재건 사업을 위한 안전한 환경을 유지하는 것이 임무였습니다. 체코 PRT는 PRT 중에서 비율상 민간 전문가 수가 가장 많은 편이었습니다."
 CZE_mfo_sinaj: "시나이 다국적군 및 감시단"
 CZE_mfo_sinaj_desc: "다국적군 및 감시단(MFO)은 이집트와 이스라엘 간 평화 조약의 조건을 감독하는 국제 평화유지군입니다. MFO는 일반적으로 시나이 반도와 그 주변에서 활동하며, 티란 해협과 아카바 만을 통한 자유로운 항행과 이집트-이스라엘 평화 조약의 기타 조건 준수를 보장합니다."
 CZE_air_policing_iceland: "아이슬란드 공역 경비"
 CZE_air_policing_iceland_desc: "아이슬란드 공역 경비는 아이슬란드 영공을 순찰하기 위해 수행되는 NATO 작전입니다. 아이슬란드에는 공군이 없기 때문에 2006년에 NATO 동맹국들에게 영공 방어를 위해 케플라비크 공군 기지에 전투기를 주기적으로 배치해 달라고 요청했습니다. 항공기의 첫 배치는 2008년 5월에 이루어졌습니다."
 CZE_baltic_air_policing: "발트 공역 경비"
 CZE_baltic_air_policing_desc: "발트 공역 경비 임무는 에스토니아, 라트비아, 리투아니아 발트 3국 상공을 지키기 위한 NATO 방공 신속대응경계(QRA) 태세입니다."
 CZE_air_advisor_team_afghanistan: "아프가니스탄 공군 자문단"
 CZE_air_advisor_team_afghanistan_desc: "여러 나라가 아프가니스탄 공군을 육성하는 것을 돕기 위해 자국 공군 부대를 파견해 왔습니다. 체코 공화국도 이 작전을 도울 것입니다."
 CZE_task_force_hippo_afghanistan: "아프가니스탄 히포 기동부대"
 CZE_task_force_hippo_afghanistan_desc: "체코 공군 요원들은 아프가니스탄에 배치될 새 헬리콥터 부대를 위한 후방 기지를 구축하기 시작했습니다. 히포 기동부대(Task Force Hippo)로 알려진 체코 헬리콥터 부대는 동부 지역사령부 소속이었습니다. TF 히포는 2010년 1월 25일에 ISAF 작전에 투입되었습니다."
 CZE_2000st_army_procurement: "2000년대 육군 조달 계획"
 CZE_2000st_army_procurement_desc: "새천년에 들어서며 체코 공화국은 급변하는 안보 환경에 직면합니다. 우리 군은 대비 태세를 유지하고 국익을 지키기 위해 현대적이고 발전된 무기와 차량을 갖추어야 합니다. 2000년대 육군 조달 계획은 장갑차와 방공 체계에서 첨단 통신 기술에 이르기까지 포괄적인 현대화의 토대를 마련합니다. 이 야심 찬 프로그램을 우선시함으로써 체코군이 21세기의 도전에 대응할 수 있도록 보장할 것입니다. 이제 이 변혁에 어떻게 접근할지, 국제 협력을 통해서인지 자국 방위 산업을 강화해서인지 결정할 때입니다."
 CZE_2000st_apc: "장갑차 보유 현대화 프로그램"
 CZE_2000st_apc_desc: "세계가 점점 불안정해짐에 따라 체코 공화국은 군 자산의 현대화를 우선시해야 합니다. 노후한 장갑차 보유 대수는 더 이상 현대전의 요구를 충족할 수 없으며, 미래 전장의 도전을 견뎌 낼 수 있는 차량을 우리 군에 갖추어 주는 것이 중요합니다. 이 현대화 프로그램에 투자함으로써 군의 기동성, 방호력, 전반적인 효율성을 높일 것입니다. 문제는 남아 있습니다. 신속한 개선을 위해 신뢰할 만한 해외 파트너에게 눈을 돌려야 할까요, 아니면 자국 산업에 투자하여 체코산 해법을 개발해야 할까요? 우리의 결정은 앞으로 수년간 우리 군의 미래를 결정할 것입니다."
 CZE_2000st_strop_2: "자주 대공포 도입"
 CZE_2000st_strop_2_desc: "현대전이 계속 진화함에 따라 하늘을 확보하는 것은 체코군의 최우선 과제입니다. 커지는 공중 위협에 대응하기 위해 강력한 자주 대공포(SPAA) 해법을 모색해야 합니다. 자국산 STROP 2 프로그램은 국내에서 생산되는 다목적 체계를 약속하며 국가 산업을 지원하고 장기적인 자립을 보장합니다. 그러나 검증된 해외 체계는 즉각적인 전장 효율성과 입증된 신뢰성을 제공합니다. 우리는 STROP 2의 개발을 계속 추진할지, 지체 없이 배치할 수 있는 해법을 해외에서 찾을지 신중히 저울질해야 합니다. 이 결정은 앞으로 수년간 체코 방공의 미래를 결정할 것입니다."
 CZE_2000st_ifv: "보병전투차 현대화"
 CZE_2000st_ifv_desc: "기계화전이 현대 군사 전략에서 점점 더 중요해짐에 따라 체코 공화국은 보병을 지원하고 미래의 분쟁에 필요한 기동성, 방호력, 화력을 제공하기 위해 보병전투차(IFV) 보유 대수를 개선해야 합니다. 현재의 차량은 낡았고 현대전의 요구를 충족할 수 없습니다. 이제 우리는 국가 방위 산업에 부합하는 자국산 IFV 모델을 개발할지, 아니면 해외의 검증된 설계를 조달할지 여러 선택지를 검토할 기회를 얻었습니다. 이 현대화는 우리 지상군의 효율성을 크게 높이고 전반적인 군사력을 강화할 것입니다."
 CZE_2000st_utility_vehichles: "다목적 차량 현대화"
 CZE_2000st_utility_vehichles_desc: "모든 현대 군대의 근간은 중장갑과 공군력뿐만 아니라 다목적 차량의 다재다능함과 신뢰성에도 있습니다. 병력 수송에서 병참 지원에 이르기까지, 우리의 현재 다목적 차량은 낡았고 현대전의 요구를 충족하려면 교체가 필요합니다. 군의 기동성, 효율성, 작전 대비 태세를 개선하기 위해 다목적 차량의 현대화를 우선시해야 합니다. 해외 설계를 도입하든 새로운 자국산 모델을 개발하든, 이 핵심 부문을 강화하면 병참 능력과 전장 유연성이 모두 강해질 것입니다."
 CZE_2000st_tank_modernization: "주력 전차 현대화"
 CZE_2000st_tank_modernization_desc: "기갑 전력의 힘과 효율을 유지하기 위해 체코 공화국은 신세대 주력 전차(MBT) 도입을 우선시해야 합니다. 현재의 전차는 낡았고 속도, 화력, 방호력이 가장 중요한 현대전의 요구를 충족할 수 없습니다. 우리는 이제 세계적 수준의 여러 선택지 중에서 새로운 MBT 플랫폼을 고르는 중대한 결정에 직면해 있습니다. 실전에서 검증된 독일의 레오파르트를 택하든, 기술적으로 앞선 프랑스의 르클레르를 택하든, 비용 효율적이고 내구성이 뛰어난 러시아의 T-90을 택하든, 우리의 선택은 우리 기갑 사단과 국제 동맹의 미래에 지속적인 영향을 미칠 것입니다."
 CZE_2010st_army_procurement: "2010년대 육군 조달"
 CZE_2010st_army_procurement_desc: "체코 공화국이 새로운 십 년에 들어서면서, 변화하는 현대전의 양상은 우리 군이 대대적인 개편을 거칠 것을 요구합니다. 2010년대 육군 조달 계획은 모든 군종에 걸쳐 우리 군에 최첨단 기술과 발전된 무기 체계를 갖추게 하기 위해 설계된 포괄적인 현대화 프로그램입니다. 이 계획은 기갑 전력, 보병 장비, 포병, 방공, 병참 능력의 개선에 중점을 둡니다. 차세대 주력 전차, 대공 체계, 포병, 소형 화기에 투자하고 새로운 다목적 차량과 보병 차량으로 기동성을 강화함으로써, 체코군이 어떤 미래의 분쟁에도 자신감과 힘으로 맞설 준비가 되어 있도록 보장할 것입니다."
 CZE_2010st_atg: "고급 대전차 유도 미사일 체계"
 CZE_2010st_atg_desc: "전장은 진화했으며 우리 군은 새로운 장갑 위협에 대응하기 위해 현대적인 대전차 유도 미사일(ATGM)을 갖추어야 합니다. 2010년에는 정밀도가 높은 장거리 ATGM의 개발이 보병과 기계화 부대 모두에게 중요해졌습니다. 가장 발전된 적 장갑 차량이라도 안전한 거리에서 무력화할 수 있도록, 더 강력한 화력과 향상된 조준 체계, 기동성을 갖춘 신세대 ATGM을 확보하여 배치해야 합니다."
 CZE_2010st_tank_modernisation: "차세대 주력전차"
 CZE_2010st_tank_modernisation_desc: "우리의 기갑 전력은 여전히 군사력의 선봉이지만, 2010년에는 적 전차와 대전차 무기의 고도화로 인해 새로운 최첨단 주력 전차(MBT)의 도입이 필요해졌습니다. 개선된 장갑, 향상된 기동성, 최신 사격 통제 체계를 갖춘 차세대 MBT는 전장에서 우리 군에 우월한 화력과 생존성을 제공할 것입니다. 플랫폼의 선택은 앞으로 십 년간 우리 기갑 전력의 중핵을 결정할 것입니다."
 CZE_2010st_apc: "현대식 장갑차 프로그램"
 CZE_2010st_apc_desc: "우리 군이 현대 전투의 요구에 적응해 감에 따라 보병의 안전과 기동성을 보장하는 것은 필수적입니다. 낡은 병력 수송 장갑차(APC)는 향상된 방호력, 속도, 다재다능함을 갖춘 현대식 모델로 교체되어야 합니다. 차세대 APC를 배치함으로써 병력에게 더 나은 수송 능력을 제공하고, 즉석 폭발물(IED)과 소형 화기 사격, 포격으로부터 보호하면서 적대적 환경에 신속히 투입할 수 있게 할 것입니다."
 CZE_2010st_arty: "차세대 포병 체계"
 CZE_2010st_arty_desc: "2010년에는 정밀도와 화력이 효과적인 포병의 특징입니다. 우리의 현재 체계는 낡았으며 현대 전투 작전을 지원하는 데 필요한 사거리와 정확도가 부족합니다. 더 긴 사거리, 개선된 조준, 더 안전하고 먼 위치에서 파괴적인 화력을 투사하는 능력을 갖춘 신형 자주포 체계에 투자해야 합니다. 이 개선은 어떤 분쟁에서도 우리 군이 압도적인 화력 우위를 유지하도록 보장할 것입니다."
 CZE_2010st_small_arms: "차세대 소화기"
 CZE_2010st_small_arms_desc: "보병은 체코군의 근간이며, 믿을 수 있는 현대식 소총을 갖추게 하는 것은 전장에서의 성공에 매우 중요합니다. 2010년에 우리의 낡은 소형 화기는 잘 무장한 적을 상대하기에 더는 충분하지 않습니다. 향상된 정확도와 모듈성, 현대식 광학 장비 및 액세서리와의 호환성을 제공하는 새로운 돌격 소총을 확보해야 합니다. 차세대 소총은 모든 조건에서 우리 보병의 전투 효율을 높일 것입니다."
 CZE_toyota_hilux_utility: "현대식 다목적 차량 프로그램"
 CZE_toyota_hilux_utility_desc: "병참 및 전술 지원은 모든 군사 작전의 생명선입니다. 2010년에 체코군의 다목적 차량은 노후화되어 현대 전투 조건에서 임무를 수행하는 데 필요한 기동성과 방호력이 부족합니다. 신세대 다목적 차량은 병력 수송에서 야전 병참, 후송에 이르기까지 광범위한 임무를 위해 우리 군에 향상된 험지 주행 능력, 더 큰 방호력, 늘어난 다재다능함을 제공할 것입니다."
 CZE_2010st_ifv: "차세대 보병전투차"
 CZE_2010st_ifv_desc: "현대 기계화전에서 보병전투차(IFV)는 공격과 방어 작전 모두에서 핵심적인 역할을 합니다. 현재 우리가 보유한 IFV 전력은 전장에서 보병을 보호하고 지원하기에 더 이상 충분하지 않습니다. 새로운 IFV를 개발하거나 도입함으로써 아군에게 첨단 방호력과 기동성, 화력을 제공하고, 갈수록 강해지는 적에 맞서 기계화 보병이 계속 효과적으로 싸울 수 있도록 하겠습니다."
 CZE_2010st_spaa: "현대식 자주 대공 체계"
 CZE_2010st_spaa_desc: "제공권은 현대전의 핵심 요소가 되었으며, 적 항공기와 드론을 막아내는 능력은 전장의 통제권을 유지하는 데 필수적입니다. 2010년 현재 우리의 기존 대공 체계는 낡아 현대의 위협에 대응할 수 없습니다. 더 뛰어난 기동성과 정확도, 화력을 갖춘 신형 자주 대공 체계를 도입하여 어떤 전역에서든 아군이 공중 위협으로부터 충분히 보호받도록 해야 합니다."
 CZE_2010st_manpad: "첨단 휴대용 방공 체계"
 CZE_2010st_manpad_desc: "항공 및 드론 위협이 증가함에 따라 우리 보병에게도 현대적인 휴대용 방공 수단을 갖추어야 합니다. 2010년 현재 구형 MANPADS로는 현대의 전투기, 헬리콥터, 드론에 효과적으로 대응할 수 없습니다. 최신 MANPADS에 투자함으로써 장병들이 공중 위협에 즉각적이고 효과적으로 대응할 수 있게 하고, 지상군과 핵심 기반시설의 방호를 강화하겠습니다."
 CZE_2020Utility: "다목적 차량 현대화"
 CZE_2020Utility_desc: "군사 작전이 점점 복잡해지고 지리적으로도 다양해짐에 따라, 체코군은 다목적 차량이 현대전의 요구를 충족하도록 해야 합니다. 2020년 현재 기존 차량 전력으로는 전장에서 필요한 기동성, 내구성, 지원 능력을 제공하기에 충분하지 않습니다. 어떤 지형에서도 군에 믿을 만한 지원을 제공하고 군수 능력을 높이려면 신세대 다목적 차량이 필수적입니다. 이제 방호력, 기동성, 비용 면에서 각기 다른 장점을 지닌 여러 첨단 선택지 가운데 하나를 골라야 합니다. 우리가 선택하는 차량은 지상군의 작전 성공과 효율에 결정적인 역할을 할 것입니다."
 CZE_2020APC: "장갑 병력수송차 현대화"
 CZE_2020APC_desc: "The Czech Army's ability to transport infantry safely and efficiently depends on the effectiveness of its Armored Personnel Carriers (APCs). In 2020, our outdated APC fleet needs an overhaul to meet the challenges of modern warfare. We must now evaluate the latest available APC options to enhance our army's mobility, protection, and firepower. Whether we choose the Finnish Patria XA-202 for its modularity, the Austrian Pandur II for its advanced design and proven performance, or the Russian K-16 Bumerang, the decision will shape the future of our mechanized infantry for years to come."
 CZE_2020MBT: "주력전차 현대화"
 CZE_2020MBT_desc: "현대전에서 주력전차(MBT)는 화력과 방호력, 전장 장악력을 제공하는 기갑 전력의 중추로 남아 있습니다. 체코군의 현재 MBT 전력은 노후화되고 있어 차세대 플랫폼으로 교체되어야 합니다. 2020년 현재 우리는 세 가지 유력한 후보를 검토하고 있습니다. 비할 데 없는 정밀도와 생존성을 제공하는 독일의 레오파르트 2A8, 최첨단 체계와 내구성으로 알려진 미국의 M1A2 SEPv3, 그리고 첨단 방호 체계와 혁신적인 기술을 결합한 혁명적인 전차인 러시아의 T-14 아르마타입니다. 우리의 선택은 앞으로 수십 년간 기갑 전력의 능력을 결정할 것입니다."
 CZE_2020IFV: "보병전투차 현대화"
 CZE_2020IFV_desc: "As battlefield threats grow more sophisticated, the Czech Army must upgrade its fleet of Infantry Fighting Vehicles (IFVs) to ensure our infantry has the protection, mobility, and firepower necessary to succeed. In 2020, we are evaluating three leading options: the Chinese Type 08, a wheeled vehicle offering impressive speed and versatility; the German Lynx, designed for modularity and cutting-edge defense systems; and the Russian K-17 Bumerang, which combines heavy armor with strong amphibious capabilities. The decision we make will greatly influence the combat effectiveness and adaptability of our mechanized forces for the next generation."
 CZE_2020SPA: "자주포 현대화"
 CZE_2020SPA_desc: "현대전이 신속한 장거리 화력 지원에 점점 더 의존함에 따라, 체코군은 효과를 유지하기 위해 자주포 체계를 개량해야 합니다. 2020년 현재 우리 앞에는 세 가지 유력한 선택지가 있습니다. 기동성과 검증된 신뢰성을 결합한 개량형 체코 Vz. 77 DANA, 로켓 포병으로서 탁월한 정밀도와 기동성을 제공하는 미국의 M142 HIMARS, 그리고 먼 거리에서도 신속하고 정확한 사격이 가능한 스웨덴의 아처 포병 체계입니다. 우리의 결정은 향후 작전에서 강력하고 기동성 있는 포병 지원을 제공하는 능력을 크게 좌우할 것입니다."
 CZE_2020st_army_procurement: "2020년대 육군 조달 구상"
 CZE_2020st_army_procurement_desc: "기술 발전과 변화하는 전장 양상으로 인해 군사 능력을 개량하고 확대해야 하는 만큼, 체코군은 2020년에 새로운 도전에 직면해 있습니다. 2020년대 육군 조달 구상은 우리 군이 현대전에서 경쟁력을 유지하는 데 필요한 최첨단 장비와 체계를 갖추도록 하는 것을 목표로 합니다. 장갑차량과 포병에서부터 첨단 방공 체계와 다목적 차량에 이르기까지, 이 포괄적인 조달 계획은 우리 군이 미래에 대비할 수 있도록 가장 우수한 플랫폼을 선정하는 데 중점을 둘 것입니다. 이 구상에 따른 결정은 앞으로 수년간 체코군의 작전 능력을 결정할 것입니다."
 CZE_2000_army_program_idea: "2000년 육군 차량 조달"
 CZE_2010_army_program_idea: "2010년 육군 차량 조달"
 CZE_2020_army_program_idea: "2020년 육군 차량 조달"
 CZE_motorization_focus_idea: "자동차 산업 중점"
 CZE_motorization_focus_idea_desc: "체코는 수년간 중·동유럽 민간 자동차 산업의 선두 주자였습니다. 이 강점은 수익성 높은 대외 무역의 길을 열어 주며, 체코 경제의 성장을 가속합니다."
 CZE_divided_society_idea: "분열된 사회"
 CZE_divided_society_idea_desc: "1992년 체코슬로바키아의 분리는 양국의 국내 정치에 충격을 주었습니다. 하나였던 사회가 둘로 나뉘었습니다. 분열을 막으려는 시도가 있었으나 공산주의 붕괴 이후의 정치적 변화로 인해 시간문제에 불과했습니다. 그러나 재통일에 대한 희망은 여전히 존재하며, 체코슬로바키아의 부활을 원하는 이들은 이를 이루기 위해 모든 노력을 다할 것입니다."
 CZE_ctyrkoalice_idea: "4자 연합 (Čtyřkoalice)"
 CZE_ctyrkoalice_idea_desc: "KDU-ČSL, US-DEU(두 정당으로 구성), ODA의 4개 정당으로 이루어진 연합입니다. 이는 체코 정치에서 ČSSD와 ODS 양당의 지배를 극복하는 것을 목표로 한 야당 간 상호 협력입니다."
 CZE_debt_problem_idea: "부채 문제"
 CZE_debt_problem_idea_desc: "체코는 현재 상당히 큰 부채로 어려움을 겪고 있으며, 그 규모는 계속 늘어나고 있습니다. 정당 간의 확고한 협력만이 이 상황을 안정시킬 수 있습니다."
