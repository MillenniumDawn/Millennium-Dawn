 GGZ_mutlu_erim: "Mutlu Erim!"
 GGZ_mutlu_erim_desc: "ついに我々は独立した！ 今や我々がそうあり続けることを確実にするのが我々の仕事だ。"
 GGZ_modernizing_agriculture: "農業の近代化"
 GGZ_modernizing_agriculture_desc: "悲しいことにガガウズには主要産業がなく、それを拡大するための経済的手段もないため、我々は農業手段の近代化に投資するだろう。"
 GGZ_expand_agriculture: "農業の拡大"
 GGZ_expand_agriculture_desc: "近代化だけでは不十分だ、我々はそれを拡大する必要もある。"
 GGZ_invest_in_textiles: "繊維産業への投資"
 GGZ_invest_in_textiles_desc: "我々が持つ一つの産業は繊維であり、我々はそれに非常に長けている。より多くの雇用を創出し、地域で重要な生産者になることを期待して、我々はそれに投資するだろう。"
 GGZ_our_constitution: "我々の憲法"
 GGZ_our_constitution_desc: "全ての真の国家には憲法が必要であり、我々も例外ではない！"
 GGZ_strengthen_baskan: "バシュカンの強化"
 GGZ_strengthen_baskan_desc: "The Baskan is the highest and most important position in Gagauzia. By strengthening the power which the position holds we can slowly move from a Parliamentary Democracy to a Presidential one and prevent abuses like in the case of former Baskan Croitor who was forced to resign by pressure from a PCRM controlled Assembly."
 GGZ_halki_domination: "ハルキの支配"
 GGZ_halki_domination_desc: "The Gagauz Halki was the first political movement which sought our Independence and it led the first Gagauz Republic until its dissolution. Now that the party has been re-established, it's only normal for it to be the leading force in our politics."
 GGZ_worrying_inevitable: "避けられぬ懸念"
 GGZ_worrying_inevitable_desc: "ルーマニア人が我々を併合することに固執していることは明らかであり、紛争はゆっくりと避けられないものになりつつある。我々は破壊を防ぐために必要な措置を講じなければならない。"
 GGZ_agricultural_investments: "農業投資"
 GGZ_textile_production: "繊維生産"
 GGZ_constitution: "我々の憲法"
 GGZ_rule_the_halki: "ハルキの支配"
 GGZ_national_defense: "ガガウズ国防"
 ROM_1989_redeemed_once_more_desc: "我々の革命の夢はまだ実現されておらず、より良い共和国の理想は生き続けている。王国の復興はより良かったかもしれないし、それがどのような道を開いたかは誰にも分からないが、運命はそうは決めなかった。そして我々がそれに抗うとは何者だろうか？"
 ROM_anti_unemployment_fund: "反失業基金"
 ROM_anti_unemployment_fund_desc: "Unemployment is both a burden and a plague. A burden to those who genuinely cannot get a job, and a plague to us. By establishing an anti-unemployment fund, we can eliminate the burden bit by making sure that the unemployed have a source of income for a couple of months with which they can afford to pay their taxes, buy food and medicine and keep them afloat until they find a job, thus also putting a dent in the growth of homelessness."
