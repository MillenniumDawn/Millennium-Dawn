 sov_gru.1.t: "우리나라에 GRU를 파견하려는 러시아"
 sov_gru.1.d: "러시아 정보기관이 우리나라를 지원하기 위해 GRU 교관과 전투 전문가를 파견할 것을 제안했습니다."
 sov_gru.1.a: "동의한다"
 sov_gru.1.b: "그들은 필요 없다"
 sov_gru.2.t: "우리 GRU의 수용에 동의한 [FROM.GetNameWithFlag]"
 sov_gru.2.d: "그들의 정부는 우리 GRU 요원이 자국의 군사 작전에 참여하는 것을 허용하기로 동의했습니다. 우리는 전폭적인 지원을 제공할 준비가 되어 있습니다."
 sov_gru.2.a: "알았다"
 sov_gru.3.t: "우리 GRU를 거부한 [FROM.GetNameWithFlag]"
 sov_gru.3.d: "그들의 정부는 우리 특수부대의 개입을 자국의 정치 체제에 대한 지나친 간섭으로 보고 거부했습니다."
 sov_gru.3.a: "나약한 자들이군"
 sov_gru.4.t: "귀국하는 GRU 요원들"
 sov_gru.4.d: "GRU 장교들이 임무를 마치고 돌아왔으며, 조국을 위해 계속 복무할 준비가 되어 있습니다."
 sov_gru.4.a: "좋다"
 sov_gru.5.t: "E센터 창설"
 sov_gru.5.d: "야권 활동, 특히 친서방 단체를 겨냥한 대응에 주력하는 새로운 내무부 부서를 설립할 것입니다."
 sov_gru.5.a: "알았다"
 sov_gru.6.t: "PMC 바그너의 지원을 제안하는 러시아"
 sov_gru.6.d: "러시아 외교 채널이 현재 상황에서 우리를 지원하기 위해 PMC 바그너 부대를 파견할 것을 제안했습니다."
 sov_gru.6.a: "동의한다"
 sov_gru.6.b: "그들은 필요 없다"
 sov_gru.7.t: "PMC 바그너의 지원에 동의한 [FROM.GetNameWithFlag]"
 sov_gru.7.d: "그들의 정부는 PMC 바그너 지원을 제안한 우리의 요청을 받아들였습니다. 우리 병력이 새로운 임무를 위해 전개하고 있습니다."
 sov_gru.7.a: "알았다"
 sov_gru.8.t: "PMC 바그너의 지원을 거부한 [FROM.GetNameWithFlag]"
 sov_gru.8.d: "그들의 정부는 홀로 상황을 해결할 수 있다고 자신하는 듯, PMC 바그너의 지원을 거부했습니다."
 sov_gru.8.a: "나약한 자들이군"
 sov_gru.9.t: "귀국하는 PMC 바그너"
 sov_gru.9.d: "PMC 바그너 병력이 임무를 마치고 귀국하고 있습니다."
 sov_gru.9.a: "알았다"
 sov_gru.10.t: "PMC 바그너의 지원을 제안하는 러시아"
 sov_gru.10.d: "러시아 외교 채널이 상황을 수습하는 데 도움을 주기 위해 PMC 바그너의 지원을 다시 한번 제안했습니다."
 sov_gru.10.a: "동의한다"
 sov_gru.10.b: "그들은 필요 없다"
 sov_gru.11.t: "PMC 바그너의 지원에 동의한 [FROM.GetNameWithFlag]"
 sov_gru.11.d: "그들의 정부는 PMC 바그너의 지원을 받아들이기로 동의했습니다. 우리 병력이 다시 한번 전개하고 있습니다."
 sov_gru.11.a: "알았다"
 sov_gru.12.t: "PMC 바그너의 지원을 거부한 [FROM.GetNameWithFlag]"
 sov_gru.12.d: "그들의 정부는 자국의 능력을 자신하며 PMC 바그너의 지원을 사양했습니다."
 sov_gru.12.a: "나약한 자들이군"
 sov_gru.13.t: "귀국하는 PMC 바그너"
 sov_gru.13.d: "PMC 바그너 병력이 임무를 마치고 귀국길에 오르고 있습니다."
 sov_gru.13.a: "알았다"
 sov_liberals.26.t: "극동 개발: 2단계"
 sov_liberals.26.d: "이 지역의 성장을 위한 다음 단계의 자금 지원을 발표하면서 우리의 극동 개발 계획이 계속되고 있습니다."
 sov_liberals.26.a: "좋다"
 sov_liberals.27.t: "조지아의 운명"
 sov_liberals.27.d: "조지아는 캅카스에서 여전히 과제로 남아 있습니다. 이 나라와의 관계를 어떻게 관리할지 결정해야 합니다."
 sov_liberals.27.a: "트빌리시로 진군"
 sov_liberals.27.b: "평화적 관계가 여전히 우리의 우선순위이다"
 sov_liberals.28.t: "성공적으로 완료된 작전 \\"달콤한 선물\\""
 sov_liberals.28.d: "우리는 이 나라 최대의 부패 조직망을 적발하여 해체했으며, 최상위 과두 세력과 의원들을 체포했습니다. 이제 우리의 주요 과제는 이 새로운 질서를 유지하는 것입니다."
 sov_liberals.28.a: "반부패재단은 사명을 완수했다"
 sov_liberals.29.t: "살해된 보리스 넴초프!"
 sov_liberals.29.d: "보리스 넴초프는 2015년 2월 27일 모스크바의 볼쇼이 모스크보레츠키 다리 인근에서 우크라이나인 모델 안나 두리츠카야와 걷던 중 암살되었습니다. 공격자들은 그의 이동 경로를 알고 있었으며, 뒤에서 여섯 발을 쏘아 급소를 맞혔습니다. 살인범들은 흰색 자동차를 타고 도주했습니다. 용의자 몇 명이 11년에서 20년 사이의 징역형을 선고받았습니다. 배후는 여전히 알려지지 않았습니다."
 sov_liberals.29.a: "알겠다"
 sov_liberals.30.t: "옐친의 유산"
 sov_liberals.30.d: "소련 붕괴 이후, 혼란을 겪은 지도자 보리스 옐친은 최고회의 해산, 체첸 전쟁, 경제 위기, 실패한 개혁 등 어려운 시기를 이끌었습니다. 이후 러시아는 질서와 성장을 약속한 새 지도자 아래에서 안정을 모색했습니다. 정치 체제는 변화했고, 혼란을 겪은 국가는 다시 결집되었습니다. 미래는 여전히 불확실합니다."
 sov_liberals.30.a: "주의 깊게 지켜보자."
 sov_liberals.31.t: "옐친의 사망"
 sov_liberals.31.d: "RIA는 독립 러시아의 초대 대통령 보리스 옐친이 오랜 심장병 투병 끝에 사망했다고 보도했습니다. 그의 이름을 딴 대학교에서 묵념이 이루어졌으며, 많은 서방 지도자들이 애도를 표했습니다."
 sov_liberals.31.a: "자유의 투사여, 편히 잠드소서."
 sov_liberals.31.b: "편히 잠드소서."
 sov_liberals_news.1.t: "러시아 민주주의 대국민투표"
 SOV_nazbols_new_russian_order: "새로운 러시아 질서"
 SOV_nazbols_new_russian_order_desc: "러시아에 새로운 질서가 밝아오고 있습니다! 분열을 끝내고 국가에 단결을 되찾을 때입니다."
 SOV_nazbols_no_more_oligarch: "과두 세력 처리"
 SOV_nazbols_no_more_oligarch_desc: "과두 세력은 러시아를 착취하는 일을 멈추어야 합니다. 그들의 약탈을 끝내기 위해 단호한 조치를 취할 것입니다!"
 SOV_nazbols_natiolalize: "기업 국유화"
 SOV_nazbols_natiolalize_desc: "대기업은 90년대의 암울한 기억을 떠올리게 합니다. 국가와 국민의 이익을 위해 이들을 국유화할 것입니다."
 SOV_nazbols_west_nationalise: "서방 기업 국유화"
 SOV_nazbols_west_nationalise_desc: "90년대에 우리 영토에 진출한 서방 기업들은 떠나야 합니다. 우리의 것을 되찾을 때입니다."
 SOV_nazbols_destroy_republic: "민족 공화국 폐지"
 SOV_nazbols_destroy_republic_desc: "민족 공화국은 러시아에 있을 자리가 없습니다. 소련의 실수를 되풀이하지 않을 것입니다."
 SOV_nazbols_federalism: "연방주의 이념 고수"
 SOV_nazbols_federalism_desc: "우리는 진정한 연방주의를 지지합니다! 연방 구성체는 단지 수도를 위해 봉사하는 지역이 아니라 자치적이어야 합니다."
 SOV_nazbols_no_export: "폐쇄된 러시아 경제"
 SOV_nazbols_no_export_desc: "폐쇄 경제는 강한 경제입니다. 러시아는 필요한 모든 것을 갖추고 있으므로 이러한 방식을 택할 여력이 있습니다."
 SOV_nazbols_cut_fsb: "FSB 예산 삭감"
 SOV_nazbols_cut_fsb_desc: "우리 정부는 시민을 지나치게 감시하는 비밀 기관에 과도한 예산을 쓰고 있습니다. 우리는 자유로운 국가이므로 FSB 예산을 줄이고 이 조직을 축소할 것입니다!"
 SOV_nazbols_help_science: "러시아에 봉사하는 과학"
 SOV_nazbols_help_science_desc: "과학은 진보를 이끄는 원동력이며, 우리는 자금 지원을 늘려 이 엔진에 전력으로 연료를 공급할 것입니다."
 SOV_nazbols_hate_democracy: "자유주의와 공산주의에 대한 증오"
 SOV_nazbols_hate_democracy_desc: "자유주의와 공산주의는 우리나라의 쇠퇴와 러시아 정신의 상실을 불러왔습니다. 우리는 그들이 우리나라를 파괴하도록 내버려 두지 않을 것입니다."
 SOV_nazbols_new_industrialization: "신산업화"
 SOV_nazbols_new_industrialization_desc: "소련 시대 산업의 힘을 되살리기 위해 새로운 산업화 사업에 착수할 것입니다!"
 SOV_nazbols_capital_return: "자본 환수 사단"
 SOV_nazbols_capital_return_desc: "해외에 있는 러시아 자본을 어떤 수단을 써서라도 되찾는 임무를 맡은 특별 기관을 창설할 계획입니다."
 SOV_nazbols_free_weapon: "무기 자유 휴대"
 SOV_nazbols_free_weapon_desc: "무기를 자유롭게 휴대할 권리는 러시아 사회를 바꿀 것입니다! 모든 시민은 자기방어의 권리를 가져야 합니다."
 SOV_nazbols_back_russians: "러시아인의 조국 귀환"
 SOV_nazbols_back_russians_desc: "러시아어 사용자들이 조국으로 돌아오는 것을 적극 장려하고 재정적으로 지원할 것입니다."
 SOV_nazbols_return_russian_territories: "분쟁 중인 러시아 영토 반환"
 SOV_nazbols_return_russian_territories_desc: "구소련 내 러시아인 문제는 여전히 해결되지 않은 채 남아 있습니다. 우리는 이를 단호하게 해결할 것입니다. 최후통첩으로 해결하지 못하면 우리가 삼켜질 위험이 있습니다."
 SOV_nazbols_belarus_go_home: "벨라루스 반환"
 SOV_nazbols_belarus_go_home_desc: "벨라루스는 우리에게서 부당하게 빼앗긴 조국의 일부입니다. 러시아인에게 이 작은 지역보다 더 고향 같은 땅은 없습니다."
 SOV_nazbols_separatists_go_home: "분리주의 공화국 병합"
 SOV_nazbols_separatists_go_home_desc: "트란스니스트리아, 압하지야, 남오세티야. 이른바 그들의 독립은 옐친 시대 러시아가 남긴 실책입니다. 우리가 이를 바로잡을 것입니다."
 SOV_nazbols_help_artsakh: "아르차흐 보호"
 SOV_nazbols_help_artsakh_desc: "아르차흐는 구소련 공간에서 가장 확고한 기독교 영토이며, 가장 정통한 아르메니아인들의 터전입니다. 우리는 그들을 보호해야 합니다!"
 SOV_nazbols_help_kurdistan: "쿠르디스탄 보호"
 SOV_nazbols_help_kurdistan_desc: "우리가 외교적 영향력을 얻는다면 쿠르디스탄은 이 지역에서 우리의 발판이 될 것입니다. 이란, 이라크, 튀르키예는 그곳에서의 우리의 힘을 감안하지 않을 수 없을 것입니다."
 SOV_nazbols_anti_westes: "반서방 교리"
 SOV_nazbols_anti_westes_desc: "러시아 정신을 점령한 서방 점령자들에게 자비는 없습니다!"
 SOV_nazbols_ayatolla: "러시아의 아야톨라"
 SOV_nazbols_ayatolla_desc: "이란의 아야톨라에게서 영감을 받아, 러시아는 영혼 없는 부처가 아니라 국민의 도덕적 균형을 유지해 줄 정신적 지도자가 필요합니다."
 SOV_nazbols_our_irgc: "공산 정교 혁명 수호대"
 SOV_nazbols_our_irgc_desc: "우리 체제의 이념적 성과를 지키기 위해 이란 IRGC에 상응하는 러시아의 조직을 창설할 것입니다."
 SOV_nazbols_ruralisation: "농촌화"
 SOV_nazbols_ruralisation_desc: "우리 경제의 농공업 부문을 발전시키는 데 대규모 투자를 할 것입니다."
 SOV_nazbols_new_religion: "공산 정교회"
 SOV_nazbols_new_religion_desc: "정교회는 제2차 세계대전 중 나치와 협력하기까지 하며 신뢰를 잃었습니다. 러시아의 모든 정신적 유산을 종합한 새로운 교회를 세울 것입니다."
 SOV_free_weapon: "Free Carrying of Weapons"
 SOV_russians_back_idea: "동포 귀환"
 SOV_nazbol_irgc_idea: "공산 정교 혁명 수호대"
 sov_nazbol.1.t: "우리를 병합하려는 러시아"
 sov_nazbol.1.d: "러시아 정부가 자국에 합류하는 국민투표를 요구하는 최후통첩을 보내왔습니다. 예상되는 결과를 우리는 알고 있으므로, 이제 어떻게 대응할지 결정해야 합니다."
 sov_nazbol.1.a: "물론이지, 이제 러시아라는 고향으로 돌아갈 때다"
 sov_nazbol.1.b: "오늘은 아니다"
 sov_nazbol.2.t: "[SOV.GetName]에 통합된 [FROM.GetName]"
 sov_nazbol.2.d: "[FROM.GetName]이(가) 우리의 영광스러운 제국에 완전히 통합되었습니다. 우리는 지난 한 세기 동안 잃어버린 것을 되찾고 있으며 지금 멈추지 않을 것입니다."
 sov_nazbol.2.a: "우리나라는 더욱 강해졌다"
 sov_nazbol.3.t: "우리 영토를 요구하는 러시아!"
 sov_nazbol.3.d: "러시아는 자신들의 것이라 간주하는 우리 영토의 일부에 대해 최후통첩을 요구하고 있습니다. 어떻게 대응할지 결정해야 합니다."
 sov_nazbol.3.a: "양보하겠다"
 sov_nazbol.3.b: "절대 안 된다"
 sov_nazbol.4.t: "연립정부에 합류한 민족볼셰비키"
 sov_nazbol.4.d: "민족볼셰비키는 집권 연정에 참여하여 국내 정치를 향한 영향력을 확보합니다."
 sov_nazbol.4.a: "그렇다, 승리를 향해!"
 SOV_nazbol_destroy_republics_TT: "모든 §Y민족 공화국§!이 §R폐지§!되지 않았음"
 SOV_wagner_minoboroni: "국방부의 보급"
 SOV_wagner_minoboroni_desc: "국방부가 우리 작전을 수행하는 데 필요한 무기를 제공할 것입니다. 이 지원은 우리의 역량을 크게 강화할 것입니다."
 SOV_wagner_cadres: "모집 절차 개시"
 SOV_wagner_cadres_desc: "PMC에 합류할 첫 후보자들을 모집하기 시작할 것입니다. 신중한 선발은 우리 작전의 성공에 매우 중요합니다."
 SOV_wagner_first_pmc: "PMC 제1대대"
 SOV_wagner_first_pmc_desc: "우리의 첫 PMC 대대가 편성되었으며, 첫 전투 임무를 개시할 준비가 거의 끝났습니다. 이는 영향력을 확대하는 데 있어 중요한 이정표입니다."
 SOV_wagner_more_operations: "활동 확대"
 SOV_wagner_more_operations_desc: "우리 PMC는 이제 전 세계의 작전에 참여할 준비가 되었습니다. 이러한 확대는 우리의 세계적 영향 범위와 파급력을 높일 것입니다."
 SOV_wagner_african: "아프리카 방면"
 SOV_wagner_african_desc: "아프리카는 소련 붕괴 이후 잃어버린 땅이며, 그곳에서 우리의 영향력을 되찾을 때가 되었습니다. 우리의 주둔을 재구축하면 새로운 전략적 기회가 열릴 것입니다."
 SOV_wagner_support_gru: "GRU 작전 지원"
 SOV_wagner_support_gru_desc: "러시아 외교 정책의 효율을 높이기 위해 GRU 임무를 지원할 것입니다. 협력은 비밀 작전의 성공률을 높일 것입니다."
 SOV_wagner_rusich: "DShRG 루시치"
 SOV_wagner_rusich_desc: "또한 소규모 민족주의자 대대를 우리 대열에 통합하여 PMC를 강화할 것입니다. 이들의 이념적 헌신은 우리 임무에서 귀중한 동맹이 되게 합니다."
 SOV_russian_government_idea: "러시아 정부"
 SOV_russian_government_idea_desc: "러시아의 정치 상황은 특히 소련 붕괴 이후 언제나 불안정했습니다. 여기에는 내부 분리주의, 정치적 불안정, 국가의 운명에 대한 대중의 무관심 등 많은 요인이 작용하고 있습니다."
