EGY_military_decision_desc: "\n\n\n\n£EGY_desctext_militar\n\n\n\n\n\nThe Egyptian Military does not hesitate to make itself present in our nation's politics, and therefore their influence over our actions will determine their stance on whether they like us or not. If Military Internal Faction is removed, Civil War will start!\n\nIf your §YStanding§! with the [EGY.Nat_Autocracy_L] falls below §Y-100§!, the Armed Forces will take action to depose the government.\n\nOur current §YStanding§!: [?EGY_military_standing_value|0+]\n\n[?EGY_military_standing_party|=0+] from our current §YRuling Party§!\n[?EGY_military_standing_spending|=0+] from £pol_idea §GMilitary Spending Level§!\n[?EGY_military_standing_opinion|=0+] from §YThe Military§! Current Opinion\n[?EGY_military_standing_corruption|=0+] from our §YCorruption Level§!\n[?EGY_military_standing_economy|=0+] from our §YEconomic Cycle§!\n[?EGY_military_standing_interest_rate|=0+] from our §YInterest Rate§!"

