 pak_raj_border_attack_563_from_429_desc:0 "Avançar do Punjab Oriental rumo ao Punjab Central. Um avanço bem-sucedido adiciona §Y20 de Progresso da Reivindicação§! rumo a este estado; um rechaço custa §Y10§!."
 pak_raj_border_attack_573_from_984:0 "Atacar o Punjab Meridional a partir do Rajastão Ocidental"
 pak_raj_border_attack_573_from_984_desc:0 "Avançar através do Deserto de Thar, do Rajastão Ocidental rumo ao Punjab Meridional. Um avanço bem-sucedido adiciona §Y20 de Progresso da Reivindicação§! rumo a este estado; um rechaço custa §Y10§!."
