l_french:
 free_states_of_america_focus: "Priorités nationales des États libres d’Amérique"
 the_dust_settles: "La poussière est retombée… Que faisons-nous maintenant ?"
 FS_established_elections: "Les élections ont été rétablies"
 FS_continued_election_ban: "Les élections ont été arrêtées"
 USB_UFSR_desc: "[USB.GetFlag]§YÉtats libres d’Amérique§! Changent de nom pour devenir l’§YUnion des Républiques Socialistes Libres§!"
 USB_MidAtlantic_Union_desc: "[USB.GetFlag]§YÉtats libres d’Amérique§! Changent de nom pour devenir l’§YUnion Militaire du Mid-Atlantic§!"
 USB_MidAtlantic_States_desc: "[USB.GetFlag]§YÉtats libres d’Amérique§! Changent de nom pour devenir l’§YUnion Fédérale du Mid-Atlantic§!"
 USB_second_american_republic_desc: "[USB.GetFlag]§YÉtats libres d’Amérique§! Changent de nom pour devenir la §YSeconde République Américaine§!"
 free_states_idea_isolationist_focused_foreign_office: "Ministère des affaires isolationnistes"
 free_states_idea_isolationist_focused_foreign_office_desc: "Étant donné l'état critique de notre nation, la plupart des nominations au ministère des affaires étrangères sont perçues comme des postes lucratifs sans réelle importance. Cette apathie découle de la nécessité de reconstruire la société elle-même. Cependant, à mesure que nous progressons et prospérons, nous pourrons envisager des perspectives plus prometteuses à l'avenir."
 free_states_idea_neighborhood_foreign_policy: "Politique de voisinage"
 free_states_idea_neighborhood_foreign_policy_desc: "Alors que notre nation atteint un sommet économique, militaire et politique, un regain d'intérêt international s'est manifesté récemment. Puisque nous devons encore définir nos véritables priorités, nous nous préparons à interagir avec nos voisins selon nos propres termes. Cette étape n'est qu'une indication que nous atteindrons bientôt la grandeur et retrouverons notre place sur la scène mondiale."
 free_states_idea_naval_budget_priorities: "Priorité au budget naval"
 free_states_idea_naval_budget_priorities_desc: "La majorité des forces militaires héritées de l'ancien régime étant liées à la marine, nos priorités budgétaires commencent à refléter cette influence. Mais cette orientation est-elle vraiment judicieuse alors que nous sommes tournés vers le continent et non nécessairement vers la mer ?"
 free_states_idea_army_defensive_budgeting: "Budget défensif de l'armée"
 free_states_idea_army_defensive_budgeting_desc: "Les guerres modernes peuvent être gagnées rapidement ou s'éterniser. Le citoyen d'aujourd'hui dispose de plus de pouvoir qu'il ne le croit, et nous en sommes conscients. Notre doctrine moderne combine des aspects de la guerre de quatrième génération avec une approche classique d'usure. Cela garantit une défense mobile à moindre coût, tant en matériel qu'en personnel. Cette nouvelle doctrine porte le nom de GED, ou Guerre d'Expenditure Défensive."
 free_states_idea_foreign_relations_act: "Loi sur les relations internationales"
 free_states_idea_foreign_relations_act_desc: "La Loi sur les relations internationales est un investissement diplomatique visant à séduire les puissances étrangères pour obtenir de meilleurs accords commerciaux et des programmes d'échange de travailleurs. Cela stimulera notre économie, mais nos capacités politiques seront mises à rude épreuve pour honorer ces engagements."
 free_states_idea_domestic_priority_policy: "Politique de priorité nationale"
 free_states_idea_domestic_priority_policy_desc: "La PPN incarne l'idée que la politique intérieure et le bien-être de la nation et de ses citoyens sont la priorité absolue. Nous devons garantir la sécurité de notre défense nationale. Cette approche introspective implique que la politique étrangère doit privilégier la sécurité du pays. Ainsi, des domaines comme le commerce et la défense nationale sont au cœur de ce plan."
 free_states_idea_diplomatic_corps: "Corps diplomatique"
 free_states_idea_diplomatic_corps_desc: "Amis comme ennemis se présentent sous toutes les formes. Pour identifier clairement les uns et les autres, nous devons disposer d'un corps diplomatique de premier ordre, capable de fournir des informations rapides sur les relations internationales en cas de changements soudains."
 free_states_idea_national_labor_corps: "Corps national du travail"
 free_states_idea_national_labor_corps_desc: "La combinaison d'un corps de travail pénal et civil permet d'aider ceux qui ont besoin d'un emploi ou d'un revenu, tout en offrant à ceux qui ont nui à la société une chance de contribuer à son amélioration. En somme, le CNT sera utilisé pour développer et maintenir l'appareil en expansion de notre nation."
 FSA_america_military_surplus_jobs: "Emplois dans les surplus militaires"
 FSA_america_military_surplus_jobs_desc: "Produire du matériel pour l'armée, qu'il s'agisse d'armes ou d'objets aussi simples que des gourdes pour l'infanterie, est important à sa manière. Quelle meilleure façon de lutter contre le chômage temporairement qu'en utilisant les industries militaires pour fournir davantage d'équipements et de ravitaillements à nos défenseurs, tout en mettant un revenu dans les mains de ceux qui cherchent encore un emploi civil stable ?"
 free_states_idea_extreme_mining_projects: "Projets miniers extrêmes"
 free_states_idea_extreme_mining_projects_desc: "Certains qualifient nos opérations minières de téméraires, mais elles nous ont propulsés vers une reconnaissance internationale grâce à des exploitations intensives et souvent extrêmes. Bien que beaucoup désapprouvent cette approche dite « impitoyable », nous ne pouvons ignorer le levier qu'elle nous offre dans les négociations commerciales et les avantages qu'elle procure à nos citoyens via les biens échangés."
 free_states_idea_strategic_autarky: "Programme d'autarcie stratégique"
 free_states_idea_strategic_autarky_desc: "Le PAS, ou Programme d'Autarcie Stratégique, est une initiative nationale visant à limiter au maximum nos accords commerciaux, tout en veillant à ce que ceux que nous concluons servent avant tout l'intérêt de nos citoyens. Cette stratégie peut ne pas être bien vue sur la scène internationale, mais notre préservation en dépend."
 free_states_idea_consumer_complex_initiative: "Initiative du complexe consumériste"
 free_states_idea_consumer_complex_initiative_desc: "L'ICC est un modèle économique qui place les industries de consommation au centre de l'organisation économique. Dans cette optique, les industries de défense ou spécialisées, considérées comme le « secteur des officiers », sont secondaires et jouent un rôle complémentaire selon les besoins nationaux. Cela ralentit la construction de ces secteurs, mais avec des citoyens bien pris en charge, qu'importe."
 free_states_idea_economic_efficiency_model: "Modèle d'efficacité économique"
 free_states_idea_economic_efficiency_model_desc: "Quand on parlait de construire en hauteur, beaucoup pensaient uniquement aux bâtiments pour regrouper plus de monde. Avec notre nouveau plan MEE, nous faisons de la hauteur un modèle économique. En optimisant les industries pour produire davantage avec moins, nous préservons les ressources tout en maintenant une croissance équilibrée et efficace."
 free_states_idea_military_readiness_model: "Modèle de préparation militaire"
 free_states_idea_military_readiness_model_desc: "Le MPM est un modèle économique axé sur la militarisation préventive de l'économie. Les usines et industries sont conçues avec l'idée qu'elles pourraient être converties en installations de production de guerre. Cela permet à notre économie de fonctionner de manière durable tout en restant hautement adaptable en cas de besoin."
 free_states_idea_department_for_synthetic_development: "Département du développement synthétique"
 free_states_idea_department_for_synthetic_development_desc: "Tout le monde sait que les combustibles fossiles sont limités, mais que se passerait-il si nous pouvions repousser cette limite aussi loin que possible scientifiquement ? C'est là qu'intervient le DDS, un département de recherche dédié à explorer ces limites et à développer les synthétiques de demain, qu'il s'agisse de plastiques, de nylons ou de produits chimiques et lubrifiants issus des industries pétrochimiques. Nous utilisons le passé pour bâtir l'avenir."
 free_states_idea_department_for_energy_innovation: "Département des innovations énergétiques"
 free_states_idea_department_for_energy_innovation_desc: "Pour prétendre façonner l'avenir, nous devons nous assurer qu'il est véritablement futuriste sur le plan scientifique. Le DIE est donc dédié à la découverte de nouvelles méthodes de production énergétique et à des moyens plus efficaces de consommer l'énergie sans gaspillage, dans la mesure du possible."
 free_states_idea_infrastructure_readiness_act: "Loi sur la préparation des infrastructures"
 free_states_idea_infrastructure_readiness_act_desc: "La Loi sur la préparation des infrastructures est une déclaration de guerre contre la négligence et la paresse en matière d'entretien des infrastructures nationales. En fixant des intervalles d'inspection, en planifiant à l'avance les dates de construction et l'acquisition de matériaux, nous permettons des réparations rapides et un entretien efficace tout en limitant les perturbations dans la vie quotidienne des populations locales."
 free_states_idea_defensive_officers_school: "École des officiers défensifs"
 free_states_idea_defensive_officers_school_desc: "Nous devons apprendre à tenir bon. Une formation spécialisée axée sur l'optimisation des ressources limitées nous permettra de gérer efficacement nos initiatives de défense face à un ennemi imprudent."
 free_states_idea_the_bulwark_doctrine: "Doctrine du rempart"
 free_states_idea_the_bulwark_doctrine_desc: "La Doctrine du rempart marque un tournant fondamental dans la préservation de la défense et de l'esprit de notre nation. Savoir utiliser le terrain, la logistique et la capacité à défendre jusqu'au bout sans que tous périssent : c'est cet ensemble qui déterminera si nous survivrons ou si nous serons balayés par les épreuves du temps."
 free_states_idea_the_fighter_defense_doctrine: "Doctrine de défense aérienne"
 free_states_idea_the_fighter_defense_doctrine_desc: "Protéger nos cieux, c'est sécuriser nos forces terrestres. Nous devons donc spécialiser notre entraînement et notre production aéronautique pour garantir la suprématie de nos capacités aériennes."
 free_states_idea_the_increasing_defensive_capabilites: "Renforcement des capacités défensives"
 free_states_idea_the_increasing_defensive_capabilites_desc: "Le programme RCD utilise nos méthodes de production aéronautique pour aider nos pilotes humains à accomplir des exploits aériens hors du commun. Innovations radar, avancées en contrôle de vol et en propulsion : nous serons les défenseurs des voies aériennes de notre nation, et le ciel restera dégagé tous les jours."
 free_states_idea_naval_mining_warfare_refinement_program: "Programme de perfectionnement de la guerre des mines navales"
 free_states_idea_naval_mining_warfare_refinement_program_desc: "Le Programme de perfectionnement de la guerre des mines navales est une institution dédiée à la formation et à l'amélioration de notre marine autour de l'expertise des mines marines et de la guerre de minage."
 free_states_idea_armored_assault_assist_groups: "Groupes d'assistance à l'assaut blindé"
 free_states_idea_armored_assault_assist_groups_desc: "Les GAAB, ou Triple AG, sont une doctrine de combat visant à localiser et spécialiser les éléments blindés pour assister notre armée principale à percer et diviser les forces ennemies."
 free_states_idea_aggressive_officer_corps: "Corps d'officiers agressifs"
 free_states_idea_aggressive_officer_corps_desc: "La refonte de nos programmes de formation des officiers et de nos académies militaires permettra à nos chefs d'adopter une agressivité inédite. Cela aura un coût, mais nous veillerons à ce que tout ennemi qui nous attaque regrette amèrement son choix."
 free_states_idea_material_not_human_loss: "Perte matérielle, pas humaine"
 free_states_idea_material_not_human_loss_desc: "Le matériel peut être remplacé, mais pas les soldats expérimentés et entraînés. Nous adopterons des styles d'entraînement qui acceptent la perte certaine d'équipements, mais considèrent la perte de camarades comme irremplaçable."
 free_states_idea_survivability_program: "Programme de survivabilité"
 free_states_idea_survivability_program_desc: "Nous devons innover en matière de survivabilité. À cet égard, nous explorerons et développerons des moyens de maximiser non seulement la survie du personnel, mais aussi, dans la mesure du possible, celle des équipements."
 free_states_idea_admirable_admiralty: "Amirauté admirable"
 free_states_idea_admirable_admiralty_desc: "La compétence et le talent brut de nos chefs navals sont au cœur de notre suprématie maritime."
 FSA_america_hit_and_hit_again: "Frapper, puis frapper encore"
 FSA_america_hit_and_hit_again_desc: "Avez-vous déjà envisagé la guerre psychologique avec des navires ? Eh bien, c'est désormais possible. En comprenant les faiblesses humaines, nous orientons nos tactiques autour de coups critiques portés après avoir désorienté les équipages ennemis. C'est un pari risqué, mais s'il réussit, il infligera des frappes dévastatrices aux capacités de la flotte adverse."
 free_states_idea_the_assimilation_program: "Programme d'assimilation"
 free_states_idea_the_assimilation_program_desc: "Créer une nouvelle identité à partir d'idées anciennes n'est souvent pas populaire auprès des individus et des idéalistes. Nous devons donc contrer ces préjugés et freiner les tendances perturbatrices qui en découlent."
 free_states_idea_the_second_american_republic: "La 2e République américaine"
 free_states_idea_the_second_american_republic_desc: "À travers le sang, la sueur, les larmes et bien d'autres épreuves, nous avons revendiqué notre destin. En renouvelant le rêve américain et en créant la 2e République américaine, un nouveau chapitre s'ouvre dans le livre de la liberté, commencé par les fondateurs en 1776. Vers une nouvelle ère, une nouvelle lumière et un nouvel avenir pour notre république."
 free_states_idea_the_self_made_embargo: "Embargo autoproclamé"
 free_states_idea_the_self_made_embargo_desc: "Grâce à la technologie moderne et aux méthodes de synthèse, les idéaux autarciques et isolationnistes peuvent être réalisés comme jamais auparavant. Nous établirons ainsi un précédent inédit depuis l'époque du shogunat japonais."
 free_states_idea_ground_to_air_dominance: "Domination sol-air"
 free_states_idea_ground_to_air_dominance_desc: "N'ayant nulle part où fuir, cessons de courir et commençons à nous battre. Des investissements massifs dans des capacités de combat sol-air pratiques nous permettront de tenir tête dans toute guerre aérienne moderne sur nos terres légitimes. De plus, cet équipement peut également servir dans des combats souterrains si des parties de notre territoire sont assiégées."
 free_states_idea_graveyard_warfare_doctrine: "Doctrine de la guerre du cimetière"
 free_states_idea_graveyard_warfare_doctrine_desc: "La DGC, ou Doctrine de la Guerre du Cimetière, est une doctrine complète liée à la guerre asymétrique ou de quatrième génération. Cette stratégie de guerre citoyenne fera vivre un enfer à toute puissance étrangère souhaitant soumettre notre peuple."
 free_states_divided_we_fell: "Divisés, nous sommes tombés"
 free_states_divided_we_fell_desc: "La république n'est plus, nous ne sommes qu'une ombre de ce que nous étions. Les terres brûlent, les gens meurent, fuient ou survivent tant bien que mal. Cela signifie que nous sommes seuls, mais nos voisins du nord et du sud reçoivent une aide face à la plus grande crise humanitaire ayant frappé les continents du Nouveau Monde. La route est brisée, semée d'obstacles, mais nous devons avancer et chercher un horizon, quel qu'il soit."
 free_states_federal_budgets: "Politiques budgétaires fédérales"
 free_states_federal_budgets_desc: "Pour assurer la prospérité, nous devons équilibrer les comptes. Nous devons apprendre du monde qui nous entoure et comprendre que la dette est un chiffre à maîtriser, pas à ignorer."
 free_states_domestic_policies: "Politiques intérieures"
 free_states_domestic_policies_desc: "Nous devons nous efforcer d'améliorer la vie de notre peuple, de construire non seulement notre nation, mais aussi les citoyens et la culture qui composent ce que nous appelons notre foyer."
 free_states_industrial_policies: "Département des affaires industrielles"
 free_states_industrial_policies_desc: "Le DAI, parfois appelé AAI (Administration des affaires industrielles), est une branche du gouvernement chargée de réguler, rationaliser et façonner notre économie. Il travaille main dans la main avec le DGR pour créer des réglementations équilibrées et des plans visant à développer, diversifier et contrôler l'économie de notre nation. Alors que le DGR gère strictement l'allocation et l'organisation des ressources, l'AAI s'occupe de la planification et de l'innovation au sein des entreprises qui exploitent ces ressources."
 free_states_resource_management_policies: "Département de la gestion des ressources"
 free_states_resource_management_policies_desc: "Le Département de la gestion des ressources, ou simplement DGR, est une agence gouvernementale dédiée à la reconstruction et à la réorganisation de la société elle-même. En se concentrant sur les ressources disponibles, ou dans ce cas, sur ce qui ne l'est pas, ce département permet de définir des priorités et de trouver des moyens de produire davantage avec moins. Il jouera un rôle clé dans l'orientation de notre développement et dans la marque que nous laisserons dans l'histoire."
 free_states_tax_policies: "Politiques fiscales"
 free_states_tax_policies_desc: "Pour mesurer notre progrès, nous devons disposer d'un code fiscal stable et adaptable. Ce code doit répondre aux besoins de notre peuple et aux intérêts nationaux qui garantiront notre avenir et la voie que nous traçons pour y parvenir."
 free_states_army_service_branch: "Branche de l'armée de terre"
 free_states_army_service_branch_desc: "Colonne vertébrale de la défense nationale et cœur de notre militaire, l'armée. Pour préserver notre nation et son peuple, nous devons réformer et établir une force combattante capable non seulement de défendre notre patrie, mais aussi de faire face aux ennemis qui menacent notre mode de vie."
 free_states_air_force_service_branch: "Branche de l'armée de l'air"
 free_states_air_force_service_branch_desc: "Bien que l'armée de terre soit la colonne vertébrale, la reine du champ de bataille se trouve dans les airs, avec l'armée de l'air. Nous devons suivre le rythme de nos ennemis si nous voulons protéger véritablement notre territoire. Car ce qu'ils ne peuvent attaquer au sol, ils peuvent assurément le bombarder ou le mitrailler depuis les cieux."
 free_states_navy_service_branch: "Branche de la marine"
 free_states_navy_service_branch_desc: "La marine est l'écran qui retarde et nous avertit des intentions de l'ennemi. Nous devons avoir une marine puissante pour créer une dissuasion et protéger notre patrie contre les menaces venant d'au-delà des terres que nous partageons."
 free_states_idea_hit_them_again_doctrine: "Doctrine du double coup"
 free_states_idea_hit_them_again_doctrine_desc: "Quand vous jetez tout ce que vous avez sur quelqu'un, il panique, recule ou perd sa cohésion. Exploitons cette idée en instaurant une nouvelle tactique contre l'ennemi. En préparant la flotte ou les navires à déchaîner tout leur arsenal simultanément, cette désorientation permettra une frappe de précision rapide pour infliger des coups critiques ou éliminer les vaisseaux adverses."
 USA_colorado_capital: "Mont Columbia"
 USA_kansas_capital: "Nouvelle Arlington"
 USA_missouri_capital: "Winfield"
 post_united_event.1.t: "Le factionnalisme fracture les États libres"
 post_united_event.1.d: "Dans la précipitation à reconstruire une société appelée les États libres d'Amérique, le gouvernement fédéral de cette nation résiduelle a vu émerger un fort factionnalisme. Ce factionnalisme se divise en quatre groupes principaux : les socialistes au nord, les militaristes à l'est, les monarchistes au sud et les fédéralistes au centre et à l'ouest. Ces factions se sont regroupées en deux blocs principaux, d'autres détails suivront à mesure que nous en apprendrons davantage."
 post_united_event.1.o1: "Ne nous sommes-nous pas assez divisés ?"
 post_united_event.2.t: "Le groupe pro-élections"
 post_united_event.2.d: "Face à la montée récente du factionnalisme politique, nous assistons à l'émergence de groupes pro-élections comme le Parti fédéraliste, le Parti socialiste libre et le Parti monarchiste moderne. Bien que ces partis diffèrent dans leurs objectifs et manquent de cohésion, ils se sont tous accordés sur le principe des élections. Ils estiment qu'un système de vote aussi représentatif que possible, vu l'état actuel des choses, est essentiel. Beaucoup espèrent que voter pour l'avenir nous unira plus qu'il ne nous divisera à long terme, mais seul le temps le dira."
 post_united_event.2.o1: "Votons pour l'avenir que nous voulons"
 post_united_event.3.t: "Le groupe anti-élections"
 post_united_event.3.d: "D'un autre côté, nous avons les partis anti-élections, composés du Parti fédéraliste, du Parti socialiste libre et du Parti des services unis. Comme on peut le voir, le factionnalisme divise les deux principaux partis, fédéraliste et socialiste libre, ce qui pourrait compliquer les futurs scrutins si des élections avaient lieu. Bien que nous en sachions peu sur l'ampleur de ces divisions, nous verrons ce qu'il adviendra dans les jours à venir alors que le débat se poursuit."
 post_united_event.3.o1: "Nous devons nous concentrer, pas débattre."
 post_united_event.4.t: "Le sondage clivant"
 post_united_event.4.d: "Au cours des dernières semaines, les sondeurs et les journalistes ont parcouru le pays dans une sorte de pseudo-scrutin baptisé « Sondage national », qui a révélé de profondes divisions sur la direction à prendre. En fin de compte, beaucoup ont convenu que des élections, dans l'état actuel de faiblesse et de désarroi, ne feraient que nous distraire. Il revient désormais aux quatre principaux partis de convaincre l'opinion publique. Le Parti fédéraliste et sa faction conservatrice, la faction étatiste du Parti socialiste libre, la faction isolationniste du Parti du Mid-Atlantic ou la faction militariste du Parti du service national. Tous veulent des choses différentes, mais partagent un objectif commun : pas d'élections et une identité plus autosuffisante à court terme."
 post_united_event.4.o1: "Les fédéralistes remportent la victoire"
 post_united_event.4.o2: "Le PSL communalise la victoire"
 post_united_event.4.o3: "Le PMA isolationniste s'empare du pouvoir"
 post_united_event.4.o4: "Le PSN gagne une nouvelle bataille"
 post_united_event.5.t: "Les premières élections"
 post_united_event.5.d: "Avec le rétablissement des élections, l'heure est venue de voter et de laisser le peuple choisir la direction qu'il souhaite prendre. Ainsi, les partis fédéraliste, socialiste libre, Mid-Atlantic et du service national cherchent tous à obtenir le soutien populaire pour décrocher une majorité claire. Mais à mesure que le temps passe et que les votes sont comptés, le vainqueur des premières élections officielles est..."
 post_united_event.5.o1: "Les fédéralistes l'emportent"
 post_united_event.5.o2: "Victoire des socialistes libres"
 post_united_event.5.o3: "Le Parti du Mid-Atlantic l'emporte, évidemment"
 post_united_event.5.o4: "Le Parti du service national mène à la victoire"
 post_united_event.1000.t: "La grande question"
 post_united_event.1000.d: "Portés par un vent d'optimisme, nous avons pris une initiative nationale audacieuse en proposant un changement de nom pour la nation. Un vote national a été organisé, et les résultats seront bientôt connus. Le pari est risqué, mais nous verrons ce que le peuple désire vraiment... espérons qu'il nous choisisse."
 post_united_event.1000.o1: "Nous sommes Arcadia !!!"
 post_united_event.1000.o2: "Au moins, nous sommes unis... n'est-ce pas ?"
 post_united_event.2000.t: "La crise de la capitale"
 post_united_event.2000.d: "Suite à la 2e Destinée manifeste, l'attention du peuple se tourne vers la capitale, encore située dans l'ancien taudis de la côte est. Beaucoup estiment que la capitale ne devrait pas changer en raison de son symbolisme, tandis que d'autres pensent qu'un changement marquerait l'évolution de la nation dans son ensemble. Une nouvelle capitale permettrait une meilleure planification pour agrandir la Chambre des représentants, un point que beaucoup jugent comme une des failles majeures de l'ancien régime politique. De plus, une capitale plus centrale donnerait de la visibilité à des populations qui n'auraient jamais envisagé de s'intéresser aux affaires du gouvernement fédéral. Plusieurs options sont envisagées, et il revient au peuple et à ses dirigeants de faire un choix."
 post_united_event.2000.o1: "Pourquoi changer ? Tout va bien."
 post_united_event.2001.t: "Les Rocheuses"
 post_united_event.2001.d: "Beaucoup plaident pour la création d'une région capitale près ou directement dans les Rocheuses. Cela offrirait une forteresse naturelle en cas d'attaque contre notre nation. D'autres estiment que cela pourrait être perçu comme trop isolant. Quoi qu'il en soit, les planificateurs ont déjà commencé à poser les bases d'une colonie dans le nord du Colorado."
 post_united_event.2001.o1: "On aura du Rocky Road à bas prix ?"
 post_united_event.2002.t: "Le gouvernement « central »"
 post_united_event.2002.d: "Les planificateurs du Kansas soutiennent que leur proposition pour une nouvelle capitale est l'une des plus centrales géographiquement. Cela serait perçu comme équitable et éviterait de favoriser la côte est ou la côte ouest. Nous devrons néanmoins évaluer les autres options pour garantir la validité de notre choix."
 post_united_event.2002.o1: "Ils n'ont pas tort."
 post_united_event.2003.t: "L'option de la barrière fluviale"
 post_united_event.2003.d: "Récemment, beaucoup jugent plus réalisable de placer la capitale près du Mississippi, une barrière naturelle contre les assauts terrestres ennemis. Symbole de la supposée division continentale de notre nation, cette position est plus sûre grâce au fleuve qui couvre son flanc sud, est et presque nord. Cette option est plus orientale que les deux autres, mais située sur la rive ouest du Mississippi. Il reste encore à planifier l'apparence des nouveaux bâtiments et à décider quoi faire de la Chambre des représentants."
 post_united_event.2003.o1: "Au moins, on ne manquera pas d'eau."
 post_united_event.2004.t: "La décision finale"
 post_united_event.2004.d: "Après des semaines de délibérations et de planification, et en tenant compte des sondages publics et de nombreux autres facteurs, il est temps de décider où sera la nouvelle capitale et quel sera son nom. Au Colorado, il y a la proposition du Mont Columbia. Au Missouri, la ville de Winfield sert de base, entourée des rivières Missouri et Mississippi comme frontières naturelles. Enfin, il y a la proposition de Nouvelle Arlington, dans le nord du Kansas, un espace vaste, ouvert et pratiquement vierge, une toile blanche idéale pour le développement."
 post_united_event.2004.o1: "L'ancienne capitale convient parfaitement."
 post_united_event.2004.o2: "Les Rocheuses défendront la liberté."
 post_united_event.2004.o3: "Évidemment, un placement central pour le gouvernement."
 post_united_event.2004.o4: "Le Mississippi défendra la liberté."
 post_united_event.2005.t: "La nouvelle Amérique"
 post_united_event.2005.d: "Avec la proclamation de la 2e République américaine, nous cherchons désormais à réformer et adapter notre administration à l'échelle à laquelle nous avons grandi. Il y aura inévitablement des inefficacités, car il y a tant à gérer et à contrôler, mais nous triompherons. L'aigle est tombé, mais il s'est relevé pour voler encore plus haut qu'auparavant."
 post_united_event.2005.o1: "Novus Americanus, l'ère nouvelle de l'Amérique"
 free_states_idea_naval_renovations_budget: "Budget de rénovation navale"
 free_states_idea_naval_renovations_budget_desc: "Compte tenu de notre situation et de l'immensité de notre littoral, qui peut être considérable voire démesuré, nous devons investir dans la modernisation et la rénovation complète de notre marine si nous voulons envisager de nous défendre contre les menaces venues des océans et ceux qui chercheraient à débarquer sur nos côtes."
 free_states_idea_military_high_command: "Haut commandement militaire unifié"
 free_states_idea_military_high_command_desc: "Avec ce « haut commandement » désormais centralisé, nous pouvons désormais envisager d'élargir, d'entraîner, de développer et d'améliorer les capacités de nos forces militaires."
 USB_decisions_war_time_mobilization_category: "Mobilisation en temps de guerre"
 USB_decisions_war_time_mobilization_category_desc: "Le moment viendra de défendre nos terres et de forger notre destin. Prenons les armes et protégeons nos terres ainsi que les monuments qui traverseront l'épreuve du temps."
 USB_war_time_mobilization: "Première vague de mobilisation"
 USB_war_time_mobilization_desc: "L'heure est venue, défendons Washington et les libertés fédérales auxquelles nous tenons. Nous défendrons !"
 USB_war_second_wave_defenders: "Deuxième vague de défenseurs"
 USB_war_second_wave_defenders_desc: "L'ennemi avance, nous devons donc enrôler une nouvelle vague de défenseurs. Le moral de la nation en souffrira, mais nous avons besoin de troupes."
 USB_war_desperate_defenders: "Défenseurs désespérés"
 USB_war_desperate_defenders_desc: "La situation devient critique, nous avons besoin de tous les bras disponibles, capables ou non, pour tenir la ligne. Peut-être, avec un peu de chance, pourrons-nous encore l'emporter."
 USB_america_economy_what_economy: "Économie... Quelle économie ?"
 USB_america_economy_what_economy_desc: "Avec l'état actuel de... eh bien, tout, nous devons établir une base de référence. Cette base consiste à instaurer des réformes législatives en matière de réglementations économiques, ainsi qu'à augmenter les budgets pour les programmes de soins, l'éducation, les programmes d'aide à la formation et les programmes administratifs en termes de subventions ciblées pour les investissements. En somme, nous établirons une norme administrative et budgétaire pour aborder notre développement économique de la meilleure manière possible."
 USB_america_department_of_labor_affairs: "Département des affaires du travail"
 USB_america_department_of_labor_affairs_desc: "Le DoLA est un département dédié à l'examen et à l'amélioration des lois et réglementations du travail pour obtenir plus d'efficacité avec moins de personnes. De plus, le DoLA contrôle les programmes d'aide au chômage et donc le financement est divisé en deux parties principales : les programmes d'aide au chômage et les programmes de réintégration, qui permettent aux chômeurs de participer à des salons de l'emploi organisés ou à des programmes offrant un revenu temporaire jusqu'à ce qu'ils trouvent un nouvel emploi stable."
 USB_america_ensuring_the_modern_four_day_week: "La semaine de quatre jours moderne"
 USB_america_ensuring_the_modern_four_day_week_desc: "À l'ère moderne, nous constatons que l'automatisation et la technologie permettent à notre main-d'œuvre d'être plus efficace qu'il y a dix ou vingt ans. Ainsi, la semaine de travail de quatre jours est la norme idéale pour garantir un véritable équilibre entre vie professionnelle, vie sociale, tout en comprenant que cette mesure permet d'obtenir encore plus de valeur en termes de production et d'emploi de la main-d'œuvre existante."
 USB_america_ensuring_enforced_job_fairs: "Garantir des salons de l'emploi obligatoires"
 USB_america_ensuring_enforced_job_fairs_desc: "Imposer la création et la continuité des salons de l'emploi est essentiel pour permettre aux employeurs de connaître la main-d'œuvre disponible dans leur région, tout en exposant cette main-d'œuvre à des emplois qu'ils ignoraient peut-être. Cela nous coûtera un peu, mais pour garantir la fluidité de la recherche d'emploi, cela en vaut largement la peine."
 USB_america_automation_and_advancements_act: "Loi sur l'automatisation et les avancées"
 USB_america_automation_and_advancements_act_desc: "Le triple A, ou plus précisément la Loi sur l'Automatisation et les Avancées, est un ensemble budgétaire pour l'éducation et la R&D afin de mettre les industries aux normes des pratiques courantes comme la robotique, l'automatisation et les programmes basés sur l'IA, qui augmentent la production et l'efficacité pour les industries à travers le monde. Bien que cela puisse inquiéter les superstitieux en termes de pertes d'emplois temporaires, nous pouvons atténuer l'ampleur en investissant dans la modernisation de notre système éducatif pour sensibiliser les gens à ces emplois dès un plus jeune âge."
 USB_america_national_labour_corps: "Corps national du travail"
 USB_america_national_labour_corps_desc: "Le NLC est le corps de travail civil sponsorisé par le gouvernement fédéral, où les individus sans emploi, et bien sûr dans un site séparé, le corps de travail pénal, travailleront sur des projets d'infrastructure et de développement. Cela nous donnera également de nombreuses opportunités pour maintenir l'entretien des infrastructures."
 USB_america_military_surplus_jobs: "Emplois excédentaires militaires"
 USB_america_military_surplus_jobs_desc: "Travailler ensemble avec les secteurs militaire et civil garantira que les problèmes d'emploi de notre nouvelle nation seront mieux résolus en temps opportun."
 USB_america_slashing_regulations_for_new_regulations: "Supprimer les réglementations pour de nouvelles réglementations"
 USB_america_slashing_regulations_for_new_regulations_desc: "Si nous voulons même envisager de développer notre économie, nous devons comprendre les réglementations dont nous avons besoin ou dont nous n'avons pas besoin. Être favorable aux entreprises est une chose, être passif face aux cupidités personnelles des opportunistes et des individualistes avides de pouvoir est un tout autre jeu. Par conséquent, nous devons supprimer les réglementations actuelles et les remplacer par des réglementations meilleures, plus claires et plus flexibles si nous voulons encourager la croissance sans compromettre ce que cette croissance pourrait signifier."
 USB_america_department_for_strategic_resource_collection: "Département de collecte des ressources stratégiques"
 USB_america_department_for_strategic_resource_collection_desc: "Le Département de Collecte des Ressources Stratégiques, ou simplement DoRC, est la branche administrative du DoRM dédiée à la collecte d'une réserve stratégique ou d'un approvisionnement en ressources cruciales pour la préservation de notre cohésion nationale, comme l'acier pour la construction, les combustibles fossiles pour l'énergie, etc. Avec ce département, nous assurerons l'avenir."
 USB_america_aggressive_extraction_methods: "Méthodes d'extraction agressives"
 USB_america_aggressive_extraction_methods_desc: "L'affaire AEM au sein du département a entraîné un important retour de bâton politique, mais le boom économique qui en résultera pourrait largement compenser si nous jouons bien nos cartes."
 USB_america_targeted_resource_extraction: "Extraction ciblée de ressources"
 USB_america_targeted_resource_extraction_desc: "Contrairement à la pensée AEM, le département ciblera les ressources stratégiques les plus importantes pour le fonctionnement de notre économie. Ce ciblage fonctionnera en tandem avec le Département de l'Énergie pour garantir la cohésion de notre approche des projets d'expansion économique et des ressources."
 USB_america_rusting_sheets_to_polished_metals: "Des tôles rouillées aux métaux polis"
 USB_america_rusting_sheets_to_polished_metals_desc: "Il est temps de transformer la partie 'ceinture de rouille' de notre pays en une nouvelle feuille brillante de fabrication métallurgique. Des usines d'aluminium des côtes du Jersey aux fonderies d'acier du complexe d'Érié en Pennsylvanie, nous ferons du neuf avec ce qui était autrefois abandonné."
 USB_america_strategic_metallurgic_expansions: "Expansions métallurgiques stratégiques"
 USB_america_strategic_metallurgic_expansions_desc: "Les programmes SME dans les anciens États de la 'ceinture de rouille' sont une bonne initiative de départ pour développer l'importance stratégique et les marchés de l'emploi dans ces bastions autrefois oubliés de la fabrication."
 USB_america_the_capital_gemstones: "Loi sur les gemmes de la capitale"
 USB_america_the_capital_gemstones_desc: "Les États du Maryland et du Delaware ne sont pas vraiment connus pour autre chose que l'argile, le sable et la pierre pour les matériaux de construction. Cependant, l'extraction de charbon dans le Maryland ainsi que les produits pétrochimiques dans le Delaware peuvent travailler en tandem, tout en faisant de notre mieux pour encourager une réelle croissance des opérations minières de gemmes limitées dans ces États. Qui aurait cru que le plus petit État ainsi que notre État de la capitale seraient... sous-évalués, pour manque de mots meilleurs, hehe."
 USB_america_from_coal_to_petrochemicals: "Du charbon aux produits pétrochimiques"
 USB_america_from_coal_to_petrochemicals_desc: "En termes de ressources, les États du Maryland et du Delaware sont quelque peu limités ou, au mieux, peu impressionnants. Pour capitaliser sur cette nature limitée, nous développerons l'industrie du charbon dans le Maryland pour renforcer la base pétrochimique scientifique et industrielle dans le Delaware. Cela profite aux deux États et nous donne plus de raisons d'investir dans la R&D."
 USB_america_the_dynamic_ming_duo: "Le duo minier dynamique"
 USB_america_the_dynamic_ming_duo_desc: "Les Virginies, autrefois un seul État, sont maintenant deux parties de notre nation désormais complète. Avec la diversité limitée des ressources de la Virginie, nous devons développer chaque ressource et mettre l'accent sur le principal acteur, l'acier, le cuivre et autres minéraux de base. En revanche, la Virginie-Occidentale est très différente, l'État n'a que du charbon. C'est pourquoi on l'appelle l'État de la Perle Noire, alors commençons à extraire quelques perles. En parlant de perles, saviez-vous qu'ils extraient aussi des gemmes ? Un petit commerce parallèle dans nos grands projets."
 USB_america_black_pearls_fuel_valley_industries: "Perles noires alimentant les industries de la vallée"
 USB_america_black_pearls_fuel_valley_industries_desc: "Grâce à la croissance directe des opérations d'extraction de charbon et de combustibles fossiles en Virginie-Occidentale, nous pouvons répondre aux besoins énergétiques des industries et des usines métallurgiques de Virginie, comme les aciéries et les usines de titane, d'autant plus que le gouvernement a désigné certains minéraux extraits en Virginie comme 'ressources essentielles'. Il faut donc maintenir l'approvisionnement des essentiels, n'est-ce pas ?"
 USB_america_the_trade_guru: "Le gourou du commerce"
 USB_america_the_trade_guru_desc: "Le summum de nos projets de développement et d'expansion des ressources a culminé non seulement dans notre skyline économique domestique, mais nous devons également regarder au-delà de nos frontières, car de nombreuses nations pourraient vouloir nos ressources, et nous devons rechercher ces partenaires potentiels pour garantir notre avenir lucratif."
 USB_america_strategic_autarky_program: "Programme d'autarcie stratégique"
 USB_america_strategic_autarky_program_desc: "Pour garantir la véritable forme de sécurité nationale, nous devons être proactifs dans la sécurité de nos ressources et le commerce que nous menons avec les nations du monde entier. Ainsi, nous mettrons en place le SAP ou Programme d'Autarcie Stratégique, qui orientera notre politique commerciale en fonction de la sécurité des ressources de notre nation. Beaucoup seront probablement indifférents ou déçus par nos actions, mais c'est un petit prix à payer pour assurer notre bien-être national."
 USB_america_industrial_development_planning_board: "Création de l'IDPB"
 USB_america_industrial_development_planning_board_desc: "Le Conseil de Planification du Développement Industriel est un organisme dédié au sein du Département des Affaires Industrielles qui gère la planification et le développement de l'économie en dehors de ce que fait le secteur privé. Sa fonction principale est de trouver un équilibre basé sur les besoins nationaux, comme réduire le chômage, tout en évitant de créer des entreprises zombies qui ne contribuent pas réellement aux besoins du peuple."
 USB_america_civilian_development_administration: "Administration du développement civil"
 USB_america_civilian_development_administration_desc: "La CDA de l'IDPB est chargée de développer les initiatives économiques civiles définies par l'IDPB pour soutenir la croissance stable de la nation en complément de la croissance du secteur privé."
 USB_america_erie_hudson_initiative: "L'initiative Erie-Hudson"
 USB_america_erie_hudson_initiative_desc: "L'IDPB a donné son feu vert à l'initiative Erie-Hudson, un plan de relance pour remettre sur la carte notre section de l'ancienne ceinture de rouille. Ce n'est pas grand-chose, mais c'est du travail honnête."
 USB_america_cumberland_wilmington_initiative: "L'initiative Cumberland et Wilmington"
 USB_america_cumberland_wilmington_initiative_desc: "Nous avons obtenu le feu vert pour développer les États du Maryland et du Delaware de la part du conseil. Ainsi, nous commencerons à poser les bases et à mettre les choses en place dès que possible, dans le respect des normes de sécurité."
 USB_america_the_sisters_initiative: "L'initiative des sœurs"
 USB_america_the_sisters_initiative_desc: "Le conseil a finalisé les plans pour développer les Virginies. Avec cela, nous apporterons l'industrialisation et des emplois à ceux de la région des Appalaches et d'ailleurs."
 USB_america_rustic_services_plan: "Le plan de services rustiques"
 USB_america_rustic_services_plan_desc: "Les plans de l'IDPB pour améliorer et élargir les services et le réseautage de bureaux dans les États de Pennsylvanie et du New Jersey ont été approuvés. Nous commencerons le travail immédiatement et entamerons la diversification des économies locales dans ces États."
 USB_america_mid_atlantic_tech_plan: "Plan technologique du Mid-Atlantique"
 USB_america_mid_atlantic_tech_plan_desc: "Grâce à des révisions et des projets, le conseil a approuvé le Plan MAT. Il s'agit d'un schéma de développement pour les États du Maryland et du Delaware afin d'apporter des emplois technologiques et de réseautage de bureaux dans la région. L'objectif est de renforcer nos capacités de R&D."
 USB_america_virginia_tech_expansions: "Extensions de Virginia Tech"
 USB_america_virginia_tech_expansions_desc: "En coopération avec Virginia Tech, le conseil souhaite mettre en place des plans de développement et d'expansion pour développer le secteur technologique et des services des États sœurs de Virginie. Nous espérons que cela apportera de nouvelles innovations ainsi que de nombreux emplois pour les locaux."
 USB_america_military_development_administration: "Administration du développement militaire"
 USB_america_military_development_administration_desc: "La MDA est l'équivalent militaire de la CDA. Ce département est responsable de la mise en œuvre des plans industriels militaires approuvés par l'IDPB pour développer et maintenir les capacités défensives de notre nation contre les incursions étrangères ou une invasion pure et simple."
 USB_america_altoona_tanks_and_jersey_jumpers: "Chars d'Altoona et uniformes de Jersey"
 USB_america_altoona_tanks_and_jersey_jumpers_desc: "La production d'armes locales et d'équipements de soutien comme les uniformes sera élargie. Les principales usines ont été désignées à Altoona, Pennsylvanie, et à Newark, New Jersey. Le conseil espère que ces usines apporteront des emplois, des salaires et une augmentation des capacités de sécurité locales en cas d'attaque d'une nation étrangère."
 USB_america_maryland_munitions: "Munitions du Maryland"
 USB_america_maryland_munitions_desc: "L'État du Maryland ainsi que le Delaware seront d'excellents endroits pour développer des équipements de soutien militaire, en particulier en raison de leur proximité avec la capitale. Ainsi, le conseil a approuvé le Plan de Munitions du Maryland pour développer les chaînes d'approvisionnement locales en matière militaire."
 USB_america_appalachian_arms: "Armes des Appalaches"
 USB_america_appalachian_arms_desc: "L'IDPB a approuvé des plans pour des installations d'armement dans la région des Appalaches en Virginie-Occidentale et en Virginie. L'objectif est que ces montagnes naturelles puissent également servir à stocker des réserves et potentiellement dissimuler ou protéger partiellement les usines de la région."
 USB_america_philly_shipyards: "Chantiers navals de Philly"
 USB_america_philly_shipyards_desc: "La zone de la baie au sud de Philadelphie est un excellent endroit pour construire un complexe de chantiers navals. Le conseil a approuvé la construction de ces 'Grands Chantiers de Philly', au sud de Philadelphie et le long de la côte ouest du New Jersey."
 USB_america_delaware_destroyers: "Destructeurs du Delaware"
 USB_america_delaware_destroyers_desc: "Malgré le nom, le prétendu plan de développement centré sur le Delaware est en réalité un programme naval plus large pour la péninsule. Des chantiers navals seront construits le long de la péninsule occupée par le Maryland et le Delaware pour mieux utiliser cette vaste côte et améliorer les défenses côtières."
 USB_america_norfolk_navies: "Marines de Norfolk"
 USB_america_norfolk_navies_desc: "Le port de Norfolk, en Virginie, a une longue histoire de production et de création de marines d'antan. C'est dans cet esprit que le conseil a décidé d'élargir et de construire des chantiers navals de soutien à proximité relative du complexe de Norfolk. Ils espèrent que l'ensemble du complexe naval pourra aider à défendre nos eaux côtières, comme il l'a fait pendant des siècles."
 USB_america_idpb_economic_direction_sub_committee: "Sous-comité de la direction économique"
 USB_america_idpb_economic_direction_sub_committee_desc: "La fonction principale de l'IDPB étant l'économie elle-même, un sous-comité a été créé pour débattre et informer des meilleures décisions possibles concernant la direction économique que nous devrions prendre pour notre nation. Certains plaident pour une base plus manufacturière, d'autres pour une économie plus orientée vers la technologie et les services de bureau. D'autres encore envisagent d'organiser l'économie sur des lignes plus militaires, utilisant les armes comme levier pour les investissements étrangers par leur vente. Quoi qu'il en soit, c'est à ce sous-comité de décider quelle est la meilleure option."
 USB_america_the_mom_and_pop_plan: "Le plan Mom & Pop"
 USB_america_the_mom_and_pop_plan_desc: "La colonne vertébrale de l'économie est évidemment les petites entreprises qui composent notre grande nation. Par conséquent, nous continuerons le développement économique selon des lignes qui garantissent leur primauté et pourraient construire une meilleure économie que la plupart."
 USB_america_pittswark_development_scheme: "Le schéma de développement Pittswark"
 USB_america_pittswark_development_scheme_desc: "Le PDS est une initiative de développement économique planifiée dans les États du New Jersey et de Pennsylvanie. L'objectif est d'établir plus de petites entreprises et de développer davantage d'industries orientées vers les consommateurs pour améliorer la qualité de vie des citoyens de ces États."
 USB_america_huntingmond_development_scheme: "Le schéma de développement Huntingmond"
 USB_america_huntingmond_development_scheme_desc: "Le HDS est une initiative de développement économique planifiée dans les États de Virginie-Occidentale et de Virginie. L'objectif est d'établir plus de petites entreprises et de créer davantage d'industries orientées vers les consommateurs pour améliorer le niveau de vie des citoyens de ces États."
 USB_america_wilmingland_development_scheme: "Le schéma de développement Wilmingland"
 USB_america_wilmingland_development_scheme_desc: "Le WDS est l'initiative de développement économique pour les États du Delaware et du Maryland. L'objectif est de créer plus de petites entreprises ainsi que d'établir davantage d'industries orientées vers les consommateurs pour améliorer le niveau de vie des citoyens de ces États."
 USB_america_norfolk_naval_contract: "Contrat naval de Norfolk"
 USB_america_norfolk_naval_contract_desc: "Malgré nos intentions purement domestiques, nous devons établir une industrie de défense si nous voulons préserver notre mode de vie et notre identité nationale. Par conséquent, le chantier naval de Norfolk sera agrandi et recevra un contrat limité pour les besoins de notre défense."
 USB_america_altoona_automatics_contract: "Contrat d'armement d'Altoona Automatics"
 USB_america_altoona_automatics_contract_desc: "Le contrat pour les armements militaires est uniquement destiné à renforcer nos capacités défensives. Ainsi, l'établissement d'une usine d'armement à Altoona, accompagné d'industries plus orientées vers les consommateurs, devrait apaiser les inquiétudes concernant une militarisation injustifiée."
 USB_america_the_consumer_complex_initiative: "Modèle du complexe des consommateurs"
 USB_america_the_consumer_complex_initiative_desc: "Avec la consolidation de notre planification économique, nous avons réalisé que la confiance des consommateurs et la préservation des besoins économiques de nos citoyens sont la véritable priorité. Ainsi, nous avons développé un nouveau modèle économique pour garantir la pleine cohérence de cette priorisation des besoins de notre nation et de son peuple."
 USB_america_mixed_measures_plan: "Plan de mesures mixtes"
 USB_america_mixed_measures_plan_desc: "La planification économique est un art à part entière, certains pourraient même dire une science. Peu importe ce qu'elle représente à vos yeux, pour nous, c'est une série d'actes d'équilibre. Une nation ou un corps social, quelle que soit sa taille, doit répondre aux besoins de nombreux acteurs et, bien que nous ne fassions pas toujours les choses correctement, nous pouvons certainement faire de notre mieux pour ne pas les faire aussi mal que par le passé. Par conséquent, nous mettrons en place le Plan de Mesures Mixtes ou MMP, un plan général de développement économique pour assurer l'équilibre et l'équité face aux besoins complexes de notre nation dans son ensemble."
 USB_america_rust_belt_renewal_initiative: "Initiative de renouveau de la ceinture de rouille"
 USB_america_rust_belt_renewal_initiative_desc: "Le RBRI est un projet de diversification pour revitaliser et bien sûr diversifier les économies des anciens États de la ceinture de rouille, le New Jersey et la Pennsylvanie. L'idée étant que la diversification donnera une nouvelle vie à ce qui était techniquement un poney économique à un seul tour."
 USB_america_twin_sisters_initiative: "L'initiative des sœurs jumelles"
 USB_america_twin_sisters_initiative_desc: "Les deux Virginies ont besoin de diversification économique, la Virginie-Occidentale encore plus, mais je digresse. Par conséquent, avec cette nouvelle initiative de développement économique, nous ferons exactement cela."
 USB_america_the_baltimore_blossom: "L'éclosion de Baltimore"
 USB_america_the_baltimore_blossom_desc: "En appliquant le même style de planification à nos derniers États non diversifiés du Maryland et du Delaware, nous pouvons ensuite nous tourner vers les besoins gouvernementaux de la défense nationale. Ce n'est pas le changement de priorité le plus important, mais quelque chose de nécessaire pour sécuriser notre bien-être."
 USB_america_the_office_initiative: "L'initiative des bureaux"
 USB_america_the_office_initiative_desc: "Les secteurs des services et des bureaux répondent aux besoins directs des consommateurs modernes. Des choses comme l'internet, la télévision par câble, etc., nous cherchons à développer notre secteur des bureaux et ses retombées qui bénéficieront de nos investissements dans la croissance."
 USB_america_defense_industry_needs: "Besoins de l'industrie de défense"
 USB_america_defense_industry_needs_desc: "Les besoins de notre défense nationale ne sont pas énormes, mais nous devons adopter une approche équilibrée. Nous ne savons jamais si nous serons attaqués par un ennemi étranger ou même un voisin. De plus, notre position nous permet de penser différemment et de solidifier une nouvelle identité. Pour l'instant, une militarisation limitée sous le prétexte de l'autodéfense est tout ce dont nous avons besoin."
 USB_america_a_true_balance: "Un véritable équilibre"
 USB_america_a_true_balance_desc: "Notre économie est en plein essor, elle est diversifiée et les besoins des citoyens et du gouvernement sont satisfaits. Maintenant, nous nous concentrons sur l'optimisation de ce modèle, en comprenant comment le développer et le rendre plus efficace dans l'utilisation des matériaux, des ressources humaines et naturelles. Par-dessus tout, nous mettrons en place notre nouveau plan EEM, un modèle économique appelé Modèle d'Efficacité Économique, pour orienter notre économie vers une planification de type 'construire en hauteur'."
 USB_america_militarized_economy_plan: "Plan d'économie militarisée"
 USB_america_militarized_economy_plan_desc: "Notre situation est au mieux précaire et au pire éphémère. Nous devons hybrider l'économie et garantir notre défense nationale tout en répondant aux besoins essentiels de notre population."
 USB_america_rustic_arms_act: "Loi sur les armes rustiques"
 USB_america_rustic_arms_act_desc: "La RAA est un ensemble de dépenses pour développer et sécuriser la base des industries de défense dans les États de la ceinture de rouille."
 USB_america_dover_dockyards: "Les chantiers navals de Dover"
 USB_america_dover_dockyards_desc: "Les industries navales, tant pour des besoins domestiques que militaires, sont essentielles si nous voulons sécuriser notre commerce sur la scène mondiale. Nous n'avons peut-être pas la gloire d'une flotte de 350 navires, mais assez pour protéger et défendre est tout ce qui compte pour le moment."
 USB_america_sister_armaments: "Armements des sœurs"
 USB_america_sister_armaments_desc: "Malgré le nom charmant, non, le couvent local ne lance pas une milice... bien que cela puisse être amusant. Au lieu de cela, il s'agit d'un investissement conjoint dans la société de fabrication d'armes connue sous le nom de Sister's Armaments Company. Fondée par deux sœurs et opérant principalement dans les deux Virginies, nous pouvons compter sur cette unité familiale pour produire une qualité qui défendra les familles de l'État et de la nation dans son ensemble."
 USB_america_federal_firearms: "Armes fédérales"
 USB_america_federal_firearms_desc: "Le 'District Fédéral', c'est-à-dire les États qui revendiquent la zone de la capitale, ont besoin d'armes et d'équipements sourcés localement et aussi près que possible pour garantir l'approvisionnement des forces de défense en cas de pire scénario. Ainsi, le développement des industries de défense de la Virginie et du Maryland est essentiel pour assurer la sécurité de la capitale de notre nation."
 USB_america_complacency_act: "Loi sur la complaisance"
 USB_america_complacency_act_desc: "Malgré son nom euphémistique, la Loi sur la Complaisance est en réalité un ensemble complet pour développer et répartir les industries civiles afin de garantir que les besoins essentiels de notre population soient satisfaits. Ainsi, en cas de guerre, ils auront la capacité de subvenir à leurs besoins dans une certaine mesure pour retarder l'instauration du rationnement."
 USB_america_military_ready_economy: "Économie prête pour le militaire"
 USB_america_military_ready_economy_desc: "Avec une série de projets de développement en cours et une situation plus stable en termes d'affaires civiles et militaires, nous pouvons maintenant nous concentrer sur notre adaptabilité. Ajuster notre développement économique actuel pour être prêt et opérationnel si un ennemi envisageait même de nous déclarer la guerre. Cela sera un peu impopulaire auprès de la population civile, mais c'est un sacrifice que nous sommes prêts à faire."
 USB_america_establishing_the_department_of_energy: "Création du Département de l'Énergie"
 USB_america_establishing_the_department_of_energy_desc: "Le DoE est une branche du DoIA qui se concentre sur les besoins énergétiques de la nation : comment produire, où construire de nouvelles installations, maintenir l'infrastructure, etc."
 USB_america_tried_and_tested_development: "Développement éprouvé et testé"
 USB_america_tried_and_tested_development_desc: "Les vieilles industries fiables des combustibles fossiles restent pertinentes. Malgré l'opposition des écologistes, nous pouvons encore satisfaire la majorité grâce à une énergie bon marché et efficace. Nous pourrions même ajouter quelques énergies renouvelables si l'agitation devient trop gênante."
 USB_america_innovation_station_plan: "Plan Station d'Innovation"
 USB_america_innovation_station_plan_desc: "La diversité de notre consommation énergétique ainsi que des méthodes de production est le meilleur moyen de nous protéger contre les ingérences étrangères. Par conséquent, des investissements importants en R&D ainsi qu'une plateforme diversifiée de moyens de production d'énergie seront mis en œuvre au fil du temps."
 USB_america_west_virginian_revival: "La renaissance de la Virginie-Occidentale"
 USB_america_west_virginian_revival_desc: "Avec notre plan de développement de la production d'énergie basée sur les combustibles fossiles, nous avons indirectement relancé certaines parties des industries minières de la Virginie-Occidentale et le cœur de l'économie de cet État. Un acte involontaire, c'est néanmoins un essor dont non seulement la Virginie-Occidentale bénéficiera, mais la nation dans son ensemble."
 USB_america_the_solar_harness: "L'exploitation solaire"
 USB_america_the_solar_harness_desc: "Utiliser le soleil pour générer de l'énergie peut être aussi variable que le vent. Cependant, si nous plaçons stratégiquement des panneaux solaires et des champs solaires dans des zones qui reçoivent en moyenne plus d'exposition au soleil, cela sera plus bénéfique à long terme. Par conséquent, nous pouvons instaurer des réductions fiscales et des programmes pour permettre aux gens de produire de l'énergie pour leurs propres maisons et probablement pour le réseau en général."
 USB_america_oil_and_gas_power: "Puissance du pétrole et du gaz"
 USB_america_oil_and_gas_power_desc: "Le charbon ne peut faire qu'une partie du travail, et pour compléter le trio, nous devons développer nos installations de pétrole et de gaz naturel pour garantir une méthodologie de production énergétique bien équilibrée."
 USB_america_the_winds_of_change: "Les vents du changement"
 USB_america_the_winds_of_change_desc: "Traiter l'énergie éolienne comme l'énergie solaire et comprendre ses inconvénients nous permettra de placer stratégiquement des éoliennes dans des zones où les vents sont aussi constants que possible. De plus, la création d'éoliennes marines qui utilisent non seulement les vents mais aussi les courants de marée comme source d'énergie est envisageable. Ce n'est pas la plus belle chose pour les amateurs de plage, mais ce sont des sacrifices que nous devons faire si nous voulons être autosuffisants en énergie."
 USB_america_power_hubs: "Centres énergétiques"
 USB_america_power_hubs_desc: "Des 'centres énergétiques' riches en ressources ou stratégiquement situés seront établis pour créer des complexes de production d'énergie plus centralisés et efficaces. La Virginie-Occidentale et le Maryland répondent à l'une ou l'autre de ces descriptions sans distraire le développement d'autres industries qui pourraient être nécessaires sur les mêmes terres."
 USB_america_green_coal_act: "Loi sur le charbon vert"
 USB_america_green_coal_act_desc: "Le nom de la GCA est un euphémisme pour définir ce que certains appellent le 'nouveau charbon'. Il s'agit bien sûr de l'uranium et de l'énergie nucléaire en général. Nous devons investir et développer correctement cette technologie, car elle représente plus ou moins l'avenir de la production d'énergie abondante. Après tout, pourquoi la plupart des médias de science-fiction utilisent-ils l'énergie nucléaire ou un matériau fictif comme source d'énergie universelle ? C'est parce que le potentiel est là, et nous n'avons pas encore trouvé mieux que le nucléaire."
 USB_america_department_for_synthetic_development: "Département pour le développement synthétique"
 USB_america_department_for_synthetic_development_desc: "Le DSD est un département de R&D du DoE chargé d'assurer l'innovation et le développement de produits synthétiques, comme le charbon, le pétrole, le gaz ou certains produits pétrochimiques tels que les plastiques ou le nylon, pour n'en citer que quelques-uns."
 USB_america_department_for_energy_innovations: "Département pour les innovations énergétiques"
 USB_america_department_for_energy_innovations_desc: "Le DEI est le département de R&D au sein du DoE chargé de gérer les innovations en matière de production et d'utilisation d'énergie. Nous devons envisager l'avenir si nous voulons exploiter ce que nous prétendons être cet avenir."
 USB_america_department_of_logistical_affairs: "Département des affaires logistiques"
 USB_america_department_of_logistical_affairs_desc: "Semblable à un Département des Transports, la principale fonction du DoLA est d'assurer l'entretien ainsi que la flexibilité et l'adaptabilité de notre infrastructure, et de déterminer où il est nécessaire d'étendre ou de développer selon les besoins de la nation."
 USB_america_northern_highways_act: "Loi sur les autoroutes du Nord"
 USB_america_northern_highways_act_desc: "La NHA est un ensemble de dépenses pour développer et soit étendre, soit maintenir les principales voies routières liées au système inter-États."
 USB_america_re_establishing_the_pennsy: "Rétablissement du Pennsylvania Railroad"
 USB_america_re_establishing_the_pennsy_desc: "Le PRR ou Pennsy, comme ceux qui se souviennent de l'ancienne voie ferrée disparue l'appelaient, était à son apogée une voie ferrée qui englobait un territoire jusqu'au Missouri. Malheureusement, avec la fusion forcée avec le New York Central et d'autres chemins de fer défaillants dans le désastre qu'était le Penn Central, la faillite qui suivit était inévitable. Maintenant, avec un nouveau départ et une nouvelle chance, nous rétablirons le Pennsylvania Railroad et encouragerons une réglementation adaptable pour empêcher les super-fusions ou les échecs forcés qui précèdent le tournant du siècle."
 USB_america_southern_highways_act: "Loi sur les autoroutes du Sud"
 USB_america_southern_highways_act_desc: "Comme avant, garçons et filles, sauf que cette fois, nous donnons de l'amour à la moitié inférieure de l'infrastructure de la nation."
 USB_america_re_establishing_the_norfolk_and_western: "Rétablissement du Norfolk & Western"
 USB_america_re_establishing_the_norfolk_and_western_desc: "Le N&W était une lucrative voie ferrée de charbon qui gérait les Virginies et un peu plus en termes de territoire contrôlé. Malgré les changements, le chemin de fer résistait à l'épreuve du temps. Cependant, en réponse aux super-fusions de la seconde moitié des années 1900 et à la concurrence croissante des routes, de l'air, etc., le N&W fut plus ou moins forcé de trouver un partenaire de fusion. Ils en trouvèrent un dans la Southern Railway, connue sous le nom de Old Reliable du Sud, mais bientôt les deux anciens drapeaux tombèrent pour adopter un nouveau drapeau commun sous le nom de Norfolk Southern. Maintenant que les grandes compagnies ferroviaires sont presque toutes détruites, il est temps de ramener une véritable histoire américaine et de relever certains drapeaux tombés."
 USB_america_the_infrastructure_readiness_act: "Loi sur la préparation des infrastructures"
 USB_america_the_infrastructure_readiness_act_desc: "L'IRA n'est pas un projet de loi sur l'immigration irlandaise, mais une réglementation et une obligation gouvernementale que l'entretien de l'infrastructure est en soi une question de sécurité nationale. Ainsi, l'une des principales priorités, à côté de la défense nationale, est de maintenir notre infrastructure dans un état optimal sans causer de difficultés constantes aux populations locales où ces travaux doivent être effectués."
 USB_america_military_debate: "Le grand débat militaire"
 USB_america_military_debate_desc: "Avoir une armée, c'est bien, mais savoir ce que l'on va faire avec cette armée, c'est mieux."
 USB_america_the_bulwark_doctrine: "La doctrine du rempart"
 USB_america_the_bulwark_doctrine_desc: "Nos ennemis s'attendent à ce que nous soyons agressifs, imprudents, eh bien, nous ne céderons pas à de telles tentations. Nous devons construire et utiliser notre armée de manière défensive, en comprenant qu'il n'y a pas de guerre véritablement rapide. Avec cette connaissance, nous pouvons créer un rempart militaire et laisser l'ennemi gaspiller ses ressources pendant que nous gagnons la guerre d'usure grâce à une intégration civile et militaire soigneusement planifiée pour la défense nationale."
 USB_america_infantry_supremacy_guide: "Guide de la suprématie de l'infanterie"
 USB_america_infantry_supremacy_guide_desc: "Chaque homme un fusil, chaque femme un fusil à pompe. C'est la déclaration de notre Guide de la Suprématie de l'Infanterie ou plan d'entraînement militaire ISG pour l'armée. Bien sûr, nous investirons dans des véhicules blindés, etc., cela ne fait aucun doute compte tenu des méthodes modernes de guerre. Mais si nous devons avoir un tel équipement, nous devons entraîner chaque soldat comme s'il était toujours attendu qu'il soit un fantassin."
 USB_america_refining_ocs_institutions: "Raffinement des institutions OCS"
 USB_america_refining_ocs_institutions_desc: "Le leadership est le cœur de ce qui fait fonctionner une armée. C'est un fait connu que nous réformerons nos études du corps des officiers dans nos académies militaires pour refléter et s'adapter à la nouvelle direction de notre armée : une doctrine défensive et une initiative concernant la préservation de la force sous leur commandement. Ensemble, nous tiendrons ; le leadership défendra, tout comme les troupes qu'ils commanderont."
 USB_america_streamlining_logistics: "Rationalisation de la logistique"
 USB_america_streamlining_logistics_desc: "Pour pouvoir tenir, nous devons pouvoir approvisionner nos soldats. Par conséquent, nous devons rationaliser la priorisation logistique pour garantir comment nos troupes sont approvisionnées tout en veillant à maintenir leur moral."
 USB_america_establishing_the_doctrine: "Établir la doctrine"
 USB_america_establishing_the_doctrine_desc: "Le sommet de notre plan de développement de l'armée est l'établissement de la doctrine officielle de notre militaire, à savoir la Doctrine du Rempart. Nous garantirons la défense de notre nation et de son peuple."
 USB_america_sky_defenders_program: "Programme des défenseurs du ciel"
 USB_america_sky_defenders_program_desc: "The modern queen of the battlefield is that of the air force. Be it fighters, bombers or multi-roled aircraft, the principle is, if you want to win the war then you must win it in the air. As ushc we will develop and orient ourselves in refining the ability to defend and hold our airspace from enemy bombers and the like from destroying our defensive capabilities."
 USB_america_fighter_defense_doctrine: "Doctrine de défense aérienne"
 USB_america_fighter_defense_doctrine_desc: "The FDD is the dedicated organization of our air force around the principle of localizaed security. We are defending our homeland, therefore our aircraft as well as our training must be geared around such distinctions."
 USB_america_agility_training_measures: "Mesures d'entraînement à l'agilité"
 USB_america_agility_training_measures_desc: "Nos entraînements établissent une norme qui incarne les attentes pour rejoindre notre force aérienne. Cela signifie que nous devons affiner nos méthodes d'entraînement pour garantir que nos pilotes développent une tolérance à des forces G supérieures à la normale, afin d'augmenter leurs capacités. De plus, l'agilité de nos appareils dépasse ce que nos pilotes peuvent gérer, donc notre principale limitation est le personnel lui-même. Nous travaillerons donc à améliorer cela, nous devons l'améliorer."
 USB_america_aircraft_refinement_programs: "Programmes de raffinement des aéronefs"
 USB_america_aircraft_refinement_programs_desc: "L'ARP est un programme d'utilisation de la production dédié à innover et développer nos aéronefs de manière efficace pour les rôles que nous visons à accomplir."
 USB_america_naval_repair_schools: "Écoles de réparation navale"
 USB_america_naval_repair_schools_desc: "L'instauration de l'emploi non seulement de personnel de réparation navale mais aussi de contracteurs civils en soudure permettra un processus de réparation et de réaménagement beaucoup plus fluide. Cela nous permettra, par procuration, de produire de meilleurs équipements, car l'intégration de ces nouvelles écoles de réparation navale rendra même les navires les plus complexes faciles à réparer."
 USB_america_naval_alloy_innovations: "Innovations en alliages navals"
 USB_america_naval_alloy_innovations_desc: "Le NAI est un département de R&D dédié aux avancées dans la création de navires navals, comme le déplacement et les raffinements d'alliages pour permettre la création de navires plus performants, plus fluides et plus durables, capables de naviguer dans des conditions variables en mer."
 USB_america_mining_warfare_refinements: "Raffinement de la guerre de mines"
 USB_america_mining_warfare_refinements_desc: "Le programme MWR spécialise notre puissance navale pour adapter et affiner les capacités de pose de mines en mer et d'opérations anti-mines."
 USB_america_navy_readiness_training: "Entraînement à la préparation navale"
 USB_america_navy_readiness_training_desc: "Améliorer les programmes et régiments d'entraînement de notre personnel naval pour fluidifier et augmenter la réactivité face aux menaces ainsi qu'aux éventuelles fausses alertes, car même une fausse alerte est une menace potentielle."
 USB_america_the_spearhead_doctrine: "La doctrine de la pointe"
 USB_america_the_spearhead_doctrine_desc: "Notre armée doit être comme la pointe d'une lance, capable de poignarder, trancher et abattre l'ennemi là où c'est possible avant qu'il ne puisse organiser une défense efficace."
 USB_america_perpetual_assault_training: "Entraînement à l'assaut perpétuel"
 USB_america_perpetual_assault_training_desc: "Le PAT est un programme d'entraînement dédié à comprendre et développer l'endurance des soldats pour ce que nous appelons l''Assaut Perpétuel'. Considérez-le comme un raffinement de la doctrine d'Assaut de Masse d'antan, mais affiné dans le principe d'attaques concentrées pour garantir des exploits rapides et des encerclements potentiels. Presque comme un hybride d'Assaut de Masse et de Défaite en Détail."
 USB_america_armored_assault_assist: "Groupe d'assistance à l'assaut blindé"
 USB_america_armored_assault_assist_desc: "Le triple A militaire, ce raffinement de notre branche blindée de l'armée nous permettra de neutraliser de petits groupes d'ennemis sans trop de risques d'encerclement en retour."
 USB_america_officer_corp_aggression_training: "Entraînement à l'agressivité du corps des officiers"
 USB_america_officer_corp_aggression_training_desc: "Notre capacité à avancer repose uniquement sur la responsabilité des officiers en charge. Inculquer vigueur et détermination aux troupes et comprendre la planification et les tactiques pour avancer et comprendre la doctrine que nous avons établie pour notre militaire et notre armée dans son ensemble."
 USB_america_material_not_human_loss: "Perte matérielle, pas humaine"
 USB_america_material_not_human_loss_desc: "Nous ne pouvons pas nous permettre de perdre notre population. Malgré la méthodologie de notre doctrine, nous croyons toujours que nos soldats sont nos meilleurs atouts. Par conséquent, nous devons réorganiser notre logistique pour compenser les pertes en équipement par rapport à ce que nous essayerons de préserver en termes de dépenses humaines."
 USB_america_proactive_air_assaults: "Assauts aériens proactifs"
 USB_america_proactive_air_assaults_desc: "L'agressivité dans notre force aérienne nous permettra d'abattre les aéronefs ennemis avant qu'ils ne s'en rendent compte. En ayant un entraînement proactif pour simuler la réactivité et l'adaptabilité de nos équipages et pilotes aériens, ils devraient être capables de gérer les situations et les fausses alertes avec la plus grande rapidité et flexibilité possibles en fonction de la situation et des informations disponibles."
 USB_america_modern_maneuverability_courses: "Cours modernes de maniabilité"
 USB_america_modern_maneuverability_courses_desc: "Avec l'essor de la technologie furtive et les exigences croissantes envers les pilotes, nous devons entraîner et adapter nos pilotes de manière préventive pour qu'ils puissent gérer des scénarios d'hyper-maniabilité qui exerceraient une quantité moyenne dangereuse de forces G sur eux. Cela nous coûtera cher, mais cela vaut la peine pour les possibilités à long terme que cela pourrait offrir."
 USB_america_redesigns_and_field_testing: "Redesign et tests sur le terrain"
 USB_america_redesigns_and_field_testing_desc: "Comprendre toutes les données que nous pouvons acquérir sur nos aéronefs existants nous permettra de concevoir de meilleurs modèles et d'affiner les programmes d'entraînement. Cela devrait à son tour améliorer les capacités de notre force aérienne, tant en défense qu'en opérations offensives."
 USB_america_air_corps_survivability_program: "Programme de survie du corps aérien"
 USB_america_air_corps_survivability_program_desc: "Le programme SP vise à innover pour assurer la survie des pilotes et de l'équipement lorsque possible. Bien sûr, la priorité reste toujours le pilote, car il faut sans doute plus de temps pour former un individu à supporter de telles conditions extrêmes que pour construire un assemblage de métal et de câbles."
 USB_america_rapid_response_protocols: "Protocoles de réponse rapide"
 USB_america_rapid_response_protocols_desc: "Le RRP est une révision des entraînements et des équipements standards pour mieux garantir la capacité à effectuer des 'réparations sur le terrain' en haute mer. Bien que le retour au port reste toujours nécessaire, une réparation reste une réparation tant qu'elle est bien faite."
 USB_america_streamlining_port_facilities: "Rationalisation des installations portuaires"
 USB_america_streamlining_port_facilities_desc: "Pour garantir la préparation de nos forces navales, nous devons rationaliser, mettre à jour et préparer les installations pour accueillir les navires et en construire de nouveaux."
 USB_america_the_new_admiralty: "La nouvelle amirauté"
 USB_america_the_new_admiralty_desc: "Nos navires ne valent rien si ceux qui les commandent ne savent rien. Ainsi, une refonte de la formation et du moulage des futurs commandants navals est notre plus haute priorité."
 USB_america_hit_and_hit_again: "Frapper et frapper encore"
 USB_america_hit_and_hit_again_desc: "Grâce à des manœuvres stratégiques, nous pouvons envoyer des salves massives sur l'ennemi pour tenter de le désorganiser. Si nous parvenons à épuiser mentalement nos adversaires, nous pourrons sécuriser la victoire de plus d'une manière."
 USB_america_foreign_policy_debate: "La grande direction nationale"
 USB_america_foreign_policy_debate_desc: "Avec notre nation stabilisée, nos esprits clairs et les besoins économiques et civils pris en charge, nous débattrons de la prochaine grande direction que nous souhaitons donner à notre nation."
 USB_america_reclaim_the_mantle_of_destiny: "Reprendre le manteau de la destinée"
 USB_america_reclaim_the_mantle_of_destiny_desc: "Le vide du pouvoir est vaste, et nous sommes les seuls à pouvoir le combler. Nous contrôlons l'ancienne capitale, et le cœur de notre territoire est constitué des éléments fédéralistes de l'ancienne république. Avec du courage, de la détermination et de l'habileté, nous veillerons à manifester notre véritable destinée et à reprendre les terres d'antan pour la gloire de proclamer la 2e République Américaine."
 USB_america_war_plan_arcadia: "Plan de guerre Arcadia"
 USB_america_war_plan_arcadia_desc: "Le front le plus court et, à notre avis, le plus faible est celui du Nord-Est. Dans cet esprit, nous devons nous préparer, planifier et nous tenir prêts pour l'incursion imminente vers le nord."
 USB_america_battle_plan_albany: "Plan de bataille Albany"
 USB_america_battle_plan_albany_desc: "New York, terre de liberté pour ceux qui ont immigré depuis l'Ancien Monde. Maintenant qu'elle est l'adversaire que nous devons conquérir pour sécuriser notre manteau, de la baie d'Hudson à la frontière canadienne, nous sécuriserons le symbole de la liberté, en avant vers la victoire !"
 USB_america_battle_plan_providence: "Plan de bataille Providence"
 USB_america_battle_plan_providence_desc: "Le grand nord, la Nouvelle-Angleterre, où les forêts du nord représentent notre plus grand défi pour tout plan. Néanmoins, nous saisirons la région plus développée de la Nouvelle-Angleterre, et leur moral s'effondrera sûrement, sécurisant une autre victoire pour nous."
 USB_america_war_plan_mississippi: "Plan de guerre Mississippi"
 USB_america_war_plan_mississippi_desc: "Nous ne naviguons même pas à moitié d'un navire, ainsi notre objectif principal est de sécuriser tout ce qui se trouve à l'est du Mississippi. La meilleure frontière naturelle, cela sécurisera également notre statut émergent sur le continent."
 USB_america_battle_plan_gary: "Plan de bataille Gary"
 USB_america_battle_plan_gary_desc: "Les Grands Lacs deviendront encore plus grands lorsque nous réintégrerons ces anciens territoires. De plus, nous pouvons semer la confusion chez l'ennemi en leur faisant croire que notre objectif principal est de capturer Gary, Indiana, ou si Gary a conçu le plan."
 USB_america_battle_plan_dixie: "Plan de bataille Dixie"
 USB_america_battle_plan_dixie_desc: "Vers Dixieland nous voyageons, garçons et filles. Nous veillerons à ce que chaque garçon du Dixie comprenne qu'il vivra toujours avec l'Oncle Sam."
 USB_america_securing_the_new_frontiers: "Sécuriser les nouvelles frontières"
 USB_america_securing_the_new_frontiers_desc: "Avant de poursuivre notre avancée vers le Pacifique, nous devons sécuriser et contrôler les domaines que nous avons acquis. L'unité avant l'expansion est ce qui a causé le passé, maintenant nous construirons un avenir meilleur."
 USB_america_the_borderlands: "Les terres frontalières"
 USB_america_the_borderlands_desc: "Le progrès de notre assimilation doit être coordonné, et les terres frontalières initiales devraient être notre principale préoccupation en premier."
 USB_america_uniting_the_arcadians: "Unir les Arcadiens"
 USB_america_uniting_the_arcadians_desc: "Le Nord-Est, ou à une époque il y a des siècles, était connu comme faisant partie de la région coloniale française d'Arcadie. Ces gens ont une culture très distinctive autour d'influences britanniques marquées et d'influences françaises subtiles. Ainsi, nous travaillerons à éliminer cela et à apporter l'unité à ces terres."
 USB_america_southern_culture_is_american: "La culture du Sud est américaine"
 USB_america_southern_culture_is_american_desc: "Bien que ce ne soit pas par une rébellion sanglante, nous cherchons à ramener le Sud sous notre giron. Plutôt que les politiques de va-et-vient échouées de deux administrations différentes, nous instaurerons une politique uniforme et légale d'intégration. Le Sud et la culture sudiste, c'est la culture américaine et seront traités comme tels. Car le Sud nous apporte des choses comme la comfort food et le fanatisme sportif. Ces choses sont américaines et seront vues et respectées comme telles."
 USB_america_midwestern_unity: "Unité du Midwest"
 USB_america_midwestern_unity_desc: "Tout comme le Sud, le Midwest est connu pour ses saisons de chasse, mais il apporte aussi une touche unique à la comfort food et qui pourrait oublier les rivalités sportives. Ainsi, le Midwest n'est qu'une pièce du puzzle américain et il faut clarifier que, bien qu'il s'agisse d'un sous-type culturel, ils sont en fin de compte de bons vieux Américains aux couleurs rouge, blanc et bleu."
 USB_america_cajun_dixie_and_us: "Cajun, Dixie et nous"
 USB_america_cajun_dixie_and_us_desc: "La moitié ouest de l'ancienne République du Sud, ainsi que leurs ancêtres confédérés, ont une forte volonté d'indépendance. Les différences culturelles dans leurs influences et les parties plus isolées à l'est ou sur le Mississippi leur donnent plus de liberté pour faire ce qu'ils veulent. Néanmoins, nous devons travailler à assimiler ces cultures, leur rappeler les similitudes et les valeurs partagées avec leurs frères et sœurs du Sud et du Midwest."
 USB_america_war_plan_pacific: "Plan de guerre Pacifique"
 USB_america_war_plan_pacific_desc: "This is the beginning and preparation for the end as well. The second Manifest Destiny or as some have begun to call it, \"The American Crusade\". In the end the only thing that matters is Unity, Duty and the American Identity is solidified once more."
 USB_america_battle_plan_alamo: "Plan de bataille Alamo"
 USB_america_battle_plan_alamo_desc: "Sam Houston, en son temps, voulait fonder une nation où les colons de la région pourraient se sentir chez eux. Ils se sont battus bec et ongles contre le 'Napoléon de l'Ouest', Santa Anna. Puis, avec leur victoire, ils ont revendiqué leur nouvelle maison, l'Amérique. Ramenons dans le giron les Américains que le monde entier croyait que nous étions."
 USB_america_battle_plan_woundedknee: "Plan de bataille Wounded Knee"
 USB_america_battle_plan_woundedknee_desc: "Custer a eu son dernier combat infâme lors du massacre de Wounded Knee. Nous ne serons pas aussi imprudents que Custer, mais nous sécuriserons le grenier de la république et rappellerons aux gens, qu'ils soient anciens ou nouveaux, que tout le monde est Américain."
 USB_america_the_second_utah_war: "La 2e guerre de l'Utah"
 USB_america_the_second_utah_war_desc: "Nous avons presque atteint l'océan Pacifique, maintenant les Rocheuses ainsi que les 'Mormons' se dressent sur notre chemin. Nous les battrons comme nous l'avons fait dans les années 1850, car nous serons unis d'une mer à l'autre."
 USB_america_battle_plan_cascadia: "Plan de bataille Cascadia"
 USB_america_battle_plan_cascadia_desc: "Le mouvement cascadien est très récent. Si nous agissons rapidement et travaillons de manière préventive pour ne pas nous enliser dans les montagnes, il est certain que nous rappellerons à ces 'étoiles montantes' la réalité qu'ils ne sont que des Américains de la côte Pacifique."
 USB_america_battle_plan_angels: "Plan de bataille Angels"
 USB_america_battle_plan_angels_desc: "La Californie, berceau du rêve américain et de jalons historiques comme l'ère de la ruée vers l'or. La ville des anges et les côtes sud plus peuplées seront notre objectif principal et probablement l'approche la plus facile. Avançons et reprenons les confins les plus éloignés du rêve américain."
 USB_america_west_of_the_mississippi: "À l'ouest du Mississippi"
 USB_america_west_of_the_mississippi_desc: "La grande croisade, les mois et les années de planification, de combats, etc., sont enfin terminés. Maintenant, nous cherchons à installer, éduquer et rappeler aux peuples de ces terres à l'ouest du Mississippi qu'ils sont et ont toujours été des Américains."
 USB_america_from_plains_to_rockies: "Des plaines aux Rocheuses"
 USB_america_from_plains_to_rockies_desc: "Plus nous allons vers l'ouest, plus les gens se sentent éloignés du gouvernement. Rappelons-leur leurs origines, leur histoire et les similitudes pour permettre une réintégration pacifique de ces terres pionnières. Considérons également l'idée de déplacer la capitale, car cette même question fut autrefois le cri de ralliement de nombreux mouvements sécessionnistes."
 USB_america_from_sea_to_shining_sea: "D'une mer à l'autre"
 USB_america_from_sea_to_shining_sea_desc: "La grande seconde Destinée Manifeste est accomplie et, avec de grandes épreuves, tribulations et efforts, nous avons atteint les côtes du Pacifique. Maintenant, le rêve américain peut être réactualisé et briller dans les yeux de ceux qui composent notre avenir."
 USB_america_the_great_administration: "La grande administration"
 USB_america_the_great_administration_desc: "Avec l'unité à travers le pays, nous pouvons maintenant commencer la réforme du service civil et de l'administration, désespérément nécessaire pour un territoire aussi vaste et géographiquement diversifié."
 USB_america_capital_crisis: "La crise de la capitale"
 USB_america_capital_crisis_desc: "Avec l'unité de la nation consolidée, nous devons nous pencher sur le plus gros problème : la position ou l'emplacement de la capitale fédérale et le gouvernement fédéral qui en découle. Nous devons examiner nos options et comprendre si et où nous pourrions installer notre nouvelle capitale pour avancer correctement."
 USB_america_the_proclamation: "La grande proclamation"
 USB_america_the_proclamation_desc: "Le jour est venu de clore ce chapitre de l'histoire américaine. La première république a duré près de 300 ans, surpassant pratiquement toutes les républiques précédentes, car le trait principal d'une nouvelle république est la réécriture de son document fondateur. C'est pourquoi la France en est à sa 7e et les Grecs à on ne sait quelle république. Néanmoins, avec cette nouvelle république, nous inaugurerons une nouvelle ère et chercherons l'avenir que nous voulons."
 USB_america_the_great_shutdown: "La grande fermeture"
 USB_america_the_great_shutdown_desc: "Les perspectives et les rêves d'antan sont terminés, le monde nous a déçus et nous l'avons déçu. Concentrons-nous sur l'intérieur et devenons le casse-tête le plus difficile à résoudre. Car si nous n'avons rien pour nous distraire, devons-nous vraiment nous étendre vers l'extérieur ?"
 USB_america_self_embargo: "L'embargo ultime"
 USB_america_self_embargo_desc: "Le EP, ou comme certains l'appellent en plaisantant le Plan d'Embargo Ultime, est l'arrêt du commerce avec le monde extérieur. Nous établissons un précédent jamais vu depuis des siècles et nous prévoyons de tenir bon et d'améliorer la vie de nos citoyens de la manière la plus indépendante possible. Cela nuira grandement à nos capacités économiques, mais avec une grande concentration et détermination, nous pouvons sécuriser une nouvelle voie. Notre voie."
 USB_america_every_citizen_a_job: "Un emploi pour chaque citoyen"
 USB_america_every_citizen_a_job_desc: "Avec notre auto-embargo, nous devrons garantir la stabilité économique. Dans cet esprit, notre éducation et nos services civils doivent s'adapter à ces nouveaux défis, et le fait que chaque citoyen apte à travailler devrait et aura un emploi. Ce changement fondamental en économie est révolutionnaire et probablement instable au mieux. Mais si nous nous préparons, nous concentrons et coordonnons correctement, nous pouvons garantir que les besoins de base pour la survie sont satisfaits et que les luxes des autres nations pourraient être accessibles si recherchés."
 USB_america_mandatory_service_period: "Période de service obligatoire"
 USB_america_mandatory_service_period_desc: "Pour garantir la préparation maximale de notre nation, nous devons instaurer une période de service obligatoire pour nos citoyens. De plus, nous devrions encourager des programmes comme le JROTC dans les écoles et mieux adapter notre société à une orientation plus militaire."
 USB_america_ground_defense_is_air_defense: "La défense terrestre, c'est la défense aérienne"
 USB_america_ground_defense_is_air_defense_desc: "The GDAD program is a slew of investments in research and military training to equip as well as prepare our ground forces with the ability to properly defend and withstand prolonged enemy air based combat units. The modern war is defined by the queen of the battlefield, that queen is the air force and with our nation not being so chatty with the outside world, we must seek out the ability to remedy this queen with an appropriate King maker."
 USB_america_warfare_beyond_the_grave: "Guerre au-delà de la tombe"
 USB_america_warfare_beyond_the_grave_desc: "La guerre de cimetière, cette nouvelle doctrine basée sur la 4e génération rendra des films comme Red Dawn semblables à des jeux d'enfants. Votre résistance est éternelle, car notre nation est éternelle."
 USB_america_the_new_identity_plan: "La nouvelle voie à suivre"
 USB_america_the_new_identity_plan_desc: "Nous ne pouvons pas prétendre que si nous reprenons les anciennes terres, tout ira bien. Mais nous ne pouvons pas non plus nous fermer comme le shogunat japonais, donc nous devons forger une nouvelle voie. Notre objectif sera une nouvelle voie à suivre, une nouvelle identité dont notre peuple pourra être fier."
 USB_america_war_plan_gray_coat: "Plan de guerre Manteau Gris"
 USB_america_war_plan_gray_coat_desc: "De l'Atlantique au Mississippi, notre destinée est fixée. Notre premier plan direct pour atteindre nos objectifs est celui de l'ancienne Confédération. Car cela a la connexion la plus continue et nous assurera notre grande consolidation."
 USB_america_the_southeast: "Le Sud-Est"
 USB_america_the_southeast_desc: "La proximité et les développements constants le long de la côte permettront des investissements ciblés et des efforts d'intégration plus fluides que dans les États moins développés. Un tremplin vers l'avenir, tout simplement."
 USB_america_the_gulf_states: "Les États du Golfe"
 USB_america_the_gulf_states_desc: "La côte du Golfe et les États directement à l'intérieur de cette côte sont un mélange de développement et d'abandon. Nous veillerons à ce que ces États ne se sentent pas laissés pour compte, tout en cherchant à investir dans l'infrastructure et des moyens de mieux intégrer et inclure ces États dans notre nouvelle voie à suivre."
 USB_america_war_plan_superior: "Plan de guerre Supérieur"
 USB_america_war_plan_superior_desc: "Les Grands Lacs et les anciens États de la ceinture de rouille sont le cœur industriel de l'ancienne nation ainsi que de notre nouvelle voie à suivre. Nous veillerons à ce que la puissance industrielle fasse partie de notre identité, tout comme nous avons sécurisé la puissance agricole du Sud comme notre identité."
 USB_america_the_automotive_states_and_some: "Les États automobiles et quelques autres"
 USB_america_the_automotive_states_and_some_desc: "Le cœur de ce qui était autrefois la fabrication automobile américaine se trouve dans le Michigan, l'Ohio et l'Indiana, avec l'Illinois ayant également sa part. Mais comme nous voulons rester méthodiques dans notre approche de l'intégration, nous nous en tenons à ces trois États et à l'État frontalier du Kentucky. Ces États ont divers problèmes, et nous utiliserons ce que nous pouvons pour augmenter l'emploi et remédier aux problèmes actuels pour mieux les ajuster à leur nouvelle maison dans notre grande nation."
 USB_america_the_northwest_region: "La région du Nord-Ouest"
 USB_america_the_northwest_region_desc: "Le groupe d'États qui forment maintenant notre frontière directe avec le Canada et ce qui se développe au-delà du Mississippi est un excellent moyen de montrer l'esprit sportif et l'unité à travers des activités comme la chasse et les sports. Nous utiliserons ces traditions séculaires pour rallier les peuples de ces États à accepter la nouvelle réalité des choses et comprendre que tout n'est pas toujours mauvais."
 USB_america_war_plan_north_atlantic: "Plan de guerre Atlantique Nord"
 USB_america_war_plan_north_atlantic_desc: "La dernière frontière pour notre nouvelle identité, la région de la Grande Nouvelle-Angleterre. Nous devrons nous préparer à des combats urbains, montagneux et de type jungle si nous voulons combattre efficacement et ramener ces États."
 USB_america_liberty_prime: "Liberté suprême"
 USB_america_liberty_prime_desc: "Le bastion de la liberté et le symbole de la liberté qu'est la Statue de la Liberté, l'État de New York est un défi unique et difficile à surmonter. Étant l'État des ghettos et du multiculturalisme, nous devons apprendre, étudier et comprendre non seulement ce qu'est un New-Yorkais sur le plan culturel, mais aussi comment leur faire voir qu'il n'y a pas de différence honnête entre eux et nous en termes d'objectif commun et d'avenir. Nous devons faire appel à leur unicité et probablement leur accorder des concessions d'autonomie pour assurer la cohésion et la coopération."
 USB_america_new_england_old_habits: "Nouvelle-Angleterre, vieilles habitudes"
 USB_america_new_england_old_habits_desc: "Malgré l'importance culturelle des États de la Nouvelle-Angleterre, ces gens ne sont honnêtement pas différents du reste de la nation. Certaines habitudes et points communs dans les passe-temps nationaux montrent clairement que, même lorsque nous sommes différents, nous partageons beaucoup de choses. Il est temps de rappeler à ces gens que nous sommes tous camarades, famille, et que nous pouvons comprendre les erreurs du passé pour construire un avenir meilleur."
 USB_america_the_arcadian_identity: "La destinée arcadienne"
 USB_america_the_arcadian_identity_desc: "Le moment est enfin venu, nous allons clore ce chapitre ainsi que cette grande page de l'histoire. Prenant les idées et idéaux d'antan, les leçons du passé, même de la semaine dernière, et avançons vers un nouveau commencement. Nous sommes un papillon brillant prêt à déployer ses ailes et à voler vers le grand au-delà de nos rêves. Nous sommes Arcadia."
 USB_arcadia_path_desc: "[USB.GetFlag]§YÉtats Libres d'Amérique§! Change de nom pour §YArcadia§!"
 USB_formalizing_the_fighting_brigades: "Formalisation des brigades de combat"
 USB_formalizing_the_fighting_brigades_desc: "Alors que nous continuons à nous rassembler, nous ne savons jamais ce que l'ennemi pourrait faire. Ainsi, nous créerons les Combattants Fédéraux comme une sorte d'unité de type Garde Nationale à action rapide. Après tout, quelque chose vaut mieux que rien."
 USB_creating_infantry_reserves: "Création des réserves d'infanterie"
 USB_creating_infantry_reserves_desc: "Notre nation est encore en reconstruction et, bien que nous ayons un pied dehors, il est tout aussi probable que nous trébuchions en avançant l'autre pied. Ainsi, nous devons créer une force de réserve prête pour nous préparer à l'avenir, quoi qu'il apporte."
 USB_mobilizing_the_reserves: "Mobilisation des réserves"
 USB_mobilizing_the_reserves_desc: "Le moment est venu de commencer la défense active de notre nation. Commençons la mobilisation pour être préparés aux batailles à venir."
 USB_coal_wars_two_event.1.t: "Les mineurs unis migrent"
 USB_coal_wars_two_event.1.d: "Alors que nous luttons pour remettre la nation en ligne, de nombreux mineurs, actuels et anciens, migrent pour une raison quelconque vers l'État de la Virginie-Occidentale. L'Association des Travailleurs des Mines Unies, une refonte de l'ancienne UMWA, a commencé à s'organiser et à se rassembler lors de rassemblements syndicaux politiques. Nous n'avons pas encore été contactés par le président actuel, Cecil Roberts, mais avec la tournure des événements, nous devrions avoir des nouvelles bientôt."
 USB_coal_wars_two_event.1.o1: "Quoi, ce sont des oiseaux migrateurs ?"
 USB_coal_wars_two_event.2.t: "La proposition de la perle noire"
 USB_coal_wars_two_event.2.d: "Plus tôt aujourd'hui, nous avons enfin reçu des nouvelles de la nouvelle UMWA. Le président a demandé et obtenu une pétition importante pour permettre la réouverture de plusieurs mines en Virginie-Occidentale. L'État est estimé posséder plus de 20 milliards de tonnes de réserves de charbon, ce qui serait certainement un avantage utile pour apporter une énergie bon marché et facile aux foyers et aux entreprises qui tentent simplement de survivre. Cependant, les mines ont été fermées en raison de préoccupations environnementales, car beaucoup de gisements de la côte est que nous occupons ont une teneur en soufre plus élevée. La question est donc de savoir si nous voulons maintenir une norme moderne ou abaisser ces normes pour une récupération accélérée."
 USB_coal_wars_two_event.2.o1: "La perle noire brille à nouveau"
 USB_coal_wars_two_event.2.o2: "Nous avons des normes pour une raison"
 USB_coal_wars_two_event.3.t: "Le financement afflue"
 USB_coal_wars_two_event.3.d: "Avec les négociations qui avancent bien et le financement enfin en route pour la Virginie-Occidentale, les mineurs qui ont migré ont déjà commencé à travailler à la réouverture des anciennes mines. C'est une nouvelle ère pour l'État et un atout précieux pour aller de l'avant alors que nous essayons de stabiliser économiquement la nation."
 USB_coal_wars_two_event.3.o1: "Ce n'est pas grand-chose, mais c'est du travail honnête"
 USB_coal_wars_two_event.300.t: "Les mineurs protestent contre la décision"
 USB_coal_wars_two_event.300.d: "Avec le récent verdict de rejeter la Proposition de la Perle Noire, de nombreux mineurs qui ont quitté leurs foyers et migré vers ce qu'ils croyaient être une forme de travail stable et une stabilité future ont commencé à organiser des manifestations. Les forces de l'ordre locales ont également noté une augmentation des vols liés aux armes à feu ainsi que des émeutes à petite échelle. Nous devons nous préparer à gérer cette urgence, car avec la déstabilisation croissante de l'État, nous ne sommes pas vraiment en position d'intervenir directement."
 USB_coal_wars_two_event.300.o1: "À quoi s'attendaient-ils ?"
 USB_coal_wars_two_event.301.t: "Un État libre ?"
 USB_coal_wars_two_event.301.d: "Sans réfléchir aux conséquences, ils l'ont fait. Des émeutes locales ont ciblé le peu d'armes et de munitions présentes dans l'État de la Virginie-Occidentale et, dans un acte rapide de ce que certains appellent la 'règle de la foule', l'UMWA a pris le contrôle et déclaré l'indépendance de la Virginie-Occidentale. Nous devons rassembler les quelques forces que nous avons et commencer à reprendre ce qui nous appartient de droit. La dernière chose dont nous avons besoin est que quelqu'un d'autre sur le continent grignote notre indépendance."
 USB_coal_wars_two_event.301.o1: "Où ai-je déjà vu ça ?"
 USB_coal_wars_two_event.302.t: "La seconde guerre du charbon"
 USB_coal_wars_two_event.302.d: "Aux armes, frères et sœurs de la terre, aux armes, dis-je ! Car c'est en ce jour que les bandits aveugles de Washington ne détermineront plus notre destin. Nous nous tiendrons debout et combattrons pour défendre notre droit d'extraire et d'utiliser les ressources que notre chère mère Terre nous offre. Rassemblons-nous et défendons ces terres pour que nous puissions faire briller à nouveau cette perle noire."
 USB_coal_wars_two_event.302.o1: "Aux armes !!!"
 USB_coal_wars_two_event.303.t: "Nous marchons !"
 USB_coal_wars_two_event.303.d: "Le moment est venu et nous sommes plus prêts que jamais. Nous marcherons sur Parkersburg et sécuriserons à nouveau l'État de la Virginie-Occidentale."
 USB_coal_wars_two_event.303.o1: "En avant, soldats !"
 USB_coal_wars_raise_mining_regiments_tt: "West Virginia will raise §Y15§! Mining Regiment divisions."
 USB_america_focus_establishing_a_govt: "Establishing A Government"
 USB_america_focus_establishing_a_govt_desc: "Chaos consumes the streets, we must secure a central command of civil government if we are to even think of doing anything."
 USB_america_focus_creating_a_police_force: "Creating A Police Force"
 USB_america_focus_creating_a_police_force_desc: "With a civil government in place we've got to re-establish a civil order department. The department of Civil Affairs will be establish and plan out as well as establish strategic police stations to help quickly set up a rump police force to quell general disorder."
 USB_america_focus_organizing_the_militias: "Organizing The Militias"
 USB_america_focus_organizing_the_militias_desc: "Roving gangs still cause massive amounts of continual damage. How are we to create any sense of a new society if we can't even cease the destructive nature of these anarchists. We've got state guards, national guards and some remnants of the army, so lets try and piece this puzzle together and see what, if any kind of picture we'll make with it."
 USB_america_focus_rebuilding_the_economy: "Rebuilding The Economy"
 USB_america_focus_rebuilding_the_economy_desc: "It ain't much, but its honest work...and frankly any work in better than no work."
 USB_america_focus_backyard_battleground: "Backyard Battleground"
 USB_america_focus_backyard_battleground_desc: "With the chaos mostly over and the direct capital region being as stable as possible, we must seek to control the state of Maryland if we are to get anywhere any time soon. Investments in manpower, security and economy will be made wholesale to ensure the control and stability of the state."
 USB_america_focus_from_backyard_to_frontyard: "From Backyard To Frontyard"
 USB_america_focus_from_backyard_to_frontyard_desc: "With the economic and civil investments comes now the naturalization of law and order. Establishing civil services and law will be able to solidify our control of our backyard that is the state of Maryland. Thus we will turn it around into the frontyard example for which to unite our nation under the new banner of the Free States of America."
 USB_america_focus_the_old_dominion_state: "The Old Dominion State"
 USB_america_focus_the_old_dominion_state_desc: "Somehow we've been able to keep in our grasps the old Dominion state that is Virginia. Though many thought they would've left for the southerners, we must've done something good enough if they consider themselves apart of us. Nevertheless their state is archaic and disorderly like the rest of our \"nation\" is. So we must invest and rebuild it if we plan on bringing back into the fold some sense of a nation."
 USB_america_focus_norfolk_novelty: "Norfolk Novelty"
 USB_america_focus_norfolk_novelty_desc: "With civil order and economic stability assured we can bring the old dominion into a new light. For the future we unite, for the future we will and must defend our rights. For the Free States."
 USB_america_focus_black_pearl_state: "The Black Pearl State"
 USB_america_focus_black_pearl_state_desc: "From the ashes of coal country comes West Virginia. Known for being almost a statewide ghost town since its failure to fully diversify and modernize. Its fall from grace due to the state's more sulpheric coal becoming unusable in the modern age. We need to show more love to the state, give it life so it may live on within our union. Who knows, maybe one day people will call West Virginia a new Mountain Momma."
 USB_america_focus_parkersburg_perfection: "Parkersburg Perfection"
 USB_america_focus_parkersburg_perfection_desc: "The coal is mined once more, the economy is stable once more. The state of West Virginia is looking up to the sky for new aspirations and now we must guide them and help them by cleaning up the streets and restoring civil services. The Blue Ridges shall shine once more."
 USB_america_focus_the_commonwealth_state: "The Commonwealth State"
 USB_america_focus_the_commonwealth_state_desc: "Pennsylvania, a state of diversity in land and peoples. With a rich history in industry, railroading and American history itself, we must seek to ensure the stability and economic future of the Commonwealth if we are to make sure our union is whole."
 USB_america_focus_from_rust_to_shine: "From Rust To Shine"
 USB_america_focus_from_rust_to_shine_desc: "From the rusting decay of a post industrial society, to the shining beacon of a diversified digital dynamic, the Commonwealth state shall be a piece within the puzzle of our new great nation."
 USB_america_focus_delaware_dilemma: "Delaware Dilemma"
 USB_america_focus_delaware_dilemma_desc: "Just like in the revolutionary war, we must cross the Delaware river, only not to destroy an enemy, but to rebuild and bring in a friend."
 USB_america_focus_delaware_delight: "Delaware Delight"
 USB_america_focus_delaware_delight_desc: "From the economic ruins to the proud forefront of revival, we embrace another dear state back into our loving arms. Forward we move to a brighter future, to delight in the company we now share."
 USB_america_focus_the_jersey_jumpstart: "The Jersey Jumpstart"
 USB_america_focus_the_jersey_jumpstart_desc: "One of the farthest states within our realm, yet also the other half of our portion of the rust belt. We must revive the state and give her a jump if we are to properly set the course and have a complete nation once more."
 USB_america_focus_the_trenton_turnaround: "The Trenton Turnaround"
 USB_america_focus_the_trenton_turnaround_desc: "In the streets they cheer, for the trenton triumph has come here. The people of New Jersey will enjoy peace and new prosperity from not only our economic investment but from the civil order and care we shall create by reintroducing civil services."
 USB_america_focus_the_great_reclamation: "The Great Reclamation"
 USB_america_focus_the_great_reclamation_desc: "Through countless investments, careful planning and a true show of national determination. We now can truly take off the shackles of the old world, old ideals and look to a future, a future of freedom. We can truly now say with pride that we are, The Free States."
 USB_america_focus_the_elections_question: "The Elections Question"
 USB_america_focus_the_elections_question_desc: "With the nation finally reorganized enough to create real political discussion, we now face the reality of what do we want in these early days of our new nation. Some want elections and some just want stability, in the end of it only time will tell where the nation's ambitions lay."
 USB_america_focus_ban_elections: "Ban Elections For Now"
 USB_america_focus_ban_elections_desc: "We need to focus on the now, stop relishing the past and stop dreaming of the supposed future we need. What we need is stability and action to run the nation now, so we can be able to worry about our future later."
 USB_america_focus_establish_elections: "Establishing Elections"
 USB_america_focus_establish_elections_desc: "We must come to an agreement as a nation of what direction we want to take, as such new elections will be held and the people will choose the future."
 USB_america_focus_federalist_rightist: "Federalist Right Takes Victory"
 USB_america_focus_federalist_rightist_desc: "With the election debate answered the national referrendum has seen the Federalist Party win and be the standing government in the foreseeable future. But with this also comes the reality that the Anti-election rightist faction has secured dominance. We'll see what choices they make to lead this new beacon of hope."
 USB_america_focus_federal_taxes_when_needed_not_wanted: "Christan Sandsworth Act"
 USB_america_focus_federal_taxes_when_needed_not_wanted_desc: "The Christan Sandsworth Act is a new way to look at how to create and reform a tax code for a society. Special sessions to change or reform portions of the tax code can be called by either the president or the main leader of the two chambers of congress. This session will focus on one central topic within the tax code and either vote to change and or reform it or vote to dismiss the measure. The main principle now, is that legislatures and people are looking to make a tax code based on need rather than want. What does the nation and our society need now, rather than want whenever."
 USB_america_focus_federal_many_hands_act: "Hardy Workers Act"
 USB_america_focus_federal_many_hands_act_desc: "The HWA is a series of reforms to help jumpstart economic growth and job employment. While we're still in the quote, stone age, we can nevertheless work in jumpstarting the road to refinement. Our inefficencies will be matched by our tried and trusted workers. Understanding the need to make new from what is old our legislative reforms seek to instill a new form of patriotism through the work place. Work hard now so we can play even harder later."
 USB_america_focus_federal_societal_progress_act: "Societal Progress Act"
 USB_america_focus_federal_societal_progress_act_desc: "The SPA will seek to make changes in society become more of a people issue rather than a political issue. States and locality can pass, reform and create their laws which can enforce the continuance of civil order and lawful conduct. However laws which may be considered discriminatory or impartial towards one group or another can be appealed to their state and if need be the federal courts. The court cases will be documented extensively to allow for public awareness and to get as much info out on the estranging subject so as to be able to have not only a favorable court ruling if need be, but to have the citizens in the localities or states better understand the issue and preceed in a manner which is better for as many as possible."
 USB_america_focus_federal_liberty_businesses_act: "Liberty Businesses Act"
 USB_america_focus_federal_liberty_businesses_act_desc: "The old order was entirely to strict in its business rules. If we are to rebuild at any noteworthy pace we must allow those who want to lead be able to have the tools and ability to do so. As such this bill will allow for a government assistance program as well as restricting the regulations to just the basics of human care and expectation of a modern society."
 USB_america_focus_federal_clear_minds_act: "Clear Minds Act"
 USB_america_focus_federal_clear_minds_act_desc: "The CMA will be an independent commission for anti-corruption affairs to make sure the government will run as smoothly as possible. Many see this as a way to tackle fears that the new government is just like the old, nevertheless a new age is hear and so lets start strong shall we."
 USB_america_focus_federal_the_liming_act: "The Liming Act"
 USB_america_focus_federal_the_liming_act_desc: "The Liming Act is a sort of spin on the German government's debt blocking legislations for how they make budgets. Only we're taking it a step further. Quantitative Easing policies will only be within a 5% threshold of the current GDP figures for that fiscal quarter. Any QE program created must be put towards a bill or legislation which in not covering no more than five distinctive things. Meaning you can't have a bill that has a supposed hundred different things to allocate for but only have say $50 to actually allocate towards."
 USB_america_focus_federal_industrial_standards_act: "Industrial Standards Act"
 USB_america_focus_federal_industrial_standards_act_desc: "The ISA will look to create a new and modern standard for which we should be starting at when it comes to economic development and the businesses and industries we attempt to create. It is one thing to compete with the globe, its another to actually care and compete with one's self."
 USB_america_focus_federal_remechanization_act: "Re-Mechanization Act"
 USB_america_focus_federal_remechanization_act_desc: "Our population despite the shrinking state of it is still vast. We can do so much more to help our population by getting back on top of modern forms of mechanization and automation. The future truly is now and we must seize this future for not only us but the very people we serve."
 USB_america_focus_federal_scraping_up_defense_industries: "Scraping Up Defense Industries"
 USB_america_focus_federal_scraping_up_defense_industries_desc: "While we may not be as strong as we once were, we gotta start somewhere. Piecing together any remnants of our defense industry will allow us to at least somewhat supply whatever army we have left."
 USB_america_focus_federal_reset_act: "The Reset Act"
 USB_america_focus_federal_reset_act_desc: "With the nation having shut down and reset itself to practically an infantile state, we must seek out a new start to our power grid. The old system was cumbersome, woefully out of date and not to mention painfully open to attacks. The Reset Act will create a new baseline for planning, building and securing our new power grid as well as securing the ability to expand it when the nation's needs arise."
 USB_america_focus_federal_appalachian_act: "Appalachian Act"
 USB_america_focus_federal_appalachian_act_desc: "The Appalachian Act is a government investment initiative to revitalize and get back on track with the resources of the land for which we still luckily hold on to. With this in mind we do hold a significant part of the Appalachian Mountain ranges and as such we must understand, survey and bring forth the minerals and ores so our nation may prosper and strive to better again what was once lost."
 USB_america_focus_military_distinctions_act: "Military Distinctions Act"
 USB_america_focus_military_distinctions_act_desc: "The MDA is a starter investment bill to directly fund, standardize and make distinctive the army of the Free States. These new standards in training, planning and organization as well as more or less beginning to standardize our military industrial power will allow for at the very least us to defend our homes if we were to be invaded in the near future."
 USB_america_focus_naval_distinctions_act: "Naval Distinctions Act"
 USB_america_focus_naval_distinctions_act_desc: "Following on the heels of the MDA the NDA seeks to revitalize whatever ships, servicemembers and installations we have left from the pre-divided days. Its not much in terms of a start, but with our growing industry and our nation coming back to stable means we'll surely get there."
 USB_america_focus_national_pride_initiative: "Free States Day"
 USB_america_focus_national_pride_initiative_desc: "The National Pride Initiative is a national holiday being dubbed as Free States Day, this day which is both a bank holiday as well as a general national holiday that everyone will have off except vital services which will only be allowed to work in shifts of four hours on this specific day. The point is to celebrate the progress we have made as a nation and to give back to our people. The mandate is to essentially give as many people in the nation a dedicated day off for all possible and plausible."
 USB_socialist_statist_victory: "Free Socialist Party Statist Faction Wins"
 USB_socialist_statist_victory_desc: "The conclusion to the national poll is a victory to the Free Socialist Party, not only that but their Statist oriented faction. This faction is focused on more central authority and national unity as apart to their \"Anarchist\" counterparts. Nevertheless we'll see what this supposed Red Dawn has to provide and hopefully a brighter future will be in store for the citizens of this new great nation."
 USB_socialist_statist_socialized_industry: "Socialized Industry"
 USB_socialist_statist_socialized_industry_desc: "The public has lost its way and as such we must sponsor and ensure employment and industrial growth. This way not only do we understand more directly the economic condition but the effects our programs have on people so we can adjust to better help them."
 USB_socialist_statist_reformed_welfare_state: "Reformed Welfare State"
 USB_socialist_statist_reformed_welfare_state_desc: "A welfare state is a like a parent. There to help you when you're down and guide you to better yourself. The old welfare states focus more at only just catching people, where as our reformed welfare will not only catch but stand them up and get them back on the journey of life. Through adapting funding as well as prioritization of programs for reintegration we'll make sure our programs pay for themselves."
 USB_socialist_statist_socialized_education: "Socialized Education"
 USB_socialist_statist_socialized_education_desc: "Uniformed public education. This is the standard and foundation we will make so we uplift our people as well as show we can not only create the standards, but break and raise them."
 USB_socialist_statist_the_peoples_army: "The People's Army"
 USB_socialist_statist_the_peoples_army_desc: "We are surrounded by nations which fear our ideas and our ideals. Haunted by the spectre of Authoritarian Socialism which has plagued history and given the economic model its stigma, we must look to defend our people, our homes and our very ideals which make us a proud and strong nation."
 USB_socialist_statist_tax_brackets_act: "The Tax Brackets Act"
 USB_socialist_statist_tax_brackets_act_desc: "The TBA is a comprehesive legislation to overhaul and set the modern standard of what it means to have a progressive tax code. The basics of tax brackets is that there are now 16 tax brackets which have uniformed differences in monetary scope as well as the percentage increases are smoother and more literally progressive. The final bracket and of course the highest is anything over $250,015 taxed at 40%. While yes this does sound steep we must look to the actual difference in real proportional value of the average person's income being taken via taxes. As such this is why we must have such a smooth tax code to ensure this true form of equality and shared societal contribution towards developing our economy and ensuring the schools, emergency services and so forth our looked after and funded properly."
 USB_socialist_statist_millennium_labor_reforms_act: "Millennium Labor Reforms Act"
 USB_socialist_statist_millennium_labor_reforms_act_desc: "The MLRA will fundamentally change how labor relations as well as laws are passed. Though the legislatures will officially pass and sign bills into laws, a joint union and business relations committee will be established having equal representation between unions and industrial leadership coorisponding to the established unions. This committee will work together to centralize complaints and ideas to better not only the workers lives, but to balance that workers needs with proper economic backing as well. After all, half compromising is no real compromise."
 USB_socialist_statist_modern_geology_act: "Modern Geology Act"
 USB_socialist_statist_modern_geology_act_desc: "The Modern Geology Act is a government investment initiative to build up the raw materials industries as well as boost the baseline of our economy. Through targeted research and geological surveys we'll set up new mines and controlled forestry industries to allow a surplus of raw materials wherein we can create a modern economy."
 USB_socialist_statist_modern_marxism: "Modern Marxism"
 USB_socialist_statist_modern_marxism_desc: "In the new millennia tech and technology is the prime luxury to those in the civilian, military and all sorts of economy sects and walks of life. As such we must ensure a dedicated part of our economy is geared towards the tech sector and innovations."
 USB_socialist_statist_national_security_act: "National Security Act"
 USB_socialist_statist_national_security_act_desc: "The NatSec Act is legislation dedicated to ensure the security and safety of our nation and its citizens. A federal agency known as the Internal Security Division will coordinate and help with training, regulating and distributing federal funding for local law enforcement agencies. Uniformity and standards are what is needed to ensure the integrity and safety of our nation and its ideals."
 USB_socialist_statist_manufacturing_investments: "Manufacturing Investments"
 USB_socialist_statist_manufacturing_investments_desc: "With little to no domestic manufacturing we must invest in developing this critical sector of our economy if we are ever to grow and look to our goals."
 USB_socialist_statist_department_of_anticorruption_affairs: "Department of Anti-Corruption Affairs"
 USB_socialist_statist_department_of_anticorruption_affairs_desc: "The DACA is a an independently created and federally sanctioned institution wherein anti-corruption investigations and general auditing of the government can be conducted. The department while federally sanctioned in law, is not actually apart of the federal government and has no real control over it. This disconnect will allow for the maximized effectiveness in conducting government audits and ensuring the best form of transparency for our citizens and future administrations. Lets try and not repeat our past huh."
 USB_socialist_statist_modern_agrarian_reforms: "Modern Agrarian reforms"
 USB_socialist_statist_modern_agrarian_reforms_desc: "The world needs food, whether its our own people or those in less fortunate areas and or nations of the world. Therefore we must fine tune and revolutionize our agriculture industry to better suit our domestic needs and even help those in the world. This growth and dependency will allow us also to experiement and increase fuel diversification through bio-fuel programs. Ethonol has always been a bit of a red headed step child in the fuel world and as such why not give it the care and love it needs to make it a better version of itself."
 USB_socialist_statist_coastal_security_act: "The Coastal Security Act"
 USB_socialist_statist_coastal_security_act_desc: "The CS act is limited investments into rebuilding and or at the very least bringing back online any naval personnel and naval vessels which we still have under our control. Though nothing of grand amount, its still enough to have a start considering we don't have a continents worth of coastline to worry about anymore."
 USB_socialist_statist_energy_conservations_act: "Energy Conservations Act"
 USB_socialist_statist_energy_conservations_act_desc: "The legislature has recently proposed a bill to invest in dedicated energy R&D projects as well as better streamlining and growing our electrical grid. We hope that in the end we'll be able to not only produce more energy for our nation's needs, but be able to utilize this growing demand in a efficient way. In other words, shrink our demand whilst it grows, a sort of balance if you will."
 USB_mid_atlantic_isolationist_victory: "Mid-Atlantic Isolationist Faction Victory"
 USB_mid_atlantic_isolationist_victory_desc: "The MAP or Mid-Atlantic Party has seized the victory in the national poll. This faction however is a strong isolationist faction wherein the idea of expansion is seen as pointless waste of human and natural resources. While many are wondering if they even care that the old republic fell, more are just tired of the struggling and reset to their daily lives. So for now peace is understood and prosperity is the goal. Glory to the Mid-Atlantic States of America."
 USB_mid_atlantic_self_determination_act: "Self Determination Act"
 USB_mid_atlantic_self_determination_act_desc: "The SDA is a bill which will help solidify our national ethos. We wish to live, thrive and cooperate with those in the world. While we do miss the old days, we must look to new mornings and prospects if we are to truly go anywhere in life's big game."
 USB_mid_atlantic_raw_materials_act: "Raw Materials Act"
 USB_mid_atlantic_raw_materials_act_desc: "The government has recent passed and investment scheme to grow and prop up our raw materials and primary resource industries. In order to build up we must have a foundation for which to build upon, this foundation will be marked by our primary resource sectors and ability to have the materials needed to grow our manufacturing capabilities."
 USB_mid_atlantic_dedicated_automation_investments: "Dedicated Automation Investments"
 USB_mid_atlantic_dedicated_automation_investments_desc: "In order to rebound our economy into the modern age, we must seek out dedicated investments in terms of automations to allow our manufacturing to be competitive with regional powers."
 USB_mid_atlantic_atlantic_education_initiative: "Atlantic Education Initiative"
 USB_mid_atlantic_atlantic_education_initiative_desc: "The AEI is an education funding bill to grow our education system's ability to teach and raise the standards of knowledge our citizens will be equipped with in life."
 USB_mid_atlantic_atlantic_care_act: "Atlantic Care Act"
 USB_mid_atlantic_atlantic_care_act_desc: "The Atlantic Care Act is a healthcare betterment budget to standardize as well as increase both the capacity and standards for which healthcare is administered to our general population. Both public and private option are to be available with the commonality of regulations into the overall tendancy of administration overbloating problems. Now people can know that their money is going to their care instead of only administrators and paper pushers."
 USB_mid_atlantic_department_for_transparency: "Department Of Transparent Affairs"
 USB_mid_atlantic_department_for_transparency_desc: "The DoTA will be an independent government agency that will be able to investigate the government for corruption and general misconduct in terms of carrying out their duties and responsibilities as governmental leaders."
 USB_mid_atlantic_tech_development_grants: "Tech Development Grants"
 USB_mid_atlantic_tech_development_grants_desc: "The new millennia brings new industries, as such a rising star is the tech sector. The tech sector is a vital growth spot for any modern economy and we must ensure we have our own. Therefore development grants will be relinquished to business ventures looking to create new tech sector businesses in order to not only boost our economy but our societal integration with these ever growing inovations in goods and services."
 USB_mid_atlantic_blue_ridge_act: "Blue Ridge Act"
 USB_mid_atlantic_blue_ridge_act_desc: "Resources, simply put we must secure more domestic supplies if we are to be a true new pillar in this hemisphere."
 USB_mid_atlantic_naval_securities_act: "Naval Securities Act"
 USB_mid_atlantic_naval_securities_act_desc: "We are a small nation now and as such we must ensure the defense of our coastal waters to ensure the security of our national sovereignty."
 USB_mid_atlantic_guardian_angels_act: "The Guardian Angels Act"
 USB_mid_atlantic_guardian_angels_act_desc: "The modern queen of the battlefield is the air force. This key understanding must be invested into if we are to ensure our ability to be a free and independent nation in this new age."
 USB_mid_atlantic_prospectors_initiative: "Prospectors Initiative"
 USB_mid_atlantic_prospectors_initiative_desc: "Autarky...autarky is the word for which the modern age shuns and scolds as backwards. Though its core principle of isolation is, the reality is that a healthy nation is one which can be self reliant. Therefore we are creating a new Homestead Act known as the Prospectors Initiative. Through regulations related to the extraction of resources, families and or individuals that are willing to settle lands of up to five acres will be able to own that land in return for a contribution in the natural resources which may occupy it to the national economy."
 USB_mid_atlantic_planned_policing_program: "Planned Policing Program"
 USB_mid_atlantic_planned_policing_program_desc: "The PPP is a joint federal and local initiative to galvanize public understanding and values of the police forces of the nation. Community outreach programs as well as conventions and so forth will be hosted and planned to allow for the public and the police to better understand as well as genuinely appreciate each other. In short this sometimes gravely misunderstood nature of what it means to not only enforce the law but what it means to be a law abiding citizen. Unity, Not Division."
 USB_mid_atlantic_energy_advancements_act: "Energy Advancement Act"
 USB_mid_atlantic_energy_advancements_act_desc: "The Energy Advancements Act is a complex spending package. Research grants into energy production and consumption, investments into grid modernization as well as regulations towards setting new standards in how we move forward in dealing with future energy demands."
 USB_mid_atlantic_the_true_green_way: "The True Green Way"
 USB_mid_atlantic_the_true_green_way_desc: "Nuclear energy, the future of mass production of energy itself next to of course harnessing the sun itself. But nuclear energy is always such a flimsy thing in the political world. Fearmongers hold onto the mistakes of the past, detracting any sort of nuances. Nuclear hawks tought its energy benefits but forget the nuances in things like planning and the potential side effects of militarization. Nevertheless, we move forward in making key investments into nuclear power production. We must show the world the best way forwards is to not be stuck in the past, or dwell on the present."
 USB_nsp_militarist_faction_victory: "National Service Party Militarizes Victory"
 USB_nsp_militarist_faction_victory_desc: "The poll has come back and the NSP or National Service Party has come out on top. However many are not happy about such an agreement and so the NSP's Militarist faction has used this as a way to win the party struggle. Now leading members of the NSP are in other words \"Militarizing Victory\", wherein the military, the people who serve and just the idea of security itself is the victory which the people have voted for. While some fear the messaging can be seen as fearmongering, others are just looking to move forward and rebuild what was once lost. Let's See what they can do has become the silent saying."
 USB_nsp_meritocracy_act: "The Meritocracy Act"
 USB_nsp_meritocracy_act_desc: "The Meritocracy Act or some also call the Merit Act, is a comprehensive legislation which reforms and overhauls the appointment and vetting process of individuals seeking to be in leadership positions in the government be it federal, state or local. The process focused on extensive background checks in things like personal creed, experience as well as proven accomplishments and deeds within their job fields will allow for us to pave the way for a true technocratic approach to government and administration. The reviewing departments will be independent comissions with people outside of any direct or indirect affiliation with said reviewed individuals to keep transparency and justness of the review in the highest possible of standards."
 USB_nsp_industrial_investments: "Industrial Investments"
 USB_nsp_industrial_investments_desc: "To ensure domestic security a strong civilian economy is just as good as a strong military economy."
 USB_nsp_military_investments: "Military Investments"
 USB_nsp_military_investments_desc: "We must be ready for anyone of our neighbors to get a funny idea and try to subdue us. As such a host of limited investments to jumpstart the military economy and the armed forces readiness are well overdue."
 USB_nsp_maritime_investments: "Maritime Investments"
 USB_nsp_maritime_investments_desc: "Our coast is vast and must be defended, on the other hand these initial investments will boost the civilian economy in terms of trading and spreading awareness to our cause."
 USB_nsp_the_national_arteries_act: "The National Arteries Act"
 USB_nsp_the_national_arteries_act_desc: "The NAA is a mass infrastructure investment plan to revitalize and update the practically crumbling state of our national infrastructure. We must set a standard of throughput if we are to connect our nations' people as well as its economy and military readiness to the forefront of crisis management standards for which we will set new records for said standards."
 USB_nsp_department_of_internal_investigation: "Department OF Internal Investigation"
 USB_nsp_department_of_internal_investigation_desc: "The DII is a focused anti-corruption affairs agency to ensure the stability and fortitude of our meritocracy. We must create the ethos of selfless service both in military and civilian jobs if we are to ensure the longevity and stability of our nation."
 USB_nsp_national_high_command: "National High Command"
 USB_nsp_national_high_command_desc: "With the civilian and military parts of our society being so different we must learn to better integrate and make whole these divisions of reality. Therefore as well as investments into the national security of the capital region of our nation a new reorganization of the leadership structure of the nation will be implemented. Our Commander in Chief will now have the combined title of Marshal of Society, this title shortened to simply Marshal, will unify the understanding that civilian and military affairs are but one unifying matrix to the cohesion and survival of our fair and small nation."
 USB_nsp_mini_steel_belt: "Mini Steel Belt"
 USB_nsp_mini_steel_belt_desc: "With domestic priority our number one priority we must secure the cornerstone of modern building and manufacturing support. The Mini Steel Belt investment program will see wide investments in West Virginia and Pennsylvania to polish off and renew what little of the \"Rust Belt\" we have left."
 USB_nsp_militarizing_society: "Militarizing Society"
 USB_nsp_militarizing_society_desc: "Voltaire once said that the nation of Prussia was not a state with an army, but rather an army with a state. To this we say this should be a statement of reality itself. No society needs a military and yet a military doesn't earnestly need the society. With this in mind we must unite in full cohesion the military and society itself. Work ethics, education and the further development of technology as well as governance can and will be organized like it was the military itself. Encouraging the full merits of a meritocracy, the strive of betterment to oneself as well as the body of the society at large."
 USB_nsp_energy_investments: "Energy Investments"
 USB_nsp_energy_investments_desc: "With our mobilization of the economy as well as the rebuilding of our military it is in our best interests to ensure the energy needs of not only our people but our military are met. While these may not be immediately solved, this investment and research grants will allow for better development of new efficient methods of not only energy production but of energy consumption."
 USB_nsp_top_priority_budgeting: "Priority Budgeting"
 USB_nsp_top_priority_budgeting_desc: "We hold control of several ports and significant naval dockyards leading to a naval influenced direction. As such with our coast size, our growing trade and the potential incursion of foreign adversaries, we must set up a priority system in our budgeting to ensure the defense of our nation and its people."
 USB_nsp_expanding_jersey_foundries: "Expanding The Jersey Foundries"
 USB_nsp_expanding_jersey_foundries_desc: "The foundries and metalurgic mills of New Jersey produce a diverse set of light metals. These light metals are critical for civilian as well as military expansion and as such we will invest into New Jersey all around to make it more on par with our growing demands as a nation."
 USB_nsp_defensive_expenditure_warfare: "Defensive Expenditure Warfare"
 USB_nsp_defensive_expenditure_warfare_desc: "With our backs to the sea already given our geographic location, we must ensure the survival of our nation. With this in mind R&D as well as budgeting for the army has been set to a strict defensive mindset. Understanding that our adversaries are many we must be vigilent in holding the line while also being able to hold onto the means of war production. As such the development of a new doctrine of warfare is our highest priority from here on out we will be developing what is known as Defensive Expenditure Warfare."
 USB_nsp_the_new_identity: "The New Nation"
 USB_nsp_the_new_identity_desc: "With the solidification of our nation, its people, military and ethos. We must come up with a new name to ensure this new found identity. For we are no longer simple the Free States of America, we are the Mid-Atlantic Union."
 USB_america_focus_federalist_liberals_win_election: "Federalist Liberals Win Election"
 USB_america_focus_federalist_liberals_win_election_desc: "The election results are in and it looks to be that the Federalist Party has secured a victory. This victory also seems to have shifted the party balance into a more liberal apparatus as the main supposed conservative members were anti-election. One of the previous members stating \"Elections are a distraction to the national survival\", nevertheless the people look forward to any change, especially a return to hopeful normalcy."
 USB_states_focus_fed_left_national_works_administration: "National Works Administration"
 USB_states_focus_fed_left_national_works_administration_desc: "The NWA is a new dedicated government administration to help economic building. Through planning of infrastructure and government based economic ventures, this should in turn reduce unemployment as well as be a slight stimulant to the economy even in down times."
 USB_states_focus_fed_left_industrial_development_committee: "Industrial Development Committee"
 USB_states_focus_fed_left_industrial_development_committee_desc: "With the establishment of the IDC, the nation's industrial development will be able to have a purely private sector format with the additional help of government programs to allow for the diversity of not only the industries present but of where they'll be established as a way to ensure a balanced manner to not leave one community, county or perhaps even a whole state lagging behind from its contemporaries."
 USB_states_focus_fed_left_department_of_innovation: "Department Of Innovation"
 USB_states_focus_fed_left_department_of_innovation_desc: "The DoI or Department of Innovation is a federally sponsored research and development institution to fund and work with private research firms in innovation and general scientific advancements in fields critical to the raising of the the national standard of living. As such with substantial funding we will make up for this national setback and set forth the pathway to the future."
 USB_states_focus_fed_left_education_standards_act: "Education Standards Act"
 USB_states_focus_fed_left_education_standards_act_desc: "The ESA is a bill which will set the baseline expection within the nation's education system. No more of the old system where almost every county had its own variation of how things were taught to achieve the supposed sme end results. From now on the curriculum will be standardized and expected to be upheld in for each respective education level, regardless of where the institution is located within the nation."
 USB_states_focus_fed_left_automation_advancements_act: "Automation Advancements Act"
 USB_states_focus_fed_left_automation_advancements_act_desc: "The AAA will see direct funding into the expansion and standardizing industry practices in terms of acquiring and implementing different technologies which automate the production process. In short, more investments to make more from less so we can have more to make more."
 USB_states_focus_fed_left_the_true_deal: "The True Deal"
 USB_states_focus_fed_left_the_true_deal_desc: "The True Deal is a massive economic package looking to invest, diversify through available and found natural resources, as well as create a central infrastructure network in the mostly central part of the nation. Industry, infrastructure and new mining initiatives will pave the way to the future for which we wish to have for our people. This really is a True Deal for the citizens."
 USB_states_focus_fed_left_department_of_internal_investigation: "Department Of Internal Investigation"
 USB_states_focus_fed_left_department_of_internal_investigation_desc: "The DoII or more commonly known as the Oligarch Obliteration Bureau, is an independently formed anti-corruption agency tasked with regularly investigating and keeping in check those who are apart of the federal government. The independent body is made up of elected individuals based on three main criteria. 1. Being some kind of administration and or investigation background. 2. Being politically apathetic or of a non-voting background to ensure the integrity of the institution. 3. Representatives must be balanced within all main social classes from each respective state to ensure diversity in perspective to understand the simplist and at the same time most complex ways one can cause corruption. This institution will be a cornerstone in ensuring the Free, in Free States of America."
 USB_states_focus_fed_left_old_power_is_still_power: "Old Power Is Still Power"
 USB_states_focus_fed_left_old_power_is_still_power_desc: "With our economy coming back online and our demands outpacing our production we must seek out cheap ways to produce power if we are to stay ahead of the growth."
 USB_states_focus_fed_left_new_power_is_balanced_power: "New Power Is Balanced Power"
 USB_states_focus_fed_left_new_power_is_balanced_power_desc: "With the turn of the millennia, the investments and development of renewable energy generation technologies has been astounding. We must diversify our generation and use these renewables to instill the power we demand, what we will need in the future and if things go well enough. We just might be able to use this excess energy to our advantage."
 USB_states_focus_fed_left_future_power_is_future_proofing: "Future Power Is Future Proofing"
 USB_states_focus_fed_left_future_power_is_future_proofing_desc: "The future is both now and beyond, if we are to innovate we must seek to at least expose and understand the energy production means associated with such. Nuclear fission will fit into our well rounded means of energy production and be a great boost to our economy overall. Not only that but with proper investments in R&D, who knows, maybe Fission will go our and Fusion will be the new future. Only time shall answer that question."
 USB_states_focus_fed_left_the_substations_act: "The Substation's Act"
 USB_states_focus_fed_left_the_substations_act_desc: "This bill is a comprehensive research and infrastructure investment scheme to ensure the efficiency as well as the proctections needed with such rapid growth and expansion of our electircal grid. All in all we must not only grow our power generation needs, but we must be more efficient in how we consume said power."
 USB_states_focus_fed_left_the_self_defense_act: "The Self Defense Act"
 USB_states_focus_fed_left_the_self_defense_act_desc: "Despite its name, the SDA is not a civil law change but rather a military, more specifically an army investment and development fund. Our current situation grows more weary with each passing day. Foreign powers wish to seek out and take what we have rightfully created, well we will ensure that does not happen."
 USB_states_focus_fed_left_freecare_program: "The Freecare Program"
 USB_states_focus_fed_left_freecare_program_desc: "Freecare is our way of rolling out a form of universal welfare system. Outlining the needs of our people, we will invest in both domestic and acquiring foreign medical professionals and allow for a four tiered system of levels of care needed for citizens. These levels of care will allow the administration side of things to organize how quickly and efficiently care can be distributed to a growing population by understanding the severities of illnesses and injuries along with those professionals on the ground can sign off on a potential increase in level at the current time if a patient suddenly changes in terms of condition. Afterall, nothing is certain in life, but death itself."
 USB_states_focus_fed_left_mid_atlantic_fleet: "Mid-Atlantic Fleet"
 USB_states_focus_fed_left_mid_atlantic_fleet_desc: "Despite the fact we do hold a significant amount of the former ships of the old order, our position is tenuous at best. Most naval yards and facilities are run down and in need of repairs and renovations to get back on par with even a nation like say Australia or Portugal. Therefore a significant naval fund will be used to dedicate this overhaul to allow for the unmothballing of our current naval state."
 USB_america_focus_anarchists_fsp_anarchist_victory: "FSP \"Anarchists\" Collectivize Victory"
 USB_america_focus_anarchists_fsp_anarchist_victory_desc: "In a shocking turn of events the Free Socialist Party has come out on top, being comprised of various flavors of red the recent shift in pro-elections has seen the party shift from a hardline Marxist/Authoritarian Socialism, to a now more balanced, be it confusing balance, but a balance of European styled Social Democrats and what some joke as \"Pseudo Anarchists\", for their ability to be more cooperating in a system that involves a state. Nevertheless the election was won by the FSP and now it is only the future and party leadership to determine the future of our nation."
 USB_america_focus_anarchists_communalcare_program: "CommunalCare Program"
 USB_america_focus_anarchists_communalcare_program_desc: "The CCP, ironic huh, is a dedicated welfare program system that relies on subsidized funding of locally created care facilities wherein the locals for that town and or municipality get care from people within that municipality. Of course there will always be a need for people to help those in need, but the essence of the facility is that it was founded by locals to care for local. Think eldercare and child care, after all didn't Jesus say Love Thy Neighbor."
 USB_america_focus_anarchists_red_rose_health: "Red Rose Health"
 USB_america_focus_anarchists_red_rose_health_desc: "The RRH program is a dedicated healthcare program to create the steps towards a universal healthcare system. Assessing what each state needs, these state by state branches are able to divide their control into regional subsets and allow for the counties to give proper feedback. In turn we hope to set up a proper command like structure to allow for the least paperwork and the ease of control. Since the failures of most UH type programs goes from more administrators than healthcare personnel."
 USB_america_focus_anarchists_syndicate_industries: "Syndicate Industries"
 USB_america_focus_anarchists_syndicate_industries_desc: "The trade unions are a significant part of our voting base and a great influence in the old rust belt states. As such we must develop and ensure the trade unions with real jobs and future development if we are to keep our position."
 USB_america_focus_anarchists_social_tech_incorporated: "Social Tech Incorporated"
 USB_america_focus_anarchists_social_tech_incorporated_desc: "The modern age requires modern industries, the tech and services industries are the future. As such we will invest and diversify our economy to grow our abilities to not only increase the quality of life of our citizens but also export these things and gain foreign attention and investment."
 USB_america_focus_anarchists_community_defense_act: "The Community Defense Act"
 USB_america_focus_anarchists_community_defense_act_desc: "With the world being a dangerous place and foreign powers looking to exploit our very timid position. We must seek out a way to defend ourselves and thus we must look to not only the army but to the communities of our nation to want to defend their homes and families."
 USB_america_focus_anarchists_civil_affairs_administration: "Civil Affairs Administration"
 USB_america_focus_anarchists_civil_affairs_administration_desc: "The CAA is a dedicated body to dealing with auditing and anti-corruption affairs. We must instill the highest standard of ethics to ensure the people as well as the world recognizes we are a real government, a real nation and a genuine society to be respected and helped."
 USB_america_focus_anarchists_red_ducation_act: "Red-ducation Act"
 USB_america_focus_anarchists_red_ducation_act_desc: "The Red-ducation Act is a large education investment to standardize and improve what we teach, why we teach and the overall goal of what our education system is in terms of the betterment of our society."
 USB_america_focus_anarchists_foreign_relations_act: "Foreign Relations Act"
 USB_america_focus_anarchists_foreign_relations_act_desc: "With our government beign aligned with a lot of those nations across the pond per say. We can prioritize policing and government budgeting to ensure trade deals and worker exchange programs are both secure and beneficial to both parties."
 USB_america_focus_anarchists_mineral_expansion_act: "Mineral Expansion Act"
 USB_america_focus_anarchists_mineral_expansion_act_desc: "The MEA will see our mineral and resource extraction industries better. Through introducing new tech and regulations as well as dedicated government grants to expand or start new mineral operation, we will ensure our national success into as best as well can to sustain our domestic needs."
 USB_america_focus_anarchists_the_interstate_renewal_act: "The Interstate Renewal Act"
 USB_america_focus_anarchists_the_interstate_renewal_act_desc: "The interstate system is the veins of our nation's economy and social cohesion. We must clean, clear and build stronger and more reliable veins if we are to have a strong and healthy nation."
 USB_america_focus_anarchists_consumer_industry_advancements: "Consumer Industry Advancements"
 USB_america_focus_anarchists_consumer_industry_advancements_desc: "To ensure our domestic quality improvement on top of our economic competitiveness, we must invest and ensure the implementation of new advancements in automation. On top of that we must find new techs to include in our industries to increase not only the quantity yet keep the product's quality as well."
 USB_america_focus_anarchists_parker_harrison_act: "Parker-Harrison Act"
 USB_america_focus_anarchists_parker_harrison_act_desc: "The Parker-Harrison Act is a national investment into our energy needs. Investments in new power plants, technologies as well as regulations and innovations into efficiencies related to consumption of said energy. We will secure the energy needs of our citizens and raise the standards of what a modern nation should have."
 USB_america_focus_anarchists_family_unity_program: "Family Unity Program"
 USB_america_focus_anarchists_family_unity_program_desc: "The FUP is a program and tax relief for families of dedicated size of three children or more. This ensures the domestic family unit be strong while giving them the resources to keep that unity so that our human capital will be for the betterment of our nation. For as our economy grows our people must be able to grow and live the lives they want to live."
 USB_america_focus_anarchists_army_readiness_act: "Army Readiness Act"
 USB_america_focus_anarchists_army_readiness_act_desc: "The national preservation is one of our top priorities to keep and hold what is dear to our way of life. As such investing in our military and specifically our army to bolster the defense of our nation and its people from foreign foes."
 USB_mid_atlantic_identitarian_victory: "Mid-Atlantic Identity Win Election"
 USB_mid_atlantic_identitarian_victory_desc: "The MAP or Mid-Atlantic Party has won the election to ironically not many people's surprise. What is surprising is that the party has shifted more into an identitarian party with the number one goal of creating an Atlantic States identity. But for now they are content with the Mid-Atlantic identity and holding as well as securing the homefront first and formost."
 USB_mid_atlantic_identitarian_rust_to_riches: "Rust To Riches"
 USB_mid_atlantic_identitarian_rust_to_riches_desc: "A third of our nation is apart of the old rust belt....these states use to be the defining prowess of the 20th century's industrialism. Now they lay there, dead, decaying and suffering. Well no more, we will rebuild, we will repair, polish and make these rusting states into shining beacons of our nation."
 USB_mid_atlantic_identitarian_the_old_black_gold: "The Old Black Gold"
 USB_mid_atlantic_identitarian_the_old_black_gold_desc: "The state of West Virginia is a state suffering by the passage of time itself. With the situation as it is we must develop and ensure that this \"old gold\", be used in the new age. Research and investments into an overhaul like development of the state will allow it to florish and prosper once more."
 USB_mid_atlantic_identitarian_naval_novelty: "Naval Novelty"
 USB_mid_atlantic_identitarian_naval_novelty_desc: "The decay of our naval readiness is something which opens literally the seas to have us attacked. We will refurbish and develop our navy and naval industries if we are to secure our coastline at all."
 USB_mid_atlantic_identitarian_national_defense_act: "National Defense Act"
 USB_mid_atlantic_identitarian_national_defense_act_desc: "The National Defense Act is an army development and readiness funding as well as legislation to improve our abilities to defend our nation on land. Things like the national guard as well as the idea of a mandatory service period have also been proposed but uncertain if we should go that far so quickly."
 USB_mid_atlantic_identitarian_aviation_development_fund: "Aviation Development Fund"
 USB_mid_atlantic_identitarian_aviation_development_fund_desc: "The ADF is legislation dedicating defense spending to the development and modernization of our air force... Something which has fallen down the worst in terms of near disorganization and lack of knowledge to even continue the service. Everyone knows how to play soldier and sailor, but flying a plane of any kind requires a proper physical standard and ability to learn and understand the equipment."
 USB_mid_atlantic_identitarian_military_influenced_education: "Military Influenced Education"
 USB_mid_atlantic_identitarian_military_influenced_education_desc: "The education system is a system to teach and prepare the youth and future generations for the supposed \"Adult World\". As such our world is not so bright and we must have a small but highly dedicated influence and exposure of the military and military life through programs and or classes like the JROTC or Junior Reserve Officer Training Corps as well as specialized PE classes. This way it will passively boost military recruitment and duty to the nation regardless if they decide to join up or not. The JROTC program can not only be used to prepare potential soldiers, but teach kids things like public speaking, leadership qualities and group work which all work just as well in the military as they can in the civilian world."
 USB_mid_atlantic_identitarian_service_member_tax_breaks: "Service Member Tax Breaks"
 USB_mid_atlantic_identitarian_service_member_tax_breaks_desc: "Our national defense and the preservation of our new found identity is that which we hold dear. Thus as our citizens who choose to defend such should be looked after through tax reliefs and certain stipend based supplements to service member families."
 USB_mid_atlantic_identitarian_pseudo_mobilized_economy: "The \"Mobilized\" Economic Model"
 USB_mid_atlantic_identitarian_pseudo_mobilized_economy_desc: "The Pseudo Mobilized Economy is a economic model that hybridizes manufacturing industries to go about the normal production methods and so forth. The deviation is that a small dedicated segment of each industry will have roughly five to ten percent of said industry dedicated to some kind of military production. With each main business dedicated to a specific equipment and or class of equipment to produce, the actual breakdown between each businesses factories is up to the business leadership as long as they meet or come close to the expected quotas and as well as ensuring the quality of produced equipment."
 USB_mid_atlantic_identitarian_the_new_nation: "The New Nation"
 USB_mid_atlantic_identitarian_the_new_nation_desc: "From now on we are no longer just the \"Federal remnants of a bygone era\". We will now be known as the Mid-Atlantic Federal Union. A purer union based on the new found identity and culture we have spent to grow and call our own. Of course we respect the past, hence the Federal Union, but nevertheless this is a new step forward and it can only be up from here."
 USB_mid_atlantic_identitarian_developing_the_arms_industry: "Developing The Arms Industry"
 USB_mid_atlantic_identitarian_developing_the_arms_industry_desc: "To solidify our ability to hold our own, we must ensure the logistics side of such an endeavor is sustained. To this we must develop our military industrial capacity to meet the demands and potential threats which may befall us."
 USB_mid_atlantic_identitarian_further_shipping_industrial_developments: "Furthering Shipping Industrial Development"
 USB_mid_atlantic_identitarian_further_shipping_industrial_developments_desc: "To increase our international recognition we seek the continued development of our naval and shipping industries. While this can have military applications the primary need is of course trade, fishing and so forth."
 USB_mid_atlantic_identitarian_advanced_industries_act: "Advanced Industries Act"
 USB_mid_atlantic_identitarian_advanced_industries_act_desc: "The AIA is a government funding package to develop and grow our tech and service based industries. We must innovate as well as increase our competitiveness on the global stage if we are to stand out amongst the rabble of the rest of the continent we are on."
 USB_mid_atlantic_identitarian_the_primary_industries_act: "The Primary Industries Act"
 USB_mid_atlantic_identitarian_the_primary_industries_act_desc: "If we want to make a name for ourselves then we must act as a leader and a pioneer within a specialty. The continent has resources and the world needs said resouces. Therefore an extensive funding and investment package into developing primary industries and researching new ways to get more from less is the future stake we must claim."
 USB_mid_atlantic_identitarian_the_labor_restructuring_act: "The Labor Restructuring Act"
 USB_mid_atlantic_identitarian_the_labor_restructuring_act_desc: "The Labor Restructuring Act is a comprehensive legislative reforms to the labor laws and overall ability to efficiently allocate the work forces we have available as well as future proofing the ability to gain more productive capabilities with less people. Of course we'll need to increase our welfare and other budgeting apparatuses, but its a true investment for a better standard of living for all our peoples."
 USB_nsp_monarchist_victory: "NSP \"Monarchists\" Victory?"
 USB_nsp_monarchist_victory_desc: "In a shocking turn of events the NSP or National Service Party has won the election. The shock comes with the fact that out of all known ideologies the party's pro-election wing are what they call themselves \"Modern Monarchist\". Their main goal apparently is to keep the democratic system, but give it an aesthetic change wherein the titles are tied to the elected offices. This sort of elected monarchy or as some absolutists sneer as \"pseudo monarchism\" is a bit odd to a lot of people. But the military is content understanding the historical influences that monarchies placed high value on their militaries. Conservatives are content as this would be almost the ultimate conservative move as well as Liberals are more or less content due to the upholding and liberalization of democratic representation that will come from it. After all, what truly is in a name?"
 USB_nsp_monarchist_the_great_debate: "The Great Debate"
 USB_nsp_monarchist_the_great_debate_desc: "Following on our victory in the election, many truly wonder what is the point of cosmetically changing office titles, or how many should we change, ect ect. So the best debaters and calmest heads of the party must come together in this \"Great Debate\" of sorts to ensure the public and skeptics alike just how much will honestly change in the grand scheme of things."
 USB_nsp_monarchist_the_upper_echelon_act: "The Upper Echelon Act"
 USB_nsp_monarchist_the_upper_echelon_act_desc: "So after a lengthy series of debates we have solidified the new cosmetic changes. The choice to renamed the nation the Unified Kingdoms of Arcadia UKA is a symbol of a new identity as well as a symbol to those who once gave our former selves independence. The French colonial region of Arcadia is know for the Canadian provinces of New Brunswick, Nova Scotia and Prince Edward Island. Now she will live on in name with us as the UKA. This new identity allows us to secure title changes for offices, things like Emperor for the President, Princes for the senate, lords or barons for the house, Kings and Queens for the State governors. This supposed upper echelon of the leadership of the nation as a whole will now embody the spirit of a new nation, a new people and a new way forward."
 USB_nsp_monarchist_the_true_progressives: "The True Progressives"
 USB_nsp_monarchist_the_true_progressives_desc: "With a progressive liking to real tax reform we must ensure the fairness in said tax code. Therefore the tax brackets will lead up to $250,000 in terms of what will be the max bracket tax rate. The progressiveness of this being a tested variable amount of brackets split evenly in terms of gaps between them to allow for the most progressive form of taxation. Rather than punishing those that go higher in income, the scaling is based around proportional income earnings. This way there is no actual he said she said riff raff about \"paying your fair share\", when said fair share is based on the proportion of your income and not just cause you paid more by proxy of youearn more than someone."
 USB_nsp_monarchist_the_royal_families_act: "The Royal Families Act"
 USB_nsp_monarchist_the_royal_families_act_desc: "The RFA is a welfare reforms and budgeting bill to support families of the nation and make sure that not only are our citizens are taken care of but the future of our nation are taken care of as well. Everyone knows that the leading cause of divorce is due to financial instability due to the act of having children. Therefore if we want to increase our citizens happiness, increase the development baseline of stable homes and ensure the future of our future citizens and potential leaders then we must literally think of the children."
 USB_nsp_monarchist_the_modern_merchants_act: "The Modern Merchants Act"
 USB_nsp_monarchist_the_modern_merchants_act_desc: "In the old days of the \"Traditional Era\" of monarchism, the merchant was the backbone of ensure the expanded influences and wealth of the monarchy and its nation. In the modern age these now \"Modern Merchants\" are those of the small business owner. The backbone of the economy and the steam for which powers the engine of a nation's economy. As such we must fund, build and endorse small businesses to ensure they're ability to create, save that limiting to corporate entities that wish to look outside of our nation to secure their own wealth instead of the wealth of not just the nation but its peoples."
 USB_nsp_monarchist_the_great_connections_act: "The Great Connection Act"
 USB_nsp_monarchist_the_great_connections_act_desc: "The modern age has done something which even something that was 40yrs ago not even thought of. That is to make the world a smaller place and yet today many see the internet and cellular service as a supposed right to have. Well while material things are never a right outside those needed to survive, we do believe that these services are the future and what better way to grow a nation, its people and its identity then to make everyone closer together. Ensuring the unity through what is being called the Great Connection Act, a large funding package to ensure infrastructure both road and internet/phone based is seen to be expanded, modernized and upkept to the best possibility that our citizens can provide."
 USB_nsp_monarchist_domestic_first_policy: "The Domestic First Policy"
 USB_nsp_monarchist_domestic_first_policy_desc: "The Domestic First Policy or also known as the Domestic Priority Policy is a set of legislations and reforms that enforce the main duty of the government is to act on the security and ensured wellbeing of the domestic front. This means things like trade and so forth must be done in the means of securing the betterment or just out right securing the security of our domestic situation from foreign entities. This kind of pseudo autarkic and nationalistic policy will likely displease a fair amount of other nations, but our citizens should come first or what is the policy of a nation's government."
 USB_nsp_monarchist_the_grand_tour: "The Grand Tour"
 USB_nsp_monarchist_the_grand_tour_desc: "Skeptics are a way of life, as long as someone disagrees there will be skeptical people of if someone is truly \"right or wrong\" about something. Therefore to bolster our international image we must expand our diplomatic corps and ensure that we reduce the possibility of enemies to our own existence."
 USB_nsp_monarchist_la_grand_army: "Our Grand Army"
 USB_nsp_monarchist_la_grand_army_desc: "If there was ever an army to respect, why we would be here all day cause the principle of anyone willing to lay down their own life for what they believe in is the ultimate sacrafice someone can do. Nevertheless the innovativeness of Napoleon do have a special place in the hearts and minds of any officer that is either forward thinking and or future proofing. Though I am safe in thinking that anyone with a ego would also love to be Napoleon as well. Regardless we must treat our army with the upmost respect and diligence if we are to think about surviving a war, especially a war with our new neighbors."
 USB_nsp_monarchist_our_great_navy: "Our Great Navy"
 USB_nsp_monarchist_our_great_navy_desc: "To defense on land to defense on sea, the grand admiralty is what shall procure the security of our trade and coastal communities from the dangers beyond. With the same investing vigor we will turn our armed services around."
 USB_nsp_monarchist_our_defiant_air_force: "Our Defiant Air Force"
 USB_nsp_monarchist_our_defiant_air_force_desc: "The skies above our nation are sacred, this shield must be enforced through a strong and defiant air force. We must have the capabilities to defend our skies from the aggressors abroad, for they may be many and some may even be our neighbors."
 USB_nsp_monarchist_our_vast_resources: "Our Vast Resources"
 USB_nsp_monarchist_our_vast_resources_desc: "We must secure our domestic production and manufacturing. To do this we must invest, grow and subsidize resource extraction industries. These primary industries are the blood which circulates the entirety of any economy and we will certainly make sure that said blood will flow."
 USB_nsp_monarchist_our_strategic_resources: "Our Strategic Resources"
 USB_nsp_monarchist_our_strategic_resources_desc: "While autarky is not the best strategy considering our position in territory, we can at least maximize our domestic situation to be more strategic on the world stage. Therefore we will invest great sums into creating strategic stockpiles and resource streams in terms of mining operations."
 USB_nsp_monarchist_the_great_power_plant: "The Great Power Plant"
 USB_nsp_monarchist_the_great_power_plant_desc: "With all this great and rapid expansion we must also ensure such demands are met, with this in mind we must invest in massive power plant complexes to ensure energy production as well as its utilization are vastly enhanced."