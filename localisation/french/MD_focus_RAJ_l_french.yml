 indian_event.60.d: "[FROM.GetName] a rejeté notre offre de gazoduc !"
 indian_event.60.a: "Ouch"
 TRK_Not_accepted: "Le Turkménistan n'a pas accepté notre proposition !"
 RAJ_Local_markets: "Commerce local indien"
 RAJ_decommodify_the_basics_idea: "Principes thermodynamiques de base"
 indian_event.25.b: "C'est une bonne affaire !"
 RAJ_nuclear_tests_rajasthan: "Essais nucléaires au Rajasthan"
 RAJ_nuclear_tests_rajasthan_desc: "Le renouvellement et l'expansion de notre arsenal nucléaire constituent un précédent important pour la politique de défense indienne moderne. Il est temps de procéder à de nouveaux essais au Rajasthan et d'être sûrs de notre puissance."
 RAJ_terror_and_disruptive_activities_act: "Loi sur le terrorisme et les activités perturbatrices"
 RAJ_terror_and_disruptive_activities_act_desc: "Notre système législatif n'était pas prêt à faire face aux nouveaux défis du terrorisme du XXIe siècle. Il est temps de l'adapter et d'y apporter les modifications nécessaires."
 RAJ_inner_network_idea_desc: "Un réseau interne bien développé est crucial pour notre développement."
 indian_event.12.a: "Bien sûr"
 RAJ_make_threshold_higher: "Augmenter le seuil"
 RAJ_make_threshold_higher_desc: "Pour assurer l'intégrité électorale, nous devons augmenter le seuil électoral pour éliminer les amateurs et autres imbéciles, laissant ainsi de la place aux gens intelligents et éduqués."
 RAJ_BRICS_integer: "Création des BRICS"
 RAJ_BRICS_integer_desc: "Il est temps que les grandes puissances mondiales s'unissent en un seul poing pour créer un monde multipolaire. La conceptualisation des BRICS proposée lors du Forum économique de Saint-Pétersbourg doit être mise en œuvre."
 RAJ_appease_hindus_desc: "Investir dans des programmes communautaires hindous et des initiatives culturelles. Relève l'opinion hindoue, mais peut être vu comme du favoritisme par les communautés musulmanes."
 RAJ_appease_sikhs_desc: "Traiter les griefs de la communauté sikhe et financer des programmes culturels. Relève l'opinion sikhe, mais peut être vu comme du favoritisme par les hindous."
 RAJ_appease_buddhists_desc: "Soutenir la préservation du patrimoine bouddhiste et le travail communautaire. Relève l'opinion bouddhiste, mais peut être vu comme du favoritisme par les hindous."
 RAJ_appease_christians_desc: "Financer le développement communautaire chrétien et traiter les préoccupations de discrimination. Relève l'opinion chrétienne, mais peut être vu comme du favoritisme par les hindous."
 RAJ_appease_muslims_desc: "Investir dans le bien-être de la communauté musulmane et traiter les préoccupations de sécurité. Relève l'opinion musulmane, mais peut être vu comme du favoritisme par les hindous."
 RAJ_naxalite_insurgency: "Grave insurrection naxalite"
 RAJ_naxalite_insurgency_desc: "[RAJ.GetName] connaît une insurrection naxalite-maoïste sévère. Le Couloir rouge est très actif, avec d'importantes opérations de guérilla, de fréquentes embuscades contre les forces de sécurité et un contrôle territorial significatif par les insurgés."
 RAJ_naxalite_insurgency_severe_TT: "§RNiveau d'insurrection sévère§! — présence et opérations de guérilla majeures"
 RAJ_naxalite_insurgency_1: "Insurrection de la Haute Naxalite"
 RAJ_naxalite_insurgency_1_desc: "[RAJ.GetName] affronte une insurrection naxalite très active. Les insurgés maintiennent une forte présence dans les zones rurales avec de fréquentes attaques contre des installations et du personnel gouvernementaux."
 RAJ_naxalite_insurgency_high_TT: "§ONiveau d'insurrection élevé§! — insurrection active avec attaques fréquentes"
 RAJ_naxalite_insurgency_2: "Insurrection naxalite modérée"
 RAJ_naxalite_insurgency_2_desc: "[RAJ.GetName] affronte une insurrection naxalite modérée. Une présence rebelle établie existe avec des incidents périodiques, mais les forces de sécurité conservent le contrôle d'ensemble."
 RAJ_naxalite_insurgency_moderate_TT: "§YNiveau d'insurrection modéré§! — présence établie avec activité périodique"
 RAJ_naxalite_insurgency_3: "Faible insurrection naxalite"
 RAJ_naxalite_insurgency_3_desc: "[RAJ.GetName] a une présence naxalite limitée dans cette région. Des incidents sporadiques se produisent mais l'infrastructure insurgée a été considérablement dégradée."
 RAJ_naxalite_insurgency_weak_TT: "§GNiveau d'insurrection faible§! — présence limitée avec incidents sporadiques"
 RAJ_naxalite_insurgency_4: "Insurrection à faible naxalite"
 RAJ_naxalite_insurgency_4_desc: "[RAJ.GetName] a une activité naxalite minimale dans cette zone. La région est surtout nettoyée, avec seulement des incidents isolés."
 RAJ_naxalite_insurgency_low_TT: "§GFaible niveau d'insurrection§! - Activité minimale, zone en grande partie dégagée"
 RAJ_development_boost: "Initiative de développement active"
 RAJ_development_boost_TT: "§GInitiative de développement§! — vitesse de construction accrue grâce aux programmes de développement du gouvernement"
 RAJ_integrated_development_initiative: "Initiative de développement intégré"
 RAJ_integrated_development_initiative_desc: "Lancer des programmes de développement globaux dans les zones touchées par les naxalites, y compris infrastructure, éducation et santé. Cela s'attaque aux causes profondes de l'insurrection en réduisant les griefs tribaux et en améliorant les conditions locales."
 RAJ_surrender_rehabilitation_program: "Programme de reddition et de réhabilitation"
 RAJ_surrender_rehabilitation_program_desc: "Mettre en œuvre une politique de reddition offrant amnistie et bénéfices de réhabilitation aux naxalites qui déposent les armes. Cela a historiquement été efficace, avec des redditions significatives à la suite de tels programmes."
 RAJ_operation_green_hunt: "Opération Chasse Verte"
 RAJ_operation_green_hunt_desc: "Lancer une offensive paramilitaire coordonnée massive contre les bastions naxalites. Cette opération de grande envergure implique les forces paramilitaires centrales travaillant avec la police des États pour nettoyer et tenir le territoire."
 RAJ_samadhan_doctrine: "Adopter la doctrine SAMADHAN"
 RAJ_samadhan_doctrine_desc: "Mettre en œuvre la doctrine globale SAMADHAN : leadership intelligent, stratégie agressive, motivation et entraînement, renseignement actionnable, indicateurs de performance sur tableau de bord, exploitation de la technologie, plan d'action pour chaque théâtre, et aucun accès au financement."
 RAJ_naxal.10.t: "Formulaires de fusion PWG-MCC CPI (maoïste)"
 RAJ_naxal.10.d: "Le People's War Group et le Maoist Communist Centre ont fusionné pour former le Parti communiste d'Inde (maoïste). Cette unification crée une force insurgée plus redoutable, avec cadres, ressources et contrôle territorial combinés à travers le Couloir rouge."
 RAJ_naxal.10.a: "C'est une grave escalade."
 RAJ_naxal.11.t: "Attaque majeure des Naxalites"
 RAJ_naxal.11.d: "Des insurgés naxalites ont lancé une attaque dévastatrice contre les forces de sécurité. Une embuscade a tué plusieurs personnels et détruit du matériel. L'audace de cette attaque démontre la force continue de l'insurrection."
 RAJ_naxal.11.a: "Nous devons répondre fermement."
 RAJ_naxal.12.t: "Reddition massive des naxalites"
 RAJ_naxal.12.d: "À la suite de notre programme de réhabilitation et d'une pression soutenue, un nombre significatif de cadres naxalites se sont rendus aux autorités. Les anciens insurgés sont traités en vue de leur réintégration dans la société."
 RAJ_naxal.12.a: "Un succès pour notre politique."
 RAJ_naxal.13.t: "Le leadership naxalite éliminé"
 RAJ_naxal.13.d: "Des opérations guidées par le renseignement ont abouti à l'élimination d'un chef naxalite clé. Ce coup porté à la structure de commandement insurgée perturbera leurs opérations et pourra déclencher des disputes internes sur la succession."
 RAJ_naxal.13.a: "Une victoire significative."
 RAJ_naxal.14.t: "Manifestations contre le déplacement tribal"
 RAJ_naxal.14.d: "Des communautés tribales des zones touchées par les naxalites protestent contre les déplacements dus à des projets miniers et industriels. Les naxalites tentent de capitaliser sur ces griefs pour recruter de nouveaux cadres et gagner un soutien populaire."
 RAJ_naxal.14.a: "Ignorer les protestations."
 RAJ_naxal.14.b: "Traiter leurs préoccupations."
 RAJ_naxal.15.t: "L’opération Green Hunt se termine"
 RAJ_naxal.15.d: "L'offensive paramilitaire coordonnée a obtenu des résultats significatifs. Les positions naxalites dans plusieurs États ont été dégradées, leurs lignes de ravitaillement perturbées, et plusieurs bastions nettoyés. L'insurrection a été affaiblie."
 RAJ_naxal.15.a: "Maintenir la pression."
 RAJ_naxal.16.t: "Inde sans Naxal"
 RAJ_naxal.16.d: "Après des années d'effort soutenu, l'Inde a effectivement éliminé l'insurrection naxalite-maoïste. Le Couloir rouge ne pose plus de menace significative. Le développement a atteint les zones tribales, et les anciens insurgés ont été réhabilités. C'est un accomplissement historique en matière de sécurité intérieure."
 RAJ_naxal.16.a: "Une nouvelle ère commence."
 RAJ_operation_green_hunt_active: "Opération Chasse Verte Active"
 RAJ_operation_green_hunt_active_desc: "Une offensive paramilitaire coordonnée massive est en cours contre les bastions naxalites. Les forces de sécurité nettoient et tiennent le territoire à travers le Couloir rouge."
 RAJ_samadhan_doctrine_idea: "Doctrine SAMADHAN"
 RAJ_samadhan_doctrine_idea_desc: "La stratégie globale de contre-insurrection combinant leadership intelligent, opérations agressives, renseignement actionnable et exploitation de la technologie a été adoptée."
 RAJ_naxal_free_india: "Inde sans Naxal"
 RAJ_naxal_free_india_desc: "L'Inde a réussi à éliminer l'insurrection naxalite-maoïste. Le Couloir rouge a été sécurisé, et le développement a atteint les zones tribales auparavant touchées."
 RAJ_salwa_judum_active: "Salwa Judum Actif"
 RAJ_salwa_judum_active_desc: "Le controversé programme de milice civile Salwa Judum (« Marche de la paix » ou « Chasse de purification ») opère activement au Chhattisgarh. Efficace pour réprimer les maoïstes, il a attiré des critiques pour des violations des droits de l'homme."
 RAJ_counter_insurgency_operations: "Opérations anti-insurrectionnelles"
 RAJ_counter_insurgency_operations_desc: "Lancer une campagne globale de contre-insurrection contre les bastions naxalites à travers le Couloir rouge. Cela impliquera des opérations militaires coordonnées, du recueil de renseignement et des stratégies de domination de zone."
 RAJ_reduce_naxalite_level_tt: "Réduire le niveau d'insurrection naxalite de 1 dans cet État"
 RAJ_naxal.17.t: "Embuscade de Dantewada"
 RAJ_naxal.17.d: "Le 6 avril 2010, des naxalites ont tendu une embuscade à une compagnie de personnel du CRPF dans le district de Dantewada au Chhattisgarh. L'attaque a fait 76 personnels de sécurité tués, l'une des attaques uniques les plus meurtrières de l'histoire de l'insurrection. Les maoïstes ont utilisé des IED et des armes automatiques dans un assaut bien coordonné qui a duré plusieurs heures."
 RAJ_naxal.17.a: "C'est une tragédie nationale"
 RAJ_naxal.18.t: "Attaque de Sukma"
 RAJ_naxal.18.d: "Le 24 avril 2017, des naxalites ont lancé une embuscade dévastatrice contre du personnel du CRPF dans le district de Sukma au Chhattisgarh. 25 personnels de sécurité ont été tués. Les maoïstes continuent de démontrer leur capacité à frapper malgré des années d'opérations de contre-insurrection."
 RAJ_naxal.18.a: "Nous ne serons pas dissuadés"
 RAJ_salwa_judum: "Initier Salwa Judum"
 RAJ_salwa_judum_desc: "Salwa Judum (« Marche de la paix » ou « Chasse de purification ») est une milice anti-naxalite controversée soutenue par le gouvernement d'État du Chhattisgarh. Efficace en contre-insurrection, elle a subi de sévères critiques pour des abus des droits de l'homme et a finalement été déclarée inconstitutionnelle par la Cour suprême en 2011."
 RAJ_road_connectivity_program: "Connectivité routière du Corridor Rouge"
 RAJ_road_connectivity_program_desc: "Améliorer l'infrastructure routière dans les zones touchées par les naxalites. Une meilleure connectivité réduit l'influence maoïste en amenant les services de l'État dans les zones tribales reculées et en rendant plus difficile l'opération des insurgés."
 RAJ_MAO_rebellion_desc: "Une insurrection naxalite sévère et un soutien communiste croissant ont enhardi les cellules maoïstes à organiser des manifestations de masse contre le gouvernement. Si leur influence n'est pas limitée, une rébellion armée suivra."
 RAJ_bolywood_idea_desc: "L'industrie cinématographique indienne, centrée à Mumbai, est la plus grande du monde par le volume. Sa portée culturelle s'étend à travers l'Asie du Sud, le Moyen-Orient et la diaspora indienne mondiale, servant de puissant véhicule de projection de soft power."
 RAJ_settle_gujarat_unrest: "Régler les troubles au Gujarat"
 RAJ_settle_gujarat_unrest_desc: "Diriger des ressources de l'État pour désamorcer les tensions communautaires au Gujarat et rétablir l'ordre, sans attendre un gouvernement particulier à Delhi. Cela élève l'opinion hindoue et musulmane. Une fois les deux rétablies à 35 ou plus, les troubles du Gujarat se lèvent d'eux-mêmes, et maintenir leur opinion plus haute garde la région calme."
 RAJ_kashmir_unrest: "Troubles au Cachemire"
 RAJ_kashmir_unrest_desc: "Le Cachemire reste agité tant que sa majorité musulmane se sent aliénée de Delhi. Tant que leurs griefs ne sont pas traités, les opérations de sécurité sapent le moral et la stabilité dans toute la vallée. Élever l'opinion musulmane via la décision d'apaisement, le dialogue interconfessionnel et les focalisations régionales au-dessus de 35 lève ces troubles."
 RAJ_punjab_unrest: "Troubles au Pendjab"
 RAJ_punjab_unrest_desc: "Le ressentiment sikh persistant tient le Pendjab sur le qui-vive, drainant capital politique et stabilité. Régler les préoccupations de la communauté est le seul chemin vers le calme. Élever l'opinion sikhe via la décision d'apaisement, le dialogue interconfessionnel et les focalisations régionales au-dessus de 35 lève ces troubles."
 RAJ_bengal_unrest: "Agitation au Bengale"
 RAJ_bengal_unrest_desc: "Les frictions communautaires avec la population musulmane du Bengale perturbent l'industrie et l'ordre de la région. Les troubles persistent jusqu'à ce que leur foi soit réconciliée avec l'État. Élever l'opinion musulmane via la décision d'apaisement, le dialogue interconfessionnel et les focalisations régionales au-dessus de 35 lève ces troubles."
 RAJ_northeast_unrest: "Troubles du nord-est"
 RAJ_northeast_unrest_desc: "Les communautés chrétiennes du Nord-Est se méfient du gouvernement central, alimentant le sentiment séparatiste. Recrutement et stabilité souffrent jusqu'à l'apaisement de leurs griefs. Élever l'opinion chrétienne via la décision d'apaisement, le dialogue interconfessionnel et les focalisations régionales au-dessus de 35 lève ces troubles."
 RAJ_new_army_idea_desc: "Un programme de modernisation global a restructuré les forces armées indiennes autour de nouveaux principes doctrinaux, améliorant les filières de recrutement, la coordination opérationnelle et la préparation au combat dans toutes les armes."
 RAJ_BRICS_desc: "L'adhésion aux BRICS ouvre des liens commerciaux et politiques avec le bloc, accélérant une coopération de recherche modeste et donnant aux négociateurs indiens une main plus forte à la table avec les autres membres."
 RAJ_BRICS_associate: "Associé BRICS"
 RAJ_BRICS_associate_desc: "Le statut d'associé lie la nation au commerce et à la recherche des BRICS sans adhésion pleine, accordant des bénéfices réduits du bloc tout en laissant la porte ouverte à une promotion."
 RAJ_BRICS_observer: "Observateur des BRICS"
 RAJ_BRICS_observer_desc: "Le statut d'observateur maintient la nation engagée dans la diplomatie des BRICS et réchauffe ses relations commerciales avec le bloc, un premier pas vers une intégration plus profonde."
 RAJ_brics_leadership_TT: "En tant que leader des BRICS, l'Inde tire une influence politique et une bienveillance commerciale qui croît à mesure que davantage de nations rejoignent le bloc."
 RAJ_BRICS_bank_desc: "La Nouvelle banque de développement canalise les prêts des États membres vers des projets stratégiques de ressources et d'industrie, relevant les rendements locaux et la production des usines. Le coût est l'exposition : des puissances étrangères gagnent un levier sur nos décisions financières."
 RAJ_BRICS_cur_desc: "Coordonner la politique monétaire avec le bloc réduit nos coûts de financement et améliore les termes commerciaux avec les membres, mais la dépense initiale de restructuration de nos cycles économiques est élevée et le nouvel arrangement augmente les coûts continus de mise à niveau des cycles."
 RAJ_steady_elephant: "L'éléphant inébranlable"
 RAJ_steady_elephant_desc: "L'Inde doit avancer avec le poids délibéré et imparable d'un éléphant : patiente, inamovible quand elle est défiée, et décisive une fois réveillée. Un État fort et indépendant exige cet idéal de caractère national."
 RAJ_iri_fake_ns2_desc: "Les audits d'approvisionnement et une refonte partielle du ministère de la Défense commencent à porter. La capacité gaspillée et les coûts de conversion gonflés restent lourds, mais le pire des distorsions de l'ère du License Raj commence à s'atténuer."
 RAJ_iri_fake_ns3_desc: "Les réformes ont assez coupé dans la bureaucratie pour que les usines de défense tournent à une efficacité acceptable. La conversion des lignes civiles n'est plus prohibitivement chère, bien que des poches de clientélisme distordent encore les résultats."
 RAJ_iri_fake_ns4_desc: "Un régime d'approvisionnement moderne, des marchés transparents et une lutte anticorruption sérieuse ont fait de l'industrie de défense un secteur compétitif. Les inefficacités sont désormais gérables plutôt que paralysantes."
 RAJ_re_fake_militar2_desc: "Des chaînes de commandement restructurées et des outils de coordination modernisés ont stabilisé une grande part de la force. L'enracinement défensif et la discipline de mouvement s'améliorent, même si l'organisation sous le feu reste en retrait des armées homologues."
 RAJ_re_fake_militar3_desc: "Les réformes doctrinales et l'intégration de l'état-major interarmées ont largement refermé l'écart avec les militaries comparables. La plupart des unités opèrent désormais avec une cohésion prévisible sur le terrain."
 RAJ_re_fake_militar4_desc: "Une génération de professionnalisation a payé. Les forces indiennes opèrent désormais avec une coordination moderne, une manœuvre disciplinée et la doctrine d'enracinement d'une armée de premier rang."
 RAJ_industrial_expansion: "Expansion industrielle"
 RAJ_industrial_expansion_desc: "Investir dans l'industrie lourde et la capacité de fabrication modernisera notre économie et créera des emplois à travers la nation."
 RAJ_agrarian_society_desc: "Renforcer notre secteur agricole assure la sécurité alimentaire et soutient les communautés rurales qui forment l'épine dorsale de notre nation."
 RAJ_expanding_at_calcutta: "Expansion à Calcutta"
 RAJ_expanding_at_calcutta_desc: "Avec l'augmentation de la population, nous sommes confrontés au fait que Calcutta doit s'étendre. Nous nous inspirons des politiques d'expansion permanente observées dans d'autres grandes villes."
 RAJ_standard_rationing: "Rationnement standard et réforme agraire"
 RAJ_standard_rationing_desc: "Les réformes du rationnement des terres et de l'alimentation modernisent l'agriculture tout en ébranlant les structures de pouvoir traditionnelles."
 RAJ_indian_air_force: "Force aérienne indienne"
 RAJ_indian_air_force_desc: "Moderniser l'armée de l'air indienne et étendre son entraînement au combat, en formant les équipages expérimentés nécessaires pour commander notre espace aérien."
 RAJ_NAJA_idea_1_desc: "Forces paramilitaires et de police équipées d'armes et d'entraînement de grade militaire, déployées pour maintenir la sécurité intérieure et contrer les menaces insurgées dans les régions sujettes au conflit."
 RAJ_network_centric_warfare: "Guerre centrée sur les réseaux"
 RAJ_network_centric_warfare_desc: "La guerre centrée sur le réseau, aussi appelée opérations centrées sur le réseau, est une doctrine militaire ou théorie de la guerre qui vise à traduire un avantage informationnel, rendu possible en partie par les technologies de l'information, en avantage compétitif via la mise en réseau informatique de forces dispersées."
 RAJ_interfaith_dialogue: "Convoquer un dialogue interreligieux"
 RAJ_interfaith_dialogue_desc: "Financer un programme national de réconciliation durable qui réunit toutes les confessions à la même table. Élève l'opinion de toutes les communautés à la fois sans qu'aucun groupe ne reste rancunier, mais l'effort est lent et pèse lourdement sur le Trésor."
 RAJ_religion_conflict_musl_hindu_title: "La violence entre hindous et musulmans éclate"
 RAJ_religion_conflict_musl_hindu_desc: "Dans l'une des plus grandes et plus denses villes, un groupe d'hindous et de musulmans a commencé à se battre pour un différend inconnu. Ce que l'on sait, c'est que les deux camps s'entre-déchirent activement, et cela pèse sérieusement sur la police locale."
 RAJ_religion_conflict_musl_christ_title: "Musulmans et chrétiens en désaccord"
 RAJ_religion_conflict_musl_christ_desc: "Un groupe de musulmans et de chrétiens s'opposent aujourd'hui autour de la construction d'une église près d'une mosquée. Chaque camp affirme que l'autre devrait déplacer son lieu de culte ailleurs dans la ville, et il y a même eu des rapports d'escarmouches dans toute la ville."
 RAJ_religion_conflict_hindu_christ_title: "Hindous et chrétiens s'affrontent"
 RAJ_religion_conflict_hindu_christ_desc: "Ce matin, un groupe d'hindous a été outré par un chrétien qui a insulté un hindou qu'il tentait de convertir. L'incident a dégénéré en combats ouverts entre les deux groupes, plusieurs bâtiments ayant été incendiés."
 RAJ_religion_conflict_back_hindu: "Soutenir les hindous"
 RAJ_religion_conflict_back_muslim: "Soutenir les musulmans"
 RAJ_religion_conflict_back_christian: "Soutenir les chrétiens"
 RAJ_religion_conflict_resolve: "Trouver une solution qui satisfasse les deux camps"
 RAJ_drdo_idea_desc: "L'Organisation de recherche et développement pour la défense canalise la R&D indigène vers les forces armées, accélérant la recherche militaire, réduisant le coût de conversion de la capacité civile en production militaire, et poussant l'IA à favoriser les avancées militaires."
 RAJ_indian_national_congress_desc: "Le Congrès national indien est une force dominante de la politique indienne depuis l'indépendance. Renforcer l'appareil du parti consolidera la gouvernance démocratique."
 RAJ_indian_socialism_idea_desc: "L'héritage d'économie mixte de Nehru pilote une forte direction étatique de la production industrielle, de l'armement et des infrastructures. Le débit des usines s'envole, mais la cohésion sociale souffre sous la rigidité du permit-raj."
 RAJ_scandinavian_model_idea_desc: "Des modèles de politique sociale-démocrate importés réduisent les coûts d'éducation et stabilisent l'ordre politique, au prix d'une bureaucratie gonflée et d'une humeur publique plus calme, moins militarisée."
 RAJ_true_social_democracy_idea_desc: "Un règlement mature d'État-providence réduit les coûts sociaux et de santé, relevant le soutien de guerre par une compétence étatique visible. Les coûts de personnel montent et la stabilité politique fléchit légèrement sous la charge redistributive."
 RAJ_new_democratic_india_idea_desc: "Un engagement réaffirmé envers les normes démocratiques relève la stabilité, accélère la génération de pouvoir politique et renforce la dérive démocratique de l'opinion intérieure."
 RAJ_vietnamese_intervention: "Remettre en question l'indépendance du Vietnam"
 RAJ_demand_singapore: "Exigez Singapour"
 RAJ_demand_singapore_desc: "Notre position régionale assurée, le moment est venu de faire valoir notre revendication historique sur Singapour et d'amener la cité-État dans notre sphère."
 RAJ_arms_export_economy: "Économie d'exportation d'armements"
 RAJ_brics_leadership: "Leadership des BRICS"
 RAJ_religious_climate: "Climat religieux"
 RAJ_country_has_any_naxalite_states: "Un État en Inde a une présence naxalite active"
 RAJ_has_severe_naxalite_states_trigger: "Un État en Inde a une présence naxalite sévère"
 RAJ_state_has_any_naxalite: "Cet État a une présence naxalite active"
 RAJ_country_has_any_naxalite_states_TT: "N'importe quel État a une présence naxalite active"
 RAJ_has_severe_naxalite_states_trigger_TT: "N'importe quel État a une présence naxalite sévère active"
 RAJ_hindu_discontent: "Mécontentement hindou"
 RAJ_hindu_discontent_desc: "La majorité hindoue se montre de plus en plus insatisfaite des politiques du gouvernement. En tant que plus grand groupe démographique, son mécontentement menace la stabilité politique et érode la base de soutien du gouvernement. Élever l'opinion hindoue au-dessus de §Y35§! y met fin."
 RAJ_religious_harmony: "Harmonie religieuse"
 RAJ_religious_harmony_desc: "Toutes les grandes communautés religieuses d'Inde ont une opinion favorable du gouvernement. Cette harmonie interconfessionnelle renforce l'unité nationale et attire l'investissement. Maintenue tant que chaque confession se situe au-dessus de §Y74§!."
 RAJ_religious_climate_TT: "§YClimat religieux§! : la stabilité et le pouvoir politique évoluent avec l'opinion moyenne des cinq confessions. Chaque point au-dessus de §Y50§! vaut §G+0,4 %§! à chacun, chaque point en dessous coûte autant, plafonné à §G+10 %§! et §R-10 %§!."
 RAJ_settle_gujarat_unrest_TT: "L'opinion §Ymusulmane§! de [RAJ.GetNameWithFlag] est supérieure à 50"
 RAJ_maoist_suppression: "Traquer les maoïstes en [FROM.GetName]"
 RAJ_suppression_failed_tt: "§RLe raid a échoué.§! Les sympathisants maoïstes se rassemblent autour de l'opération ratée, augmentant le soutien communiste."
 RAJ_delhi_caliphate: "Déclarer le califat de Delhi"
 RAJ_delhi_caliphate_desc: "Le mouvement salafiste s'empare de l'appareil d'État et proclame un califat dirigé depuis Delhi, mettant fin à la république constitutionnelle et liant le nouveau gouvernement à la loi islamique."
 RAJ_iran_doctrinal_dispute: "Affronter la doctrine iranienne"
 RAJ_iran_doctrinal_dispute_desc: "La doctrine révolutionnaire chiite de Téhéran est une rivale idéologique directe du projet salafiste sunnite. Affronter l'influence régionale de l'Iran est désormais une priorité stratégique."
 RAJ_MAO_rebellion_armed: "Conflit armé imminent"
 RAJ_MAO_rebellion_armed_desc: "L'insurrection maoïste a dépassé les manifestations. Des cellules armées se mobilisent pour une guerre ouverte contre le gouvernement. Si on les laisse faire, la guerre civile est inévitable."
 RAJ_central_asian_revolution: "Révolution salafiste en [FROM.GetName]"
 RAJ_central_asian_revolution_desc: "Les conditions en [FROM.GetNameDefCap] sont mûres pour un soulèvement salafiste. Canaliser notre influence dans le mouvement fasciste local et déclencher une révolution armée pour amener le pays dans notre sphère."
 RAJ_BRICS_polit_alliance_faction_warning_tt: "§RAvertissement :§! cela §Rdémantèlera votre faction existante§! et la remplacera par une nouvelle faction BRICS. Tous les membres non-BRICS que vous avez invités seront §Rrejetés§!."
 RAJ_arms_export_economy_TT: "§YÉconomies d'échelle à l'exportation d'armes§!\nChaque partenaire d'exportation distinct relève la §Gcapacité industrielle§! à mesure que l'industrie d'armement s'étend : §G+1 %§! de production d'usines par partenaire."
 RAJ_energy_idea_desc: "L'investissement dans le nucléaire civil intérieur élargit la capacité de production et réduit notre dépendance au carburant importé."
 RAJ_207_sd_idea_desc: "La Tata Indica, première voiture particulière entièrement indigène de l'Inde, ancre un secteur automobile intérieur qui accélère la construction de bâtiments et la montée en régime des usines, génère des recettes d'impôt sur les sociétés, et donne un modeste coup de pouce à la stabilité politique et à la croissance démographique."
 RAJ_network_improvement_idea_desc: "Les mises à niveau de l'infrastructure nationale de télécoms accélèrent le déploiement des réseaux numériques à travers le pays."
 RAJ_socdem_stability_factor: "Facteur de stabilité"
 RAJ_Local_markets_desc: "Bazars intérieurs et commerce de rue prospèrent, accélérant la construction de petits bâtiments à travers le pays."
 TT_RAJ_LOCAL_MARKETS_MODIFIER: "§YRevenu supplémentaire§! : $§G0.080§!"
 indian_event.61.t: "Attentats à la bombe dans un train à Mumbai"
 indian_event.61.d: "Le 11 juillet 2006, une série de sept explosions coordonnées a déchiré le réseau ferroviaire de banlieue de Mumbai à l'heure de pointe du soir, tuant 209 personnes et en blessant plus de 700. Les attaques, menées par le Lashkar-e-Taiba avec un soutien local, visaient l'artère vitale de la ville et ont envoyé des ondes de choc à travers la nation."
 indian_event.61.a: "C'est un acte de guerre."
 RAJ_naxal.19.t: "Embuscade dans la vallée de Darbha"
 RAJ_naxal.19.d: "Le 25 mai 2013, des insurgés naxalites ont tendu une embuscade à un convoi du Congrès national indien dans la vallée de Darbha au Chhattisgarh, tuant 27 personnes dont des dirigeants d'État seniors et leur escorte. L'attaque a exposé des lacunes critiques du renseignement et de la sécurité des itinéraires dans le Couloir rouge."
 RAJ_naxal.19.a: "L'insurrection doit être écrasée."
 indian_event.62.t: "Attaque de la base d'Uri"
 indian_event.62.d: "Le 18 septembre 2016, quatre militants ont attaqué le quartier général d'une brigade de l'armée indienne près d'Uri au Jammu-et-Cachemire, tuant 19 soldats et en blessant 30 autres. L'attaque, l'une des plus meurtrières contre les forces de sécurité au Cachemire, a déclenché de vastes appels à des représailles."
 indian_event.62.a: "Ils paieront pour cela."
 indian_event.63.t: "Démonétisation annoncée"
 indian_event.63.d: "Le 8 novembre 2016, le gouvernement a brutalement annoncé la démonétisation des billets de 500 et 1 000 roupies, rendant 86 % de la monnaie du pays invalide du jour au lendemain. Destinée à circonscrire l'argent noir et la fausse monnaie, la mesure a causé une perturbation massive de la vie quotidienne et de l'économie informelle."
 indian_event.63.a: "Un sacrifice nécessaire."
 RAJ_eastas.6.t: "L'impasse de Doklam"
 RAJ_eastas.6.d: "En juin 2017, troupes indiennes et chinoises se sont enfermées dans une confrontation de 73 jours au tripoint de Doklam près du Bhoutan. Les tentatives chinoises d'étendre une route en territoire contesté ont été bloquées par les forces indiennes, amenant les deux puissances nucléaires au bord d'un conflit armé dans l'Himalaya."
 RAJ_eastas.6.a: "Nous ne céderons pas un pouce."
 indian_event.64.t: "Attaque terroriste de Pulwama"
 indian_event.64.d: "Le 14 février 2019, un kamikaze du Jaish-e-Mohammed a foncé avec un véhicule chargé d'explosifs dans un convoi du CRPF près de Pulwama au Cachemire, tuant 40 personnels. L'attentat le plus meurtrier contre les forces de sécurité depuis des décennies a déclenché une crise nationale et des exigences de représailles."
 indian_event.64.a: "Le sang appelle le sang."
 indian_event.65.t: "Article 370 abrogé"
 indian_event.65.d: "Le 5 août 2019, le gouvernement a abrogé l'article 370 de la Constitution, dépouillant le Jammu-et-Cachemire de son statut d'autonomie spécial et scindant l'État en deux territoires de l'Union. La mesure, accompagnée d'un confinement sécuritaire et d'un black-out des communications, a attiré à la fois des louanges intérieures et une préoccupation internationale."
 indian_event.65.a: "Le Cachemire est pleinement intégré."
 indian_event.66.t: "Les manifestations de la CAA éclatent"
 indian_event.66.d: "En décembre 2019, de vastes protestations ont éclaté à travers le pays contre la loi d'amendement de la citoyenneté, qui accorde la citoyenneté aux réfugiés non musulmans des pays voisins mais exclut les musulmans. Les manifestants arguent que la loi viole les principes laïcs de la Constitution."
 indian_event.66.a: "Nous devons écouter le peuple."
 RAJ_eastas.7.t: "Affrontement de la vallée de Galwan"
 RAJ_eastas.7.d: "Le 15 juin 2020, troupes indiennes et chinoises se sont engagées dans un combat au corps à corps brutal dans la vallée de Galwan au Ladakh, entraînant la mort de 20 soldats indiens et d'un nombre inconnu de victimes chinoises. L'affrontement marque la première confrontation frontalière mortelle entre les deux pays depuis 1975."
 RAJ_eastas.7.a: "Nous honorerons leur sacrifice."
 RAJ_naxal.20.t: "Embuscade à Bijapur"
 RAJ_naxal.20.d: "Le 3 avril 2021, des insurgés naxalites ont tendu une embuscade aux forces de sécurité dans le district de Bijapur au Chhattisgarh, tuant 22 personnels dans l'une des attaques les plus meurtrières de ces dernières années. L'incident souligne la menace persistante dans le Couloir rouge malgré des années d'opérations de contre-insurrection."
 RAJ_naxal.20.a: "Ils ne briseront pas notre résolution."
 RAJ_naxal.21.t: "La Cour suprême annule Salwa Judum"
 RAJ_naxal.21.d: "Le 5 juillet 2011, la Cour suprême de l'Inde a jugé le Salwa Judum inconstitutionnel, ordonnant le désarmement immédiat de la milice tribale sponsorisée par l'État. La cour a estimé qu'armer des civils mal formés pour combattre les maoïstes violait les droits fondamentaux et alimentait le cycle de violence qu'il était censé réprimer. Critiques intérieurs et organismes internationaux des droits de l'homme observent New Delhi de près."
 RAJ_naxal.21.a: "Nous nous conformerons à l'arrêt."
 RAJ_human_rights_scrutiny: "Contrôle des droits de l'homme"
 RAJ_human_rights_scrutiny_desc: "Organisations internationales des droits et presse intérieure scrutent la conduite de la contre-insurrection. Stabilité et capital politique en pâtissent, et les services de renseignement étrangers trouvent l'Inde une cible plus molle tant que le projecteur est allumé."
 indian_event.67.t: "Le Manipour sombre dans la violence"
 indian_event.67.d: "En mai 2023, la violence ethnique a explosé au Manipur entre les communautés meitei et kuki, déclenchant des mois d'affrontements, d'incendies et de déplacements. La crise, enracinée dans les droits fonciers, le statut de réservation et les lignes de faille religieuses, a exposé de profondes fractures dans l'État du Nord-Est."
 indian_event.67.a: "Nous devons rétablir l'ordre."
 RAJ_regional.1.t: "Grève transfrontalière"
 RAJ_regional.1.d: "Le 9 juin 2015, l'armée indienne a lancé des frappes chirurgicales de l'autre côté de la frontière birmane, détruisant des camps du NSCN-K responsables d'une embuscade qui avait tué 18 soldats dans le district de Chandel au Manipur. L'opération marque la première frappe transfrontalière reconnue de l'Inde contre des sanctuaires insurgés."
 RAJ_regional.1.a: "Ils l’avaient prévu."
 RAJ_regional.2.t: "Échange d'enclaves avec le Bangladesh"
 RAJ_regional.2.d: "Le 6 juin 2015, l'Inde et le Bangladesh ont échangé 162 enclaves dans un accord historique mettant fin à un différend frontalier de 68 ans. Plus de 50 000 résidents apatrides recevront enfin la citoyenneté."
 RAJ_regional.2.a: "Une journée historique."
 RAJ_regional.3.t: "La crise des Rohingyas atteint l'Inde"
 RAJ_regional.3.d: "En août 2017, la répression de l'armée birmane a poussé plus de 700 000 Rohingyas de l'autre côté de la frontière au Bangladesh. L'Inde accueille 40 000 réfugiés rohingyas, et le gouvernement doit décider s'il les abrite ou les expulse."
 RAJ_regional.3.a: "Les expulser tous."
 RAJ_regional.3.b: "Accordez-leur un refuge."
 RAJ_regional.4.t: "Les pourparlers de Teesta échouent"
 RAJ_regional.4.d: "En avril 2017, la Première ministre bangladaise Hasina est arrivée à New Delhi en espérant finaliser un accord sur le partage des eaux de la Teesta. Le ministre en chef du Bengale-Occidental a une fois de plus bloqué l'accord, laissant Dacca les mains vides."
 RAJ_regional.4.a: "Passer outre l’opposition de l’État."
 RAJ_regional.4.b: "La politique intérieure passe avant tout."
 RAJ_regional.5.t: "Le CNRC exclut des millions"
 RAJ_regional.5.d: "En août 2019, le registre national des citoyens final en Assam a exclu 1,9 million de personnes, pour la plupart des musulmans bengalis. Combiné à la loi d'amendement de la citoyenneté, la mesure a déclenché des protestations nationales et une réponse furieuse de Dacca."
 RAJ_regional.5.a: "La sécurité nationale l'exige."
 RAJ_regional.6.t: "Campagne référendaire au Khalistan"
 RAJ_regional.6.d: "En 2020, l'organisation interdite Sikhs for Justice a lancé un référendum d'indépendance mondial non contraignant, attirant de fortes participations parmi la diaspora sikhe. Le mouvement alimente le sentiment séparatiste au pays malgré la répression du gouvernement."
 RAJ_regional.6.a: "Écraser ce mouvement."
 RAJ_regional.7.t: "Des réfugiés birmans inondent la frontière"
 RAJ_regional.7.d: "Après le coup d'État militaire de février 2021 au Myanmar, des milliers de réfugiés chin ont franchi vers le Mizoram et le Manipur. Le gouvernement central a ordonné aux États de les refouler, mais le ministre en chef du Mizoram défie ouvertement New Delhi."
 RAJ_regional.7.a: "Sceller la frontière."
 RAJ_regional.7.b: "Laissez-les passer."
 RAJ_regional.8.t: "Cadre de paix naga signé"
 RAJ_regional.8.d: "Le 3 août 2015, le gouvernement a signé un accord-cadre avec le NSCN-IM après 18 ans de négociations. L'accord promet une résolution à l'une des plus anciennes insurrections d'Asie et un nouveau chapitre pour le Nord-Est."
 RAJ_regional.8.a: "Un pas vers une paix durable."
 RAJ_regional.9.t: "Contrebande d'armes transfrontalière"
 RAJ_regional.9.d: "Le renseignement a découvert un pipeline d'armes actif allant du Myanmar vers le Couloir rouge du Nord-Est. Une opération conjointe avec le Myanmar pourrait le fermer, mais elle exige des ressources et du capital diplomatique."
 RAJ_regional.9.a: "Lancez une opération conjointe."
 RAJ_regional.9.b: "Nous ne pouvons pas épargner les ressources."
 RAJ_regional.10.t: "Crise d'assassinat de Nijjar"
 RAJ_regional.10.d: "En juin 2023, le leader khalistanais Hardeep Singh Nijjar a été assassiné en Colombie-Britannique. Le Premier ministre canadien a publiquement accusé l'Inde d'avoir orchestré le meurtre, déclenchant la pire crise diplomatique entre les deux pays depuis des décennies."
 RAJ_regional.10.a: "Expulser leurs diplomates."
 RAJ_regional.11.t: "Exercices navals dans le golfe du Bengale"
 RAJ_regional.11.d: "En 2014, l'Inde a élargi la coopération maritime avec le Bangladesh et le Myanmar via le cadre BIMSTEC, menant des patrouilles conjointes et offrant des corvettes aux deux marines. L'initiative ancre l'Inde comme puissance navale dominante dans le golfe du Bengale."
 RAJ_regional.11.a: "Projeter la puissance dans nos eaux."
 RAJ_regional.12.t: "Meurtres à la frontière du BSF"
 RAJ_regional.12.d: "La Force de sécurité frontalière indienne a de nouveau été accusée d'avoir tué des civils bangladais le long de la frontière. Dacca a déposé une protestation formelle et des groupes de droits de l'homme appellent à des comptes."
 RAJ_regional.12.a: "Ordonnez la retenue."
 RAJ_regional.12.b: "La frontière doit être tenue."
 RAJ_regional.13.t: "Blocus de la frontière népalaise"
 RAJ_regional.13.d: "En septembre 2015, après l'adoption par le Népal d'une nouvelle constitution qui marginalise la minorité madhesi, l'Inde a restreint les livraisons de carburant et de ravitaillement à travers la frontière. Le Népal affronte une crise humanitaire alors que l'hiver approche et que la Chine offre des routes d'approvisionnement alternatives."
 RAJ_regional.13.a: "Resserrer le blocus."
 RAJ_regional.13.b: "Assouplir les restrictions."
 RAJ_regional.13.c: "Lever le blocus."
 RAJ_regional.14.t: "Le Népal se tourne vers la Chine"
 RAJ_regional.14.d: "Des mois de ravitaillement restreint ont dévasté l'économie népalaise. Katmandou a signé de nouveaux accords de commerce et de transit avec Pékin, un virage dramatique pour un pays longtemps dans l'orbite indienne. Le blocus est devenu un conte cautionnaire de l'excès."
 RAJ_regional.14.a: "Le mal est fait."
 RAJ_regional.14.b: "Tendez une branche d'olivier."
 RAJ_regional.14.c: "Notre retenue a payé."
 RAJ_regional.15.t: "Différend frontalier de Kalapani"
 RAJ_regional.15.d: "En mai 2020, le parlement népalais a voté à l'unanimité un amendement constitutionnel revendiquant Kalapani, Lipulekh et Limpiyadhura. Le tripoint contesté se situe à la frontière Inde-Népal-Chine, et des déploiements de troupes pourraient faire monter les tensions sur toute la frontière himalayenne."
 RAJ_regional.15.a: "Renforcer nos positions."
 RAJ_regional.15.b: "Proposer des négociations."
 RAJ_regional.15.c: "Acceptez une enquête conjointe."
 RAJ_regional.16.t: "Traité de 1950 en révision"
 RAJ_regional.16.d: "Le Népal a formellement proposé de réviser le traité de paix et d'amitié de 1950, le qualifiant de relique inégale. Le traité sous-tend l'influence indienne sur la politique étrangère et de défense du Népal, et une renégociation pourrait remodeler la relation bilatérale."
 RAJ_regional.16.a: "Moderniser le partenariat."
 RAJ_regional.16.b: "Le traité reste."
 RAJ_regional.17.t: "Le Bhoutan remercie l’Inde"
 RAJ_regional.17.d: "Après la résolution de la confrontation de Doklam, le Bhoutan a privéement exprimé une profonde gratitude pour la volonté de l'Inde d'affronter la Chine sur son territoire souverain. Thimphou est avide de formaliser des liens de défense plus forts."
 RAJ_regional.17.a: "Approfondir l'alliance."
 RAJ_regional.17.b: "Une poignée de main suffit."
 RAJ_regional.18.t: "Expansion hydroélectrique du Bhoutan"
 RAJ_regional.18.d: "Le projet hydroélectrique de Mangdechhu a été mis en service, ajoutant 720 MW de capacité. L'Inde finance et construit les barrages du Bhoutan et achète l'électricité excédentaire, ancrant l'un des partenariats les plus déséquilibrés mais stables d'Asie du Sud."
 RAJ_regional.18.a: "Élargir le partenariat."
 RAJ_regional.18.b: "Nous avons assez d'engagements."
 RAJ_regional.19.t: "Le Bhoutan adopte la démocratie"
 RAJ_regional.19.d: "En mars 2008, le roi Jigme Singye Wangchuck a supervisé la transition pacifique du Bhoutan de la monarchie absolue à la démocratie constitutionnelle. Les premières élections se sont tenues sans incident. L'allié le plus proche de l'Inde entre dans une ère nouvelle."
 RAJ_regional.19.a: "Les accueillir dans la démocratie."
 RAJ_regional.19.b: "Une monarchie, c'était plus simple."
 RAJ_regional.20.t: "Le blocus de l'Inde"
 RAJ_regional.20.d: "La fermeture indienne des passages frontaliers a laissé le Népal critiquement à court de carburant, de médicaments et de gaz de cuisson. Pékin a offert des ravitaillements d'urgence et des droits de transit via le Tibet. Katmandou affronte un choix brutal entre fierté et pragmatisme."
 RAJ_regional.20.a: "Acceptez l'offre de la Chine."
 RAJ_regional.20.b: "Endurer et négocier."
 RAJ_regional.21.t: "Ottawa exige des comptes"
 RAJ_regional.21.d: "Le Canada a formellement accusé l'Inde d'implication dans l'assassinat du leader sikh Hardeep Singh Nijjar sur le sol canadien. Ottawa pèse son prochain mouvement alors que l'impasse diplomatique menace le commerce bilatéral et la vaste diaspora indo-canadienne."
 RAJ_regional.21.a: "Expulsez les diplomates indiens."
 RAJ_regional.21.b: "Poursuivre une résolution diplomatique."
 RAJ_regional.22.t: "Dacca condamne les expulsions de Rohingyas"
 RAJ_regional.22.d: "L'Inde a commencé à déporter des réfugiés rohingyas vers le Myanmar, attirant une vive condamnation de Dacca. Le Bangladesh, déjà submergé par plus d'un million de réfugiés du Myanmar, a qualifié le geste de trahison des obligations humanitaires partagées."
 RAJ_regional.22.a: "Condamner la décision de New Delhi."
 RAJ_regional.23.t: "Dhaka salue la solidarité de l'Inde"
 RAJ_regional.23.d: "La décision de l'Inde d'abriter des réfugiés rohingyas plutôt que de les expulser a été chaleureusement saluée à Dacca. Le Bangladesh y voit un acte de véritable solidarité dans une crise qui a tendu chaque pays de la région."
 RAJ_regional.23.a: "Nous apprécions la solidarité de l'Inde."
 RAJ_regional.24.t: "L'Inde renforce Kalapani"
 RAJ_regional.24.d: "Des troupes indiennes se sont déplacées pour renforcer les positions au tripoint contesté de Kalapani-Lipulekh, des jours après que le parlement népalais a revendiqué le territoire à l'unanimité. Katmandou doit décider s'il aligne sa posture militaire sur celle de l'Inde ou cherche une sortie diplomatique."
 RAJ_regional.24.a: "Mobiliser nos forces."
 RAJ_regional.24.b: "Protestation par la diplomatie."
 RAJ_regional.25.t: "Le Bhoutan pèse l'alliance indienne"
 RAJ_regional.25.d: "Au lendemain de la confrontation de Doklam, l'Inde a approfondi son partenariat de défense avec le Bhoutan. Thimphou est reconnaissant de l'intervention indienne mais conscient qu'un alignement total pourrait encore plus provoquer Pékin, qui a ses propres revendications territoriales sur le territoire bhoutanais."
 RAJ_regional.25.a: "L'Inde est notre bouclier."
 RAJ_regional.25.b: "Nous ne devons pas provoquer la Chine."
 RAJ_regional.26.t: "Dacca signe l'accord de la Teesta"
 RAJ_regional.26.d: "Après des années de négociations bloquées par les objections du Bengale-Occidental, l'Inde a enfin outrepassé l'opposition intérieure et proposé de signer l'accord de partage des eaux de la Teesta. L'accord est une victoire diplomatique majeure pour le Bangladesh et pourrait transformer les relations bilatérales."
 RAJ_regional.26.a: "Signer l'accord."
 RAJ_ladakh_crisis: "Crise séparatiste du Ladakh"
 RAJ_ladakh_crisis_desc: "L'opinion musulmane au Ladakh est tombée dangereusement bas. Si nous ne traitons pas bientôt leurs griefs, la région pourrait déclarer l'indépendance."
 RAJ_meghalaya_crisis: "Crise séparatiste du Meghalaya"
 RAJ_meghalaya_crisis_desc: "L'opinion chrétienne au Meghalaya est tombée dangereusement bas. Si nous ne traitons pas bientôt leurs griefs, la région pourrait déclarer l'indépendance."
 RAJ_manipur_crisis: "Crise séparatiste du Manipur"
 RAJ_manipur_crisis_desc: "L'opinion chrétienne au Manipur est tombée dangereusement bas. Si nous ne traitons pas bientôt leurs griefs, la région pourrait déclarer l'indépendance."
 RAJ_sikkim_crisis: "Crise séparatiste du Sikkim"
 RAJ_sikkim_crisis_desc: "L'opinion bouddhiste au Sikkim est tombée dangereusement bas. Si nous ne traitons pas bientôt leurs griefs, la région pourrait déclarer l'indépendance."
 RAJ_punjab_crisis: "Crise séparatiste du Pendjab"
 RAJ_punjab_crisis_desc: "L'opinion sikhe au Pendjab est tombée dangereusement bas. Si nous ne traitons pas bientôt leurs griefs, la région pourrait déclarer l'indépendance."
 RAJ_raise_muslim_opinion_tt: "L'opinion musulmane doit être supérieure à 19"
 RAJ_raise_christian_opinion_tt: "L'opinion chrétienne doit être supérieure à 19"
 RAJ_raise_buddhist_opinion_tt: "L'opinion bouddhiste doit être supérieure à 19"
 RAJ_raise_sikh_opinion_tt: "L'opinion sikhe doit être supérieure à 14"
 RAJ_rebellion.1.a: "C'est un désastre."
 RAJ_rebellion.1.b: "La situation s'est stabilisée."
 RAJ_rebellion_ladakh_title: "Le Ladakh déclare son indépendance"
 RAJ_rebellion_ladakh_desc: "La population musulmane du Ladakh a perdu toute foi dans le gouvernement central. Des séparatistes armés ont pris le contrôle de la région et déclaré l'indépendance. Nos forces ont été expulsées de la zone."
 RAJ_rebellion_meghalaya_title: "Le Meghalaya déclare son indépendance"
 RAJ_rebellion_meghalaya_desc: "Les communautés chrétiennes du Meghalaya se sont soulevées contre le gouvernement central. Des milices tribales ont pris le contrôle de l'État et déclaré l'indépendance."
 RAJ_rebellion_manipur_title: "Le Manipur déclare son indépendance"
 RAJ_rebellion_manipur_desc: "Les communautés chrétiennes et tribales du Manipur se sont soulevées contre le gouvernement central. Des groupes armés ont pris le contrôle de l'État et déclaré l'indépendance."
 RAJ_rebellion_sikkim_title: "Le Sikkim déclare son indépendance"
 RAJ_rebellion_sikkim_desc: "La population bouddhiste du Sikkim a perdu toute foi dans le gouvernement central. Des forces séparatistes ont pris le contrôle et déclaré l'indépendance, cherchant à restaurer la souveraineté du Sikkim."
 RAJ_rebellion_punjab_title: "Le Pendjab déclare son indépendance"
 RAJ_rebellion_punjab_desc: "La population sikhe du Pendjab a perdu toute foi dans le gouvernement central. Des séparatistes du Khalistan ont pris le contrôle de la région et déclaré l'indépendance."
 indian_event.70.t: "Invitation à l'adhésion pleine aux BRICS"
 indian_event.70.d: "[FROM.GetName] a étendu une invitation à notre nation pour rejoindre les BRICS comme membre à part entière. C'est une opportunité significative d'approfondir nos liens économiques et politiques avec les économies émergentes les plus dynamiques du monde. L'adhésion pleine nous accorde des droits de vote, l'accès à la Nouvelle banque de développement, et la participation à toutes les initiatives BRICS."
 indian_event.70.a: "Accepter l'invitation avec honneur"
 indian_event.70.b: "Décliner — nous ne remplissons pas les conditions"
 indian_event.71.t: "[FROM.GetName] accepte l'adhésion pleine aux BRICS"
 indian_event.71.d: "[FROM.GetName] a formellement accepté notre invitation à rejoindre les BRICS comme membre à part entière. Cette expansion historique renforce notre alliance et apporte de nouvelles opportunités de coopération en commerce, finance et sécurité."
 indian_event.71.a: "Les accueillir dans le giron"
 indian_event.72.t: "[FROM.GetName] refuse l'adhésion pleine aux BRICS"
 indian_event.72.d: "[FROM.GetName] a décliné notre invitation à rejoindre les BRICS comme membre à part entière. Bien que décevant, nous respectons leur décision et espérons poursuivre l'engagement diplomatique par d'autres canaux."
 indian_event.72.a: "Une occasion manquée"
 indian_event.73.t: "Invitation à l'adhésion associée aux BRICS"
 indian_event.73.d: "[FROM.GetName] nous a invités à devenir membre associé des BRICS. Ce statut offre des opportunités de coopération renforcées sans droits de vote pleins. Les associés participent aux initiatives économiques et ont le statut d'observateur aux sommets."
 indian_event.73.a: "Accepter l'adhésion associée"
 indian_event.73.b: "Refuser - conditions non remplies"
 indian_event.74.t: "[FROM.GetName] accepte l'adhésion associée aux BRICS"
 indian_event.74.d: "[FROM.GetName] a accepté notre invitation à l'adhésion associée aux BRICS. Cela renforce nos liens économiques et ouvre de nouvelles voies de coopération."
 indian_event.74.a: "Un pas de plus vers l'intégration complète"
 indian_event.75.t: "[FROM.GetName] refuse l'adhésion associée aux BRICS"
 indian_event.75.d: "[FROM.GetName] a décliné notre offre d'adhésion associée aux BRICS. Nous restons ouverts à une coopération future."
 indian_event.75.a: "Peut-être une autre fois"
 indian_event.76.t: "Invitation au statut d'observateur des BRICS"
 indian_event.76.d: "[FROM.GetName] nous a offert le statut d'observateur aux BRICS. Cela nous permet d'assister aux sommets, de participer aux groupes de travail, et de bâtir des relations avec les États membres tandis que nous considérons un engagement plus profond."
 indian_event.76.a: "Accepter le statut d'observateur"
 indian_event.76.b: "Refuser - pas intéressé"
 indian_event.77.t: "[FROM.GetName] Accepte le statut d'observateur BRICS"
 indian_event.77.d: "[FROM.GetName] a accepté notre invitation au statut d'observateur aux BRICS. Cela marque le début de ce qui pourrait être une relation plus profonde."
 indian_event.77.a: "Tout voyage commence par un premier pas"
 indian_event.78.t: "[FROM.GetName] refuse le statut d'observateur des BRICS"
 indian_event.78.d: "[FROM.GetName] a décliné notre offre de statut d'observateur aux BRICS. L'invitation tient s'ils reconsidèrent."
 indian_event.78.a: "Peut-être avec le temps"
 indian_event.79.t: "Adhésion associée aux BRICS proposée"
 indian_event.79.d: "[FROM.GetName] a proposé d'élever notre standing au sein des BRICS d'observateur à membre associé. Le statut d'associé nous accorde un siège dans les initiatives économiques du bloc et une voix plus forte dans les discussions de sommet, approfondissant notre partenariat avec les économies émergentes."
 indian_event.79.a: "Accepter la promotion"
 indian_event.79.b: "Décliner — nous sommes contents comme observateurs"
 indian_event.82.t: "Adhésion pleine aux BRICS proposée"
 indian_event.82.d: "[FROM.GetName] a proposé d'élever notre standing au sein des BRICS d'associé à membre à part entière. L'adhésion pleine accorde des droits de vote, l'accès à la Nouvelle banque de développement, et l'entrée dans les arrangements de sécurité de l'alliance, liant notre avenir au bloc."
 indian_event.82.a: "Accepter l'adhésion complète"
 indian_event.82.b: "Refuser — l'engagement est trop lourd"
 RAJ_brics_invite_full_member: "Inviter [FROM.GetName] comme membre à part entière"
 RAJ_brics_invite_full_member_desc: "[FROM.GetName] peut prétendre au statut de membre à part entière des BRICS. Les membres de plein droit obtiennent le droit de vote, l'accès à la Nouvelle banque de développement et la participation à toutes les initiatives des BRICS."
 RAJ_brics_invite_associate_member: "Inviter [FROM.GetName] comme membre associé"
 RAJ_brics_invite_associate_member_desc: "[FROM.GetName] peut prétendre au statut de membre associé, renforçant la portée mondiale des BRICS par une coopération économique accrue."
 RAJ_brics_invite_observer: "Inviter [FROM.GetName] comme observateur"
 RAJ_brics_invite_observer_desc: "[FROM.GetName] peut prétendre au statut d'observateur, lui permettant de participer aux discussions et groupes de travail des BRICS."
 RAJ_brics_promote_to_associate: "Promouvoir [FROM.GetName] au rang d'associé"
 RAJ_brics_promote_to_associate_desc: "Faire passer [FROM.GetName] du statut d'observateur à celui de membre associé, avec des droits de coopération économique renforcés."
 RAJ_brics_promote_to_full: "Promouvoir [FROM.GetName] au rang de membre à part entière"
 RAJ_brics_promote_to_full_desc: "Faire passer [FROM.GetName] du statut d'associé à celui de membre à part entière, avec droit de vote et pleine participation aux BRICS."
