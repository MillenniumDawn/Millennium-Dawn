 KOR_uneven_economy1: "不均等な経済"
 KOR_uneven_economy1_desc: "必然的に、両朝鮮間の経済発展レベルの大きな格差は再統一後に影響を与えている。新しい朝鮮国家が完全な経済的可能性を解き放つためには、この不均衡は是正されなければならない。"
