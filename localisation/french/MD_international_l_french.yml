 un_sc_sanctions: "Nation sanctionnée"
 un_sc_sanctions_tt: "Les nations qui ont généré de la §Rtension mondiale§! sont éligibles à être §Rsanctionnées§! par le §YConseil de sécurité§! de l'§BOrganisation des Nations unies§!. Si un vote de sanction passe, les §Rsanctions§! resteront en place jusqu'à ce que le §YConseil de sécurité§! vote pour les lever, ou que la nation n'ait plus généré de §Rtension mondiale§!"
