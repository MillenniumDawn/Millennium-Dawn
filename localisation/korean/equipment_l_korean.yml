 mbt_equipment_5: "2055 주력전차"
 mbt_equipment_6: "2075 주력전차"
 Rec_tank_6: "경전차 2045"
 Rec_tank_6_desc: "2차 세계 대전 군대의 주력이었던 경전차는 이제 주력 전차의 무게와 크기 때문에 투입이 어려운 주변부 역할에서만 사용됩니다. 경전차는 가장 중무장한 정찰 부대가 사용하며, 공중 투하가 가능하다는 이점도 있고 상륙 임무에도 자주 사용됩니다. 처음부터 새로 설계되는 대신 보병 전투차 차체를 기반으로 하는 경우가 많습니다. 산악이나 삼림과 같은 험지에서는 주력 전차보다 훨씬 우수합니다."
