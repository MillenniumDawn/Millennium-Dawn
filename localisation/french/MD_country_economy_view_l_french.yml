 BALANCE_TOOLTIP: "Notre solde hebdomadaire est de $[?treasury_rate|+3] §Hmilliards§!."
 BALANCE_TOOLTIP_DELAYED: "Le solde est la variation nette du Trésor chaque semaine, égale aux recettes totales moins les dépenses totales. Un solde négatif vide le Trésor et force l'émission de dette hebdomadaire une fois les caisses à sec."
 TREASURY_TITLE: "Trésor"
 TREASURY_VALUE: "§Y[?treasury|3]§!"
 TREASURY_TOOLTIP: "Nous disposons de $[?treasury] §Hmilliards§! en trésorerie.\nNotre solde hebdomadaire est de $[?treasury_rate|+3] §Hmilliards§!."
 TREASURY_TOOLTIP_DELAYED: "Notre trésorerie reflète le montant d'argent que nous pouvons dépenser et qui peut être utilisé pour des achats et des investissements. Si la trésorerie passe dans le rouge, une dette sera automatiquement contractée chaque semaine pour qu'elle reste positive.\n\n§tL'écran Économie est déplacé vers l'onglet Commerce.§!"
