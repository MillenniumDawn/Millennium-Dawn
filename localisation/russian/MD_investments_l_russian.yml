 investments_project_0_decision: "Инвестиционный проект №1 в §Y[?ROOT.project_array^0.GetName]§!"
 investments_project_0_decision_desc: "Строительный проект с иностранными инвестициями. Подробности о постройках — в подсказке при завершении.\n\nОбщее время строительства: [?ROOT.project_construction_duration^0] дней\nПервоначальная стоимость: [?ROOT.project_monetary_cost^0|3]\nПКМ — показать целевой регион."
 investments_project_0_target_decision: "Инвестиционный проект №1 в §Y[?FROM.project_array^0.GetName]§!"
 investments_project_0_target_decision_desc: "Страна: [FROM.GetName]\nОчередь строительства: [?FROM.project_build_amount^0]\n\nПри выборе этого решения строительный проект будет отменён.\nПКМ — показать целевой регион."
 investments_project_1_decision: "Инвестиционный проект №2 в §Y[?ROOT.project_array^1.GetName]§!"
