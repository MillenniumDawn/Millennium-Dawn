 TOP_redesign.10.d_organization_success: "The field report for §Y[TOP_report_subject_name]§! in [?TOP_report_state.GetName] confirms the §Y[TOP_report_objective_name]§! operation succeeded. [TOP_report_impact_name] A 90-day organization disruption was recorded. Attribution may still change during the investigation."
