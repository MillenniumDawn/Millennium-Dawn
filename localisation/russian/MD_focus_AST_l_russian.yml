 tony_abbott_desc: "Карьера Тони — это сплошное искусство уклонения от критики и обрушивания её на оппонентов. Будучи чрезвычайно способным лидером оппозиции, Тони повёл партию к более жёстким правым позициям, питая при этом склонность к популяризации своих трёхсловных лозунгов. \n\nТони родился в Лондоне, вырос в Сиднее в католической семье и получил иезуитское образование. В школе его главной целью было стать священником. Глубокое стремление к служению и духовному лидерству побудило его в конце концов вернуться в Великобританию в качестве студента Оксфорда, чтобы получить как можно больше знаний перед служением. Однако, несмотря на всеобщее почитание, его склонность к политике никогда его не покидала. \n\nРегулярная организация им митингов и демонстраций противостояла левому студенческому руководству Оксфорда, что приводило к ожесточенным столкновениям. Вернувшись в Австралию, Тони, следуя своим первоначальным намерениям, в 1984 году в возрасте 26 лет стал священником. После трех лет службы он признался, что был \"Квадратный колышек, пытающийся вставить в круглое отверстие.\" и что священство предназначалось не только для него. \n\nПоскольку его преданность политике не смогла перевесить его любовь к ее захватывающим перипетиям, Тони устроился журналистом в The Bulletin, что в конечном итоге привело его к должности пресс-секретаря Либеральной партии. Этот опытный и вызывающий разногласия партийный деятель теперь занял высший пост в стране."
 executive_management_ast: "Исполнительное руководство"
 the_turnbull_government_desc: "В настоящее время для этого дерева фокусов нет контента. Дерево фокусов Тернбулла будет разработано в будущем, но пока это дерево фокусов является временным."
 collapsing_state_sol: "Коллапсирующее государство"
 collapsing_state_sol_desc: "В стране фактически рухнул закон и порядок, обширные территории контролируются бродячими бандами коррумпированных полицейских и вооруженных боевиков. Оставшаяся экономика находится в состоянии свободного падения, а правительство застряло в парламенте, не имея ни финансовых средств, ни полномочий для контроля над стремительно ухудшающейся ситуацией."
 collapsing_state_sol_1: "Хрупкое государство"
 collapsing_state_sol_1_desc: "Большинство боевиков разоружены и остаются под стражей государства. В нескольких городах восстановлен порядок, однако ситуация по-прежнему остается хрупкой."
 collapsed_state_sol: "Коллапсирующее государство"
 collapsed_state_sol_desc: "Пока многие жители продолжают покидать острова, оставшиеся боевики продолжают рыться в руинах погибшей нации. Последние проблески демократии погасли, и у тех, кто пытается выжить, почти нет надежды на будущее."
