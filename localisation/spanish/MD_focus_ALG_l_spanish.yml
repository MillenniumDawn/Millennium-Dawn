 alg.450.t: "Argelia se hunde en un conflicto civil"
 alg.450.d: "El aumento de los agravios y el colapso de la estabilidad han llevado a la nación más allá de su punto de ruptura. Las facciones armadas se levantan a medida que el Estado se fractura, sumiendo a Argelia en una nueva era de conflicto interno."
 alg.450.a: "La situación se sale de control."
 kabyle_focus: "Enfoque de Cabilia"
 KBY_drs_desc: "Establecer una estrecha línea de cooperación con el Departamento de Inteligencia y Seguridad (DRS) para salvaguardar el orden."
