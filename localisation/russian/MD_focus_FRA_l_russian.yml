 FRA_knds_fg_partnership: "Франко-германское партнерство"
 FRA_knds_fg_partnership_desc: "В 2015 году холдинг KANT объединил компании Krauss-Maffei Wegmann и Nexter под франко-германским управлением в соотношении 50/50, объединив двух национальных лидеров в единую промышленную базу."
 FRA_knds_kant_holding: "Интеграция холдинга KANT"
 FRA_knds_kant_holding_desc: "Трансграничные инженерные группы, согласованные закупки и общие административные услуги позволяют снизить накладные расходы, связанные с параллельной работой двух традиционных оборонных предприятий."
 FRA_knds_embt: "Демонстрационный образец EMBT"
 FRA_knds_embt_desc: "Усовершенствованный основной боевой танк сочетает в себе башню Leclerc и корпус Leopard 2, предвосхищая гибридную концепцию будущей основной боевой системы наземного базирования."
 FRA_knds_joint_rnd: "Объединенный пул НИОКР"
 FRA_knds_joint_rnd_desc: "Совместные франко-германские исследовательские бюджеты ускоряют параллельное развитие направлений в области брони, электроники и энергетических материалов, которые ни одна из компаний не смогла бы реализовать поодиночке."
 FRA_knds_mgcs_modular: "Модульная архитектура MGCS"
 FRA_knds_mgcs_modular_desc: "Основная боевая система для наземных операций задумана как многоплатформенное семейство со сменными модулями для защиты, огневой мощи и радиоэлектронной борьбы, призванное заменить Leopard 2 и Leclerc к 2040-м годам."
 FRA_knds_mgcs_integration: "Интеграция систем MGCS"
 FRA_knds_mgcs_integration_desc: "MGCS объединяет общую цифровую инфраструктуру, систему управления боем, разработанную на основе SCORPION, и единую систему интеграции данных с датчиков во всех франко-германских бронетанковых соединениях."
 FRA_knds_turret_leadership: "Турельное лидерство (Nexter)"
 FRA_knds_turret_leadership_desc: "Разработка башен, проектирование автоматических заряжающих устройств и изготовление орудий объединены под руководством бывших команд Nexter, опираясь на опыт в области огневой мощи времен Леклера."
 FRA_knds_hull_leadership: "Руководство Халла (KMW)"
 FRA_knds_hull_leadership_desc: "Разработка корпуса, силовой установки и ходовой части консолидируется под руководством бывших команд KMW, с использованием опыта проектирования конструкций Leopard 2 и Puma."
 FRA_knds_nato_standardisation: "Стандартизация артиллерии НАТО"
 FRA_knds_nato_standardisation_desc: "Компания KNDS поставляет Агентству НАТО по поддержке и закупкам 155-мм боеприпасы, соответствующие стандарту STANAG, что делает объединенную компанию основным поставщиком артиллерийских снарядов в Европе."
 FRA_knds_rch155: "Дистанционно управляемая гаубица РЧ-155"
 FRA_knds_rch155_desc: "RCH-155 — это автоматизированная 155-мм башня на шасси Boxer, способная вести огонь на ходу на дальности до 54 километров с экипажем из двух человек."
 FRA_knds_leopard_sustainment: "Leopard 2 Fleet Sustainment"
 FRA_knds_leopard_sustainment_desc: "Объединенная логистика, производство запасных частей и модернизация парка самолетов Leopard 2 находятся в ведении объединенной компании, что обеспечивает KNDS многолетний поток доходов от технического обслуживания по всей Европе."
 FRA_knds_boxer_puma: "Программа охраны боксеров и пум"
 FRA_knds_boxer_puma_desc: "Модульный бронетранспортер Boxer и боевая машина пехоты Puma остаются программами, возглавляемыми KMW, и теперь поддерживаются объединенным промышленным весом KNDS."
 FRA_knds_bonus_katana: "Бонус и боеприпасы для катаны"
 FRA_knds_bonus_katana_desc: "Снаряды BONUS с сенсорным взрывателем и управляемые снаряды KATANA расширяют ассортимент высокоточной артиллерии KNDS, которая теперь продается как единая общеевропейская линейка продукции."
 FRA_knds_export_leadership: "Лидерство в экспорте"
 FRA_knds_export_leadership_desc: "Агрессивная экспортная стратегия направлена ​​на привлечение покупателей в странах Персидского залива, Юго-Восточной Азии и Восточной Европы с помощью готовых комплектов бронетехники, артиллерии и боеприпасов."
 FRA_knds_strategic_autonomy: "Стратегическая автономия"
 FRA_knds_strategic_autonomy_desc: "Доктрина приоритета отечественного производства резервирует лучшие производственные мощности и важные технологии для франко-германских вооруженных сил, укрепляя европейскую стратегическую автономию в отношении продаж на открытом рынке."
