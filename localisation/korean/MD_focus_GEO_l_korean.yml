 GEO_means_of_production: "생산 수단"
 GEO_immigrants_barred: "이민 중단"
 GEO_immigrants_barred_desc: "정부는 추후 공지가 있을 때까지 조지아로의 모든 이민을 중단했습니다. 그 공지가 올지 안 올지는 알 수 없습니다."
 GEO_self_help_idea: "자력 구제"
 GEO_trade_idea: "무역 구상"
