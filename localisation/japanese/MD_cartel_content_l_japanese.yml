 seized_a_contraband_container: "禁制品を積んだ押収コンテナ"
 cartel_penalties: "カルテル"
 cartel_penalties_desc: "麻薬による暴力とギャング活動は、この国の犯罪環境において大きな部分を占めている。これらの強力な犯罪組織は全国規模で活動しており、多くの住民に恐怖心を植え付け、状況の悪化を懸念させている。しかし、政府の取り組み次第では、この阻害要因を戦略的な強みへと転換できる可能性がある。"
 has_cartels_tt: "国民精神§Y$cartel_penalties$§!を有する\n"
 defeated_the_cartels: "カルテルの終焉"
 hard_drug_trade_restrictions: "厳しく規制されたカルテル協力"
 light_drug_trade_restrictions: "緩く規制されたカルテル協力"
 narco_state_bonuses: "麻薬国家"
 narco_state_bonuses_desc: "カルテルが国家を掌握するにつれ、長年の闘争は徐々に衰退していった。"
 CARTEL_defeated_the_cartels: "カルテルを倒した"
 narcos_state: "麻薬国家"
 narcos_state_desc: "長年の闘争を経て、ナルコスは今や国家機構そのものを支配している。"
 cartels_decision_category: "犯罪"
 cartels_decision_category_desc: "犯罪組織は社会のあらゆる階層に浸透している。マフィア組織、麻薬カルテル、暴力団は冷酷な効率性で権力と縄張りを争い、その跡には流血の跡を残す。断固たる措置を講じなければ、我が国は犯罪組織の支配下にある失敗国家へと転落する危険に晒される。\n\n§Y政治的影響力§!はカルテルが国家機関をどれほど深く腐敗させたかを示す。彼らの影響力が拡大するほど、内部からの妨害や賄賂により捜査が失敗する可能性が高まる。\n\n§Yカルテルの強さ§!はカルテルの軍事力と支配地域を測定する。数値が高いほど、我々の襲撃作戦はより大きな抵抗と高い犠牲を強いられる。\n\nいずれかの指標が危険水準に達した場合、カルテルは腐敗したクーデターまたは直接的な軍事衝突を通じて国家の完全掌握を試みる可能性がある。\n\n$political_influence_of_cartels$:[?ROOT.cartel_political_influence|1]\n$strength_of_cartels$:[?ROOT.strength_of_cartels|1]\n"
 narcos_crisis: "麻薬危機"
 narcos_crisis_desc: "蔓延する汚職と組織犯罪によって、政府の権威は著しく損なわれている。カルテルは主要機関に浸透し、法執行能力と国家による暴力の独占の維持を脅かしている。情報機関の報告によると、カルテルと連携する将校による軍事クーデター、あるいはカルテル自身による組織的な武装蜂起のいずれかの瀬戸際に立たされているようだ。国家権力の完全な崩壊を防ぐため、早急な行動が必要となる。"
 mafia_crisis: "マフィア危機"
 mafia_crisis_desc: "蔓延する汚職と組織犯罪によって、政府の権威は著しく損なわれている。マフィアは主要機関に浸透し、法執行能力と国家による暴力の独占の維持を脅かしている。情報機関の報告によると、マフィアと連携する将校による軍事クーデター、あるいは犯罪組織による組織的な武装蜂起のいずれかの瀬戸際に立たされているようだ。国家権力の完全な崩壊を防ぐため、早急な行動が必要となる。"
 mexican_cartel_war: "メキシコ・カルテル戦争"
 mexican_cartel_war_desc: "The ability of our government to enforce laws and monopolize force has been compromised by increasing corruption and criminal activity. Our military and political infrastructure have been completely compromised and there is no telling who can be trusted anymore. The chaos will soon reach a fever pitch and then, we will be in the midst of a new civil war."
 anti_cartel_propaganda_decision: "反カルテルのプロパガンダ"
 anti_cartel_propaganda_decision_desc: "カルテルをめぐっては、彼らはバラ色の過去に生きた盗賊団のようなものだという神話が常に広まってきた。愛すべき悪党で、悪いことをすることもあるが、それはあくまで仲間のためだけである、というものだ。しかし、あらゆる神話と同様に、これは作り話であり、カルテルの影響下で暮らす人なら誰でも、それが虚偽であることは分かっている。全国規模のメディアキャンペーンを通して、カルテルが自らにもたらした恐怖を暴露することで、我々はこの神話を完全に払拭することができるのだ。"
 police_investments_decision: "警察の叙任式"
 police_investments_decision_desc: "カルテルのような犯罪組織は、広範な資源、資金、そして武器を有する高度な組織であり、最小限の武力や標準的な警察活動では抑止できない。警察はこれらの組織に対する主要な防衛力として機能しているが、彼らが直面する極度の暴力に対抗するための資源が不足しているケースがしばしばある。警察の軍事化には一定の社会的コストが伴うが、強化された装備、高度な戦術訓練、そして人員増強の提供は、カルテルによる活動に対する効果的な障壁を構築する上で不可欠となる。この改革には多額の資金投資が必要だが、組織犯罪と効果的に闘うために我が国が必要とする安全保障基盤の確立には不可欠だ。"
 utilize_the_military_decisions: "軍隊の活用"
 utilize_the_military_decisions_desc: "警察部隊は装備が整っているものの、限られた人員、地方の官僚機構、そして潜在的な汚職によって制約を受け続けている。軍隊を投入することで、優れた火力、強固な指揮系統、そして地方行政の障害を回避できる豊富な資源が得られる。軍隊の全国組織は、カルテルが活動する地域を越えた連携作戦を可能にする。しかしこの手法には重大な欠点がある：住民は地域への軍隊駐留を恐れることが多く、地元警察は自らの努力が不十分と暗に示されることに反発し、作戦中に民間インフラが損傷を受ける可能性がある。軍事展開は人権問題のリスクも伴い、政府機関への国民の信頼を損なう恐れがある。戦術的優位性と、国民の支持や正当性を失う可能性を慎重に天秤にかけねばならない。"
 target_cartel_money_laundering_decision: "マネーロンダリングの摘発"
 target_cartel_money_laundering_decision_desc: "カルテルは不正な利益を合法資産に変えるため、資金洗浄を行わねばならない。この過程は三段階で構成される：金融システムへの投入、出所の隠蔽のための層化、合法資産への統合。洗浄された資金により、不動産や企業の購入、政府高官への影響力行使が可能となる。層化と統合の段階を標的とすることで、我々は彼らの金融インフラを破壊し、腐敗を食い止められる。これには、共謀する金融機関やペーパーカンパニーの系統的な調査と閉鎖が含まれる。しかし、この戦略には重大なリスクが伴う。作戦の失敗は、カルテルが資金の流れを守るために暴力的な報復を引き起こす可能性があり、政府軍と民間人双方に対する敵意を激化させる恐れがある。"
 investigate_the_casinos: "カジノの調査"
 investigate_the_casinos_desc: "カジノは規制のグレーゾーンで運営されており、違法資金洗浄の理想的な入り口となっている。高い現金回転率は、多額の資金を疑われることなく処理できる環境を作り出し、匿名性と合法性を兼ね備えているように見せかける。我々の戦略は、既知のカルテル関係者が頻繁に訪れる施設を特定し、その財務活動を徹底的に監査することだ。疑わしい取引を綿密に追跡し、犯罪組織との直接的なつながりを確立することで、これらのフロント組織に対して確固たる立件を可能にする。十分な証拠が集まり次第、組織的な襲撃を実施し、これらの活動を停止させ、資産を押収することで、カルテルの金融インフラに甚大な打撃を与えると同時に、国家の資金を回収できる。"
 investigates_the_banks: "銀行の調査"
 investigates_the_banks_desc: "銀行は、通常は合法的な機関であるにもかかわらず、高度なマネーロンダリング活動において重要な経路となっている。銀行幹部や金融アナリストへの戦略的調査と、取引記録の包括的な分析を組み合わせることで、疑わしい資金移動を未然に防ぐことができる。忍耐強く監視することで、不正資金が最大限に集約された時点、通常は最終目的地に近づいた時点で攻撃を仕掛けることができる。このアプローチは、犯罪組織に最大限の経済的損害を与えると同時に、彼らの活動から多額の資金を奪取する。しかし、犯罪組織は摘発を回避するための手法を絶えず進化させており、効果的な監視を維持することは大きな課題となる。さらに、関与が疑われる金融機関の閉鎖は、その経済的重要性と強力な人脈を考えると、政治的に実現不可能である。"
 investigate_shell_companies: "ペーパーカンパニーの調査"
 investigate_shell_companies_desc: "ダミー会社は、高度なマネーロンダリング活動において重要な仲介者として機能し、犯罪資産の中間保管場所と最終保管場所の両方として機能する。これらの法人はカルテルに代わって財産と資本を保有し、それらの資産を徐々に合法的な送金先へと移管する。犯罪組織との直接的なつながりを確立するには、広範な金融フォレンジックと情報収集が必要となるため、捜査上は大きな課題となる。しかし、このような困難にもかかわらず、ダミー会社を標的にすることで、カルテルの金融インフラを壊滅的に混乱させることが可能になる。これらの活動は、多額の現金を押収するよりも、商業用不動産、高級車、産業機器、合法的に入手した武器など、多額の物理的資産の押収につながるのが一般的だ。これは、犯罪者がこれらのフロントラインを通じて、発覚を回避するために設計された小規模で一貫した取引で資金を移動させるからだ。"
 target_cartel_drug_running_decision: "麻薬密輸活動の摘発"
 target_cartel_drug_running_decision_desc: "麻薬密輸はカルテルにとって最大の違法収入源である。一部のカルテルは自ら麻薬を栽培しているが、多くのカルテルは精製済みまたは未精製の製品をサプライチェーンを通じて輸送することで利益を上げている。これらの輸送ルートを体系的に標的とし、監視することで、我々は輸送元、輸送先、そして中継拠点を特定することができる。この情報に基づき、機材保管庫、精製所、農場、麻薬密売所、そして作戦基地への戦略的な襲撃を実施することが可能になる。また、輸送中の貨物を拿捕することも可能だが、この方法は大規模な組織に対しては効果がないことが多い。しかし、限られた資源しか持たない小規模な組織にとっては、大きな不安定化をもたらす可能性がある。"
 raid_drug_convoys_decision: "麻薬輸送隊の襲撃"
 raid_drug_convoys_decision_desc: "輸送中の麻薬輸送車列を阻止することで、最小限の運用コストで効率的にサプライチェーンを遮断することが可能になる。大手カルテルは輸送ルートや輸送手段を迅速に変更するリソースを有しているが、小規模な組織はこうした作戦に対して脆弱だ。製品と収益の突然の喪失は、彼らの財務安定性を壊滅させ、リソースが枯渇する中で上層部が統制を維持しようと苦闘するにつれ、しばしば内部対立を引き起こす可能性がある。こうした標的を絞った阻止活動は、政府の行動を明確に示すと同時に、犯罪組織の階層構造内の分裂を巧みに利用することで、高い視認性を実現している。"
 raid_cartel_hideouts_decision: "カルテルの隠れ家を襲撃"
 raid_cartel_hideouts_decision_desc: "カルテルの拠点や補給拠点を標的とすることは、彼らの活動基盤を直接的に混乱させ、麻薬の輸送、活動の調整、そして領土防衛能力を著しく制限する。これらの襲撃により、政府軍や敵対組織に対して使用されるはずだった戦術車両や兵器が大量に押収されるのが一般的だ。これらの作戦の戦略的な帰結として、カルテルの勢力図が不安定化する可能性がある。弱体化した組織は、しばしば競合組織による領土拡大の標的となり、犯罪ネットワークを分断して我々に有利に働かせたり、権力の空白が生じて暴力の激化を引き起こしたりする可能性がある。"
 raid_distribution_centres_decision: "流通施設を襲撃"
 raid_distribution_centres_decision_desc: "麻薬カルテルの流通センター（麻薬密売所や備蓄倉庫を含む）を標的とすることで、大量の麻薬が街に流通する前に摘発することが可能になる。これらの作戦では、多額の違法現金を押収し、主要な流通担当者を逮捕することで、サプライチェーンを数週間から数ヶ月にわたって混乱させる。しかし、これらの襲撃は、カルテルの利益に直接影響を与える一方で、執行能力を損なうため、暴力的な報復を受けるリスクが高まる。流通センターは通常、厳重に警備され、製品や人員を迅速に拡散できるよう戦略的に配置されているため、このような作戦前の情報収集は非常に重要だ。"
 raid_refinement_centres_decision: "麻薬精製所を襲撃"
 raid_refinement_centres_decision_desc: "麻薬製造ラボ、プランテーション、または栽培施設を襲撃することで、カルテルが新しい麻薬を製造し流通させる能力を妨げることができる。この打撃は通常、彼らの生産を数か月間にわたり停滞させる効果をもたらす。同時に、カルテルの資源の多くは領土の確保に集中しているため、報復攻撃を受ける可能性は低い。"
 target_local_cartel_leaders_decision: "地元カルテルリーダーの摘発"
 target_local_cartel_leaders_decision_desc: "カルテルは、他の高度な組織と同様に、階層的なリーダーシップ構造に基づいて活動を調整している。地元のカルテルリーダーを戦略的に標的とし、逮捕やより永続的な手段を用いて無力化することで、彼らの指揮系統を著しく混乱させることができる。この不安定化は複数のメリットをもたらす。適切な指導がなければ採用活動は停滞し、活動能力は大幅に低下し、部下が空席となったリーダーの地位をめぐって争う中で内部の権力闘争が勃発する。さらに、こうした要人の逮捕や排除は、メディアで大きく報道され、国民の士気を高め、組織犯罪対策における政府の有効性を実証する。これらの人物に対する作戦が成功するたびに、カルテルの基盤が弱体化するだけでなく、彼らが抱いていた無敵の感覚も揺らぐことになる。"
 MEX_baja_california_sinaloa_cartel: "シナロア・カルテルの影響を減らす"
 MEX_baja_california_sinaloa_cartel_desc: "シナロア・カルテルは強くなりすぎており、バハ・カリフォルニアにおける彼らの影響力を抑制する必要がある。"
 MEX_baja_california_tierra_cartel: "ティエラ カリエンテの影響を軽減する"
 MEX_baja_california_tierra_cartel_desc: "ティエラ・カリエンテは強力になりすぎており、バハ・カリフォルニアにおける彼らの影響力を抑制する必要がある。"
 MEX_sonora_sinaloa_cartel: "シナロア・カルテルの影響を減らす"
 MEX_sonora_sinaloa_cartel_desc: "シナロア・カルテルは強くなりすぎており、ソノラにおける彼らの影響力を抑制する必要がある。"
 MEX_chihuahua_sinola_cartel: "シナロア・カルテルの影響を減らす"
 MEX_chihuahua_sinola_cartel_desc: "シナロア・カルテルは強くなりすぎており、チワワにおける彼らの影響力を抑制する必要がある。"
 MEX_sinola_durango_sinola_cartel: "シナロア・カルテルの影響を減らす"
 MEX_sinola_durango_sinola_cartel_desc: "シナロア・カルテルは強くなりすぎており、シナロア・デュランゴにおける彼らの影響力を抑制する必要がある。"
 MEX_jalisco_tierra_cartel: "ティエラ カリエンテの影響を軽減する"
 MEX_jalisco_tierra_cartel_desc: "ティエラ・カリエンテは強くなりすぎており、ハリスコにおける彼らの影響力を抑制する必要がある。"
 MEX_guerrero_oaxaco_tierra_cartel: "ティエラ カリエンテの影響を軽減する"
 MEX_guerrero_oaxaco_tierra_cartel_desc: "ティエラ・カリエンテは強くなりすぎており、ゲレロ・オアハカにおける彼らの影響力を抑制する必要がある。"
 MEX_mexico_tierra_cartel: "ティエラ カリエンテの影響を軽減する"
 MEX_mexico_tierra_cartel_desc: "ティエラ・カリエンテは強くなりすぎており、メキシコシティにおける彼らの影響力を抑制する必要がある。"
 MEX_mexico_sinaloa_cartel: "シナロア・カルテルの影響を減らす"
 MEX_mexico_sinaloa_cartel_desc: "シナロア・カルテルは強くなりすぎており、メキシコシティにおける彼らの影響力を抑制する必要がある。"
 MEX_veracruz_tierra_cartel: "ティエラ カリエンテの影響を軽減する"
 MEX_veracruz_tierra_cartel_desc: "ティエラ・カリエンテは強くなりすぎており、ベラクルスにおける彼らの影響力を抑制する必要がある。"
 MEX_already_attacking_cartels_flag: "すでにカルテルの影響力を削減中"
 flag_mexico_cartel_war: "メキシコ・カルテル戦争"
 reduce_cartel_influece_sinola_TT: "シナロア・カルテルの州内での影響力は低下している"
 reduce_cartel_influece_tierra_TT: "ティエラ・カリエンテの州内での影響力は低下している"
 cartel_event.1.t: "カルテルの終焉"
 cartel_event.1.d: "我が国における主要カルテルの影響力は十分に弱まり、地方の支配権を取り戻すことを真剣に検討できるようになった。残されたのは、撤退命令を出すことだけだ。"
 cartel_event.1.a: "ロス・ナルコスは犯罪行為の代償を払うだろう！"
 cartel_event.3.t: "メキシコの運命"
 cartel_event.3.d: "Our efforts to rid ourselves of the cartels haven't gone unnoticed and they have taken up arms against the Mexican government. The War on Drugs in Mexico has entered its final stage."
 cartel_event.3.a: "シナロア・カルテルに加わる。"
 cartel_event.3.b: "ティエラ・カリエンテに加わる。"
 cartel_event.3.c: "タマウリパス・カルテルに加わる。"
 cartel_event.3.e: "メキシコ万歳！"
 cartel_event.10.t: "麻薬戦争の終結"
 cartel_event.10.d: "After months of fighting through the streets of our major cities, the jungles, plains, and the deserts, we've managed to eliminate every major cartel stronghold and route, detain, or kill every important cartel leader. The end draws near for the Narcos and soon Mexico will breathe free again."
 cartel_event.10.a: "The nightmare draws to an end."
 cartel_event.12.t: "カルテルの反撃"
 cartel_event.12.d: "The cartels refuse to sit idly by while we disrupt their operations and attack their members. In response, they've launched a series of bombings and retaliatory strikes against our local forces."
 cartel_event.12.a: "忌々しいナルコスめ！"
 cartel_event.15.t: "行方不明のライフルと弾薬"
 cartel_event.15.d: "In a recent audit of our nation's military bases as part of a measure to curtail the movement of equipment onto the black market, a considerable deficit of small arms and ammunition was uncovered. While the chance remains that it is a numerical error it is more likely that the equipment has been fenced or is in the process of being fenced. Luckily, the issue is isolated to a single military base where we can bring down our full force."
 cartel_event.15.a: "基地内の活動を制限する。"
 cartel_event.15.b: "我々はすでに手一杯だ。"
 cartel_event.16.t: "行方不明の汎用車両"
 cartel_event.16.d: "In a recent audit of our nation's military bases as part of a measure to curtail the movement of equipment onto the black market, a considerable deficit of trucks and their spare parts was uncovered. While the chance remains that it is a numerical error it is more likely that the equipment has been fenced or is in the process of being fenced. Luckily, the issue is isolated to a single military base where we can bring down our full force."
 cartel_event.16.a: "基地内の活動を制限する。"
 cartel_event.16.b: "我々はすでに手一杯だ。"
 cartel_event.17.t: "行方不明のヘリコプター"
 cartel_event.17.d: "In a recent audit of our nation's military bases as part of a measure to curtail the movement of equipment onto the black market, a considerable deficit of helicopters and their spare parts was uncovered. While the chance remains that it is a numerical error it is more likely that the equipment has been fenced or is in the process of being fenced. Luckily, the issue is isolated to a single military base where we can bring down our full force."
 cartel_event.17.a: "基地内の活動を制限する。"
 cartel_event.17.b: "我々はすでに手一杯だ。"
 cartel_event.18.t: "港で押収された戦車"
 cartel_event.18.d: "主要港湾の一つにおいて、港湾当局が旧式ながら完全武装・稼働状態のソ連製T-55、ならびに予備部品及び弾薬の積荷を発見した。その目的地や出発地は特定できないものの、一切の書類が存在しないことから、いずれも違法なものであると推測される。幸いなことに、それらの最終的な行き先は完全に我々の掌握下にある。"
 cartel_event.18.a: "スクラップにして売却する。"
 cartel_event.18.b: "我々の軍に編入する。"
 cartel_event.18.c: "我々の友人に譲る。"
 cartel_event.19.t: "死体投棄場が全国ニュースに"
 cartel_event.19.d: "主要都市の一つで大規模な遺体遺棄現場が発見されたという不幸な出来事がニュースサイクルに取り上げられ、あらゆる画面やラジオを通じて報じられている。情報の流れを取り戻すための我々の機会は失われつつある。何もしなければ、恐怖が人々をより深く支配し、この犯行を行った怪物たちに簡単に踏みつけられるだろう。"
 cartel_event.19.a: "話題の主導権を取り戻す。"
 cartel_event.19.b: "我々はすでに手一杯だ。"
 cartel_event.20.t: "外国の有名人が殺害される"
 cartel_event.20.d: "先週、[?var:foreign_celeb_country.GetName]の国の著名人が地元の男に殺害された。犯人に関する簡易捜査で、我が国最大の犯罪組織の一つとのつながりが明らかになった。我々は既に、何らかの形でこの殺害の責任を取るよう外部から圧力を受けている。いくつかの提案が進められているが、最も目立たないのは、この著名人が所属する慈善団体の一つを支援することだ。"
 cartel_event.20.a: "チャリティを支援する。"
 cartel_event.20.b: "犯罪者と関わるべきではなかった。"
 cartel_event.21.t: "カルテル、エキゾチックアニマルを輸入"
 cartel_event.21.d: "A fascination with exotic animals has spread among the highest ranking members of our nation's cartels. Usually obtained illegally, these animals are used as signs of power and of office while occasionally being tied to gruesome killings. By tightening our grip on the influx of animals, we could expose the ridiculousness of those engaged in it by forcing an artificial increase in price. While a tiger may be intimidating, spending ten million dollars on it is an obvious sign of opulence."
 cartel_event.21.a: "この取引を撲滅する。"
 cartel_event.21.b: "取引を無視する。"
 cartel_event.22.t: "地元ギャングの衝突"
 cartel_event.22.d: "A gang war has erupted on the streets of one of our larger cities, hampering the local economy, claiming lives, and making residents afraid to leave their homes. While our analysts predict the violence will not last for long, the public is unlikely to be comfortable with the idea of simply waiting out wanton killings. An intervention by our police forces could end the crisis early but would result in large overhead and possible loss of life."
 cartel_event.22.a: "警察を送り込む。"
 cartel_event.22.b: "我々はすでに手一杯だ。"
 cartel_event.23.t: "アメリカが引き渡しを要求"
 cartel_event.23.d: "アメリカ合衆国は、最近我々が投獄に成功した麻薬王の身柄引き渡しを要求している。将来的に他の麻薬王に対する支援を期待し、彼らの好意を維持する上で、身柄引き渡しを受け入れることは我々にとって有利である。しかしながら、アメリカが我々の司法制度に干渉すれば、我々自身の自立性は損なわれることは避けられない。"
 cartel_event.23.a: "彼を渡そう。"
 cartel_event.23.b: "我々で処理できる"
 cartel_event.24.t: "密告者の映画契約"
 cartel_event.24.d: "我々の密告者の一人が、かつて国内最大の犯罪組織の一員だったという経歴を映画プロデューサーに聞きつけられ、彼の人生を映画化したいと提案された。密告者は喜んでこの提案を受け入れたいと考えているが、その決断は彼の命を危険にさらす可能性がある。この映画制作を支援し、進めるか、それとも将来的な希望を断つかを選択する必要がある。"
 cartel_event.24.a: "映画契約を許可する"
 cartel_event.24.b: "危険すぎる"
 cartel_event.25.t: "密告者の回顧録出版"
 cartel_event.25.d: "最近、密告者が映画プロデューサーと接触したことで、自身の物語を世に出したいという気持ちが強まったようだ。過去数週間、彼は複数の作家や政府関係者と協力し、匿名で出版可能な回顧録を作り上げた。関係者によると、この回顧録は非常に引き込まれる内容で、カルテルでの生活の本当の恐ろしい現実を描き出しているという。"
 cartel_event.25.a: "ベストセラーになるかもしれないな。"
 cartel_event.26.t: "撮影現場での密告者の殺害"
 cartel_event.26.d: "The body of our informant was discovered on set after a visit to oversee an important scene. Based on the state of the body, it has been concluded that the killing was done in retaliation by cartel members. Rightfully fearing for their lives, the production team behind the movie has decided to shutter production."
 cartel_event.26.a: "残念だな。"
 cartel_event.27.t: "映画が犯罪活動を助長"
 cartel_event.27.d: "密告者の人生を題材にした新作映画が、意図とは異なり、シリアスな犯罪悲劇というよりも「デ・バケロス」風の作品として受け取られているようだ。この結果、映画のキャラクターに憧れた若者たちが、国内の多くの犯罪組織への加入を増加させる事態を招いている。"
 cartel_event.27.a: "残念なことだ。"
 cartel_event.28.t: "映画が犯罪活動を抑止"
 cartel_event.28.d: "The film that our informant has helped in the production of has reached critical acclaim within the first week of its release. What's more, the realistic depiction of the horrors of the cartels has encouraged more backlash against them. It seems that our young people would now rather grow up to fight the cartels than grow up to join them."
 cartel_event.28.a: "素晴らしい。"
 cartel_event.29.t: "カルテルが国境を越えて侵入"
 cartel_event.29.d: "隣国の一つで麻薬カルテルが大規模な国境越えを実行したが、両国の国境管理機関はいずれも対策を講じず、責任は相手方に押し付けられている。この事態を受け、我が国の政治機構内では隣国の国境警備強化を求める動きが広がっている。これは決して我々だけの責任ではないからだ。"
 cartel_event.29.a: "隣国にもっと厳しい国境管理を要求する。"
 cartel_event.29.b: "要求は我々の関係を損なう可能性がある。"
 cartel_event.30.t: "隣国が国境管理を要求"
 cartel_event.30.d: "After a recent cartel border crossing from our country into the nation of [FROM.GetName], our neighbour has demanded that we increase our border security. So far, this has led to many arguments within our diplomatic office."
 cartel_event.30.a: "よし、警備を強化しよう。"
 cartel_event.30.b: "向こうが国境警備を強化すればいいのでは？"
 cartel_event.31.t: "隣国が要求に同意"
 cartel_event.31.d: "隣国である[FROM.GetName]は、我々の要求である国境管理の強化を受け入れた。間違いなく、我々の支持基盤はこの勝利を大いに喜ぶだろう。"
 cartel_event.31.a: "素晴らしい。"
 cartel_event.32.t: "隣国が我々の要求を無視"
 cartel_event.32.d: "我々の隣国である[FROM.GetName]は、国境管理の強化という我々の要求を無視した。我々の政治的失敗は、すでにニュースで非難されている。"
 cartel_event.32.a: "残念だ。"
 cartel_event.33.t: "寡頭勢力に関係する不審な送金"
 cartel_event.33.d: "最近の調査の中で、国内の特定の寡頭勢力の資金から、疑わしいものの違法ではない送金を発見した。この送金を利用して、彼らを最近の調査に関連付けることは容易だろう。しかし、そのような行き過ぎた行為は、国内外の寡頭勢力を怒らせることは間違いない。"
 cartel_event.33.a: "資産を差し押さえよ。"
 cartel_event.33.b: "放っておけ。"
 cartel_event.34.t: "カルテルの戦車を発見"
 cartel_event.34.d: "最近のカルテルへの襲撃が失敗した際、カルテルが戦車を運用しているのが確認された。その戦車は大幅に改造されたソ連製Tー34のようで、主砲の発射も可能だった。"
 cartel_event.34.a: "それについて何とかすべきだ。"
 cartel_event.35.t: "カルテルの戦車を破壊"
 cartel_event.35.d: "最近のカルテル目標への襲撃で成功を収めた際、我々の部隊は、以前の失敗時に目撃されたTー34を発見し、破壊することに成功した。この勝利は、特に対戦車兵器を使用せずに達成されたため、大きく報じられている。"
 cartel_event.35.a: "神と我々の勇敢な隊員たちに感謝を。"
 cartel_event.36.t: "カルテルの戦車による攻撃"
 cartel_event.36.d: "最近の襲撃の報復として、カルテルが我々の警察署の一つを攻撃した。彼らは、最近目撃されたTー34を使用してフェンスを破壊し、建物内に無差別発砲を行い、建物を完全に破壊した。この事件により多数の犠牲者が出ており、事態は全国ニュースで報じられている。"
 cartel_event.36.a: "それについて何とかすべきだ。"
 cartel_event.37.t: "輸送用ペーパーカンパニー"
 cartel_event.37.d: "While evaluating the assets of one of the companies we seized recently, it was noticed that one had been registered with a large number of former military 6x6 trucks. After a short search, the vehicles were located in a warehouse owned by the company. The vehicles are now commonly used on farms and in a variety of other industries but are also still used in some legacy roles within our military."
 cartel_event.37.a: "軍の装備として再利用せよ。"
 cartel_event.37.b: "トラックを民間企業に再販せよ。"
 cartel_event.38.t: "犯罪王の誤認逮捕"
 cartel_event.38.d: "最近、下級レベルのカルテルメンバーだけを対象とした逮捕作戦の中で、偶然にも大物犯罪者を逮捕していたことが判明した。当初、彼は身元を隠していたが、彼のことを知る警官によって正体が暴かれた。現在、彼は釈放を要求し、莫大な保釈金を支払う意向を示している。"
 cartel_event.38.a: "ああ、もちろん、これも計画のうちだ。"
 cartel_event.38.b: "これは失礼しました、どうぞお許しを。"
 cartel_event.39.t: "当局、薬物農園を発見"
 cartel_event.39.d: "During a routine patrol in our nation's countryside, a local police force stumbled across what they believe to be a drug plantation. Following protocol, they've sent the news up the chain and are now awaiting reinforcements or advisement on what to do."
 cartel_event.39.a: "農園を焼き払い、設備を破壊する。"
 cartel_event.39.b: "証拠品や設備を押収する。"
 cartel_event.39.c: "農園には手を触れず放置する。"
 cartel_event.40.t: "匿名の密告"
 cartel_event.40.d: "脆弱なカルテルの前哨基地に関する匿名の情報提供を受けた。迅速に行動すれば、その拠点を制圧できるかもしれない。しかし、これはカルテルが我々をおびき寄せ、待ち伏せを仕掛けるための罠や悪戯である可能性もある。"
 cartel_event.40.a: "情報を信じて行動する。どんな機会も本物だ！"
 cartel_event.40.b: "情報を無視する。悪戯の可能性が高い。"
 cartel_event.41.t: "Local Businesses Cooperate with Cartels"
 cartel_event.41.d: "我が国の外れにある町のいくつかの企業が、カルテルと協力していることが明らかになった。中には、堂々と協力している例もある。この状況を放置すれば、政府が統治する意思も能力もないという明確なメッセージを国民に送ることになる。一方、カルテルに対しては、彼らの権威を認めているというメッセージを送ることになる。"
 cartel_event.41.a: "企業の経営者を行動について厳しく叱責する。"
 cartel_event.41.b: "この活動を見て見ぬふりをする。"
 cartel_event.42.t: "コングロマリットが密輸品を隠匿"
 cartel_event.42.d: "It has recently come to us through a tip that many of our largest businesses have been allowing the cartels to use their warehouses to store contraband. While this may be a sign of blatant corruption, a chance exists that it was the result of blackmailing. In either case, some kind of response from us is necessary. Otherwise, the tipper is likely to go to the news."
 cartel_event.42.a: "Seize the warehouses and fine the conglomerates!"
 cartel_event.42.b: "密輸品を押収し、企業に軽い処罰を与える。"
 cartel_event.42.c: "今や周知の事実だ。"
 cartel_event.43.t: "腐敗した公職者"
 cartel_event.43.d: "We have recently received an anonymous tip which led to a short investigation into one of our local politician's campaign investments. The investigation revealed that most of the campaign funds had been sourced from individuals and companies tied to cartel activities. Many signs in the investigation also point towards an intricate web of appointees, investors, and political allies."
 cartel_event.43.a: "可能な限り多くの者を公職から解任せよ。我々はこれを容認できない。"
 cartel_event.43.b: "民間人からの選挙資金は我々の関知するところではない。"
 cartel_event.44.t: "港湾当局が密輸品を発見"
 cartel_event.44.d: "我が国の主要な港の一つで、港湾当局が定期検査中に密輸品でいっぱいの輸送コンテナを発見した。プロトコルに従って、彼らは一時的に船を差し押さえ、それをどうするかの決定を我々に委ねている。"
 cartel_event.44.a: "麻薬取引に協力したとして船を押収する。"
 cartel_event.44.b: "コンテナを押収する。それが唯一の違法なものだ。"
 cartel_event.44.c: "これを見逃そう。ビジネスはビジネスだ。"
 cartel_event.45.t: "銀行家たちの見て見ぬふり"
 cartel_event.45.d: "匿名の情報提供により、複数の高位の銀行家がカルテル活動を見て見ぬふりをしており、時にはそれに加担しているとの疑惑が浮上した。この情報を基に何もしなければ、情報提供者がこれを報道機関にリークする可能性が高い。"
 cartel_event.45.a: "該当する銀行家を逮捕し、調査を開始せよ。"
 cartel_event.45.b: "我々には手に負えない……"
 cartel_event.46.t: "魅力的なカルテルの賄賂"
 cartel_event.46.d: "我々の政治組織の何人かが最近、興味深い提案を受けた。我々がカルテルを他の利益団体と同様に扱い、彼らが望むように活動する余地を与えれば、いくつかの重要な今後の選挙に資金を提供するというものだ。イデオロギー的により柔軟な者たちは、指針を求めて我々を見ている。"
 cartel_event.46.a: "もちろん！我々はそのような重要な利益団体と協力できることを嬉しく思う。"
 cartel_event.46.b: "とんでもない！彼らは人々の最善の利益を代表していない。"
 cartel_event.47.t: "悪魔との取引"
 cartel_event.47.d: "我が国の政治体制の中で高位にある数名が、国内最大級のカルテルの幹部たちとの会合に招待された。会合の中で、カルテル幹部たちは彼らの意図を明確にした。彼らは敵対する必要はなく、むしろ政治的な同盟者になれるというのだ。すでに協力の見返りとして莫大な利益を提示しており、提携が続けばさらに多くの見返りを約束している。"
 cartel_event.47.a: "政府を機能させるためには税金が重要なのだ。"
 cartel_event.47.b: "あんな悪党どもに足掛かりを与えるわけにはいかない"
 cartel_event.48.t: "麻薬取引の規制"
 cartel_event.48.d: "複数の大規模カルテルが最近、利益率を圧迫し始めた非カルテル犯罪の削減に向けた協力を提案した。その見返りとして、関連企業によるより正確な利益報告への協力と、 取引の「人道的」な実施を提示している。"
 cartel_event.48.a: "厳格に規制された国家-カルテル協力を交渉する。"
 cartel_event.48.b: "緩やかに規制された国家-カルテル協力を交渉する。"
 cartel_event.48.c: "我々は犯罪者と交渉しない。"
 cartel_event.49.t: "若者の信頼喪失"
 cartel_event.49.d: "One of the most malleable subsets of our population are our youth, and the state of our nation with the cartels has begun to turn them against our political establishment. While surveys indicate many plan to leave once they are capable of doing so, those who plan on staying seem intent on voting against us in the next election. We attempt an outreach program to try to channel the most energetic among them into fixing their home country with us."
 cartel_event.49.a: "働きかけプログラムを通じて手を差し伸べる。"
 cartel_event.49.b: "彼らの自己憐憫に浸らせておけ。我々には必要ない。"
 cartel_event.53.t: "カルテルの報復攻撃"
 cartel_event.53.d: "In the aftermath of one of our recent raids, the cartels made a retaliatory strike against one of our police stations. They managed to breach the perimeter and chase our officers out of town, leaving a trail of destruction in their wake. This has led to a number of casualties while the incident has reached the national news."
 cartel_event.53.a: "不運だ。"
 cartel_event.54.t: "カルテルの報復攻撃の失敗"
 cartel_event.54.d: "最近の襲撃の報復として、カルテルが我々の警察署の一つを攻撃した。警察官たちは勇敢に持ちこたえ、わずかな犠牲者を出すにとどめた。数時間後には増援が到着し、カルテルを追い散らすことに成功した。この事件は全国ニュースでカルテルへの反発を強める象徴的な出来事として取り上げられている。"
 cartel_event.54.a: "素晴らしい。"
 cartel_event.55.t: "カルテルによるヘリコプター撃墜"
 cartel_event.55.d: "During a recent raid, one of our police helicopters was shot down by the cartels. A review of the incident has revealed that a stray bullet struck the pilot in the neck, leading to the catastrophic crash as the co-pilot failed to regain control in time. Losing such an important piece of equipment, not to mention its crew, is a shame."
 cartel_event.55.a: "不運だ。"
 cartel_event.56.t: "カルテル処刑の生存者"
 cartel_event.56.d: "善き市民に発見され病院に急送された一人の男性が、我が国のカルテル蔓延地域の一つから来ており、今や死の床となるかもしれないところに横たわっている。しかし、我々は彼を助ける機会を与えられている。彼はより良い施設を持つ病院に移される必要があり、近くの軍用ヘリコプターの一機になら達成できる。"
 cartel_event.56.a: "彼は我々の新しいエル・フシラドになるだろう！"
 cartel_event.56.b: "我々の医師が彼を救えなかったのは残念だ……"
 cartel_event.50.t1: "カジノ調査の成功"
 cartel_event.50.d1: "数週間にわたる計画と監視の末、警察は国内のカジノの一つに踏み込み、数百万ドルもの不正資金を押収し、重要な物的証拠を収集、さらにカルテルのマネーロンダリング計画の主要関係者を逮捕した。収集された証拠を基に、カジノとその運営者に関連するすべての合法的な資産を凍結した。この一撃で、カルテルの重要なインフラを破壊し、利用可能な資金を蓄積する能力を大きく妨害した。"
 cartel_event.50.t2: "銀行調査の成功"
 cartel_event.50.d2: "数週間にわたる資金移動の監視と待機の末、今日、カルテルのマネーロンダリング計画に関与していた6社と複数の個人の資産を凍結した。逮捕状が発行され、一部の企業と下級政治家や官僚との間の疑わしい取引について複数の小規模な調査が開始された。カルテルは時間とともに立ち直るだろうが、一度にこれほどの損失を被ることは、彼らのインフラに大きな打撃を与えるだろう。"
 cartel_event.50.t3: "ペーパーカンパニー調査の成功"
 cartel_event.50.d3: "数週間にわたる調査の末、複数の疑わしい企業を閉鎖し、その過程で資産を差し押さえた。押収した現金はごくわずかだったが、大量の不動産、民間車両、その他の物品を押収した。この措置は、カルテルのマネーロンダリング計画に打撃を与えるだけでなく、彼らが全体の活動を維持する能力にも大きなダメージを与えるだろう。"
 cartel_event.50.t4: "カジノ調査の失敗"
 cartel_event.50.d4: "In spite of our best efforts, our analysts have been unable to draw a connection between the cartels and the casino upon which our investigation has fallen. What's worse, people have started asking questions about where the money used in the investigation has been going, leading to successful political attacks on our candidates by the opposition. To add further insult to injury, the cartels continue their operations unimpeded."
 cartel_event.50.t5: "銀行調査の失敗"
 cartel_event.50.d5: "数週間にわたり、我々の捜査官がコンピューターにかじりつき銀行取引を監視してきたにもかかわらず、カルテルに打撃を与える明確な機会を見つけることはできなかった。さらに悪いことに、調査に使用された資金の使途について疑問が持たれ始め、それが野党による我々の候補者への効果的な政治攻撃につながった。追い打ちをかけるように、カルテルはその活動を妨げられることなく続けている。"
 cartel_event.50.t6: "ペーパーカンパニー調査の失敗"
 cartel_event.50.d6: "In spite of the time and money funnelled into our investigations, all we've uncovered are divorce-security funds and liability protection schemes. What's worse, in the process we have managed to step on the toes of just enough people to have our investigation exposed on the national news. Such an embarrassment has more than likely damaged our future election prospects. To add further insult to injury, the cartels continue their operations unimpeded."
 cartel_event.50.a: "調査完了"
 cartel_event.51.t1: "麻薬輸送隊襲撃の成功"
 cartel_event.51.d1: "最近、既知の麻薬ルートへの攻撃で、数百キログラムの麻薬を押収し、複数の下級カルテルメンバーを逮捕、さらには複数の民間車両を差し押さえることに成功した。犠牲者はわずかで済んだ。この成果は一時的に取引を停止させるには十分だが、十分に規模の大きいカルテルであれば、これらの損失を容易に吸収できるだろう。"
 cartel_event.51.t2: "カルテル隠れ家襲撃の成功"
 cartel_event.51.d2: "最近、既知のカルテルの拠点に対する攻撃で、数十人のカルテルメンバーを殺害または逮捕し、さらに使用可能な軍事装備や即席の武器をいくつか押収または破壊することに成功した。この打撃は、他の組織が一時的な弱体化を利用しようとする連鎖的な影響を引き起こす可能性がある。"
 cartel_event.51.t3: "流通施設襲撃の成功"
 cartel_event.51.d3: "最近、既知の流通施設への襲撃で、数十万ドル相当の不正資金と麻薬を押収することに成功した。また、この場所に関与する多数の麻薬密売人を逮捕し、市場に麻薬を流通させて利益を得る能力を大幅に削いだ。ただし、この成功にもかかわらず、報復攻撃の可能性には注意を払うべきだ。"
 cartel_event.51.t4: "麻薬精製所襲撃の成功"
 cartel_event.51.d4: "最近、既知の精製施設への襲撃で、数十万ドル相当の設備と麻薬を破壊することに成功した。また、精製作業に関与していた多くの人物を逮捕し、将来的な麻薬生産においてカルテルに不利をもたらした。ただし、この成功にもかかわらず、報復攻撃の可能性には注意を払うべきだ。"
 cartel_event.51.t5: "麻薬輸送隊襲撃の失敗"
 cartel_event.51.d5: "最近、既知の麻薬ルートへの襲撃を試みたが、我々の部隊は圧倒され、撤退を余儀なくされた。その際、複数の犠牲者を残してしまった。この出来事に関する情報はすでに公に漏れており、政府への信頼が低下している。我々は報復攻撃の可能性に注意を払うべきだ。"
 cartel_event.51.t6: "カルテルの隠れ家襲撃の失敗"
 cartel_event.51.d6: "最近、既知のカルテルの拠点への襲撃を試みたが、我々の部隊は圧倒され、撤退を余儀なくされた。その際、複数の犠牲者を残してしまった。この出来事に関する情報はすでに公に漏れており、政府への信頼が低下している。我々は報復攻撃の可能性に注意を払うべきだ。"
 cartel_event.51.t7: "流通施設襲撃の失敗"
 cartel_event.51.d7: "最近、既知のカルテルの流通施設への襲撃を試みたが、我々の部隊は圧倒され、撤退を余儀なくされた。その際、複数の犠牲者を残してしまった。この出来事に関する情報はすでに公に漏れており、政府への信頼が低下している。また、関係者はすでに全員散り散りになっている。我々は報復攻撃の可能性に注意を払うべきだ。"
 cartel_event.51.t8: "麻薬精製所襲撃の失敗"
 cartel_event.51.d8: "最近、既知のカルテルの精製施設への襲撃を試みたが、我々の部隊は圧倒され、撤退を余儀なくされた。その際、複数の犠牲者を残してしまった。この出来事に関する情報はすでに公に漏れており、政府への信頼が低下している。我々は報復攻撃の可能性に注意を払うべきだ。"
 cartel_event.51.a: "襲撃完了"
 cartel_event.52.t: "カルテルの終焉"
 cartel_event.52.d: "何十年もの闘争と多くの犠牲の後、我々は我が国からカルテルの残党を根絶した。しかし、まだ彼らの影響から抜け出せたわけではない。地域の他の国々はまだ怪物の支配に苦しんでおり、今や我々は怪物狩りの豊富な専門知識を持っている。"
 cartel_event.52.a: "これは[ROOT.GetName]にとって新しい時代の幕開けだ。"
 cartel_event.100.t: "[FROM.GetName]がカルテルを撃退"
 cartel_event.100.d: "News has breached from [FROM.GetName] as they have succeeded against their cartels. Stability and peace have returned to the region."
 cartel_event.100.a: "新しい市場か？"
 cartel_event.100.b: "[FROM.GetName]の安定"
