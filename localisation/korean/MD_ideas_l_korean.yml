 entry_to_china: "중국으로의 관문"
 entry_to_china_desc: "홍콩은 중국 본토와 서방 사이에서 독특한 관계를 맺고 있습니다. 영국으로부터 중국으로 반환되면서 서구의 관습과 사업 관행이 유입되었습니다. 덩샤오핑의 개혁 이전에는 홍콩이 중국에서 외국 투자가 들어올 수 있는 유일한 곳이었습니다.\n\n현재 변화가 일어나고 있으며 홍콩은 한때 누렸던 독보적인 지위를 잃을 위기에 처해 있습니다. 그럼에도 불구하고 홍콩 증시는 여전히 다른 많은 아시아 증시들의 부러움을 사고 있습니다."
 full_control_of_panama: "파나마 운하 당국"
 full_control_of_panama_desc: "The PCA (Autoridad del Canal de Panamá) is the agency of the government of Panama responsible for the operation and management of the Panama Canal. Through fees and other operations the state has access to a steady income. Its strategic importance can also not be underestimated."
 full_control_of_panama_tt: "Additional Income: $$§G[?additional_income_panama|+3]§!, scaling with world GDP"
 asian_tigers_legacy: "아시아의 네 마리 호랑이의 유산"
 asian_tigers_legacy_desc: "한국, 대만, 싱가포르, 홍콩의 네 경제는 지난 세기 후반에 전례 없는 성장을 경험했습니다. 이들 국가의 기업들은 시장과 국가 개입의 결합을 통해 급속도로 발전하는 경제를 만들어냈습니다.\n\n그들의 전성기는 1997년 아시아 금융 위기 이후 갑자기 막을 내렸습니다. 하지만 위기를 겪은 다른 국가들과 달리, 그들의 경제는 여전히 비교적 생산적입니다."
 asian_crisis: "1997 아시아 금융 위기"
 asian_crisis_desc: "The economic crisis that gripped developing East and Southeast Asia threw decades of growth down the drain. The Loss of confidence in the national currencies still plagues the central banks to this day. Public and private debt has also skyrocketed.\n\nPainful lessons were learned, past unwanted economic reforms are in full swing. Each country was hit differently and each has its own solutions.\n\nThe influx of investments to the affected countries was once half of the total sum in the world, but now it goes to [CHI.GetFlag]China and elsewhere."
 int_investment_china: "몰리는 국제 투자"
 int_investment_china_desc: "아시아 경제 위기 이후 투자자들은 투자처를 다른 시장으로, 주로 우리 시장으로 돌렸습니다.\n§W--------------§!\n이 국가 정신은 우리가 §H전쟁§! 중이면 §R제거§!됩니다."
 low_level_of_aids: "낮은 에이즈 유병률"
 low_level_of_aids_desc: "5%에서 10% 가량의 국민들이 에이즈와 접촉하였습니다. 치명적인 질병으로써, 이를 겪는 이들에게는 삶에 심각한 악영향을 줄 수 있으며, 결과적으로 평소와 같은 생활을 하기 매우 어려워질 것입니다. 에이즈에 대응하는 것은 매우 더딘 과정이며, 유일한 해결 방법은 지속적으로 높은 수준의 의료 복지를 제공하며 투병 환자들을 줄이고 질병에 대해 교육함으로써 에이즈로 인한 진통을 줄여나가는 방법 밖에 없습니다.\n\n[HIV_healthcare_tooltip]"
 rising_level_of_aids: "증가하는 에이즈 유병률"
 rising_level_of_aids_desc: "10%에서 15% 가량의 국민들이 HIV와 접촉하였습니다. 치명적인 질병으로써, 이를 겪는 이들에게는 삶에 심각한 악영향을 줄 수 있으며, 결과적으로 평소와 같은 생활을 하기 매우 어려워질 것입니다. HIV에 대응하는 것은 매우 더딘 과정이며, 유일한 해결 방법은 지속적으로 높은 수준의 의료 복지를 제공하며 투병 환자들을 줄이고 질병에 대해 교육함으로써 HIV로 인한 진통을 줄여나가는 방법 밖에 없습니다.\n\n[HIV_healthcare_tooltip]"
 high_level_of_aids: "높은 에이즈 유병률"
 high_level_of_aids_desc: "15%에서 20% 가량의 국민들이 에이즈와 접촉하였습니다. 치명적인 질병으로써, 이를 겪는 이들에게는 삶에 심각한 악영향을 줄 수 있으며, 결과적으로 평소와 같은 생활을 하기 매우 어려워질 것입니다. 에이즈에 대응하는 것은 매우 더딘 과정이며, 유일한 해결 방법은 지속적으로 높은 수준의 의료 복지를 제공하며 투병 환자들을 줄이고 질병에 대해 교육함으로써 에이즈로 인한 진통을 줄여나가는 방법 밖에 없습니다.\n\n[HIV_healthcare_tooltip]"
 very_high_level_of_aids: "매우 높은 에이즈 유병률"
 very_high_level_of_aids_desc: "20%에서 25% 가량의 국민들이 에이즈와 접촉하였습니다. 치명적인 질병으로써, 이를 겪는 이들에게는 삶에 심각한 악영향을 줄 수 있으며, 결과적으로 평소와 같은 생활을 하기 매우 어려워질 것입니다. 에이즈에 대응하는 것은 매우 더딘 과정이며, 유일한 해결 방법은 지속적으로 높은 수준의 의료 복지를 제공하며 투병 환자들을 줄이고 질병에 대해 교육함으로써 에이즈로 인한 진통을 줄여나가는 방법 밖에 없습니다.\n\n[HIV_healthcare_tooltip]"
 critical_level_of_aids: "치명적인 에이즈 유병률"
 critical_level_of_aids_desc: "20%에서 25% 가량의 국민들이 에이즈와 접촉하였습니다. 치명적인 질병으로써, 이를 겪는 이들에게는 삶에 심각한 악영향을 줄 수 있으며, 결과적으로 평소와 같은 생활을 하기 매우 어려워질 것입니다. 에이즈에 대응하는 것은 매우 더딘 과정이며, 유일한 해결 방법은 지속적으로 높은 수준의 의료 복지를 제공하며 투병 환자들을 줄이고 질병에 대해 교육함으로써 에이즈로 인한 진통을 줄여나가는 방법 밖에 없습니다.\n\n[HIV_healthcare_tooltip]"
 HIV_healthcare_tooltip_01: "매년마다 우리 나라의 에이즈 상황에 대한 보고를 받을 것입니다. §Y의료 비용§!이 높을 수록, 상황이 더 완화될 가능성이 높아집니다.\n\n현재 예상 수치:\n§Y50%§!: §R상황 악화중§!\n§Y50%§!: §W현상 유지중§!\n§Y0%§!: §G상황 완화중§!"
 HIV_healthcare_tooltip_02: "매년마다 우리 나라의 에이즈 상황에 대한 보고를 받을 것입니다. §Y의료 비용§!이 높을 수록, 상황이 더 완화될 가능성이 높아집니다.\n\n현재 예상 수치:\n§Y40%§!: §R상황 악화중§!\n§Y50%§!: §W현상 유지중§!\n§Y10%§!: §G상황 완화중§!"
 HIV_healthcare_tooltip_03: "매년마다 우리 나라의 에이즈 상황에 대한 보고를 받을 것입니다. §Y의료 비용§!이 높을 수록, 상황이 더 완화될 가능성이 높아집니다.\n\n현재 예상 수치:\n§Y30%§!: §R상황 악화중§!\n§Y50%§!: §W현상 유지중§!\n§Y20%§!: §G상황 완화중§!"
 HIV_healthcare_tooltip_04: "매년마다 우리 나라의 에이즈 상황에 대한 보고를 받을 것입니다. §Y의료 비용§!이 높을 수록, 상황이 더 완화될 가능성이 높아집니다.\n\n현재 예상 수치:\n§Y20%§!: §R상황 악화중§!\n§Y50%§!: §W현상 유지중§!\n§Y30%§!: §G상황 완화중§!"
 HIV_healthcare_tooltip_05: "매년마다 우리 나라의 에이즈 상황에 대한 보고를 받을 것입니다. §Y의료 비용§!이 높을 수록, 상황이 더 완화될 가능성이 높아집니다.\n\n현재 예상 수치:\n§Y10%§!: §R상황 악화중§!\n§Y50%§!: §W현상 유지중§!\n§Y40%§!: §G상황 완화중§!"
 HIV_healthcare_tooltip_06: "매년마다 우리 나라의 에이즈 상황에 대한 보고를 받을 것입니다. §Y의료 비용§!이 높을 수록, 상황이 더 완화될 가능성이 높아집니다.\n\n현재 예상 수치:\n§Y0%§!: §R상황 악화중§!\n§Y50%§!: §W현상 유지중§!\n§Y50%§!: §G상황 완화중§!"
 developmentalism: "발전주의"
 developmentalism_desc: "개발주의는 개발도상국의 경제를 발전시키는 가장 좋은 방법은 높은 관세를 가진 강력하고 다양한 국내 시장을 구축하는 것이라고 주장하는 경제 이론입니다."
 revanchism: "보복주의"
 revanchism_desc: "복수주의는 한 국가가 과거에 잃었던 영토를 되찾고자 하는 의지를 나타내는 용어입니다. 알자스-로렌 지방을 잃은 후 프랑스에서 널리 퍼진 복수주의는 오늘날에도 많은 국가의 정치에서 중요한 요소로 작용하고 있습니다."
 peaceful_emergence: "평화적 부상"
 peaceful_emergence_desc: "서로 다른 세계관을 가지고 있다 하더라도, 우리는 기존 질서에 적대감을 가져서는 안 되며, 오히려 외교와 경제를 통해 서서히 세상을 변화시켜 나가야 합니다."
 generic_non_aligned_boost_idea: "비동맹의 부상"
 political_autonomy: "정치적 자치"
 political_autonomy_desc: "한 나라가 직면하는 가장 큰 위험 중 하나는 외국의 영향력 아래에 놓이는 것입니다. 우리는 어떤 대가를 치르더라도 이를 피해야 하며, 언제나 우리만의 길을 갈 수 있는 기회를 가져야 합니다."
 economic_autonomy: "경제적 자치"
 economic_autonomy_desc: "한 나라에 닥친 가장 큰 위험 중 하나는 우리 경제를 외국 세력에 넘겨주는 것입니다. 우리 국민은 그들이 억압하도록 내버려둘 대상이 아니라, 우리 자신의 국민입니다."
 flexible_diplomacy: "유연한 외교"
 flexible_diplomacy_desc: "어떤 나라든 우리의 동맹국이 될 수도 있고 적국이 될 수도 있습니다. 우리는 높은 곳과 낮은 곳 모두를 살펴봐야 합니다."
 national_identity_focus: "국가 정체성 중심"
 national_identity_focus_desc: "우리 국민은 공통의 역사와 조상을 공유합니다. 우리는 하나이며 분리되어 있지 않다는 생각을 강조해야 하며, 필요하다면 그러한 생각을 만들어내야 합니다."
 patriotism_focus: "애국주의 중심"
 patriotism_focus_desc: "애국심이란 국적과 상관없이 국가에 대한 충성심을 의미합니다. 국민이 하나로 뭉칠 수 있는 국기가 있다면 우리는 더욱 강해질 것입니다."
 civic_nationalism: "시민 민족주의"
 civic_nationalism_desc: "시민 민족주의는 민족의 통일이 아니라 국가의 통일을 의미합니다. 국가와 법률, 규칙, 제도의 이상을 공유함으로써 다양한 배경을 가진 사람들이 함께 일할 수 있게 됩니다."
 autarchy_focus: "자급 경제주의 중심"
 autarchy_focus_desc: "자급자족이란 국가가 정치적, 경제적으로 자급자족할 수 있는 상태를 의미합니다. 스스로 생존할 수 있도록 함으로써 외부 영향에 덜 취약해질 수 있습니다."
 assertive_emergence: "적극적인 부상"
 assertive_emergence_desc: "낡은 질서는 필요하다면 무력으로라도 무너뜨려야 한다. 타락한 서구는 우리가 세계 무대에서 마땅히 차지해야 할 자리를 영원히 가로막을 것이다."
 isis_allegiance: "이슬람 국가에 대한 충성 약속"
 isis_allegiance_desc: "이슬람국가는 적들에 대한 신속한 승리와 정복을 통해 그들이 올바른 길을 걷고 있음을 증명했습니다. 우리는 이슬람 칼리프 국가를 건설하기 위해 그들에게 충성을 맹세해야 합니다."
 ummah_focus: "움마 중심"
 ummah_focus_desc: "모든 무슬림은 혈통이나 출생지와 관계없이 같은 가족에 속합니다. 우리는 그들 모두를 열린 마음으로 공동체에 환영해야 합니다."
 shariah_world: "세계에 샤리아 법을 강요"
 shariah_world_desc: "세상은 퇴폐적이며 변해야 합니다. 이러한 혐오스러운 사상이 더 이상 존재하도록 놔둘 수 없으며, 우리는 행동에 나서야 합니다."
 minority_government: "소수 정부"
 minority_government_desc: "우리 정부는 현재 소수 정부로 운영되고 있어 모든 정치적 행동이 매우 어렵습니다."
 open_nation_desc: "권위주의가 지난 수십 년간 우리나라에 이바지했으나, 이제는 우리를 둘러싼 세계에 적응해야 합니다. 세계화된 21세기에 우리는 세계에 문을 열고 국내 정치를 자유화하는 것 외에는 할 수 있는 일이 거의 없습니다."
 open_nation_finish: "자유주의 정부"
 open_nation_finish_desc: "우리 국민은 자신을 표현하고, 정치 과정에 참여하며, 다양한 정보원에 기반하여 스스로 견해를 형성할 자유를 누릴 자격이 있습니다."
 censored_nation_desc: "우리 국민을 세계로부터 완전히 차단하고 집단적으로 세뇌하는 것이 현실적이지 않음을 인정하지만, 그들이 접하는 것을 여전히 통제하고 조정해야 합니다. 정치적 발언에 지나치게 느슨하게 접근한 탓에 어떤 불안 요인이든 국민의 안전을 위협할 수 있는 체제에서 국민은 진정으로 자유로울 수 없습니다."
 CHI_promoting_innovation: "혁신 추진"
 CHI_improving_rd: "R&D 개발"
 CHI_dominant_tech_industry: "중국의 기술 우세"
 coalition_western: "친서방 연립 파트너"
 coalition_emerging: "신흥국 연립 파트너"
 coalition_non_alligned: "비동맹 연립 파트너"
 coalition_salafist: "살라피스트 연립 파트너"
 coalition_nationalist: "국가주의 연립 파트너"
 SWE_idea_overhalling_our_university_system: "Overhauling Our University System"
 research_idea_1: "연구의 진보"
 PER_aor_advice: "저항 추축국 지원"
 water_shortages_desc: "남부에 상당한 수자원이 있음에도 불구하고 중국은 훨씬 건조한 북부에서 광범위한 물 부족을 겪고 있습니다. 급속한 산업화로 인한 오염은 현존하는 물까지 오염시켜 중국의 물 부족을 악화시켰습니다."
 CHI_cepc: "원형 전자-양전자 충돌기 (CEPC)"
 CHI_cepc_desc: "CEPC는 앞서 언급한 물리학 프로그램을 탐구하기 위해 중국 입자물리학계가 제안한 대규모 국제 과학 시설입니다. 둘레가 80킬로미터(49.70마일)에 달하여 맨해튼 섬 전체를 에워쌀 수 있습니다."
 CHI_space_marines_idea: "우주 해병대"
 CHI_space_marines_idea_desc: ""
 generic_centralization: "중앙집권화"
 generic_centralization_desc: "국가의 중앙집권화는 방대한 우리나라를 유지하는 데 도움이 될 것입니다. 국가를 중앙집권화하면 추가적인 정치적 자본도 얻을 수 있으며, 정치적 자본 증가와 더불어 세수도 일부 늘어날 것입니다."
 generic_decentralization: "지방분권"
 generic_decentralization_desc: "국가를 지방분권화하고 불필요한 규제를 없애면 전체 관료제 비용이 줄고 추가적인 건설 성장이 장려될 것입니다."
 railway_construction_effort: "철도 건설 주력"
 railway_construction_effort_desc: "철도는 모든 나라의 생명선입니다. 넓은 땅을 가로질러 물자를 수송하는 데는 이것이 가장 쉽고 비용 효율적인 방법입니다. 철도에 투자하는 것은 순이익이 될 수밖에 없습니다."
 neighbor_effect_modifiers: "주변국이 미치는 영향"
 iranian_aid_custom: "이란 지원"
 iranian_aid_custom_desc: "이란이 군사적, 경제적 원조를 제공합니다. 이는 정부와 군대 운영 비용을 줄여 주지만, 이란은 이 원조를 이용해 우리의 정치에 영향을 미치려 하기도 합니다."
 CHI_new_boundary: "새로운 국경"
 mp_optimization_idea: "MP AI Optimization"
 mp_optimization_idea_desc: "AI가 이상한 행동을 하는 것을 방지합니다."
 PER_learn_from_the_holy_defence_idea: "신성한 방어의 교리"
 PER_learn_from_the_holy_defence_idea_tt: "민병대로부터의 경험치: §G+20%§!"
