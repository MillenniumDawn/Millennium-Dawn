 signed_trade_deal_ast: "Accord commercial signé"
 national_curriculum_project_ast: "Projet de programme scolaire national"
 national_curriculum_project_ast_desc: "Un investissement et une refonte nationaux de notre système éducatif, visant à porter les écoles rurales au même standard national que celles des villes, par des financements ciblés et des ajustements de programmes."
