 investments_construction_offices: "§Y사무 부문§!\n사무 부문은 채굴업과 중공업을 제외한 경제의 모든 다른 산업을 나타냅니다. 여기에는 금융, 고객 서비스, 정보 기술, 소매 서비스 등이 포함됩니다.\n\n§Y구조물당 기본 비용:§! §R$[?global.build_cost_array^5|3]§! 십억"
 investments_construction_offices_delayed: "§Y전제 조건§!:\n[!select_office_button_click_enabled]"
 investments_construction_AA: "§Y단거리 대공 방어 거점§!\n§Y단거리 대공 방어 거점§!(SHORAD, Short Range Air Defense)은 저고도 공중 위협에 대한 방공을 담당하는 대공 무기 및 전술의 복합 시설과 집단입니다. 이 거점들은 공역을 방어 가능한 구역으로 나누어 협력하며, 헬리콥터에서 저공 비행 항공기와 제트기에 이르는 모든 위협으로부터 지역 군사 목표물과 기반시설에 대한 방공 엄호를 제공합니다.\n\n§Y구조물당 기본 비용:§! §R$[?global.build_cost_array^6|3]§! 십억"
 investments_construction_AA_delayed: "§Y전제 조건§!:\n[!select_antyair_button_click_enabled]"
 investments_construction_RAD: "§Y레이더 기지§!\n레이더 기지를 통해 인근 주에 있는 적 부대에 대한 정보를 얻을 수 있습니다. 다양한 레이더와 센서, 정보 자산, 그리고 변화하는 상황을 분석할 수 있는 역량으로 구성됩니다.\n레벨이 높을수록 유효 사정거리가 늘어납니다.\n또한 레이더는 해당 주의 적 공군 탐지 능력을 높여 아군 항공기가 적기와 교전할 가능성을 높여 줍니다.\n이에 더해 레이더는 해상의 적 함대 탐지 능력도 높여 줍니다.\n\n§Y구조물당 기본 비용:§! §R$[?global.build_cost_array^7|3]§! 십억"
 investments_construction_RAD_delayed: "§Y전제 조건§!:\n[!select_radar_button_click_enabled]"
 investments_construction_AIR: "§Y공군 기지§!\n이 건물은 주에 공군 전력을 배치할 수 있는 시설을 제공합니다.\n\n§Y구조물당 기본 비용:§! §R$[?global.build_cost_array^8|3]§! 십억"
 investments_construction_AIR_delayed: "§Y전제 조건§!:\n[!select_airbase_button_click_enabled]"
 investments_construction_fuel_silo: "§Y전략 자원 비축고§!\n이 건물은 국가가 §H연료§!를 더 많이 비축할 수 있는 공간을 제공합니다.\n\n§Y구조물당 기본 비용:§! §R$[?global.build_cost_array^9|3]§! 십억"
 investments_construction_fuel_silo_delayed: "§Y전제 조건§!:\n[!select_strategic_resource_reserve_button_click_enabled]"
 investments_construction_internet_station: "§Y네트워크 기반시설§!\n네트워크 기반시설은 원거리 또는 지하 광케이블과 클라우드 컴퓨팅 시스템을 통해 전송 신호를 보내는 데 사용되는 통신 및 무선 통신 분야의 높은 구조물입니다.\n\n§Y네트워크 기반시설§! 한 레벨마다 지역 생산성 성장 속도가 §G+5.00%§! 향상됩니다.\n§Y네트워크 기반시설§! 한 레벨마다 §Y국제 투자§!의 기간이 §G-5.00%§! 감소합니다.\n\n§Y구조물당 기본 비용:§! §R$[?global.build_cost_array^10|3]§! 십억"
 investments_construction_internet_station_delayed: "§Y전제 조건§!:\n[!select_internet_button_click_enabled]"
 investments_construction_REF: "§Y재생 에너지 기반시설§!\n재생 에너지 기반시설은 모든 재생 에너지원을 아우르는 포괄적 개념입니다. 여기에는 태양광 단지, 풍력 터빈, 바이오연료 정제소, 숯 공장, 바이오연료 발전소 등이 포함되나 이에 국한되지 않습니다. 이처럼 재생 가능한 자원을 이용하며, 그 자원으로 연료를 생산합니다.\n\n§Y구조물당 기본 비용:§! §R$[?global.build_cost_array^11|3]§! 십억"
 investments_construction_REF_delayed: "§Y전제 조건§!:\n[!select_renewable_power_plant_button_click_enabled]"
 investments_construction_POWER_PLANT: "§Y화석 연료 발전소§!\n화석 연료 발전소는 모든 화석 기반 화력 에너지원을 아우르는 포괄적 개념입니다. 여기에는 석탄, 천연가스, 석유 등이 포함되나 이에 국한되지 않습니다.\n\n§Y구조물당 기본 비용:§! §R$[?global.build_cost_array^12|3]§! 십억"
 investments_construction_POWER_PLANT_delayed: "§Y전제 조건§!:\n[!select_fossil_fuel_power_plant_button_click_enabled]"
 investments_construction_NUCLEAR_REACTOR: "§Y원자로§!\n원자로 건물은 중간 정도로 농축된 우라늄을 소비하여 핵에너지를 전기 에너지로 변환합니다.\n\n§Y구조물당 기본 비용:§! §R$[?global.build_cost_array^13|3]§! 십억"
 investments_construction_NUCLEAR_REACTOR_delayed: "§Y전제 조건§!:\n[!select_nuclear_power_plant_button_click_enabled]"
 investments_construction_agriculture_district: "§Y상업화된 농업 지구§!\n상업화된 농업 지구는 우리나라의 비자급 농업 전반을 아우르는 개념입니다. 농공업, 경작지, 곡물 저장고, 도축장 등이 포함됩니다.\n\n§Y구조물당 기본 비용:§! §R$[?global.build_cost_array^14|3]§! 십억"
 investments_construction_agriculture_district_delayed: "§Y전제 조건§!:\n[!select_agriculture_button_click_enabled]"
