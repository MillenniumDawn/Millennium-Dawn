 FRA_afv_coax_machine_gun: "7,62mm AA-52"
 FRA_afv_coax_machine_gun_desc: "AA-52(프랑스어 정식 명칭: Arme Automatique Transformable Modèle 1952)는 제2차 세계 대전 이후 시기에 프랑스에서 생산된 최초의 총기 중 하나입니다. 프랑스 정부 소유의 생테티엔 무기 제작소(MAS)에서 제조되었습니다."
 FRA_afv_machine_gun: "7,62mm AA-52"
 FRA_afv_machine_gun_desc: "AA-52(프랑스어 정식 명칭: Arme Automatique Transformable Modèle 1952)는 제2차 세계 대전 이후 시기에 프랑스에서 생산된 최초의 총기 중 하나입니다. 프랑스 정부 소유의 생테티엔 무기 제작소(MAS)에서 제조되었습니다."
 FRA_afv_machine_gun_2: "12.7mm M2 브라우닝"
 FRA_small_autocannon_2: "20mm 모델 F2 기관포"
 FRA_big_autocannon_3: "40mm 40 CTC"
 FRA_tank_very_large_cannon: "140mm 아스칼론(ASCALON)"
 FRA_tank_very_large_cannon_desc: "ASCALON(자동 장전 및 확장 가능한 고성능 포)은 넥스터(Nexter)사에서 설계한 프랑스제 50구경장 140mm 활강 전차포입니다."
 FRA_tank_small_medium_cannon: "105mm CN-105-57"
 FRA_tank_small_medium_cannon_desc: "The CN-105-57, also known as CN 105/57 or D1504, is a light French 105 mm tank gun and used by many light tanks"
 FRA_tank_small_medium_cannon_2: "105mm CN-105 F1"
 FRA_tank_small_medium_cannon_2_desc: "Canon de 105 mm modèle F1(또는 CN-105-F1)은 AMX-30 전차에 사용된 프랑스제 105mm 전차포입니다."
 FRA_tank_medium_cannon: "120mm CN120-25"
 FRA_tank_medium_cannon_desc: "Modèle G1(G1 모델)로도 불리는 CN120-25는 프랑스 부르주 기술 연구 제조소(EFAB)에서 수출용으로 설계한 52구경장 프랑스제 120mm 활강 전차포입니다."
 FRA_tank_medium_cannon_2: "120mm CN120-26"
 FRA_tank_medium_cannon_2_desc: "Modèle F1(F1 모델)로도 불리는 CN120-26은 부르주 EFAB에서 설계하고 지아트 인더스트리(Giat Industries)에서 생산한 52구경장 프랑스제 120mm 활강 전차포입니다."
 FRA_tank_small_cannon: "75mm SA 50"
 FRA_tank_small_cannon_desc: "75 SA 50(프랑스어: 75 mm Semi-Automatique Modèle 1950; 한국어: 75mm 반자동 모델 1950)은 75 Mle 50 또는 CN 75-50으로도 불리는 프랑스제 75mm 고속 강선포입니다."
 FRA_tank_small_cannon_2: "90mm CN90 F4 슈퍼 90"
 FRA_tank_small_cannon_desc_2: "It's an evolution of the 90mm gun of the AMX-13/90; it shoots the same ammo but is more accurate"
 FRA_afv_assault_gun: "60mm 브랑트 Mle CM60A1"
 FRA_afv_assault_gun_desc: "브랑트 Mle CM60A1은 브랑트 HB 60LP, MCB-60 HB 또는 단순히 브랑트 60mm LP 포-박격포로도 알려져 있으며, 60mm(2.36인치) 포-박격포입니다."
 FRA_medium_tank_artillery_chassis_0: "105mm 오뷔지에 드 105 모델 1950"
 FRA_medium_tank_artillery_chassis_1: "155mm 카농 GCT 155mm/L39"
 FRA_medium_tank_artillery_chassis_2: "155mm 카농 세자르 155mm/L52"
 FRA_reactive_armor_gen1: "BRENUS"
 ISR_tank_medium_cannon_2: "120mm MG251"
 ISR_tank_medium_cannon_2_desc: "IMI 120mm 포는 이스라엘 군사 산업(IMI)에서 설계 및 생산한 L44 활강 전차포입니다. 흔히 라인메탈 L44 전차포의 면허 생산품으로 오해받지만, 실제로는 M60과 같이 좁은 포탑 마운트를 요구하는 이스라엘 방위군의 메르카바 마크 III 주력 전차의 요구 사항을 충족하기 위해 IMI가 1983년부터 1988년까지 독자적으로 개발한 포입니다."
 ISR_tank_medium_cannon_3: "120mm MG251-LR"
 ISR_tank_medium_cannon_3_desc: "VIDCO 인더스트리에서 개발한 열 슬리브와 새로운 압축 가스 반동 시스템을 갖춘 MG251의 개량형 버전입니다."
 SOV_tank_small_cannon: "76,2mm D-56TS"
 SOV_afv_machine_gun: "7,62mm SGMT"
 SOV_afv_machine_gun_desc: "SG-43/SGMT 고류노프는 제2차 세계 대전 중에 도입된 소련의 중기관총입니다. 7.62x54mmR 탄을 사용하며, 1943년에 구형 M1910 맥심 기관총을 대체하기 위해 도입되었습니다."
 SOV_afv_machine_gun_2: "14,5mm KPVT"
 SOV_afv_machine_gun_2_desc: "KPVT 중기관총은 소련이 설계한 14.5x114mm 구경의 중기관총으로, 1949년 보병용 무기(PKP로 지정)로 처음 배치되었습니다. 1960년대에 보병용 형식은 너무 크고 무겁다는 이유로 생산이 중단되었습니다. 이후 BTR 시리즈에 사용되었습니다."
 SOV_afv_coax_machine_gun: "7,62 SGMT"
 SOV_afv_coax_machine_gun_desc: "SG-43/SGMT 고류노프는 제2차 세계 대전 중에 도입된 소련의 중기관총입니다. 7.62x54mmR 탄을 사용하며, 1943년에 구형 M1910 맥심 기관총을 대체하기 위해 도입되었습니다."
 SOV_afv_atgm_gen1: "9K11 말류트카"
 SOV_afv_atgm_gen1_desc: "9K11 말류트카는 소련 최초의 휴대형 대전차 유도 미사일이며, 아마도 역사상 가장 많이 생산된 대전차 유도 미사일일 것입니다."
 SOV_afv_assault_gun: "73mm 2A28 그롬"
 SOV_afv_assault_gun_desc: "2A28 그롬은 KBP 2A28 그롬이라고도 하며, 쐐기식 폐쇄기를 갖춘 73mm 저압 활강 반자동포입니다. 2A28 그롬의 개발은 SPG-9 무반동포의 개발과 직접 연관되어 있었으며, 두 무기 모두 로켓 추진 유탄과 유사한 발사체를 발사하였습니다."
 SOV_afv_assault_gun_2: "100mm 2A70"
 SOV_afv_assault_gun_2_desc: "100mm 포발사기 2A70(GRAU 지정번호: 2A70)은 소련의 KBP 기기설계국이 설계한 저압 강선포의 한 형식입니다."
 SOV_small_autocannon: "30mm 2A42"
 SOV_small_autocannon_desc: "시푸노프 2A42는 소련/러시아의 30mm 기관포입니다. 툴라마시자보드 주식회사에서 제작하며, A. G. 시푸노프의 이름을 따서 명명되었습니다."
 SOV_small_autocannon_2: "30mm 2A72"
 SOV_small_autocannon_2_desc: "2A42의 경량 간소화형으로 부품 수가 적고 포신이 더 길며 포구 속도가 더 높지만, 발사 속도는 더 낮습니다. 가스 작동식이 아닌 롱 리코일 작동식입니다."
 artillery_light_ammo_1: "1세대 경포병 탄약"
 artillery_light_ammo_1_desc: "경포병 플랫폼처럼 가볍고 기동성이 높은 포병 플랫폼을 위해 설계된 소구경 포병 탄약입니다."
