 eu_parliament_button_title: "§YParliament§!"
 eu_parliament_button_desc: "The European Parliament is the first legislative body of §C[EUU.GetFlag][EUU.GetName]§! in Millennium Dawn. The European Parliament is the first place laws can be put up for vote to become legal acts of the European Union.\n\nThe player will have 14 days to complete the mission (refer to decisions) by gathering the majority support of the Members of the European Parliament (MEPs). Once the law is passed it is then passed to the Council of the European Union."
 eu_parliament_selected_text: "§YParliament§!"
 eu_council_button_title: "§YCouncil§!"
 eu_council_button_desc: "The Council of the European Union is the second legislative body of §C[EUU.GetFlag][EUU.GetName]§! in Millennium Dawn. The Council of the European Union represents the member states in the legislative procedure. All of the currently passed legislation, drafted legislation, and the list of the voting members of §C[EUU.GetFlag][EUU.GetName]§!.\n\nThe Council of the European Union operates on Qualified Majority Voting (QMV) commonly known as double majority. It requires 55% of the §CMember States§! and 65% of the §CEuropean Union Population§!."
