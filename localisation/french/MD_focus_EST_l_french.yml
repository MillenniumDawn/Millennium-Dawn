 EDGAR_SAVISAAR_DESC: "Edgar Savisaar est un homme politique estonien, l'un des membres fondateurs du Front populaire d'Estonie et du Parti du centre. Il a été Premier ministre par intérim d'Estonie, ministre de l'Intérieur, ministre des Affaires économiques et des Communications et maire de Tallinn."
