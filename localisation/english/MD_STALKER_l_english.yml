 STALKER_military_cordon_mandate: "Authorize a Military Cordon in [FROM.GetName]"
 STALKER_military_cordon_mandate_desc: "When the military leads the local factions, it can take the perimeter. A Zone can issue only one faction mandate every 180 days. A strong military makes sealing the original Zone in 2022 cheaper."
 STALKER_military_cordon_mandate_tt: "Military influence rises by §G5§! and containment by §G15§!. The stalker population falls by up to §R8§! and exploitation falls by up to §R5§!."
 STALKER_ecologist_field_mandate: "Authorize an Ecologist Field Mandate in [FROM.GetName]"
 STALKER_ecologist_field_mandate_desc: "When the Ecologists lead the local factions, their field labs can work inside the perimeter. A Zone can issue only one faction mandate every 180 days."
 STALKER_ecologist_field_mandate_tt: "Ecologist influence rises by §G5§! and exploitation by §G10§!. Containment falls by up to §R5§!. Adds §G2§! artifacts to the national stockpile."
 STALKER_issue_emission_shelter: "Issue an Emission Shelter Order in [FROM.GetName]"
 STALKER_issue_emission_shelter_desc: "Order everyone inside [FROM.GetName] under cover before the next blowout. The order lasts 120 days and is spent by the next emission."
 STALKER_issue_emission_shelter_tt: "The next emission in [FROM.GetName] costs less stability, raises activity by §Y4§! instead of §Y10§!, and adds fewer mutants."
 STALKER_field_medical_artifacts: "Field Medical Artifacts"
 STALKER_field_medical_artifacts_desc: "Issue recovered medical artifacts to hospitals. Most of the time the wards stabilize. Sometimes an artifact does something else."
 STALKER_field_medical_artifacts_tt: "Spends §Y5§! artifacts. For 180 days, stability rises each week. There is a §R15%§! chance the issue fails and stability falls by §R3%§! instead."
 STALKER_issue_psi_shielding: "Issue Psi Shielding"
 STALKER_issue_psi_shielding_desc: "Equip the garrisons with shielding built from recovered psi artifacts. The next emissions will not shake the country the way an unshielded blowout does."
 STALKER_issue_psi_shielding_tt: "Spends §Y3§! artifacts. For 180 days, emissions cost no stability."
 STALKER_issue_psi_shielding_available_tt: "Requires at least §Y3§! artifacts in our national stockpile."
 STALKER_psi_shielding: "Psi shielding is already issued to our forces."
 STALKER_medical_artifacts: "Fielded Medical Artifacts"
 STALKER_medical_artifacts_desc: "Medical artifacts are in the garrison clinics. The country is a little steadier each week, unless a bad piece was in the batch."

 # ---- MD_STALKER_xlabs_l_english.yml (consolidated) ----
 STALKER_xlab_expedition: "Fund an X-Lab Expedition into [FROM.GetName]"
 STALKER_xlab_expedition_desc: "Hire stalker guides to lead a scientific team toward the sealed Soviet laboratories beneath the Zone.\n\nInvestigation: §Y[ROOT.STALKER_xlab_stage_name]§!\nProgress to the next discovery: §Y[?ROOT.STALKER_xlab_progress|0]§! / 100\nStalkers: §Y[?FROM.STALKER_zone_stalkers|0]§! | Exploitation: §Y[?FROM.STALKER_zone_exploitation|0]§!"
 STALKER_xlab_expedition_tt: "Adds §Y20§! investigation progress, plus §Y0.1§! for each point of Zone §Ystalkers§! and §Yexploitation§!, minus §R0.2§! for each point of §YMonolith§! influence (at least §Y5§! in total). There is a §R25%§! chance the expedition loses its guides, reducing the §Ystalker§! population by up to §R5§!. At §Y100§! progress the investigation uncovers its next stage."
 STALKER_xlab_stage_reward_tt: "Adds §G5§! artifacts to the national stockpile and §G+1%§! research speed from our X-Lab findings."
 STALKER_xlab_findings: "X-Lab Findings"
 STALKER_xlab_findings_desc: "Research recovered from the Soviet laboratories beneath the Zone."
 STALKER.10.t: "Laboratory X-18"
 STALKER.10.d: "Our expedition has found a sealed Soviet laboratory beneath an abandoned factory in Dark Valley, near [STALKER_zone_name]. Its only marking is X-18. Much of it is flooded, but the surviving equipment and the artifact samples in its vaults are decades ahead of anything the Soviet Union ever admitted to building."
 STALKER.10.a: "Strip the laboratory."
 STALKER.11.t: "Project X"
 STALKER.11.d: "At Yantar, a psi-emitter hidden in Laboratory X-16 has been turning stalkers into mindless wanderers. The documents beside it name the programme that built it: Project X. Its researchers were not studying the Zone but trying to reshape the noosphere, and the Zone was their mistake."
 STALKER.11.a: "Shut the emitter down."
 STALKER.12.t: "The C-Consciousness"
 STALKER.12.d: "Laboratory X-10 powers the Brain Scorcher, the psi-installation that has kept everyone out of the northern Zone. Its files describe the C-Consciousness: scientists who linked their minds to one another and to something they called the noosphere. The Zone, the emissions and the Monolith were side effects of an experiment that never stopped running."
 STALKER.12.a: "Disable the Brain Scorcher."
 STALKER.13.t: "A Wider Network"
 STALKER.13.d: "Cross-referencing the X-Lab files has turned up something worse. Funding, personnel and equipment for Project X flowed through institutions far outside the Zone, and some of those channels may still be open. Our analysts believe other governments, including our own, may have been penetrated."
 STALKER.13.a: "Open a counterintelligence review."
 STALKER.13.a_tt: "Starts a quiet review of our own ministries and research institutes for surviving Project X channels. It reports in §Y180 days§!."
 STALKER.13.b: "Keep it inside a small circle."
 STALKER.13.b_tt: "Restricts the findings to a handful of officials. There is a §R40%§! chance they leak within a year."
 STALKER.10.a_tt: "Adds another §G5§! artifacts to the national stockpile."
 STALKER.10.b: "Seal it and post a guard."
 STALKER.10.b_tt: "Zone §Ycontainment§! rises by §G10§!."
 STALKER.11.a_tt: "Zone §Yactivity§! falls by up to §G10§!."
 STALKER.11.b: "Keep it running for study."
 STALKER.11.b_tt: "Our X-Lab findings grant another §G+1%§! research speed. The §Ystalker§! population falls by up to §R10§!."
 STALKER.12.a_tt: "Costs §R50§! political power. Opens the northern Zone: §Yexploitation§! rises by §G10§! and the §Ystalker§! population rises by §Y10§!."
 STALKER.12.b: "Leave it running as a barrier."
 STALKER.12.b_tt: "Zone §Ycontainment§! rises by §G10§!."
 STALKER.14.t: "The Counterintelligence Review Reports"
 STALKER.14.d_found: "Our investigators have traced Project X money through a research institute and two defence suppliers to officials still on the state payroll. The network has been quietly dismantled, and the officials who exposed it have earned the government some credit."
 STALKER.14.d_dead_end: "The review has found nothing. Either the Project X channels closed long ago, or whoever still runs them covered their tracks better than our investigators could follow."
 STALKER.14.a: "Good work."
 STALKER.14.b: "Keep the file open."
 STALKER.15.t: "The X-Lab Files Leak"
 STALKER.15.d: "Extracts from our classified X-Lab findings have appeared in the foreign press. The public now knows the Zone was no accident, and wants to know how long the government has known."
 STALKER.15.a: "Deny everything."
 STALKER_xlab_final_stage_reward_tt: "Our X-Lab findings grant another §G+1%§! research speed."
 STALKER.14.a_tt: "MDST penetration falls by up to §G20§!."

 # ---- MD_STALKER_antarctic_l_english.yml (consolidated) ----
 STALKER_polar_artifact_study: "Polar Artifact Study"
 STALKER_polar_artifact_study_desc: "Ship recovered artifacts to our Antarctic station, where its Radiation Laboratory can study them far from the Zone. The Antarctic Treaty bans this work, and observers who visit during the study will find it."
 STALKER_polar_artifact_study_artifacts_tt: "We hold at least §Y5§! artifacts."
 STALKER_polar_artifact_study_lab_tt: "Our Antarctic station runs a working §YRadiation Laboratory§!."
 STALKER_polar_artifact_study_tt: "Spend §Y5§! artifacts.\nFor §Y180§! days: §G+3%§! research speed and §G+15%§! Antarctic station iteration progress.\nTreaty observers who visit the station during the study seize the samples and report illegal research.\nThe study ends early, with no result, if the Radiation Laboratory stops working."
 STALKER_polar_artifact_samples: "Polar Artifact Samples"
 STALKER_polar_artifact_study_bonus: "Polar Artifact Study"
 STALKER_polar_artifacts_returned_tt: "Return §Y3§! artifacts to our stockpile."
 STALKER.190.t: "Cold Samples, Clear Results"
 STALKER.190.d: "Six months in the Antarctic cold slowed the artifacts enough to measure. Our physicists now hold readings no laboratory near the Zone could take. We can put the findings to work in our reactor programme, or ship the surviving samples home."
 STALKER.190.a: "Feed the findings into our reactor research."
 STALKER.190.b: "Bring the surviving samples home."
 STALKER.191.t: "Treaty Observers Find Zone Artifacts in Antarctica"
 STALKER.191.d: "Antarctic Treaty observers inspecting the [FROM.GetAdjective] research station found artifacts from the Zone in its Radiation Laboratory. The samples were seized, and the Treaty has recorded the study as illegal research."
 STALKER.191.a: "Even the ice is not far enough."

 # ---- MD_STALKER_economy_l_english.yml (consolidated) ----
 STALKER_export_artifacts: "Export Artifacts"
 STALKER_export_artifacts_desc: "Sell a consignment from the national stockpile to foreign buyers at the world price.\n\nArtifact stockpile: §Y[?ROOT.STALKER_artifact_stockpile|1]§!"
 STALKER_export_artifacts_available_tt: "Have at least §Y5§! artifacts in the national stockpile (currently §Y[?ROOT.STALKER_artifact_stockpile|1]§!)."
 STALKER_export_artifacts_tt: "Sells §Y5§! artifacts for §G$[?global.STALKER_artifact_price|2]§! billion each. Each export lowers the world price by §Y$0.02§! billion, to no less than §Y$0.10§! billion. The price drifts back toward §Y$0.20§! billion by §Y$0.005§! billion a month."
 STALKER_buy_market_artifacts: "Buy Artifacts Abroad"
 STALKER_buy_market_artifacts_desc: "Buy a consignment of artifacts on the open market for our laboratories.\n\nArtifacts on the open market: §Y[?global.STALKER_market_artifacts|0]§!"
 STALKER_buy_market_artifacts_available_tt: "At least §Y5§! artifacts are on the open market (currently §Y[?global.STALKER_market_artifacts|0]§!)."
 STALKER_buy_market_artifacts_treasury_tt: "Our treasury can pay for §Y5§! artifacts at §Y$[?global.STALKER_artifact_price|2]§! billion each."
 STALKER_buy_market_artifacts_tt: "Buys §Y5§! artifacts for §R$[?global.STALKER_artifact_price|2]§! billion each. We gain §G+3%§! research speed for §Y180 days§!. Each purchase raises the world price by §Y$0.02§! billion, to no more than §Y$0.50§! billion. The price drifts back toward §Y$0.20§! billion by §Y$0.005§! billion a month."
 STALKER_found_zone_consortium: "Found the Zone Research Consortium"
 STALKER_found_zone_consortium_desc: "No single government can study every Zone on its own. Invite the world's laboratories to pool what they learn."
 STALKER_found_zone_consortium_tt: "We join the new consortium and gain §G+2%§! research speed. Every country can then join, and members can fund containment in each other's Zones."
 STALKER_join_zone_consortium: "Join the Zone Research Consortium"
 STALKER_join_zone_consortium_desc: "Share our Zone research with the consortium founded by [?global.STALKER_consortium_founder.GetName] in return for access to theirs."
 STALKER_join_zone_consortium_tt: "We gain §G+2%§! research speed, and can fund containment in Zones held by other members."
 STALKER_consortium_membership: "Zone Research Consortium"
 STALKER_consortium_membership_desc: "Our laboratories share findings from anomalous Zones with the other members of the consortium."
 STALKER_fund_consortium_containment: "Fund Containment in [FROM.GetName]"
 STALKER_fund_consortium_containment_desc: "Pay for perimeter work in a Zone held by a fellow consortium member."
 STALKER_fund_consortium_containment_tt: "Costs §Y0.4%§! of GDP. [FROM.GetName] gains §G10§! §Ycontainment§! and loses up to §G5§! §YBandit§! influence. Its controller gains a better opinion of us."
 STALKER.50.t: "Zone Research Consortium Founded"
 STALKER.50.d: "[?global.STALKER_consortium_founder.GetName] has founded an international consortium to study the anomalous Zones now appearing around the world. Members will share research and help pay to contain each other's Zones."
 STALKER.50.a: "Science may yet catch up with the Zone."
 STALKER_establish_anomalous_materials_bureau: "Establish an Anomalous Materials Bureau"
 STALKER_establish_anomalous_materials_bureau_desc: "Commit recovered artifacts to a dedicated industrial research program. The bureau begins with one size level and develops equipment using infantry and artillery research."
 STALKER_establish_anomalous_materials_bureau_available_tt: "Requires at least §Y5§! artifacts in our national stockpile."
 STALKER_establish_anomalous_materials_bureau_tt: "Spend §Y5§! artifacts to establish the Anomalous Materials Bureau, increase its size by §Y1§!, and grant §Y1§! free trait pick."
 STALKER_fund_anomalous_materials_bureau: "Fund Anomalous Materials Research"
 STALKER_fund_anomalous_materials_bureau_desc: "Commit recovered artifacts to the bureau's research budget. Its funds increase MIO size when the development threshold is reached, unlocking additional trait choices."
 STALKER_fund_anomalous_materials_bureau_available_tt: "Requires at least §Y5§! artifacts in our national stockpile."
 STALKER_fund_anomalous_materials_bureau_tt: "Spend §Y5§! artifacts to add §Y150§! MIO funds to the Anomalous Materials Bureau."
 STALKER_anomalous_materials_bureau_available_tt: "The Kaymanov outcome has spread anomalous Zones around the world."
 generic_STALKER_anomalous_materials_bureau: "Anomalous Materials Bureau"
 generic_STALKER_anomalous_materials_bureau_trait: "Recovered Artifact Analysis"
 STALKER_anomalous_materials_production_header: "Industrial Applications"
 STALKER_anomalous_materials_sample_characterization: "Sample Characterization"
 STALKER_anomalous_materials_stabilized_alloys: "Stabilized Alloy Processing"
 STALKER_anomalous_materials_reproducible_fabrication: "Reproducible Fabrication"
 STALKER_anomalous_materials_gauss_prototypes: "Gauss Prototypes"

 # ---- MD_STALKER_mdst_l_english.yml (consolidated) ----
 STALKER_purge_mdst_channels: "Purge MDST Channels"
 STALKER_purge_mdst_channels_desc: "Arrest the officials, researchers and contractors our investigators have tied to MDST."
 STALKER_purge_mdst_channels_tt: "MDST penetration falls by up to §G25§!."
 STALKER_warn_foreign_government: "Warn [FROM.GetName] About MDST"
 STALKER_warn_foreign_government_desc: "Some of the channels we traced run through [FROM.GetName]. Sharing what we know may help us close our own."
 STALKER_warn_foreign_government_tt: "Our MDST penetration falls by up to §G5§!. [FROM.GetName] learns of MDST and discovers how far it has penetrated their own institutions."
 STALKER.80.t: "Research Walks Out the Door"
 STALKER.80.d: "Samples and files have gone missing from one of our Zone laboratories. Nobody signed them out, and the only people with access passed every background check we have."
 STALKER.80.a: "Find the leak."
 STALKER.80.a_tt: "MDST penetration falls by up to §G10§!. We have already lost up to §R5§! stockpiled artifacts to the black market, and up to §R20§! X-Lab expedition progress."
 STALKER.80.b: "Tighten access quietly."
 STALKER.80.b_tt: "We have already lost up to §R5§! stockpiled artifacts to the black market, and up to §R20§! X-Lab expedition progress."
 STALKER.81.t: "A Warning About MDST"
 STALKER.81.d: "[FROM.GetName] has passed us intelligence on MDST, the Ministry of Defense and Secret Technologies, which carried on Project X after it was shut down. Their analysts believe it reaches into our own ministries and research institutes."
 STALKER.81.a: "Act on the warning."
 STALKER.81.a_tt: "MDST penetration falls by up to §G10§!, and we will think better of [FROM.GetName]."
 STALKER.81.b: "We will look into it ourselves."
 STALKER_purge_mdst_channels_available_tt: "MDST penetration is at least §Y5§! (currently §Y[?ROOT.STALKER_mdst_penetration|0]§!)."

 # ---- MD_STALKER_monolith_l_english.yml (consolidated) ----
 STALKER_strike_monolith: "Strike the Monolith in [FROM.GetName]"
 STALKER_strike_monolith_desc: "Send an armored column toward the power plant to break the Monolith's hold on the center of the Zone.$STALKER_zone_society_readout$"
 STALKER_strike_monolith_tt: "Costs §Y0.4%§! of GDP. [FROM.GetName] loses up to §G25§! §YMonolith§! influence and §R5§! §Ycontainment§! from the losses, and gains §G5§! §YDuty§! influence. Half the time, broken Monolith fighters defect to §YNoon§! (§G+10§!)."
 STALKER.70.t: "Monolith Offensive"
 STALKER.70.d: "Monolith fighters have poured south from the power plant and overrun two perimeter posts in [STALKER_zone_name]. Survivors describe soldiers who fought in silence and did not stop for their wounded."
 STALKER.70.a: "Counter-attack before they dig in."
 STALKER.70.a_tt: "The offensive has already cost the Zone §R10§! §Ycontainment§! and §R5§! stalkers. Costs §R50§! political power. The Zone loses up to §G20§! §YMonolith§! influence and gains §G5§! §YDuty§! influence. Half the time, broken Monolith fighters defect to §YNoon§! (§G+10§!)."
 STALKER.70.b: "Pull back and hold the new line."
 STALKER.70.b_tt: "The Zone regains §G5§! §Ycontainment§!. The offensive has already cost it §R10§! §Ycontainment§! and §R5§! stalkers."
 STALKER.71.t: "Pilgrims Go North"
 STALKER.71.d: "A group of stalkers walked past the Cordon last week, heading for the power plant. Their friends say they had talked for days about a Wish Granter. None of them has come back."
 STALKER.71.a: "They made their choice."
 STALKER.71.a_tt: "The Zone has already lost §R10§! stalkers, and §YMonolith§! influence has risen by §R5§!."
 STALKER.71.b: "Close the road north."
 STALKER.71.b_tt: "The Zone has already lost §R10§! stalkers, and §YMonolith§! influence has risen by §R5§!. Costs §R25§! political power. The Zone loses up to §G5§! §YMonolith§! influence and gains §G5§! §Ycontainment§!."

 # ---- MD_STALKER_mutants_l_english.yml (consolidated) ----
 STALKER_mutant_incursion: "Mutant Incursion"
 STALKER_mutant_incursion_desc: "Mutants have broken out of a nearby anomalous Zone and are roaming this state."
 STALKER_organize_mutant_cull: "Organize a Mutant Cull in [FROM.GetName]"
 STALKER_organize_mutant_cull_desc: "Hire hunters and send patrols to thin out the pseudodogs, bloodsuckers and worse that emissions drive out of the Zone.\n\nMutants: §Y[?FROM.STALKER_zone_mutants|0]§!\nMutants kill §Y5%§! of their number in stalkers each month. Each emission adds §R15§!. Above §Y49§!, they can break out into a neighbouring state."
 STALKER_organize_mutant_cull_tt: "Costs §Y0.2%§! of GDP. [FROM.GetName] loses up to §G25§! mutants."
 STALKER_fortify_perimeter_defenses: "Fortify Perimeter Defenses in [FROM.GetName]"
 STALKER_fortify_perimeter_defenses_desc: "Erect electrified wire barriers, automated sensor arrays, and mine belts along vulnerable sectors to halt mutant breakouts.\n\nMutants: §Y[?FROM.STALKER_zone_mutants|0]§!\nContainment: §Y[?FROM.STALKER_zone_containment|0]%§!"
 STALKER_fortify_perimeter_defenses_tt: "Costs §Y40§! political power and §Y0.2%§! of GDP. [FROM.GetName] gains §G15§! §Ycontainment§!, loses up to §G15§! mutants, and reduces mutant breakout risk for §Y1 year§!."
 STALKER_deploy_acoustic_deterrents: "Deploy Acoustic Deterrent Arrays in [FROM.GetName]"
 STALKER_deploy_acoustic_deterrents_desc: "Install directional high-frequency acoustic emitters around research field camps to drive away packs of blind dogs and snorks.\n\nMutants: §Y[?FROM.STALKER_zone_mutants|0]§!\nExploitation: §Y[?FROM.STALKER_zone_exploitation|0]%§!"
 STALKER_deploy_acoustic_deterrents_tt: "Costs §Y25§! political power and §Y0.1%§! of GDP. [FROM.GetName] loses up to §G20§! mutants and gains §G5§! §Yexploitation§!, but loses §R5§! §YFreedom§! influence."
 STALKER.90.t: "Mutants Break the Perimeter"
 STALKER.90.d: "A pack of mutants driven out by the last emission has broken through the perimeter of [STALKER_zone_name]. Villages beyond the fence report livestock killed and roads closed. A neighbouring state we control will suffer a Mutant Incursion for 60 days."
 STALKER.90.a: "Send hunters after them."
 STALKER.90.a_tt: "Costs §R25§! political power. The Zone loses up to §G20§! mutants and gains §G5§! stalkers."
 STALKER.90.b: "Close the roads and wait it out."
 STALKER.90.b_tt: "The Zone gains §G5§! §Ycontainment§!."
 STALKER.91.t: "Bloodsucker Lair Discovered"
 STALKER.91.d: "Reconnaissance patrols in [STALKER_zone_name] have uncovered an underground bloodsucker nesting colony in an abandoned industrial facility. Pack movements are disrupting transit through adjacent sectors."
 STALKER.91.a: "Order a military demolition strike."
 STALKER.91.a_tt: "Costs §R25§! political power and §Y0.2%§! of GDP. The Zone loses up to §G20§! mutants, gains §G5§! §Ycontainment§!, and loses §G5§! §YBandit§! influence."
 STALKER.91.b: "Contract local stalkers for a bounty hunt."
 STALKER.91.b_tt: "Costs §R15§! political power. The Zone loses up to §G15§! mutants, gains §G10§! §Ystalkers§!, and deposits §G1§! anomalous specimen into our national artifact stockpile."
 STALKER.91.c: "Seal the surface access and observe."
 STALKER.91.c_tt: "The Zone gains §G5§! §Yexploitation§! through behavioral observation, leaving mutant populations undisturbed."
 STALKER.92.t: "Psi-Field Disruption at the Perimeter"
 STALKER.92.d: "Telepathic controller entities have drifted toward the perimeter line in [STALKER_zone_name]. Checkpoint sentries report crushing migraines and hallucinations, causing localized panic and temporary post abandonment."
 STALKER.92.a: "Deploy armored fireteams and psi-shielded helmets."
 STALKER.92.a_tt: "Costs §R30§! political power. The Zone loses up to §G15§! mutants and gains §G10§! §Ycontainment§!."
 STALKER.92.b: "Fall back to the reinforced secondary cordon."
 STALKER.92.b_tt: "Costs §R1%§! stability. The Zone loses §R10§! §Ycontainment§! and gains §R5§! §Yactivity§!."
 STALKER.92.c: "Send Duty volunteers into the breach."
 STALKER.92.c_tt: "Requires at least §Y15§! §YDuty§! influence. The Zone loses up to §G20§! mutants, gains §G10§! §YDuty§! influence, loses §R5§! §YFreedom§! influence, and gains §G5§! §Ycontainment§!."
 STALKER.93.t: "Pseudogiant Sighted in the Cordon"
 STALKER.93.d: "An immense pseudogiant has breached the forward buffer zone in [STALKER_zone_name], crushing perimeter fortifications and civilian barricades with seismic shockwaves."
 STALKER.93.a: "Bring up heavy artillery and anti-materiel teams."
 STALKER.93.a_tt: "Costs §R40§! political power. The Zone loses up to §G25§! mutants and gains §G10§! §Ycontainment§!, but loses §R5§! §Yexploitation§! from damaged research monitoring arrays."
 STALKER.93.b: "Lure the beast into an anomaly field."
 STALKER.93.b_tt: "Requires at least §Y20§! §Yactivity§!. The Zone loses up to §G15§! mutants, gains §G5§! §Ystalkers§!, and increases §Yactivity§! by §R5§!."
 STALKER.94.t: "Mutant Bio-Harvesting Demand"
 STALKER.94.d: "International biotechnology firms and defense contractors are offering lucrative bounties for fresh mutant tissue specimens collected from [STALKER_zone_name]."
 STALKER.94.a: "Establish a state licensing board for specimen trade."
 STALKER.94.a_tt: "Gains §G0.4%§! of GDP in revenue. The Zone gains §G10§! §Yexploitation§!, loses §R5§! §Ycontainment§!, and loses up to §G10§! mutants."
 STALKER.94.b: "Ban commercial harvesting and requisition all specimens."
 STALKER.94.b_tt: "Costs §R15§! political power. Deposits §G2§! anomalous specimens into our artifact stockpile, raises §Ycontainment§! by §G10§!, and lowers §YBandit§! influence by §G5§!."
