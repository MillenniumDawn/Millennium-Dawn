 form_WESTFED_category: "서인도 연방"
 form_WESTFED_category_desc: "서인도 연방은 1958년부터 1962년까지 단명했던 정치 연합으로, 카리브해의 여러 섬나라를 포함했습니다. 이 연방은 통치 방식이나 원활한 기능 유지에 관한 분쟁으로 인해 빠르게 와해되었습니다. 하지만 이 구상은 여전히 국가들 사이에서 일정한 가치를 지니고 있으며, 서반구의 차기 위대한 국가가 될 가능성이 충분합니다. 우리가 카리브해를 이 새로운 내일로 이끌어가야 하지 않겠습니까?"
