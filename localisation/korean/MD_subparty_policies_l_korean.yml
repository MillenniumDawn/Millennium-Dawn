 subparty_policies.0.t: "성공적인 자산의 청산"
 subparty_policies.0.desc: "With a swift operation, we managed to secure the funds of a foreign power. By freezing overseas assets, confiscating material and properties and by transferring financial instruments to government accounts we have significantly increased the wealth of our nation."
 subparty_policies.0.a: "훌륭하군"
 subparty_policies.1.t: "국가가 통제하는 해외 공장"
 subparty_policies.1.desc: "[ROOT.GetAdjective] 지도자 [ROOT.GetLeader]은(는) 오늘 우리나라 밖에 본사를 둔 대기업의 자산을 국가가 강제로 매입하겠다고 발표했습니다. 위대한 지도자의 말에 따르면 이는 '산업 생산의 해외 이전'을 막고 '[ROOT.GetAdjective] 노동자에 대한 착취를 끝내기' 위한 조치입니다. 해당 기업에는 충격적인 소식입니다. 최고경영자는 '국가가 정직하고 평판 좋은 기업에 대해 권한을 행사한다는 것은 완전한 광기'라고 말한 것으로 전해졌습니다."
 subparty_policies.1.a: "훌륭하군"
 subparty_policies.2.t: "국가가 차지한 무기 공장"
 subparty_policies.2.desc: "오늘 이른 아침, [ROOT.GetAdjective] 헌병대가 국제 방위산업체가 운영하는 군수 장비 공장의 부지에 진입했습니다. 이 기업은 국제법을 위반한 것으로 선언되었으며, 인류에 맞선 자본주의 전쟁에 무기를 공급한 혐의를 받고 있습니다. 이에 따라 기업의 모든 재산이 [Root.GetAdjective] 정부에 몰수되었습니다. 이 무기들이 정확히 얼마나 비인도적인지 전면적이고 심층적인 검토를 진행할 수 있도록 공장의 모든 군수 생산은 즉시 계속됩니다."
 subparty_policies.2.a: "훌륭하군"
 subparty_policies.3.t: "국가가 징발한 해군 조선소"
 subparty_policies.3.desc: "오늘 이른 아침, [ROOT.GetAdjective] 해안경비대가 순찰정으로 해군 조선소의 출입로를 봉쇄했습니다. 이 조선소는 밀수 작전의 위장 시설로 의심받고 있습니다. 이에 따라 해안경비대는 [ROOT.GetAdjective] 해군과 함께 해당 구역을 군의 통제하에 두었습니다. 현재 조선소를 임차해 운영하고 있는 국제 조선 기업의 대변인은 [ROOT.GetAdjective] 당국이 회사와 전혀 접촉한 적이 없다며 의혹을 부인했습니다."
 subparty_policies.3.a: "훌륭하군"
 subparty_policies.4.t: "국유화의 실패"
 subparty_policies.4.desc: "외국 자산을 국유화하려는 우리의 계획이 대상 측에 유출된 것으로 보입니다. 우리가 대응하기도 전에 은행 계좌가 폐쇄되고 자금이 역외 계좌로 옮겨졌습니다. 행정부 내 누군가가 외국 세력과 지나치게 가까워져 유출이 발생했을 가능성이 있습니다."
 subparty_policies.4.a: "훌륭하군"
 subparty_policies.5.t: "[ROOT.GetName]의 공장을 이전하는 공장"
 subparty_policies.5.desc: "외국 자산을 국유화하려는 우리의 계획이 대상 측에 유출된 것으로 보입니다. 이에 따라 한 국제 기업이 모든 자산을 잃을 것을 우려하여 제조 공장 한 곳을 국외로 옮기기로 즉흥적으로 결정했습니다. 이는 [ROOT.GetAdjective] 경제에 큰 타격입니다."
 subparty_policies.5.a: "최악이군"
 subparty_policies.6.t: "기술 기업의 인수"
 subparty_policies.6.desc: "한 다국적 기술 기업이 오늘 대규모 사이버 공격을 받고 있다고 발표했습니다. 이에 [ROOT.GetAdjective] 정보기관이 지원을 위해 현장에 도착했습니다. 조사 결과 해당 기업이 적대국의 사이버 공격을 받고 있는 것으로 결론지어졌습니다. 국가 안보를 이유로 기업 자산은 정보기관의 임시 통제하에 놓였습니다."
 subparty_policies.6.a: "훌륭하군"
 generic_initiate_primary_sector_5_year_plan: "1차 산업 중심 5개년 계획 개시"
 generic_initiate_primary_sector_5_year_plan_desc: "우리나라의 1차 산업은 농업과 채굴 기반 산업으로 이루어져 있습니다. 이 산업들은 국민과 공장을 먹여 살립니다. 또한 이러한 물자를 실어 나르기 위해 기반시설에 투자하는 것도 필수적입니다."
 generic_initiate_secondary_sector_5_year_plan: "2차 산업 중심 5개년 계획 개시"
 generic_initiate_secondary_sector_5_year_plan_desc: "2차 산업에는 제조업과 기타 생산직 일자리가 포함됩니다. 노동자를 위해 세워진 국가로서, 이 부문은 우리나라의 근간입니다."
 generic_initiate_tertiary_sector_5_year_plan: "3차 산업 중심 5개년 계획 개시"
 generic_initiate_tertiary_sector_5_year_plan_desc: "3차 산업은 사무직 노동자를 위한 부문입니다. 서비스 종사자, 기술자, 관료가 여기에 속합니다. 이들은 우리 노동계급 이상을 온전히 대변하지는 않지만, 자본주의 국가들에 뒤처지지 않으려면 이 부문을 확대해야 합니다."
 generic_initiate_infrastructure_5_year_plan: "기반시설 중심 5개년 계획 개시"
 generic_initiate_infrastructure_5_year_plan_desc: "우리나라의 도로와 철도는 처참한 상태입니다. 기반시설 개선에 투자해야 합니다. 이는 민간 경제와 군사 경제 모두의 근간입니다."
 generic_initiate_military_5_year_plan: "군수 산업 중심 5개년 계획 개시"
 generic_initiate_military_5_year_plan_desc: "자본주의 돼지들이 우리의 자유를 빼앗기 위해 쳐들어오는 것은 시간문제입니다. 군사 대비 태세를 개선하는 데 모든 노력을 쏟아야 합니다."
 generic_initiate_naval_5_year_plan: "해군 중심 5개년 계획 개시"
 generic_initiate_naval_5_year_plan_desc: "전 세계의 이념적 형제들과 연결되려면 해군력을 개선해야 합니다."
 generic_initiate_technology_5_year_plan: "기술 발전 중심 5개년 계획 개시"
 generic_initiate_technology_5_year_plan_desc: "적을 물리치려면 꿈에서나 그려 볼 법한 환상적이고 놀라운 신무기를 개발해야 합니다. 포신이 두 개 달린 전차! 폭탄을 투하하는 비행선! 적 함선을 침몰시키도록 훈련된 거대 오징어!"
 generic_initiate_energy_5_year_plan: "에너지 중심 5개년 계획 개시"
 generic_initiate_energy_5_year_plan_desc: "장래의 산업 확장에 대비하여 에너지 생산 능력을 확충해야 합니다."
