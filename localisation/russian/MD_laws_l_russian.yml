 expanded_economics: "Отраслевая экономическая политика"
 military_spending: "Военные расходы"
 military_spending_desc: "Уровень наших военных расходов определяет, сколько военнослужащих мы можем выставить в составе наших вооружённых сил, и влияет на производство новой военной техники."
 conscription_law: "Закон о призыве"
 military_status_women: "Женщины в армии"
 foreign_intervention_law: "Закон о зарубежном вмешательстве"
 foreign_intervention_law_desc: "Закон о зарубежном вмешательстве определяет, насколько охотно наша страна готова вмешиваться в конфликты и оказывать влияние на другие страны."
 officer_training_law: "Подготовка офицеров"
 officer_training_law_desc: "Офицеры будут вести наших солдат в бой. Чем лучше мы их подготовим, тем меньше им придётся тратить на обучение на поле боя. Однако создание учебных центров для наших офицеров может быть дорогостоящим."
 nuclear_status: "Ядерный статус"
 nuclear_status_desc: "Статус ядерной программы страны: неядерная, использующая только ядерную энергию или обладающая ядерным оружием."
 nuclear_stance: "Позиция в отношении ядерного оружия"
 nuclear_stance_desc: "Устанавливает условия и требования, при которых страна может применить ядерное оружие против противника."
 corruption_level_10: "(10) Парализующая коррупция"
 corruption_level_10_desc: "Коррупция в нашей стране является повсеместной, укоренившейся, системной, а также беспрецедентной по масштабам и охвату."
 corruption_level_09: "(9) Критическая коррупция"
 corruption_level_09_desc: "Коррупция в нашей стране захлёстывает все слои общества. Это не деятельность нескольких жуликоватых чиновников или политиков. Это уже организованная преступность, с коррупционными сделками по крупным закупкам, возникающими в результате сговора и клептократического рэкета."
 corruption_level_08: "(8) Повсеместная коррупция"
 corruption_level_08_desc: "Коррупция в нашей стране воспринимается как существенная проблема, влияющая на все аспекты жизни, включая государственное управление, правоохранительную деятельность, здравоохранение и образование. Феномен коррупции прочно укоренился в нашей модели государственного управления и объясняется общей слабостью верховенства закона в нашей стране."
 corruption_level_07: "(7) Неукротимая коррупция"
 corruption_level_07_desc: "Наша страна долгое время страдала от широко распространённой и эндемичной коррупции. Коррупция продолжает оставаться серьёзной проблемой как в государственном, так и в частном секторах, несмотря на то что юридическая и институциональная база, борющаяся с коррупцией, является сильной. Взятки, откаты и коррупция в правительстве считаются частью повседневной жизни."
 corruption_level_06: "(6) Систематическая коррупция"
 corruption_level_06_desc: "Коррупция в нашей стране является результатом множества факторов, включая слабое исполнение закона, отсутствие аудита, отсутствие кодексов поведения, непрозрачность деятельности правительства, неэффективную бюрократию, безнаказанность правительства и широкие дискреционные полномочия, а также недостаточную осведомлённость общественности."
 corruption_level_05: "(5) Распространённая коррупция"
 corruption_level_05_desc: "Взяточничество и коррупция широко распространены в нашей стране. Вопрос в том, является ли это проблемой всей системы или лиц, находящихся у власти."
 corruption_level_04: "(4) Средняя коррупция"
 corruption_level_04_desc: "Разоблачение громких коррупционных дел в СМИ и ограниченное политическое участие способствовали плохому общественному восприятию политического процесса в нашей стране. Повторяющиеся коррупционные скандалы с участием высокопоставленных политиков, местных администраторов и предприятий, злоупотребляющих государственными средствами, показали, что установленные гарантии противодействия этому злоупотреблению властью были относительно неэффективными."
 corruption_level_03: "(3) Умеренная коррупция"
 corruption_level_03_desc: "Хотя восприятие коррупции в целом низкое, политические партии и предприятия обычно рассматриваются как наименее честные и заслуживающие доверия. Мелкая коррупция не так редка, как в некоторых других странах."
 corruption_level_02: "(2) Незначительная коррупция"
 corruption_level_02_desc: "Восприятие и возникновение коррупции в нашей стране в целом очень низкие. Мелкая и административная коррупция практически отсутствует. Это означает, что граждане и предприятия вряд ли столкнутся с коррупцией при контакте с государственными служащими. Однако некоторые случаи показали, что личные связи, подарки и конфликты интересов являются проблемными областями, которые представляют собой некоторые виды нетрадиционной коррупции."
 corruption_level_01: "(1) Минимальная коррупция"
 corruption_level_01_desc: "Правовая и институциональная база в нашей стране считается эффективной в борьбе с коррупцией, а государственные учреждения характеризуются высокой степенью прозрачности, честности и подотчётности. Низкий уровень коррупции объясняется эффективным государственным управлением, высококачественными и комплексными услугами для граждан и предприятий, давней традицией открытости и прозрачности в нашем обществе и институтах, а также сильным уважением к верховенству закона."