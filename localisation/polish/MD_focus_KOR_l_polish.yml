 KOR_chaebol_dependence6_desc: "Czebole, duże koreańskie konglomeraty przemysłowe, odegrały kluczową rolę w rozwoju gospodarczym republiki. Ta historia doprowadziła do tego, że urzędnicy rządowi i czebole mają bliskie powiązania, co prowadzi do korupcji i nepotyzmu, które trudno wykorzenić."
 NKO_southern_propaganda_broadcasts: "Transmisje propagandowe z Korei Południowej"
 NKO_southern_propaganda_broadcasts_desc: "This national spirit will be §RRemoved§! if we complete the §HCease Propaganda Broadcasts§! focus. \n§W--------------§!\n 2-6 hours per day, the South Korean military uses loudspeakers to broadcast messages at North Korean troops guarding the DMZ. The messages range from weather reports to K-pop and, most significantly, critical reports of the North alongside positive portrayals of the South."
 KOR_northern_propaganda_broadcasts: "Transmisje propagandowe Korei Północnej"
 KOR_northern_propaganda_broadcasts_desc: "Koreański odpowiednik wiadomości i programów K-pop z południa za granicą ma na celu zapewnienie narracji alternatywnej w stosunku do narracji z Republiki Korei. Północnokoreańskie programy wychwalają system rządów KRLD, jednocześnie wyśmiewając system kapitalistyczny Południa. Te północne programy, podatne na problemy techniczne, stanowią mniejsze zagrożenie, a bardziej trwałe przypomnienie o napięciu na Półwyspie Koreańskim."
 KOR_idea_growth_by_innovation: "Rozwój poprzez innowacje"
 NKO_southern_balloon_leaflets: "Balony z ulotkami z Korei Południowej"
 NKO_southern_balloon_leaflets_desc: "This national spirit will be §RRemoved§! if §HSouth Korea is Annexed§!. \n§W--------------§!\n South Koreans and North Korean defectors regularly send balloons into the North that drop thousands of leaflets in North Korean territory, drawing angry reactions from Pyongyang. While those sending the leaflets argue that they are trying to help their northern compatriots against a dictatorial regime, their critics argue that the leaflets unnecessarily antagonize the North and endanger South Koreans living near the border."
 KOR_intensified_propaganda: "Zintensyfikowana propaganda południa"
 KOR_intensified_propaganda_desc: "Za pomocą różnorodnych środków rząd południa stara się podważyć naszą legitymizację. Przeciwdziałanie temu zmasowanemu atakowi propagandy zajmie nam trochę czasu."
 KOR_global_korea: "Globalna Korea"
 KOR_global_korea_desc: "The days when Korea had no need to preoccupy itself with foreign affairs are over. A Global Korea will seek to engage the world as a power within its own right."
 KOR_reunification_shocks: "Wstrząsy zjednoczenia"
 KOR_reunification_shocks_desc: "Po dziesięcioleciach separacji obie Koree w końcu formalnie ponownie się zjednoczyły. Jednak obie połowy kraju pozostają skrajnie spolaryzowane, a koszty gospodarcze zjednoczenia zebrały ogromne żniwo. Nowy rząd musi podjąć szybkie kroki w kierunku rozwiązania różnic, które nadal utrzymują się na 38. równoleżniku, w przeciwnym razie istnieje ryzyko rozpadu młodego państwa koreańskiego."
 KOR_divided_military: "Podzielone wojsko"
 KOR_divided_military_desc: "Zjednoczony naród koreański dziedziczy po swoich poprzednikach dwie potężne siły bojowe. Jednakże nowe państwo musi znaleźć sposób na przezwyciężenie poważnych trudności w próbach zarządzania tą nadętą, nieporęczną i wewnętrznie podzieloną armią, jeśli chce się zabezpieczyć."
 KOR_mass_migration: "Masowa migracja"
 KOR_mass_migration_desc: "Istotną konsekwencją zjednoczenia jest masowa migracja rodzin w poszukiwaniu lepszych możliwości przez 38 równoleżnik. Ogromna skala i szybkość tego ruchu jest wysoce destabilizująca i powoduje chaos w całym kraju."
 KOR_fragmented_governance: "Rozdrobnione zarządzanie"
 KOR_fragmented_governance_desc: "Chociaż Korea istnieje obecnie formalnie jako jedno suwerenne państwo, w rzeczywistości wzdłuż 38 równoleżnika pozostają dwie bardzo różne kultury polityczne. Kwestia sposobu rządzenia krajem należy szybko rozwiązać."
 KOR_uneven_economy_2: "Nierówna Gospodarka"
 KOR_uneven_economy_2_desc: "Nieuchronnie znaczne rozbieżności w poziomach rozwoju gospodarczego między obiema Koreami będą miały wpływ po zjednoczeniu. Aby nowy naród koreański mógł uwolnić swój pełny potencjał gospodarczy, należy naprawić tę nierównowagę."
 KOR_uneven_economy_3: "Planowana Gospodarka"
 KOR_uneven_economy_3_desc: "Gospodarka planowa to rodzaj systemu gospodarczego, w którym inwestycje, produkcja i alokacja dóbr kapitałowych odbywają się zgodnie z planami gospodarczymi i planami produkcyjnymi obejmującymi całą gospodarkę. Gospodarka planowa może wykorzystywać scentralizowane, zdecentralizowane, partycypacyjne lub sowieckie formy planowania gospodarczego. Poziom centralizacji lub decentralizacji w procesie decyzyjnym i partycypacji zależy od konkretnego rodzaju zastosowanego mechanizmu planowania."
 KOR_uneven_economy_3_1: "Planowana Gospodarka"
 KOR_uneven_economy_3_1_desc: "Gospodarka planowa to rodzaj systemu gospodarczego, w którym inwestycje, produkcja i alokacja dóbr kapitałowych odbywają się zgodnie z planami gospodarczymi i planami produkcyjnymi obejmującymi całą gospodarkę. Gospodarka planowa może wykorzystywać scentralizowane, zdecentralizowane, partycypacyjne lub sowieckie formy planowania gospodarczego. Poziom centralizacji lub decentralizacji w procesie decyzyjnym i partycypacji zależy od konkretnego rodzaju zastosowanego mechanizmu planowania."
 KOR_uneven_economy_3_2: "Planowana Gospodarka"
 KOR_uneven_economy_3_2_desc: "Gospodarka planowa to rodzaj systemu gospodarczego, w którym inwestycje, produkcja i alokacja dóbr kapitałowych odbywają się zgodnie z planami gospodarczymi i planami produkcyjnymi obejmującymi całą gospodarkę. Gospodarka planowa może wykorzystywać scentralizowane, zdecentralizowane, partycypacyjne lub sowieckie formy planowania gospodarczego. Poziom centralizacji lub decentralizacji w procesie decyzyjnym i partycypacji zależy od konkretnego rodzaju zastosowanego mechanizmu planowania."
 KOR_uneven_economy_4: "Wspieraj Rynek"
 KOR_uneven_economy_4_desc: "We will keep a hand under our economy. While not dictating the market, we will support business and do what we can to support the entirety of our economy"
 KOR_uneven_economy_4_1: "Wspieraj Rynek"
 KOR_uneven_economy_4_1_desc: "Będziemy trzymać rękę na pulsie naszej gospodarki, dlaczego nie dyktując rynku, będziemy wspierać biznes i robić, co w naszej mocy, aby wesprzeć całą naszą gospodarkę"
 KOR_uneven_economy_4_2: "Wspieraj Rynek"
 KOR_uneven_economy_4_2_desc: "Będziemy trzymać rękę na pulsie naszej gospodarki, dlaczego nie dyktując rynku, będziemy wspierać biznes i robić, co w naszej mocy, aby wesprzeć całą naszą gospodarkę"
 KOR_uneven_economy_5: "Wolny rynek"
 KOR_uneven_economy_5_desc: "W ekonomii wolny rynek to wyidealizowany model poznawczy systemu gospodarczego, w którym ceny towarów i usług są określane przez podaż i popyt wyrażany przez sprzedawców i kupujących. Takie rynki, zgodnie z modelem, działają bez interwencji rządu lub jakiejkolwiek innej władzy zewnętrznej. Zwolennicy wolnego rynku jako ideału normatywnego przeciwstawiają go rynkowi regulowanemu, na którym rząd interweniuje w podaż i popyt za pomocą różnych metod, takich jak podatki czy regulacje. W wyidealizowanej gospodarce wolnorynkowej ceny towarów i usług ustalane są wyłącznie na podstawie stawek i ofert uczestników."
 KOR_uneven_economy_5_1: "Wolny rynek"
 KOR_uneven_economy_5_1_desc: "W ekonomii wolny rynek to wyidealizowany model poznawczy systemu gospodarczego, w którym ceny towarów i usług są określane przez podaż i popyt wyrażany przez sprzedawców i kupujących. Takie rynki, zgodnie z modelem, działają bez interwencji rządu lub jakiejkolwiek innej władzy zewnętrznej. Zwolennicy wolnego rynku jako ideału normatywnego przeciwstawiają go rynkowi regulowanemu, na którym rząd interweniuje w podaż i popyt za pomocą różnych metod, takich jak podatki czy regulacje. W wyidealizowanej gospodarce wolnorynkowej ceny towarów i usług ustalane są wyłącznie na podstawie stawek i ofert uczestników."
 KOR_uneven_economy_5_2: "Wolny rynek"
 KOR_uneven_economy_5_2_desc: "W ekonomii wolny rynek to wyidealizowany model poznawczy systemu gospodarczego, w którym ceny towarów i usług są określane przez podaż i popyt wyrażany przez sprzedawców i kupujących. Takie rynki, zgodnie z modelem, działają bez interwencji rządu lub jakiejkolwiek innej władzy zewnętrznej. Zwolennicy wolnego rynku jako ideału normatywnego przeciwstawiają go rynkowi regulowanemu, na którym rząd interweniuje w podaż i popyt za pomocą różnych metod, takich jak podatki czy regulacje. W wyidealizowanej gospodarce wolnorynkowej ceny towarów i usług ustalane są wyłącznie na podstawie stawek i ofert uczestników."
