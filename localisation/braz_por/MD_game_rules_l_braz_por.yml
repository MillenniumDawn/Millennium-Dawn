 RULE_OPTION_MD_COLORED_PUPPETS_YES_DESC: "Desde que essa regra do jogo foi ativada, qualquer país que se torne um estado fantoche mudará automaticamente para a cor do seu suserano. (Por exemplo, se a China transformasse a Índia em um estado fantoche, a Índia ficaria vermelha como a China)."
 RULE_OPTION_MD_COLORED_PUPPETS_NO_DESC: "Desde que esta regra de jogo foi desabilitada, os países não mudarão de cor ao serem marionetados, e sua cor permanecerá estática."
