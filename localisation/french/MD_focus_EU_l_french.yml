 EU_president_european_parliament_tt: "The §YPresident of the European Parliament§! presides over the debates and activities of the European Parliament. They represent the European Parliament in all legal matters and external relations, particularly international relations. They serve a two-and-a-half-year term and their signature is required to sign the Budget of §C[EUU.GetFlag][EUU.GetName]§! and Union acts adopted under co-decision procedures.\n\n§YPerks of the Office:§!\nHolding this office allows us to put a bill forward to vote without requiring influence on any member.\n\nIncreases the success rate of Pro-European and Euroscepticism Campaigns by §G+10%§!\n\n[!eu_parliament_office_back_click]\n"
 EU_central_bank_idea_president_tt: "Modifie le $investment_cost_modifier$ et le $investment_duration_modifier$ de §G15%§! pour les investissements dans les §CÉtats membres de l'Union européenne§!.\n"
 EU_ministry_of_economy_and_finance_tt: "The §YEuropean Minister of Economy and Finance§! heads the European Economic Government and as such has the powers invested in them by the fiscal union. The minister is responsible for overseeing the tax authority, the minimum wage for member states, and other economic and fiscal decisions.\n\n§YPerks of the Office:§!\n\nHolding this office will allow the holder to always put a budget draft on the Agenda of the EP, bypassing all influence requirements.\n\n[!eu_ecofin_office_back_click]\n"
 EU_ministry_of_economy_and_finance_idea_tt: "Modifie le $investment_cost_modifier$ et le $investment_duration_modifier$ de §G5%§! pour les investissements dans les §CÉtats membres de l'Union européenne§!.\n"
