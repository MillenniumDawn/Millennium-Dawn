 tech_submarine_engineering_1: "Submarine Engineering"
 tech_submarine_engineering_1_desc: ""
 tech_submarine_engineering_2: "Early Submarine Engine"
 tech_submarine_engineering_2_desc: "The diesel-electric power used in early submarines consisted of a diesel engine, an electric motor, a generator, and a battery. The propeller was driven by a diesel engine connected in parallel with an electric motor. The diesel engine could be used for navigation on the water, or the diesel engine could be used to drive the generator to charge the battery. When the ship was submerged, the air supply was limited and the oxygen-consuming heat engine could not operate; the battery would provide energy for the electric motor, which would drive the propeller with electricity."
 tech_submarine_engineering_3: "Advanced Submarine Engine"
 tech_submarine_engineering_3_desc: "The new diesel-electric power system uses lithium batteries instead of traditional lead-acid batteries to achieve longer driving time."
 tech_submarine_engineering_4: "Modern Submarine Engine"
 tech_submarine_engineering_4_desc: "The introduction of AIP can make submarines operate more efficiently, quietly, and more reliably."
 attack_submarine_hull_1: "1965년형 공격형 잠수함 함체"
 attack_submarine_hull_1_desc: "세계 해양의 조용한 살인자인 이 수중 전투 플랫폼은 스텔스, 정보 수집, 무기 시스템을 포함한 다양한 유용한 능력을 통합합니다. 광범위한 원양 및 연안 임무를 위해 설계된 이 지역 거부 전문가는 모든 해군의 초석입니다. 공격잠수함은 해외의 원거리 표적을 공격하도록 설계된 미사일과 잠수함의 조합이다."
