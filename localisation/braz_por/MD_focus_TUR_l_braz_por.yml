 TUR_through_troubles: "Através dos problemas"
 TUR_through_troubles_desc: "Turkey is going through an economical crisis right now. We need to assure our people that the government can get through this"
 TUR_conservative_victory: "Vitória Conservadora"
 TUR_conservative_victory_desc: "The conservatives have won the election and can start bringing more conservative elements of Islam back to Turkey"
 TUR_gulenist_victory: "Vitória Gulenista"
 TUR_gulenist_victory_desc: "Os Gülenistas expulsaram os membros corruptos do AKP. Esta é uma grande vitória para a democracia"
 TUR_peace_with_religious_leaders: "Paz com os governantes religiosos"
 TUR_peace_with_religious_leaders_desc: "Embora o Gülenismo pregue uma forma muito específica de Islão, é importante que levemos em consideração os líderes religiosos da Turquia. Devemos permitir que todas as seitas divulguem livremente os seus ensinamentos"
 TUR_gulenist_schools: "Escolas Gülenistas"
 TUR_gulenist_schools_desc: "A educação é um dos princípios fundamentais de Fethullah Gülen. Uma educação adequada mantém a mente saudável e as pessoas seguem as ideias corretas"
 TUR_modern_islam: "Islã Moderno"
 TUR_modern_islam_desc: "O Islã é perfeitamente compatível com os valores ocidentais e a democracia. Devemos provar ao mundo que nossa fé em Deus nos torna pessoas melhores e mais compreensivas"
 TUR_mobilising_the_movement: "Mobilizar o Movimento"
 TUR_mobilising_the_movement_desc: "O Movimento Gülenista tem membros em todo o mundo. Nossa rede nos concederá muitos recursos para uso"
 TUR_interfaith_dialogue: "Diálogo Inter-religioso"
 TUR_interfaith_dialogue_desc: "Gülen teaches us to understand other religions. It is important that Islam has good relations with other major religions of the world, so we aren't left behind. We should hold diplomatic talks with clerics of non-Muslim countries"
 TUR_gulenist_funds: "Fundos Gülenistas"
 TUR_gulenist_funds_desc: "A organização Gülenista detém milhares de milhões de dólares em valor em várias fundações e empresas. Deveríamos mobilizar estes fundos para ajudar o regime"
 TUR_gulenist_economists: "Economistas Gülenistas"
 TUR_gulenist_economists_desc: "Com base num grande grupo de profissionais internacionais, podemos contratar economistas especializados para aconselhar o nosso governo sobre como gerir a economia"
 TUR_gulenist_information: "Informantes Gülenistas"
 TUR_gulenist_information_desc: "Usando nossa vasta rede, podemos coletar informações sobre países estrangeiros com mais facilidade"
 TUR_gulenist_education: "Educação Gülenista"
 TUR_gulenist_education_desc: "Focusing on education will be the key to bringing Turkey forward"
 TUR_the_great_mediator: "O Grande Mediador"
 TUR_the_great_mediator_desc: "Fethullah Gülen é um grande líder, estudioso e diplomata. Ele é um homem de paz e deseja apenas paz e prosperidade para o mundo"
 TUR_approach_tradition: "Tradição de Abordagem"
 TUR_approach_tradition_desc: "Nossa vitória nos mostrou que as pessoas anseiam pela tradição. Devemos mostrar que o mundo islâmico está passando por um renascimento e em breve será a cultura dominante na Terra"
 TUR_reduce_freedom_of_press: "Reduzir a liberdade de imprensa"
 TUR_reduce_freedom_of_press_desc: "The so called 'free press' is nothing more than a tool to slander Islam and spread the media's vile secular ideas. We need to limit their ability to operate, and shut them down if we have to."
 TUR_mobilise_the_faithful: "Mobilizar os fiéis"
 TUR_mobilise_the_faithful_desc: "O Movimento Gülenista é vasto e tem uma multidão de membros. Devemos encorajar os nossos membros a migrar para a Turquia"
 TUR_convert_radicals: "Converter Radicais"
 TUR_convert_radicals_desc: "O Islã que Gülen ensina é a única forma correta de Islã. Há muitos que discordariam disso e precisam ser erradicados"
 TUR_beacon_of_islam: "O Grande Estudioso"
 TUR_beacon_of_islam_desc: "Fethullah Gülen é o maior estudioso do Islã, e seus ensinamentos serão conhecidos em todo o mundo. É claro que pregar o Islã conservador pode ter alguns efeitos colaterais..."
 TUR_economic_reforms: "Reformas Econômicas"
 TUR_economic_reforms_desc: "A economia está em ruínas e precisamos melhorá-la rapidamente. Neste momento, a economia depende fortemente do investimento estrangeiro, que é algo que precisamos de mudar"
 TUR_increase_unemployment_insurance: "Aumentar o Seguro Desemprego"
 TUR_increase_unemployment_insurance_desc: "The economic crisis has left many Turks without a job. While it will greatly hurt the government's budget, we need to increase the unemployment benefits to keep people alive. It will also inject a small amount of money into the economy, hopefully increasing consumption"
 TUR_small_imf_loans: "Pequenos empréstimos do FMI"
 TUR_small_imf_loans_desc: "The IMF has offered a small loan of $11.4 billion. Many analysts suggest that this is nowhere near enough to help the Turkish economy, but it's doubtful we'll be able to get more from the IMF"
 TUR_large_imf_loans: "Grandes empréstimos do FMI"
 TUR_large_imf_loans_desc: "With more concessions, we might be able to negotiate with the IMF so that we would be granted a larger loan from them."
 TUR_reduce_foreign_investors: "Reduzir a dependência de investidores"
 TUR_reduce_foreign_investors_desc: "A maior parte da economia turca baseia-se no investimento estrangeiro constante e no fluxo de capital de outros países. Precisamos injetar fundos governamentais na economia e reduzir a nossa dependência dos mercados estrangeiros"
 TUR_more_foreign_investors: "Aumentar a confiança nos investidores"
 TUR_more_foreign_investors_desc: "Vamos precisar de capitalizar os investidores estrangeiros para obter mais capital de outros países"
 TUR_sell_government_companies: "Vender empresas governamentais"
 TUR_sell_government_companies_desc: "Para obter alguma receita extra, precisamos vender algumas das empresas atualmente propriedade do Estado turco"
 TUR_loosen_industrial_regulations: "Afrouxar a regulamentação industrial"
 TUR_loosen_industrial_regulations_desc: "Para incentivar o crescimento, precisamos afrouxar as regulamentações que impomos à indústria. Isso certamente impulsionará a economia"
 TUR_economic_crisis_over: "Plano de Recuperação da Crise Económica"
 TUR_economic_crisis_over_desc: "We need to establish an economic recovery plan as soon as possible if we expect the Turkish nation to thrive monetarily. If we do not, we put our people's lives and jobs at risk and we cannot afford such a massive loss."
 TUR_western_development: "Desenvolvimento no Ocidente"
 TUR_western_development_desc: "Precisamos desenvolver o oeste do nosso país, já que a maioria das nossas principais cidades está situada lá e as pessoas esperam um padrão de vida mais elevado"
 TUR_centeral_development: "Desenvolvimento Central"
 TUR_centeral_development_desc: "A nossa capital, Ancara, está situada no centro do nosso país. Precisamos de melhorar as condições de vida lá, e também nas cidades vizinhas, para que o nosso establishment político tenha uma base de legitimidade"
 TUR_eastern_development: "Desenvolvimento no Oriente"
 TUR_eastern_development_desc: "Há muito tempo que negligenciamos as províncias orientais e as pessoas merecem melhor. A modernização da infra-estrutura lá ajudará muito mais a população rural"
 TUR_southern_attention: "Atenção do Sul"
 TUR_southern_attention_desc: "Tal como o Leste, o Sul do nosso país também foi um pouco esquecido. Os investimentos no Sul serão necessários para a economia prosperar"
 TUR_the_industries: "As Indústrias"
 TUR_the_industries_desc: "Nosso setor industrial está começando a ficar para trás em relação aos nossos vizinhos e aliados, e devemos mudar isso. Alocaremos parte do nosso orçamento às empresas turcas para que possam ter sucesso por conta própria"
 TUR_bereket: "Energia Bereket"
 TUR_bereket_desc: "Bereket provides clean and renewable energy to the Turkish people, and it must continue doing that. Extra funding will give them the ability to expand, and grow"
 TUR_petroli_anonim: "Petróleo Anônimo"
 TUR_petroli_anonim_desc: "A Petrolleri Anonim foi fundada em 1954 e conseguiu muitas coisas para o setor petrolífero turco. Precisamos mudar nosso foco industrial na produção de mais petróleo para nós mesmos e para o resto do mundo"
 TUR_the_factories: "As fábricas"
 TUR_the_factories_desc: "Nossas fábricas estão começando a ficar velhas, desatualizadas e ineficientes. Novas fábricas situadas no Noroeste do nosso país melhorarão muito mais a situação e poderemos deslocar mais pessoas para trabalhar lá"
 TUR_kipas_textile: "Bolsa Têxtil"
 TUR_kipas_textile_desc: "Kipas Textile produces some of the highest quality fabrics in our nation, and provides our economy with something to export to other countries"
 TUR_arkas_shipping: "Envio Arkas"
 TUR_arkas_shipping_desc: "Arkas is a national shipping company that transports goods globally. It is very obvious what we must do, we must focus on getting them new dockyards so that they may continue to get from place to place without a problem"
 TUR_the_people: "O Povo"
 TUR_the_people_desc: "Ao melhorar a nossa economia, não podemos esquecer a razão pela qual a estamos a melhorar, as pessoas. O nosso povo vai precisar de algumas melhorias a nível nacional que melhorem o seu nível de vida"
 TUR_hakarri_trabzone_railway: "Ferrovia Hakkari-Trabzon"
 TUR_hakarri_trabzone_railway_desc: "We will connect Hakkari and Trabzon, for the folks that live in the east of our country. This way, they are able to get to and from the Trabzon port in case they wish to set out to travel"
 TUR_istanbul_airport: "Expandir a Turkish Airlines"
 TUR_istanbul_airport_desc: "Turkish Airlines is our domestically run airline, and we will start construction on some new airports for them. Our people will be able to easily travel within, and outside of Turkey knowing they are flying on a Turkish plane"
 TUR_the_neighbors: "Os Vizinhos"
 TUR_the_neighbors_desc: "Os nossos vizinhos que nos rodeiam serão cruciais para resolver a nossa crise económica. Usaremos investimentos para colher influência e laços económicos entre as nossas nações"
 TUR_look_west: "Nossos vizinhos ocidentais"
 TUR_look_west_desc: "Os nossos vizinhos ocidentais, a Grécia e a Bulgária, tiveram muitos problemas no que diz respeito à economia. Por isso, será sensato investirmos neles, pois são centros económicos em ascensão"
 TUR_look_east: "Nossos vizinhos orientais"
 TUR_look_east_desc: "Os nossos vizinhos orientais, o Irão, a Arménia e a Geórgia, tiveram todos um crescimento económico e um colapso. Investiremos nas suas nações para que as suas economias possam ser ajudadas a crescer ainda mais"
 TUR_the_military: "Os Militares"
 TUR_the_military_desc: "Os militares serão cruciais para manter nossa economia funcionando, pois, esperançosamente, eles não tentarão nos tirar do poder"
 TUR_fix_samsites: "Repair SAM Sites"
 TUR_fix_samsites_desc: "The SAM sites in our nation are starting to grow old. If we expect them to function properly, we are going to have to repair them."
 TUR_ministry_of_defense_repairs: "Satisfazer o Ministério da Defesa"
 TUR_ministry_of_defense_repairs_desc: "O Ministério da Defesa tem nos pedido para abrir mais indústrias militares e hoje iremos conceder-lhes exatamente isso"
 TUR_funds_for_tubitak_sage: "TUBITAK Sábio"
 TUR_funds_for_tubitak_sage_desc: "TUBITAK Sage is our nation's Research and Development institute. If we want our military technology to be up to date, we are going to have to give them some extra facilities."
 TUR_stage_two: "Estágio Dois"
 TUR_stage_two_desc: "Estamos finalmente a entrar na segunda fase do nosso plano económico. Nesta fase, aumentaremos o estímulo económico e centralizaremos a nossa governação"
 TUR_economic_stimulation: "Estimulação Económica"
 TUR_economic_stimulation_desc: "Injetaremos fundos adicionais na economia para fazê-la funcionar e fazê-la crescer naturalmente, em vez de manualmente"
 TUR_national_power_grid: "Expandir a Rede Elétrica Nacional"
 TUR_national_power_grid_desc: "Due to an increase in our nation's population, the power grid is unable to properly function as a result of more people using electricity, causing an uptick in blackouts. By expanding it, we will be able to provide stable power for all households across the nation"
 TUR_the_budgets: "Revisões do orçamento"
 TUR_the_budgets_desc: "Precisamos revisar nosso orçamento, para ver o que precisamos priorizar e o que não precisamos priorizar"
 TUR_funds_for_social_spending: "Priorizar o bem-estar social"
 TUR_funds_for_social_spending_desc: "Nosso povo, especialmente os aposentados e os deficientes, depende de fundos do governo para continuar. Precisamos priorizar ajudá-los em momentos de necessidade"
 TUR_funds_for_healthcare: "Priorizar cuidados de saúde"
 TUR_funds_for_healthcare_desc: "Obviamente, as pessoas vão ficar doentes. Precisaremos priorizar os gastos com saúde para ajudar aqueles que precisam a sair de situações terríveis sem ter que ir à falência"
 TUR_funds_for_tubitak_mam: "TUBITAK Mãe"
 TUR_funds_for_tubitak_mam_desc: "TUBITAK Mam is a domestically run research center, and we will need to utilize them to find cheap, but effective new solutions for our people's health and well-being"
 TUR_stage_three: "Estágio Três"
 TUR_stage_three_desc: "A Terceira Fase dará prioridade à transição da nossa economia para uma economia baseada no conhecimento. Desta forma, o nosso povo será incentivado a obter uma educação adequada para ganhar um bom dinheiro"
 TUR_research_grants: "Emitir bolsas de pesquisa"
 TUR_research_grants_desc: "We will issue research grants for our scientists and students to find new solutions to everyday life. This way, we will be able to modernize faster than ever before, and it will let us expand our technological capabilities"
 TUR_energy_research: "Pesquisa Energética"
 TUR_energy_research_desc: "In Stage One of our economic plan, we gave funding to an energy company to get our energy sector more efficient. However now we will have to find new ways to deliver and produce this energy so that we can cut down costs where needed"
 TUR_industrial_research: "Pesquisa Industrial"
 TUR_industrial_research_desc: "Queremos começar a produzir cada vez mais a cada dia, por isso teremos que encontrar novas formas de produzir bens"
 TUR_electronic_research: "Pesquisa Eletrônica"
 TUR_electronic_research_desc: "O mundo inteiro está se tornando digital e a Turquia não pode ser diferente. Começaremos a pesquisar novas tecnologias e lançaremos algumas novas empresas para ajudar nisso"
 TUR_tubitak_space: "Espaço TUBITAK"
 TUR_tubitak_space_desc: "TUBITAK Space will be our domestically run space technology institute, and they will seriously assist in getting us ahead when the time comes to go to space"
 TUR_sattelite_development: "Desenvolvimento de satélite"
 TUR_sattelite_development_desc: "Desenvolveremos novas tecnologias de satélite para conectar nosso pessoal com o resto do mundo, à medida que as novas tecnologias inauguram uma nova era de conectividade entre as pessoas"
 TUR_gokturk_launch: "Lançamento do satélite Goktürk"
 TUR_gokturk_launch_desc: "Lançaremos o satélite Goktürk-1A ao espaço, pois ele nos ajudará a obter imagens da Terra de alta qualidade, auxiliando tanto nosso povo quanto nossos militares"
 TUR_funds_for_tai: "Expandir as indústrias aeroespaciais turcas"
 TUR_funds_for_tai_desc: "As indústrias aeroespaciais turcas precisam começar a se expandir se quisermos conseguir mais empregos para a população. Começaremos a militarizá-las e a produzir tecnologia de guerra espacial"
 TUR_asteroid_mining_missions: "Missões de mineração de asteróides"
 TUR_asteroid_mining_missions_desc: "Começaremos a minerar asteróides em busca de metais e recursos preciosos para que possamos economizar recursos aqui na Terra"
 TUR_drilling_technology: "Tecnologia de Perfuração"
 TUR_drilling_technology_desc: "Agora que iniciamos a mineração de asteroides, precisaremos de novas tecnologias de perfuração para extrair asteroides maiores e mais resistentes"
 TUR_launching_facilities: "Instalações de lançamento"
 TUR_launching_facilities_desc: "Novas instalações de lançamento serão necessárias para o lançamento de missões a asteróides. As atuais que temos estão começando a desmoronar e ficar obsoletas, e novas serão cruciais"
 TUR_mission_to_moon: "Turcos na Lua"
 TUR_mission_to_moon_desc: "Treinaremos astronautas turcos e prepararemos uma espaçonave para uma missão à lua"
 TUR_stage_four: "Estágio Quatro"
 TUR_stage_four_desc: "Stage Four, the last and final stage for our economy is going to be focused on our domestic policies and people's daily lives"
 TUR_peoples_education: "The People's Education"
 TUR_peoples_education_desc: "A educação vai ser crucial, precisaremos da nossa gente na sala de aula para que a nossa população seja alfabetizada"
 TUR_the_security_of_people: "Segurança do Povo"
 TUR_the_security_of_people_desc: "Se o nosso povo não se sente seguro, como podemos esperar que participem economicamente?"
 TUR_destroying_corruption: "Destruindo a Corrupção"
 TUR_destroying_corruption_desc: "Temos homens corruptos em nossos setores econômicos pegando dinheiro para si mesmos quando poderia ter sido direcionado para melhorar o país"
 TUR_the_great_economy: "A Grande Economia Turca"
 TUR_the_great_economy_desc: "Finalmente, finalmente alcançamos o que nos propusemos a fazer anos atrás, com sangue, suor e lágrimas, finalmente alcançamos a Grande Economia Turca!"
 TUR_tubitak: "Indústria TUBITAK"
 TUR_tubitak_desc: "Vamos expandir o TUBITAK para incluir pesquisas de novas tecnologias industriais, para que possamos melhorar ainda mais a economia."
 TUR_turkish_agriculture: "Agricultura Turca"
 TUR_turkish_agriculture_desc: "Large portions of our nation run on agriculture, and urbanized fields. And because of that, we must double our efforts in providing functional technology for the farmers and workers."
 TUR_turkish_mining: "Mineração Turca"
 TUR_turkish_mining_desc: "Temos uma indústria de mineração bastante decente e ela pode nos ajudar a fornecer materiais para nossas fábricas e para o mercado."
 TUR_expansion_of_fuel_industries: "Expansão das Indústrias de Combustíveis"
 TUR_expansion_of_fuel_industries_desc: "Expandir as indústrias de combustíveis pode ser benéfico para nós no longo prazo, à medida que nos tornamos cada vez mais industrializados e mecanizados."
 TUR_bridge_to_europe: "Uma ponte para a Europa"
 TUR_bridge_to_europe_desc: "Somos uma ponte para a Europa e, por esta razão, somos muito importantes financeiramente para eles. Precisamos de capitalizar a nossa posição no mundo e ganhar tanto dinheiro quanto possível."
 TUR_taek: "TAEK"
 TUR_taek_desc: "A Autoridade Turca de Energia Atômica, ou também conhecida como TAEK, tem a tarefa de planejar e estabelecer o desenvolvimento da energia nuclear na Turquia."
 TUR_double_steel_efforts: "Produção de aço duplo"
 TUR_double_steel_efforts_desc: "Somos um grande exportador de aço e metais e teremos que duplicar os nossos esforços para podermos exportar mais, ganhando assim mais dinheiro."
 TUR_togg: "TREINO"
 TUR_togg_desc: "TOGG is an acronym for Türkiye'nin Otomobili Girişim Grubu. It is an automobile manufacturer of electric vehicles within our nation, and it is best that our government supports them with new facilities."
 TUR_textiles_ethiopia: "Têxteis Turcos na Etiópia"
 TUR_textiles_ethiopia_desc: "Operamos algumas pequenas fábricas têxteis na Etiópia, mas seria melhor duplicá-las em tamanho para que possamos expandir a nossa influência económica."
 TUR_standardize_construction_regulations: "Regulamentações de Construção"
 TUR_standardize_construction_regulations_desc: "Nossas regulamentações de construção estão uma bagunça, levando à criação de edifícios instáveis, o que, por sua vez, causa desastres. Teremos que apertar nossas regulamentações e padronizá-las para que sejam universais em toda a nossa nação."
 TUR_telecommunications_authority: "Autoridade de Telecomunicações"
 TUR_telecommunications_authority_desc: "A Autoridade de Telecomunicações, ou ICTA, é encarregada de criar centros de comunicação padronizados e linhas de telecomunicação."
 TUR_tighten_housing_regulation: "Regulamentações Habitacionais"
 TUR_tighten_housing_regulation_desc: "Over 40% of our nation's housing does not conform with standard regulations, we are going to have to change that. We will run mandatory inspections and fix whatever is necessary."
 TUR_the_mafia: "A Máfia"
 TUR_the_mafia_desc: "A Máfia tem nos causado problemas já há algum tempo, e é melhor que comecemos lentamente a nos livrar de sua influência em nossa nação se quisermos a verdadeira estabilidade."
 TUR_end_of_organized_crime: "Alvo do crime organizado"
 TUR_end_of_organized_crime_desc: "Organized Crime is quite common in Turkey, in fact, it is running rampant now more than ever. We are going to have to target organized crimes and criminals, so that they stop disrupting daily life, and stop making governing so difficult."
 TUR_combat_their_influence: "Combater sua influência"
 TUR_combat_their_influence_desc: "We need to combat the Mafia's influence to prevent our youth from being sworn into a life of never-ending crime."
 TUR_begin_arrests: "Iniciar prisões"
 TUR_begin_arrests_desc: "Though our list of high-priority criminals is quite small at the moment, we should at least start by arresting the current suspects that we know of. We can perhaps use them to discover more of them through interrogation."
 TUR_anti_mafia_initiative: "Campanha Antimáfia"
 TUR_anti_mafia_initiative_desc: "Ao lançar campanhas que desencorajam a adesão às máfias, podemos salvar inúmeras vidas."
 TUR_awareness_campaigns: "Programas nas Escolas"
 TUR_awareness_campaigns_desc: "É imperativo que iniciemos o sentimento antimáfia desde cedo, e podemos conseguir isso iniciando programas nas escolas."
 TUR_tighten_police_training: "Aprimorar o treinamento policial"
 TUR_tighten_police_training_desc: "Nossa força policial às vezes pode ser pouco profissional e para isso precisaremos aprimorar seu treinamento."
 TUR_install_cctv: "Novo CFTV"
 TUR_install_cctv_desc: "Infelizmente, parece que a vigilância será a única maneira de capturar criminosos em flagrante. Apesar de algumas reações adversas, não temos outra escolha a não ser fazer isso."
 TUR_tighten_border_patrol: "Aumentar a patrulha de fronteira"
 TUR_tighten_border_patrol_desc: "Criminals are bringing in drugs and illegal goods from the outside, and this is a clear indicator that our border patrol is not effective. We are going to increase border patrol to mitigate the flow of illegal goods from other borders."
 TUR_assistance_to_iraq: "Assistência ao Iraque"
 TUR_assistance_to_iraq_desc: "O Iraque está atualmente afogado em crimes, e muitos deles estão relacionados com drogas. Podemos fornecer-lhes a nossa experiência para que possam controlar o seu problema com as drogas."
 TUR_only_getting_started: "Apenas começando"
 TUR_only_getting_started_desc: "We are only getting started. Now that the government has been overrun by our organizations, we can start shaping the region, and ultimately the world to better fit our agenda, the Mafia's Agenda."
 TUR_contact_italian_mafia: "Entre em contato com a máfia italiana"
 TUR_contact_italian_mafia_desc: "A máfia italiana está à solta na Itália e o governo não tem sido muito eficaz em contê-la. Podemos oferecer-lhes apoio e assistência para reforçar a sua posição."
 TUR_utilize_gray_wolves: "Alie os Lobos Cinzentos"
 TUR_utilize_gray_wolves_desc: "Os Lobos Cinzentos nos ajudaram no passado e por essa razão podemos aliá-los agora e trazê-los para ajudar a governar o país."
 TUR_start_global_campaign: "A Campanha Global"
 TUR_start_global_campaign_desc: "Our job is not done yet, we need to go international. The Mafia's reach is going to be unlimited, and we will benefit from the chaos."
 TUR_defund_police: "Desfinanciar a Polícia"
 TUR_defund_police_desc: "The Police are quite disloyal to us, and for that reason, we need to curb their ability to fight against us. We will do this by defunding them, and seizing their weapons for ourselves."
 TUR_invite_landowners: "Convide os proprietários de terras"
 TUR_invite_landowners_desc: "Os proprietários de terras são uma elite rica e, em vez de sermos inimigos deles, deveríamos aliá-los. Podemos obter o apoio deles e ganhar mais dinheiro sendo amigos deles."
 TUR_take_out_iran: "Aproveitar o Irã"
 TUR_take_out_iran_desc: "Se eliminarmos o Irão, teremos acesso a muito mais países. Invadiremos o Irão e usá-lo-emos como um centro para exportar a nossa influência para a Ásia."
 TUR_central_asia: "Na Ásia Central"
 TUR_central_asia_desc: "O mercado da Ásia Central está maduro para os produtos da Máfia. Vamos abrir esses mercados e usá-los para obter lucro."
 TUR_the_armed_forces_of_turkiye: "Forças Armadas da Turquia"
 TUR_the_armed_forces_of_turkiye_desc: "The Armed Forces of Turkey, or otherwise known as the TSK, are tasked with protecting Turkey's territorial integrity and its people."
 TUR_ground_force: "As Forças Terrestres"
 TUR_ground_force_desc: "The Land forces are the men who have boots on the ground, fighting the wars within a nation's borders. The ground forces mainly consist of Infantry and Mechanized units."
 TUR_battery_bases: "Baterias TEL"
 TUR_battery_bases_desc: "Nosso arsenal de baterias TEL está começando a envelhecer e problemas de funcionamento não são incomuns. Teremos que construir novas o mais rápido possível para garantir que tenhamos um sistema de lançamento flexível."
 TUR_fortify_east: "Fortalecer o Leste"
 TUR_fortify_east_desc: "O Leste do nosso país tem visto a maior turbulência. Desde a resistência interna, até invasões de exércitos inimigos, será uma atitude tola não fortificar o Leste."
 TUR_fortify_west: "Fortalecer o Ocidente"
 TUR_fortify_west_desc: "Although the West of our country is more secure than the East, we can never be certain. Rising tensions with our neighbors have made the matter tricky, and for that reason we cannot take any risks."
 TUR_silos: "Novos Silos"
 TUR_silos_desc: "Atualmente não temos nenhum Silo de Mísseis, e se esperamos ser uma grande potência, precisaremos construir alguns. A construção começará imediatamente e avisaremos o mundo para que nossos inimigos fique longe!"
 TUR_sam_sites: "Proteja os céus"
 TUR_sam_sites_desc: "SAM Sites will be crucial to close down our airspace if needed. Due to the nature of modern jets, we cannot always rely on our own aircraft to shoot them down, we will need Sam Sites, and a good amount of them."
 TUR_abm_bases: "Bases ABM"
 TUR_abm_bases_desc: "Since we were capable of getting Missile Silos and the ability to launch missiles at a reasonable distance, we should also be wary of the other nations that have this same capability. We are going to have to build ABM bases to ensure we are able to shoot down enemy missiles in time."
 TUR_the_soldiers: "Os Soldados"
 TUR_the_soldiers_desc: "Nossos soldados são o que compõem nosso exército. Teremos que equipá-los com a melhor e mais recente tecnologia para que estejam preparados para o combate!"
 TUR_tanks: "Novos Tanques"
 TUR_tanks_desc: "Toda a Europa está modernizando seus estoques de tanques, e a Turquia deve fazer o mesmo. Faremos com que nossos melhores engenheiros projetem um tanque moderno que nossa nação possa usar nos próximos anos."
 TUR_afvs: "IFVs"
 TUR_afvs_desc: "O combate terrestre está começando a mudar para veículos blindados de infantaria, como IFVs e APCs. Teremos que nos adaptar e fazer o mesmo."
 TUR_troop_carriers: "Transportadores de tropas"
 TUR_troop_carriers_desc: "Nossos soldados precisam de uma maneira de chegar ao campo de batalha de maneira segura e oportuna. Os APCs são o melhor equipamento que podemos produzir para conseguir isso."
 TUR_mandatory_draft_woman: "Mulheres como soldados"
 TUR_mandatory_draft_woman_desc: "Não importa o sexo, todos devem servir em nossas forças armadas. As mulheres constituem metade da nossa sociedade, então por que deveríamos afastá-las das leis de recrutamento?"
 TUR_other_use_woman: "Women in the Research Sector"
 TUR_other_use_woman_desc: "Precisamos de apoio extra quando se trata de pesquisa, e nossas mulheres não estão servindo ativamente nas forças armadas, então é melhor educá-las e fazer com que criem tecnologia de ponta para nossas tropas."
 TUR_new_artillery: "Modernizar os estoques de artilharia"
 TUR_new_artillery_desc: "Our Artillery Stockpiles are starting to fall apart. This cannot continue, as artillery has consistently proved itself throughout history to be a way for armies to stage attacks before they even start!"
 TUR_the_airforce: "The Turkish Air Force"
 TUR_the_airforce_desc: "The Turkish Air Force is the aerial branch of the Turkish Armed Forces, and they are mainly tasked with maintaining Turkish Air Superiority in times of combat, whilst also maintaining Turkey's aerial integrity."
 TUR_expand_jet_program: "Programa Jato Doméstico"
 TUR_expand_jet_program_desc: "Jets are now the key player when it comes to aerial combat. We will need to try and start researching ways to create domestic aircraft so that we can drop our reliance on others."
 TUR_air_superiority: "Caças de Superioridade Aérea"
 TUR_air_superiority_desc: "If we don't have air superiority, then we don't have anything. Developing air superiority fighters should be a very high priority as we are able to guarantee our close air support's safety."
 TUR_cas: "Apoio Aéreo Próximo"
 TUR_cas_desc: "No combate moderno, não é muito incomum que as forças terrestres requeiram apoio aéreo para ajudar no combate ao inimigo. Por essa razão, a Turquia precisará desenvolver alguma nova tecnologia CAS para produção doméstica."
 TUR_open_drone_research: "Drones e helicópteros"
 TUR_open_drone_research_desc: "Muitas vezes ofuscados por outras aeronaves, Drones e Helicópteros podem ser cruciais em combate, especialmente para as tropas no terreno."
 TUR_new_helicopters: "Novos Helicópteros"
 TUR_new_helicopters_desc: "Helicópteros podem ajudar a transportar soldados e outros homens para dentro e para fora do campo de batalha muito rapidamente quando necessário, e seria um erro de nossa parte ignorar tal necessidade."
 TUR_baryaktars: "Bayraktars"
 TUR_baryaktars_desc: "We will have to develop a domestic drone that is capable of taking out enemy targets from a pretty good distance. The Bayraktar will do just that!"
 TUR_purchase_from_others: "Olhar para o mercado"
 TUR_purchase_from_others_desc: "Não podemos colocar muita pressão sobre a nossa economia para desenvolver aeronaves domésticas, por isso devemos também considerar a compra de algumas do Oriente e do Ocidente."
 TUR_british_jets: "Lutadores de superioridade britânica"
 TUR_british_jets_desc: "The British Air Force has been around for some time, and their aircraft have aged quite well. It would be a wise decision to buy some aircraft from them."
 TUR_american_jets: "Multifunções americanas"
 TUR_american_jets_desc: "America is the global super power, and currently boasts the best air force. This pretty much means that it is in our best interest to buy some Multi-Role Aircraft from them."
 TUR_russian_jets: "Caçadores de Ataque Russos"
 TUR_russian_jets_desc: "Os russos são especialistas quando se trata de Strike Fighters e estão dispostos a nos vender algumas unidades... a um custo."
 TUR_chinese_jets: "Bombardeiros Chineses"
 TUR_chinese_jets_desc: "Currently we are lacking bomber aircraft in our air force, but the Chinese are not. We can buy a couple of units from them so that we don't fall behind."
 TUR_the_navy: "A Marinha Turca"
 TUR_the_navy_desc: "A Marinha Turca é o ramo marítimo das Forças Armadas Turcas e a sua fundação remonta a 1081."
 TUR_upgrade_bosphorus_fleet: "Atualizações para a Frota do Bósforo"
 TUR_upgrade_bosphorus_fleet_desc: "A frota do Bósforo consiste principalmente de fragatas e corvetas obsoletas, o que significa que poderiam ser facilmente exterminadas por navios maiores e mais avançados em tempos de guerra."
 TUR_frigate_upgrades: "Atualizações de fragata"
 TUR_frigate_upgrades_desc: "Apesar de termos um grande número de fragatas, elas não são muito avançadas. Teremos que atualizar algumas delas para garantir que possam resistir na batalha."
 TUR_fortify_istanbul: "Fortificar Istambul"
 TUR_fortify_istanbul_desc: "Istanbul is constantly at risk of bombardment and attack due to its close proximity to the Bosphorus. If an enemy fleet tries to pass through, Istanbul will be the closest major city for them to attack and destroy."
 TUR_new_corvettes: "Novas Corvetas"
 TUR_new_corvettes_desc: "Não temos muitas corvetas e por isso podemos pesquisar e criar novos modelos sem ter que nos preocupar muito em atualizar nossa frota mais antiga."
 TUR_bosphorus_taxation: "Exercícios com os fuzileiros navais"
 TUR_bosphorus_taxation_desc: "Precisamos realizar exercícios com os fuzileiros navais turcos para que estejamos prontos para uma invasão naval a qualquer momento."
 TUR_mediteranean_fleet: "Mediterranean Fleet"
 TUR_mediteranean_fleet_desc: "Our Mediterranean fleet is of a very high priority, as it is the fleet that ensures our nation an access to the outside without having to interfere with the Aegean."
 TUR_new_submarine: "Novos Submarinos"
 TUR_new_submarine_desc: "Precisamos de submarinos para poder surpreender os navios inimigos por baixo."
 TUR_new_cruisers: "Novos Cruzadores"
 TUR_new_cruisers_desc: "Cruisers are arguably some of the most important ships we could have deployed, as they are typically the largest ship in a fleet besides an aircraft carrier."
 TUR_new_heli_pads: "Aircraft Carriers"
 TUR_new_heli_pads_desc: "Grandes potências estão começando a construir novos porta-aviões para afirmar seu domínio no cenário mundial. Devemos fazer o mesmo e devemos começar a construir nossos próprios porta-aviões!"
 TUR_tcg_anadolu_plans: "Implantar a fragata Istambul"
 TUR_tcg_anadolu_plans_desc: "Estamos construindo uma fragata de última geração chamada TCG Istanbul e ela está pronta para ser implantada!"
 TUR_navy_regulations: "Reforçar os Regulamentos da Marinha"
 TUR_navy_regulations_desc: "A qualidade deve ser valorizada acima da quantidade, por isso teremos que aumentar a regulamentação na hora de produzir novos navios para a nossa marinha."
 TUR_tsk_coup: "TSK na política"
 TUR_tsk_coup_desc: "Our people are in grave danger of being overrun by Islamist ideology and their dangerous political views. The TSK is the only viable group that can be trusted with protecting the Turkish Republic's ideals."
 TUR_crush_kurdish_resistance: "Esmagar a Resistência Curda"
 TUR_crush_kurdish_resistance_desc: "Usando táticas eficazes, esmagaremos a resistência curda a ponto de eles terem dificuldade em se recuperar."
 TUR_crush_radicalism: "Esmagar o Radicalismo"
 TUR_crush_radicalism_desc: "O radicalismo será a ruína desta nação e, por essa razão, devemos esmagá-la imediatamente."
 TUR_upgrading_mili_infrastructure: "Aprimorar as indústrias militares"
 TUR_upgrading_mili_infrastructure_desc: "Nossas indústrias militares têm deixado a desejar ultimamente, e se quisermos dispor de equipamentos adequados, teremos que melhorá-los um pouco."
 TUR_subdue_kurdish_independence: "Operação no Leste"
 TUR_subdue_kurdish_independence_desc: "Os armênios e georgianos já fazem parte da CSTO ou são membros potenciais da CSTO. Teremos que conduzir operações para evitar que eles se juntem a essa organização."
 TUR_root_out_ulama: "Erradicar o Ulama"
 TUR_root_out_ulama_desc: "The Ulama do not wish to see a secular and non-islamist Turkey, and they most likely pray for our downfall. We will purge their positions in office if they have any, and we will replace them with maritime conglomerates."
 TUR_ban_islamist_parties: "Banir os islâmicos da política"
 TUR_ban_islamist_parties_desc: "Um problema que as administrações anteriores não conseguiram resolver foi a ascensão dos islamistas na nossa política. Teremos que proibir imediatamente todos eles de participarem nas eleições, para que a nossa nação possa estar a salvo de ideologias perigosas."
 TUR_military_conglomorates: "Conglomerados Militares"
 TUR_military_conglomorates_desc: "Devido à ascensão do TSK à política turca, muitas empresas militares têm pressionado por mais representação em nosso governo. Poderíamos facilmente conceder-lhes isso, mas ao custo de alienar nossos conglomerados industriais."
 TUR_train_foreign_troops: "Treinar tropas estrangeiras"
 TUR_train_foreign_troops_desc: "Our armed forces has the capability to train other nations' armies without a problem. Doing it will give us influence, and experience."
 TUR_secularist_dominance: "Dominância Secularista"
 TUR_secularist_dominance_desc: "Secularism will dominate our politics, just like it historically should have. Our nation will follow the path it was always intended to."
 TUR_reform_mit: "Reforma COM"
 TUR_reform_mit_desc: "MIT is our nation's intelligence agency, and it needs reforming to better fit the agenda of our Armed Forces."
 TUR_new_airbases: "Novos Regulamentos Aéreos"
 TUR_new_airbases_desc: "Passing new regulations for our air force will certainly ensure that our pilots have proper training, and that they use the right strategies during combat."
 TUR_cooperate_mit: "Utilize o MIT"
 TUR_cooperate_mit_desc: "Utilizar os ativos e agentes que temos trabalhando no MIT pode ser útil para nossas forças armadas coletarem informações e dados."
 TUR_military_dominance: "Hegemonia Militar"
 TUR_military_dominance_desc: "The new laws, changes, and overhauls to the system have ensured that the Military will have hegemony and control over all aspects of Turkish Politics."
 TUR_our_society: "Sociedade Turca"
 TUR_our_society_desc: "Turkish Society is constantly changing and evolving into something new. Though the government's role is typically limited when it comes to this due to certain restraints, there have been times where we needed to intervene and there will be times where we will have to intervene to make changes to our policies."
 TUR_mit: "O MIT"
 TUR_mit_desc: "MIT is our nation's intelligence agency tasked with protecting the government and policies of the nation from internal and external threats."
 TUR_domestic_focus: "Foco Doméstico"
 TUR_domestic_focus_desc: "O MIT deveria se concentrar em proteger a nação de ameaças internas, como maus atores que desejam derrubar o governo espalhando ideais perigosos."
 TUR_foreign_focus: "Foco Estrangeiro"
 TUR_foreign_focus_desc: "O MIT deveria se preocupar com as ameaças de fora de nossas fronteiras, pois as pessoas nunca desejarão causar danos à sua própria nação."
 TUR_disaster_relief: "Plano de Desastre"
 TUR_disaster_relief_desc: "Atualmente não temos nenhum plano de desastre, o que significa que não estamos preparados para proteger e ajudar nossos cidadãos."
 TUR_charity_based: "Estabelecer um sistema liderado por caridade"
 TUR_charity_based_desc: "As instituições de caridade cobrirão nosso pessoal quando ocorrer um desastre, para que possamos reduzir bastante os gastos."
 TUR_government_reliant: "Estabelecer um sistema liderado pelo governo"
 TUR_government_reliant_desc: "É função do governo ajudar o seu povo quando ocorre um desastre, mesmo que isso signifique aumentar nossos gastos."
 TUR_migration_problems: "Problemas de migração"
 TUR_migration_problems_desc: "Sempre tivemos problemas com o influxo de migrantes que chegavam ao país. Mas nunca soubemos o que fazer com eles depois que seus problemas terminaram em seu país de origem."
 TUR_open_door_policy: "Política de Portas Abertas"
 TUR_open_door_policy_desc: "Ao optar por usar uma política de portas abertas, podemos facilmente utilizar os migrantes que chegam para melhorar a nossa nação e desenvolvê-la."
 TUR_closed_borders: "Fechar as Fronteiras"
 TUR_closed_borders_desc: "Somos capazes de nos livrar completamente dos migrantes que entram no país apenas fechando as nossas fronteiras, fechando assim os nossos problemas."
 TUR_drug_problem: "O problema das drogas"
 TUR_drug_problem_desc: "Às vezes, as drogas são necessárias para uso médico, mas isso não impede que certos indivíduos abusem do sistema e as utilizem para fins recreativos com resultados perigosos."
 TUR_tighten_punishments: "Postura Mais Dura"
 TUR_tighten_punishments_desc: "Criminalizaremos qualquer pessoa que use drogas para qualquer finalidade que não seja para uso médico, não importa qual seja a desculpa."
 TUR_relax_restrictions: "Suavize nossa postura"
 TUR_relax_restrictions_desc: "Mesmo que nosso povo deseje usar drogas para fins recreativos, por que deveríamos nos preocupar? Talvez devêssemos apenas deixá-los fazer o que quiserem, mesmo que haja alguns riscos."
 TUR_rising_nationalism: "Ascensão do Nacionalismo"
 TUR_rising_nationalism_desc: "Apesar do nacionalismo ser uma coisa boa, muito dele pode ser ruim. O nacionalismo dentro da nação causou problemas e brigas entre grupos minoritários."
 TUR_utilize_it: "Utilizar o Nacionalismo"
 TUR_utilize_it_desc: "We will utilize nationalism to our advantage, this way the enemy will know that the Turkish people won't sit back idly by in times of war."
 TUR_combat_it: "Combater"
 TUR_combat_it_desc: "Teremos que combater o nacionalismo, pois não podemos arriscar mais instabilidade dentro das fronteiras de nossas nações."
 TUR_turkish_medias: "A mídia"
 TUR_turkish_medias_desc: "Nossa mídia está crescendo bastante e, devido ao uso cada vez maior da tecnologia no país, a mídia pode ter um grande efeito em nossas políticas e na popularidade dos partidos."
 TUR_deal_with_journalists: "Os Jornalistas"
 TUR_deal_with_journalists_desc: "É claro que os jornalistas são a força por trás de todos os meios de comunicação. São eles que emitem as suas opiniões, mas as suas opiniões podem por vezes ser mais prejudiciais do que benéficas."
 TUR_passive_aggressive_approach: "Abordagem Passivo-Agressiva"
 TUR_passive_aggressive_approach_desc: "Olá, Sr. Jornalista.. Não gostei muito do que você disse sobre meu cabelo ontem à noite, você acha que pode mudar um pouco o texto..? Claro, não farei nada para obriguei você, mas meus apoiadores... bem, eles podem ficar bastante turbulentos às vezes."
 TUR_no_restrictions: "Sem restrições"
 TUR_no_restrictions_desc: "Em uma democracia funcional, todos têm o direito de dizer o que quiserem. Os jornalistas não serão diferentes neste assunto."
 TUR_close_kurdish_medias: "Fechar mídia curda"
 TUR_close_kurdish_medias_desc: "By closing Kurdish Medias, we will be able to restrict the strength of the PKK and therefore consolidate our control over what information is spread. Though, they may get a little upset."
 TUR_sponsor_kurdish_medias: "Permitir mídia curda"
 TUR_sponsor_kurdish_medias_desc: "Ao mostrar aos curdos que podemos coexistir pacificamente, eles suavizarão a sua posição e serão menos agressivos para com o nosso governo."
 TUR_combat_cybercrime: "Espaço Cibernético Turco"
 TUR_combat_cybercrime_desc: "Temos que investigar o que acontece no ciberespaço turco, pois alguns indivíduos podem usá-lo para crimes e atividades ilegais."
 TUR_heavy_fines: "Espaço Cibernético Não Supervisionado"
 TUR_heavy_fines_desc: "A Internet tem muitos supervisores e pessoas que moderam o que acontece lá. Então por que deveríamos desperdiçar recursos policiais para isso quando poderíamos claramente usá-los em coisas melhores."
 TUR_heavy_sentences: "Espaço Cibernético Supervisionado"
 TUR_heavy_sentences_desc: "We cannot risk leaving the internet unsupervised, because criminals could possibly use it as a loophole to commit crimes without us knowing!"
 TUR_kurdish_problems: "Problemas Curdos"
 TUR_kurdish_problems_desc: "We are having quite the struggle against the PKK in the East of our country, who are fighting for an independent Kurdistan, away from Turkish control. This cannot happen, as it would completely destroy our territorial integrity."
 TUR_mediation: "Mediação"
 TUR_mediation_desc: "Às vezes, a violência não é a resposta. A mediação será a melhor forma de abordar o PKK e fazê-lo coexistir connosco, de forma pacífica."
 TUR_relax_security_laws: "Relaxar as leis de segurança no Oriente"
 TUR_relax_security_laws_desc: "Precisamos relaxar as leis de segurança nas províncias curdas como forma de mostrar-lhes que não somos hostis. Desta forma, eles também relaxariam a sua agressão contra nós."
 TUR_withdraw_all_troops: "Restringir movimento de tropas"
 TUR_withdraw_all_troops_desc: "Ao restringir o movimento das tropas, mostraremos ao PKK que não vamos mais combatê-los."
 TUR_open_dialogue_pkk: "Estabelecer Diálogo"
 TUR_open_dialogue_pkk_desc: "Ao estabelecer o diálogo, podemos chegar a um acordo que seria tanto do interesse da Turquia como do interesse do PKK."
 TUR_track_two_diplomacy: "Trilha Dois Diplomacia"
 TUR_track_two_diplomacy_desc: "Ao fazer com que figuras populares sejam representantes de nossa causa, talvez possamos influenciar suas opiniões sobre nosso acordo."
 TUR_direct_talks: "Conversas Diretas"
 TUR_direct_talks_desc: "There is no need to play a game of hide and seek when we are trying to negotiate some serious terms. We will hold direct talks with our representatives, and theirs."
 TUR_third_party_mediators: "Mediadores Terceirizados"
 TUR_third_party_mediators_desc: "Devido à desconfiança entre o nosso governo e o PKK, é melhor contratar terceiros para ajudar a mediar o conflito para nós."
 TUR_peshmerga_stance: "Convide o Peshmerga"
 TUR_peshmerga_stance_desc: "Talvez possamos convidar o Peshmerga para estabilizar as relações para quando o PKK se tornar parte da região."
 TUR_pkk_peshmerga_talks: "Prosseguir Conversas"
 TUR_pkk_peshmerga_talks_desc: "By pursuing talks with the Peshmerga, the PKK and the Peshmerga can co-exist peacefully without having much conflict over border disputes."
 TUR_maintain_animosity: "Manter a animosidade"
 TUR_maintain_animosity_desc: "Ao manter a animosidade, somos facilmente capazes de lidar com as disputas fronteiriças, pois temos uma causa justificável para atacar."
 TUR_relax_policing_laws: "Relaxar as leis de policiamento"
 TUR_relax_policing_laws_desc: "Devido aos nossos recentes avanços na diplomacia com o PKK, somos capazes de relaxar as leis de policiamento em todo o país, reduzindo assim os gastos em grande quantidade."
 TUR_federalize_turkish_kurdistan: "Federalização de Diyarbakir"
 TUR_federalize_turkish_kurdistan_desc: "Federalizaremos a província do Curdistão em nosso país, pois seria o melhor para nossos interesses e para o do PKK. Manteremos algum nível de controle sobre eles e a região, mas eles também ganhariam algum nível de autonomia ."
 TUR_the_endless_war: "Uma guerra sem fim"
 TUR_the_endless_war_desc: "The war with the PKK cannot be solved diplomatically as our many disagreements have proven time and time again. We will double our efforts of forcefully fighting the PKK and re-asserting Turkish hegemony."
 TUR_form_eastern_security_corp: "Eastern Security Corps"
 TUR_form_eastern_security_corp_desc: "Novas unidades serão treinadas e armadas com o propósito especial de defender as partes perigosas no Leste da nossa nação."
 TUR_redouble_army_training: "Redobrar treinamento do exército"
 TUR_redouble_army_training_desc: "Nossos exércitos precisam de treinamento, e precisam dele agora mais do que nunca. Como estamos intensificando nossa luta contra o PKK, seria tolice trazer tropas pouco treinadas para o combate."
 TUR_international_campaign: "Assistência Externa?"
 TUR_international_campaign_desc: "Talvez precisemos considerar a ajuda estrangeira para derrubar o PKK. Mas se o fizermos, corremos o risco de abrir as portas para a influência estrangeira em nossa nação."
 TUR_call_on_iranian_help: "Pedir ajuda iraniana"
 TUR_call_on_iranian_help_desc: "The Iranians have fought several wars to curb Kurdish independence, and by now they know every single move and tactic used by the rebels. We could perhaps contact them and see if they are willing to support us in fighting the Kurds."
 TUR_self_sufficiency: "Não confie em ninguém"
 TUR_self_sufficiency_desc: "Não podemos contar com ninguém para nos ajudar a combater os NOSSOS problemas. Teremos que fazer isso nós mesmos e teremos que fazer isso sozinhos. Obter ajuda nem sempre é a resposta."
 TUR_call_on_american_help: "Chame a ajuda americana"
 TUR_call_on_american_help_desc: "The Americans may be willing to lend us some support, but it will most likely not last very long due to their complex political system and divide in whether to intervene or not. But let's hope whatever support they give does make a difference."
 TUR_criminalize_pkk: "Criminalização Internacional do PKK"
 TUR_criminalize_pkk_desc: "O PKK foi criminalizado em nosso país há algum tempo, mas eles encontraram refúgios seguros em outros países onde não são criminalizados, dando-lhes tempo para planejar e coordenar ataques. Precisaremos embarcar em uma missão para criminalizá-los em todos os países, não apenas no nosso."
 TUR_focus_east_anatolia: "Operação em Diyarbakir"
 TUR_focus_east_anatolia_desc: "Diyarbakir, um dos focos de atividade do PKK, está começando a perturbar a vida cotidiana nas províncias vizinhas. Vamos realizar uma operação para expulsar o PKK da província de uma vez por todas."
 TUR_focus_van: "Operação em Van"
 TUR_focus_van_desc: "Van, um dos focos de atividade do PKK, está começando a perturbar a vida cotidiana nas províncias vizinhas. Vamos realizar uma operação para expulsar o PKK da província de uma vez por todas."
 TUR_hightened_security: "Intensificar segurança"
 TUR_hightened_security_desc: "Vamos intensificar a presença de segurança no país para que possamos continuar lutando contra o PKK e atrapalhar seus planos de destruir nossa nação."
 TUR_the_fight_goes_on: "A luta continua"
 TUR_the_fight_goes_on_desc: "The fight goes on, and it will go on, and it has for many decades now. Though we cannot fully get rid of the PKK without capturing all their soldiers, we can subdue them for some time to come."
 TUR_forward_with_social_democracy: "Avançar com a social-democracia"
 TUR_forward_with_social_democracy_desc: "O futuro da Turquia será ditado pela social-democracia e pelos valores ocidentais"
 TUR_approach_the_eu: "Abordar a UE"
 TUR_approach_the_eu_desc: "Um longo processo de ocidentalização aproximou lentamente a Turquia da União Europeia. Devemos continuar a política de integração com a UE e, eventualmente, tornar-nos um membro de pleno direito"
 TUR_kemalist_social_democracy: "Social Democracia Kemalista"
 TUR_kemalist_social_democracy_desc: "The §Y[socialism_L]§! represents the idea of 'Democratic Left', a term coined by Ecevit to link leftist values with national-cultural heritage. In other words, Kemalism mixed with democratic socialism to fit the situation of contemporary Turkey. Our party can attract both leftist and Kemalist voters"
 TUR_repair_relations_with_left: "Reparar relações com a esquerda"
 TUR_repair_relations_with_left_desc: "Os esquerdistas e socialistas na Turquia têm sido demonizados na Turquia há décadas por ousarem apoiar os curdos. As pessoas deveriam ser livres de expressar as suas opiniões, independentemente da sua ideologia. Precisamos de trabalhar no sentido de abrir o campo político a mais partidos"
 TUR_disarmament_program: "Programa de Desarmamento"
 TUR_disarmament_program_desc: "Nossa história turbulenta mostra que demos muito poder aos militares. Precisamos reduzir nossos gastos militares e nos concentrar mais em nossos próprios assuntos"
 TUR_improve_workers_rights: "Melhorar os direitos dos trabalhadores"
 TUR_improve_workers_rights_desc: "As leis trabalhistas da Turquia precisam ser reformuladas. Precisamos dar aos funcionários públicos o direito de negociar coletivamente seu ambiente de trabalho. Além disso, qualquer funcionário público que sinta que foi tratado injustamente em relação aos seus colegas, será capaz de ir a tribunal contra o Estado"
 TUR_protect_the_unions: "Proteja os Sindicatos"
 TUR_protect_the_unions_desc: "We need to remove the current restrictions on politically motivated strikes and the liability of labour unions in relations to any damages caused by workers being on a strike. We also need to give the ESK (Economic and Social Council), the board of representatives of unions, associations and confederations, constitutional protection"
 TUR_appease_conglomerate: "Apaziguando os Conglomerados"
 TUR_appease_conglomerate_desc: "The industrial conglomerates are the backbone of this nation, and if we can gain their trust, then we will easily be able to gain the workers' trust"
 TUR_banking_reform: "Reforma Bancária"
 TUR_banking_reform_desc: "O setor bancário da Turquia necessita urgentemente de reformas. A corrupção é galopante e os bancos são uma das principais razões da última recessão"
 TUR_invest_in_iett: "Investir no IETT"
 TUR_invest_in_iett_desc: "Istanbul Elektrik Tramvay ve Tünel é uma empresa de transporte que opera na área de Istambul. Alguns dos membros do nosso partido têm ligação com a empresa e devemos trabalhar em conjunto com eles para melhorar a rede de transportes de Istambul"
 TUR_legacy_of_ecevits: "Legado de Ecevits"
 TUR_legacy_of_ecevits_desc: "Bülent Ecevit e sua esposa Rahsan foram fundamentais na criação de um movimento social-democrata na Turquia. Seu legado deve ser honrado"
 TUR_increase_central_bank_autonomy: "Aumentar a autonomia do Banco Central"
 TUR_increase_central_bank_autonomy_desc: "By increasing the autonomy of the central bank, we are able to let the economy flow without the interference of politicians"
 TUR_harsh_stance_pkk: "Posição dura no PKK"
 TUR_harsh_stance_pkk_desc: "O PKK não faz nada além de causar problemas, teremos que assumir uma postura mais dura sobre o assunto"
 TUR_abolition_of_death_penalty: "Abolir a pena de morte"
 TUR_abolition_of_death_penalty_desc: "A pena de morte está a atrasar a nossa nação, está a impedir-nos de nos tornarmos um país moderno e estável. Somos uma democracia e devemos defender os seus valores e os direitos humanos"
 TUR_subsidise_military: "Subsidiar os militares"
 TUR_subsidise_military_desc: "Os militares ajudaram-nos a conquistar Chipre e, para manter a influência grega fora de Chipre, precisamos de confiar que os nossos militares farão a coisa certa"
 TUR_ataturks_heirs: "Herdeiros de Atatürk"
 TUR_ataturks_heirs_desc: "§Y[conservatism_L]§! is the party founded by Atatürk himself. It is our destiny to modernize Turkey and make it a real European country"
 TUR_national_chief: "Legado do Chefe Nacional"
 TUR_national_chief_desc: "Ismet Inönü, the latest §Y[conservatism_L]§! president received the title 'National Chief'. This title fits Deniz Baykal very well too"
 TUR_unban_head_scarves: "Desbanir lenços de cabeça"
 TUR_unban_head_scarves_desc: "Para atrair eleitores mais conservadores, deveríamos desbanir os lenços de cabeça. Afinal, parte dos ideais ocidentais é a liberdade religiosa"
 TUR_maintain_hijab_ban: "Maintain Headscarf Ban"
 TUR_maintain_hijab_ban_desc: "There is absolutely no reason to change our laws pertaining to the Hijab. It does not matter if the conservatives are outraged or upset, what matters is the preservation of the Turkish Republic, and its secular ideals"
 TUR_reform_village_institutes: "Recreate Village Institutes"
 TUR_reform_village_institutes_desc: "In the 1940s, the ruling §Y[conservatism_L]§! government founded village institutes, which were intended to improve education in rural areas by picking out good students and educating them as teachers. Many of the skills taught in the institutes were highly practical, and many of them operated farms and workshops. We should bring these institutes back to make sure even the poorest of areas can educate themselves"
 TUR_expand_shipping_industry: "Apoie a Indústria Pesqueira"
 TUR_expand_shipping_industry_desc: "Apoiar a indústria pesqueira ajudará a população rural e seus pequenos negócios, o que ajudaria a nação no longo prazo"
 TUR_deradicalisation_program: "Programa de desradicalização"
 TUR_deradicalisation_program_desc: "Deniz Baykal é um ferrenho oponente do terrorismo. Embora toleremos os membros mais conservadores da população, os elementos extremistas devem ser eliminados"
 TUR_increase_education_spending: "Melhorar a educação"
 TUR_increase_education_spending_desc: "As an associate professor, Deniz Baykal knows the importance of education. After all, he made it into politics after writing a thesis on the election loss of §Y[conservatism_L]§! in 1965"
 TUR_increase_funds_to_resources: "Subsidiar o Ministério de Energia e Recursos"
 TUR_increase_funds_to_resources_desc: "A nação turca precisa de mais recursos. Devemos subsidiar o Ministério de Energia e Recursos para que eles possam encontrar métodos para diminuir a dependência da Turquia de recursos estrangeiros."
 TUR_chp_move_right: "Mover para a direita"
 TUR_chp_move_right_desc: "For years Deniz Baykal has moved the §Y[conservatism_L]§! more and more right on the political spectrum taking more conservative and Islamist policies. Many of the old supporters have left the party because of this, as many feel it doesn't match the original intentions of the party. We don't need those people. Turkey has changed, and it has no room for leftist politics"
 TUR_chp_move_left: "Mover para a esquerda"
 TUR_chp_move_left_desc: "For years Deniz Baykal has moved the §Y[conservatism_L]§! more and more right on the political spectrum taking more conservative and Islamist policies. Many of the old supporters have left the party because of this, as many feel it doesn't match the original intentions of the party. We need to reverse this course, and return back to our roots"
 TUR_increase_social_security_spending: "Aumentar a Segurança Social"
 TUR_increase_social_security_spending_desc: "A Organização da Segurança Social poderia precisar de algum financiamento extra"
 TUR_invest_in_is_bank: "Investir no İşbank"
 TUR_invest_in_is_bank_desc: "O İşbank é o maior banco comercial da Turquia, com filiais em vários países. O estado deveria comprar algumas de suas ações para obter segurança financeira extra"
 TUR_curtail_corruption: "Restringir a corrupção"
 TUR_curtail_corruption_desc: "A corrupção é uma das maiores fraquezas do Estado turco. Muitos políticos usam o sistema político para seu ganho pessoal e não devemos ter medo de denunciá-los quando vemos comportamento corrupto"
 TUR_remove_article_158: "Remover Artigo 158"
 TUR_remove_article_158_desc: "O artigo 158 torna crime insultar o presidente turco. Este artigo tem sido usado para silenciar críticos e satíricos e torna o presidente praticamente intocável. O artigo deve ser removido, pois tal coisa não se encaixa em uma democracia "
 TUR_deport_refugees: "Deportar Refugiados"
 TUR_deport_refugees_desc: "A large number of refugees are a strain on the citizens and the economy. We need to send these people back to their homes. After all, every person wants to live in their place of birth"
 TUR_religious_tolerance: "Pregar a tolerância religiosa"
 TUR_religious_tolerance_desc: "A Turquia é o lar de muitas minorias religiosas e muitos políticos são originários dessas minorias. Precisamos aumentar a qualidade de vida dessas pessoas"
 TUR_approach_grey_wolves: "Aproxime-se dos Lobos Cinzentos"
 TUR_approach_grey_wolves_desc: "The Grey Wolves are an ultra-nationalistic organization that draws much support from the more right wing-leaning population. If we tighten our ties to them, we will be able to gain some of those supporters"
 TUR_businessmans_turkey: "Turquia do empresário"
 TUR_businessmans_turkey_desc: "A Turquia está há muito tempo restringida por um governo corrupto. É hora de trazer liberdade, tanto econômica quanto social, ao povo turco"
 TUR_abolish_constitutional_court: "Abolish the Constitutional Court"
 TUR_abolish_constitutional_court_desc: "O Tribunal Constitucional é demasiado dependente politicamente e os seus membros podem ser facilmente influenciados pelo parlamento. Em vez disso, fundaremos um Supremo Tribunal onde os membros são sugeridos pelo Presidente, verificados pelo Parlamento e depois servem o Supremo Tribunal para a vida"
 TUR_privatization_drive: "Unidade de Privatização"
 TUR_privatization_drive_desc: "O Estado não tem necessidade de participar na segurança social ou na saúde. Estas deveriam ser melhor tratadas através de fundações e organizações privadas. É claro que as pessoas receberão ligeiras reduções fiscais por qualquer seguro adquirido"
 TUR_security_reform: "Reforma da Segurança"
 TUR_security_reform_desc: "Crime is rife in Turkey, and this needs to be stopped. The Gendarmerie will be reorganised as a rural police, and we will ensure that the salary level of all security personnel will be kept at a substantial level. The police will receive the latest technological innovations to help them in the field"
 TUR_military_reform: "Reforma Militar"
 TUR_military_reform_desc: "Precisamos nos concentrar em ter uma força eficaz, pequena e de alta tecnologia. Não há necessidade de recrutarmos pessoas em massa para um exército. Além disso, a indústria militar deve ser privatizada e o Estado não deve prosseguir com novas aquisições de mais investimentos na indústria militar"
 TUR_stern_commitment_to_nato: "Severo Compromisso com a OTAN"
 TUR_stern_commitment_to_nato_desc: "A OTAN é a única coisa que pode garantir uma ordem mundial liberal. A Turquia deve apoiar severamente a OTAN e qualquer outra aliança semelhante para garantir a paz mundial"
 TUR_reduce_government_oversight: "Reduzir a supervisão governamental"
 TUR_reduce_government_oversight_desc: "The state should stop interfering with the economy completely. The job of the state is only to guarantee a free market. We do not need the massive army of bureaucrats we have now, but instead only the minimum possible should be utilized"
 TUR_tax_reform: "Reforma Tributária"
 TUR_tax_reform_desc: "Os bancos e outras instituições financeiras devem estar isentos de todos os impostos e ser geridos como empresas privadas para promover o crescimento. Além disso, todos os impostos devem ser reduzidos para cerca de 10% para melhorar a vida dos nossos cidadãos"
 TUR_liberalise_trade: "Liberalizar o comércio"
 TUR_liberalise_trade_desc: "As actuais restrições ao comércio devem ser todas abolidas. Ao eliminar todos os encargos aduaneiros, não só melhoramos a situação comercial da Turquia, mas também dos nossos vizinhos. Precisamos também de privatizar todos os portos e portos para os utilizar de forma mais eficiente"
 TUR_agricultural_reform: "Reforma Agrícola"
 TUR_agricultural_reform_desc: "Parte da nossa agricultura ainda está bastante atrasada. Precisamos investir na mecanização e fornecer um incentivo fiscal tanto para os produtores como para os compradores. Precisamos também incorporar tecnologia na agricultura, para que os agricultores tenham dados vivos sobre os preços de bens, permitindo-lhes optimizar a produção e reduzir o desperdício agrícola e a sobreprodução"
 TUR_business_cities: "Cidades Empresariais"
 TUR_business_cities_desc: "Cities are the economic hubs of the country. Cities are expensive, but that is only natural, as the bigger the possibilities, the bigger the cost. With this in mind, if you are too poor to live in a large city, you are to be relocated to an area with cheaper housing. To profit from the value of cities, we must also reform our real estate taxes, as in their current form they are very easy to circumvent"
 TUR_new_supply: "Novas Estações"
 TUR_new_supply_desc: "Como as nossas cidades estão cada vez mais interligadas, precisamos de estabelecer novas estações a partir das quais as pessoas embarcam e desembarcam"
 TUR_destroy_totalitarian_education: "Destruir a educação totalitária"
 TUR_destroy_totalitarian_education_desc: "A educação centralizada nada mais é do que um resquício de tempos autoritários. A educação deveria caber às organizações privadas com a liberdade de escolher livremente o seu currículo. A educação só deveria ser obrigatória durante os primeiros 8 anos, com os custos da educação financiados por empréstimos baratos de bancos, obviamente"
 TUR_return_of_socialism: "Retorno do Socialismo"
 TUR_return_of_socialism_desc: "Os partidos de esquerda linha dura estão mortos na Turquia há décadas, mas finalmente conseguiram se levantar e tomar o poder! Esta é a revolução!"
 TUR_strong_state_for_people: "Estado forte para as pessoas"
 TUR_strong_state_for_people_desc: "O povo merece um estado forte para liderá-lo. Aqueles que depositam sua fé no governo serão recompensados"
 TUR_peoples_power: "Poder Popular"
 TUR_peoples_power_desc: "O governo deve ser para o povo, pelo povo. Precisamos incorporar os camponeses e o povo democraticamente em todos os níveis da administração, desde a comuna até ao estado"
 TUR_destroy_old_regime: "Destruir o Antigo Regime"
 TUR_destroy_old_regime_desc: "Precisamos eliminar quaisquer resquícios do antigo regime corrupto da administração e começar do zero!"
 TUR_mixed_economy: "Economia Mista"
 TUR_mixed_economy_desc: "A cooperação entre o setor privado e o setor público é necessária para uma economia que funcione bem. Precisamos erradicar as más tendências capitalistas, ao mesmo tempo que deixamos espaço para o nosso povo operar de forma independente economicamente"
 TUR_state_owned_economy: "Economia estatal"
 TUR_state_owned_economy_desc: "O capitalismo deve ser erradicado da nossa sociedade. Somente o estado e as comunas locais estão aptos para administrar a indústria"
 TUR_rent_to_production_economy: "Do aluguel à economia de produção"
 TUR_rent_to_production_economy_desc: "While having a private sector is important, we need to encourage and support our population to get ownership of businesses and living accommodations to ensure that true control of the economy stays in the hands of our people"
 TUR_land_reform: "Reforma Agrária"
 TUR_land_reform_desc: "Os proprietários de terras são um flagelo para a humanidade. Ainda existem muitas estruturas atrasadas e até feudais na Turquia que impedem a liberdade dos camponeses. Precisamos de reformar completamente a forma como a terra é propriedade no nosso país"
 TUR_heavy_agricultural_subsidies: "Subsídios agrícolas pesados"
 TUR_heavy_agricultural_subsidies_desc: "Precisamos quebrar as regras da OMC e começar a subsidiar fortemente o nosso setor agrícola, fornecendo combustível barato, empréstimos baratos e fáceis e maquinaria aos nossos agricultores"
 TUR_machinery_tractor_parks: "Parques de tratores de máquinas"
 TUR_machinery_tractor_parks_desc: "Precisamos configurar parques de tratores onde máquinas agrícolas possam ser produzidas, reparadas e vendidas. Tudo isso acontecerá em locais centralizados em todo o país. Isso nos ajudará a modernizar e motorizar significativamente a nossa agricultura"
 TUR_communal_farming: "Agricultura Comunal"
 TUR_communal_farming_desc: "A agricultura comunitária é a melhor maneira de tornar nossas fazendas mais eficientes. Em vez de grandes fazendas administradas por empresas focadas nos lucros, teremos mais agricultura em grande escala para uso local"
 TUR_cut_global_trade: "Cortar o comércio global"
 TUR_cut_global_trade_desc: "Os recursos turcos devem ser reservados somente para a Turquia, e não devem ser roubados por imperialistas globalistas. Precisamos garantir que os recursos vitais para nossa nação permaneçam em nossas mãos."
 TUR_prioritise_backwards_regions: "Priorizar regiões atrasadas"
 TUR_prioritise_backwards_regions_desc: "O investimento económico deve concentrar-se nas áreas mais rurais e escassamente povoadas que há muito são negligenciadas pelo Estado. O campo é a espinha dorsal deste país"
 TUR_urban_humanism: "Humanismo Urbano"
 TUR_urban_humanism_desc: "Nossas cidades precisam ser redesenhadas para que não sejam blocos de concreto frio apenas para as pessoas atuarem como rodas da máquina capitalista. As áreas urbanas precisam ser projetadas de forma mais natural para que o trabalhador prospere"
 TUR_equal_distribution: "Distribuição Igual"
 TUR_equal_distribution_desc: "We can't play favourites in regional politics. This will only cause discord in our nation. We will focus on areas based on state and local needs"
 TUR_greatest_productive_force: "A Maior Força Produtiva é o Homem"
 TUR_greatest_productive_force_desc: "Somente focando nas pessoas poderemos fazer nossa nação avançar. Todos os aspectos da vida, dos negócios, da sociedade e de tudo mais derivam das pessoas"
 TUR_clamp_down_on_kurdish_culture: "Reprimir a identidade curda"
 TUR_clamp_down_on_kurdish_culture_desc: "Os curdos fazem parte da nação turca, quer queiram ou não. Não cederemos a esses terroristas financiados pela CIA"
 TUR_federal_republic: "República Federalizada"
 TUR_federal_republic_desc: "Every people group in Turkey should have the right of self determination, autonomy and even full independence if they so wish. Demonizing our minorities will not make a strong state. We need to agree to give the Alevis some sort of autonomy for everyone's sake"
 TUR_appease_kurds: "Apaziguar os Curdos"
 TUR_appease_kurds_desc: "Temos lutado contra os curdos há décadas e não chegamos a lugar nenhum. É hora de depormos as armas e adotarmos uma abordagem mais pacífica em relação a eles. Afinal, eles só querem viver em paz"
 TUR_the_turkish_nation: "A nação turca"
 TUR_the_turkish_nation_desc: "A Turquia é uma nação turca. Isto não significa apenas turcos étnicos, mas todos os cidadãos da Turquia são turcos e fazem parte da indivisível República da Turquia. Não permitiremos que os nossos inimigos nos dividam semeando a discórdia entre o nosso povo"
 TUR_detach_state_from_religion: "Separar Estado da Religião"
 TUR_detach_state_from_religion_desc: "Turkey was created as a secular nation, but in recent years this core principle of the Republic has been tarnished. We must cut all aspects of religion from the state; no religious education in public schools, no funding of religious organizations by the state and no religious imagery in public buildings. People are free to worship what they want but the state is above such frivolous notions"
 TUR_recognise_minorities: "Reconhecer Minorias"
 TUR_recognise_minorities_desc: "Devemos admitir o facto de que a Turquia é composta por muitas pessoas diferentes. Não faz sentido tentar forçar a ideia de ser turco a todos os cidadãos. Cada pessoa é um cidadão da Turquia, quer seja turco ou não"
 TUR_leverage_diaspora: "Alavancar a Diáspora"
 TUR_leverage_diaspora_desc: "Estamos a ser acusados pelas potências ocidentais de cometer um genocídio contra os arménios. Esta é uma mentira descarada perpetrada pelos imperialistas. Deveríamos utilizar a nossa diáspora para influenciar a política dos países ocidentais e fazê-los mudar a sua atitude em relação a nós"
 TUR_commit_to_gender_equality: "Comprometimento com a Igualdade de Gênero"
 TUR_commit_to_gender_equality_desc: "Equality between men and women in Turkey is abysmal. We need to commit to reducing violence against women and providing women with more opportunities when it comes to work, and increasing their participation in education and politics."
 TUR_revolutionary_education: "Educação Revolucionária"
 TUR_revolutionary_education_desc: "Devemos nos concentrar em melhorar nossa educação. Não basta aumentar a acessibilidade, também precisamos incorporar o ensino de ideias revolucionárias aos alunos para deixá-los continuar a tocha"
 TUR_free_education: "Educação Gratuita"
 TUR_free_education_desc: "A educação deve ser totalmente gratuita para todos. É uma necessidade básica para o bem-estar da nação"
 TUR_increase_peoples_welfare: "Aumentar o bem-estar das pessoas"
 TUR_increase_peoples_welfare_desc: "Making sure that our people are healthy is of the utmost importance. We also have to make sure that no one in our country has to starve, even if they are unemployed, old or disabled"
 TUR_leave_NATO: "Deixar a OTAN"
 TUR_leave_NATO_desc: "A OTAN é apenas uma ferramenta para os imperialistas controlarem o mundo. Nunca deveríamos fazer parte de tal organização"
 TUR_anti_west_sentiment: "Sentimento Antioeste"
 TUR_anti_west_sentiment_desc: "O Ocidente está constantemente se intrometendo no Oriente Médio. Precisamos nos realinhar com as potências emergentes que um dia irão derrubar os decadentes Estados Unidos"
 TUR_balanced_approach: "Abordagem Equilibrada"
 TUR_balanced_approach_desc: "A diplomacia internacional pode ser traiçoeira. Precisamos agir com cautela, mas nosso objetivo deve ser tornar a Turquia independente de todas as potências estrangeiras intrometidas"
 TUR_deterrent_national_defence: "Defesa Nacional Dissuasora"
 TUR_deterrent_national_defence_desc: "Nosso exército deve ser forte o suficiente para agir como um elemento dissuasor, para que nenhum imperialista ouse interferir conosco"
 TUR_destruction_of_fascists: "Destruição de Fascistas"
 TUR_destruction_of_fascists_desc: "Os militares, a polícia e o MIT nada mais são do que organizações fascistas que precisam ser demolidas e substituídas por uma alternativa fornecida pelo povo"
 TUR_pacifist_initiatives: "Iniciativas Pacifistas"
 TUR_pacifist_initiatives_desc: "Deveríamos confiar numa abordagem pacífica na resolução de conflitos. Deveríamos encerrar todas as iniciativas imperialistas para o bem do povo"
 TUR_invest_in_police: "Investir em Segurança"
 TUR_invest_in_police_desc: "Precisamos ter um aparato de segurança forte para que as pessoas possam se sentir seguras. Nossa polícia precisa de bons equipamentos e bons salários para fazer o seu melhor"
 TUR_national_democratic_revolution: "Revolução Democrática Nacional"
 TUR_national_democratic_revolution_desc: "Devemos continuar a Revolução Democrática Nacional iniciada por Atatürk. Somos as vanguardas da revolução e levaremos a Turquia à era moderna"
 TUR_heavy_military_investment: "Investimento Militar Pesado"
 TUR_heavy_military_investment_desc: "Precisamos proteger a Turquia de potências externas. Precisamos investir pesadamente em nossa indústria pesada para garantir que nosso exército esteja pronto para batalhas futuras"
 TUR_shutdown_christian_missionaries: "Desligar Missionários Cristãos"
 TUR_shutdown_christian_missionaries_desc: "Os missionários cristãos que operam no país nada mais são do que espiões dos imperialistas ocidentais. Precisamos expulsá-los do país e proibi-los de pregar"
 TUR_form_anti_imperialist_vanguard: "Formar Vanguarda Anti-Imperialista"
 TUR_form_anti_imperialist_vanguard_desc: "The West is constantly meddling with the Middle East, especially the United States. We need to form a union of anti-imperialists in the Middle East to stop the great Middle Eastern project of the United States"
 TUR_vanguard_approach_azerbaijan: "Aproximar-se do Azerbaijão"
 TUR_vanguard_approach_azerbaijan_desc: "O Azerbaijão é um aliado de longa data da Turquia. Afinal, partilhamos uma religião, uma herança e objectivos políticos comuns. Deveríamos pedir-lhes que denunciassem o imperialismo ocidental"
 TUR_vanguard_reclaim_azerbaijan_territory: "Recuperar a integridade territorial do Azerbaijão"
 TUR_vanguard_reclaim_azerbaijan_territory_desc: "Armenia occupied parts of Azerbaijan after they gained independence from the Soviet Union under the pretext of protecting ethnic Armenians. This occupation has now lasted for more than a decade. It is time to demand Armenia to withdraw from the region or face the consequences!"
 TUR_vanguard_approach_iran: "Aproximar-se do Irã"
 TUR_vanguard_approach_iran_desc: "O Irã há muito é oprimido e difamado pelos americanos. Eles definitivamente estarão interessados em uma frente comum contra o Grande Satã"
 TUR_vanguard_pressure_northern_cyprus: "Pressão do Norte de Chipre"
 TUR_vanguard_pressure_northern_cyprus_desc: "Northern Cyprus only exists because we support them. We have considerable influence on their government and we should emphasize to them that they only exist because we allow it"
 TUR_vanguard_negotiate_with_syria: "Negociar com a Síria"
 TUR_vanguard_negotiate_with_syria_desc: "Temos uma história muito difícil com a Síria. A certa altura, eles permitiram que o PKK operasse dentro das suas fronteiras e nunca nos perdoaram por termos recebido a região de Hatay pelos franceses. No entanto, talvez haja uma maneira de nós podemos ser amigos"
 TUR_vanguard_annex_northern_cyprus: "Anexo Norte de Chipre"
 TUR_vanguard_annex_northern_cyprus_desc: "O Norte de Chipre está cheio de turcos. Por esta razão, deveríamos aproximar muito mais o Norte de Chipre de nós. Na verdade, toda a ilha deveria fazer parte da Turquia"
 TUR_vanguard_unify_iraq: "Alinhar o Iraque"
 TUR_vanguard_unify_iraq_desc: "Os iraquianos têm estado descontrolados e desenfreados nos últimos dois anos e precisamos resolver isso e alinhá-los conosco"
 TUR_scientific_socialism: "Socialismo Científico"
 TUR_scientific_socialism_desc: "O caminho do socialismo científico da EMEP é o melhor caminho a seguir. Um caminho fortemente anti-capitalista, descentralizado e não intervencionista será o mais próspero para a Turquia"
 TUR_unlimited_workers_rights: "Direitos Ilimitados dos Trabalhadores"
 TUR_unlimited_workers_rights_desc: "The Workers of Turkey have been oppressed for decades! No more! It is time to break our chains and make Turkey a worker's paradise!"
 TUR_adherent_defence: "Defesa Aderente"
 TUR_adherent_defence_desc: "Nosso exército não deve ser usado para reprimir outras pessoas. O trabalho do exército é proteger nosso povo, e apenas isso"
 TUR_shut_down_imperialists: "Fechar os Imperialistas"
 TUR_shut_down_imperialists_desc: "Our current government model is based on capitalistic ideals. All of this is pure nonsense. We need to completely overhaul our monetary system. Other powers say that we 'owe' them money but our debts will be just wiped away with the push of a button"
 TUR_retreat_from_cyprus: "Retirada de Chipre"
 TUR_retreat_from_cyprus_desc: "Turkey has no business being in Cyprus. It is nothing more than a remnant of Turkish imperialism. The inhabitants of the island, both Turks and Greeks alike should decide their fate on their own"
 TUR_devrimci_yol: "Estrada Revolucionária"
 TUR_devrimci_yol_desc: "Devrimci Yol significa Caminho Revolucionário, e é uma forma turca de marxismo-leninismo com ênfase em sindicatos. Muitos membros do §W[comunismo_anarquista_L]§! fizeram parte do movimento nos anos 80. A ideia de Devrimci Yol é superior ao comunismo estrangeiro dos nossos concorrentes, e precisa ser elevado acima dos outros"
 TUR_committees_of_resistance: "Comitês de Resistência"
 TUR_committees_of_resistance_desc: "Precisamos formar Comitês de Resistência para nos defendermos contra as atitudes radicais de direita do país. Esses grupos patrulharão as ruas e caçarão os terroristas conhecidos como Lobos Cinzentos."
 TUR_committees_of_production: "Comitês de Produção"
 TUR_committees_of_production_desc: "Os Comitês de Produção ajudarão a organizar os trabalhadores e as fábricas em unidades efetivas e esses comitês controlarão de forma independente o processo de fabricação"
 TUR_empower_unions: "Capacitar os Sindicatos"
 TUR_empower_unions_desc: "We need to empower the labour unions so we can fully protect the rights of workers. Only by giving a voice to the worker, will our words be truthful"
 TUR_strike_pakistan: "Atacar o Paquistão"
 TUR_strike_pakistan_desc: "O governo paquistanês parece rejeitar qualquer forma de socialismo, e eles se manifestaram ativamente contra o nosso governo. É hora de calá-los de uma vez por todas."
 TUR_strike_arabia: "Libertar a Arábia"
 TUR_strike_arabia_desc: "Os sauditas não parecem se dar muito bem com outras ideologias. Por essa razão, teremos que criá-las."
 TUR_islamist_victory: "Vitória Islâmica"
 TUR_islamist_victory_desc: "People in Turkey have been yearning for a more conservative government, one that truly follows Islam. Now they finally have it"
 TUR_lower_taxes_for_exports: "Impostos mais baixos para exportações"
 TUR_lower_taxes_for_exports_desc: "A Turquia tem uma economia poderosa, mas há muita burocracia para as exportações. Precisamos tornar o comércio internacional muito mais fácil do que é agora"
 TUR_form_new_stock_markets: "Formar novos mercados de ações"
 TUR_form_new_stock_markets_desc: "Atualmente, as únicas bolsas de valores funcionam em Istambul. Isto priva enormemente os direitos das pessoas que vivem em outras partes da Turquia. Precisamos criar mais bolsas locais e vinculá-las à bolsa de Istambul"
 TUR_energy_investments: "Investimentos em Energia"
 TUR_energy_investments_desc: "Precisamos reduzir a dependência da Turquia da importação estrangeira de energia"
 TUR_subsidise_farming: "Subsidiar agricultura"
 TUR_subsidise_farming_desc: "A Turquia tem grandes áreas de terras férteis, mas a nossa produção agrícola está em baixa. Precisamos subsidiar os nossos agricultores para garantir um abastecimento alimentar estável e eficiente"
 TUR_increase_oil_gas_production: "Aumentar a produção de petróleo e gás natural"
 TUR_increase_oil_gas_production_desc: "A Turquia importa muito petróleo e gás natural, embora também tenhamos abastecimento interno. Precisamos investir em nossas instalações de produção de petróleo e gás natural para aumentar a autossuficiência"
 TUR_turkish_highways: "Rodovias Turcas"
 TUR_turkish_highways_desc: "A Turquia é a ponte de ligação entre a Ásia e a Europa. No entanto, a rede rodoviária para atravessar a Turquia está em más condições e deve ser melhorada"
 TUR_uphold_family_values: "Defender os valores familiares"
 TUR_uphold_family_values_desc: "Os valores familiares tradicionais estão sob ataque do Ocidente. Precisamos fundar uma organização que promova os valores tradicionais e garanta que não exista material hostil a esta tradição na mídia"
 TUR_security_through_police_and_welfare: "Segurança através da polícia e do bem-estar"
 TUR_security_through_police_and_welfare_desc: "Para proporcionar segurança aos nossos cidadãos, não basta financiarmos a polícia. Precisamos também de aumentar os gastos sociais para que as pessoas não acabem em situações em que tenham de recorrer ao crime para sobreviver"
 TUR_judicial_reform: "Reforma Judicial"
 TUR_judicial_reform_desc: "Nosso sistema de justiça está desatualizado e fora de sintonia com a sociedade moderna. Precisamos reformar todo o sistema e remover juízes corruptos"
 TUR_remove_electoral_treshold: "Remove Electoral Threshold"
 TUR_remove_electoral_treshold_desc: "Turkey has the highest electoral threshold in the world. A party needs at least 10% of the popular vote to get seats in the parliament. This is undemocratic, and only serves to cement the power of the ruling party. We need to remove the limit altogether"
 TUR_increase_military_funding: "Aumentar o financiamento militar"
 TUR_increase_military_funding_desc: "A nação turca está sitiada e precisamos de um exército forte para nos defender. Precisamos aumentar o financiamento e recrutar novos funcionários"
 TUR_concentrate_domestic_equipment: "Foco em Equipamentos Domésticos"
 TUR_concentrate_domestic_equipment_desc: "Os militares turcos deveriam usar equipamento turco. Atualmente, dependemos muito das entregas de equipamentos dos nossos chamados 'aliados'"
 TUR_military_rnd_projects: "Projetos de P&D"
 TUR_military_rnd_projects_desc: "Além de produzir equipamentos nacionais, precisamos desenvolver sistemas de armas nacionais para substituir os comprados no exterior"
 TUR_remove_military_from_politics: "Remover militares da política"
 TUR_remove_military_from_politics_desc: "Em uma nação democrática, é perverso que os militares detenham tanto poder. Precisamos fazer leis e emendas à constituição para evitar que os militares interfiram constantemente na política"
 TUR_islamic_nato: "OTAN Islâmica"
 TUR_islamic_nato_desc: "Embora a NATO nos proporcione segurança, os membros da NATO demonstraram o seu total desrespeito pelo Médio Oriente. Se não conseguem proporcionar estabilidade e prosperidade, devemos assumir o manto. Formaremos a nossa própria aliança militar, o Tratado do Mediterrâneo Organização, ou MTO"
 TUR_invite_iraq: "Convidar o Iraque"
 TUR_invite_iraq_desc: "Precisamos convidar o Iraque para a nossa aliança, pois eles estão lentamente começando a agir em conjunto, e nós nos beneficiaríamos seriamente da cooperação mútua"
 TUR_invite_syria: "Convidar a Síria"
 TUR_invite_syria_desc: "Ter a Síria logo ao sul da nossa nação significa que estamos muito vulneráveis. Convidar a Síria para a nossa facção seria uma ótima maneira de garantir a nossa segurança e proteção"
 TUR_invite_egypt: "Convidar Egito"
 TUR_invite_egypt_desc: "Egypt is an up and coming power-house, and with a population of its size, our alliance will be able to achieve virtually anything"
 TUR_assistance_to_bulgaria: "Assistência à Bulgária"
 TUR_assistance_to_bulgaria_desc: "Devemos ajudar a Bulgária no desenvolvimento da sua infra-estrutura para que possamos realizar mais investimentos além das suas fronteiras com facilidade"
 TUR_islamic_economic_cooperation: "Cooperação Económica Islâmica"
 TUR_islamic_economic_cooperation_desc: "Muitos países muçulmanos estão nadando em dinheiro e usam esse dinheiro para coisas sem sentido. Devíamos formar uma aliança económica para reunir os nossos recursos num projecto económico comum"
 TUR_condemn_china: "Condenar a China"
 TUR_condemn_china_desc: "O tratamento da China aos seus muçulmanos nativos é abominável e deve ser condenado"
 TUR_improve_relations_with_egypt: "Melhorar as relações com o Egito"
 TUR_improve_relations_with_egypt_desc: "A Turquia tem uma história difícil com o Egito, principalmente devido aos nossos conflitos passados. Estamos todos do mesmo lado aqui e não deveríamos ser tão frios com os egípcios"
 TUR_investments_in_iraq: "Amizade Iraquiana"
 TUR_investments_in_iraq_desc: "Despite Iraq having less than ideal ties with us in the past, it is best that we warm up to each other. We can invest in Iraqi infrastructure and gain their trust"
 TUR_work_together_with_BSEC: "Trabalhar em conjunto com BSEC"
 TUR_work_together_with_BSEC_desc: "A BSEC (Cooperação Económica do Mar Negro) é uma organização que visa trazer prosperidade em torno do Mar Negro. A organização é composta por países ao redor do Mar Negro e alguns países dos Balcãs do Sul. Precisamos trabalhar em conjunto com estes países para maior benefício"
 TUR_fixing_ideals: "Reparando Ideais"
 TUR_fixing_ideals_desc: "Nossos ideais foram destruídos como resultado de décadas de ideologia e governo kemalista. No entanto, não é tarde demais para restaurá-los, consertaremos os erros cometidos e conduziremos a nação de volta ao tradicionalismo e ao islamismo"
 TUR_anti_lgbtq: "Dobrar as leis de casamento"
 TUR_anti_lgbtq_desc: "Precisamos ter certeza de que nossa sociedade não gira em torno dos ideais ocidentais. Vamos dobrar as leis tradicionais do casamento e impor o tradicionalismo acima de tudo"
 TUR_supporting_islamists: "The Ulema's Voice"
 TUR_supporting_islamists_desc: "We will let the Ulema voice their opinions in our country's affairs. Giving them a voice will let our nation steer towards a path of righteousness and purity"
 TUR_natural_medicine: "Medicina Natural"
 TUR_natural_medicine_desc: "Natural medicine is the best type of medicine. We need to ditch the glorified lab-made medicines as they can be using ingredients more harmful than good to one's body."
 TUR_new_era: "Uma Nova Era"
 TUR_new_era_desc: "Uma nova era será trazida para a região. Uma era de paz e estabilidade, livre de opressão e injustiça."
 TUR_ally_palestine: "Aliado Palestina"
 TUR_ally_palestine_desc: "Palestine has been occupied by the Israelis since the late 1940s. It is time we establish proper ties with them, and show our support for them."
 TUR_talks_with_iran: "Conversas com o Irã"
 TUR_talks_with_iran_desc: "O Irão tem apelado à libertação completa da Palestina e à derrubada da ordem israelita. Manteremos conversações com eles e veremos se conseguimos encontrar um terreno comum sobre o assunto, apesar das nossas diferenças religiosas"
 TUR_freeing_palestine: "Libertação da Palestina"
 TUR_freeing_palestine_desc: "É hora de libertarmos os palestinos dos ocupantes israelenses. Os israelenses não trouxeram nada além de sofrimento e injustiça para a Palestina e o Levante, e é hora de fazermos algo a respeito!"
 TUR_shia_dominance: "Dominância Shia"
 TUR_shia_dominance_desc: "É hora dos Alevis, Alawitas e Jafaris da Turquia se unirem e quebrarem a opressão dos sunitas turcos"
 TUR_alevi_political_shift: "Dominância Política Alevi"
 TUR_alevi_political_shift_desc: "A capital política da Turquia precisa ser transferida para as áreas dominadas pelos Alevi na Anatólia Central. Esta é a melhor maneira de proteger a nossa base de poder"
 TUR_repair_relations_with_alawites: "Reparar relações com alauítas"
 TUR_repair_relations_with_alawites_desc: "Os alauitas que vivem em Hatay e a elite política da Síria são frequentemente confundidos com os alevitas. Embora compartilhem algumas semelhanças, as seitas foram iniciadas em épocas diferentes e os alauitas são principalmente árabes. Houve atritos históricos, assim como os alauitas viam os Alevis como 'opressores dos árabes'. Esta hostilidade deveria ser corrigida."
 TUR_invest_in_alevis: "Investir em Alevis"
 TUR_invest_in_alevis_desc: "A maioria dos Alevis na Turquia vive na Anatólia Oriental, que tem visto muito menos prosperidade económica do que as partes ocidentais da Turquia. É hora de os Alevis partilharem a riqueza"
 TUR_invest_in_alawites: "Investir em alauítas"
 TUR_invest_in_alawites_desc: "Assim como os Alevis, os Alauítas foram economicamente privados de direitos pelos governos anteriores. Não cometeremos o mesmo erro"
 TUR_unite_alawites: "Unir os alauítas"
 TUR_unite_alawites_desc: "A Turquia roubou injustamente a região de Hatay da França, dividindo os alauitas em dois estados separados. Precisamos devolver a área à Síria e unir todos os alauitas sob um único governo"
 TUR_utilise_alawite_military_experience: "Utilize a experiência militar alauita"
 TUR_utilise_alawite_military_experience_desc: "Na Síria, uma grande parte do seu comando militar é composta pelos alauitas. Precisamos implementar um método semelhante às nossas próprias forças armadas para ter um quadro de oficiais leais"
 TUR_break_syrian_dependancy_iran: "Atacar as relações Síria-Irã"
 TUR_break_syrian_dependancy_iran_desc: "We need to make Syria less dependent on Iran, and more so on us. For that reason, we will be attacking their ability to exert influence within Syria"
 TUR_arm_iraqi_shias: "Libertar os xiitas iraquianos"
 TUR_arm_iraqi_shias_desc: "Iraqis are living under a system where the Shi'ite population is under-represented. We need to change this, we will liberate them and free them from the system of oppression they currently live under"
 TUR_arm_saudi_rebels: "Dominar o Hezbollah"
 TUR_arm_saudi_rebels_desc: "Hezbollah has been trying to capture all of Lebanon, or at the least, exert its military control over it. We will not let an Iranian proxy do this, as we are going to be taking Lebanon as a protectorate of Turkey"
 TUR_anti_iran_diplomacy: "Restringir a Doutrina Iraniana"
 TUR_anti_iran_diplomacy_desc: "O Exército Sírio tem tido muitos conselheiros entrando e saindo do Irã. Por esse motivo, seus métodos de treinamento e combate são muito semelhantes, e isso nos causará problemas se algum dia entrarmos em guerra com o Irã, como nossas táticas será previsível"
 TUR_turkey_syria_union: "União Turco-Síria"
 TUR_turkey_syria_union_desc: "Uma vez que tanto nós como a Síria somos governados por uma minoria religiosa que as pessoas confundem umas com as outras o tempo todo, talvez devêssemos unir as nossas forças e criar uma união política? Como seitas isoladas, não temos hipótese de resistir à influência sunita na região "
 TUR_ottoman_revival: "Renascimento Otomano"
 TUR_ottoman_revival_desc: "§GThe Ottomans§!, once one of the greatest empires centuries ago, have returned. However today, the political landscape has §Hshifted drastically§!, and a heightened sense of §Hnationalism§! makes reuniting the empire a §Rdaunting task for anyone§!. For this reason, the §Gnew Ottoman state§! has to find ways to prove that it will offer a better life to its §Hformer territories§!. We will have §H3 sections of peoples to appease§!, The Middle East, The Levant, and The Balkans. Each one of these sections will have §Hseveral countries§! within them that we can §Hboost our support in§!, and once we hit §H100% support§! in any of these countries, we will be able to §Hgain cores§! and the trust of its people.\n\nIn the §RMiddle East§! our support is currently:\n\n[IRQ.GetFlag]Iraq: §Y[?osman_iraq|%]§!\n\n[SYR.GetFlag]Syria: §Y[?osman_syria|%]§!\n\n[KUW.GetFlag]Kuwait: §Y[?osman_kuwait|%]§!\n\nIn the §RLevant§! our support is currently:\n\n[JOR.GetFlag]Jordan: §Y[?osman_jor|%]§!\n\n[ISR.GetFlag][PAL.GetFlag]Israel/Palestine: §Y[?osman_isr|%]§!\n\n[LEB.GetFlag]Lebanon: §Y[?osman_leb|%]§!\n\n[HEJ.GetFlag]Hejaz: §Y[?osman_sau|%]§!\n\nIn the §RBalkans§! our support is currently:\n\n[GRE.GetFlag]Greece: §Y[?osman_gre|%]§!\n\n[BUL.GetFlag]Bulgaria: §Y[?osman_bul|%]§!\n\n[FYR.GetFlag]Macedonia: §Y[?osman_fyr|%]§!"
 TUR_pan_turkic_dream: "O sonho pan-turco"
 TUR_pan_turkic_dream_desc: "Our great nation has envisioned a new §CPan Turkic Dream§!. We will utilize the §HOrganization of Turkic States§! as a means to garner support and influence within Turkic States, and slowly sway them to join us as one nation. If we are successful in doing so, we will be able to grow our nation to the point where we can be considered a great power in the world. §HTurkic Countries eligible to join the Turkic Confederation will be more likely to join if they have a higher opinion of us!§!"
 TUR_domestic_politics_category: "Política Interna Turca"
 TUR_economy_category: "Crise Econômica"
 TUR_mafia_category: "A Máfia Turca"
 TUR_mafia_category_desc: "The Turkish Mafia has been active for quite some time, committing crimes such as drug dealings, murders, fraud, you name it. In recent years however, they have begun becoming more and more political, and certain parties have been caught making deals with them, and slowly giving them more legitimacy.\n\n §YMafia Influence§! measures the overall influence §Hthe Mafia§! has in the nation. If their influence is  §H60§! or higher, then they will be capable of carrying out political Assassinations, either towards the leadership of our internal factions, or the military. §Hthe Mafia§! will also cause us to lose money, and lots of it too, as the higher influence allows more people to be able to commit fraud and tax related crimes. Additionally, §HMafia Influence§! will §Rincrease every two weeks by 1§! if their influence reaches §H60§!. This can happen if we neglect certain events, or if we make poor choices when it comes to dealing with §Hthe Mafia§!. We can combat §HMafia Influence§! by raiding their safe houses, increasing our police spending, or even maintaining party popularity so that our people aren't affected by their campaigns. Additionally, if we get §HMafia Influence§! Below §H30§!, we will be able to make arrests of wanted §HMafia§! criminals, eventually allowing us to completely eradicate §Hthe Mafia§!.\n\n§HMafia Influence§!: §R[?TUR.TUR_mafia_influence]§!"
 TUR_conduct_anti_mafia_raid: "Conduzir operações antimáfia"
 TUR_conduct_anti_mafia_raid_desc: "Ao conduzir operações que nos ajudem a eliminar a Máfia, seremos capazes de reduzir rapidamente a sua influência, embora com um custo excepcionalmente elevado."
 TUR_arrest_mafia_west: "Arrest Mafia members in Western Turkey"
 TUR_arrest_mafia_central: "Prenda membros da máfia na Turquia Central"
 TUR_arrest_mafia_south: "Prenda membros da máfia no sul da Turquia"
 TUR_arrest_mafia_east: "Prenda membros da máfia no leste da Turquia"
 TUR_victory_over_mafia: "§PEradicar a Máfia§!"
 TUR_mafia_influence_mechanic: "Missões Globais"
 TUR_mafia_influence_mechanic_desc: "§PThe Turkish Mafia§! has proven itself to be more than just a domestic group of gang members, it is much more than that. §HThe Turkish Mafia has ties and influence all over the world§!, but more so in certain places than others. Through the use of the Turkish diaspora, the Turkish Mafia is able to §Hgain support§! and §Hinfluence§! over other nations, and use them to prop up new §PMafia-Proxies§!. Doing this will let the §HTurkish Mafia§! pull strings in governments globally, and even in some cases, §Roverthrow them§!.\n\nAs indicated by the visuals below, the §Hhigher the Mafia influence§! in certain countries, the more control they have. If Mafia influence is §Rlow§!, then the Mafia is §Runable§! to do anything drastic. But if the §HMafia influence is high§!, there are §Ga lot§! more options.\n\n§HInfluence in the UK§!: §G[?mafia_uk|%]§!\n§HInfluence in Germany§!: §G[?mafia_germany|%]§!\n§HInfluence in the Netherlands§!: §G[?mafia_holland|%]§!\n§HInfluence in Australia§!: §G[?mafia_australia|%]§!\n§HInfluence in Belgium§!: §G[?mafia_belgium|%]§!\n\nNo color - Low Influence\n§YYellow§! - Some influence\n§RRed§! - A lot of influence\n"
 TUR_start_eng_operations: "Iniciar operações no Reino Unido"
 TUR_close_eng_operations: "Encerrar operações no Reino Unido"
 TUR_boost_british_firms: "Impulsionar as empresas britânicas"
 TUR_fund_ira: "Financiar separatistas"
 TUR_sow_division: "Sow division within politics"
 TUR_shatter_the_kingdom: "§PDesintegrar o Reino§!"
 TUR_start_ger_operations: "Iniciar operações na Alemanha"
 TUR_close_ger_operations: "Encerrar operações na Alemanha"
 TUR_gray_wolves_networks: "Expandir redes de Lobos Cinzentos"
 TUR_commit_vehicle_rob: "Smuggle out German vehicles"
 TUR_attack_german_politics: "Encontre estadistas corruptos"
 TUR_take_german_industries: "§PAssuma o controle dos principais setores industriais§!"
 TUR_take_german_industries_desc: "Due to the high amount of corruption in German politics, we are able to easily seize important industrial sectors for our own needs."
 TUR_start_hol_operations: "Iniciar operações na Holanda"
 TUR_close_hol_operations: "Encerrar operações na Holanda"
 TUR_establish_drug_networks_rotterdam: "Expandir redes de medicamentos"
 TUR_decrease_policing_holland: "Ataque ao financiamento da polícia"
 TUR_largest_drug_network: "§PEstabelecer o grande centro de drogas§!"
 TUR_start_aus_operations: "Iniciar operações na Austrália"
 TUR_close_aus_operations: "Encerrar operações na Austrália"
 TUR_boost_honoured_society: "Agite a honrada sociedade"
 TUR_target_aussie_welfare: "Atacar o padrão de vida australiano"
 TUR_spread_hatred_indonesia: "Start rumours between Indonesia and Australia"
 TUR_watch_the_conflict: "§PSroubar tesouro australiano§!"
 TUR_watch_the_conflict_desc: "Using our connections and influence, we will steal Australian precious metals and use them for our own good."
 TUR_start_bel_operations: "Iniciar operações na Bélgica"
 TUR_close_bel_operations: "Encerrar operações na Bélgica"
 TUR_fund_bel_mafia: "Conquistar os criminosos belgas"
 TUR_steal_crucial_info: "Roube dados científicos"
 TUR_strings_in_belgian_govt: "Puxar os cordelinhos no governo belga"
 TUR_our_puppets: "§PFvoa importantes pesquisadores belgas§!"
 TUR_our_puppets_desc: "Ao transportar importantes pesquisadores belgas, podemos usá-los na Turquia para nosso próprio bem."
 TUR_hire_gulenist_economic_advisors: "Contratar Consultores Econômicos Gülenistas"
 TUR_hire_gulenist_economic_advisors_desc: "Com base num grande grupo de profissionais internacionais, podemos contratar economistas especializados para aconselhar o nosso governo sobre como gerir a economia"
 TUR_employ_gulenist_informants: "Empregar Informantes Gülenistas"
 TUR_employ_gulenist_informants_desc: "Gülenistas estão espalhados por todo o mundo. Ao contratar informantes, será mais fácil coletar informações"
 TUR_hire_gulenist_educators: "Contratar Educadores Gülenistas"
 TUR_hire_gulenist_educators_desc: "Podemos aumentar muito a eficácia da nossa educação contratando muitos dos famosos estudiosos Gülenistas que existem no mundo"
 TUR_recall_gulenists: "Revogar Gülenistas"
 TUR_recall_gulenists_desc: "Deveríamos convidar Gülenistas para a Turquia para servir o nosso país"
 TUR_call_out_ozkan: "Chame o vice-primeiro-ministro Özkan"
 TUR_call_out_ozkan_desc: "Precisamos alertar a cobra Özkan sobre suas tentativas de remover [ROOT.GetLeader] do poder. No entanto, existe o risco de que ele tente formar um novo partido político se for forçado a renunciar"
 TUR_ban_fazilet_partisi: "Banir §W[Conservative_L]§!"
 TUR_ban_fazilet_partisi_desc: "The §W[Conservative_L]§! is an islamist political party, and in a secular Turkish state there is no room for such parties. Many of its members have already participated in now banned islamist parties before. Banning §W[Conservative_L]§! won't have a lasting effect, as its members will just form a new political party, but it might cause some factionalism and weakening of our opponents overall"
 TUR_big_crash_coming: "Recuperar-se de um grande acidente"
 TUR_big_crash_coming_desc: "Our economy has got much worse since 2013, and this will drag us into a depression."
 TUR_sell_reserves: "Vender Reservas"
 TUR_sell_reserves_desc: "Vender reservas pode atrasar a grande crise."
 TUR_imf_program: "Voltar ao programa do FMI"
 TUR_imf_program_desc: "The IMF Program was the economic plan of Turkey between 2001 and 2008, when the economy grew rapidly. Erdogan said \"Who gets loans today money takes orders tomorrow.\" and stated that the IMF is dangerous. Then the IMF Program was cancelled and Turkey paid all the debt taken from IMF."
 TUR_law_reform: "Reformar a lei"
 TUR_law_reform_desc: "Reforming the law and making the courts independent is an important step to fix the economy, but there may be corruption scandals about AKP."
 TUR_reestablish_village_institutes: "Reestabelecer Institutos de Aldeia"
 TUR_reestablish_village_institutes_desc: "Institutos de Aldeia são centros de educação locais administrados por moradores locais para ensinar diversas habilidades em áreas rurais"
 TUR_incentivise_modern_farming: "Incentivar a agricultura moderna"
 TUR_incentivise_modern_farming_desc: "Precisamos conceder isenções fiscais aos agricultores e compradores de produtos agrícolas. Também precisamos incorporar a tecnologia mais estreitamente no processo agrícola"
 TUR_heavily_subsidise_agriculture: "Subsidiar fortemente a agricultura"
 TUR_heavily_subsidise_agriculture_desc: "Para termos um setor agrícola forte, precisamos de subsidiar fortemente os nossos agricultores"
 TUR_encourage_communal_farming: "Incentivar a agricultura comunitária"
 TUR_encourage_communal_farming_desc: "Precisamos encorajar a agricultura comunitária para afastar grandes fazendas administradas por empresas"
 TUR_implement_revolutionary_education: "Implementar Educação Revolucionária"
 TUR_implement_revolutionary_education_desc: "O ensino revolucionário precisa ser incorporado ao sistema educacional para garantir que as pessoas mantenham a cabeça no lugar"
 TUR_migrants: "Revisar as Leis Migratórias"
 TUR_migrants_desc: "Precisamos rever as nossas leis de migração, pois tivemos inundações de pessoas devido à turbulência nos países vizinhos."
 TUR_mit_decision: "Reformar o MIT"
 TUR_mit_decision_desc: "O MIT, nosso serviço de segurança nacional, precisa ser reformado para melhor se adequar à nossa nova agenda."
 TUR_disaster_decision: "Estabelecer um Plano de Ajuda em Desastres"
 TUR_disaster_decision_desc: "Terremotos e desastres naturais estão surgindo por toda parte, realmente precisamos descobrir uma maneira de lidar com eles o mais rápido possível."
 TUR_nationalist_rise: "Ascensão do Nacionalismo Turco"
 TUR_nationalist_rise_desc: "Although nationalism is not always a bad thing, too much of it is. And that is the case in our country, as currently it is leading to ethnic conflicts within our own borders."
 TUR_drug_problems_decision: "O problema das drogas"
 TUR_drug_problems_decision_desc: "There are a lot of drugs coming in and out of Turkey. This causes problems for us, and our neighbors, and our people."
 TUR_redesign_bosphorus: "Redesenhar o Bósforo"
 TUR_redesign_bosphorus_desc: "The banks of the Bosphorus are full of modern tall buildings, with a lot of the historical architecture having been completely erased. We need to limit the development of the area and return the area back to its old beautiful style. The banks will be an area where all citizens of Istanbul can spend their time"
 TUR_establish_shia_dominance: "Estabelecer o domínio xiita"
 TUR_establish_shia_dominance_desc: "Uma das maiores minorias religiosas na Turquia são os Alevis (não confundir com os árabes alauitas), que representam entre 10% a 20% da população. Os Alevis foram alvo de vários pogroms e o governo turco Não estamos dispostos a designá-los como um grupo religioso separado dos sunitas dominantes. Embora tecnicamente não sejam xiitas oficiais, os alevitas foram designados como tal pelo anterior aiatolá do Irã, Ruhollah Khomeini. Muitos alevitas também se consideram xiitas. Precisamos quebrar o domínio sunita na Turquia"
 TUR_greek_issues: "Amigo ou Inimigo?"
 TUR_greek_issues_desc: "The Greeks, once our historic province, were forced to be in an alliance with us due to NATO. However, despite the alliance, our relations did not get any better because of the countless disputes we have"
 TUR_cypriot_troubles: "Problemas Cipriotas"
 TUR_cypriot_troubles_desc: "Cyprus has been an island of endless conflict ever since we moved our troops into the North. The Greeks have never shut up about it, and they are seemingly trying to destroy our gains in the island nation. We will have to deal with this accordingly"
 TUR_direct_involvement: "Envolvimento direto"
 TUR_direct_involvement_desc: "Desde que abandonámos a NATO, já não somos impedidos pelas muitas restrições impostas às nossas capacidades de exercer a influência turca. Isto significa que podemos envolver-nos diretamente em Chipre, sem necessidade de limitar as nossas capacidades"
 TUR_demand_british_withdrawal: "Exigir a retirada britânica"
 TUR_demand_british_withdrawal_desc: "The British have historically stuck their noses into everything, but in recent years their empire has been crumbling. Cyprus, has been an exception however. The British still maintain a presence in Akrotiri, and it is going to cause us problems when we inevitably expand south-ward"
 TUR_bring_the_north_to_fold: "Unificação com a Turquia"
 TUR_bring_the_north_to_fold_desc: "Os cipriotas do norte são turcos e não faz sentido que haja outro estado turco. Exigiremos que o governo deles se junte ao nosso e unifique os povos turcos."
 TUR_history_repeated: "Terminar o que começamos"
 TUR_history_repeated_desc: "We need to finish off what we started. After the disastrous decision not to continue down south, Cyprus has been divided into two. We will have to mobilize our army and conduct a second invasion into the rest of Cyprus whether the Greeks like it or not!"
 TUR_indirect_involvement: "Envolvimento indireto"
 TUR_indirect_involvement_desc: "Como república, não podemos sair por aí a iniciar conflitos sempre que queremos, temos de ter mais moderação. Portanto, quando se trata de Chipre, adoptaremos uma abordagem mais indirecta e apoiaremos o governo legítimo do Norte Chipre"
 TUR_provide_military_training: "Fornecer treinamento militar"
 TUR_provide_military_training_desc: "We will send some experts from the Turkish Armed Forces to train Militias in North Cyprus in preparation of their inevitable clash"
 TUR_fund_militias: "Financiar milícias cipriotas"
 TUR_fund_militias_desc: "Now that we have provided the Militias with some training, we can safely give them some weapons and extra funding as we know they will be competent enough in taking back South Cyprus"
 TUR_great_uprising: "Que comecem os jogos!"
 TUR_great_uprising_desc: "Agora podemos sentar e assistir os cipriotas do norte travarem a nossa guerra por nós, pois conseguimos treinar, financiar e armar as suas milícias contra os cipriotas do sul"
 TUR_path_of_compromise: "O caminho do compromisso"
 TUR_path_of_compromise_desc: "É melhor não iniciar outro conflito sem fim com o nosso próximo, mas sim é mais inteligente reconciliar e fortalecer a nossa amizade"
 TUR_withdraw_support_cyprus: "Retirar o apoio turco"
 TUR_withdraw_support_cyprus_desc: "Não apoiaremos mais o governo do Norte de Chipre e reconheceremos o governo do Sul de Chipre como o único governo e estado cipriota"
 TUR_support_one_cyprus: "Uma história de um Chipre"
 TUR_support_one_cyprus_desc: "We will publically back the concept of one Cyprus, and we will backpedal decades of politics that kept Cyprus divided!"
 TUR_peaceful_unification: "Unificação Pacífica?"
 TUR_peaceful_unification_desc: "Solicitaremos humildemente ao governo do Chipre do Norte que se junte ao governo do Chipre do Sul.. Pacificamente..."
 TUR_acquire_agean: "Solicite o Egeu"
 TUR_acquire_agean_desc: "Now that we have officially shown the Greeks that we are willing to compromise, even if it means abandoning our national interests, we will kindly ask them to transfer the Aegean into Turkish control"
 TUR_aegan_dispute: "Disputa do Egeu"
 TUR_aegan_dispute_desc: "The Aegean islands have been controlled by Greece ever since the end of WW1, and its disastrous consequences for the Turkish nation. Even though we have held historic claims on the islands, the Greek government is hesitant to even give us partial control of the islands, meaning that we will need to figure out a way to do it through force"
 TUR_crete_rebellion: "Despertar o Nacionalismo de Creta"
 TUR_crete_rebellion_desc: "If we can get the Cretan people to feel occupied under Greek control, we can perhaps gain something even if it is not the Aegean"
 TUR_arm_crete_national_army: "Formar o Exército Nacional de Creta"
 TUR_arm_crete_national_army_desc: "Formaremos o Exército Nacional de Creta na esperança de que um dia eles possam se defender de uma futura invasão grega, se esse dia chegar"
 TUR_smuggle_trucks: "Caminhões de contrabando"
 TUR_smuggle_trucks_desc: "O Exército Nacional de Creta não pode funcionar apenas com armas pequenas e artilharia, precisará de alguns caminhões. Forneceremos alguns caminhões para que estejam prontos"
 TUR_let_the_games_begin: "Cretan Independence!"
 TUR_let_the_games_begin_desc: "Hoje é o dia em que Creta finalmente declara a sua independência da Grécia e se torna um protetorado turco!"
 TUR_fortify_coast: "Propaganda contra Atenas"
 TUR_fortify_coast_desc: "We will start publically broadcasting propaganda against the Greeks by bribing Greek television stations. This will start slowly destabilizing the nation, and giving us an edge during conflict"
 TUR_border_pictures: "Explorar Políticos Corruptos"
 TUR_border_pictures_desc: "Os bolsos dos políticos gregos corruptos são profundos e em breve começarão a ser preenchidos com dinheiro turco, pois podemos mexer os cordelinhos no seu sistema eleitoral para influenciar os partidos que queremos"
 TUR_last_second_upgrades: "Sabotar suas indústrias"
 TUR_last_second_upgrades_desc: "Agora que temos alguma influência sobre o estado grego, podemos começar a sabotar as suas indústrias para que possam ficar mais fracas quando os encontrarmos em Atenas!"
 TUR_siege_of_greece: "Em Atenas em menos de 5 minutos"
 TUR_siege_of_greece_desc: "It shouldn't be long before Turkish armor and infantry start rolling into Athens and raising the Crescent flag on their soil!"
 TUR_operation_sledgehammer: "Os testes de Ergenekon"
 TUR_operation_sledgehammer_desc: "The AKP has been eyeing the presidential office for quite some time now... And it won't be too long before they get what they have been so patiently waiting for."
 TUR_purge_army: "Reorganizar o Exército"
 TUR_purge_army_desc: "If we want even the slightest chance of staying in power for longer than 5 days, we are going to have to reorganize the entire army even if it means cutting down spending!"
 TUR_reorganize_army: "Operação Marreta"
 TUR_reorganize_army_desc: "A Operação Sledgehammer começará e, quando terminar, poderemos usá-la como um meio de expurgar qualquer oposição política que enfrentemos"
 TUR_purge_judges: "Reforma do Judiciário"
 TUR_purge_judges_desc: "There are a lot of Gülenist sympathizers within the legal system in our country, and we cannot let this happen as our system will be corrupted and against us"
 TUR_judges_become_criminals: "Juízes em Macacões"
 TUR_judges_become_criminals_desc: "Now that we have reformed all of the judicial system, and fired all potential Gülenist members within the system, we can finally persecute them without facing much resistance. We will also publically broadcast these trials so that people know what the consequences are"
 TUR_party_of_development_and_justice: "Um Partido do Desenvolvimento e da Justiça?"
 TUR_party_of_development_and_justice_desc: "Somos o partido do Desenvolvimento e da Justiça, mas não se sabe se cumpriremos essa promessa. Há um longo caminho pela frente e precisaremos construir esse caminho à medida que o tempo avança"
 TUR_zero_problems_policy: "Política Zero Problemas"
 TUR_zero_problems_policy_desc: "Seguiremos uma política de \"Zero Problemas\" com os nossos vizinhos, colocando a cooperação e a diplomacia em primeiro plano, em vez do confronto"
 TUR_economic_cooperation_iran: "Acordos de corretagem com o Irã"
 TUR_economic_cooperation_iran_desc: "A economia do Irão necessita urgentemente de investimentos como resultado das décadas de sanções que enfrentou. Contactar algumas empresas turcas para se estabelecerem no seu território beneficiará a ambos, pois poderemos obter alguma influência, enquanto eles obtêm o investimento"
 TUR_mediate_nagarno_karabakh: "Mediar a disputa de Karabakh"
 TUR_mediate_nagarno_karabakh_desc: "O Azerbaijão, nossos amigos mais próximos, tem lutado contra os armênios por uma faixa de território entre suas nações. Este conflito não é necessário, e talvez possamos mediar negociações entre ambos para que todos fiquem felizes"
 TUR_promote_turkish_interests_syria: "Explorar o caos na Síria"
 TUR_promote_turkish_interests_syria_desc: "General instability down south in Syria has given us a golden opportunity to exploit them for further influence"
 TUR_legalize_kurdish_language: "Legalize a língua curda"
 TUR_legalize_kurdish_language_desc: "The Kurdish language has been banned in Turkey for many years now, and it is probably best to leave it that way if we want to preserve Turkic dominance in Anatolia. But at what cost? We call ourselves a republic and yet we take away a people's right to speak their language?"
 TUR_open_hostilities_with_greece: "Utilizar Refugiados"
 TUR_open_hostilities_with_greece_desc: "Somos um importante destino de refugiados e por essa razão temos uma grande população de refugiados. Podemos usá-los em nosso favor e enviá-los através da fronteira para a Grécia para causar instabilidade e caos"
 TUR_side_with_azerbaijan_against_armenia: "Apoiar o Azerbaijão"
 TUR_side_with_azerbaijan_against_armenia_desc: "O Azerbaijão é o legítimo proprietário de Karabakh, e a Armênia precisa saber disso. Apoiaremos publicamente os azeris e os encorajaremos a tomar novas medidas, mesmo que haja risco de conflito!"
 TUR_a_new_barrier: "A zona tampão"
 TUR_a_new_barrier_desc: "Os curdos na Síria estão ameaçando a nossa soberania. Teremos que estabelecer uma zona tampão entre nós e a Síria imediatamente!"
 TUR_tighten_kurdish_restrictions: "Apertar as leis curdas"
 TUR_tighten_kurdish_restrictions_desc: "Não importa o que façamos, os curdos continuam a causar problemas. Parece que estamos de mãos atadas e só podemos aumentar as restrições até que parem de nos causar problemas"
 TUR_erdonomics: "Erdonomia"
 TUR_erdonomics_desc: "Erdonomics is the wave of economic reforms brought forth by Recep Tayyip Erdogan and his party. There are several ways this can go, good, bad, or terrible, but it all comes down to how the policy is pursued"
 TUR_cheaper_credit: "O que é uma taxa de juros?"
 TUR_cheaper_credit_desc: "Sério, precisamos mesmo disso?"
 TUR_dont_fix_what_isnt_broken: "Não conserte se não estiver quebrado"
 TUR_dont_fix_what_isnt_broken_desc: "A economia turca está indo muito bem como está e não precisamos mais brincar com ela. Se o fizermos, podemos arriscar um possível colapso econômico"
 TUR_digitalization_of_turkey: "Digitalização da Turquia"
 TUR_digitalization_of_turkey_desc: "Precisamos avançar para o século 21 com novas tecnologias e conhecimentos da nova era, caso contrário ficaremos para trás"
 TUR_lift_tv_restrictions: "Restrições de elevação da TV"
 TUR_lift_tv_restrictions_desc: "Há muita censura imposta à televisão turca. É do nosso interesse retirá-la e permitir as liberdades que foram tomadas há muito tempo"
 TUR_return_to_tradition: "Retorno à Tradição"
 TUR_return_to_tradition_desc: "Precisamos voltar às nossas raízes, que estão profundamente entrelaçadas com o Islã. O conservadorismo será o que salvará a Turquia de se tornar um espelho imperfeito de outras sociedades!"
 TUR_islamic_politics: "Novos Conselheiros"
 TUR_islamic_politics_desc: "Nosso gabinete está cheio de conselheiros inúteis que irão desorientar nossa liderança, é hora de encontrarmos novos, seja para economia ou políticas"
 TUR_imams_in_office: "Demitir o Primeiro Ministro"
 TUR_imams_in_office_desc: "We will need to abolish the position of the prime minister so that our country's democracy can evolve and be reformed"
 TUR_mosque_funding: "Conquistar as Mesquitas"
 TUR_mosque_funding_desc: "Precisamos do apoio das mesquitas para conquistar os elementos conservadores do nosso país, o que acabará por nos ganhar mais apoio da população rural"
 TUR_islamic_society: "Islã em nossa sociedade"
 TUR_islamic_society_desc: "Let us re-evaluate Islam's role in our society. We will need to expand Islamic teachings in our country one way or the other"
 TUR_expand_diyanet_role: "Diretoria de Assuntos Religiosos"
 TUR_expand_diyanet_role_desc: "A Direcção de Assuntos Religiosos será muito útil no futuro, e podemos expandir o seu papel na nossa sociedade para que o nosso poder possa alcançar toda a nação"
 TUR_strings_in_judiciary: "Puxe os cordelinhos"
 TUR_strings_in_judiciary_desc: "Nosso movimento tem muito apoio dentro do sistema judicial... e podemos usar isso a nosso favor e erradicar o AKP lenta mas seguramente"
 TUR_connections_in_army: "Simpatizantes no Exército"
 TUR_connections_in_army_desc: "Graças à nossa vasta base de apoio, somos capazes de usar nossa conexão no exército para conquistá-los e evitar possíveis golpes de estado"
 TUR_suspicious_generals_resign: "Pressione generais suspeitos para renunciarem"
 TUR_suspicious_generals_resign_desc: "Há muitos generais suspeitos atualmente ativos na TSK. Podemos fazer com que alguns deles renunciem, e isso nos permitirá consolidar o controle sobre todos os ramos das forças armadas sem resistência"
 TUR_cracks_in_akp: "Rachaduras na liderança do AKP"
 TUR_cracks_in_akp_desc: "Começaremos a denunciar publicamente a liderança do AKP e a criar instabilidade dentro do seu partido. Isto certamente reduzirá a sua popularidade, mas quase certamente criará a atmosfera para alguns protestos"
 TUR_mobilize_diaspora: "A Diáspora"
 TUR_mobilize_diaspora_desc: "Podemos usar a diáspora em outros países para ganhar legitimidade governamental"
 TUR_service_to_the_community: "Nosso serviço à comunidade"
 TUR_service_to_the_community_desc: "Hizmet literally stands for Service, or service to one's community. We must uphold this ideal and start improving our society for the better"
 TUR_attack_the_left: "Atacar pela Esquerda"
 TUR_attack_the_left_desc: "A Esquerda tentará arruinar a nossa nação com os seus ideais anti-islâmicos. Teremos que atacar a sua legitimidade e fazê-los parecer mal no palco público"
 TUR_attack_the_right: "Atacar pela direita"
 TUR_attack_the_right_desc: "A Direita será o fim desta nação, pois irá isolar a nossa nação do resto do mundo. As suas ações podem até arrastar a Turquia para um conflito sem fim com um dos nossos vizinhos!"
 TUR_ally_fp: "O destino do FP"
 TUR_ally_fp_desc: "The FP party was banned before we rose to power, and they have quite a lot of loose members and groups. We can probably negotiate with some of them."
 TUR_clean_energy_shift: "Mudança para energia limpa"
 TUR_clean_energy_shift_desc: "We need to do the Earth a giant favor, and it can be done by shifting our country towards cleaner energy. By using clean energy, we will be able to provide our nation with the necessary fuel whilst also protecting the environment from pollution."
 TUR_international_community: "A Comunidade Internacional"
 TUR_international_community_desc: "É claro que o nosso foco principal está na Turquia, mas também temos o dever de tornar o mundo inteiro um lugar melhor"
 TUR_condemn_gulf_monarchies: "Condenar a Monarquia Saudita"
 TUR_condemn_gulf_monarchies_desc: "Infelizmente, os sauditas escolheram este caminho de agressão ao designar o nosso grupo como uma organização terrorista. Teremos de lhes mostrar que não podemos tolerar tais agressões."
 TUR_support_kosovo: "Apoie o Kosovo"
 TUR_support_kosovo_desc: "Kosovo está sob ocupação sérvia há algum tempo e, como companheiros muçulmanos, não podemos permitir que lhes causem tantos danos por mais tempo"
 TUR_fatih_university: "Universidade Fatih"
 TUR_fatih_university_desc: "Fatih University has a lot of Gülenist sympathizers within its staff. We will give them some extra funds and spread the teachings of Gülen"
 TUR_strengthen_private_sector: "Strengthen Gülenist Businesses"
 TUR_strengthen_private_sector_desc: "Atualmente, muitas empresas pertencem e são operadas por Gülenistas, o que nos dá uma grande vantagem na nação. Financiá-las e fortalecer as suas posições irá ajudar-nos seriamente no futuro próximo"
 TUR_gulenist_medias: "Financiar Mídia Gulenista"
 TUR_gulenist_medias_desc: "Teremos que encontrar novas formas de divulgar a mensagem de Gülen sem ter que realizar comícios"
 TUR_zaman_media_group: "Zaman Media Group se torna digital"
 TUR_zaman_media_group_desc: "Zaman Media Group is a newspaper company which operates very closely with our government. Giving them a little boost can help them go digital and spread the message of Fethullah Gülen far and wide"
 TUR_gulenist_charity: "Caridade Gülenista"
 TUR_gulenist_charity_desc: "Um dos principais pilares do Islã consiste na doação de esmolas. Nosso movimento não esquecerá isso e se comprometerá a criar novas instituições de caridade que ajudem os pobres e necessitados"
 TUR_kimse_yok_mu: "Não há ninguém?"
 TUR_kimse_yok_mu_desc: "Is anyone there? is the name of one of the newly founded Gülenist charities which is going to help people in need"
 TUR_cultural_centers: "Apaziguar os Conglomerados"
 TUR_cultural_centers_desc: "Os conglomerados industriais têm muita influência dentro do nosso governo e podem facilmente influenciar a nossa política. Apaziguá-los será a nossa melhor opção, pois pode evitar futuras dores de cabeça causadas pelo grupo"
 TUR_right_wing_victory: "Vitória da direita"
 TUR_right_wing_victory_desc: "The MHP has secured a win in the election, and will transform Turkey into a hyper-nationalist state with an aggressive policy towards other countries. Some fear that Turkey will soon become an international bully, as it slowly pushes its neighbors around."
 TUR_crack_down_secularists: "Repressão aos secularistas"
 TUR_crack_down_secularists_desc: "Os secularistas são um grupo de pessoas que não sabem o que é bom para o país. Tudo o que fazem é chorar e gritar por \"Liberdades Pessoais\" e geralmente têm uma visão anti-islâmica. Precisamos destruir a sua capacidade para ganhar força em escala nacional e reverter as mudanças que eles fizeram!"
 TUR_crack_down_foreign_influence: "Repressão à influência estrangeira"
 TUR_crack_down_foreign_influence_desc: "Foreigners are trying to run Turkiye for us! We need to get rid of them immediately and run it ourselves"
 TUR_crack_down_corruption: "Repressão à Corrupção"
 TUR_crack_down_corruption_desc: "Políticos corruptos desaceleram a nossa nação, e se a nossa nação não tiver o desempenho que deveria, ficará para trás. Expurgar os políticos corruptos é a única maneira de avançarmos"
 TUR_crackdown_kurdish_resistance: "Repressão à resistência do PKK"
 TUR_crackdown_kurdish_resistance_desc: "The PKK are causing quite a lot of problems for us. We will quite frankly need to deal with them more aggressively"
 TUR_demand_return_of_suspects: "Exija o retorno dos suspeitos"
 TUR_demand_return_of_suspects_desc: "There are a lot of PKK members in other countries. We will demand these countries deport these individuals immediately so we can hold trials and limit their influence"
 TUR_the_threat_abroad: "A ameaça no exterior"
 TUR_the_threat_abroad_desc: "There is a major threat abroad, and we are in between it. The East and the West of our country holds our nation's enemies, who so desperately try to destroy us"
 TUR_eastern_nuisance: "O incômodo oriental"
 TUR_eastern_nuisance_desc: "The Iranians and Russians have been our historic enemies, for centuries. But in the modern day, they wear fake masks and pretend to be our friends, but this cannot be! We will cut them out and pursue actions that really put them in their place"
 TUR_fight_russian_influence: "Contra a influência russa"
 TUR_fight_russian_influence_desc: "Os russos estão tentando influenciar a nossa política e a política dos nossos vizinhos. A primeira coisa que devemos fazer é contrariar esta influência com a nossa"
 TUR_hamper_the_ayatollahs: "Restringir o crescimento iraniano"
 TUR_hamper_the_ayatollahs_desc: "The Iranians are advancing, and growing quite quickly. We will need to hamper their ability to do so as soon as possible"
 TUR_balkan_pests: "A praga dos Balcãs"
 TUR_balkan_pests_desc: "We have historically owned the Balkans, and when we did, it was quite peaceful. But during the Balkan Wars we lost the Balkans. Today however, we will take them back, and we will take them back with great pride!"
 TUR_thrace_becomes_one: "Trácia se torna uma"
 TUR_thrace_becomes_one_desc: "Thrace is split into two, one side of it is on our territory, and the other is in Greece. Why must this be? We will make sure the people of Thrace are united under one flag, the Crescent and the Star"
 TUR_campaign_against_athens: "Re-Conquista Búlgara"
 TUR_campaign_against_athens_desc: "A Bulgária é um dos muitos Vilayets que se separaram de nós. É nosso dever recuperá-los e uni-los mais uma vez ao povo turco"
 TUR_end_of_elections: "Fim da República"
 TUR_end_of_elections_desc: "Neste dia, a República Turca não existirá mais. Nosso povo foi reprimido e sofreu lavagem cerebral sob o pretexto de um chamado\" Governo Eleito \". Nosso povo foi mal orientado, enganado e manipulado por décadas de o sistema kemalista"
 TUR_pan_turkey: "Sonho Pan-Turco"
 TUR_pan_turkey_desc: "Hoje, os povos de língua turca estão divididos em vários territórios diferentes. Alguns aqui em Turkiye, alguns no Cáucaso e alguns mais na Ásia Central. O sonho turco não será esquecido, e o povo será unido mais uma vez."
 TUR_a_new_empire: "Um lobo muito faminto.."
 TUR_a_new_empire_desc: "The Turkish Wolf has been starving for decades, it can no longer howl. But this will change, the world will tremble as they see the Turkish nation carve the world for itself and its people"
 TUR_ottoman_politics: "[ROOT.TUR_ottomanism_name]"
 TUR_ottoman_politics_desc: "[ROOT.TUR_ottomanism_name_desc]"
 TUR_nine_light_name: "Doutrina das Nove Luzes"
 TUR_nine_light_name_desc: "A doutrina das Nove Luzes é baseada no nacionalismo turco e no Islã. Ela representa os ideais do bem para todos, e nosso partido foi fortemente moldado por ela."
 TUR_ottomanism_name: "Política Otomana"
 TUR_ottomanism_name_desc: "Nossos ancestrais foram capazes de governar sem problemas, e isso só deve significar que temos que seguir seus passos para ter sucesso"
 TUR_a_new_army: "Fundos renovados para o OKK"
 TUR_a_new_army_desc: "Yes, the Janissaries were cool and all, but, perhaps we can try something newer. We will increase our funding for the Ozel Kuvvetler Komutanligi, or our special forces units"
 TUR_return_to_sunni_dominance: "Retorno do domínio sunita"
 TUR_return_to_sunni_dominance_desc: "Afastamo-nos demasiado das nossas raízes islâmicas. Traremos de volta os velhos hábitos, promovendo o sunismo a todos os nossos compatriotas"
 TUR_supporting_conservatives: "Apoie os Estabelecimentos Conservadores"
 TUR_supporting_conservatives_desc: "Embora sejamos um estado de partido único, financiaremos outras organizações conservadoras para que as pessoas que não necessariamente nos apoiam possam apoiar a nossa ideologia e valores"
 TUR_osman_alliance: "Capacitar Osman"
 TUR_osman_alliance_desc: "Nossos sonhos de criar uma nova superpotência turca devem ter alguma legitimidade. Podemos entrar em contato com a casa de Osman para se juntar ao nosso governo e capacitá-los para reviver a glória do nosso império há muito perdido!"
 TUR_turkish_relations: "Relações Turcas"
 TUR_turkish_relations_desc: "We are centered in between Europe and Asia, making diplomacy with us very important. But, we also have a say in who we want to align with. The West, have supported us for decades, but the East is now trying to do the same."
 TUR_eastern_alignment: "Alinhamento Leste"
 TUR_eastern_alignment_desc: "NATO had all of its benefits, but they forced us to change our governance and culture in more ways than the East has. For that reason, to maintain our independence and culture, it is best we seek out formal ties with the East."
 TUR_military_coop_india: "Cooperação Militar com a Índia"
 TUR_military_coop_india_desc: "Podemos nos beneficiar de uma cooperação militar prolongada com a Índia. Ao treinar e realizar exercícios em conjunto com nossos exércitos, podemos aprender novas táticas e estratégias, ao mesmo tempo em que aproximamos nossas duas nações."
 TUR_support_belt_road_china: "Apoie a iniciativa Cinturão e Rota"
 TUR_support_belt_road_china_desc: "The Belt and Road initiative is a massive infrastructure plan led by the Chinese to bring proper infrastructure all around the globe. Why must we oppose such an initiative?"
 TUR_schools_in_pakistan: "Financiar Escolas no Paquistão"
 TUR_schools_in_pakistan_desc: "O Paquistão precisa desesperadamente de uma infraestrutura educacional adequada e podemos tentar fornecer isso construindo novas escolas para as pessoas aprenderem."
 TUR_turkstream_russia_pipeline: "Oleoduto Turkstream-Rússia"
 TUR_turkstream_russia_pipeline_desc: "O gasoduto Turkstream é um gasoduto de gás natural que vai da Rússia até a Turquia. Este gasoduto fornecerá muito gás natural para partes da Europa Ocidental e pode ser crucial para ajudar a economia."
 TUR_afghan_roads: "Estradas no Afeganistão"
 TUR_afghan_roads_desc: "Afghanistan has very few functioning roads due to their civil war which has lasted decades. We are able to construct some for them so that their citizens can get from place to place without problems."
 TUR_mutual_tourism_indonesia: "Turismo com a Indonésia"
 TUR_mutual_tourism_indonesia_desc: "Ao estabelecer programas de turismo com a Indonésia, ambas as nossas economias podem beneficiar dos recém-chegados e dos turistas."
 TUR_provide_aid_yemen: "Aeroportos no Iêmen"
 TUR_provide_aid_yemen_desc: "Yemen needs adequate Airports, and we can provide that to them with the experts from our country."
 TUR_industrial_investments_egypt: "Contratar trabalhadores egípcios"
 TUR_industrial_investments_egypt_desc: "Podemos contratar trabalhadores egípcios em massa para as nossas fábricas. Desta forma, podemos reduzir custos e proporcionar oportunidades de emprego para quem está no Egito."
 TUR_religious_tourism_saudi: "Turismo Religioso com a Arábia Saudita"
 TUR_religious_tourism_saudi_desc: "A Arábia Saudita tem um dos locais mais sagrados do Islã localizado dentro de suas fronteiras. Por essa razão, teremos que fechar alguns acordos com eles para que nosso povo possa viajar para lá com mais segurança e rapidez."
 TUR_investments_in_qatar: "Bases Militares no Catar"
 TUR_investments_in_qatar_desc: "Vamos pedir ao Catar que nos deixe estabelecer bases militares no seu país para que possamos nos aproximar militarmente. Também podemos tentar protegê-los de outras ameaças na região."
 TUR_western_alignment: "Manter alinhamento ocidental"
 TUR_western_alignment_desc: "Depois de muitos anos de amizade com o Ocidente, por que deveríamos sair em busca de outra coisa? É melhor mantermos nosso alinhamento ocidental para que nenhuma mudança drástica seja feita em nossa política externa."
 TUR_counter_terror_with_us: "Esforços de combate ao terrorismo"
 TUR_counter_terror_with_us_desc: "Vamos ajudar os Estados Unidos com operações antiterroristas no Oriente Médio, para que a região possa ser mais segura e estável."
 TUR_archeology_coop_italy: "Cooperação Arqueológica com a Itália"
 TUR_archeology_coop_italy_desc: "We have had historic ties with the Italians, dating back hundreds of years, but we are yet to discover all of the treasures that are buried under our lands. We will call on archeological experts from Italy to come help dig them up!"
 TUR_encourage_migration_germany: "Incentivar migrantes da Alemanha"
 TUR_encourage_migration_germany_desc: "Muita gente nossa foi para a Alemanha, mas os alemães não fizeram o mesmo. Vamos pedir aos alemães que nos enviem alguns migrantes, para que possamos ser um caldeirão de nação ."
 TUR_sports_diplomacy_brazil: "Diplomacia Esportiva com o Brasil"
 TUR_sports_diplomacy_brazil_desc: "Os brasileiros amam o futebol, e nós também, por isso vamos buscar a diplomacia esportiva com os brasileiros e fazer com que eles joguem amistosos em nosso país."
 TUR_join_business_councils_morocco: "Joint Business Councils with Morocco"
 TUR_join_business_councils_morocco_desc: "Establishing joint business councils with Morocco would help both of us greatly, as we are able to get our companies to cooperate with each other, letting them expand."
 TUR_humanitarian_help_australia: "Especialistas humanitários da Austrália"
 TUR_humanitarian_help_australia_desc: "A Austrália passa por todos os tipos de desastres, e recentemente temos passado por muitos deles também. Ao conseguir a ajuda dos australianos, podemos estar um pouco mais preparados caso algo de ruim aconteça."
 TUR_great_east: "O Grande Oriente"
 TUR_great_east_desc: "Our organization, The Great Eastern Islamic Raiders' Front, vows to bring historic changes to the Turkish nation. No longer will we be held back by imperialist ideology, we will persevere!"
 TUR_dismantle_the_republic: "Desmantelar a República"
 TUR_dismantle_the_republic_desc: "Não há necessidade de uma república agora que estamos no comando. A república deve ser desmantelada o mais rápido possível e os militares devem ser expurgados!"
 TUR_ties_with_saud: "Laços com Saud"
 TUR_ties_with_saud_desc: "Poucos países estariam interessados em manter laços com a nossa nação, mas os sauditas são diferentes. Podemos manter laços com eles, pois partilham uma ideologia semelhante à nossa, para que o nosso governo possa manter um nível de legitimidade internacional"
 TUR_islamic_legacy: "Legado Islâmico"
 TUR_islamic_legacy_desc: "O Islã tem uma longa história em nossa nação e não podemos esquecer isso. Iremos utilizá-lo em nosso favor para fins ideológicos"
 TUR_combat_imperialism: "Combater o Imperialismo"
 TUR_combat_imperialism_desc: "As crenças e ideologias imperialistas penetraram na nossa outrora grande nação. Lutar contra estes ideais é a melhor forma de restaurar o nosso país à sua antiga glória"
 TUR_ban_kemalism: "Banir partidos secularistas"
 TUR_ban_kemalism_desc: "O secularismo foi o que arruinou esta nação. Ao forçar a saída do Islã, os secularistas foram capazes de impor suas crenças à nação, mas não serão mais capazes de fazê-lo!"
 TUR_demand_hejaz: "Exija Hejaz"
 TUR_demand_hejaz_desc: "Os sauditas reivindicam muitas cidades importantes no mundo islâmico, e essas cidades estão localizadas principalmente em Hejaz. Exigiremos que eles dêem ao nosso governo o controle sobre o território se quiserem evitar conflitos"
 TUR_sharia_mandate: "Mandato da Sharia"
 TUR_sharia_mandate_desc: "Nossa nação será guiada pelos princípios do islamismo, e pelos princípios do islamismo SOMENTE. A lei Sharia será posta em vigor mais uma vez, permitindo que nossa nação seja pura e justa novamente."
 TUR_one_banner_one_people: "Um banner, um povo"
 TUR_one_banner_one_people_desc: "Nosso povo estará unido sob uma única bandeira, a bandeira do Islã. Não há necessidade de criar divisão racial em nossa nação permitindo vários idiomas"
 TUR_legalize_languages: "Um banner, muitas pessoas"
 TUR_legalize_languages_desc: "Our people are free to speak whatever language they want. We should not cause a racial divide in our land by banning the use of several languages in the state"
 TUR_crack_down_shiism: "Restrições ao Xiismo"
 TUR_crack_down_shiism_desc: "We need to make sure that everyone assimilates into the Sunni sect, even if it means creating restrictions for Shi'ites. We will prohibit Shi'ite practices from public places, and we will fund campaigns that will encourage the Shi'ites to convert"
 TUR_return_of_caliphate: "Retorno do Califado"
 TUR_return_of_caliphate_desc: "O Califado deve retornar, e retornará. Vamos garantir que o Califado seja reunido mais uma vez através da guerra e da conquista, se necessário. A região não será mais problemática"
 TUR_gender_differations: "Segregar os gêneros"
 TUR_gender_differations_desc: "Devemos criar instalações separadas para homens e mulheres. Sejam pontos de ônibus, escolas ou locais de trabalho, homens e mulheres precisam ser segregados para fins religiosos!"
 TUR_enforce_dress_code: "O código de vestimenta"
 TUR_enforce_dress_code_desc: "Aplicaremos um código de vestimenta rigoroso que conduzirá nossa nação por um caminho de pureza e retidão. Se nosso povo estiver se vestindo de forma inadequada, como podemos esperar progredir espiritualmente?"
 TUR_westard: "Expansão para Oeste"
 TUR_westard_desc: "Os otomanos eram fracos e perderam a parte ocidental do califado. Vamos mudar isso, vamos recuperá-lo com orgulho e com grande força"
 TUR_southward: "Expansão para Sul"
 TUR_southward_desc: "As revoltas árabes e a ascensão do nacionalismo árabe tornaram difícil para os otomanos controlá-los. No entanto, com a ascensão do nosso governo e da nossa grande força, garantiremos que isso não aconteça novamente"
 TUR_eastward: "Expansão para Leste"
 TUR_eastward_desc: "O Oriente nos foi tirado, seja pelos russos, seja pelos persas. Mas hoje, o Cáucaso é independente, embora não o seja por muito tempo."
 TUR_african_holdings: "Participações Africanas"
 TUR_african_holdings_desc: "The Europeans and their colonial ambitions resulted in the loss of Ottoman African holdings. Unfortunately they were unable to expand or maintain their holds in Africa for very long as a result of the Europeans, but no one is stopping us now"
 TUR_turkish_intervention: "Intervencionismo Turco"
 TUR_turkish_intervention_desc: "The Turkish nation has intervened in several conflicts world wide, and it has helped project Turkish military power, and influence outwards. By intervening in other nations' internal conflicts, we are able to influence the outcomes of those wars to be more favorable for us"
 TUR_intervene_syrian_civilwar: "A Guerra Civil Síria"
 TUR_intervene_syrian_civilwar_desc: "A Síria explodiu no caos e, devido à sua proximidade com a nossa nação, seria tolice ficar de braços cruzados, observando do lado de fora"
 TUR_back_assad: "Voltar Assad"
 TUR_back_assad_desc: "Assad é o líder legítimo da Síria e todos os outros devem ser considerados ilegítimos!"
 TUR_back_fsa: "Apoie o Exército Sírio Livre"
 TUR_back_fsa_desc: "O Exército Sírio Livre está lutando por uma causa muito justa, a democracia. Devemos apoiá-los de qualquer maneira que pudermos, para que eles sejam vitoriosos e tragam as alegrias da liberdade ao povo sírio!"
 TUR_intervene_afghan_war: "A Guerra Civil Afegã"
 TUR_intervene_afghan_war_desc: "Afghanistan has been in a civil war for quite some time now, and not much has changed. Perhaps we can sway the outcome to be in our favor."
 TUR_a_new_stance: "Uma nova postura"
 TUR_a_new_stance_desc: "O Talibã tem lutado para expulsar a influência estrangeira e a intervenção em sua nação por um longo tempo agora, e não é nosso lugar intervir e pará-los. Em vez disso, devemos apoiar sua causa e reforçar suas forças para que eles possam libertar sua nação da exploração estrangeira."
 TUR_northern_cause: "A Causa do Norte"
 TUR_northern_cause_desc: "The Northern Alliance have been persistent in their efforts of expelling the vile Taliban from Afghanistan. The Taliban will bring nothing but tyranny, injustice, and oppression to Afghanistan, and we must help the Northern alliance defeat the Taliban!"
 TUR_intervene_iraq_war: "Intervenção no Iraque"
 TUR_intervene_iraq_war_desc: "By exploiting the chaos in Iraq, we will be able to achieve certain goals of ours that have been put on hold for the longest time now."
 TUR_peacekeepers: "Missões de Manutenção da Paz"
 TUR_peacekeepers_desc: "It would be best for us not to fan the flames any further, as the situation is already pretty bad in Iraq. Instead, we should opt to help the Iraqi people catch a break from the war by sending peace-keeping soldiers to villages and cities in the north."
 TUR_conduct_operation: "Conduzir uma operação"
 TUR_strike_pkk_bases: "Invadir fortalezas do PKK"
 TUR_arrest_members: "Prisão de membros suspeitos do PKK"
 TUR_attack_on_media: "Propaganda Anti-PKK"
 TUR_allow_pkk_bases: "Legalizar o PKK"
 TUR_appease_PKK: "Apaziguar o PKK"
 TUR_forbid_pkk_bases: "Banir o PKK"
 TurkicConfederation.1.t: "A Turquia nos convida para a Confederação Turca"
 TurkicConfederation.1.d: "The Turkish Government has approached us, asking us to join the newly founded Turkic Confederation. Obviously if we do join, we will be united, but we will lose our position as a sovereign country."
 TurkicConfederation.1.a: "Os povos turcos são um!"
 TurkicConfederation.1.b: "É melhor não aderirmos..."
 TurkicConfederation.2.t: "A Turquia nos convida para a Confederação Turca"
 TurkicConfederation.2.d: "O governo turco abordou-nos, pedindo-nos que aderíssemos à recém-fundada Confederação Turca. Obviamente, se aderirmos, estaremos unidos, mas perderemos a nossa posição como país soberano.."
 TurkicConfederation.2.a: "Os povos turcos são um!"
 TurkicConfederation.2.b: "É melhor não aderirmos..."
 TurkicConfederation.3.t: "A Turquia nos convida para a Confederação Turca"
 TurkicConfederation.3.d: "O governo turco abordou-nos, pedindo-nos que aderíssemos à recém-fundada Confederação Turca. Obviamente, se aderirmos, estaremos unidos, mas perderemos a nossa posição como país soberano.."
 TurkicConfederation.3.a: "Os povos turcos são um!"
 TurkicConfederation.3.b: "É melhor não aderirmos..."
 TurkicConfederation.4.t: "A Turquia nos convida para a Confederação Turca"
 TurkicConfederation.4.d: "O governo turco abordou-nos, pedindo-nos que aderíssemos à recém-fundada Confederação Turca. Obviamente, se aderirmos, estaremos unidos, mas perderemos a nossa posição como país soberano.."
 TurkicConfederation.4.a: "Os povos turcos são um!"
 TurkicConfederation.4.b: "É melhor não aderirmos..."
 TurkicConfederation.11.t: "Azerbaijão junta-se!"
 TurkicConfederation.11.d: "O governo do Azerbaijão aceitou a nossa oferta de aderir à Confederação Turca. Finalmente estaremos unidos aos nossos irmãos no Azerbaijão!"
 TurkicConfederation.11.a: "Ótimas notícias para a Confederação Turca"
 TurkicConfederation.21.t: "Cazaquistão junta-se!"
 TurkicConfederation.21.d: "O governo do Cazaquistão aceitou nossa oferta de ingressar na Confederação Turca. Finalmente estaremos unidos aos nossos irmãos no Cazaquistão!"
 TurkicConfederation.21.a: "Ótimas notícias para a Confederação Turca"
 TurkicConfederation.31.t: "Uzbequistão junta-se!"
 TurkicConfederation.31.d: "O governo do Uzbequistão aceitou a nossa oferta de aderir à Confederação Turca. Finalmente estaremos unidos aos nossos irmãos no Uzbequistão!"
 TurkicConfederation.31.a: "Ótimas notícias para a Confederação Turca"
 TurkicConfederation.41.t: "Turcomenistão se junta!"
 TurkicConfederation.41.d: "O governo turcomano aceitou nossa oferta de ingressar na Confederação Turca. Finalmente estaremos unidos aos nossos irmãos no Turcomenistão!"
 TurkicConfederation.41.a: "Ótimas notícias para a Confederação Turca"
 TurkicConfederation.12.t: "Azerbaijão recusa oferta"
 TurkicConfederation.12.d: "O governo azeri recusou nossa oferta de ingressar na Confederação Turca. Parece que teremos que recorrer a outras nações para uma possível unificação."
 TurkicConfederation.12.a: "Infeliz"
 TurkicConfederation.22.t: "Cazaquistão recusa oferta"
 TurkicConfederation.22.d: "O governo cazaque recusou nossa oferta de ingressar na Confederação Turca. Parece que teremos que recorrer a outras nações para uma possível unificação."
 TurkicConfederation.22.a: "Infeliz"
 TurkicConfederation.32.t: "Uzbequistão recusa oferta"
 TurkicConfederation.32.d: "O governo uzbeque recusou nossa oferta de ingressar na Confederação Turca. Parece que teremos que recorrer a outras nações para uma possível unificação."
 TurkicConfederation.32.a: "Infeliz"
 TurkicConfederation.42.t: "Turquemenistão recusa oferta"
 TurkicConfederation.42.d: "O governo turcomano recusou nossa oferta de adesão à Confederação Turca. Parece que teremos que recorrer a outras nações para uma possível unificação."
 TurkicConfederation.42.a: "Infeliz"
 TUR_flavor_event.1.t: "Colapso Econômico Turco!"
 TUR_flavor_event.1.d: "It appears that our economy has collapsed, and we are unable to do anything to save it this instant. We are going to have to devise an economic plan which lets us slowly repair the economy, and set forth a Turkish Economic boom. We have a long road ahead of us, so we will have to get to work as soon as possible."
 TUR_flavor_event.1.a: "Esperemos que este seja o último dos nossos problemas"
 TUR_flavor_event.2.t: "Grande terremoto em Bingol"
 TUR_flavor_event.2.d: "A major 6.4 magnitude earthquake has rocked the Eastern city of Bingol. 177 people were killed, 84 of which being the result of a collapsing dormitory block in a boarding school. Roughly 8,000 houses were damaged, and about 4 schools have collapsed. This earthquake must act as a reminder for us to step up our disaster relief program."
 TUR_flavor_event.2.a: "Um dia triste para nossa nação"
 TUR_flavor_event.3.t: "Bombardeio em Istambul!"
 TUR_flavor_event.3.d: "At around 9:30 in the morning about five days ago, two trucks loaded with bombs were detonated in Istanbul. One near Neve Shalom Synagogue, and one in Bet Israel Synagogue. About 28 people have lost their lives, while another 300 were injured. Today, we have gotten news that another 31 people were killed during an attack on the British consulate, and another 450 people were injured. In total, 59 people lost their lives, and 750 more were injured as a result of these attacks."
 TUR_flavor_event.3.a: "Terrível"
 TUR_flavor_event.3.b: "Prepare algum nível de ajuda"
 TUR_flavor_event.3.c: "Prepare toda a ajuda disponível"
 TUR_flavor_event.4.t: "Introdução da nova Lira"
 TUR_flavor_event.4.d: "Recently, a major change to the Lira has been brought about. The Grand National Assembly had voted on the removal of six zeros from the Lira. This means that 1 lira of the new currency is the equivalent of 1,000,000 lira of the old version. However some are doubtful of this new change, and they are arguing that it could do more harm than good to the nation."
 TUR_flavor_event.4.a: "Não, esta é uma boa mudança"
 TUR_flavor_event.4.b: "Velho é ouro"
 TUR_flavor_event.5.t: "Assassinato de Hrant Dink"
 TUR_flavor_event.5.d: "Hrant Dink, a Turkish-Armenian journalist, had been assassinated in Istanbul a few days back. He was an activist of minority rights, and a newspaper editor who actively sought out the reconciliation between Armenians, and Turks. The murderer has been identified as a 17 year old male, and he is now under police custody. Hrant's death has sparked outrage amongst the Armenian community within our nation, and today was the funeral where thousands gathered in solidarity."
 TUR_flavor_event.5.a: "Trágico"
 TUR_flavor_event.6.t: "Influxo de Migrantes"
 TUR_flavor_event.6.d: "Lately, we have been receiving more and more migrants from neighboring countries and abroad due to increasing conflicts. This is starting to slowly destabilize our politics, and some people are even pushing for more aggressive policies. We will have to prepare a response to the series of events."
 TUR_flavor_event.6.a: "Quanto mais, melhor?"
 TUR_flavor_event.7.t: "Aumento do uso de drogas"
 TUR_flavor_event.7.d: "O uso de drogas tem crescido lentamente em certas áreas do país, especialmente nas áreas de baixa renda. Isso terá efeitos devastadores, pois nossas políticas e leis estão por toda parte em relação ao assunto."
 TUR_flavor_event.7.a: "Revisar as leis"
 TUR_flavor_event.8.t: "Ataque da Flotilha de Gaza"
 TUR_flavor_event.8.d: "No início do dia, comandos navais israelenses conduziram uma operação contra vários navios civis, matando 9 cidadãos turcos a bordo do Mavi Marmara. As flotilhas transportavam ajuda humanitária e ajuda na tentativa de quebrar o bloqueio israelense ao Faixa de Gaza. Isto, no entanto, não desculpa o assassinato dos nossos cidadãos, e Israel tem sido muito relutante em dar qualquer tipo de compensação ou pedido de desculpas..."
 TUR_flavor_event.8.a: "Exija reparações E um pedido de desculpas!"
 TUR_flavor_event.8.b: "Temos problemas maiores em mãos.."
 TUR_flavor_event.81.t: "Turquia exige reparações pelo ataque à flotilha de Gaza"
 TUR_flavor_event.81.d: "O governo turco está irritado com o embarque de nossos comandos e a proibição de navios romperem o bloqueio da Faixa de Gaza. É claro que a culpa é deles, pois lhes demos vários avisos, mas eles não se importam."
 TUR_flavor_event.81.a: "Pague as reparações, acabe com isso"
 TUR_flavor_event.81.b: "Não estamos pagando nada"
 TUR_flavor_event.811.t: "Israel paga reparações"
 TUR_flavor_event.811.d: "Israel has agreed to pay reparations to the victims' families and our state as a result of the unjustified raid against the Free Gaza Movement."
 TUR_flavor_event.811.a: "Reparações nunca são suficientes.."
 TUR_flavor_event.812.t: "Israel ignora nosso pedido"
 TUR_flavor_event.812.d: "The Israeli government has rebuffed our demands, saying that we have no say in demanding reparations as we were the ones at fault. This is an outrageous statement, but we will not forget this."
 TUR_flavor_event.812.a: "Inacreditável"
 TUR_flavor_event.9.t: "Terremoto abala Van"
 TUR_flavor_event.9.d: "Hoje cedo, um terremoto de cerca de 7,1 magnitude abalou Van. Cerca de 11.000 edifícios foram danificados ou destruídos, deixando mais de 60.000 pessoas desabrigadas e cerca de 600 mortos. Infelizmente, isso não é incomum, pois nossas regiões orientais não são estranhos a desastres naturais como terremotos."
 TUR_flavor_event.9.a: "Uma tragédia"
 TUR_flavor_event.9.b: "Mobilizar ajuda humanitária"
 TUR_flavor_event.10.t: "Protestos Nowruz"
 TUR_flavor_event.10.d: "Kurds across the nation are starting to protest against our government's policies, and they are demanding that we change them to better suit their needs. Obviously they want nothing more but to destroy the Turkish nation, as a lot of these protesters are in favor of the PKK."
 TUR_flavor_event.10.a: "Coloque a polícia de choque em prontidão"
 TUR_flavor_event.10.b: "Deixe-os protestar"
 TUR_flavor_event.11.t: "Embaixada dos EUA atacada!"
 TUR_flavor_event.11.d: "The U.S. Embassy in Ankara has been attacked by a man wearing a vest strapped with explosives. The attack left the suspect, and one Turkish security guard dead, whilst also damaging the building itself by leaving a giant hole on the side of it. The White House has said that it will have to conduct its own investigations as to why it happened, but this should not have happened in the first place."
 TUR_flavor_event.11.a: "No need for an investigation if they're doing one"
 TUR_flavor_event.11.b: "Lançar nossa própria investigação"
 TUR_flavor_event.12.t: "Desastre de mineração em Soma"
 TUR_flavor_event.12.d: "About 2 days ago, a fire was caused by blasting in Soma, at a coal mine. The fire lasted for about 2 days, and rescue missions were mobilized as soon as possible, but were ultimately not very successful due to the thick smoke from the fire. It has been confirmed that about 301 were killed, and luckily, 486 were able to survive. Fingers are being pointed at the inadequate inspections, and officials in charge of inspections."
 TUR_flavor_event.12.a: "Trágico"
 TUR_flavor_event.12.b: "Protocolo de inspeção de revisão"
 TUR_flavor_event.13.t: "Bombardeios em Ancara"
 TUR_flavor_event.13.d: "A short while ago, 2 bombs were detonated near Ankara Central railway station, leaving 109 civilians dead, and another 500 injured. It appears that the bombs were intended to disrupt a \"Labour, Peace, and Democracy\" rally in Ankara, organized by several groups. Several opposition parties have been blaming our government and our inabilities to prevent the attack, but all we can do for now is make changes where we can."
 TUR_flavor_event.13.a: "Infeliz"
 TUR_flavor_event.13.b: "Aumentar a segurança"
 TUR_flavor_event.14.t: "Debate sobre o currículo"
 TUR_flavor_event.14.d: "Conservatives and conservative groups across the nation are demanding that we remove the concept of evolution from our schools' curriculums. This has worried the secularists in our country, with some even saying that this undermines the very foundation of the nation."
 TUR_flavor_event.14.a: "Remova-o, que evidências eles têm, afinal?"
 TUR_flavor_event.14.b: "Ridículo"
 TUR_flavor_event.15.t: "CASA CN 235 bate em Isparta"
 TUR_flavor_event.15.d: "Há algum tempo, um CN-235 da Força Aérea estava em missão de treinamento com dois pilotos e um técnico a bordo. Devido à espessa neblina na área, a tripulação não conseguiu navegar adequadamente no caminho, e caiu tragicamente, matando todos a bordo."
 TUR_flavor_event.15.a: "Verdadeiramente infeliz"
 TUR_flavor_event.15.b: "Faça algumas alterações"
 TUR_flavor_event.16.t: "Cientistas estabelecem uma base na Antártica"
 TUR_flavor_event.16.d: "A group of our nation's scientists have established a base in Antarctica, marking major scientific progress for our nation!"
 TUR_flavor_event.16.a: "Ótimo"
 TUR_flavor_event.17.t: "Direitos Curdos"
 TUR_flavor_event.17.d: "Elementos liberais em nossa nação têm pedido mais reformas no que diz respeito às leis curdas existentes. Eles estão pedindo que as relaxemos, tornando mais fácil para os partidos curdos ganharem popularidade. Mas grupos mais conservadores estão dizendo que deveríamos manter o status quo para a estabilidade."
 TUR_flavor_event.17.a: "As reformas são perigosas"
 TUR_flavor_event.17.b: "Reformas são necessárias"
 TUR_flavor_event.18.t: "Uma mudança nos valores familiares"
 TUR_flavor_event.18.d: "Recentemente, foi aprovada uma nova lei que permite que as mulheres se tornem chefes de família. Embora esta mudança tenha agradado muitos liberais no país, irritou os conservadores. Temos uma chance única de mudar esta lei, seja para melhor ou para pior."
 TUR_flavor_event.18.a: "Devemos manter nossas tradições"
 TUR_flavor_event.18.b: "Mudança é necessária"
 TUR_flavor_event.19.t: "Normalizando as relações com a Armênia"
 TUR_flavor_event.19.d: "After what seemed like forever, the Armenians are opening up to normalize relations between our two countries. Following the Assassination of Hrant Dink, our relations with Armenia took a nosedive, leading to an unnecessary amount of animosity between our two nations. However recently they have begun to move on from the past, and they are open to normalizing relations once more."
 TUR_flavor_event.19.a: "Eles podem estar abertos à normalização das relações, mas eu não"
 TUR_flavor_event.19.b: "Boas notícias"
 TUR_flavor_event.20.t: "Gasoduto Transcaspiano"
 TUR_flavor_event.20.d: "After some convincing from the Americans, Turkmenistan has agreed to allow the construction of a subsea gas pipeline stretching from Turkmenbashi to Adana, Turkey. However, many in the government are sceptical, as they argue that the financial burden will ultimately fall on us, which could possibly put our economy at risk."
 TUR_flavor_event.20.a: "Parece uma grande oportunidade"
 TUR_flavor_event.20.b: "Sim.. Não"
 Turkish_Economy.1.t: "Turquia oferece investimentos"
 Turkish_Economy.1.desc: "Turkey has offered to build a civilian factory in one of our provinces as long as we let a Turkish company operate and maintain it, they will get some foreign influence from this but we will also benefit in the long run."
 Turkish_Economy.1.a: "Sim"
 Turkish_Economy.1.b: "Não."
 Turkish_Economy.2.t: "Turquia oferece investimentos"
 Turkish_Economy.2.desc: "A Turquia ofereceu-se para construir uma fábrica civil numa das nossas províncias, desde que deixemos um turco operá-la e mantê-la, eles obterão alguma influência estrangeira com isso, mas também nos beneficiaremos a longo prazo. "
 Turkish_Economy.2.a: "Sim"
 Turkish_Economy.2.b: "Não, não somos amigos."
 Turkish_Economy.3.t: "Turquia oferece investimentos"
 Turkish_Economy.3.desc: "A Turquia ofereceu-se para construir uma fábrica civil numa das nossas províncias, desde que deixemos um turco operá-la e mantê-la, eles obterão alguma influência estrangeira com isso, mas também nos beneficiaremos a longo prazo. "
 Turkish_Economy.3.a: "Sim"
 Turkish_Economy.3.b: "Não."
 Turkish_Economy.4.t: "Turquia oferece investimentos"
 Turkish_Economy.4.desc: "A Turquia ofereceu-se para construir uma fábrica civil numa das nossas províncias, desde que deixemos um turco operá-la e mantê-la, eles obterão alguma influência estrangeira com isso, mas também nos beneficiaremos no longo prazo. "
 Turkish_Economy.4.a: "Sim"
 Turkish_Economy.4.b: "Não."
 Turkish_Economy.5.t: "Turquia oferece investimentos"
 Turkish_Economy.5.desc: "A Turquia ofereceu-se para construir uma fábrica civil numa das nossas províncias, desde que deixemos um turco operá-la e mantê-la, eles obterão alguma influência estrangeira com isso, mas também nos beneficiaremos no longo prazo. "
 Turkish_Economy.5.a: "Sim"
 Turkish_Economy.5.b: "Não."
 Turkish_Economy.11.t: "O Irã aceita!"
 Turkish_Economy.11.desc: "The Iranians have accepted our offer at investments, and a Turkish company will now operate a civilian factory in Tehran."
 Turkish_Economy.11.a: "Isso ajudará a economia iraniana mais do que qualquer coisa.."
 Turkish_Economy.22.t: "Armênia aceita!"
 Turkish_Economy.22.desc: "Surprisingly, the Armenians have accepted our offer, and plans to construct a civilian factory in one of their provinces are now under way!"
 Turkish_Economy.22.a: "Velhos inimigos, novos amigos."
 Turkish_Economy.33.t: "Geórgia aceita!"
 Turkish_Economy.33.desc: "A Geórgia aceitou nossa oferta de construir uma fábrica civil e também concordou com os termos de que uma empresa turca deve operá-la."
 Turkish_Economy.33.a: "Ótimo."
 Turkish_Economy.44.t: "Bulgária aceita!"
 Turkish_Economy.44.desc: "The Bulgarians have agreed to our terms and are now giving us a plot of land to construct civilian factories in!"
 Turkish_Economy.44.a: "Olhamos para o oeste!"
 Turkish_Economy.55.t: "Grécia aceita!"
 Turkish_Economy.55.desc: "The Greeks have accepted our offers and are now letting us construct a civilian factory in their land! What a surprise!"
 Turkish_Economy.55.a: "Não esperávamos isso, mas ótimo!"
 Turkish_Economy.111.t: "Irã recusa oferta!"
 Turkish_Economy.111.desc: "Parece que Teerã não concordou com nossos termos de investimentos e teremos que procurar outro lugar."
 Turkish_Economy.111.a: "Triste"
 Turkish_Economy.222.t: "Armênia recusa oferta!"
 Turkish_Economy.222.desc: "Sem surpresa, os Arménios rejeitaram a nossa oferta de construção de indústrias civis no seu território."
 Turkish_Economy.222.a: "Old grudges stunt progress."
 Turkish_Economy.333.t: "Geórgia recusa oferta!"
 Turkish_Economy.333.desc: "Sadly, Georgia has rejected our offer at investments, and it appears we will have to re-evaluate Turkish-Georgian relations."
 Turkish_Economy.333.a: "Infeliz"
 Turkish_Economy.444.t: "Bulgária recusa oferta!"
 Turkish_Economy.444.desc: "A Bulgária nem sequer nos respondeu sobre o nosso pedido de investimentos, e teremos de considerar isso um não da parte deles."
 Turkish_Economy.444.a: "Uau"
 Turkish_Economy.555.t: "Grécia recusa oferta!"
 Turkish_Economy.555.desc: "Parece que a Grécia não quer nenhuma empresa turca operando em suas terras, então teremos que recuar por enquanto."
 Turkish_Economy.555.a: "O que há de novo?"
 TUR_pkk.1.t: "Cimeira de Diyarbakir"
 TUR_pkk.1.d: "A Cúpula de Diyarbakir começará já esta semana, mas ainda não decidimos como abordaremos o PKK, partido £TUR_Neutral_Communism . Temos a capacidade de continuar travando uma guerra contra suas tentativas de autonomia e independência, mas alguns também cogitaram a ideia de chegar a um acordo. Até agora, essa ideia tem sido amplamente impopular. As Forças Armadas continuam a demonstrar sua prontidão para combater o PKK e impedir a fragmentação da grande nação turca."
 TUR_pkk.1.a: "A cooperação com nossos vizinhos derrotará os terroristas!"
 TUR_pkk.1.b: "Não precisamos de ajuda, nós mesmos vamos derrotar o PKK!"
 TUR_pkk.1.c: "Talvez tenhamos sido muito duros com os curdos..."
 TUR_pkk.2.t: "Turquia propõe cooperação em segurança contra o PKK"
 TUR_pkk.2.d: "The Turkish government announced at its Diyarbakir summit earlier today that it wishes to pursue cooperation with regional nations, including us. Our delegates at the conference have now relayed the information to [ROOT.capital.GetCapitalVictoryPointName], and wish to know the stance that our government will take in order to combat the PKK and its splinter groups in the region."
 TUR_pkk.2.a: "A cooperação é o caminho a seguir"
 TUR_pkk.3.t: "[FROM.GetName] concorda em cooperar contra o PKK!"
 TUR_pkk.3.d: "Delegates from [FROM.GetName] firmly shook the hands of our delegates at the Diyarbakir conference, exclaiming that [FROM.capital.GetCapitalVictoryPointName] is eagerly anticipating the first steps to be taken against the PKK and its splinter groups."
 TUR_pkk.3.a: "Ótimo！"
 TUR_pkk.4.t: "Delegados de [FROM.GetName] deixam a Cúpula"
 TUR_pkk.4.d: "Delegates from our neighbor, [FROM.GetName], silently left the summit a little while ago. The strange decision is questionable at best, as it raises some concerns within our cabinet about what their intentions really are."
 TUR_pkk.4.a: "Realmente?"
 Turkey.1.t: "Özkan forma um novo partido"
 Turkey.1.desc: "Depois que [ROOT.GetLeader] chamou publicamente o vice-primeiro-ministro, Özkan anunciou que estava renunciando ao seu cargo no parlamento e no partido. Ele também anunciou que formaria um novo partido, o Partido da Nova Turquia. Muitos atuais parlamentares do §W[socialism_L]§! já anunciaram a intenção de se juntar a ele, e muitos também estão tentando se juntar ao §W[conservatism_L]§!."
 Turkey.1.a: "Não precisamos dele"
 Turkey.1.b: "Faça acordos de bastidores com os deputados"
 Turkey.2.t: "Özkan se aposenta da política"
 Turkey.2.desc: "Depois que [ROOT.GetLeader] chamou publicamente o vice-primeiro-ministro, Özkan anunciou que estava renunciando ao seu cargo no parlamento e no partido. Em uma conferência de imprensa realizada posteriormente, ele anunciou que seria se aposentar completamente da política para passar mais tempo com sua família e em projetos pessoais."
 Turkey.2.a: "Nossa aposta valeu a pena"
 Turkey.3.t: "Golpe de Özkan"
 Turkey.3.desc: "The rumours were true! Özkan and other §W[socialism_L]§! members were planning a coup. After a motion of no-confidence at a party meeting towards [ROOT.GetLeader], he was forced to resign. Özkan has taken his place as Prime Minister of Turkey"
 Turkey.3.a: "Maldito homem!"
 Turkey.4.t: "[Nat_Populism_L] pede uma nova eleição"
 Turkey.4.desc: "Devido à situação política de §W[socialism_L]§!, o §W[Nat_Populism_L]§! retirou o seu apoio à nossa coligação governamental no poder e está a convocar novas eleições"
 Turkey.4.a: "Convocar novas eleições"
 Turkey.4.b: "Não precisamos de eleições, podemos sobreviver"
 Turkey.5.t: "Eleições presidenciais turcas de 2000"
 Turkey.5.desc: "A eleição presidencial de 2000 está próxima. Na Turquia, o presidente é escolhido pelo parlamento. Para que um candidato vença, ele deve receber uma maioria de dois terços em um dos dois turnos. Se não houver vencedor, o terceiro turno pode ser vencido por maioria simples. Se ainda não houver um vencedor claro, um quarto turno é realizado, onde um dos dois candidatos mais populares deve obter a maioria. Se ainda não houver uma vitória, uma eleição antecipada deve ser realizada para quebrar o impasse.\n\nNo momento, cada partido parlamentar está concorrendo com seu próprio candidato, e parece muito improvável que qualquer um deles saia vitorioso."
 Turkey.5.a: "O vice-primeiro-ministro Özkan negociará"
 Turkey.5.b: "Só temos que esperar pelo melhor"
 Turkey.6.t: "Ahmet Necdet Sezer eleito presidente"
 Turkey.6.desc: "Ahmet Necdet Sezer foi eleito o 10º Presidente da República Turca. Ex-chefe do Tribunal Constitucional, sua eleição foi apoiada pela maioria dos partidos parlamentares após ser convencido a fazê-lo pelo Vice-Primeiro-Ministro Özkan. Sezer é um firme defensor do secularismo e um proponente da proibição do véu"
 Turkey.6.a: "Bom trabalho Özkan"
 Turkey.7.t: "Candidato [socialism_L] vence a presidência"
 Turkey.7.desc: "Para surpresa de todos, Mehmet Mail Büyükerman, o candidato §W[socialism_L]§! à Presidência, ganhou a votação. Alguns analistas políticos descreveram isso como um milagre. A razão mais provável para a vitória de Büyükerman é que a oposição os partidos não queriam desestabilizar ainda mais o país arriscando novas eleições"
 Turkey.7.a: "Excelente"
 Turkey.8.t: "Presidential Vote Proceeds To Its Fourth Round"
 Turkey.8.desc: "Nenhum candidato conseguiu reunir os dois terços de votos exigidos nos dois primeiros turnos ou a maioria exigida no terceiro turno. A disputa foi agora reduzida a candidatos de §W[socialism_L]§! e §W[Conservative_L]§!. Ainda é muito improvável que qualquer um dos candidatos vença, tornando muito provável uma eleição antecipada. Claro, podemos anunciar nosso apoio ao candidato §W[Conservative_L]§!. É praticamente uma decisão política suicídio, mas pelo menos nos dará algum tempo e nos poupará de uma eleição imediata"
 Turkey.8.a: "Vamos torcer pelo melhor. De novo."
 Turkey.8.b: "Throw our weight behind the §W[Conservative_L]§! candidate"
 Turkey.9.t: "Candidato [Conservative_L] vence a presidência"
 Turkey.9.desc: "Com o apoio do governante §W[socialism_L]§!, o candidato §W[Conservative_L]§! Nevzat Yalçıntaş venceu as eleições presidenciais. Isto certamente aumentará a popularidade de §W[Conservative_L]§! "
 Turkey.9.a: "Excelente"
 Turkey.10.t: "Constituição pede eleições antecipadas"
 Turkey.10.desc: "Parece que nenhum candidato reuniu apoio suficiente para ganhar o cargo de presidente. A constituição turca exige que, em tal estado, sejam realizadas eleições antecipadas para quebrar o impasse.\n\nO novo parlamento irá eleger um novo presidente com sucesso"
 Turkey.10.a: "Droga"
 Turkey.11.t: "Golpe Militar!"
 Turkey.11.desc: "Earlier today Turkish military units rolled down the streets of Istanbul and occupied several government buildings. The military announced the closure of Istanbul's airspace as Turkish fighter jets patrolled the area. We have reports of Turkish soldiers being deployed to other major cities as well. Some clashes have been reported between soldiers loyal to the current regime and the soldiers partaking in the coup. So far most members of government seem to have avoided capture by the military. There is still hope that forces loyal to the government will disarm these insurgents. Or perhaps not"
 Turkey.11.a: "O exército está cheio de traidores! Prendam esses criminosos!"
 Turkey.11.b: "A causa do exército é justa! Os governantes decadentes devem ser derrubados!"
 Turkey.12.t: "Golpe militar na Turquia"
 Turkey.12.d: "Tonight, tanks and mechanized units patrol the streets of Istanbul as soldiers station several government buildings. The military has announced the closure of Istanbul's airspace, as fighter jets roam the sky. No noise is to be heard from the streets besides the rumbling of the mechanized engines, as the people sit silently in their homes. A successful military coup in Turkey has ousted the ruling party following its reckless policies, and the military is now consolidating complete control over the country. The military has warned people not to come out to the streets, and they have declared a state of emergency."
 Turkey.12.a: "Interessante."
 Turkey.14.t: "Golpe militar fracassado na Turquia"
 Turkey.14.d: "[TUR.GetLeader] met a large crowd of supporters this morning, as he announced that a military coup had been defeated, made possible only through the might of the Turkish people. [TUR.GetLeader] later announced that several key officers have been identified as prime suspects in this coup attempt, and that everyone else involved is getting investigated. In his speech, [TUR.GetLeader] also mentioned that there will be an \"inspection of all ranks\", and that \"there must be no traitors left\". Though it is unknown what will happen to the officials involved, one thing is for certain, and that is the role of the military in Turkish politics is no more."
 Turkey.14.a: "Interessante."
 Turkey.15.t: "A Turquia mergulha na guerra civil"
 Turkey.15.d: "Following the latest coup attempt in Turkey, crowds met the tanks rolling down the streets of Istanbul, and tried to halt their march to a government building. The tanks however, did not stop, resulting in several deaths. In other cities within Turkey, citizens have taken up arms and they have begun opening fire at the soldiers stationed in their cities, in an attempt to halt the coup. The military announced that the coup is justified, and that the leader must be overthrown to save the Turkish nation, and some people in the country support them on this. However for now, the scenes in Turkey resemble that of a civil war, rather than just another military coup."
 Turkey.15.a: "Uau"
 Turkey.77.t: "Unificação Cipriota!"
 Turkey.77.d: "The Northern Cypriot government has recently consolidated total control of the entirety of Cyprus, both north and south. This comes as they began growing in influence and strength, eventually being able to call for a referendum which let its people unify. Athens has expressed a lot of anger following the move, and they vow to never recognize Northern Cyprus as a legitimate state."
 Turkey.77.a: "Bem, isso é alguma coisa"
 Turkey.88.t: "Unificação Cipriota"
 Turkey.88.d: "The Greek government has recently consolidated total control of the entirety of Cyprus, both north and south. This comes as they began growing in influence and strength, eventually being able to call for a referendum which let its people unify. Turkey has expressed a lot of anger following the move, and they vow to never recognize Greece as the legitimate owners of Cyprus."
 Turkey.88.a: "Interessante."
 Turkey.100.t: "Eleições Gerais"
 Turkey.100.d: "Chegou a hora do nosso povo votar no próximo partido a subir ao poder, quem seria?"
 Turkey.100.a: "AKP"
 Turkey.100.b: "CHP"
 Turkey.100.c: "O partido atual é um bom presságio"
 TurkeyRandomEvents.1.t: "§W[conservatism_L]§! Abalado pelo escândalo"
 TurkeyRandomEvents.1.desc: "Um vídeo começou a circular na internet onde o líder do §W[conservatism_L]§!, Deniz Baykal, está em um quarto com sua ex-secretária. Como resultado do escândalo, Baykal foi forçado renunciar ao seu cargo"
 TurkeyRandomEvents.1.a: "Bom para nós, eu acho"
 TurkeyRandomEvents.1.b: "Esse é um vídeo falso! Baykal não vai renunciar!"
 TurkeyRandomEvents.1.c: "Não temos escolha"
 TurkeyFocusEvents.1.t: "[FROM.GetName] Oferece Aliança"
 TurkeyFocusEvents.1.desc: "[FROM.GetName] nos ofereceu uma aliança contra o imperialismo ocidental. Ao nos aliarmos a [FROM.GetName], poderemos até ter a chance de recuperar Nagorno-Karabakh"
 TurkeyFocusEvents.1.a: "Somos mais fortes juntos"
 TurkeyFocusEvents.1.b: "Não queremos perturbar o equilíbrio"
 TurkeyFocusEvents.2.t: "[FROM.GetName] exige retirada de Nagorno-Karabakh!"
 TurkeyFocusEvents.2.desc: "[FROM.GetName] está exigindo que retiremos todas as nossas forças de Nagorno-Karabakh e devolvamos o controle da área ao Azerbaijão. Este é um pedido ousado, mas a recente agressão de [FROM.GetName] mostra que eles estão dispostos a usar a força para nos afastar. Não duraremos muito tempo em uma guerra multifrontal."
 TurkeyFocusEvents.2.a: "Temos que ceder"
 TurkeyFocusEvents.2.b: "Lutaremos até o último homem!"
 TurkeyFocusEvents.3.t: "Armênia rende!"
 TurkeyFocusEvents.3.desc: "Armenia has yielded to demands of withdrawing from Nagorno-Karabakh. The area is now once again in control of Azerbaijan"
 TurkeyFocusEvents.3.a: "Ótimo"
 TurkeyFocusEvents.4.t: "Armênia mantém Nagorno-Karabakh"
 TurkeyFocusEvents.4.desc: "Armenia has flatly refused to return Nagorno-Karabakh to Azerbaijan"
 TurkeyFocusEvents.4.a: "Droga"
 TurkeyFocusEvents.4.b: "Então tomamos isso à força"
 TurkeyFocusEvents.5.t: "Revolução no Irã?"
 TurkeyFocusEvents.5.desc: "We can now successfully spread our revolution in Iran, but how we approach it will change how it will occur drastically."
 TurkeyFocusEvents.5.a: "Uma quantidade moderada de armas"
 TurkeyFocusEvents.5.b: "Muitas armas"
 TurkeyFocusEvents.6.t: "Revolução no Iraque?"
 TurkeyFocusEvents.6.desc: "We can now successfully spread our revolution in Iraq, but how we approach it will change how it will occur drastically."
 TurkeyFocusEvents.6.a: "Uma quantidade moderada de armas"
 TurkeyFocusEvents.6.b: "Muitas armas"
 TurkeyFocusEvents.7.t: "Revolução na Síria?"
 TurkeyFocusEvents.7.desc: "We can now successfully spread our revolution in Syria, but how we approach it will change how it will occur drastically."
 TurkeyFocusEvents.7.a: "Uma quantidade moderada de armas"
 TurkeyFocusEvents.7.b: "Muitas armas"
 TurkeyFocusEvents.8.t: "[FROM.GetName] Exige Hatay"
 TurkeyFocusEvents.8.desc: "[FROM.GetName] está exigindo que devolvamos Hatay. Sem o controle do estado, eles estão se recusando a entrar em nossa aliança"
 TurkeyFocusEvents.8.a: "Acho que não temos escolha"
 TurkeyFocusEvents.8.b: "A nação turca é indivisível!"
 TurkeyFocusEvents.9.t: "[FROM.GetName] Retorna Hatay"
 TurkeyFocusEvents.9.desc: "[FROM.GetName] devolveu Hatay para nós"
 TurkeyFocusEvents.9.a: "Um bom dia!"
 TurkeyFocusEvents.10.t: "O problema cipriota"
 TurkeyFocusEvents.10.d: "O governo turco está começando a pressionar o problema cipriota com mais força do que antes e não deixou ao nosso governo outra escolha senão responder. Elaboramos um plano para responder a essas agressões e iremos persegui-las em conformidade !"
 TurkeyFocusEvents.10.a: "Avante!"
 TurkeyFocusEvents.19.t: "A Turquia quer estabelecer uma zona tampão"
 TurkeyFocusEvents.19.d: "The Turkish government wants to establish a buffer zone between our nations' borders. This means we have to completely demilitarize several of our northern provinces, and withdraw all military presence and let the Turks fight off the Kurds."
 TurkeyFocusEvents.19.a: "É o melhor.."
 TurkeyFocusEvents.19.b: "De jeito nenhum!"
 TurkeyFocusEvents.191.t: "A Síria dá permissão para uma zona tampão"
 TurkeyFocusEvents.191.d: "The Syrian government has caved into the pressure, and has allowed us to create a buffer zone between our nations' borders."
 TurkeyFocusEvents.191.a: "Ótimo."
 TurkeyFocusEvents.192.t: "A Síria não dá permissão para uma zona tampão"
 TurkeyFocusEvents.192.d: "O governo sírio rejeitou nosso pedido para estabelecer uma zona tampão entre nossos estados."
 TurkeyFocusEvents.192.a: "Bem, então .."
 TurkeyFocusEvents.20.t: "O que devemos fazer com os refugiados?"
 TurkeyFocusEvents.20.d: "Nosso país atualmente abriga a maior quantidade de refugiados e, se quisermos, podemos usá-los como peões políticos. Nosso vizinho a oeste, a Grécia, parece... não cooperar.. e nós talvez possamos utilizar alguns desses refugiados para fazê-los ceder às nossas exigências."
 TurkeyFocusEvents.20.a: "Não, isso prejudicará nossa reputação"
 TurkeyFocusEvents.20.b: "Envie apenas um pouquinho"
 TurkeyFocusEvents.20.c: "Envie muitos deles"
 TurkeyFocusEvents.21.t: "Potencial solução para a disputa de Karabakh?"
 TurkeyFocusEvents.21.d: "O governo turco veio até nós e nos deu um potencial acordo de compromisso que podemos fazer com os armênios. Podemos dar aos armênios nosso enclave de Nakhchivan em troca do controle sobre a região de Karabakh."
 TurkeyFocusEvents.21.a: "Claro, vamos ver o que os armênios pensam"
 TurkeyFocusEvents.21.b: "De jeito nenhum"
 TurkeyFocusEvents.212.t: "O Azerbaijão propõe uma solução para a disputa de Karabakh"
 TurkeyFocusEvents.212.d: "[TUR.GetName] se reuniu com [AZE.GetName] há alguns dias e propôs uma possível solução para a disputa de Karabakh entre nós e os azeris. Nesta oferta, renunciaremos às nossas reivindicações sobre Karabakh e entregá-la aos azerbaijanos, em troca de Nakhchivan se unir mais uma vez à Armênia."
 TurkeyFocusEvents.212.a: "Não vemos por que não"
 TurkeyFocusEvents.212.b: "De jeito nenhum!"
 TurkeyFocusEvents.213.t: "Disputa de Karabakh resolvida!"
 TurkeyFocusEvents.213.d: "Grandes notícias chegaram da embaixada armênia, pois os diplomatas nos informaram que concordaram com os termos estabelecidos em nosso acordo em relação à região de Karabakh!"
 TurkeyFocusEvents.213.a: "Maravilhoso"
 TurkeyFocusEvents.214.t: "A disputa de Karabakh continua.."
 TurkeyFocusEvents.214.d: "Unfortunately it seems the Karabakh dispute will continue to harm Azeri and Armenian relations, as both sides have failed to come to an agreement."
 TurkeyFocusEvents.214.a: "Muito lamentável.."
 TurkeyFocusEvents.69420.t: "Através dos problemas"
 TurkeyFocusEvents.69420.d: "Our nation has seen it all, wars, conquest, humiliation, glory, and everything in between. The Dawn of the new Millennium is upon us, and the Turkish nation cannot afford to falter, we must adapt and adjust to the new times, otherwise our state may be swept by the winds of history. Our next presidential election is coming up shortly, and the victor will decide if we hold on to Ataturk's dream for a great Turkish Republic."
 TurkeyFocusEvents.69420.a: "Não podemos tropeçar!"
 TurkeyFocusEvents.22.t: "Rally Pró-AKP em Istambul!"
 TurkeyFocusEvents.22.d: "Hoje houve um comício pró-AKP realizado em Istambul mostrando apoio ao partido. Os indivíduos neste protesto também pediram que o AKP se separasse de sua coalizão com o Hizmet."
 TurkeyFocusEvents.22.a: "Os apoiadores do AKP não estão muito felizes.."
 TurkeyFocusEvents.23.t: "Gülenist supporters gather at a mosque!"
 TurkeyFocusEvents.23.d: "Gülenist supporters held a gathering at one of the mosques and were calling for the party to distance itself from its coalition with the AKP party."
 TurkeyFocusEvents.23.a: "Gülenistas não estão felizes.."
 TurkeyFocusEvents.24.t: "Aliança com o FP?"
 TurkeyFocusEvents.24.d: "O partido FP foi banido antes de nossa ascensão à política, e parece que seus membros não foram a lugar nenhum. A maioria deles seguiu em frente e começou a se juntar ao \"SP\", outro grupo islâmico linha-dura. Talvez possamos convidar alguns de seus membros para virem e se juntarem a nós no governo da nação turca."
 TurkeyFocusEvents.24.a: "Não é uma má ideia.."
 TurkeyFocusEvents.24.b: "Acho que não"
 TurkeyFocusEvents.25.t: "Com quem fazemos negócios?"
 TurkeyFocusEvents.25.d: "É do nosso interesse que nos abramos para potenciais investimentos na Turquia. Podemos solicitar que empresas iranianas ou sauditas venham e se estabeleçam em nossas províncias orientais para fins de mineração e perfuração."
 TurkeyFocusEvents.25.a: "Convide empresas de perfuração sauditas"
 TurkeyFocusEvents.25.b: "Convide empresas de mineração iranianas"
 TurkeyFocusEvents.26.t: "Nosso apoio ao Kosovo"
 TurkeyFocusEvents.26.d: "Teremos de prosseguir com novas acções contra o governo que actualmente ocupa o Kosovo. É nosso dever, como nação que procura a liberdade, espalhar as nossas crenças a outros, e por esta razão teremos de sancionar as suas ocupantes, ou enviar uma missão militar ao Kosovo."
 TurkeyFocusEvents.26.a: "Enviar uma missão militar ao Kosovo"
 TurkeyFocusEvents.26.b: "Sanções, Sanções e mais Sanções!"
 TurkeyFocusEvents.27.t: "Ações contra a Arábia Saudita"
 TurkeyFocusEvents.27.d: "The Saudi government had designated us as a terrorist organization before our rise to power due to pressure from the AKP party. We cannot let such an action go un-noticed. We will organize a proper response to really show them who's in charge."
 TurkeyFocusEvents.27.a: "Financiar os trabalhadores do petróleo, para que possam fazer greve"
 TurkeyFocusEvents.27.b: "Financiar grupos pró-democracia, para a instabilidade política"
 TurkeyFocusEvents.28.t: "A Turquia quer que mandemos de volta membros do PKK"
 TurkeyFocusEvents.28.d: "The Turkish government has asked us to send back members of the Kurdish PKK party, who are currently seeking refuge in Sweden. If we want to improve relations with the Turks we can send them.. but things will start looking ugly for us when the EU condemns us."
 TurkeyFocusEvents.28.a: "Mande-os de volta"
 TurkeyFocusEvents.28.b: "É melhor não fazermos"
 TurkeyFocusEvents.29.t: "O governo sueco concorda em enviar de volta membros do PKK!"
 TurkeyFocusEvents.29.d: "O governo sueco concordou em deportar os membros do PKK que actualmente procuram refúgio no seu estado, para que possamos nós próprios lidar com eles."
 TurkeyFocusEvents.29.a: "Ótimo."
 TurkeyFocusEvents.30.t: "O governo sueco se recusa a enviar de volta membros do PKK!"
 TurkeyFocusEvents.30.d: "The Swedish Government has refused to send back the PKK members they are currently harboring. This will not go un-noticed by us."
 TurkeyFocusEvents.30.a: "Eles vão se arrepender disso!"
 TurkeyFocusEvents.31.t: "Acenda as chamas no Irã"
 TurkeyFocusEvents.31.d: "Today we have at our disposal.. A lot of guns. And we can send a couple of these weapons to the Rebels in Khuzestan, so we can cripple Iran's oil industry. But the question is, how much support do we really want to give these guys, and how much damage can we make them do? "
 TurkeyFocusEvents.31.a: "Não muito"
 TurkeyFocusEvents.31.b: "Faça tudo"
 TurkeyFocusEvents.32.t: "A Turquia quer estabelecer relações"
 TurkeyFocusEvents.32.d: "The Turkish government is willing to establish relations, and is asking us not to be hostile towards the PKK group, which is quite the request."
 TurkeyFocusEvents.32.a: "Claro.."
 TurkeyFocusEvents.32.b: "Não, isso é muito arriscado!"
 TurkeyFocusEvents.321.t: "Peshmerga mantém hostilidade"
 TurkeyFocusEvents.321.d: "The Peshmerga would rather maintain their hostility towards us, rather than fix them! We will not forget this, and they will regret it soon."
 TurkeyFocusEvents.321.a: "Tolos!"
 TurkeyFocusEvents.322.t: "Peshmerga coopera!"
 TurkeyFocusEvents.322.d: "Surpreendentemente, os Peshmerga decidiram cooperar conosco e estabeleceram laços um tanto formais, embora sejam uma região autônoma."
 TurkeyFocusEvents.322.a: "Muito bom"
 TurkeyFocusEvents.33.t: "O Peshmerga.."
 TurkeyFocusEvents.33.d: "Os Peshmerga são outro grupo de curdos, situado logo abaixo do Curdistão da Anatólia. Eles representam uma ameaça tão grande quanto o PKK, mas essa é a menor das nossas preocupações agora, pois estamos trabalhando com o PKK para encontrar uma solução. Os Peshmerga serão uma ameaça enorme para nós, e teremos que lidar com eles antes que seja tarde demais."
 TurkeyFocusEvents.33.a: "Faremos uma operação"
 TurkeyFocusEvents.33.b: "We'll do an operation, with the Iraqis"
 TurkeyFocusEvents.331.t: "Turkey offers joint operation against Peshmerga"
 TurkeyFocusEvents.331.d: "O governo turco está solicitando que nos juntemos a eles em uma operação para lidar com os Peshmerga no norte do nosso país."
 TurkeyFocusEvents.331.a: "Absolutamente!"
 TurkeyFocusEvents.331.b: "Absolutely not!"
 TurkeyFocusEvents.332.t: "Iraque se recusa a aderir à nossa operação"
 TurkeyFocusEvents.332.d: "O Iraque não está disposto a nos ajudar a combater os Peshmerga, o que significa apenas que temos que fazer tudo sozinhos"
 TurkeyFocusEvents.332.a: "Ah, bem.."
 TurkeyFocusEvents.34.t: "A Era Digital da Turquia"
 TurkeyFocusEvents.34.d: "A rede mundial de computadores tem se expandido cada vez mais, dia após dia. Isso significa que devemos acompanhar essa expansão, à medida que o mundo se torna cada vez mais conectado. Nossos cidadãos não são diferentes disso. de outros países europeus, e temos de provar isso ao nosso povo, expandindo a sua infra-estrutura de Internet. A questão é: em quanto?"
 TurkeyFocusEvents.34.a: "Expandir em apenas algumas áreas"
 TurkeyFocusEvents.34.b: "Expanda o máximo possível"
 TurkeyFocusEvents.35.t: "A Turquia nos convida para a União Turco-Síria"
 TurkeyFocusEvents.35.d: "O novo governo turco, liderado por uma maioria xiita, veio e nos pediu para nos juntarmos a eles em uma União Turco-Síria, já que nossas populações compartilham muitas semelhanças. Nos últimos tempos, eles decidiram retornar Hatay para nós, o que foi uma grande jogada, mas agora eles querem nos tornar parte deles?"
 TurkeyFocusEvents.35.a: "Sim, vamos participar"
 TurkeyFocusEvents.35.b: "Não"
 TurkeyFocusEvents.351.t: "Os sírios concordam em se juntar a nós"
 TurkeyFocusEvents.351.d: "O governo sírio percebeu as semelhanças entre nossos povos e concordou em se juntar a nós na União Turco-Síria!"
 TurkeyFocusEvents.351.a: "Finalmente.."
 TurkeyFocusEvents.352.t: "A Síria rejeita nossa proposta!"
 TurkeyFocusEvents.352.d: "The Syrian government has foolishly rejected our proposal to join a union together. They clearly do not know what is good for Shias in the region!"
 TurkeyFocusEvents.352.a: "Droga! Para a guerra!"
 TurkeyFocusEvents.36.t: "As máfias galesas e escocesas formam seus próprios estados!"
 TurkeyFocusEvents.36.d: "It appears the Anatolian Syndicate has funded and trained the Scottish and Welsh mafias just right under our nose. We failed to catch on and stop them in a timely manner, and therefore we are now going to have to make a decision."
 TurkeyFocusEvents.36.a: "Nosso Reino é UNIDO!"
 TurkeyFocusEvents.36.b: "Não vale a pena"
 TurkeyFocusEvents.37.t: "O Sindicato da Anatólia nos alerta sobre a Austrália"
 TurkeyFocusEvents.37.d: "The Anatolian Syndicate are warning us about an incoming attack from the Australians. Obviously this could all be a lie, considering that they are a Mafia state. But there is also a chance they aren't lying."
 TurkeyFocusEvents.37.a: "Eles não podem estar mentindo!"
 TurkeyFocusEvents.37.b: "Não.. Eles estão obviamente mentindo"
 TurkeyFocusEvents.38.t: "A Turquia quer que ajudemos a combater Israel"
 TurkeyFocusEvents.38.d: "Turkey is requesting that our forces, along with our allies, help take down the Israelis. This is a very surprising move, but not unexpected after Islamists took over Turkey in the latest election."
 TurkeyFocusEvents.38.a: "Um dia que esperávamos.."
 TurkeyFocusEvents.38.b: "O momento não é certo"
 TurkeyFocusEvents.39.t: "Irã concorda"
 TurkeyFocusEvents.39.d: "O Irã concordou em ajudar nossas forças a combater Israel. Eles também convocarão seus aliados, o que será de grande ajuda para nossas forças."
 TurkeyFocusEvents.39.a: "Ótimo."
 TurkeyFocusEvents.40.t: "Irã rejeita"
 TurkeyFocusEvents.40.d: "Em uma reviravolta chocante, o Irã decidiu não nos ajudar a combater Israel. Isso deixou nossos diplomatas muito confusos, já que o Irã vem pedindo a queda dos israelenses há décadas..."
 TurkeyFocusEvents.40.a: "Ok"
 TurkeyFocusEvents.381.t: "O Irã está lutando contra Israel"
 TurkeyFocusEvents.381.d: "Iran is fighting Israel, and they want to use our land to attack, and since they are our ally, it is best that we cooperate to take down the Israeli menace."
 TurkeyFocusEvents.381.a: "Estávamos esperando por isso.."
 TurkeyFocusEvents.381.b: "Não"
 TurkeyFocusEvents.81.t: "A Turquia nos convida para o MTO"
 TurkeyFocusEvents.81.desc: "MTO, ou também conhecida como Organização do Tratado do Mediterrâneo, foi fundada recentemente pela Turquia. Eles estão nos convidando para aderir à sua aliança e nos tornarmos membros de pleno direito. Se o fizermos, nossa segurança será garantida por todos os outros membros, pois é um pacto defensivo."
 TurkeyFocusEvents.81.a: "Sim, mas somente se eles retornarem Hatay"
 TurkeyFocusEvents.81.b: "Não"
 TurkeyFocusEvents.41.t: "A Turquia nos convida para o MTO"
 TurkeyFocusEvents.41.d: "MTO, ou também conhecida como Organização do Tratado do Mediterrâneo, foi fundada recentemente pela Turquia. Eles estão nos convidando para aderir à sua aliança e nos tornarmos membros de pleno direito. Se o fizermos, nossa segurança será garantida por todos os outros membros, pois é um pacto defensivo."
 TurkeyFocusEvents.41.a: "Devíamos aderir"
 TurkeyFocusEvents.41.b: "Não"
 TurkeyFocusEvents.411.t: "O Iraque não está interessado"
 TurkeyFocusEvents.411.d: "Parece que o Iraque não está interessado em aderir à MTO, nossa aliança."
 TurkeyFocusEvents.411.a: "Ok"
 TurkeyFocusEvents.42.t: "A Turquia nos convida para o MTO"
 TurkeyFocusEvents.42.d: "MTO, ou também conhecida como Organização do Tratado do Mediterrâneo, foi fundada recentemente pela Turquia. Eles estão nos convidando para aderir à sua aliança e nos tornarmos membros de pleno direito. Se o fizermos, nossa segurança será garantida por todos os outros membros, pois é um pacto defensivo."
 TurkeyFocusEvents.42.a: "Devíamos aderir"
 TurkeyFocusEvents.42.b: "Não"
 TurkeyFocusEvents.421.t: "O Egito não está interessado"
 TurkeyFocusEvents.421.d: "Egypt has turned down our invitation to the MTO."
 TurkeyFocusEvents.421.a: "Ok"
 TurkeyFocusEvents.43.t: "A Turquia nos convidou para o CIW"
 TurkeyFocusEvents.43.d: "O governo turco fundou recentemente a CIW, que representa a Confederação do Bem-Estar Islâmico. O principal objetivo é aumentar a cooperação entre as nações islâmicas e melhorar o bem-estar dos muçulmanos em toda a região."
 TurkeyFocusEvents.43.a: "Inscreva-me"
 TurkeyFocusEvents.43.b: "Não"
 TurkeyFocusEvents.44.t: "CIW está investindo em nossa infraestrutura!"
 TurkeyFocusEvents.44.d: "The CIW is investing in our nation's abilities to build proper infrastructure and facilities for our people."
 TurkeyFocusEvents.44.a: "Ótimo"
 TurkeyFocusEvents.45.t: "CIW distribui suprimentos de emergência!"
 TurkeyFocusEvents.45.d: "O CIW distribuiu suprimentos de emergência para quaisquer desastres ocorridos ou em andamento dentro da organização."
 TurkeyFocusEvents.45.a: "Ótimo"
 TurkeyFocusEvents.46.t: "CIW está investindo em nossa educação!"
 TurkeyFocusEvents.46.d: "The CIW has invested in our nation's education sector, making it easier for people to go to school."
 TurkeyFocusEvents.46.a: "Ótimo"
 TurkeyFocusEvents.47.t: "CIW está investindo em nossa saúde!"
 TurkeyFocusEvents.47.d: "The CIW is now investing in our nation's healthcare system, providing medical supplies and facilities to more people."
 TurkeyFocusEvents.47.a: "Ótimo"
 TurkeyFocusEvents.48.t: "CIW está investindo em nossas indústrias!"
 TurkeyFocusEvents.48.d: "The CIW is now investing in our nation's industrial sector, which lets our factories provide more goods."
 TurkeyFocusEvents.48.a: "Ótimo"
 TurkeyFocusEvents.49.t: "[FROM.GetName] está saindo do CIW"
 TurkeyFocusEvents.49.d: "[FROM.GetName] decidiu que é melhor para sua nação se retirar do CIW."
 TurkeyFocusEvents.49.a: "Oh, bem, eles vão perder"
 TurkeyFocusEvents.50.t: "A Turquia quer estabelecer bases militares"
 TurkeyFocusEvents.50.d: "O governo turco está solicitando que lhes permitamos estacionar suas tropas em nossa nação."
 TurkeyFocusEvents.50.a: "Por que não"
 TurkeyFocusEvents.50.b: "Não"
 TurkeyFocusEvents.501.t: "Qatar rejeita nosso pedido"
 TurkeyFocusEvents.501.d: "O Catar não está permitindo que nossas tropas fiquem estacionadas em seu território."
 TurkeyFocusEvents.501.a: "Infeliz"
 TurkeyFocusEvents.53.t: "Osman V passa"
 TurkeyFocusEvents.53.d: "Notícias terríveis se espalharam por Konstantiniyye hoje, quando o povo soube do falecimento de Osman V. Embora sua morte traga grande tristeza ao povo, Beyezid III certamente continuará seu legado."
 TurkeyFocusEvents.53.a: "O trono muda"
 TurkeyFocusEvents.54.t: "Beyezid III passa"
 TurkeyFocusEvents.54.d: "Infelizmente, hoje soubemos do falecimento de Beyezid III. As pessoas estão de luto por sua morte nas ruas e a tristeza varreu a nação. No entanto, nem toda esperança está perdida, pois Dundar I será coroado logo depois o período de luto nacional acabou, marcando o início do seu governo."
 TurkeyFocusEvents.54.a: "O trono muda mais uma vez.."
 TurkeyFocusEvents.55.t: "Califado da Anatólia exige Hejaz"
 TurkeyFocusEvents.55.d: "The Anatolian Caliphate has come and demanded that we give them Hejaz, arguably our most important state. It would be incredibly foolish of us to give this state away, and quite frankly, we don't even know what they will do if we don't."
 TurkeyFocusEvents.55.a: "Que tipo de solicitação é essa?"
 TurkeyFocusEvents.55.b: "Bem... Queremos evitar conflitos, certo?"
 TurkeyFocusEvents.56.t: "[SAU.GetName] desiste"
 TurkeyFocusEvents.56.d: "[SAU.GetName] has given in to our demands. We will be receiving Hejaz, and in return, we will not be attacking them."
 TurkeyFocusEvents.56.a: "Ótimo."
 TurkeyFocusEvents.57.t: "[SAU.GetName] recusa nossas exigências!"
 TurkeyFocusEvents.57.d: "[SAU.GetName] recusou tolamente nossas demandas e, por causa disso, não nos resta outra escolha!"
 TurkeyFocusEvents.57.a: "Eles pediram"
 TurkeyFocusEvents.58.t: "Lidando com Abdul Rahman Mustafa"
 TurkeyFocusEvents.58.d: "Iraq is currently at its most vulnerable, as the Americans are actively engaged in a conflict with them, crippling their security. This gives us a great opportunity to move in, and take out the governor of Kirkuk, a major city in Iraqi-Kurdistan. If we are successful, we will be able to seriously damage Kurdish morale, and subsequently the PKK's morale."
 TurkeyFocusEvents.58.a: "Envie alguns agentes disfarçados de civis"
 TurkeyFocusEvents.58.b: "Envie agentes bem treinados e elabore um plano de fuga"
 TurkeyFocusEvents.58.c: "Let's just forget about this plan entirely."
 TurkeyFocusEvents.59.t: "Abdul Mustafa morto"
 TurkeyFocusEvents.59.d: "Nossos agentes conseguiram assassinar com sucesso Abdul Rahman Mustafa, o governador de Kirkuk."
 TurkeyFocusEvents.59.a: "Ótimo."
 TurkeyFocusEvents.60.t: "Os americanos capturam nossos agentes!"
 TurkeyFocusEvents.60.d: "Earlier today, soldiers from America's 173rd Airborne Brigade kicked down the doors of our agents' safehouse in the Kurdish city of Sulaymaniyah, and took them into custody. This has been dubbed as the \"Hood Event\" by the media, and our relations with the Americans have been negatively affected."
 TurkeyFocusEvents.60.a: "Maldição"
 Turkish_mafia.1.t: "A máfia causa uma cena!"
 Turkish_mafia.1.d: "The Mafia has caused a scene in one of our bigger cities, which resulted in the death of a few individuals. Though it is currently unknown who committed this crime, our police force is very eager to go and hunt them down, despite the risks involved."
 Turkish_mafia.1.a: "É melhor não causarmos mais problemas.."
 Turkish_mafia.1.b: "Quero uma investigação completa agora!"
 Turkish_mafia.1.c: "Aloque todos os recursos que puder"
 Turkish_mafia.11.t: "Pesquisa policial malsucedida"
 Turkish_mafia.11.d: "Our police force was unsuccessful in their search for the mobsters responsible for the crime committed a few days ago. This has made a few mobsters believe they are un-touchable, therefore increasing the Mafia's influence in the country."
 Turkish_mafia.11.a: "Quanta incompetência..."
 Turkish_mafia.12.t: "Polícia prende suspeitos"
 Turkish_mafia.12.d: "The locals let out a sigh of relief today, as the police chief has recently announced the apprehension of several criminals and suspects, regarding a series of murders committed a few days ago. Several individuals affiliated with the Mafias are now aware of the effectiveness in our police force, and it'll make others think twice before joining the Mafia."
 Turkish_mafia.12.a: "Muito bom"
 Turkish_mafia.2.t: "Detetives descobrem um esconderijo da Máfia"
 Turkish_mafia.2.d: "Um detetive de uma das cidades rurais relatou que encontrou um potencial esconderijo da Máfia. A força policial está rapidamente tentando encontrar uma resposta, pois não sabe o que estará naquele esconderijo, ou se é mesmo um esconderijo da Máfia. É muito provável que a Máfia esteja ligada ao local, mas mesmo assim sempre terá riscos envolvidos."
 Turkish_mafia.2.a: "É melhor deixar algumas coisas em paz.."
 Turkish_mafia.2.b: "What do you mean they're scrambling a response? Prepare one, and do it quickly!"
 Turkish_mafia.2.c: "Aloque todos os recursos que puder"
 Turkish_mafia.21.t: "Polícia sofre baixas!"
 Turkish_mafia.21.d: "It appears that the hideout was an ambush, and there were several gunmen ready to start shooting at our officers. Unfortunately, due to a lack of weapons and sufficient backup, several officers were killed and many more were injured."
 Turkish_mafia.21.a: "Maldição"
 Turkish_mafia.22.t: "Esconderijo limpo com segurança"
 Turkish_mafia.22.d: "Tudo correu perfeitamente na nossa última operação. O esconderijo foi rapidamente esvaziado pelas nossas unidades e vários suspeitos que foram apanhados de surpresa foram rapidamente detidos pelos nossos oficiais."
 Turkish_mafia.22.a: "Ótimo"
 Turkish_mafia.3.t: "Grande esconderijo de armas descoberto"
 Turkish_mafia.3.d: "Durante uma busca em andamento, a polícia encontrou um grande esconderijo de armas armazenado em um armazém. Várias pessoas na comunidade estão instando a polícia a rastrear a origem desse esconderijo de armas e prender as pessoas envolvidas. "
 Turkish_mafia.3.a: "Que tal pegarmos as armas?"
 Turkish_mafia.3.b: "Good idea, start a search immediately!"
 Turkish_mafia.3.c: "Aloque todos os recursos que puder"
 Turkish_mafia.31.t: "A polícia atrapalha a investigação!"
 Turkish_mafia.31.d: "Due to the lack of coordination, and high levels of incompetence, our police force did not find the criminals that had left their weapons cache. In fact, during the investigation our police force lost a considerable amount of their own weapons! How could this happen you may ask? Well, it appeared that our officers had gone in with a supply van filled with weapons, and someone hijacked the van and drove off!"
 Turkish_mafia.31.a: "Sério?"
 Turkish_mafia.32.t: "Polícia localiza suspeitos"
 Turkish_mafia.32.d: "It appeared that there was an underground weapon trade happening in one of the more urbanized cities. Luckily, we were able to catch these criminals before any major damage was done."
 Turkish_mafia.32.a: "Este é o padrão"
 Turkish_mafia.4.t: "Polícia apreende carga de drogas"
 Turkish_mafia.4.d: "Um grupo de policiais tropeçou em um contêiner de carga suspeito e, assim que o abriram, ficaram surpresos. Grandes quantidades de drogas ilegais foram contrabandeadas para o país através de uma rede desconhecida, e os moradores locais estão ansiosos para capturar os suspeitos."
 Turkish_mafia.4.a: "Bem... devem ter sido para uso médico, certo?"
 Turkish_mafia.4.b: "I want an investigation immediately!"
 Turkish_mafia.4.c: "Aloque todos os recursos que puder"
 Turkish_mafia.41.t: "Suspeitos detidos"
 Turkish_mafia.41.d: "Encontramos vários indivíduos ligados ao grande contentor de drogas e estão agora a ser interrogados pela polícia. Muitos na comunidade estão felizes por saber que as drogas ilegais não irão atormentar a sua comunidade."
 Turkish_mafia.41.a: "Ainda temos muito que fazer! Volte ao trabalho!"
 Turkish_mafia.42.t: "Investigation results in nothing"
 Turkish_mafia.42.d: "After a lengthy investigation, our officers were not able to connect anyone to the drug container. This is a major loss on our end, as now illegal drugs are still being smuggled into the country, and we have no leads!"
 Turkish_mafia.42.a: "Inacreditável"
 Turkish_mafia.5.t: "Máfia assassina alto funcionário"
 Turkish_mafia.5.d: "Tragedy has struck, as the Turkish mafia has assassinated a high ranking official. This will make our party's job much harder than it has to, and our opposition are most likely overcome with excitement."
 Turkish_mafia.5.a: "Maldição"
 Turkish_mafia.6.t: "Assalto à máfia"
 Turkish_mafia.6.d: "A Máfia realizou um assalto a um dos bancos do nosso país. Eles roubaram muito dinheiro e, no final, prejudicaram a nossa economia e o nosso povo."
 Turkish_mafia.6.a: "Inacreditável"
 Turkish_mafia.7.t: "Explosão abala um centro comercial"
 Turkish_mafia.7.d: "Fingers are being pointed at the Mafia today, as the police suspect they were behind a bombing attack at a large commercial center. Their goal is unknown, but one thing is for certain, they are causing a lot of problems for the government."
 Turkish_mafia.7.a: "Mas por quê?"
 Turkish_mafia.8.t: "A polícia se envolve em um impasse com a máfia"
 Turkish_mafia.8.d: "Esta manhã, houve um longo impasse entre a nossa polícia e a Máfia. Vários policiais ficaram feridos e alguns até foram mortos."
 Turkish_mafia.8.a: "Terrível!"
 Turkish_mafia.9.t: "A ascensão da máfia"
 Turkish_mafia.9.d: "The Mafia has been ramping up its attacks in recent times, and it has quite frankly stressed out our security forces. With people joining the Mafia, and a life of crime now more than ever, it makes you question the validity of our state. A lot of people are demanding that our government step down, but we have a duty to serve and protect our people."
 Turkish_mafia.9.a: "A luta nunca vai parar!"
 Turkish_mafia.9.b: "Talvez eles estejam certos.."
 Turkish_parties.1.t: "Partidos liberais ganham força"
 Turkish_parties.1.d: "It appears that our people's ideology is becoming more and more liberal, as the liberal parties have begun gaining some more following than before. As a result of this, people are pushing for more liberal policies in our country."
 Turkish_parties.1.a: "Ok"
 Turkish_parties.2.t: "Partidos conservadores ganham força"
 Turkish_parties.2.d: "It appears that our people's ideology is becoming more and more conservative, as the conservative parties have begun gaining some more following than before. As a result of this, people are pushing for more conservative policies in our country."
 Turkish_parties.2.a: "Ok"
 Turkish_parties.3.t: "Partidos de esquerda ganham força"
 Turkish_parties.3.d: "It appears that our people's ideology is becoming more and more leftist, as the left-wing parties have begun gaining some more following than before. As a result of this, people are pushing for more socialist policies in our country."
 Turkish_parties.3.a: "Ok"
 Turkish_parties.4.t: "Partidos de direita ganham força"
 Turkish_parties.4.d: "It appears that our people's ideology is becoming more and more nationalist, as the right-wing parties have begun gaining some more following than before. As a result of this, people are pushing for more nationalist policies in our country."
 Turkish_parties.4.a: "Ok"
 Turkish_parties.9.t: "Mudança radical na política"
 Turkish_parties.9.d: "There has been a drastic, and radical shift in our nation's government, leading to a complete reorganization of our political structure."
 Turkish_parties.9.a: "Ok"
 Turkish_parties.10.t: "Somente a IA deveria ver isso"
 Turkish_parties.10.d: "Apenas IA"
 Turkish_parties.10.a: "Se você ver isso, por favor nos avise"
 TUR_bulent_ecevit_desc: "Bülent Ecevit is a senior politician who has been active in the Turkish political scene since the 1950s. Rising to a leadership in the CHP, he eventually succeeded Ismet Inönü as CHP chairman in 1972 and became Prime Minister in 1974. His government ordered the invasion of Cyprus in 1974, where he gained the nickname 'Conqueror of Cyprus' ('Kıbrıs Fatihi'). Following the military coup of 1980, Ecevit was incarcerated and banned from politics, eventually rejoining the scene in 1987 by taking the chairman position of DSP from his wife Rahsan. Finally in 1999, he regained the position of Prime Minister of Turkey, after his party's popularity soared with the capture of PKK leader Abdullah Öcalan.\n\nEcevit is also an adamant poet and writer, having written many books on both subjects, and translating many poems into Turkish.\n\nEcevit never finished his university degree, making it impossible for him to ever run for President."
 TUR_zeki_sezer_desc: "Zeki Sezer foi ex-ministro de estado do governo de Ecevit."
 TUR_husamettin_ozkan_desc: "Hüsamettin Özkan foi vice-primeiro-ministro no governo de Bülent Ecevit, ele também atuou como Ministro de Estado antes disso. Özkan é descendente de circassianos e seu irmão Necdet serviu como prefeito em um dos distritos de Istambul."
 TUR_fethullah_gulen_desc: "Fethullah Gülen é o líder do Hizmet, ou movimento Gülenista. Outrora um imã local na Turquia, Gülen tornou-se um estudioso influente. Sua organização abrange todo o mundo e funciona de maneira muito descentralizada. O próprio Gülen não se considera um líder e, de acordo com as suas próprias palavras, apenas “falou sobre aquilo em que acredito”. Porque fazia sentido, as próprias pessoas compreenderam”."
 TUR_deniz_baykal_desc: "Deniz Baykal started his political career in 1973, when he was elected to the Turkish Parliament as the youngest MP under the party CHP. The CHP originally noticed him as Baykal wrote his docent thesis on the subject of why the CHP had lost the 1965 election. After the 1980 military coup, Baykal was shortly imprisoned and banned from politics, but in 1987 he was allowed to re-enter, and he joined the Social Democratic People's Party.\n\nIn 1992, the law prohibiting the refounding of previously dismembered parties was overturned and Baykal (along with many other ex-CHP politicians), refounded the CHP.\n\nOften described as being the 'Old Guard' of CHP, many have blamed Baykal for the lack of success of CHP, as many of his policies do not match contemporary Turkey."
 TUR_Kemal_Kilicdaroglu_desc: "Kemal Kılıçdaroğlu was elected as the leader of CHP after a scandal forced Deniz Baykal to resign his position. Kılıçdaroğlu has actively challenged the AKP, and has actively vowed to reveal the corruption of the party's politicians. Kılıçdaroğlu has also aimed to move CHP back to its leftist oriented roots. However, Kılıçdaroğlu's actions do not always match his words, as he has been seen waving a Grey Wolves flag and he supports the deportation of all Syrian refugees."
 TUR_Ufuk_Uras_desc: "Ufuk Uras is an economist and a graduate of the Istanbul University. Uras has been the chairman of ÖDP since 1996."
 TUR_abdullah_levent_tuzel_desc: "Abdullah Tüzel foi um dos membros fundadores do EMEP em 1996 e lidera o partido desde então. Antes da política, Tüzel trabalhava como advogado freelancer. Ele também foi membro do conselho executivo do Human Rights Foundation de Istambul e presidente da Associação de Advogados Modernos de Istambul."
 TUR_dogu_perincek_desc: "Doğu Perinçek é o fundador do Partido dos Trabalhadores IP e é advogado de profissão. Perinçek é conhecido por suas atitudes antiocidentais e suas ideias kemalistas de linha dura combinadas com o maoísmo. Ele também nega veementemente a existência do genocídio armênio, e ele é membro do Comitê Talat Pasha, uma organização que leva o nome do suposto principal autor do genocídio.\n\nPerinçek quer criar uma força contrária contra o imperialismo americano no Oriente Médio."
 TUR_Necmeddin_Erbakan_desc: "Necmettin Erbakan is the founder of the Millî Görüş (National Vision) religious-political movement, which creates the foundation of his party. Erbakan is a long time leader of multiple Islamist political parties in Turkey, most of which have been banned shortly after their founding. Erbakan even served shortly as the Prime Minister, before being forced to step down by the military.\n\nErbakan's main policy is conservative Islam, and he wishes to shift focus from focusing on European countries to more cooperation with other Muslim nations, even going as far as creating an organization to rival NATO in the Middle East and a common currency called the dinar.\n\nIn early 2000s, Erbakan spent a little over 2 years in prison after being sentenced for embezzlement. The so called 'Lost Trillion Case' arose when his previous party, the Welfare Party, forged documents claiming that 1 trillion in Turkish lira of state sponsored party funds had been used for party activities in order to avoid having to return the funds after the party was banned in 1997."
 anti_imperialist_vanguard_faction: "Vanguarda Antiimperialista"
 TUR_northern_cyprus_annexed: "Anexação do Norte de Chipre"
 TUR_afrin: "Anunciar operações anticurdas na Síria"
 TUR_afrin_desc: "Kurdish terrorists go by many names, but that does not mean they do not share the same ideals as each other. The PKK has always been a threat to Turkey and it will remain a threat until it along with its allies in the YPG, PYD, SDF, et cetera, are destroyed. It starts with Afrin, gather the troops."
 TUR_afrin2: "Lançar Operação Olive Branch"
 TUR_afrin2_desc: "If the Kurds cannot learn to accept their failure and defeat, they will continue to attack Turkey and its people, and this is where we must draw the line. Olive Branch will put an end to Kurdish terror attacks originating from the YPG held territory of Afrin. The operation is determined to root out and destroy Kurdish terrorists without collateral damage, we must proceed carefully."
 TUR_afrin_d: "Forças Turcas Ameaçam Afrin"
 TUR_afrin_d_desc: "O ataque turco ao povo curdo continua. A ameaça de uma invasão de Afrin é real, já que o presidente turco [their_country.GetLeader], sem surpresa, nos rotulou como terroristas alinhados com o PKK e ameaçou nos estrangular antes que pudéssemos atacar terras turcas em um ataque terrorista ridículo. Este não é o nosso jeito, mas devemos nos preparar para um ataque imediatamente!"
 TUR_afrin_d2: "As forças turcas continuam a avançar"
 TUR_afrin_d2_desc: "They call it \"Operation Olive Branch\", funny how the saying goes that the olive branch is an offer of peace. The Turks know not the meaning of peace, and their campaign of Kurdish oppression continues against the wrong opponent. Alas, if they want to continue this fight, we shall continue to defend ourselves."
 TUR_counter_terrorism_mil: "Operações Antiterroristas - Ramo Militar"
 strenghten_outposts_1: "Fortalecer Postos Avançados"
 strenghten_outposts_1_desc: "Our outposts in the south-eastern part of our country were built up to stop smuggling from and to Northern Iraq around 1960s. Now, facing terror attacks, they are either too old or at the wrong positions and highly vulnerable to asymmetrical attacks. We need to come up with a solution to this, it may cost a lot of money but will make it up to us with the lives saved. And opposition will surely try and discredit this reform as they always do, saying it will waste our money for no benefit, so there is little room for failure."
 strenghten_outposts_2: "Iniciando em Postos Avançados Fortes"
 strenghten_outposts_2_desc: "Primeiro, nossos novos postos avançados devem provar sua eficácia em pouco tempo, devido a razões políticas. Talvez construí-los no alto, em pontos negligenciados e de preferência em torno de pontos estreitos que os terroristas têm usado para se infiltrar."
 strenghten_outposts_3: "Posições críticas primeiro"
 strenghten_outposts_3_desc: "Alguns de nossos postos avançados, como Aktütün Karakolu, são famosos por serem invadidos regularmente por motivos estratégicos. Devemos melhorar essas posições fracas primeiro e os terroristas terão que fazer novos planos."
 strenghten_outposts_4: "Melhorias adicionais"
 strenghten_outposts_4_desc: "Novos postos avançados provam ser suficientes para repelir ataques terroristas ou para não serem atacados, agora os terroristas estão evitando os fortes e se concentrando nos antigos e mais fracos. Talvez devêssemos desmantelar os desnecessários e construir novos postos avançados nas posições necessárias"
 strenghten_outposts_5: "Brilho Estratégico"
 strenghten_outposts_5_desc: "Attacks on our outposts have been fairly reduced, maybe we can think about building new dams that will hinder terrorists' routes with their lakes, and use these dams as fortified bridges"
 strenghten_outposts_6: "O sucesso adora preparação"
 strenghten_outposts_6_desc: "Nearly every outpost of ours has either been rebuilt or left and razed. Only some final stages needed to polish up some sharp edges and we are done."
 doing_counter_terror_op_mil: "Conduzindo outra operação militar"
 doing_ext_sec: "Já conduzindo uma operação transfronteiriça"
 doing_int_sec: "Já conduzindo uma varredura de segurança interna"
 airstrike_prepare: "Preparando-se para ataques aéreos"
 airstrike_thingy: "Conduzindo ataques aéreos"
 add_power_to_pkk: "Adicionar energia ao PKK (para depuração)"
 add_power_to_pkk_desc: "Adiciona poder ao PKK"
 internal_preparation_1: "Preparativos normais para operações internas"
 internal_preparation_1_desc: "The fastest and cheapest one. If we pick this, the actual offensive will have a success rate of 40%. In terms of cost efficiency, this one is better.\n\n§RWe can't make several preparations for a single operation type!§!"
 internal_preparation_2: "Preparativos medíocres para operações internas"
 internal_preparation_2_desc: "Normal one. If we pick this, the actual offensive will have a success rate of 50%.\n\n§RWe can't make several preparations for a single operation type!§!"
 internal_preparation_3: "Boas preparações para operações internas"
 internal_preparation_3_desc: "The slowest and most expensive one. If we pick this, the actual offensive will have a success rate of 60%. Not cost-efficient but with more guaranteed results.\n\n§RWe can't make several preparations for a single operation type!§!"
 internal_security: "Operações Internas"
 internal_security_desc: "Eastern part of our country has a rough terrain, it holds many deserted villages, castle-like natural valleys filled with caves, narrow passages around mountains where no one lives. These features are so useful for insurgencies and PKK uses it. We need to constantly attack and raze their makeshift bases to reduce their power and hinder their recruitment efforts.\n\nWe can't make cross-border operations and internal operations at the same time."
 external_preparation_1: "Preparativos normais para operações externas"
 external_preparation_1_desc: "O mais rápido e mais barato. Se escolhermos este, a ofensiva real terá uma taxa de sucesso de %40. Em termos de eficiência de custos, este é melhor.\n\n§RNão podemos fazer vários preparativos para um único tipo de operação!§!"
 external_preparation_2: "Preparativos medíocres para operações externas"
 external_preparation_2_desc: "Normal. Se escolhermos esta, a ofensiva real terá uma taxa de sucesso de %50.\n\n§RNão podemos fazer vários preparativos para um único tipo de operação!§!"
 external_preparation_3: "Boas preparações para operações externas"
 external_preparation_3_desc: "O mais lento e mais caro. Se escolhermos este, a ofensiva real terá uma taxa de sucesso de %60. Não é econômica, mas com resultados mais garantidos.\n\n§RNão podemos fazer vários preparativos para um único tipo de operação!§!"
 external_security: "Operações transfronteiriças"
 external_security_desc: "O PKK não existe apenas dentro das nossas fronteiras, uma boa parte dos seus membros também tem bases no Norte do Iraque, para aproveitar o mesmo terreno acidentado, estar um pouco mais protegido do nosso poderio militar, controlar o contrabando e o recrutamento. Nós precisamos atacar essas posições também, embora possamos enfrentar acusações de potências estrangeiras.\n\nNão podemos fazer operações transfronteiriças e operações internas ao mesmo tempo."
 prepping_ext: "Já planejando uma operação transfronteiriça"
 prepping_int: "Já planejando uma varredura interna"
 collapse_mil_branch: "Ocultar decisões de operações militares"
 expand_mil_branch: "Mostrar decisões de operações militares"
 collapse_civ_branch: "Ocultar decisões de reforma civil"
 expand_civ_branch: "Mostrar decisões de reforma civil"
 TUR_counter_terrorism_civ: "Operações Antiterroristas - Ramo Civil"
 college_professors: "Lidando com professores universitários"
 college_professors_desc: "We have a fight on our hands and these people that are supposed to be enlightened, but they bitch about the situation and want the government to abdicate whenever a terrorist attack happens and call it genocide or xenophobia whenever we try to make a move against PKK. This needs to be stopped. We will either purge them or make sure they won't discredit our actions with baseless claims anymore"
 kurdish_language_1: "Problema de idioma curdo"
 kurdish_language_1_desc: "For years there was an unwritten rule against Kurdish language. Not only opening television channels and universities with Kurdish language is banned, even if you are telling something Kurdish in public or in a street you might get attacked verbally. And nearly 20 percent of our population has Kurdish as their mother language. We need to solve this.\n\nUnlocks the second decision for more reforms."
 kurdish_language_2: "Acabar com a discriminação"
 kurdish_language_2_desc: "Primeiro, punir as pessoas que atacam os falantes de curdo. Ninguém merece ter medo de falar sua própria língua.\n\nDesbloqueia a terceira decisão para mais reformas."
 kurdish_language_4: "Canais de TV curdos"
 kurdish_language_4_desc: "We will allow people to open Kurdish channels, not only this will discredit PKK's propaganda about Kurds being oppressed, it will win hearts of adult people who were born Kurdish and never got the chance to learn Turkish. Although we need to hire people to keep an eye on these channels and prevent them being used for PKK propaganda.\n\nUnlocks the fifth decision for more reforms."
 doing_counter_terror_op_civ: "Conduzindo outra reforma civil"
 investment_propaganda_1: "Projetos de Infraestrutura"
 investment_propaganda_1_desc: "Our eastern regions are lacking badly needed infrastructure to overcome rough terrain. In terms of equality and keeping people happy, we need to fix this."
 investment_propaganda_2: "Esforço de Desemprego"
 investment_propaganda_2_desc: "Hungry people tend to become criminals. Former governments ignored the eastern regions and didn't care about the problems that caused the Kurds to feel oppressed. We need to do better than the ones before us."
 TUR_military_category: "Forças Armadas Turcas"
 TUR_military_category_desc: "\n£TUR_desctext_TSK \n\n\n\n\nThe Turkish military has intervened in Turkish politics more than once. Whenever they have felt their own or Turkey's existence threatened, they have organised (or tried to organise) a coup. Quite often this has stemmed from the Turkish government drifting away from secularism, and sometimes from economic troubles seemingly caused by the government.\n\nIf your §YStanding§! with the [TUR.Nat_Autocracy_L] falls below §Y0§!, the Armed Forces will take action to depose the government.\n\nOur current §YStanding§!: [?TUR_military_standing_value|0+]\n\n[?TUR_military_standing_party|=0+] from our current §YRuling Party§!\n[?TUR_military_standing_conservatism|=0+] from our §HSocial Conservatism - Government§!\n[?TUR_military_standing_opinion|=0+] from our §YMilitary's§! Current Opinion\n[?TUR_military_standing_corruption|=0+] from our §YCorruption Level§!\n[?TUR_military_standing_economy|=0+] from our §YEconomic Cycle§!\n[?TUR_military_standing_interest_rate|=0+] from our §YInterest Rate§!"
 TUR_hizmet_gulen_struggle: "A luta Hizmet-AKP"
 TUR_hizmet_gulen_struggle_desc: "An active power struggle exists between §W[Western_Autocracy_L]§! and the §W[Neutral_Muslim_Brotherhood_L]§!. The Turkish people are split between who they want, as both sides formed a coalition in order to take power in the last election. Both parties are vying for power in Turkey, and they gain more and more power every time they successfully pass a law or counter one. Eventually things will tip over to one side and the coalition will be dissolved.\n\nCurrently §W[Western_Autocracy_L]§! Control is at §Y[?hizmet_power|%]§!\n\nCurrently §W[Neutral_Muslim_Brotherhood_L]§! Control is at §Y[?akp_power|%]§!"
 TUR_expose_akp_scandal: "Expor escândalos do AKP"
 TUR_expose_akp_scandal_desc: "Vamos expor um escândalo em que §H[Neutral_Muslim_Brotherhood_L]§! esteve envolvido"
 TUR_expose_gulenist_institution: "Shut down Gülenist institutions"
 TUR_expose_gulenist_institution_desc: "Fecharemos uma instituição dirigida por §H[Western_Autocracy_L]§!"
 TUR_random_rally_akp_gulen: "Comício político chegando!"
 TUR_disaster_income: "Desastre Econômico"
 TUR_disaster_income_desc: "Diz-se que um desastre económico está a chegar ao país, e está a chegar rapidamente. Precisamos de agir rapidamente em conjunto para impedir a formação de partidos de oposição e para evitar uma crise mais profunda."
 TUR_incoming_collapse: "Desastre iminente"
 TUR_incoming_collapse_desc: "The market will crash, leading to devastating consequences..."
 TUR_ciw_decisions: "CUE"
 TUR_ciw_decisions_desc: "The §HCIW§!, or otherwise known as the §HConfederation of Islamic Wellbeing§! is an organization that intends to improve the wellbeing of islamic peoples around the globe. The CIW leader, §HTurkey§!, will have the ability to §Hinvest in other CIW members§!, and it could be through §Hinfrastructure, networks, industries, or railways§!, etc. §HCIW Members§! can §Ropt out§! of the organization at anytime, but doing so will §Rrevoke§! their ability to re-apply at a later date.\nThe §HCIW leader§! will be able to invest in other countries' education, healthcare, industry, infrastructure and emergency supply infrastructure. Once the leader invests in one of these things, a modifier with the bonuses are added to all the §HCIW members§! at no cost to them. §HCIW Member§! states will be able to §Gask for investments§! which can give them buildings instead of the bonuses given from the §HCIW Leader§!. If a §HCIW Member§! chooses to do one of these decisions, then the §HCIW Leader§! will get a certain amount of money into their §GInternational Investments§!."
 TUR_invest_in_infrastructure: "Investir em infraestrutura CIW"
 TUR_invest_in_infrastructure_desc: "Ao serem capazes de construir infra-estruturas adequadas, as nações CIW fornecerão habitação e instalações adequadas aos seus povos"
 TUR_invest_in_disasters: "Ajuda em Desastres CIW"
 TUR_invest_in_disasters_desc: "O mundo islâmico passa por muitos desastres e, muitas vezes, não consegue reparar os danos causados. Podemos ajudar, fornecendo-lhes suprimentos de emergência"
 TUR_invest_in_education: "Investir na educação CIW"
 TUR_invest_in_education_desc: "Todos precisam de acesso a uma educação adequada e, por essa razão, teremos que investir em instalações educacionais nas nações CIW"
 TUR_invest_in_health: "Investir em CIW Healthcare"
 TUR_invest_in_health_desc: "Os países da CIW precisam de assistência médica para suas grandes populações, pois medicamentos adequados são difíceis de encontrar ou são muito caros."
 TUR_invest_in_industry: "Investir nas Indústrias CIW"
 TUR_invest_in_industry_desc: "By investing in CIW countries' industries, we are able to make the Islamic world industrialize and catch up to the Europeans much quicker"
 TUR_leave_ciw: "Sair do CIW"
 TUR_ask_for_infrastructure: "Solicite investimentos em infraestrutura"
 TUR_ask_for_network: "Solicite investimentos em infraestrutura de rede"
 TUR_ask_for_supply: "Solicite investimentos em transporte"
 TUR_ask_for_radars: "Solicite investimentos em radar"
 TUR_ask_for_airbase: "Solicite investimentos em aeroportos"
 TUR_empower_sultan: "Capacite o §W[Monarchist_L]§!"
 TUR_empower_sultan_desc: "The Sultan is the rightful owner of the Ottoman State, not some grumpy old man. The Sultan will take what is rightfully his, and he will get his supporters to march in and remove the current leader, even if it is done by force!"
 TUR_new_capital_mhp: "Constante de reconstrução"
 TUR_new_capital_mhp_desc: "Ataturk mudou nossa capital de Konstantiniyye para Ancara. Embora suas intenções fossem principalmente manter a capital da Turquia longe de seus inimigos, no final das contas, isso não fará muita coisa. Iremos realocar nossa capital para Konstantiniyye e construí-lo maior do que nunca!"
 TUR_open_mid_east: "§HOabrir seção do Oriente Médio§!"
 TUR_close_mid_east: "§HCFechar Seção Oriente Médio§!"
 TUR_support_in_iraq: "Aumente o apoio em §HIraq§!"
 TUR_support_in_syria: "Aumentar o apoio na §HSíria§!"
 TUR_support_in_kuwait: "Aumente o suporte em §HKuwait§!"
