 nationalist_clique: "민족주의 파벌"
 established_parliament_member_desc: "싱가포르 의회의 오랜 의원으로, 국가 기구와 이를 운영하는 인민행동당에 정통합니다."
 pro_western_clique_desc: "미국 및 더 넓은 서방 블록과의 긴밀한 관계를 선호하며, 싱가포르 정치를 그 방향으로 이끕니다."
 emerging_clique_desc: "체제 내에서 부상하는 파벌의 일원으로, 영향력을 쌓고 국가의 진로를 이끌고자 합니다."
 neutrality_clique_desc: "엄격한 비동맹을 선호하며, 싱가포르가 어느 진영에도 속하지 않고 강대국들 사이에서 균형을 유지하도록 합니다."
 nationalist_clique_desc: "자립적이고 정체성을 우선하는 싱가포르를 옹호하며, 국가를 외국 블록에서 멀어지게 하고 적극적인 민족주의 노선으로 이끕니다."
 emperor_of_the_continent: "대륙의 황제"
 emperor_of_the_seas: "바다의 황제"
 black_gold_crusader: "흑금 정치 투사"
 black_gold_crusader_desc: "대만의 흑금 정치, 즉 매표와 금권 정치에 맞서 싸우며 두각을 나타냈습니다. 그의 반부패 운동은 그를 정치 변화의 얼굴로 만들었습니다."
 establishment_economist: "기득권 경제학자"
 establishment_economist_desc: "시카고 대학에서 교육받은 경제학자이자 국민당 기득권층의 믿음직한 인물입니다. 신중하고 체계적인 그는 대만 경제를 호황기 내내 이끌었습니다."
 grassroots_campaigner: "풀뿌리 선거 운동가"
 grassroots_campaigner_desc: "비할 데 없는 풀뿌리 호소력을 지닌 지칠 줄 모르는 선거 운동가입니다. 그의 카리스마와 서민적인 면모는 그를 당대 가장 인기 있는 정치인으로 만들었습니다."
 emerging_communist_state: "이념: 공산주의"
 SAF_ANC_left_wing_caucus_trait: "ANC 좌파 코커스 소속"
 SAF_ANC_right_wing_caucus_trait: "ANC 우파 의원 모임 소속"