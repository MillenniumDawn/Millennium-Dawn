 GNSS_CIV_STATS_TT: "£GFX_GNSS_satellite_texticon  체계에 연결된 §Y[GNSS_civ_level_gui]§! 위성의 수입니다.\n£GFX_satellite_coverage_texticon  체계의 전 지구적 도달범위입니다.\nSBAS £GFX_satellite_coverage_texticon  SBAS를 통한 추가 도달범위입니다.\n£GFX_satellite_bonus_texticon  체계 보너스입니다."
 GNSS_CIV_STATS_TT_DELAYED: "£GFX_satellite_coverage_texticon  §Y전 지구적 도달범위§!: 이 체계 등급에서 최대 가능한 위성 수 대비 연결된 §Y[GNSS_mil_level_gui]§!의 비율입니다.\n§YSBAS§! - §Y위성 기반 보정 시스템(Satellite Based Augmentation System)§!: 군용이나 민간용 체계에 연결되지 않은 모든 £GFX_GNSS_satellite_texticon  위성은 전 지구적 도달범위에 §G1%§!의 보너스를 추가합니다.\n£GFX_satellite_bonus_texticon  §Y체계 보너스§!: §g전 지구 위성항법시스템(Global Navigation Satellite System)§!이\n§Y건설 속도\n기반시설 건설 속도\n자원 획득 효율§!\n에 제공하는 §G보너스§! 비율입니다. 보너스는 체계의 최대치로 제한됩니다."
