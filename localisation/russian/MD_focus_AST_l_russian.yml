 nrf_ast: "Фонд национального примирения"
 nrf_ast_desc: "Если мы хотим обеспечить существование основы для активного примирения после окончания нашего срока полномочий, нам необходимо создать организационный орган, занимающийся финансированием проектов, которые действительно принесут результаты."
